<span id="ID-6c7121e7-c639-4c55-810f-711264228496"></span><h1 class="title">category Top as connected category</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20230225170221-kategorie_top.html#ID-55f8744f-3e21-4c41-889f-06a52add975b">category Top</a> is a <a href="20231111-connected_category.html#ID-663060d5-07ae-4dfc-b5d3-ed866fa75bdc">connected category</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $X,Y$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>, then:
</p>

<h3 id="xy-neq-emptyset">$X,Y \neq \emptyset$</h3>
<p>
then the <a href="20231105-constant_map_is_continuous.html#ID-aca42c72-a786-450a-b219-8e3bb68d1aa7">constant map is continuous</a>
</p>

<h3 id="xy-emptyset">$X,Y = \emptyset$</h3>
<p>
then the <a href="20220817165031-identitatsmorphismus.html#ID-18d8207c-a2f4-499b-ab59-b7efe4858e31">identity morphism</a> suffices
</p>
