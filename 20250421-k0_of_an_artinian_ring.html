<span id="ID-bbf24955-af1d-43bc-8d3f-982dd3feb6c1"></span><h1 class="title">k0 of an artinian ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
the <a href="20241011-k0_of_a_ring.html#ID-d82bf086-c3d3-444b-abaf-919a7b964832">K0</a> of an <a href="20230724-artinian_ring.html#ID-a0bcecf0-0701-4159-ad21-9fff7aa6057c">artinian ring</a> $R$ is given as <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">free</a> <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>
</p>

<h2 id="proof">Proof</h2>
<p>
using <a href="20230726-artinian_ring_and_finite_product_of_artinian_local_rings.html#ID-b4fb0f9f-20ab-49ea-b0d4-4623fc016af9">Artinian ring and finite product of artinian local rings</a> we get
</p>

<div class="math-block">\begin{align*}
R = \prod_{i=1}^n R_i
\end{align*}</div>
<p>
for $R_i$ artinian and <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local</a>.
</p>
