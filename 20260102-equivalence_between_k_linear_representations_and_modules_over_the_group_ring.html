<span id="ID-e03240b3-919e-46d7-a54a-6ae361ab7b03"></span><h1 class="title">equivalence between k-linear representations and modules over the group ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $K$ a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> (or <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>).
Then there exists an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>

<div class="math-block">\begin{align*}
K[G]-\mathrm{mod} \simeq&amp; \mathrm{Fun}(BG, \mathrm{Vect}_K)
\end{align*}</div>
