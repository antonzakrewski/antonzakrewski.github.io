<span id="ID-61761264-9731-42f7-80ef-72f6247f6ea7"></span><h1 class="title">simply connected anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>
Then $X$ is said to be simply connected, if
</p>
<ol>
<li>it is a <a href="20250310-connected_anima.html#ID-3a5f1513-1e7e-49aa-90e7-a728c310990c">connected anima</a></li>

<li>the <a href="20230302211108-fundamentalgruppe.html#ID-f98b938b-c835-4903-9857-40c781220452">fundamental group</a> $\pi_1(X,x) = 0$ is trivial for one (or equivalently any choice of) basepoint. </li>
</ol>
