<span id="ID-67943c1b-c93d-4dbe-83cd-0d82058abd44"></span><h1 class="title">I-adically complete ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $I$ a two sided <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>
Then $R$ is said to be I-adically complete, if the induced map
</p>

<div class="math-block">\begin{align*}
R \rightarrow \mathrm{lim}_{n \in \mathbb{N}} R/I^n
\end{align*}</div>
<p>
is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
