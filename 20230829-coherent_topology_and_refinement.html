<span id="ID-7103a157-bf0d-48d8-a020-79247dcb62d9"></span><h1 class="title">coherent topology and refinement</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $\mathcal{O} = (O_i)$ a <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">family</a> of <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subsets</a> and $\mathcal{U} = (U_i)$ a <a href="20230406114448-refinement.html#ID-a6603a8e-c953-4650-a2d0-6502a10f9891">refinement</a> of $\mathcal{O}$.
Suppose $X$ is <a href="20230828-coherant_topology.html#ID-740c8dd6-9955-4b26-b18b-8fc325cd16c0">coherent</a> with $\mathcal{U}$, then $X$ is also coherent with $\mathcal{O}$
</p>
