<h2 id="definition">Definition</h2>
<p>
Let $E$ be the class of <a href="20240702-flat_ring_morphism.html#ID-9d6a0006-5aec-4d6f-b8b8-9a8b75e43ba8">flat ring morphism</a>.

</p>
