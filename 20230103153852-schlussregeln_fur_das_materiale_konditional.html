<span id="ID-e322a552-d140-4601-91d2-c5e13c700d37"></span><h1 class="title">Schlussregeln mit dem materialen Konditional</h1>


<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\qed B \models A \prec B \\
\lnot \diamond A \models A \prec B \\
\models A \prec (B \lor \lnot B) \\
\models (A \land \lnot A) \prec B
\end{align*}</div>
