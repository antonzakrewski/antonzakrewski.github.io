<span id="ID-9a8ea75c-dd73-410c-9e6d-aa8d8ac17646"></span><h1 class="title">transitive closure of a relation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20211227225631-relation_mathe.html#ID-20e17f2d-e102-4093-8c48-e5b41db0ffbf">Relation</a> on a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $X$.
Then the transitive closure is defined as relation
</p>

<div class="math-block">\begin{align*}
x \overline{R} y \coloneqq (\exists z_0,...,z_k : x R z_0 \land z_0 R z_1 \land ... z_k R y) \lor (x R y)
\end{align*}</div>
