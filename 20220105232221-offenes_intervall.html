<span id="ID-ff9b0b3b-6225-430d-8b42-196a1257791d"></span><h1 class="title">offenes Intervall</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $a,b \in M$ einer <a href="20221010083632-totalordnung.html#ID-30e940f3-5f30-43e3-acda-3066e8c7e2fd">total geordneten</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>.
Dann ist das offene Intervall definiert als:
</p>

<div class="math-block">\begin{align*}
]a,b[  \coloneqq (a,b)  \coloneqq \{x \in M \vert a &lt; x &lt; b\}
\end{align*}</div>
