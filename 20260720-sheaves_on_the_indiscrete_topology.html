<span id="ID-73a72943-d623-4c35-914a-c596439fb4f2"></span><h1 class="title">sheaves on the indiscrete topology</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any <a href="20241021-infinity_presheaf.html#ID-463d818a-2c01-4c74-a241-fd6db6e244fd">presheaf</a> is a <a href="20260720-sheaf_on_a_grothendieck_topology.html#ID-6aa8bbd3-b259-4c58-b9e6-7c22333ad318">sheaf</a> on the <a href="20260720-indiscrete_topology_on_a_category.html#ID-8b460099-abb5-487f-9182-0ed34a852a34">indiscrete topology</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Observe that the only condition is, that precomposition with an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>  is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
This is clear.
</p>
