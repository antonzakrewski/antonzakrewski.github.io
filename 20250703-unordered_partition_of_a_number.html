<span id="ID-72bacf6c-3645-4bc5-a609-bb6f26dec5b2"></span><h1 class="title">ordered partition of a number</h1>

<h2 id="definition">Definition</h2>
<p>
Let $k,n \in \mathbb{N}$.
Then an ordered partition of $n$ with $k$ many numbers is given by an element
</p>

<div class="math-block">\begin{align*}
(x_1,....,x_k) \in (\mathbb{N}^+)^k
\end{align*}</div>
<p>
with $\sum_{i=1}^k x_i = n$
</p>
