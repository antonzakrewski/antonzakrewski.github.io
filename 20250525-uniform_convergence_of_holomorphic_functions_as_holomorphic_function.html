<span id="ID-90755709-9c3b-4def-9733-c18ad88fe75b"></span><h1 class="title">uniform convergence of holomorphic functions as holomorphic function</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f_n: \Omega \rightarrow \mathbb{C}$ be a <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Sequence</a> of <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic function</a> which <a href="20220105153330-konvergenz_einer_folge.html#ID-63fa4879-51cf-4ad6-8be5-0e9e10d29726">converges</a> on each <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> subset $K \subseteq \Omega$ <a href="20230110113621-gleichmaßige_konvergenz_einer_funktionenfolge.html#ID-e895942f-e89f-4078-875a-79790b2e125b">uniformly</a> against $f$.
Then $f$ is also holomorphic.
</p>
