<span id="ID-cbaf9188-49c0-449c-a0cf-c15ae54bb924"></span><h1 class="title">minimal prime ideal over an ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathfrak{a}$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then a <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a> $\mathfrak{p}$ is said to be minimal over $\mathfrak{a}$, if $\overline{\mathfrak{p}} \subseteq A/\mathfrak{a}$ is a <a href="20230725-minimal_prime_ideal.html#ID-9946ee7b-3aab-4f22-be35-f48f255ff9ae">minimal prime ideal</a>
</p>
