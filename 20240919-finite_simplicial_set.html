<span id="ID-fc424857-42c4-40cc-9f8a-6bf59686baa6"></span><h1 class="title">finite simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then $X$ is said to be finite, if it only has <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finitely</a> many <a href="20240128-degenerate_simplex.html#ID-a8d00e55-15cb-42c8-b4b7-95590690f708">non degenerate simplices</a>
</p>
