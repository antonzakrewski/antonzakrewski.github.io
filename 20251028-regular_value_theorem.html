<span id="ID-4416ece5-6ee7-4144-b3c0-3fc4d57d8b14"></span><h1 class="title">regular value theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: M \rightarrow N$ be a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a> between <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifolds</a>.
Let $n \in N$ be a <a href="20251028-regular_value.html#ID-61b4b9f8-04b8-40e0-bde3-a6f6fa14a6bd">regular value</a>.
</p>

<p>
Then $f^{-1}[ \{p\}]$ is a <a href="20250810-smooth_submanifold.html#ID-3a884e6e-7704-4dc2-a959-3a332e30f851">smooth submanifold</a> of $M$ of dimension $\mathrm{dim}(M) - \mathrm{dim}(N)$
</p>
