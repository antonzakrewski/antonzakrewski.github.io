<span id="ID-409c0aac-07c8-4673-afd2-baf4c8f53c88"></span><h1 class="title">Erwartungswert einer Binomialverteilung</h1>


<h2 id="proposition">Proposition</h2>
<p>
Sei eine <a href="20241118-binomialverteilung.html#ID-8ba78c92-f92f-40cc-8d5d-562e4df6ecac">Binomialverteilung</a> auf $\{1,...,n\}$ mit $p \in [0,1]$ gegeben.
Dann ist der <a href="20241114-erwartungswert_im_kontinuierlichen.html#ID-77f9582e-e091-4ba6-bee7-76870ec96853">Erwartungswert</a>
</p>

<div class="math-block">\begin{align*}
\mathbb{E}[\mathrm{binom}(p)] = p \cdot n
\end{align*}</div>
