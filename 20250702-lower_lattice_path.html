<span id="ID-ce662bc8-ea12-4fa1-a080-fec79bc69448"></span><h1 class="title">lower lattice path</h1>

<h2 id="definition">Definition</h2>
<p>
Let $m &gt; n$ and $\mathcal{B}_{m,n}$ the set of <a href="20250702-lattice_path.html#ID-8bf4a3d6-2763-447a-9e46-1748ead3ae98">lattice paths</a>.
Then a lower lattice path is a <a href="20250702-lattice_path.html#ID-8bf4a3d6-2763-447a-9e46-1748ead3ae98">lattice path</a> $(x_i,y_i)_{i\in I}$ where $x_i &gt; y_i$ for $1 &lt; i \leq n + m$
