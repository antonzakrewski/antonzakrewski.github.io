<span id="ID-2d1d3e74-c3ec-4f2b-ac4f-24b890f47e4e"></span><h1 class="title">orientierter Atlas einer Untermannigfaltigkeit</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20241213-untermannigfaltigkeit_von_r_n.html#ID-3ece0dbe-f279-435e-95c1-037aa2fcd32a">C^1 untermannigfaltigkeit von R^n</a>, dann ist ein orientierter Atlas ein <a href="20241214-atlas_einer_untermannigfaltigkeit_von_r_n.html#ID-d36da851-06fd-4668-b5d1-35ef2965ce6d">Atlas</a>, so dass zwei <a href="20241214-karte_einer_untermannigfaltigkeit_von_r_n.html#ID-b0b24627-62aa-4e95-bc65-6c0497a3b012">Karten</a> $\varphi_i: T_i \rightarrow V_i$ mit <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nichtleerem</a> schnitt jeweils <a href="20241214-orientierung_zweier_karten.html#ID-921f6987-1238-4359-82e9-cccc279d31b9">gleichorientiert</a> sind.
</p>
