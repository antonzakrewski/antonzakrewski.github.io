<span id="ID-babdc805-4e76-43f4-9fe7-e76cc7525c71"></span><h1 class="title">Tarski-finite</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $S$ is called tarski finite, if every <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nonempty</a> <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">family</a> of <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subsets</a> has a <a href="20230825-minimal_element.html#ID-180a1321-d0d3-4200-89a3-fc5996c98ff8">minimal element</a> or a <a href="20230825-minimal_element.html#ID-180a1321-d0d3-4200-89a3-fc5996c98ff8">maximal element</a> with respect to <a href="20230315000706-teilmengenrelation_als_halbordnung.html#ID-11e55b3d-c787-41c6-a086-11617ba7a6bb">Inklusion</a>
</p>
