<span id="ID-b42308b1-0c68-4b9a-b9fe-20a54d16844d"></span><h1 class="title">Verträglichkeit einer Rechtswirkung</h1>

<h2 id="definition">Definition</h2>
<p>
Für eine <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> $(G, \cdot)$ mit $g,h \in M$, eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $M$ mit $m \in M$ und eine <a href="20230301192947-linkswirkung.html#ID-199a3dec-6a33-4b45-8e9c-fbf7cefffb62">Linkswirkung</a> $\triangleright$ gilt:
</p>

<div class="math-block">\begin{align*}
(g \cdot h) \triangleright m = g \triangleright (h \triangleright m)
\end{align*}</div>
