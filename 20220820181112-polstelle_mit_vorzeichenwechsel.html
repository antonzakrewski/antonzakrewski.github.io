<span id="ID-9fdc09f7-8c61-4d24-a3ed-477154d8f7c1"></span><h1 class="title">Polstelle mit Vorzeichenwechsel</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $f(x)$ eine <a href="20220820194405-vollstandig_gekurzt.html#ID-755d7856-bb12-4578-be98-4e1c8433f8c6">vollständig gekürzte</a>, <a href="20220102212658-definition_gebrochen_rationale_funkttionen.html#ID-1b393d0a-c72b-48ef-93c5-d28b8924d63b">gebrochen rationale Funktion</a> mit dem <a href="20220820190234-nennerpolynom.html#ID-0fa87e2d-0c0a-44aa-a0e7-258e1204c6a4">Nennerpolynom</a> $p(x)$ und der <a href="20220320113706-nullstelle.html#ID-b094e637-5f3c-42a2-a2c2-ae73bbbe29a2">Nullstelle</a> von $p(x_0) = 0$ mit <a href="20211113090016-vorzeichenwechsel.html#ID-69d97ee8-de7d-4d58-8b1d-acda4ec4559e">Vorzeichenwechsel</a> (vgl: <a href="20220820194243-vorzeichenwechsel_eines_polynoms.html#ID-3106ac94-9c84-4013-bc20-1a7bf57de86f">Vorzeichenwechsel eines Polynoms</a>)
Dann hat auch die <a href="20210217182710-polstelle_analysis.html#ID-8720a2a2-f7da-4f9a-bd67-4505e72c2366">Polstelle</a> $x_0$ einen <a href="20211113090016-vorzeichenwechsel.html#ID-69d97ee8-de7d-4d58-8b1d-acda4ec4559e">Vorzeichenwechsel</a>
</p>
