<span id="ID-ad68e4da-73c3-4ed7-a2aa-e2b74b7bbe88"></span><h1 class="title">representation in general does not admit a filtration</h1>

<h2 id="proposition">Proposition</h2>
<p>
A <a href="20261013-representation_of_an_algebra.html#ID-2382e24c-8a21-4f51-94be-8f7cc7321c83">representation</a> of a <a href="20221125133249-k_algebra.html#ID-74ada59f-7a40-49a2-b525-be8af0628fe9">K-Algebra</a> $a$ in general does not admit a <span class="broken-link" title="unresolved id:36d4955e-8f90-4fdb-a676-6e43c942859bü">filtration</span>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20261014-infinite_dimensional_representation_in_general_does_not_admit_an_irreducible_subrepresentation.html#ID-c16b4df7-1392-49ae-9c98-dcdb89cc3423">infinite dimensional representation in general does not admit an irreducible subrepresentation</a> </li>
</ul>
<p>
where $V_1$ must be <a href="20261013-irreducible_representation_of_an_algebra.html#ID-d63374c8-6c64-4ee3-bc2b-bd75c8272d12">simple</a>.
</p>
