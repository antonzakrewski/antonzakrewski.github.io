<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then $G$ is said to be \(k\) edge connected if
</p>
<ol>
<li>$\vert V \vert \geq 2$</li>

<li>for all subset of edges $F \subseteq E$ with cardinality less than $l$, i.e. $\vert F \vert &lt; l$ the graph $(V, E \setminus F)$ is still <a href="20221024152649-zusammenhangender_graph.html#ID-5c0f8ef4-52f7-4762-a4dd-8772c7ea392c">connected graph</a> </li>
</ol>
