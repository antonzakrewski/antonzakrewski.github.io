<h2 id="definition">Definition</h2>
<p>
Sei $(X_i, \mathcal{T}_i)$ eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Räume</a>, dann ist die Box-Topology auf dem <a href="20221224141628-allgemeine_kartesische_produkt.html#ID-1fa0c762-e1d2-4ee7-8212-15395a725dd9">kartesischen Produkt</a> $X  \coloneqq \prod X_i$ definiert als:
</p>

<div class="math-block">\begin{align*}
\mathcal{B}  \coloneqq \{\prod_{i\in I} O_i \vert O_i \in \mathcal{T}_i\}
\end{align*}</div>
