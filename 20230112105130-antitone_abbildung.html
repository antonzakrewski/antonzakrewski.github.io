<span id="ID-6345522e-b726-4a0c-b3d2-cf17f875e147"></span><h1 class="title">antitone Abbildung</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M,N$ zwei <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">halbgeordnete</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und $f: M \rightarrow N$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>
$f$ ist eine antitone Abbildung, falls für $m,m' \in M$ gilt:
</p>

<div class="math-block">\begin{align*}
m \leq_M m' \Rightarrow f(m) \geq_N f(m')
\end{align*}</div>
