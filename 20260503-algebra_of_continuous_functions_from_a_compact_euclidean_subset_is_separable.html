<span id="ID-6fb5e2fa-a7b2-470b-923d-4bc0072faa3f"></span><h1 class="title">algebra of continuous functions from a compact euclidean subset is separable</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G \subseteq \mathbb{R}^d$ be a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> subset.
Then the <a href="20260503-algebra_of_continuous_functions.html#ID-98b5b31b-c3d8-494a-8acd-d45729b02253">algebra of continuous functions</a> is a <a href="20230307213929-seperabler_raum.html#ID-6e659d10-83a5-4a03-88b7-119feee141fa">separable space</a>
</p>
