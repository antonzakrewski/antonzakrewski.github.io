<span id="ID-43eedf34-b846-41ee-a59e-b8b073829b85"></span><h1 class="title">presheaf category is cartesian closed</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any <a href="20241020-infinity_category_of_presheaves.html#ID-aec2b71f-20b0-4c66-9a4f-73ae7add1b0e">presheaf category</a> $\mathcal{P}(\mathcal{C})$ is <a href="20231115-cartesian_closed_category.html#ID-315f9f64-ca45-4064-b89d-c1da8a889115">cartesian closed</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as $- \times c$ <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimits</a>, hence <a href="20250914-presentable_adjoint_functor_theorem.html#ID-f139e2ea-8ac2-4e3c-9da2-55dcf1c21802">presentable adjoint functor theorem</a> shows the claim.
</p>
