<span id="ID-1bdb29f9-5720-4f56-8615-528a0f9fdbde"></span><h1 class="title">euler formula for stiefel whitney classes</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\pi: E \rightarrow B$ be a <a href="20250429-spherical_fibration.html#ID-5101116a-27b3-43c5-accd-2eb9fa285974">spherical fibration</a> of rank $n$.
Then the \(n\)-th <a href="20250513-stiefel_whitney_class.html#ID-e517ed4b-8778-4ca0-b72d-f14039cb4466">stiefel whitney class</a> is given by the <a href="20250506-euler_class_of_a_spherical_fibration.html#ID-4b5bbe4c-c759-4354-a93d-060bac75d685">euler class of a spherical fibration</a>
</p>

<div class="math-block">\begin{align*}
w_n(\pi) = \overline{e}(\pi)
\end{align*}</div>
