<span id="ID-aeeaaf93-11ce-4943-a1e7-a075e9c15905"></span><h1 class="title">complete t-structure</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> equipped with a <a href="20241023-t_structure_on_a_stable_infinity_category.html#ID-6e276613-1d75-469a-a934-a7f6211cdadd">t-structure</a>
Then the t-structure is said to be complete, if it is both <a href="20241101-left_complete_t_structure.html#ID-088894a7-6bde-43a5-aea1-eb52609fa36f">left complete</a> and <a href="right-complete-t-structure.html#ID-27ba2be7-ea0d-4d1e-9dad-a7993ccb7802">right complete</a>
</p>
