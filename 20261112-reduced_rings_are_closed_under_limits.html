<span id="ID-de63993b-64d2-4af4-be4e-1bd2f72355d4"></span><h1 class="title">reduced rings are closed under limits</h1>

<h2 id="proposition">Proposition</h2>


<h2 id="proof">Proof</h2>
<p>
use:
A ring $R$ is reduced <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> $\mathrm{Hom}_{\mathrm{Ring}}(\mathbb{Z}[x]/x^n, R)$ vanishes for all $n \in \mathbb{N}$.
use that $\emptyset$ is closed under limits.
