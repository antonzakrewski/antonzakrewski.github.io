<span id="ID-e197e6f4-95c2-4b9a-b79d-a8e5f63c8553"></span><h1 class="title">scheme of an integral domain with generic point</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R\) be an <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integral domain</a>
Then the <a href="20230826-affine_scheme.html#ID-db53fdff-23db-4578-95b6-9cc1e057c336">affine scheme</a> has a <a href="20230807-generic_point.html#ID-5d852e38-1a27-4bef-9529-f01abd342f94">generic point</a>, namely the <a href="20230725-zero_ideal.html#ID-44d27475-7790-426b-a9cc-8e321e6dd3d1">zero ideal</a>
</p>

<h2 id="proof">Proof</h2>
<ul>
<li><a href="20230803-zero_ideal_as_prime_ideal_and_integral_domain.html#ID-c09a433d-67e7-40cf-95ee-ca79f5cc889e">zero ideal as prime ideal and integral domain</a></li>

<li>note that each (prime) ideal contains the zero ideal  </li>
</ul>
