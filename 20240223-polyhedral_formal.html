<h2 id="proposition">Proposition</h2>
<p>
Let $\Sigma_g$ be a <a href="20240227-orientable_surface.html#ID-fd5743c1-f4d8-4d6c-9555-61ac6b530364">orientable surface</a> of <a href="20230906-genus_topology.html#ID-9d9516a4-659f-4d2c-9695-fb427c1d6040">genus</a> $g$, which is &lt;triangulated by vertices, edges and triangles.
Then it holds, that
</p>

<div class="math-block">\begin{align*}
2 - 2 g = \vert \text{vertices} \vert - \vert \text{edges} \vert + \vert \text{triangles} \vert
\end{align*}</div>
