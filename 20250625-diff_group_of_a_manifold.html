<span id="ID-170ebc0f-37b8-4ed6-8ff5-037eab3714cb"></span><h1 class="title">Diff group of a Manifold</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230905-smooth_differentiable_manifold.html#ID-0ddfb9d4-93f0-4b88-bb28-f6ca87b18ee0">smooth manifold</a>.
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{Diff}(M) \subseteq \mathrm{Map}_{\mathrm{Top}}(M,M)
\end{align*}</div>
<p>
is the <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a> containing <a href="20250625-smooth_diffeomorphism.html#ID-e1ef57fa-a0d5-4479-9710-16789a9317f0">smooth diffeomorphism</a>.
see:
</p>
<ul>
<li><a href="20231103-compact_open_bifunctor.html#ID-063f0848-2e82-4e68-bc88-fe9c6cca022a">compact open</a> topology</li>
</ul>
