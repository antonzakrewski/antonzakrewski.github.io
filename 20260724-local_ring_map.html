<span id="ID-f170dc39-0e73-4928-b123-1a6d25885064"></span><h1 class="title">local ring map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\varphi: A \rightarrow B$ be a map of <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative rings</a>.
Then $\varphi$ is said to be local, if $\varphi^{-1}[B^{\times}] \subseteq A^{\times}$ or equivalently $\varphi^{-1}[B^{\times}] = A^{\times}$
</p>
