<span id="ID-333f337c-cb3e-4288-bc07-58537bc054ce"></span><h1 class="title">Menge der abzählbaren Ordinalzahlen überabzählbar</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $\Omega_0$ die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">abzählbaren</a> <a href="20230516130028-ordinalzahl.html#ID-f638eb2b-0e4a-40c1-aac6-d3518403288b">Ordinalzahlen</a>.
Dann ist $\Omega_0$ <a href="20211227215849-uberabzahlbar_unendlich.html#ID-9a4cb7c5-90c2-48e3-ad83-d9bcf341b6e9">überabzählbar</a>.
</p>

<h2 id="beweis">Beweis</h2>
<p>
Sei $f: \mathbb{N} \twoheadrightarrow \Omega_0$ eine <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjektion</a>.
