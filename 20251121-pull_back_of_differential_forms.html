<span id="ID-d65c6e28-0dc6-442c-8243-aaf12bf7984d"></span><h1 class="title">pullback of differential forms</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: U \rightarrow V$ be a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a> between  <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> subsets $U \subseteq \mathbb{R}^n, V \subseteq \mathbb{R}^m$.
Then the pullback is a <a href="20230802-chain_map.html#ID-366c9675-ed47-4bc2-a01d-3d0c6911e226">chain map</a>
</p>

<div class="math-block">\begin{align*}
f^*: \Omega^k(V) \rightarrow \Omega^k(U)
\end{align*}</div>
