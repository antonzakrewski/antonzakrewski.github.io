<span id="ID-b4edbe32-63e9-43da-af90-7aafaf1e2475"></span><h1 class="title">Verhältnis: Isomorphismus und Monomorphismus + Epimorphismus</h1>

<h2 id="satz">Satz</h2>
<p>
Ein <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">Isomorphismus</a> ist stets <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">episch</a> und <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monisch</a>.
Die Umkehrung, d.h. ein <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">Morphismus</a> ist <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">iso</a>, wenn er <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">episch</a> und <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monisch</a> ist, gilt nicht immer.
