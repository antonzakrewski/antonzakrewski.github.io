<span id="ID-48e29c9d-7941-405a-a653-1f728c298928"></span><h1 class="title">Bilinearform</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M_L,M_R$ <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Moduln</a> über einem (nicht notwendigerweise <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">kommutativem</a>) <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> $R$.
Eine Bilinearform ist eine <a href="20230121215031-multilineare_abbildung.html#ID-cb913b22-e3ec-42c8-9049-9228735bbed4">multilineare</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $\langle \cdot , \cdot \rangle: M_L \times M_R \rightarrow R$.
</p>
