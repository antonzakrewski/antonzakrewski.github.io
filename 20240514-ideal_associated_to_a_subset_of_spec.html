<span id="ID-97674c3d-242d-41a5-87bc-70502444f283"></span><h1 class="title">ideal associated to a subset of spec</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathcal{V} \subseteq \mathrm{Spec}(A)$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>.
Then the ideal associated to $\mathcal{V}$ is defined as
</p>

<div class="math-block">\begin{align*}
I(\mathcal{V}) = \bigcap_{\mathfrak{p} \in \mathcal{V}} \mathfrak{p}
\end{align*}</div>
