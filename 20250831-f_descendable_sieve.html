<span id="ID-d6224a0a-12f1-4fec-9ec4-cfd0c84444e1"></span><h1 class="title">F-descendable sieve</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{F}$ be a collection of <a href="20220821183047-pragarbe.html#ID-6aa2a293-0ff3-4cba-b6c3-61d8eabf0871">presheaves</a>, $S \rightarrow X$ a <a href="20230923-sieve.html#ID-4682cea8-3c62-49f6-ae4c-3deb9dd4dec6">sieve</a>
Then $S$ is said to be \(\mathcal{F}\)-descendable, if it satisfies <a href="20250831-descent_of_a_presheaf.html#ID-cd6e7dc2-9935-4c5f-8793-0ff22b2048e2">descent</a> with respect to each element presheaf in $\mathcal{F}$
</p>
