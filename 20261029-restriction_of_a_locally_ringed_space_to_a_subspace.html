<span id="ID-7ff435b3-c591-45d1-9360-63469bb42315"></span><h1 class="title">restriction of a locally ringed space to a subspace</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $U \subseteq X$ be an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a> and $(X, \mathcal{O}_{X})$ a <a href="20230826-locally_ringed_space.html#ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728">locally ringed space</a>.
then $(U, (\mathcal{O}_{X})_{\vert U})$ is also a locally ringed space.
</p>
