<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $J: \mathcal{J} \rightarrow \mathcal{C}$ be a <a href="20231111-connected_category.html#ID-663060d5-07ae-4dfc-b5d3-ed866fa75bdc">connected</a> <a href="20231231-constant_diagram.html#ID-ae05acdf-1575-49ba-a430-c451584ebf33">constant diagram</a> for $A \in \mathrm{Ob}(\mathcal{C})$
Then the <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> of $J$ is given by
</p>

<div class="math-block">\begin{align*}
\mathrm{lim}(J) = A
\end{align*}</div>
