<span id="ID-3dd121f2-15c6-487e-97d1-da1f28598581"></span><h1 class="title">Kern eines Ringhomomorphismus</h1>

<h2 id="definition">Definition</h2>
<p>
Der Kern eines <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">Ringhomomorphismus</a> $f: R \rightarrow R'$ für <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ringe</a> $R,R'$ ist definiert als:
</p>

<div class="math-block">\begin{align*}
\mathrm{ker}(f) = \{r \in R \vert f(r) = 0\} \subseteq R
\end{align*}</div>
