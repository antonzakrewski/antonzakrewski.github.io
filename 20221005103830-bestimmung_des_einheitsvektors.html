<span id="ID-c4fffd2c-7a17-4210-8c4e-4df09b448176"></span><h1 class="title">Bestimmung eines Einheitsvektors</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $v$ ein <a href="20210217215228-vektor.html#ID-be50263b-d29c-41c5-9909-2f5e106dc49c">Vektor</a> in einem <a href="20221003143917-normierter_raum.html#ID-250c7843-ade4-44e9-9d45-05423ddaa1d8">normierten Raum</a>.
Dann ist der zugehörige <a href="20221005095728-einheitsvektor.html#ID-dfdf1608-364e-4b7e-b235-e8fd0355ea13">Einheitsvektor</a> für $v$
</p>

<div class="math-block">\begin{align*}
\hat{v} =&amp; \frac{v}{\| v \|}
\end{align*}</div>
