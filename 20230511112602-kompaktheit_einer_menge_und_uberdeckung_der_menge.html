<span id="ID-c477bc71-b062-4eb3-bb11-abc6d4236f92"></span><h1 class="title">Kompaktheit einer Menge und Überdeckung der Menge</h1>

<h2 id="satz">Satz</h2>
<p>
Die Kompaktheit von $M \subseteq X$ ist äquivalent dazu, dass für jede Familie $(O_i)_{i \in I}$ offener Teilmengen $O_i \subseteq X$ mit $M \subseteq \bigcup_{i\in I} O_i$ eine endliche teilüberdeckung von $M$ existiert
