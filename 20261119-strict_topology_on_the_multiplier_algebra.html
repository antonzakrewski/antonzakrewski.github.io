<span id="ID-920686e1-1818-4411-a9b4-19ae2ae9c08f"></span><h1 class="title">strict topology on the multiplier algebra</h1>

<h2 id="definition">Definition</h2>
<p>
The strict topology on the <a href="20261119-multiplier_algebra.html#ID-b22a0624-5046-475d-88fb-5245e4c5ce5c">multiplier C^* algebra</a> is the <a href="20260626-locally_convex_topology.html#ID-c276a81b-2196-4235-a2b6-d5b1f75586eb">locally convex topology</a> generated by the seminorms $\| m \|_a = \| m \cdot a \| + \| a \cdot m\|$
