<span id="ID-fc14ee3e-0ac7-44f9-a224-7a5b65114bf3"></span><h1 class="title">Filter</h1>

<h2 id="definition">Definition</h2>
<p>
Sei eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $P$ mit einer <a href="20220817224552-quasiordnung.html#ID-bccd39d9-8112-4631-b0b0-41b568820901">Quasiordnung</a> $\leq$ gegeben.
Eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $F \subseteq P$ ist ein Filter, falls gilt:
</p>
<ul>
<li>$F$ ist ein <a href="20230206162623-upper_set.html#ID-5a269aa5-fc48-43fa-9423-cd202e6c2a05">Upper set</a> </li>

<li>$F$ ist ein <a href="20230206161258-nach_unten_gerichtete_menge.html#ID-90b9de3c-db75-44ef-96bb-6a5efe3882b2">nach unten gerichtete Menge</a></li>
</ul>
