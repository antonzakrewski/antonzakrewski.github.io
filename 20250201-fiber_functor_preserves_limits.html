<span id="ID-3919ddcf-3dba-4a38-8802-cae3cd46bc59"></span><h1 class="title">fiber functor preserves limits</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity category</a> with <a href="20250121-fiber_functor.html#ID-b2e4159d-8126-4cb6-8795-032539781d21">fiber functor</a>.
Then it <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves limits</a>.
</p>

<h2 id="proof">Proof</h2>

dual to <a href="20241028-cofiber_preserves_colimits.html#ID-9908c270-01fb-418f-be43-da4a811e0f55">cofiber functor preserves colimits</a>
</p>
