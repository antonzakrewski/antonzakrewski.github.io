<span id="ID-f857ddf9-46ba-41bb-a247-f43a0aa24261"></span><h1 class="title">units multiplicatively closed</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(A \neq 0\) be a nonzero <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, then the <a href="20221226125820-menge_der_einheiten_als_gruppe.html#ID-49f0dc7a-5b14-45e3-bfa7-20a7eba79d30">unit group</a> is <a href="20230724-multiplicatively_closed_set.html#ID-d3df0441-9f2f-476f-b18e-d513ae149906">multiplicatively closed</a>
</p>

<h2 id="proof">Proof</h2>

<h3 id="a">a)</h3>
<p>
note that $1 \in A^{\times}$
</p>

<h3 id="b">b)</h3>
<p>
follows from multiplicative closure of the unit group
</p>
