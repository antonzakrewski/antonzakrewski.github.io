<span id="ID-10df971c-c815-41df-b913-6d2255d56a66"></span><h1 class="title">affine space boomer</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $n \geq 1$.
Then
</p>

<div class="math-block">\begin{align*}
\mathbb{A}_K^n \coloneqq&amp; K^n \\
=&amp; \{(k_1,...,k_n) \vert k_1,...,k_n \in K\}
\end{align*}</div>
<p>
is the $n$-dimensional affine space over $K$
</p>
