<span id="ID-668083d4-ea4f-4c79-8fa3-3f3dfd72c2b1"></span><h1 class="title">dimension of a noetherian local ring is finite</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian</a> <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a>.
Then the <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimension</a> is <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
observe that any chain is contained by $\mathfrak{m}$.
Moreover, use the ascending chain condition.
</p>
