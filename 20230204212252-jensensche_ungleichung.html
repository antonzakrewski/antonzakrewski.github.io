<h2 id="satz">Satz</h2>
<p>
Für eine <a href="20230204211958-konvexe_funktion.html#ID-46d5b620-5fbf-4352-8aad-30f19903ff81">konvexe Funktion</a> und $\lambda_i \geq 0$ mit $\sum_{i=1}^{n} \lambda_i = 1$ gilt
</p>

<div class="math-block">\begin{align*}
f \left(\sum_{i=1}^{n} \lambda_i x_i \right) \leq \sum_{i=1}^{n} \lambda_i f(x_i)
\end{align*}</div>
