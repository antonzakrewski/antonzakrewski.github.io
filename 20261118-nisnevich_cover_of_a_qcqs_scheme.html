<span id="ID-83cf5cf1-6635-4079-b99f-f6b01b979657"></span><h1 class="title">nisnevich cover of a qcqs scheme has finite subcover</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250618-qcqs_scheme.html#ID-31bd0cb5-2133-4fc3-9386-a04c5a43f16b">qcqs scheme</a> and a $(U_i \rightarrow X)_{i \in I}$ a <a href="20261111-nisnevich_cover.html#ID-52a2e4b4-47bb-481d-9937-dc3f2a6a0b64">nisnevich cover</a> .
Then there exists a finite subset $I$ such that $(U_i \rightarrow X)$ is a nisnevich cover
</p>

<h2 id="proof">Proof</h2>
<p>
apply the &lt;lemma&gt; to $\coprod U_i \rightarrow X$
</p>
