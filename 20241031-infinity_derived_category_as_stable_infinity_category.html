<span id="ID-80de98c9-fd28-43f4-9dfd-7d69fcff9153"></span><h1 class="title">infinity dash-derived category as stable infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> admitting <a href="20231212-enough_projectives.html#ID-8699327b-1cf6-41fc-9eda-522460057625">enough projectives</a>
Then the <a href="20241031-infinity_derived_category_of_an_abelian_category.html#ID-59069bbd-e1e3-4207-a14d-573135f3e8a2">dash-derived category</a> $\mathcal{D}^{-}(A)$ is a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity category</a>
</p>
