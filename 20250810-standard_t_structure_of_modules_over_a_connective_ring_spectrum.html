<span id="ID-0d6eab0c-2b38-405e-bbcc-d175dbb0af19"></span><h1 class="title">standard t-structure of modules over a connective ring spectrum</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20250408-connective_e_n_ring_spectrum.html#ID-aa4aa2dc-287d-47a3-b820-84949fcde6f5">connective E_1-ring spectrum</a>, $\mathrm{LMod}_{R}$ the <a href="20250621-infinity_module_category_of_a_ring_spectrum.html#ID-60f804bb-5dd6-44ca-9e25-4fbdb749d314">category of module spectra.</a>
Then the subcategories $\mathrm{LMod}_{R}^{\geq 0}, \mathrm{LMod}_{R}^{\leq 0}$ determine an <a href="20250819-accessible_t_structure.html#ID-6dffa475-43e5-43d1-bf8d-546179d4ff0a">accessible t-structure</a>.
