<span id="ID-c4809857-d7e7-4044-a1ec-12e15e5500a1"></span><h1 class="title">Intervallschachtelungs-Prinzip</h1>

<h2 id="axiom">Axiom</h2>
<p>
Sei $I_0 \subset I_1 \subset … \subset I_n \subset …$ eine <a href="20230112163021-intervallschachtelung.html#ID-979b549a-f284-4bfc-9593-560104d5f497">Intervallschachtelung</a>.
Dann gibt es (genau) eine <a href="20210702104535-reelle_zahlen.html#ID-764c8d83-a539-42fa-b8b4-3e388f4dc3a1">reelle Zahl</a> $x \in \mathbb{R}$ mit
</p>

<div class="math-block">\begin{align*}
x \in I_n &amp;&amp; \forall  n \in \mathbb{N}
\end{align*}</div>
