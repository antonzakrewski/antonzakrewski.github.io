<span id="ID-de5c2dd9-6334-4e79-b2a2-5b82fd7980a9"></span><h1 class="title">projective vanishing ideal as homogoneous ideal</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a> <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a> and $X \subseteq \mathbb{P}_{K}^n$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>
Then the <a href="20231127-projective_vanishing_ideal.html#ID-f10ee9dd-04ac-4f4d-9e80-ab7ebb6fdccd">projective vanishing ideal</a> $I(X)$ is a <a href="20230904-homogeneous_ideal.html#ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3">homogeneous ideal</a>
</p>
