<h2 id="satz">Satz</h2>
<p>
Sei $(X_i,\mathcal{T}_i)$ eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a> von <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räumen</a> und $(X,\mathcal{T})$ die <a href="20230211133152-produkttopologie.html#ID-32030f19-ac2a-4c46-aaed-1abb1cd6df9f">Produkttopologie</a>
Dann gilt für eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a> $A_i \subseteq X_i$ von <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a>:
</p>

<div class="math-block">\begin{align*}
\mathring{\prod A_i} = \prod \mathring{A_i}
\end{align*}</div>
