<span id="ID-f49f9b47-9f16-456f-837f-7b9656c46aba"></span><h1 class="title">Hausdorff space</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>.
</p>

<p>
Dann ist $X$ ein Hausdorff-Raum, falls für verschiedene Punkte $x,y \in X$ <a href="20211226220255-disjunkte_mengen.html#ID-2000e1f4-7e9e-45f9-91ed-16ded8a15190">disjunkte</a> <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebungen</a> $U_x,U_y$ existieren.
</p>
