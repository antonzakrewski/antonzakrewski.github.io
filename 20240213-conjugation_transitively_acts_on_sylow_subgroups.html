<span id="ID-303ec8c0-1889-4e24-a16e-e3308d56cb04"></span><h1 class="title">conjugation transitively acts on sylow subgroups</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $s_p$ the number of <a href="20240206-number_of_sylow_groups.html#ID-58a19dea-67fb-49fa-9e4b-153cc27f3f87">number of sylow groups</a>.
Then $G$ acts <a href="20230802-transitive_group_action.html#ID-60b1288f-e80e-4738-8775-5c1360fdf2ec">transitively</a> on the <a href="20230722-p_sylow_gruppe.html#ID-6dc01061-42f1-44f1-9c11-b313099f13e2">p-sylow groups</a> $\{U_1,...,U_{s_p}\}$
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of <a href="20231022-konjugieren_einer_sylowgruppe.html#ID-c930b4d0-f873-4304-b870-3ce4840bf26a">Konjugieren einer Sylowgruppe und einer p-Gruppe</a>
</p>
