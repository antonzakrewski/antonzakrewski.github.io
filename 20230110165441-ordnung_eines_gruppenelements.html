<span id="ID-c88f2185-0bf2-4292-8a15-8ea97181af4f"></span><h1 class="title">group order of an element</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $G$ eine <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> und $g \in G$, dann ist die Ordnung von $g$ definiert als
</p>

<div class="math-block">\begin{align*}
\mathrm{Ord}(g) = 
\begin{cases}
\mathrm{min}(n \in \mathbb{N}^+ : g^n = e) &amp; \mbox{if } \exists n \\
\infty  &amp; \mbox{else } \\ 
\end{cases}
\end{align*}</div>
