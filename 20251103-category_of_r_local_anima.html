<span id="ID-62f84b4d-1ffe-45be-af57-b7d87e67db73"></span><h1 class="title">category of R-local anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a>, then the category of R-local anima is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a> containing <a href="20251103-r_local_spectrum.html#ID-46465fd7-0d9f-4d07-a6e9-4714c872e8a4">R-local Anima</a>
</p>

<p>
So in particular it is a localization along \(R\)-homology equivalences.
</p>
