<span id="ID-824ac13a-4b30-4478-90e5-c42bf73b01f4"></span><h1 class="title">category of finitely presented modules of bounded projective dimension</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20240528-left_coherent_ring.html#ID-a3c588a3-14fb-4c7b-8bd8-1eab89e19683">left coherent ring</a>.
Then denote by $\mathrm{Mod}_{\leq n}^{\mathrm{fp}}(R)$ the <a href="20230225184516-volle_unterkategorie.html#ID-02c96fc8-ac4f-42b6-804d-bc08d25bfb2a">full subcategory</a> of $\mathrm{Mod}^{\mathrm{fp}}(R)$ on those that have <a href="20240511-projective_dimension_of_an_object.html#ID-6d94393a-b9d6-4221-ab94-8f82379c02ba">projective dimension</a> at most $n$
</p>
