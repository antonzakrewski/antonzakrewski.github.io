<span id="ID-704f2f2a-6b57-4168-8b52-4a2965ee69de"></span><h1 class="title">semigroup</h1>

<h2 id="definition">Definition</h2>
<p>
Eine Halbgruppe ist ein Paar $(M, \cdot)$ bestehnd aus einer <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">menge</a> $M$ und einer <a href="20220925215102-binare_verknupfung.html#ID-213966ae-84e5-480d-93a3-f1d55034b939">binären Verknüpfung</a>
</p>

<div class="math-block">\begin{align*}
\cdot: M \times M \rightarrow&amp; M \\
(a,b) \mapsto&amp; a \cdot b
\end{align*}</div>
<p>
so dass das <a href="20211008171532-assoziativgesetz.html#ID-124778f2-ef98-469b-8664-7777bb4bff01">Assoziativgesetz</a> erfüllt ist.
</p>
