<span id="ID-f000d9b6-ac66-43d8-9ad0-d316afccc33b"></span><h1 class="title">weakly contractible simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then $X$ is said to be weakly contractible, if the <a href="20230404183731-terminal_morphism.html#ID-ad3ab3aa-eac9-4e11-8a03-6a8e703aefdf">terminal morphism</a> $X \rightarrow \Delta^0$ is a <a href="20240711-weak_equivalence_between_sset.html#ID-cab1bc8b-5969-4571-815a-34a9c02b0672">weak equivalence</a>
</p>
