<span id="ID-105257d3-3b53-41bb-a8a7-79c1c2392c40"></span><h1 class="title">subbundle of a module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V$ be an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then a subbundle of $V$ is a <a href="20260714-universally_injective_map.html#ID-fdf71e59-8492-44bc-afe9-830cc1bde019">universally injective map</a> $U \hookrightarrow V$ where $U$ is an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a>
</p>
