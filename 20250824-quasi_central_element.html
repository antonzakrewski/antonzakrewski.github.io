<span id="ID-3c66bf58-f5b1-47c1-a733-66819e424a73"></span><h1 class="title">quasi central element</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be an \(\mathbb{E}_1\)-<a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a>.
Then an element $x \in \pi_0(R)$ is said to be quasi central, if
</p>

<div class="math-block">\begin{align*}
S = \{x^n \vert n \in \mathbb{N}\} \cdot \pi_*(R)^{\times}
\end{align*}</div>
<p>
satisfies the <a href="20250823-left_ore_condition.html#ID-5992e9ea-9007-4905-8cd5-a70a6ae7693b">left ore condition</a>
</p>
