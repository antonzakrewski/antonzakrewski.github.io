<span id="ID-7b85a0ab-5403-47a3-9bb5-d419697bb4a6"></span><h1 class="title">Taylor-Entwicklung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $f: I \rightarrow \mathbb{R}$ eine <a href="20221021000346-glatte_funktion.html#ID-1d941314-2cef-435c-8e94-e176d3a830c9">glatte</a> <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a>, so dass für $x_0 \in I$ in einer <a href="20221206143436-umgebung_metrischer_raum.html#ID-c68f3091-12bb-48b4-896f-9d42d8ef1d09">Umgebung</a> $U$ von $x_0$ die <a href="20220302162755-taylorreihe.html#ID-a4e603aa-2ab3-42af-b185-e357439006bc">Taylorreihe</a> von $f$ gegen $f$ <a href="20230110113621-gleichmaßige_konvergenz_einer_funktionenfolge.html#ID-e895942f-e89f-4078-875a-79790b2e125b">gleichmäßig konvergiert</a>.
Dann lässt sich $f$ um $x_0$ in $U$ als <a href="20221204223941-potenzreihe.html#ID-dab65874-6741-4bba-97fe-d305f01190aa">Potenzreihe</a> durch die <a href="20220302162755-taylorreihe.html#ID-a4e603aa-2ab3-42af-b185-e357439006bc">Taylorreihe</a> darstellen/entwickeln.
</p>
