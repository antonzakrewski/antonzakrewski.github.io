<span id="ID-9c611c5c-75c8-4063-9fb7-18e3cd7a7d90"></span><h1 class="title">Differenz zweier Zahlen zwischen 0 und s kleiner s</h1>

<h2 id="satz">Satz</h2>
<p>
Seien  $x,y$ zwei Zahlen mit
</p>

<div class="math-block">\begin{align*}
0 \leq x,y &lt; s
\end{align*}</div>
<p>
Dann gilt:
</p>

<div class="math-block">\begin{align*}
x - y &lt; s
\end{align*}</div>

<h2 id="beweis">Beweis</h2>

<div class="math-block">\begin{align*}
x \leq x + y &lt; s + y \\
x &lt; s + y \vert -y \\
x - y &lt; s 
\end{align*}</div>

</div>
