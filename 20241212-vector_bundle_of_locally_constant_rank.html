<span id="ID-8bd358f3-4f1f-4d9f-8763-7fd8d344a8a7"></span><h1 class="title">vector bundle of locally constant rank</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $p: E \rightarrow B$ be a <a href="20241219-vector_bundle.html#ID-5b786fb8-d5a5-4d0d-be47-444b0c8f75d2">vector bundle</a>.
Then the <a href="20241212-rank_of_a_vector_bundle.html#ID-10b5c8d4-7ba7-4f90-8471-ef07d40fdd71">rank</a> is <a href="20240903-locally_constant_map.html#ID-80369494-b256-438e-bd94-26330a5ff08e">locally constant</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the given covering $U_i$ with $p^{-1}[U_i] \simeq U_i \times \mathbb{K}^n$ which shows that the rank of $U$ is given by $n$
</p>
