<span id="ID-ad972639-9cea-45ab-8f5f-595d620392cf"></span><h1 class="title">exact infinity functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{C}'$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ an <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">infinity functor</a>
Then $\mathcal{F}$ is said to be exact, if preserves <a href="fiber-sequence.html#ID-2dab8346-4e02-42ba-b79d-58f234e9961b">fiber sequences</a> and <a href="20241017-infinity_zero_object.html#ID-ec40b632-b794-428c-b987-81a9b53bd650">zero objects</a>
</p>
