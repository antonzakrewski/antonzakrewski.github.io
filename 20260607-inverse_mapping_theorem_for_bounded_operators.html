<span id="ID-c5cd1552-0457-48a4-923b-e4ade7b5394c"></span><h1 class="title">inverse mapping theorem for bounded operators</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20221124132702-banachraum.html#ID-43ef125e-d9bb-454f-9427-4d3d8426893a">banach spaces</a> and $T: X \rightarrow Y$ a <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">bijective</a> <a href="20260509-bounded_operator.html#ID-c9aa0020-0a75-4250-9116-0d18e171bb90">bounded operator</a>.
Then it is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the <a href="20260607-open_mapping_theorem_for_bounded_operators.html#ID-92cecffe-d54a-4511-b4af-aa99b559de27">open mapping theorem for bounded operators on banach spaces</a>.
</p>
