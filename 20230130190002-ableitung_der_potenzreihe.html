<span id="ID-be2bbc56-4cb6-45a0-9048-cbc9eb618a95"></span><h1 class="title">Ableitung der Potenzreihe</h1>

<h2 id="korollar">Korollar</h2>
<p>
Sei $P(x)  \coloneqq \sum_{n=0}^{\infty} a_n x^n$ eine <a href="20221204223941-potenzreihe.html#ID-dab65874-6741-4bba-97fe-d305f01190aa">Potenzreihe</a> so ist die $k$-te <a href="20230118224205-ableitung.html#ID-162033bf-f6b9-49d6-a75b-07c444a70de4">Ableitung</a> durch Anwendung der <a href="20220820185347-ableitungsregeln.html#ID-892cbbf3-a11f-4539-a2a3-7e8b030f1348">Ableitungsregeln</a>:
</p>

<div class="math-block">\begin{align*}
P^{(k)}(x) = \sum_{n=k}^{\infty} \frac{n!}{(n-k)!} x^{n-k}
\end{align*}</div>
