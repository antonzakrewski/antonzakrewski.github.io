<span id="ID-9d6a0006-5aec-4d6f-b8b8-9a8b75e43ba8"></span><h1 class="title">flat ring morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A,B\) be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a> and $\varphi: A \rightarrow B$ a <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a>
Then $\varphi$ is said to be flat, if $B$ regarded as \(A\)-module is <a href="20230801-flat_module.html#ID-1fec67f0-a4f2-444f-a53f-3e8e7fcfc491">flat</a> (cf. <a href="20240122-restriction_of_scalars_functor.html#ID-ae7501dc-2c1b-4ad9-a4f4-cf9062905cce">restriction of scalars functor</a>)
</p>
