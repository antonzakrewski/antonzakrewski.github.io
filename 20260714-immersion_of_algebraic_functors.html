<span id="ID-0bea763f-3f4a-40c8-b030-3ec43c8114d0"></span><h1 class="title">immersion of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Lte $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a>, then an immersion is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> $f: Y \hookrightarrow X$ whose image is a <a href="20260714-locally_closed_subfunctor.html#ID-e48b4c8f-cd71-41f6-a55e-c5898278904d">locally closed subfunctor</a>.
