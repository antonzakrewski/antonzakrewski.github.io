<span id="ID-03159950-73a4-48e3-9353-3c613290e5e7"></span><h1 class="title">nilpotence degree of a nilideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $I$ a <a href="20260901-nilideal.html#ID-68d71a67-7ade-47da-8c65-e7eff4789d30">nilideal</a>.
Then the nilpotence degree is the minimal $n \in \mathbb{N}$ such that $I^n = 0$
