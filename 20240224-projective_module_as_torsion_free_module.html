<span id="ID-3df77e6d-8125-435b-9c07-1ec3bbaf897f"></span><h1 class="title">projective modules are torsion free module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $P$ a <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective</a> \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then $P$ is <a href="20230222205807-torsionsfreier_modul.html#ID-46622402-49f7-4528-89d0-1f69bb8c8ca0">torsion-free module</a>
</p>
