<span id="ID-0d7f4dab-63eb-45a8-a85b-1f38d658e680"></span><h1 class="title">separated morphism of schemes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">schemes</a> and $f: X \rightarrow Y$ a <a href="20230915-morphism_of_schemes.html#ID-8074d6c2-788f-4c62-b434-988c10f941a2">morphism of schemes</a>.
Then $f$ is said to be separated, if the <a href="20230915-diagonal_morphism_of_schemes.html#ID-66475669-a716-481c-8dca-9b8b8990fe89">diagonal morphism</a>
</p>

<div class="math-block">\begin{align*}
\Delta_f: Y \rightarrow Y \times_{X}  Y
\end{align*}</div>
<p>
is a <a href="20260807-prim_morphism_of_schemes.html#ID-116c2cf0-b877-4a80-9733-5329dc0dcac8">prim morphism</a>
</p>
