<span id="ID-62513b30-d833-4f0f-97ae-cd527636ef04"></span><h1 class="title">kanonische Abbildung in einen Faktorraum</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> mit einer <a href="20211227225754-aquivalenzrelation_mengenlehre.html#ID-bf83e0aa-4df1-48a5-b910-2837942bdd19">Äquivalenzrelation</a> $\sim$.
Dann ist die kanonische <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> in den <a href="20221224140351-faktorraum_nach_einer_aquivalenzrelation.html#ID-b4f6e2f6-99b2-49a4-bc81-3f11a55ca49b">Faktorraum nach einer Äquivalenzrelation</a>  $M / \sim$ gegeben durch
</p>

<div class="math-block">\begin{align*}
\pi: M \rightarrow&amp; M / \sim \\
x \mapsto [x]_{\sim}
\end{align*}</div>
