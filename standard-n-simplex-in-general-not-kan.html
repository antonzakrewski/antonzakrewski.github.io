<span id="ID-ec2a6d15-13e3-45b0-817c-5e82e2b91cb9"></span><h1 class="title">standard n-simplex in general not kan</h1>

<h2 id="proposition">Proposition</h2>
<p>
the <a href="20240128-represented_simplicial_set.html#ID-ecbc7b48-4158-40fc-8130-b3e8183a17e9">standard n-simplex</a> is not a <a href="20240326-kan_complex.html#ID-ee0dffb7-ca44-444d-84a4-492e65c05e84">Kan complex</a> for $n \geq 1$.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from
</p>
<ul>
<li><a href="20240413-nerve_of_a_category_as_kan_complex_and_groupoid.html#ID-d6611b6a-23a3-4a39-acc4-ef945996f706">nerve of a category as kan complex and groupoid</a> </li>

<li><a href="20240415-nerve_of_n_as_category.html#ID-4dfdd807-c321-4b11-aeee-7c059464a99e">nerve of n as standard simplex</a>   </li>
</ul>
<p>
where $[n]$ is not a <a href="20231128-groupoid.html#ID-faa255e1-0c3c-476f-9d08-78181da165c8">groupoid</a>
</p>
