<span id="ID-971d460d-ad43-48cd-b619-b83936191fce"></span><h1 class="title">regular cardinal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\kappa$ be an infinite <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinal</a>.
Then $\kappa$ is said to be a regular cardinal, if the union of less than $\kappa$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a>, each with cardinality less than $\kappa$ has cardinality less than $\kappa$
</p>
