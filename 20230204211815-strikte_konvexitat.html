<span id="ID-2d6d178d-798d-4613-95a4-30fb83bcc7d2"></span><h1 class="title">strikte Konvexität</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller</a> oder <a href="20230204210448-komplexer_vektorraum.html#ID-b1836b1a-a3bd-4abc-86b6-2706f358a79f">Komplexer</a> <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a>.
Eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $C \subseteq V$ heißt strikt konvex, falls für $v,v' \in C$ und $0 &lt; \lambda &lt; 1$ gilt:
$\lambda v + (1 - \lambda) v'$ liegt im <a href="20221124232014-inneres_einer_topologie.html#ID-85128b09-97b8-44ca-9ff0-99de899da123">Inneren</a> von $C$
</p>
