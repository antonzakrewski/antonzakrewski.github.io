<span id="ID-7583d641-c915-444e-882c-76a5df9d7573"></span><h1 class="title">homotopies in the span category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f_1: X \leftarrow Z \rightarrow Y, f_2: X \leftarrow Z' \rightarrow Y$ be <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> in the <a href="20260822-span_category_for_a_weak_co_waldhausen_structure.html#ID-c89b7c37-2b15-4124-9523-7cd87a495616">span category</a>.
Then a homotopy from $f_1$ to $f_2$ consists of an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> $Z \rightarrow Z'$ over $X \times Y$.
</p>
