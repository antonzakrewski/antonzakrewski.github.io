<span id="ID-b9170973-1e7b-45ff-96d7-44a956cc3a8e"></span><h1 class="title">strongly cocartesian n cube</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category.</a>
</p>

<p>
A cocartesian n-cube is given by a functor
</p>

<div class="math-block">\begin{align*}
X:(\Delta^1)^{n} \rightarrow \mathcal{C}
\end{align*}</div>
<p>
which is a <a href="20241203-infinity_left_kan_extension.html#ID-61e0ecf3-2202-48fc-8af5-3ea0ae73581e">left kan extension</a> of the restriction of $(\Delta^1)^n_{\leq 1}$
</p>
