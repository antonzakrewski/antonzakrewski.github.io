<span id="ID-bfc039f3-0ce6-40db-b327-173ebd29dc0f"></span><h1 class="title">heart of the dash-derived category as nerve</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> with <a href="20231212-enough_projectives.html#ID-8699327b-1cf6-41fc-9eda-522460057625">enough projectives</a>, $\mathcal{D}^{-1}(\mathcal{A})$ the <a href="20241031-infinity_derived_category_of_an_abelian_category.html#ID-59069bbd-e1e3-4207-a14d-573135f3e8a2">dash-derived category</a> with the <a href="20241102-t_structure_on_a_dash_derived_category.html#ID-9af07c07-7632-4cf5-95ab-2b7043d98084">canonical t-structure</a>.
Then the <a href="20241031-heart_of_a_t_structure.html#ID-6cea50da-b823-4b1a-b388-f03c30ce512e">heart</a> is &lt;equivalent&gt; to the <a href="20240129-nerve_of_a_category.html#ID-753bb512-d7c2-4f44-bf03-2ade251eaa72">nerve</a> $N(\mathcal{A})$
</p>
