<span id="ID-ba381e33-fc1d-4f43-8464-f613e6dff1dd"></span><h1 class="title">Axiom of countable choice</h1>

<h2 id="axiom">Axiom</h2>
<p>
For each <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">countable</a> set $\{M_1,...,\}$ containing <a href="20240830-inhabited_set.html#ID-d807a40b-5b58-4411-87c3-b86185fea1f2">inhabited sets</a> $M_i$ there exists a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
</p>

<div class="math-block">\begin{align*}
f: \mathbb{N} \rightarrow \bigcup_{i \in \mathbb{N}} M_i
\end{align*}</div>
<p>
such that $f(n) \in M_n$ for all $n \in \mathbb{N}$
</p>
