<span id="ID-60003b87-1907-4051-b6cf-ac9c2cc69a96"></span><h1 class="title">localization of a moore spectrum is a moore spectrum</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $p$ be a <a href="20230426123442-primelement.html#ID-ffa743e1-94ee-49fe-9647-396eeb233982">prime</a>, $A$ an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $\mathbb{S}_{A}$ the <a href="20260215-moore_spectrum.html#ID-fc4b7793-a90b-42d7-9d80-43fea35d272c">moore spectrum</a>.
Then
</p>

<div class="math-block">\begin{align*}
\mathbb{S}_{A}[p^{-1}] \simeq \mathbb{S}_{A[p^{-1}]}
\end{align*}</div>
