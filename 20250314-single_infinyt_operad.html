<span id="ID-41c62c6c-e023-4c17-bfb3-2f1ffaf6d7cf"></span><h1 class="title">single-colored infinty operad</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: \mathcal{O}^{\otimes} \rightarrow N(\mathrm{Fin}_*)$ be an <a href="20250314-infinity_operad.html#ID-c7cfb23c-f4af-4d83-9bff-0a3a73a51534">infinity operad</a>
Then $p$ is said to be single-colored if any lift
</p>

<div class="math-block">\begin{align*}
\Delta^1 \rightarrow \mathcal{O}^{\otimes}_{ \langle 1 \rangle}
\end{align*}</div>
<p>
is <a href="20240701-essentially_surjective_functor_between_infinity_categories.html#ID-5ac08772-563a-4b4c-8dbf-e734628e4351">essentially surjective</a>
</p>
