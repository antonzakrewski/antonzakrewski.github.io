<span id="ID-ed862443-a0c9-43bc-9880-73fd29a1090d"></span><h1 class="title">regular point of a smooth map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: M \rightarrow N$ be a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a> between <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifolds.</a>
Then $q \in M$ is said to be regular if under the <a href="20250917-tangent_bundle_functor.html#ID-e0b9c376-8c48-41d6-80b7-11b372e6f8f6">tangent bundle functor</a> the restriction
</p>

<div class="math-block">\begin{align*}
D_qf: T_qM \rightarrow  T_{f(q)}N
\end{align*}</div>
<p>
is a <a href="20230303151705-vektorraumepimorphismus.html#ID-76bd1cc2-7338-461c-9c43-48c24c80037c">vectorspace-epimorphism</a>
</p>
