<span id="ID-8c78e4e5-d5bc-4f32-92c6-f5d8062f0f6f"></span><h1 class="title">linksinverses Element</h1>

<h2 id="definition">Definition</h2>

<p>
Sei $M$ eine Menge mit einer <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfung</a> $\circ$ und $e$ ein <a href="20210702074906-neutrales_element_mathe.html#ID-2a95aac8-42e6-4724-9f37-15f6143a35ca">neutrales Element</a> von $M$.
Dann ist $x^{-1} \in M$ ein linksinverses Element von $x \in M$, falls gilt:
</p>

<div class="math-block">\begin{align*}
x^{-1} \cdot x^{-1} = e
\end{align*}</div>
