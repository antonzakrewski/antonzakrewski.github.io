<span id="ID-3023b03a-3cf1-4538-a229-1931c068a9eb"></span><h1 class="title">invertible element</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M, \cdot)$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">Monoid</a> and $m \in M$.
Then $m$ is said to be invertible, if there exists an $m^{-1} \in M$ such that
</p>

<div class="math-block">\begin{align*}
m \cdot m^{-1} = 1
\end{align*}</div>
