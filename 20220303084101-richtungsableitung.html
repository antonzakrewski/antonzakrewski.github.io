<span id="ID-4bf38220-c604-4253-a2eb-7579626f53ac"></span><h1 class="title">Richtungsableitung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $x \in U$ und $v \in \mathbb{R}^n$ so ist
</p>

<div class="math-block">\begin{align*}
(\partial_v F)(x)  \coloneqq \frac{d}{dt}_{t = 0} F(x + t v) \in \mathbb{R}^m
\end{align*}</div>
<p>
die Richtungsableitung von $F$ im Punkt $x$ in Richtung des Vektors $v$
</p>
