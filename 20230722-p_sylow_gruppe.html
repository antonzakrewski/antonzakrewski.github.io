<span id="ID-6dc01061-42f1-44f1-9c11-b313099f13e2"></span><h1 class="title">p-Sylow-Gruppe</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $G$ eine <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endliche</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> sowie $p$ eine <a href="20211228193940-primzahl.html#ID-d7857a86-c778-478d-aa48-7e239fcd8076">Primzahl</a>.
Dann ist eine <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">Untergruppe</a> $H \subseteq G$ eine p-Sylow-Gruppe, falls $H$ eine <a href="20230722-p_gruppe.html#ID-847c0e25-f5eb-45cd-bc0d-356b7bbe2497">p-Gruppe</a> ist und $p$ nicht den <a href="20221023184358-index_gruppentheorie.html#ID-f06e3f56-1c1b-4e9d-b5b1-3e9a25fdb500">Index</a> teilt
</p>
