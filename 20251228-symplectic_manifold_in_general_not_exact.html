<span id="ID-9988daf1-7c88-4b75-a18f-e87d3e48d352"></span><h1 class="title">symplectic manifold in general not exact</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20230907-symplektische_mannigfaltigkeit.html#ID-888018cd-b63e-4fe7-a14e-2af7ab8c2385">symplectic manifold</a>.
Then it is in general not <a href="20251228-exact_symplectic_manifold.html#ID-85477674-bc13-473a-9150-43712e850f22">exact symplectic manifold</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
consider $S^2$ with a <a href="20251216-volume_form_of_an_orientable_riemannian_manifold.html#ID-1a5161b5-797e-45f2-a89e-f480e7d076c6">volume form</a>.
</p>
