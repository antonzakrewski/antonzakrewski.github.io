<span id="ID-66f7c45a-ac23-4abb-8f79-585dc3eb1cd6"></span><h1 class="title">sober space</h1>

<h2 id="definition-classical">Definition (classical)</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
Then $X$ is said to be sobre, if every <a href="20230226044934-irreduzibler_topologischer_raum.html#ID-2c6c8d23-0c2a-4989-afcc-34a0c34d4f36">irreducible</a> <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a> subset is the <a href="20230222175426-abschluss_in_einer_topologie.html#ID-9134c61c-5ec6-4cd6-8928-9ef53b6bfd37">closure</a> of exactly one point
</p>
