<span id="ID-9f9f07b2-ec6b-49bf-89b6-6cab73f1f3a7"></span><h1 class="title">Maximumsnorm</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\tau$ ein <a href="20230301102114-kompakter_raum.html#ID-42e72d20-188a-4a96-b46c-f62f622ff9c7">kompakter Raum</a> und $C(B)$ die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20220819232419-stetigkeit.html#ID-b2d86612-ee0d-43a3-b49c-6953d712ecc5">stetigen</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildungen</a> $f: \tau \rightarrow \mathbb{C}$
Dann ist die Maximumsnorm definiert durch
</p>

<div class="math-block">\begin{align*}
\| f \|_{\infty}  \coloneqq \| f \|_{\mathrm{max}}  \coloneqq \mathrm{max}_{t \in \tau}(f(t))
\end{align*}</div>
