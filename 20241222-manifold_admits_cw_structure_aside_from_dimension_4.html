<span id="ID-b17ced79-4556-4b12-8593-3f8498ba451a"></span><h1 class="title">manifold admits cw structure aside from dimension 4</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">topological manifold</a> with $\mathrm{dim}(M) \neq 4$.
Then $M$ admits a <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Structure</a>
</p>

<p>
the case of $\mathrm{dim}(M) = 4$ is open.
</p>
