<span id="ID-3495c0b0-8eff-479c-bac4-33d0701ce56c"></span><h1 class="title">Konvexkombination</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller</a> oder <a href="20230204210448-komplexer_vektorraum.html#ID-b1836b1a-a3bd-4abc-86b6-2706f358a79f">Komplexer</a> <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a>.
Eine Konvexkombination von $C \subseteq V$ ist ein endliche summe
</p>

<div class="math-block">\begin{align*}
v = \sum_{i=1}^{n} \lambda_i a_i 
\end{align*}</div>
<p>
mit $\lambda_i \geq 0$ und $\sum_{i=1}^{n} \lambda_i = 1$
</p>
