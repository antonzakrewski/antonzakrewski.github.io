<span id="ID-e05bc164-29e2-48fe-8eaf-62a58fa0ae54"></span><h1 class="title">pontryagin number of a smooth manifold</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth</a> \(n\)-dimensional <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">Manifold</a> and $(i_1,...,i_k)$ a multiindex with $\sum_{j = 1}^k i_j = n$
Then the pontryagin number is defined as
</p>

<div class="math-block">\begin{align*}
\langle \prod_{j=1}^k p_{i_i}, [M] \rangle
\end{align*}</div>
