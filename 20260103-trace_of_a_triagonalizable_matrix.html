<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $A$ a <a href="20260103-triagonalizable_matrix.html#ID-91848769-9eed-42bd-8413-b1a3c8e09530">triagonalizable matrix</a>.
