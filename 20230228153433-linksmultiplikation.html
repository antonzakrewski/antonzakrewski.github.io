<h2 id="definition">Definition</h2>
<p>
Sei $(G,\cdot)$ eine <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> und $g \in G$

</p>

<div class="math-block">\begin{align*}
l_g: G \rightarrow G \\
h \rightarrow g \cdot h
