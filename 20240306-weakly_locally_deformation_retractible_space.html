<span id="ID-0abef415-def1-482e-8a61-334610304a69"></span><h1 class="title">weakly locally deformation retractible space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, then $X$ is said to be weakly locally deformation retractible, if for each point $x \in X$ there exists a <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $U$ of $x$ such that $x$ is a <a href="20231110-deformation_retract.html#ID-e7f8f4a1-9a2c-4dcc-bd01-738119d56c0f">deformation retract</a>.
</p>
