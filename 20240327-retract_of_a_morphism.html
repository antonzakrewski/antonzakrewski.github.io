<span id="ID-e679bfdc-8c9e-43a7-85ed-665dcd22f1d6"></span><h1 class="title">retract of a morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $f: A \rightarrow B, f': A' \rightarrow B'$ be <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> in $\mathrm{Mor}(\mathcal{C})$.
Then $f$ is said to be a retract of $f'$, if there exists a <a href="20210702075801-kommutativgesetz.html#ID-2a5d302a-0c7a-4757-83be-0731dfa75d86">commutative</a> diagram
</p>
