<span id="ID-a9f4a0ba-3f3a-48f3-8565-bbf3f23bec79"></span><h1 class="title">nonirrelevant ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a> and $R = \bigoplus_{m \in m} R_m$ a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a>.
Then a <a href="20230904-homogeneous_ideal.html#ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3">homogeneous ideal</a> $\mathfrak{h}$ is said to be nonirrelevant, if $R_+ \not\subseteq \mathfrak{h}$
</p>
