<span id="ID-fec498dd-05ec-4e64-8a92-13474e0ee3f3"></span><h1 class="title">unzerlegbarer Modul</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> und $M$ ein $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a>.
Dann ist $M$ unzerlegbar, falls keine <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Moduln</a> $M_1,M_2 \neq 0$ existieren mit:
</p>

<div class="math-block">\begin{align*}
M \cong M_1 \oplus M_2
\end{align*}</div>
