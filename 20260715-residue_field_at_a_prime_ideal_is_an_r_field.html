<span id="ID-78b1ee4d-d939-4a4b-b149-24d16d31b105"></span><h1 class="title">residue field at a prime ideal is an R-field</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $\mathfrak{p}$ a <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a>.
Then the <a href="20240430-residue_field_at_a_prime_ideal.html#ID-9f56007a-54f3-40a3-927f-20feadd1b5f5">residue field</a> is an <a href="20260714-r_field.html#ID-2dce005c-122e-49ca-9289-a45ce7e59bdf">R-field.</a>
</p>

<h2 id="proof">Proof</h2>
<p>
observe that there exist ring maps
</p>

<div class="math-block">\begin{align*}
R \rightarrow R/\mathfrak{p} \rightarrow (R/\mathfrak{p})_{0}
\end{align*}</div>

</div>
