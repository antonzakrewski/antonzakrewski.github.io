<span id="ID-114308bd-ddf7-46e0-a7bc-82623eb4aa0e"></span><h1 class="title">weakly locally compact space</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $(X, \mathcal{T})$ is said to be locally compact, if every point $x \in X$ has a <a href="20230301102114-kompakter_raum.html#ID-42e72d20-188a-4a96-b46c-f62f622ff9c7">compact</a> <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a>
</p>
