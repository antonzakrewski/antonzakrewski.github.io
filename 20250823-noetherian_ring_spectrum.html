<span id="ID-518ea20c-91b1-4728-a1ee-e28a64fc4280"></span><h1 class="title">noetherian ring spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be an \(\mathbb{E}_n\)-<a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a> for $2 \leq n \leq \infty$.
Then $R$ is said to be noetherian, if
</p>
<ol>
<li>$R$ is <a href="20250823-left_coherent_ring_spectrum.html#ID-d4e7ab4c-f7ec-456a-9388-31ca9f3d6a97">left coherent</a> </li>

<li>the <a href="20250820-underlying_discrete_ring_of_a_ring_spectrum.html#ID-f502c426-c61f-459d-8942-63fa5d0ca50e">underlying discrete ring</a> $\pi_0(R)$ is a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian ring</a> </li>
</ol>
