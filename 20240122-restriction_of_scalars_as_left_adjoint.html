<h2 id="proposition">Proposition</h2>
<p>

then the <a href="20240122-restriction_of_scalars_functor.html#ID-ae7501dc-2c1b-4ad9-a4f4-cf9062905cce">restriction of scalars functor</a> is a <a href="20220831221352-rechtsadjungierte.html#ID-9d92e651-1d26-4e9b-a0b9-32a09ca84328">right adjoint</a> to the <a href="20240515-co_extension_of_scalars.html#ID-5f204a05-3f5b-4c8b-b27d-d994dad6654b">co-extension of scalars</a>.
