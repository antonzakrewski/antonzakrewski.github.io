<span id="ID-498fc03f-81c4-4887-85a2-2827e40a514b"></span><h1 class="title">kappa filtered category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $\kappa$ be a <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinal</a> (<a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinal</a>).
Then $\mathcal{C}$ is said to be $\kappa$ filtered, if for any set containing less than $\kappa$ many <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> $f_i: A_i \rightarrow B_i$ there exists a <a href="20220902145849-kokegel_kategorientheorie.html#ID-05dbe76b-b880-4e2c-81fd-ea9a3c6ed3fd">Cocone</a>
</p>
