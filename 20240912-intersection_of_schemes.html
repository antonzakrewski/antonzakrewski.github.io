<span id="ID-5d88bc1d-669e-4fd4-a907-22f3ea6d66ab"></span><h1 class="title">intersection of open subschemes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_X, O_i)$ be a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a>, $Y_1,Y_2$ be <a href="20230909-open_subscheme.html#ID-d5d26a4c-5f81-4c3f-9588-11fa4e53330f">open subscheme</a>
Then the intersection is defined as <a href="20230806-pullback.html#ID-730c4312-492d-4b9c-a347-9281309d3e6f">pullback</a>
</p>

<div class="math-block">\begin{align*}
Y_1 \cap Y_2 \coloneqq Y_1 \times_X Y_2
\end{align*}</div>
