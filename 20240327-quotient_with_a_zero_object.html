<span id="ID-716d8672-4ebe-429d-8caf-81e7442df481"></span><h1 class="title">quotient with a zero object</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20231215-pointed_category.html#ID-0783589b-3d52-46d9-a7ad-fb1c3130a223">pointed</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $B$ an <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a>.
Then the quotient
</p>

<div class="math-block">\begin{align*}
B/0
\end{align*}</div>
<p>
is canonically isomorphic to $B$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20240309-coequalizer_and_equal_maps.html#ID-d9a0dd2d-7fd5-402c-bdfa-def1a3668069">coequalizer and equal maps</a>
</p>
