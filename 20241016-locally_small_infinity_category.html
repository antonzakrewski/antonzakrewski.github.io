<span id="ID-b6ac7f24-6e46-4514-a9be-f8301ecc15df"></span><h1 class="title">locally small infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>.
Then $\mathcal{C}$ is said to be locally small, if the <a href="20240603-mapping_space_of_objects_in_a_quasi_category.html#ID-b5b60979-1586-4548-b06f-5ceca4b045fa">mapping space</a> is an <a href="20241016-essentially_small_infinity_category.html#ID-7257f253-9d7d-4a1f-a746-029e888c7190">essentially small infinity category</a>
</p>
