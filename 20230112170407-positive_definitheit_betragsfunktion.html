<span id="ID-9c779d96-5305-4e3d-b94f-108045d792f0"></span><h1 class="title">Positive Definitheit (Betragsfunktion)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\phi$ eine Betragsfunktion eines <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereichs</a> $D$ mit $x \in D$.
Dann gilt:
</p>

<div class="math-block">\begin{align*}
\phi(x) \geq&amp; 0 \\
\phi(x) = 0 \Leftrightarrow&amp; x = 0
\end{align*}</div>
