<span id="ID-3e3a3171-127b-4439-a0e1-224a54c26b78"></span><h1 class="title">retract (category theory)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $A,B \in \mathrm{Ob}(\mathcal{C})$.
Then $A$ is said to be a retract, if there exists a <a href="20230914-split_mono.html#ID-62a5ec35-cc96-4b7f-b94c-d49e565a6e6f">split mono</a>
begin{align*}
\iota: A \rightarrow B
\end{align*}
</p>
