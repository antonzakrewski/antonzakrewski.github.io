<span id="ID-bb388d52-298a-4714-b290-80d9ab79eb2e"></span><h1 class="title">Modulhomomorphismus</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M,M'$ <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Module</a> über einem <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> $R$.
Ein Modulhomomorphismus ist eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f: M \rightarrow M'$, so dass für $m_1,m_2 \in M$ und $r \in R$ gilt:
</p>

<div class="math-block">\begin{align*}
f(m_1 + m_2) =&amp; f(m_1) + f(m_2) \\
f(r \cdot m_1) =&amp; r \cdot f(m_1)
\end{align*}</div>

</div>
