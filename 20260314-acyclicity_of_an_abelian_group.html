<span id="ID-74eef69b-f4e2-4d84-84d9-69c7262a5d2d"></span><h1 class="title">acyclicity of an abelian group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A,B$ be <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a>.
Then $A \simeq B$ have the same type of acyclicity, if for each prime $p$
</p>
<ol>
<li>if $A$ has \(p\)-primary torsion, then so does $B$</li>

<li>if $p$ acts invertibly on $A$, then $p$ also acts invertibly on $B$.</li>
</ol>
