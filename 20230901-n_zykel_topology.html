<span id="ID-037d17dd-bb50-4658-b157-29c094aba2c7"></span><h1 class="title">singular n-cycle</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $\alpha \in C_n(X)$ eine <a href="20230901-i_kette_topology.html#ID-8d08bd27-b7a6-4a75-b50c-12b033ae1da4">singuläre n-Kette</a>.
Dann ist $\alpha$ ein \(n\)-Zykel, falls für die <a href="20230901-boundary_map_of_a_simplex.html#ID-a0218452-70ae-4217-8959-07378b2ff32e">Randabbildung</a> gilt
</p>
