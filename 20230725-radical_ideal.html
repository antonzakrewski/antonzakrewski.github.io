<span id="ID-a09d853a-3453-49c0-82a0-5ee102e45c53"></span><h1 class="title">radical ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $\mathfrak{a}$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then $\mathfrak{a}$ is a radical ideal, if
</p>

<div class="math-block">\begin{align*}
\mathfrak{a} = \sqrt{\mathfrak{a}}
\end{align*}</div>
<p>
see: <a href="20230725-radical_of_an_ideal.html#ID-a5fd42b5-ba84-4c7e-8a5b-e36101a7fa1e">radical of an ideal</a>
