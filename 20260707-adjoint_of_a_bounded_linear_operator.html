<h2 id="definition">Definition</h2>
<p>
Let $X_1,X_2$ be <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector spaces</a> and $T \in \mathrm{BL}(X_1,X_2)$ a <a href="20260509-bounded_operator.html#ID-c9aa0020-0a75-4250-9116-0d18e171bb90">bounded</a> <a href="20260510-linear_functional.html#ID-597a46ba-577c-4dda-ae9f-c83b367265ef">linear functional</a>.
Then the adjoint operator of $T$ is defined as map on <a href="20260510-dual_space_of_a_normed_space.html#ID-35adc2c5-7bb0-4d73-b505-a0efcd8f0b4d">dual spaces</a>
</p>

<div class="math-block">\begin{align*}
T^{\times}: X_2^* \rightarrow X_1^*
\end{align*}</div>
