<span id="ID-ae3158fa-9d70-406a-8e09-b27987d14633"></span><h1 class="title">finite dimensional subspace of an infinite dimensional space is nowhere dense</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $F \subseteq X$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> subspace of an <a href="20230826-infinite.html#ID-66aecdb2-720e-4e41-9a27-dab1700474fc">infinite</a> dimensional <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a>.
Then $F$ is nowhere dense
</p>

<h2 id="proof">Proof</h2>
<p>
follows from: <a href="20260512-proper_subspace_of_a_normed_vector_space_is_nowhere_dense.html#ID-04e90cd6-55e9-43b8-9daf-ca73e9087314">proper subspace of a normed vector space is nowhere dense</a>
</p>
