<span id="ID-591124a6-db79-4d7f-bcb9-8cc41f91ce70"></span><h1 class="title">homotopy group functor of anima</h1>

<h2 id="definition">Definition</h2>
<p>
The \(n\)-th homotopy group functor of anima is defined as <a href="20241208-infinity_homotopy_category_functor.html#ID-55df1197-802b-4e72-9a64-1f2f2e32ca2b">homotopy category</a> of the <a href="20241126-infinity_covariant_map_functor.html#ID-6f040bcf-61fc-432f-96b2-9b65eb2c2470">covariant mapping space</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{map}_{\mathrm{An}_{*/}}(S^n, -)
\end{align*}</div>

<p>
where $S^n$ is an <a href="20250310-anima_sphere.html#ID-f2ffba28-2097-4e2d-a0b3-41b20fb568bb">anima n-sphere</a>
</p>
