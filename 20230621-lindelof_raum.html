<span id="ID-4b7ffde3-cb31-40a1-a1dc-674eb0998390"></span><h1 class="title">Lindelöf-Raum</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>.
Dann ist $X$ ein Lindelöf-Raum, falls jede <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">offene Überdeckung</a> eine <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">abzählbare</a> <a href="20221224121300-teiluberdeckung.html#ID-592bb00c-d4d2-4853-a393-ef6977c82437">Teilüberdeckung</a> besitzt.
</p>
