<span id="ID-cceefec8-5ba1-44c6-9c5b-ae8028c77d9c"></span><h1 class="title">closed category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(\mathcal{C}, \mathbb{1}, \otimes)$ be a <a href="20221223192944-monoidal_category.html#ID-e7314567-2c1d-4ebd-8aa0-323b3145b541">monoidal</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{C}$ is said to be closed, if for $X \in \mathrm{Ob}(\mathcal{C})$ the <a href="20231110-tensor_functor_of_a_monoidal_category.html#ID-beccdd56-1629-4484-b2ea-36e115686584">tensor functor</a>
</p>

<div class="math-block">\begin{align*}
- \otimes X: \mathcal{C} \rightarrow \mathcal{C}
\end{align*}</div>
<p>
is a <a href="20220831221344-linksadjungierte.html#ID-1e87e6b9-24df-41fb-bc1b-d35cfd2eaa7f">left adjoint</a>
</p>
