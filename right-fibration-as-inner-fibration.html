<span id="ID-7f96497c-1107-4059-802c-8fb0b7da3bf1"></span><h1 class="title">right fibration as inner fibration</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $f: X \rightarrow Y$ a <a href="20240327-right_fibration.html#ID-cab43683-f467-4a4d-8c8e-9635ca3f01f1">right fibration</a>.
Then $f$ is also an <a href="20240327-inner_fibration.html#ID-1915e43c-9378-4583-b34c-5f4e084cb5a0">inner fibration</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows, as an <a href="20240128-inner_horn.html#ID-9f3066a1-77af-4de4-b1f9-331f8aa919e8">inner horn</a> is by definition also a <a href="20240404-right_horn.html#ID-5b345097-a9ce-413a-8ec6-c3bfcd799e26">right horn</a>
</p>
