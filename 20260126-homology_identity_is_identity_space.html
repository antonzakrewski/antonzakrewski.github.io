<span id="ID-494828e3-e8e5-4f37-9047-77300f0a4ac4"></span><h1 class="title">homology-identity space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>.
Then $X$ is a homology-identity is identity space if for any map $f: X \rightarrow X$ if:
</p>
<ul>
<li>$H_*(f,\mathbb{Z}) = \mathrm{id}$ implies that $f$ is equivalent to the identity.</li>
</ul>
