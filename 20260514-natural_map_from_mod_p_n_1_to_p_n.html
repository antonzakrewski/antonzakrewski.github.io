<span id="ID-630bf7dc-205c-4426-b600-94d1387b1ded"></span><h1 class="title">natural map from mod p^n+1 to p^n in an additive category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20241217-additive_infinity_category.html#ID-e168d6e3-8dc6-424e-a950-8b24f6ed45f8">additive category</a> with <a href="20241022-cofiber_of_an_infinity_morphis3.html#ID-c9321dad-6e04-418b-a0a5-ad8546205938">cofibers</a>.
Then there exists a <a href="20240624-natural_transformation_between_functors_of_infinity_categories.html#ID-1bf3c0ae-aa9c-4c2f-99b2-984072543d82">natural map</a>
</p>

<div class="math-block">\begin{align*}
(-)/p^{n+1} \rightarrow (-)/p^{n}
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
this follows from the map of cofiber sequences
</p>
