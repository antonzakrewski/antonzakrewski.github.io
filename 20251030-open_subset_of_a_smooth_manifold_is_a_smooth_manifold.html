<span id="ID-0892038a-94a0-4e38-af92-74727ef4de23"></span><h1 class="title">open subset of a smooth manifold is a smooth manifold</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a> and $U\subseteq M$ an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a>
Then $U$ is also canonically a smooth manifold and <a href="20250810-smooth_submanifold.html#ID-3a884e6e-7704-4dc2-a959-3a332e30f851">smooth submanifold</a> of $M$
</p>
