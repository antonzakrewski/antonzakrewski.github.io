<span id="ID-2a95aac8-42e6-4724-9f37-15f6143a35ca"></span><h1 class="title">neutral element</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>, $\cdot$ eine <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfung</a> auf $M$.
Dann ist $e \in M$ ein neutrales Element, wenn es sowohl ein <a href="20220103211858-linksneutrales_element.html#ID-2bfee35b-bab8-449a-b082-ce1e1a11f8c6">linksneutrales</a> als auch <a href="20220103211916-rechtsneutrales_element.html#ID-449c4481-b2ca-47f8-9558-8e51f2957690">rechtsneutrales Element</a> ist, d.h.
</p>

<div class="math-block">\begin{equation}
\forall x \in M (x \circ e = e \circ x = x)
\end{equation}</div>
