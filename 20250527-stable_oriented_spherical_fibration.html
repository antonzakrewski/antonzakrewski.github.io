<h2 id="definition">Definition</h2>
<p>
A stable spherical fibration over an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a> $X$ is defined as map
</p>

<div class="math-block">\begin{align*}
X \rightarrow \mathrm{BF}
\end{align*}</div>
<p>
where $\mathrm{BF} = \mathrm{colim} \mathrm{BF}(n)$ is the <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimit</a>
