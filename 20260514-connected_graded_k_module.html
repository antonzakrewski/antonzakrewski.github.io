<span id="ID-5a5965d8-ef7a-4ef0-8bdd-6fd6fb6a5f6f"></span><h1 class="title">connected graded A-module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ a $\mathbb{Z}$ <a href="20230904-graded_module.html#ID-5508d8a0-9b2a-476f-95ca-a6502e8eb0f9">graded module</a>.
Then $M$ is said to be connected, if
</p>
<ol>
<li>$M_0 \cong A$</li>

<li>$M_{n} = 0$ for $n &lt; 0$.</li>
</ol>
