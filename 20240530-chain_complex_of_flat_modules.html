<span id="ID-6946c789-81a1-4c72-9cc6-c1543baa7910"></span><h1 class="title">chain complex of flat modules</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $\mathrm{RMod}$ the <a href="20230225170152-kategorie_mod.html#ID-15b21b3a-18bb-4d60-a716-c69681d7222d">category RMod</a> and $\mathrm{Ch_*}(\mathrm{RMod})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a> and $C_*$ a <a href="20230802-chain_complex.html#ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36">chain complex</a>.
Then $C_*$ is said to be a chain complex of flat modules, if it is degreewise <a href="20230801-flat_module.html#ID-1fec67f0-a4f2-444f-a53f-3e8e7fcfc491">flat</a>
</p>
