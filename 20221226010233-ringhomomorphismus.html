<span id="ID-136298f7-3132-4bd7-934f-0eefaa48fcf9"></span><h1 class="title">ring homomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $R,S$ <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ringe</a>.
Eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f: R \rightarrow S$ ist ein Ringhomomorphismus, falls für $r,r'$ gilt
</p>

<div class="math-block">\begin{align*}
f(r + r') =&amp; f(r) + f(r') \\
f(r \cdot r') =&amp; f(r) \cdot f(r') \\
f(1_r) =&amp; 1_s
\end{align*}</div>
