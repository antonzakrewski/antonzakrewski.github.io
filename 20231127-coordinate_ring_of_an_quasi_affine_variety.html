<span id="ID-0e5cf6e1-6c4b-4c38-a4b8-37f5a9b3ca17"></span><h1 class="title">coordinate ring of an quasi-affine variety</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $A \subseteq \mathbb{A}_K^n$ a <a href="20230906-quasi_affine_variety.html#ID-3ef8df48-4b44-4453-a107-37c89deecacc">simple quasi-affine variety</a>.
Then the coordinate ring of $A$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathcal{O}(A) \coloneqq K[X_1,...,X_n]/I(A)
\end{align*}</div>
<p>
where $I(A)$ is the <a href="20230725-vanishing_ideal.html#ID-fadecab8-e770-4049-9226-525ea11f5cbc">vanishing ideal</a>
</p>
