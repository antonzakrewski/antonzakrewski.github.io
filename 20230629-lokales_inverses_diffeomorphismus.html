<span id="ID-76f945ec-0bac-4fc5-8012-d15ecfd2ef2d"></span><h1 class="title">lokales Inverses (Diffeomorphismus)</h1>

<h2 id="defintion">Defintion</h2>
<p>
Seien $M,N$ <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">Mannigfaltigkeiten</a> und $f: M \rightarrow N$ ein <a href="20230629-lokaler_diffeomorphismus.html#ID-89715700-4bab-4518-b978-9bf66cff1ab1">lokaler Diffeomorphismus</a> in $p \in U$ für eine <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebung</a> $U \subseteq M$.
Dann ist für $f_{\vert U} \rightarrow f_{\vert U}[U]$ das lokale Inverse $f^{-1}_{\vert U}$ die <a href="20220927213528-umkehrabbildung.html#ID-6852cd17-4614-4655-ad66-85727c75b0f5">Umkehrabbildung</a>
</p>
