<span id="ID-96ec13ee-e919-45b6-8f5e-900856d35096"></span><h1 class="title">stiefel scheme of a module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be an \(k\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> over a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $k$.
Then the Stiefel scheme of $M$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{St}_n(M)(R) = \{\textrm{ surjective } R \textrm{ linear maps } M \otimes_{k} R \twoheadrightarrow R^n\}
\end{align*}</div>
