<span id="ID-af862bb4-5917-409d-a426-3d3e918d1ac1"></span><h1 class="title">generator of a module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>  and $S \subseteq M$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>
Then $S$ is said to generate $M$, if
</p>

<div class="math-block">\begin{align*}
\langle S\rangle = M
\end{align*}</div>

<p>
i.e. each element $m$ of $M$ is a finite sum
</p>

<div class="math-block">\begin{align*}
m = \sum \alpha_i s_i
\end{align*}</div>

</div>
