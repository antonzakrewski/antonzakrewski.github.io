<span id="ID-47db7e3b-f8dd-43d1-9b79-14d4fe85ae47"></span><h1 class="title">Hom anima functor preserves monomorphisms</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $x \in \mathcal{C}$ an object.
Then the functor $\mathrm{Hom}_{\mathcal{C}}(x,-)$ preserves <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphisms</a>
</p>
