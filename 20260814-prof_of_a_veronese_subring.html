<span id="ID-8e859a3c-edb9-4313-9e1b-6660cf5f3089"></span><h1 class="title">Proj of a veronese subring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $d \geq 1$, then there exists an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Proj}(A) \simeq \mathrm{Proj}(A^{(d)})
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
follows as the inclusion $d \mathbb{N}^{\mathrm{div}}_{&gt; 0} \rightarrow \mathbb{N}^{\mathrm{div}}_{&gt; 0}$ is <a href="20241017-coinitial_infinity_functor.html#ID-7c2e8e73-1566-48ed-a481-8ddc45412c3a">coinitial</a>.
</p>
