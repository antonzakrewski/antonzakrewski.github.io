<span id="ID-619e787c-ddd7-4b71-8884-d9e87e173255"></span><h1 class="title">weakly proper action</h1>

<h2 id="definition">Definition</h2>
<p>
Let $E$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $G$ a <a href="20230226210828-topologische_gruppe.html#ID-0aa20bcb-5c3d-4d06-aeee-e61b46a46e48">topological group</a> and
</p>

<div class="math-block">\begin{align*}
\varphi: E \times G \rightarrow E
\end{align*}</div>
<p>
a <a href="20230802-free_action.html#ID-48265c0f-9e40-425c-986d-16b06e5f356c">free</a> <a href="20231020-topological_group_action.html#ID-38e7118c-8f31-4e4f-b958-9af22f05af15">topological group action</a>.
</p>

<p>
Then $\varphi$ is said to be weakly proper, if the <a href="20241130-translation_map_of_a_free_action.html#ID-fde72e68-9a08-4147-8520-1647063dfe63">translation map of a free action</a> is <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a>
</p>
