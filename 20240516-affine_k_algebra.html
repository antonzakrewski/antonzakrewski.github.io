<span id="ID-97842af2-9fdf-401e-8476-926f191c07f1"></span><h1 class="title">affine k-algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $k$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $A$ a <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">k-Algebra</a>.
Then $A$ is said to be an affine k-algebra, if $A$ is <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative</a> and <a href="20230725-reduced_ring.html#ID-1480b16c-0de6-4614-9ae9-a70abea088a9">reduced</a> as <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> and of <a href="20230731-finitely_generated_a_algebra.html#ID-20861333-797d-4ab1-9ad5-375661f357fc">finite type</a>.
</p>
