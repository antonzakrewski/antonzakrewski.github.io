<span id="ID-937b0dfd-c18e-46eb-89f4-aabc9cd9b0b0"></span><h1 class="title">terminal object in CRing</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20230112165803-nullring.html#ID-638f0759-37dc-472c-bb27-7cfccbd3c550">zero ring</a> is the <a href="20220825145511-terminales_objekt.html#ID-16825b5e-51d8-4e5e-ac19-2a05cd9fb110">terminal object</a> in the <a href="20230225170140-kategorie_cring.html#ID-bc232c14-ca9c-476c-8b94-67f3d8781a26">category CRing</a>
</p>

<h2 id="proof">Proof</h2>
<p>
for a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $R$ the only <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> is
</p>

<div class="math-block">\begin{align*}
\varphi: R \rightarrow&amp; 0 \\
r \mapsto&amp; 0
\end{align*}</div>
