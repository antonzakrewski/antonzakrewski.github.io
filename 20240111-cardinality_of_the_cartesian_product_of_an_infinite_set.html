<span id="ID-b9542be5-129e-4e8b-89d1-cb3852fee1f0"></span><h1 class="title">cardinality of the cartesian product of an infinite set</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be an <a href="20230826-infinite.html#ID-66aecdb2-720e-4e41-9a27-dab1700474fc">infinite</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>.
Then for any <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $F$ we get
</p>

<div class="math-block">\begin{align*}
\mathrm{card}(\prod_{F} A) = \mathrm{card}(A)
\end{align*}</div>
