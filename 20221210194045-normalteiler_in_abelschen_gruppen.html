<span id="ID-2560bb17-1bb6-42e7-91d6-5187eaf040c3"></span><h1 class="title">Normalteiler in Abelschen Gruppen</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $G$ eine <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelsche</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> und sei $U \leq G$ eine <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">Untergruppe</a>.
Dann ist $U$ ein <a href="20221210192900-normalteiler.html#ID-f971f946-d0ca-444a-a450-efbef237a278">Normalteiler</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
Jede <a href="20221210192513-konjugation_in_einer_abelschen_gruppe.html#ID-ff61edcf-385f-46b3-9253-b7cceac1844d">Konjugation in einer Abelschen Gruppe</a> ist die <a href="20220928131442-identitatsabbildung.html#ID-82204cd3-d2c2-48a7-91fe-4b42e9884bda">Identitätsabbildung</a>.
</p>
