<span id="ID-a1fa5115-e292-441f-a5b9-ea6a4f7faf25"></span><h1 class="title">homological euler characteristic</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240223-homologically_finite_topological_space.html#ID-b3b41cef-afdf-4070-ba0a-3fd50cd32fd2">homologically finite topological space</a>.
Then the euler characteristic is defined as
</p>

<div class="math-block">\begin{align*}
\chi_{\mathrm{hom}}(X) = \sum_{n \geq 0} (-1)^n \mathrm{rank}(H_n(X)) 
\end{align*}</div>

<p>
<a href="20240223-rank_of_an_abelian_group.html#ID-a1d645ec-9615-4d3f-8eed-fbfd4edc1153">rank of an abelian group</a>
