<span id="ID-3657802a-fbd8-48c2-a64d-6ac3ddeaf267"></span><h1 class="title">transitivität der absoluten stetigkeit</h1>

<h2 id="proposition">Proposition</h2>
<p>
Sei $(X, \mathcal{A})$ ein <a href="20230302132218-messraum.html#ID-7d8d7a50-6fe1-4cee-a847-365b73490c86">Messraum</a>, $\mu,\nu,\eta$ <a href="20241014-measure.html#ID-fad27267-4c6a-4159-831f-36ae94e4012e">Maß</a>e mit $\eta &lt;&lt; \nu$ und $\nu &lt;&lt; \mu$.
Dann folgt
</p>

<div class="math-block">\begin{align*}
\eta &lt;&lt; \mu
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
gegeben $A$ mit $\eta(A) = 0$.
Dann folgt $\nu(A) = 0$ bzw. auch $\mu(A) = 0$
</p>
