<span id="ID-2f46736d-5278-4cfb-96ff-3fb3e82639c3"></span><h1 class="title">weak AB5 axiom</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C} \subseteq \mathrm{Cat}$ be a <a href="20240711-sub_infinity_category.html#ID-79df3d53-7239-474c-bfa4-a3fdbcf588d6">subcategory</a>
Then $\mathcal{C}$ is said to satisfy the weak AB5 axiom, if the class of <a href="20240701-fully_faithful_functor_between_infinity_categories.html#ID-bb0d3e0e-92a5-4687-999c-a99d4043ea38">fully faithful</a> <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a>s is closed under <a href="kappa-filtered-infinity-colimit.html#ID-b8bba4f3-4065-46e4-9f89-f79a3b3fbb97">filtered colimits</a>
</p>
