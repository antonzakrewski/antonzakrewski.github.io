<span id="ID-d5c9cb6b-d182-4e92-a212-3ca24565dc36"></span><h1 class="title">leitkoeffizient einer Monomordnung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">kommutativer Ring</a> und $f = \sum_{i=0}^{n} r_i X^i \in R[X]$ ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> vom <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">Grad</a> $n$.
Dann ist für eine <a href="20231030-monomordnung.html#ID-6e957901-1e39-4a42-936c-cdb51c862a3c">Monomordnung</a> $&gt;$ der Leitkoeffizient definiert als
</p>

<div class="math-block">\begin{align*}
LC(f) = \alpha_{\mathrm{multideg}(f)} \in R
\end{align*}</div>
