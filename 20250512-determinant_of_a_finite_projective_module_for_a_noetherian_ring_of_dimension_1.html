<span id="ID-e7e8aa27-7dd5-4584-8567-d815a56370f3"></span><h1 class="title">determinant of a finite projective module for a noetherian ring of dimension 1</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian ring</a> of <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimension</a> $\mathrm{dim}(R) = 1$ and $P$ a <a href="20250505-finite_projective_module.html#ID-469e6e1a-935f-41f5-a2c4-ac9754390664">finite projective module</a>.
Then
</p>

<div class="math-block">\begin{align*}
P \simeq \mathrm{det}(P) \oplus R^{\mathrm{rk}(P) - 1}
\end{align*}</div>
