<span id="ID-926b3a11-a0e7-4d65-a5fc-e24df98fae0d"></span><h1 class="title">nilpotency class of a nilpotent group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20240317-nilpotent_group.html#ID-822a30f5-0ad9-43db-aa27-03b7737ce540">nilpotent group</a>, then its nilpotency class is defined as smallest $n \in \mathbb{N}$ with
</p>

<div class="math-block">\begin{align*}
\Gamma^n(G) = 1
\end{align*}</div>

see <a href="20241104-central_series_of_a_group.html#ID-c7c01e13-f44c-44e0-a737-7cf4231cc568">lower central series of a group</a>
