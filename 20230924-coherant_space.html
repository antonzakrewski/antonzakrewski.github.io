<span id="ID-d099c8b8-66f3-4a66-8da0-e5c86f7e5569"></span><h1 class="title">coherant space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is said to be a coherant space, if there exists a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $A$ such that the <a href="20230725-zariski_topology.html#ID-1535e0f9-be74-4d53-9ca1-c88439a2a34b">Zariski topology</a> is <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphic</a> to $X$, i.e.
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(A) \cong X
\end{align*}</div>
