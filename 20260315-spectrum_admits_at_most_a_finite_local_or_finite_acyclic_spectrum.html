<span id="ID-7bfe559a-8fec-4c0a-9b09-f67715317b33"></span><h1 class="title">spectrum admits at most a finite local or finite acyclic spectrum</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $E$ be a <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a>.
Suppose there exists a <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectrum</a>, which is <a href="20260314-e_local_spectrum.html#ID-428f60df-5c7b-4edd-9bfd-f9fcb062f3f3">E-local spectrum</a>.
</p>

<p>
Then there does not exist a finite <a href="20260215-e_acyclic_spectrum.html#ID-dc701420-f509-471a-935c-d2c2f28108d2">E-acyclic spectrum</a>.
</p>
