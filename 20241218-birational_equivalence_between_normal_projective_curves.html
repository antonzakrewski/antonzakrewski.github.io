<span id="ID-7fe93e55-0625-4232-af28-8166fdb06320"></span><h1 class="title">birational equivalence between normal projective curves as isomorphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240905-normal_quasi_projective_variety.html#ID-7deb6f1d-d8ed-484e-ae33-090fd273e450">normal</a> <a href="20230901-projective_variety.html#ID-15ff0e97-1d25-461a-aef8-dac9ace2de9c">projectivea</a> curves.
Then any <a href="20240902-birational_equivalence.html#ID-1d4d1fd6-8d64-4055-98a2-9fb5f05d33c1">birational equivalence</a> between $X,Y$ is already an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> as <a href="20240903-regular_map_on_quasi_projective_varieties.html#ID-6c16f5fa-bbb6-427e-878b-24be655ac3ad">regular map</a>
</p>
