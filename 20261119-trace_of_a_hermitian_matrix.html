<span id="ID-dc6dfe1e-67ac-49c0-9c49-dc883ed6cd5b"></span><h1 class="title">trace of the inverse of a unitary matrix</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A \in U(n)$ be a <a href="20230628-unitare_matrix.html#ID-95ce0efd-44be-410d-8455-4388b16899b6">unitary matrix</a>.
Then $\mathrm{tr}(A^{-1}) = \overline{\mathrm{tr}(\overline{A})}$.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from $\mathrm{tr}(\overline{A}^t) = \overline{\mathrm{tr}(A)}$.
</p>
