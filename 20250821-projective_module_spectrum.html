<span id="ID-1d9d9118-b853-48cc-9688-954d8bb6a724"></span><h1 class="title">projective module spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a>, then a <a href="20250621-module_over_a_ring_spectrum.html#ID-ff15d87e-6808-4cb5-ab80-8484014dbc6d">module spectrum</a> is said to be projective, if it is a <a href="20250401-infinity_projective_object.html#ID-95872f1b-c251-4e89-a2ec-d3a6c96cb1ac">projective object</a> in the <a href="20250821-category_of_connective_modules.html#ID-beed965b-244b-4186-b010-dc455eee955b">category of connective modules</a>.
</p>
