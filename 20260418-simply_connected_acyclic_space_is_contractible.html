<span id="ID-b30375e4-8b74-4f1d-9c2a-4a313814c29f"></span><h1 class="title">nilpotent, acyclic space is contractible</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20251027-nilpotent_anima.html#ID-db49367c-e42e-4ff3-aae8-3583823d47d7">nilpotent</a>, <a href="20250425-acyclic_space.html#ID-c16c914a-c7ff-494a-bc99-e09fc9af2dd8">acyclic space</a>.
Then $X$ is <a href="20240703-contractible_simplicial_set.html#ID-5db3dfcd-9f98-41a8-9550-a49351d833cf">contractible.</a>
</p>
