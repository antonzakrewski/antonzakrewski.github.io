<span id="ID-87d3729f-2548-4561-977e-ea2b3b3601b9"></span><h1 class="title">euler characteristic of a connected sum</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M,M'$ be two $n$ <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">Manifolds</a>
Then the <a href="20240223-euler_characteristic.html#ID-a1fa5115-e292-441f-a5b9-ea6a4f7faf25">euler characteristic</a> of the <a href="20260114-connected_sum_of_manifolds.html#ID-3f1bc0a3-8f9e-460d-948a-551d2eb48d77">connected sum</a> is given by
</p>

<div class="math-block">\begin{align*}
\chi(M # M') = \chi(M) + \chi(M') - \chi(S^n)
\end{align*}</div>
