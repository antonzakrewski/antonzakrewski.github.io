<span id="ID-d5f3d002-631e-47ef-adce-586da37a3230"></span><h1 class="title">skyscraper sheaf</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $x \in X$, $\mathcal{C}$ a <a href="20230923-complete_category.html#ID-8877dd56-54c0-42cc-a1d8-2785b0cec19b">complete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $A \in \mathrm{Ob}(\mathcal{C})$.
Then the skyscraper sheaf is defined as <a href="20230909-direct_image_sheaf.html#ID-55ca5edd-b09e-4e33-9dc5-95afde50db97">direct image sheaf</a> for the inclusion $\iota: \{x\} \hookrightarrow X$ and the <a href="20240210-singleton_sheaf.html#ID-c96395a0-3d4b-4632-9b63-46eaa04aa334">singleton sheaf</a> $\mathcal{F}$
</p>
