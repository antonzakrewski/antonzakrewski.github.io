<span id="ID-0e257542-9656-4c48-b49e-b5ccebced8f7"></span><h1 class="title">unitary operator</h1>

<h2 id="definition">Definition</h2>
<p>
Let $T: \mathcal{H} \rightarrow \mathcal{H}$ be a <a href="20260509-bounded_operator.html#ID-c9aa0020-0a75-4250-9116-0d18e171bb90">bounded operator</a> and $\mathcal{H}$ a <a href="20230521021534-hilbert_space.html#ID-6c70b215-2588-4ecc-9240-f21ab3ec7d81">Hilbert space</a>.
Then $T$ is said to be unitary, if
</p>
<ol>
<li>$T$ is a <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">Bijection</a></li>

<li>$T^{-1} = T^*$ or equivalently $T T^* = \mathrm{id}_{\mathcal{H}}  = T^* T$</li>
</ol>
