<span id="ID-f64c40f2-d078-48be-865f-b891df1bc96a"></span><h1 class="title">weak convergence and lim inf</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a>, $x_n \xrightarrow{w} x$ be a <a href="20260626-weak_convergence.html#ID-85a7527f-c55a-42c6-8c67-6f53b16d3479">weakly convergent</a> sequence.
Then $\| x \| \leq \lim_{n \rightarrow \infty} \mathrm{inf} \| x_n \|$
</p>
