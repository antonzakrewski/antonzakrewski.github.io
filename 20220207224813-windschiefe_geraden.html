<span id="ID-3924aef7-99c8-4124-8950-1230cdeace3a"></span><h1 class="title">Windschiefe Geraden (Q12)</h1>

<h2 id="definition">Definition</h2>
<p>
Zwei Geraden $g$ und $h$ sind windschief zu einander falls gilt:
</p>
<ul>
<li>Ihre Richtungsvektoren sind <a href="20220920050250-lineare_unabhangigkeit_q12.html#ID-6a505e6a-5021-427c-9e0a-9eef46855f65">lineare unabhängig</a> (vgl. <a href="20220207223846-parameterform_darstellung_einer_gerade.html#ID-c54c1af3-21a6-4444-842e-c084cb216785">Parameterform</a>)</li>

<li>Sie besitzen keine Lösung der Gleichung $g(\lambda') = h(\mu')$, d.h. keinen Schnittpunkt ($g \cap h = \{\}$)</li>
</ul>
