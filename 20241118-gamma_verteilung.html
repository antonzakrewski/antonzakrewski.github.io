<span id="ID-2cc2cb20-6a28-419b-aeab-3fc1440eff34"></span><h1 class="title">Gamma Verteilung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\alpha &gt; 0$ und $r &gt;0$.
Dann ist die Gamma Verteilung definiert
</p>

<div class="math-block">\begin{align*}
\rho(x) = \frac{a^r}{\Gamma(r)} x^{r-1} \mathrm{e}^{- \alpha x}
\end{align*}</div>

<p>
wobei $\Gamma(-)$ die <a href="20241118-gamma_funktion.html#ID-2d207f01-9cc4-48a9-a2f8-8256414bc11e">Gamma Funktion</a> ist.
</p>
