<span id="ID-41742292-aef7-451e-a5ca-f96a23df4179"></span><h1 class="title">dimension of a localization in general not equal</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $S$ a <a href="20230724-multiplicatively_closed_set.html#ID-d3df0441-9f2f-476f-b18e-d513ae149906">multiplicatively closed</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>
Then the <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimension</a> of the <a href="20230724-localization_of_a_ring.html#ID-0b26fdfb-9d28-4981-acde-2ea1ea96837d">localization</a> is in general not equal or negative, i.e.
</p>

<div class="math-block">\begin{align*}
0 \leq \mathrm{dim}(S^{-1}A) &lt; \mathrm{dim}(A)
\end{align*}</div>
