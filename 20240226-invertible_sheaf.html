<span id="ID-afdfaa3d-68a9-43cb-8009-f72a8f0c192a"></span><h1 class="title">pointwise definition invertible sheaf of modules</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_{X})$ be a <a href="20230825-ringed_space.html#ID-58bbaf4e-7310-4524-8008-513e209f798d">ringed space</a>.
Then a <a href="20230912-sheaf_of_a_module_over_a_ringed_space.html#ID-24b6084d-cd1d-469c-a1d8-a03fdda3bb7a">sheaf of modules</a> $\mathcal{F}$ is said to be invertible, if each $x \in X$ has an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighborhood</a> $U$ such that $\mathcal{F}_{\vert U}$ is a <a href="20240226-free_sheaf_of_modules.html#ID-955fbf11-959d-4c53-9002-4f19a05d41a3">free sheaf of modules</a> of rank $1$.
</p>
