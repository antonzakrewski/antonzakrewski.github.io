<span id="ID-17495be0-b2e2-4180-9777-cf59aa90d319"></span><h1 class="title">projective closure of a vanishing locus</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $F \subseteq \mathcal{O}(\mathbb{A}^I_k)$ be a collection.
