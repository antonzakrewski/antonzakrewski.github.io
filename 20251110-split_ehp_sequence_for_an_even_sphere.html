<span id="ID-444e4075-2d3d-4d48-bcc4-7b14aef256f5"></span><h1 class="title">split EHP sequence for an even sphere</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20251027-ehp_sequence.html#ID-15b03b03-36d3-4cca-b0e9-57437fd54c06">integral EHP sequence</a> becomes a <a href="20250716-split_fiber_sequence.html#ID-ba5211ea-816a-443e-a1ef-4a6a87bb7e95">split fiber sequence</a> after <a href="20251103-r_localization_of_anima.html#ID-2d09c640-688e-4d76-9622-59f59cafcee5">localizing at 2</a>
</p>

<div class="math-block">\begin{align*}
\Omega S^{2n} [\frac{1}{2}] \simeq S^{2n-1} [\frac{1}{2}] \times \Omega S^{4n-1} [\frac{1}{2}]
\end{align*}</div>
