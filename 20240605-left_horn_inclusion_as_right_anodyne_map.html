<span id="ID-b91abdd2-a54a-488c-bff7-c830335eb162"></span><h1 class="title">left horn inclusion as right anodyne map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\iota: \Lambda^n_S \rightarrow \Delta^n$ be the <a href="20240404-left_horn.html#ID-306d5f03-d203-4943-8592-559252e44954">left horn</a> inclusion into the <a href="20240128-represented_simplicial_set.html#ID-ecbc7b48-4158-40fc-8130-b3e8183a17e9">represented simplicial set</a>
Then $\iota$ is a <a href="20240327-right_anodyne_map.html#ID-eb1ada66-cba3-4202-9ad9-dda3033b88b7">right anodyne map</a>
</p>
