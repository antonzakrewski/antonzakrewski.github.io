<span id="ID-8c920542-3559-472f-8af9-c0d8690cf10a"></span><h1 class="title">power series ring</h1>

<h2 id="definiton">Definiton</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a>, dann ist der Ring der formalen Potenzreihen $R[ [X] ]$ definiert durch komponentweiser Addition und <a href="20230427071130-faltung.html#ID-615e767a-6127-4a1e-aa64-0dae7be4b783">Faltung</a> als Multiplikation:
</p>

<div class="math-block">\begin{align*}
(a_0,a_1,...) \cdot (b_0,b_1,...) = (\sum_{i=0}^{j} a_{i} b_{j-i})_j
\end{align*}</div>
