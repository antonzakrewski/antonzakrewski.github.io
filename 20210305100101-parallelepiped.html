<span id="ID-98c3604a-72a1-4e07-8e55-783a39de30fa"></span><h1 class="title">Parallelepiped</h1>

<h2 id="definition">Definition</h2>
<p>
Ein Parallelepiped (auch Spat) ist ein geometrischer Körper bestehend aus 6 <a href="20210305100308-parallelogram_geometrie.html#ID-054eb6fe-2853-4883-9749-059ea159746d">Parallelogrammen</a>, wobei die gegenüberliegenden Seiten kongruent zueinander sind.
Spezialfälle eines Parallelepiped ist ein <a href="20210305100549-quader.html#ID-d1693b53-d47f-4039-9792-1efc11c93ff9">Quader</a> oder ein <a href="20210305100613-rhomboeder.html#ID-59f5a2bd-b717-4467-8728-e0bcc4d00137">Rhomboeder</a>.
</p>
