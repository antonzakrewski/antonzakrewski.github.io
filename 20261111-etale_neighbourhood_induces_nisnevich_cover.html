<span id="ID-49afa42c-0ad4-4ea0-baeb-696ae48e1497"></span><h1 class="title">etale neighbourhood induces nisnevich cover</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $Z \hookrightarrow X$ be a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a> and $V \rightarrow X$ an <a href="20261028-etale_neighbourhood.html#ID-3bc1e109-a448-48f9-b15c-35a4f38b4cc8">etale neighbourhood</a> of $Z$
Then $(V \rightarrow X, X \setminus Z \hookrightarrow X)$ is a <a href="20261111-nisnevich_cover.html#ID-52a2e4b4-47bb-481d-9937-dc3f2a6a0b64">nisnevich cover</a>.
</p>
