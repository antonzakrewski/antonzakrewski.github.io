<span id="ID-86ecdc3b-5047-4f60-a5d5-0ad93568c1df"></span><h1 class="title">Stetigkeit der Diagonalabbildung</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>.
Dann ist die <a href="20230330175154-diagonalabbildung.html#ID-d79d9003-736d-4f2e-b6e6-d2c6c636e4c2">Diagonalabbildung</a> $\Delta: X \rightarrow X^I$ <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">stetig</a> bezüglich der <a href="20230211133152-produkttopologie.html#ID-32030f19-ac2a-4c46-aaed-1abb1cd6df9f">Produkttopologie</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
folgt aus der universellen eigenschaft, da $\pi_i \circ \Delta = \mathrm{id}$ ist.
</p>
