<span id="ID-1ea368b5-8c68-4022-96fc-46e8255700f5"></span><h1 class="title">p-complete spectrum is p-local</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R = \mathbb{Z}_{(p)}$ and $X$ a <a href="20260215-p_complete_spectra.html#ID-148698c7-729a-47ba-973b-208d23a61b4b">p-complete</a> <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectrum</a>.
Then $X$ is <a href="20260418-p_local_spectrum.html#ID-0f5602bc-781c-4715-b894-3fba83b5c271">p-local spectrum</a>.
</p>
