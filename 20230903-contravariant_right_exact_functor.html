<span id="ID-f236279a-2e40-4bc8-ac1c-2d0365e4fff1"></span><h1 class="title">contravariant right exact functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20231018-finitely_complete_category.html#ID-5fad868e-afdf-46b6-8dbb-0da2ac1d1441">finitely complete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a>, $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20220830173327-kontravarianter_funktor.html#ID-88bd5800-bc2d-4ad5-81d2-90240d062847">contravariant functor</a>.
</p>

<p>
Then $\mathcal{F}$ is said to be right exact, if the <a href="20231215-dual_functor.html#ID-e50d1cbb-d7ed-4f18-ace8-69fd98326a6e">dualized functor</a> is a <a href="20230903-covariant_left_exact_functor.html#ID-451552fa-0c6a-46d1-8bbd-9683937c52f3">covariant left exact functor</a>
</p>
