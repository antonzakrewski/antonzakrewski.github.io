<span id="ID-68e0559a-b06f-41e4-a435-36f587e521aa"></span><h1 class="title">topologically ringed space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $\mathcal{F}$ be a <a href="20230825-sheaf.html#ID-e25c21b0-0380-4bb6-95e6-867026f82aca">sheaf</a> of <a href="20230825-topological_ring.html#ID-81055cbb-6649-48e0-bbdf-e8fac0ec33d1">topological rings</a>.
Then $(X,\mathcal{F})$ is said to be a topologically ringed space
</p>
