<span id="ID-e96b4bf9-8a55-4375-8eb2-b34ec221f42f"></span><h1 class="title">inverse of a commutator</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(G, \circ)$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $g,h \in G$.
Then
</p>

<div class="math-block">\begin{align*}
[g,h]^{-1} =&amp; [h,g] \\
=&amp; hgh^{-1}g^{-1} \\
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
Multiplication results in
</p>

<div class="math-block">\begin{align*}
ghg^{-1}h^{-1} \cdot hgh^{-1}g^{-1} =&amp; e
\end{align*}</div>


</div>
