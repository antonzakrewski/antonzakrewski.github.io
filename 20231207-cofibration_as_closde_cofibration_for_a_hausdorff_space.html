<span id="ID-9ccd105b-145a-4f82-9c91-89b012a3c9cd"></span><h1 class="title">cofibration as closed cofibration for a hausdorff space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A,X$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $\iota: A \rightarrow X$ a <a href="20231124-cofibration.html#ID-05c7be72-ecee-40a2-a48e-8df8cada2404">cofibration</a>, where $X$ is <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">hausdorff</a>.
Then $\iota$ is a <a href="20231125-closed_cofibration.html#ID-b27a7809-1ec6-4523-9568-caf253720c94">closed cofibration</a>
</p>
