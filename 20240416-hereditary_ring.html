<span id="ID-af953fbd-d89c-467b-9483-606b250e1242"></span><h1 class="title">hereditary ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $A$ is said to be hereditary, if for each <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective module</a> $M$ each <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodule</a> $N \subseteq M$ is also projective.
</p>
