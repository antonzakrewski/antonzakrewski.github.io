<span id="ID-57d12f89-e25f-4bc9-8726-282b5fbb325e"></span><h1 class="title">left exact functor - to watch</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be a <a href="20231018-finitely_complete_category.html#ID-5fad868e-afdf-46b6-8dbb-0da2ac1d1441">finitely complete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a>.
Then a covariant <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ is said to be left exact functor, if it <a href="20240114-functor_preserving_finite_limits.html#ID-673b108d-9327-449a-868a-596cef7d4110">preserves finite limits</a>
</p>
