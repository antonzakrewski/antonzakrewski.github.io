<span id="ID-2dce005c-122e-49ca-9289-a45ce7e59bdf"></span><h1 class="title">R-field</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $k$ an <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">R-Algebra</a>.
Then $k$ is said to be an \(R\)-field, if it is a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>
</p>
