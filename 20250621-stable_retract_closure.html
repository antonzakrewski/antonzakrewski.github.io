<span id="ID-fdb868c3-c525-4172-ab72-3e9d4049830f"></span><h1 class="title">thick stable subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a> and $\mathcal{D}$ a <a href="20241023-stable_subcategory.html#ID-bfd1a6f2-74c1-4474-a8d1-786c0b4ac46a">stable subcategory</a>
Then $\mathcal{D}$ is said to be thick, if is closed under <a href="20241206-infinity_retract.html#ID-e6eb12e4-5533-41cf-827b-0985688a5bb8">retracts</a>
</p>
