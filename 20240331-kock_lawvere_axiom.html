<span id="ID-e25ee825-3838-4dca-b5c7-88b0504834d8"></span><h1 class="title">Kock-Lawvere Axiom</h1>

<h2 id="axiom">Axiom</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $D = \{x \vert x^2 = 0\}$ die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">menge</a> der quadratisch  <a href="20230315113206-nilpotent.html#ID-e1be03af-ebb8-42d9-8caa-1fe3a1093c3f">nilpotentes</a>, dann ist die Abbildung
</p>

<div class="math-block">\begin{align*}
\varphi: R^2 \rightarrow&amp; R^D \\
(a,b) \mapsto&amp; (d \mapsto&amp; a + d \cdot b)
\end{align*}</div>
<p>
ein <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
