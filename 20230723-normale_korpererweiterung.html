<span id="ID-2e8decef-eac5-46db-a814-aa1bb98d8df0"></span><h1 class="title">normal field extension</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $L/K$ eine <a href="20230722-algebraische_korpererweiterung.html#ID-434e42fe-1036-44f2-86e7-9dd391760e46">algebraische</a> <a href="20230603-field_extension.html#ID-afbdca38-90b9-4db1-9d10-cfd826cbfac6">Körpererweiterung</a>.
Dann ist $L$ eine normale Körpererweiterung, falls für beliebiges $\alpha \in L$ das <a href="20230723-minimalpolynom_eines_algebraischen_elements.html#ID-e76a1f34-1911-4281-a969-5abea577522a">Minimalpolynom</a> $f \in K[X]$ - sofern es existiert - über $L$ <a href="20221229010309-zerfallen_eines_polynoms.html#ID-8e83cdb4-e8e8-465c-806e-0960939bd509">zerfällt</a>
</p>
