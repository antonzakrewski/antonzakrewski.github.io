<span id="ID-b6d5927b-9624-45c8-b703-35537def5b46"></span><h1 class="title">metric on a vector bundle</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: E \rightarrow B$ be a <a href="20230905-topological_vector_bundle.html#ID-821f2fea-f858-4555-ae30-90ea23209a2e">topological vector bundle</a>.
Then a metric is a section
</p>

<div class="math-block">\begin{align*}
h \in \Gamma((E \otimes E)^*)
\end{align*}</div>
<p>
such that $h_x$ is an <a href="20221031195957-inneren_produkt.html#ID-98914861-db37-4206-807f-5f8e390ecf3d">inner product</a> on $E_x$ for any $x \in X$
</p>
