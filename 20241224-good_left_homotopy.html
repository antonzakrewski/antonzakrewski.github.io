<span id="ID-d224b6df-1df4-41fd-a115-ee8c47c1be35"></span><h1 class="title">good left homotopy</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(\mathcal{C}, \mathcal{W}, \mathrm{Cof}, \mathrm{Fib})$ be a <a href="20240715-model_category.html#ID-a617e6d1-b76b-48fc-99bc-acce1d7da2fa">model category</a>, $f \sim_l g$ be a <a href="20240811-left_homotopy.html#ID-bbda988d-91af-453e-8bd4-469d24d2f0df">left homotopy</a> given by $\eta: \mathrm{Cyl}(X) \rightarrow Y$
Then the homotopy is said to be good, if $\mathrm{Cyl}(X)$ is a <a href="20240811-good_cylinder_object.html#ID-205a6525-428e-4640-83bd-39bb93441e93">good cylinder object</a>
</p>
