<span id="ID-5d852e38-1a27-4bef-9529-f01abd342f94"></span><h1 class="title">generic point</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $x \in X$.
Then $x$ is said to be a generic point, if $x$ is <a href="20221124232157-dichte_menge_topologie.html#ID-921fe319-4945-4303-a9a5-3723804e0737">dense</a> in $X$, i.e.
</p>

<div class="math-block">\begin{align*}
\overline{\{x\}} = X
\end{align*}</div>
