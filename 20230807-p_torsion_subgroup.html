<span id="ID-69a9f9fc-efca-4e2a-88fe-3be2adddcde7"></span><h1 class="title">p-torsion subgroup</h1>

<h2 id="definition">Definition</h2>
<p>
Let \( (G,+)\) be an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $p \in \mathbb{P}$ a <a href="20230426123442-primelement.html#ID-ffa743e1-94ee-49fe-9647-396eeb233982">prime</a>.
Then the \(p\)-torsion subgroup $A_{T_p}$ is defined as
</p>

<div class="math-block">\begin{align*}
A_{T_p} \coloneqq \{a \in A \vert \exists n \in \mathbb{N} : p^n a = 0\}
\end{align*}</div>

</div>
