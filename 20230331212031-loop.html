<span id="ID-58129e93-e4ad-495c-a78c-1d0856bde0b7"></span><h1 class="title">Loop</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $x_0 \in X$.
A loop based at $x_0$ is a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Map</a> $\gamma: [0,1] \rightarrow X$ such that $\gamma(0) = \gamma(1) = x_0$
</p>
