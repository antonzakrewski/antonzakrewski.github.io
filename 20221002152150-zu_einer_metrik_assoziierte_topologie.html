<span id="ID-aee5269f-4b03-4c46-bd0b-12f367d633c0"></span><h1 class="title">zu einer Metrik assoziierte Topologie</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a> mit der <a href="20220716173517-metrik.html#ID-0aa21afc-5f24-4618-a61e-e5ebf2e9640c">Metrik</a> $d$.
Die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20221002145550-offene_menge_in_einem_metrischen_raum.html#ID-48a9cdb7-4398-449e-b008-2c0fe06b2d00">offene Teilmengen in diesem metrischen Raum</a> von $X$ ist die zu $d$ assoziierte <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">Topologie</a> $\mathcal{T}_d$
</p>
