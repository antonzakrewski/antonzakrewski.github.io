<span id="ID-0af41d11-4bc8-4a68-bb80-d016e2699c1f"></span><h1 class="title">countable union of meager sets is meager</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A_n$ be a <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">countable</a> collection of <a href="20230515105247-magere_menge.html#ID-f3b1cf25-7fb5-4c42-b59d-0acbb0f1db57">meager</a> sets in a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $X$.
Then so is the <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">countable</a> union $\bigcup_n X_n$
</p>

follows from <a href="20210830202525-cantorsches_diagonalargument.html#ID-b57327f6-300f-4009-80d3-d7066263d087">Cantorsches erstes Diagonalargument</a>
</p>
