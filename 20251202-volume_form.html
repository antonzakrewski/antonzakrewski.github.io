<span id="ID-e01c9701-5e4d-45a7-a90e-6d7f6acfe50e"></span><h1 class="title">volume form of a manifold</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a \(n\)-dimensional <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>
Then a volume form is a <a href="20230905-differentialform.html#ID-134d05c2-9f29-4321-a418-e1acb965dc53">n-form</a>  $\omega \in \Omega^n(M)$ if $\omega_q \neq 0$ for all $q \in M$
</p>
