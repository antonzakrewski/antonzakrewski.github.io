<span id="ID-e0359376-c3a2-4203-acf5-16466cd2e70e"></span><h1 class="title">1-category bord</h1>

<h2 id="definition">Definition</h2>
<p>
Let $n \in \mathbb{N}_0$.
Then the \(1\)-category bord is defined as <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> containing
</p>
<ol>
<li>\(n\)-dimensional, <a href="20240613-orientation_of_a_manifold.html#ID-015ad7ba-6538-407f-9593-139399f789f6">oriented</a> <a href="20230723-differenzierbare_mannigfaltigkeit.html#ID-805c972a-cf4f-4229-a4dc-b6755639f890">differentiable</a> <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifolds</a> as <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> </li>

<li><a href="20240625-oriented_bordism.html#ID-3769b588-8861-4b5e-b2f7-82519b7ce0d5">oriented bordisms</a> up to <a href="20230301205440-diffeomorphismus.html#ID-573a56f9-0240-4c4a-a241-ee598afdd9f5">diffeomorphism</a> as <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> </li>
</ol>
