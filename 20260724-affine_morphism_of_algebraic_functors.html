<span id="ID-4c2d66a8-67b6-47b1-b210-b8e29a921330"></span><h1 class="title">affine morphism of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a map of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor.</a>
Then $f$ is said to be affine, if there exists a <a href="20260715-category_of_quasi_coherent_algebras_over_an_algebraic_functor.html#ID-8c05ef13-3e74-40f5-b491-e455f46e04f3">quasi-coherent algebra</a> $A$ and an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>

<div class="math-block">\begin{align*}
Y \cong \mathrm{Spec}(X)
\end{align*}</div>
