<span id="ID-3e98e84a-9b3d-443c-9fdd-b8404cbe4866"></span><h1 class="title">Multiplikation mit Positiver Zahl - Relationen</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
x &gt; y \land a &gt; 0 \Rightarrow ax &gt; ay
\end{align*}</div>

<h2 id="beweis">Beweis</h2>

<div class="math-block">\begin{align*}
x - y &gt; 0 \\
a(x - y) &gt; a \cdot 0 \\
ax - ay &gt; 0 \\
ax &gt; ay
\end{align*}</div>
