<span id="ID-3563bc79-fb9f-4de7-b323-8c111352edb8"></span><h1 class="title">currying in Set</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y,Z \in \mathrm{Ob}(\mathrm{Set})$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a>, then there exists a <a href="20230404122456-natural_isomorphism.html#ID-0977f626-bc15-4197-93bd-092d014c8270">natural isomorphism</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Hom}_{\mathrm{Set}}(X \times Y, Z) \simeq \mathrm{Hom}_{\mathrm{Set}}(X, \mathrm{Hom}_{\mathrm{Set}}(Y,Z))
\end{align*}</div>
