<span id="ID-9908c270-01fb-418f-be43-da4a811e0f55"></span><h1 class="title">cofiber functor preserves colimits</h1>

<h2 id="proposition">Proposition</h2>
<p>

Then it <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves colimits</a>
</p>
