<span id="ID-efe26097-ccee-4c63-82ab-c193dc9166f5"></span><h1 class="title">G-Delta Menge und Komplement als F-Sigma Menge</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $G \subseteq X$.
Dann ist $A$ eine <a href="20230601132902-g_delta_menge.html#ID-6df4b467-3c98-44c3-a261-42d8185498a1">G-Delta Menge</a> <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">g.d.w.</a>  $X \setminus G$ eine <a href="20230614-f_sigma_menge.html#ID-7a904f2e-2ec3-418e-a97c-9654839a7554">F-Sigma Menge</a> ist.
</p>
