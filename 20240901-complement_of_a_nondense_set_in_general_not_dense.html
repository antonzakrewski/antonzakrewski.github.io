<span id="ID-acc2acbb-16ca-4426-983e-399cdc3deb77"></span><h1 class="title">complement of a nondense set in general not dense</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Suppose $A$ is not <a href="20221124232157-dichte_menge_topologie.html#ID-921fe319-4945-4303-a9a5-3723804e0737">dense</a>, then neither is in general $X \setminus A$
</p>

<h2 id="proof">Proof</h2>
<p>
Consider $\{1,2\}$, then neither $\{1\}$ nor $\{2\}$ are dense
</p>
