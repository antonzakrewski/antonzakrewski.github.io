<span id="ID-8698e0d2-6e09-408f-9961-bc04cc3409c1"></span><h1 class="title">sucessor of an ordinal</h1>

<h2 id="definition">Definition</h2>
<p>
Suppose $\alpha$ be an <a href="20230516130028-ordinalzahl.html#ID-f638eb2b-0e4a-40c1-aac6-d3518403288b">ordinal</a>, then the successor $\beta$ of $\alpha$ is an <a href="20230516130028-ordinalzahl.html#ID-f638eb2b-0e4a-40c1-aac6-d3518403288b">ordinal</a> defined as:
</p>

<div class="math-block">\begin{align*}
\beta  \coloneqq \alpha \cup \{\alpha\}
\end{align*}</div>
