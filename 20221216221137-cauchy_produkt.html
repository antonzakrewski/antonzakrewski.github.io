<span id="ID-fbec730c-5e96-4cde-9d0c-4783e1ff9ee3"></span><h1 class="title">Cauchy product</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $\sum_{n=0}^{\infty} a_n$ und $\sum_{n=0}^{\infty} b_n$ komplexe <a href="20211222222904-reihe_mathe.html#ID-ae236532-f177-4c70-806b-a1be965ef5e4">Reihen</a>.
Dann ist ihr Cauchy-Produkt definiert als:
</p>

<div class="math-block">\begin{align*}
\sum_{n=0}^{\infty} \left( \sum_{k=0}^{n} a_{n-k} b_{k} \right)
\end{align*}</div>
