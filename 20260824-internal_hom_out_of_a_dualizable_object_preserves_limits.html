<span id="ID-56080baa-2f6a-43ec-94eb-62ea397de574"></span><h1 class="title">internal hom out of an object preserves limits</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}, \otimes, \mathbbm{1}$ be a <a href="20240506-closed_monoidal_category.html#ID-2c471a85-1f2f-4cc4-b03d-b1f530462cb8">closed</a> <a href="20250307-symmetric_monoidal_infinity_category.html#ID-40c08a37-68ce-4dc1-8647-31caa12e9598">symmetric monoidal category</a> and $x \in \mathcal{C}$ an <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a>.
Then $\underline{\mathrm{Hom}}_{\mathcal{C}}(x,-)$ <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves</a> <a href="infinity-limit.html#ID-a8bcf958-5282-4984-8415-7a64cca74613">limits</a>
</p>

<h2 id="proof">Proof</h2>
<p>
<a href="infinity-right-adjoint-preserves-limits.html#ID-7a89dac3-7152-4947-b5c8-a4ff9fc04a58">right adjoint preserves limits</a>
</p>
