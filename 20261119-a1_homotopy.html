<span id="ID-03a9d7bc-8a72-4982-bccf-5c394dc01a50"></span><h1 class="title">A1 homotopy</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f,g: X \rightarrow Y$ in $\mathcal{P}(\mathrm{Sm}_{S})$.
Then an $\mathbb{A}^1$ homotopy is is a map $h: X \times \mathbb{A}^1 \rightarrow Y$ such that $h(-,0) = f$ and $h(-,1) = g$
