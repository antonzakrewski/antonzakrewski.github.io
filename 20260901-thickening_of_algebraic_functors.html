<span id="ID-2342d179-a7e3-4c55-9acb-ffcd5b20a8af"></span><h1 class="title">thickening of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a map between <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Then $f$ is said to be a thickening, if it is a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a> classified by a <a href="20260901-quasi_coherent_nilideal.html#ID-04af6c6b-f1c2-4356-8eb7-1438ed8bc9c1">quasi-coherent nilideal</a>.
</p>
