<span id="ID-2b1bc9e1-a857-4e1a-9927-02d30418930d"></span><h1 class="title">Transposition</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $S_n$ eine <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">Symmetrische Gruppe</a>.
Eine Transposition $\mathcal{T}_{kl}$ ist eine <a href="20220928140441-permutation.html#ID-01de1cf3-b2f6-4908-a06a-1e9479c0f756">Permutation</a> der Form:
</p>

<div class="math-block">\begin{align*}
\mathcal{T}_{kl}(i) =&amp; 
\begin{cases}
k &amp; \mbox{if } i = l \\
l &amp; \mbox{if } i = k \\ 
i &amp; \mbox{else } \\ 
\end{cases}
\end{align*}</div>
