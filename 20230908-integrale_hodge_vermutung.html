<span id="ID-895209ee-4e61-4e86-b35d-e7183d0b9361"></span><h1 class="title">Integrale Hodge-Vermutung</h1>

<h2 id="satz">satz</h2>
<p>
Sei $x$ eine <a href="20230906-smooth_projective_variety.html#ID-d6d7018e-c65b-4ebb-b474-37ea9ea05de8">glatte projektive Varietät</a>.
Dann ist jede <a href="20230901-hodge_klasse.html#ID-a5aea09f-0807-47bb-a034-e5256021087c">Hodge-Klasse</a> $\alpha \in H^{c,c}(X, \mathbb{Z})$ <a href="20230907-algebraische_hodge_klasse.html#ID-e7d49d33-95a1-4c4e-b540-23a794cf78ac">algebraisch</a>, d.h. $\alpha = \sum_{i=1}^{n} \alpha_i [Z_1]$ für <a href="20230907-projective_subvariety.html#ID-a3b595d7-5ab1-47a5-acd3-27513791df4a">untervarietäten</a> $Z_1,...,Z_r \subseteq X$ von Kodimension $c$ und $m_1,..,m_r \in \mathbb{Z}$
</p>
