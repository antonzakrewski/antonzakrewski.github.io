<span id="ID-bc62a6ed-8ff1-4c86-9539-2473abf945ca"></span><h1 class="title">unitär ähnliche Matrix</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K^{n}$ ein <a href="20221109121525-endlich_erzeugter_vektorraum.html#ID-477797e9-4b4d-4886-9606-6e1c5f378a4f">endlich erzeugter</a> <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilbertraum</a>, dann sind $A,B \in K^{n \times n}$ zueinander unitär ähnliche Matrix, falls eine <a href="20230628-unitare_matrix.html#ID-95ce0efd-44be-410d-8455-4388b16899b6">unitäre Matrix</a> $U$ existiert, so dass gilt
</p>

<div class="math-block">\begin{align*}
A =&amp; U B U^* \\
=&amp; U B U^{-1}
\end{align*}</div>
