<span id="ID-2b0001e3-5e3f-4145-9948-de2a59a7bd12"></span><h1 class="title">norm element of a group ring for a finite group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $G$ a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>  <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $R[G]$ the <a href="20230226184405-gruppenring.html#ID-2c9cf75a-3151-48a9-b3f7-4b0239f4a068">group ring</a>
Then the norm element is defined as
</p>

<div class="math-block">\begin{align*}
N = \sum_{g \in G} 1
\end{align*}</div>
