<span id="ID-a7dda258-f246-4dcf-a8e9-dd60cf9af0a3"></span><h1 class="title">Hausdorff als Isomorphieinvariante</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $(X, \mathcal{T})$ und $(X', \mathcal{T}')$ <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räume</a> und $f: X \rightarrow X'$ ein <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">Homeomorphismus</a>.
Dann ist $X$ <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">Hausdorff</a> <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">g.d.w.</a> $X'$ <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">Hausdorff</a> ist.
</p>
