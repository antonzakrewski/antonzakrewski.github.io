<span id="ID-4a8c6496-6309-4620-8ede-a2eaa108e7b8"></span><h1 class="title">Linkseigenvektor</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $f \in \mathrm{End}_K(V)$ ein <a href="20230303151710-vektorraumendomorphismus.html#ID-ecd3affd-0dbf-4f53-8c43-79af608c67e9">Vektorraumendomorphismus</a>.
$v$ ist ein Linkseigenvektor zum <a href="20220303190024-eigenwert.html#ID-c96ef2bb-2cf6-4ca8-9d98-40991bd99031">Eigenwert</a> $\lambda$, falls gilt:
</p>

<div class="math-block">\begin{align*}
v \cdot A = \lambda v
\end{align*}</div>
