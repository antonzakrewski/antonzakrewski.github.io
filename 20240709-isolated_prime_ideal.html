<span id="ID-a0633d29-45a9-4088-9fc8-30e0c486a21e"></span><h1 class="title">isolated prime ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathfrak{p} \in \mathrm{Ap}(\mathfrak{a})$ be an <a href="20240529-associated_prime_ideal.html#ID-157a179a-c350-46b5-9c34-1891842ce076">associated ideal</a> for a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $A$ and a <a href="20230427200359-echtes_ideal.html#ID-fa54a328-b081-4a6c-9106-4348783138df">strict ideal</a> $\mathfrak{a}$
Then $\mathfrak{p}$ is said to be isolated, if it is a <a href="20230825-minimal_element.html#ID-180a1321-d0d3-4200-89a3-fc5996c98ff8">minimal element</a> in $\mathrm{Ap}(\mathfrak{a})$
</p>
