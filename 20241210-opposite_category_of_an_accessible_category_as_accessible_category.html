<span id="ID-acb787b1-add3-4f3e-8365-2627a38b3b70"></span><h1 class="title">opposite category of an accessible category as accessible category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be an <a href="accessible-infinity-category.html#ID-f23cff27-6e97-4440-a7bd-a3a94ce4e648">accessible</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>.
Then the <a href="20240715-opposite_infinity_category.html#ID-f4ca2ef0-42c3-43cd-a634-47323ff5871e">opposite</a> category $\mathcal{C}^{\mathrm{op}}$ is in general not accessible.
</p>
