<span id="ID-41f02cd3-2031-4f3f-a54e-e44012d66f33"></span><h1 class="title">terminal object in Top</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20220825145511-terminales_objekt.html#ID-16825b5e-51d8-4e5e-ac19-2a05cd9fb110">terminal object</a> in <a href="20230225170221-kategorie_top.html#ID-55f8744f-3e21-4c41-889f-06a52add975b">category Top</a> is the singleton with the <a href="20230227174346-indiskrete_topologie.html#ID-9447f709-30a2-4b9a-b651-73909b037fad">indiscrete topology</a>
</p>

<h2 id="proof">Proof</h2>
<p>
existence and uniqueness of set-theoretic maps follows from <a href="20231013-final_object_of_set.html#ID-f9f891e0-1ef8-4618-b6c3-a39376b4512d">terminal object in set</a>
continuity follows from <a href="20230227184712-charakterisierung_der_indiskreten_topologie_anhand_der_stetigkeit.html#ID-0ff036c5-ae57-48f8-9657-2cddee1d998a">Charakterisierung der indiskreten Topologie anhand der Stetigkeit</a>
</p>
