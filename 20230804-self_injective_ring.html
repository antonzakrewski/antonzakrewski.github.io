<span id="ID-593ce0af-ecf7-4169-89d4-a8edeb5e29ea"></span><h1 class="title">self-injective ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, such that a <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">free module</a> $M$ over $R$ is <a href="20230803-injective_module.html#ID-c14a1ecb-aad5-402f-b835-7857c7b39dfb">injective module</a>.
Then $R$ is said to be self-injective
</p>
