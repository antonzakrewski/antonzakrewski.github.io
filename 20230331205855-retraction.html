<span id="ID-0563c33d-c1ad-4e65-9306-539b48627b86"></span><h1 class="title">Retraction</h1>

<h2 id="definitino">Definitino</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $Y \subseteq X$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> and $(Y, \mathcal{T}_Y)$ the <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace topology</a>.
A retraction is a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $r: X \rightarrow Y$, such that $r_{\vert Y} = \mathrm{id}_{Y}$
</p>
