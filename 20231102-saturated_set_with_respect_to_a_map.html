<span id="ID-34ec3e5d-f0fc-4a7f-ba1c-fdc8b1a9450a"></span><h1 class="title">saturated set with respect to a map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> and $f: X \rightarrow Y$ a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
A subset $V \subseteq X$ is said to be saturated with respect to $f$, if for the <a href="20211230205442-urbild_mengenlehre.html#ID-55e63f0f-4499-43f1-af07-5c56577a9c73">preimage</a> and <a href="20211230205458-bild_mengenlehre.html#ID-e7c4bebe-0c9a-4999-bd38-f1ceec101025">image</a> it holds, that
</p>

<div class="math-block">\begin{align*}
f^{-1}[f[V]] = V
\end{align*}</div>
