<span id="ID-05b17ed9-4828-4e15-96f9-306ff10c78a3"></span><h1 class="title">epic split mono is an equivalence</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>, $f$ an <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">epimorphism</a> and <a href="20230914-split_mono.html#ID-62a5ec35-cc96-4b7f-b94c-d49e565a6e6f">split mono</a>.
Then $f$ is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
