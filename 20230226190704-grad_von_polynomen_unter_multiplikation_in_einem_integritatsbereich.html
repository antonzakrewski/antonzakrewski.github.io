<span id="ID-ac8fc7ef-5b72-4a77-8057-2b3ad9241517"></span><h1 class="title">degree of the product of polynomials in an integral domain</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> und $f,g \in R[X]$, dann gilt für den <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">Grad</a> des Produkts
</p>

<div class="math-block">\begin{align*}
\mathrm{deg}(f \cdot g) =&amp; \mathrm{deg}(f) + \mathrm{deg}(g)
\end{align*}</div>
