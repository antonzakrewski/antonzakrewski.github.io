<span id="ID-782b6eca-97a0-40c7-9aec-366f3d5d4656"></span><h1 class="title">bounded, finite rank operator is compact</h1>

<p>
Let $f: X \rightarrow Y$ be a <a href="20260509-bounded_operator.html#ID-c9aa0020-0a75-4250-9116-0d18e171bb90">bounded</a>, <a href="20260714-finite_rank_operator.html#ID-60905093-b111-4654-8a64-8d58820bd6ab">finite rank operator</a>.
Then $f$ is a <a href="20260509-compact_operator.html#ID-eff9525d-2e92-42ce-acaa-8674b0f4f80a">compact operator</a>.
</p>
