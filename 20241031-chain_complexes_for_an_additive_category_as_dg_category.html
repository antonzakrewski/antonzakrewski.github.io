<span id="ID-64e82d91-82e4-445e-8016-a2904e6df20b"></span><h1 class="title">chain complexes for an additive category as dg category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-additive_category.html#ID-e50cd553-69ee-4360-bd27-43b73e7a9945">additive category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>
Then $\mathrm{Ch_*}(\mathcal{A})$ is a $\mathbb{Z}$-valued <a href="20241024-dg_category_over_a_commutative_ring.html#ID-add41ccb-861b-40d9-8d79-8e15f8160b05">dg category</a>
</p>
