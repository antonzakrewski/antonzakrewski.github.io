<span id="ID-134d05c2-9f29-4321-a418-e1acb965dc53"></span><h1 class="title">k-form</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20230905-smooth_differentiable_manifold.html#ID-0ddfb9d4-93f0-4b88-bb28-f6ca87b18ee0">glatte Mannigfaltigkeit</a>.
Dann ist eine \(k\)-Form
ein <a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">Element</a>
</p>

<div class="math-block">\begin{align*}
\alpha \in \Omega^k = \bigwedge^k (TM)^*
\end{align*}</div>
<p>
d.h. ein <a href="20230905-glatter_schnitt_eines_glatten_vektorbundel.html#ID-dd88ade4-afa0-4b80-bde2-229b5e0a09bd">glatter Schnitt</a> des <a href="20230905-glattes_vektorbundel.html#ID-3f20d186-2cfc-4eee-af56-b69206bea0ac">glatten</a> <a href="20230905-exterior_algebra_of_a_module.html#ID-afd85e48-6e3c-476e-acff-4de6f836f615">wedge products</a> des <a href="20230905-kotangentialbundel.html#ID-db230005-2711-49af-b5e7-e1f7b0c8b531">Kotangentialbündels</a> (vgl.<a href="20230905-außere_potenz_eines_vektorbundels.html#ID-39df829d-d041-4c20-a7e0-a97d07fe8abd">äußere Potenz eines Vektorbündels</a>)
