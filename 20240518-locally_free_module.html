<span id="ID-9a7002f9-dcc1-4564-8a3f-af8d390ecdf4"></span><h1 class="title">locally free module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathrm{Spec}(R)$ the <a href="20230725-zariski_spectrum.html#ID-be298171-f5f5-4ad4-8574-afe3257110d2">zariski spectrum</a>.
Then $R$ is said to be locally free, if there exists an <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open cover</a> by <a href="20230826-standard_opens_of_the_zariski_topology.html#ID-465fb301-6138-44f2-8852-5e40e6b52b4d">standard opens</a> $D(f_i)$ such that
</p>

<div class="math-block">\begin{align*}
M_{f_i}
\end{align*}</div>
<p>
is a <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">free</a> $R_{f_i}$ module
