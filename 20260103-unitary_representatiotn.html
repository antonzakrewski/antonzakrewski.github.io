<span id="ID-85abbc16-372a-4ae5-8929-b739c336ed28"></span><h1 class="title">unitary representation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, then a unitary representation is given by a representation on a \(\mathbb{C}\)-<a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> $V$
</p>

<div class="math-block">\begin{align*}
G \rightarrow \mathrm{Aut}(V)
\end{align*}</div>
<p>
which restricts <a href="20230628-unitare_abbildung.html#ID-cf245337-af79-469e-b2eb-16f58d3c9f70">unitary endomorphisms</a> (with respect to a fixed inner product on $V$)
</p>
