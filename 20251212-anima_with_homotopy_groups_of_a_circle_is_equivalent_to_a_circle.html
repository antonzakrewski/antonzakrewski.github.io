<span id="ID-9846585b-cb71-49e2-9f4f-0071a0e3ed07"></span><h1 class="title">anima with homotopy groups of a circle is equivalent to a circle</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a (<a href="20250310-connected_anima.html#ID-3a5f1513-1e7e-49aa-90e7-a728c310990c">connected</a>) <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a> with $\pi_*(X) \cong \pi_*(S^1)$.
Then $X \simeq S^1$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20241104-uniqueness_of_eilenberg_maclane_spaces_up_to_homotopy_equivalence.html#ID-c42a9837-a696-4e98-ba3a-5c38d53f2989">uniqueness of Eilenberg-MacLane spaces</a> where $S^1 \simeq K(\mathbb{Z},1)$
</p>
