<span id="ID-15ff0e97-1d25-461a-aef8-dac9ace2de9c"></span><h1 class="title">projective variety</h1>

<h2 id="definition">Definition</h2>
<p>
Let $F$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{P}_F^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a>.
A projective variety is an <a href="20240903-projective_algebraic_set.html#ID-2de5f93c-d089-41e8-b212-6fb55d447a54">projective algebraic set</a> $A \subseteq \mathbb{P}_F^n$, which is <a href="20230226044934-irreduzibler_topologischer_raum.html#ID-2c6c8d23-0c2a-4989-afcc-34a0c34d4f36">irreducible</a>
</p>
