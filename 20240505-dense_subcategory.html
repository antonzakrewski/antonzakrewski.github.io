<span id="ID-ce9bbb9f-9086-485a-bd48-de98a8ba16b3"></span><h1 class="title">dense subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $\mathcal{D} \hookrightarrow \mathcal{C}$ a <a href="20220824221623-unterkategorie.html#ID-2165c92b-8025-4134-b3b1-4d523a8795a4">subcategory</a>.
Then $\mathcal{D}$ is said to be dense, if every <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $C \in \mathcal{C}$ is canonically (?) a colimit of objects in $\mathcal{D}$
</p>
