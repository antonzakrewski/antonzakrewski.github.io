<span id="ID-99cc7cab-3b40-434e-9aee-01b2312cf269"></span><h1 class="title">compactly exhaustive object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an object in a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> $\mathcal{C}$.
Then $X$ is said to be compactly exhaustive, if it is the <a href="20241025-infinity_sequential_colimit.html#ID-3ba18919-107b-482e-b435-f81d20cbad16">sequential colimit</a> of <a href="20261027-compact_morphism_in_a_category.html#ID-3e47c100-b5af-4e8a-bb08-36593deaa6fb">compact morphisms</a>
</p>
