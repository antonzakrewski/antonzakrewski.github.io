<span id="ID-887153e0-9f6f-408d-983a-9ee0cff308bd"></span><h1 class="title">Allgemeines Kommutativgesetz</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M, \cdot)$ eine kommutativer <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">Monoid</a>, dann gilt für $m_i$ mit $i \in \{1,...,n\}$
</p>

<div class="math-block">\begin{align*}
\prod_{i = 1} m_i = \prod_{i=1} m_{\sigma(i)}
\end{align*}</div>
<p>
für eine beliebige <a href="20221026161747-permutation_abbildung.html#ID-af424eae-548d-4d43-8ff0-3c2930186d7c">Permutation</a> $\sigma \in S_n$
</p>
