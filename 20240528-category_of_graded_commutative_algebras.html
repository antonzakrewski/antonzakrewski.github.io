<span id="ID-c27d8d27-d4a6-4ef2-b04a-5467ee278973"></span><h1 class="title">category of graded-commutative Algebras</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20240523-graded_commutative_operation.html#ID-afc8429e-2a57-4baa-b790-1bd0634cd3af">graded-commutative ring</a>.
Then the category of graded-commutative Algebras is defined as <a href="20230402145452-coslice_category.html#ID-bdbe4411-02d7-4534-8788-2843a7007af4">coslice category</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{GCRing} \downarrow R
\end{align*}</div>
<p>
where $\mathrm{GCRing}$ is the <a href="20240529-category_of_graded_comumtative_rings.html#ID-cab0e2db-ecbb-458a-8816-373c6718125f">category of graded-comumtative rings</a>
</p>
