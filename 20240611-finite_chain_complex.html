<span id="ID-f20390b4-3cd4-4f66-89e9-b921b341b955"></span><h1 class="title">finite chain complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $\mathrm{RMod}$ the <a href="20230225170152-kategorie_mod.html#ID-15b21b3a-18bb-4d60-a716-c69681d7222d">category RMod</a> and $\mathrm{Ch_*}(\mathrm{RMod})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>
Then a finite chain complex $C_*$ is defined as <a href="20230802-chain_complex.html#ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36">chain complex</a> $C_*$ which is <a href="20240523-bounded_chain_complex.html#ID-f79967ec-a9ac-447c-9eef-e3cbf6a6d6ac">bounded chain complex</a> and degreewise <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a>
</p>
