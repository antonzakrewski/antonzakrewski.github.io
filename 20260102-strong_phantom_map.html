<span id="ID-8bc6b23a-8a09-440d-90a3-4df230cb0c16"></span><h1 class="title">strong phantom map of anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a> and $f: X \rightarrow Y$ be a map.
Then $f$ is said to be a strong phantom map, if the composition $F \rightarrow X \rightarrow Y$ is <a href="20230331213346-nullhomotopic.html#ID-a7d1984d-81e7-4e03-ad95-59bc1cdaeda8">nullhomotopic</a> for every <a href="20250319-finite_anima.html#ID-30921a08-94d0-49f1-86b3-c034afbee61a">finite anima</a>.
</p>
