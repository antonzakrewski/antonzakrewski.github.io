<span id="ID-e10e8478-8107-420a-8054-7247f8680224"></span><h1 class="title">Term (Logik)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\mathcal{L}$ eine <a href="20231016-signature.html#ID-a4607828-5015-4ae4-9d0e-dad0ce333bf7">Signatur</a>.
</p>

<p>
Dann werden Terme induktiv definiert:
</p>
<ol>
<li><a href="20230102151858-konstante_logik.html#ID-0d6c1469-f2b4-42d8-a8e5-86745ec31a9a">Konstanten</a> sind Terme</li>

<li><a href="20231016-variable.html#ID-b0b32c44-804e-4eac-8d1a-6bef0ca65a42">Variablen</a> sind Terme</li>

<li>für ein \(n\)-stelliges <a href="20231016-funktionssymbol.html#ID-fc0c9558-1948-495a-9877-25c440da002d">Funktionssymbol</a> $f$ und Terme $t_1,...,t_n$ ist $f(t_1,...,t_n)$ ebenfalls ein Term</li>
</ol>
