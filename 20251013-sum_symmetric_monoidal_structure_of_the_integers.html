<span id="ID-c4c1dd04-fe7a-48ec-87f2-edb3dd44351d"></span><h1 class="title">sum symmetric monoidal structure of the integers</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathbb{Z}$ be the integers, either regarded as <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">partially ordered</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> or as <a href="20220817230235-diskrete_kategorie.html#ID-77d5dcbb-96b0-4e9d-b130-0c021d8b3398">discrete category</a>.
Then the sum of integers is a <a href="20250307-symmetric_monoidal_infinity_category.html#ID-40c08a37-68ce-4dc1-8647-31caa12e9598">symmetric monoidal structure.</a>
</p>
