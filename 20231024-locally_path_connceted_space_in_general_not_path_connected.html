<span id="ID-d8ee4fc4-8b69-44ac-bbc2-516083144aee"></span><h1 class="title">locally path connected space in general not path connected</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20230308142220-lokal_wegzusammenhangend.html#ID-440c77bf-ffb1-45dc-92a4-b1fd98e19cb1">locally path connected</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is in general not <a href="20230308142110-wegzusammenhangender_raum_topologie.html#ID-09b1d548-9ac2-461c-8b3e-f72097f54a99">path connected</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
e.g. consider $* \coprod *$ as the disjoint union of two points, regarded as <a href="20231017-functor_from_set_to_the_discrete_topology.html#ID-dfbb848f-5430-498b-b8ed-b2766e69d9a0">discrete space</a>
</p>
