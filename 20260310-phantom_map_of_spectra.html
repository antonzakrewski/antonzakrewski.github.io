<span id="ID-ebaed878-08cf-4b5b-ae22-4349fa68eabc"></span><h1 class="title">strong phantom map of spectra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra</a> and $f: X \rightarrow Y$ be a map.
Then $f$ is said to be a strong phantom map, if the composition $F \rightarrow X \rightarrow Y$ is <a href="20230331213346-nullhomotopic.html#ID-a7d1984d-81e7-4e03-ad95-59bc1cdaeda8">nullhomotopic</a> for every <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectra</a>.
</p>
