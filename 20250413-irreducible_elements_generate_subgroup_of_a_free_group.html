<span id="ID-63acd9c1-bfed-4111-99e4-d1753782dd8a"></span><h1 class="title">irreducible elements generate submonoid of a free monoid</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20231018-free_monoid.html#ID-17a60093-aa3e-4cb7-999c-2bc23aed7942">free monoid</a> and $N \subseteq M$ a <a href="20230524094139-untermonoid.html#ID-1fd4d539-ed15-4239-8302-43c57d9cb669">submonoid</a> .
Then the <a href="20250413-irreducible_element_in_a_monoid.html#ID-2cdc2efb-74ab-46f9-9ba0-5a4305c94e1f">irreducible elements</a> of $N$ generate $N$
</p>

<h2 id="proof">Proof</h2>
<p>
use that each element $n \in M$ has a finite length regarded as a word.
Then induct on it.
</p>
