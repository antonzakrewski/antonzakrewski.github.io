<span id="ID-bc447b4f-b30f-4397-a56a-da537241e352"></span><h1 class="title">acyclic relation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $R$ a <a href="20211227225631-relation_mathe.html#ID-20e17f2d-e102-4093-8c48-e5b41db0ffbf">Relation</a> on $X$.
Then $R$ is said to be acyclic, if
</p>

<div class="math-block">\begin{align*}
x_0Rx_1 \land ... \land x_{k-1} R x_k \implies \lnot (x_{k} R x_{0})
\end{align*}</div>
<p>
for all $x_0,...,x_k \in X$
</p>

</div>
