<span id="ID-e7134637-f0a8-40cd-96f5-2bb3ca25fb0b"></span><h1 class="title">surjective image of a preimage</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> and $f: X \rightarrow Y$ a <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
For $A \subseteq Y$ we get
</p>

<div class="math-block">\begin{align*}
f[f^{-1}[Y]] = Y
\end{align*}</div>
