<span id="ID-2ee106db-9acf-4158-ab9c-f56a41e2312b"></span><h1 class="title">equivalence in an infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240422-quasicategory.html#ID-004ed508-3a84-4869-b5e6-618763186c2b">quasicategory</a> and $f \in X_1$ a morphism.
Then $f$ is said to be an equivalence, if
</p>

<div class="math-block">\begin{align*}
[f] \in hX
\end{align*}</div>
<p>
is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> for the <a href="20240404-homotopy_category_of_simplicial_sets.html#ID-68292036-ae98-4d9a-aa38-a8fa60ee2104">homotopy category</a>
