<span id="ID-a67174d6-2370-4505-99a9-90fc848e2c5b"></span><h1 class="title">absolute Homogenität einer Norm</h1>

<h2 id="axiom">Axiom</h2>
<p>
Sei $\alpha$ ein <a href="20220305210854-skalar.html#ID-90d0e9ca-03cd-46f2-82f1-03b2c47905ae">Skalar</a> mit dem <a href="20220105160433-absolut_betrag.html#ID-0e832c42-6806-429d-bd8a-218576bf2835">Absolut-Betrag</a> $\vert \alpha \vert$ und $x$ ein <a href="20210217215228-vektor.html#ID-be50263b-d29c-41c5-9909-2f5e106dc49c">Vektor</a>.
Dann gilt für die <a href="20220920053006-norm_eines_vektors.html#ID-445db843-5369-48de-a31f-f1f245833425">Norm eines Vektors</a>
</p>

<div class="math-block">\begin{align*}
\| \alpha \cdot x \| =&amp; \vert \alpha \vert \cdot \| x \|
\end{align*}</div>
