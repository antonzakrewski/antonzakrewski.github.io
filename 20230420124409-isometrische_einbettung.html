<h2 id="definiton">Definiton</h2>
<p>
Seien $(V,d),(W,d)$ <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrische Räume</a>.
Eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>  $\phi: V \rightarrow W$, ist eine Isometrie, falls für $v,v' \in V$ gilt:
</p>

<div class="math-block">\begin{align*}
d(v,v') = d(f(v),f(v'))
\end{align*}</div>
<p>
d.h. die Abbildung ist abstandserhaltend
