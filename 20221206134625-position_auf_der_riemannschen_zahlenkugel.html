<p>
Sei $z \in \overline{\mathbb{C}}$
</p>

<div class="math-block">\begin{align*}
f(z) = \begin{pmatrix} \frac{2 \mathrm{Re}(z)}{\vert z \vert^2 + 1}, \frac{2 \mathrm{Im}(z)}{\vert z \vert^2 + 1}, \frac{\vert z \vert^2 - 1}{\vert z\vert^2 + 1}  \end{pmatrix} 
\end{align*}</div>
