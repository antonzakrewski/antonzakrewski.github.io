<span id="ID-5f00b5f2-67dd-4acd-a5dc-e0e855a4c5c2"></span><h1 class="title">feinere Topologie erhält i.A. nicht T4-Eigenschaft</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20230522175136-t4_raum.html#ID-77ba69ea-9fa2-44a3-b922-2031bbb40d8d">T4</a> -<a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">Raumm</a> und $\mathcal{T}'$ eine <a href="20230227185527-feinere_topologie.html#ID-38a15a0c-913a-425c-b5d0-457bf916adcd">feinere Topologie</a> auf $X$.
Dann ist $\mathcal{T}$ i.A. kein <a href="20230522175136-t4_raum.html#ID-77ba69ea-9fa2-44a3-b922-2031bbb40d8d">T4-Raum</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
folgt aus der <a href="20230227174346-indiskrete_topologie.html#ID-9447f709-30a2-4b9a-b651-73909b037fad">indiskreten Topologie</a> als <a href="20230522175136-t4_raum.html#ID-77ba69ea-9fa2-44a3-b922-2031bbb40d8d">T4-Raum</a> und einer beliebigen, nicht <a href="20230522175136-t4_raum.html#ID-77ba69ea-9fa2-44a3-b922-2031bbb40d8d">T4-</a> <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">Topologie</a>
</p>
