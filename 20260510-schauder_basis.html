<span id="ID-f5011dfd-e9e7-4520-aa0c-764cd2a78058"></span><h1 class="title">schauder basis</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a>.
Then a (<a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">countable</a>) sequence $x_n \in X$ is said to be a schauder basis, if for each $x \in X$, there exists a sequence $\alpha_n \in \mathbb{K}$ such that
</p>

<div class="math-block">\begin{align*}
\sum_{n=1}^{\infty} \alpha_n x_n  = x
\end{align*}</div>
