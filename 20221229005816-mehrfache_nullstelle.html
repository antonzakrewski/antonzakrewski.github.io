<span id="ID-919e08d0-c7da-4065-86b0-bb96a70a2504"></span><h1 class="title">multiplicity of a root</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $K \subseteq L$ <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a>, $f \in K[x]$ über dem entsprechenden <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">Polynomring</a>.
$c \in L$ ist eine $m$ fache Nullstelle von $f$, wenn gilt
</p>

<div class="math-block">\begin{align*}
f =&amp; (x - c)^m \cdot g
\end{align*}</div>
<p>
für ein geeignetes $g \in L[x]$ mit $g(c) \neq 0$
</p>
