<span id="ID-38e7118c-8f31-4e4f-b958-9af22f05af15"></span><h1 class="title">topological group action</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(G, \mathcal{T}_G)$ be a <a href="20230226210828-topologische_gruppe.html#ID-0aa20bcb-5c3d-4d06-aeee-e61b46a46e48">topological group</a> and $(X, \mathcal{T}_X)$ a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
</p>

<p>
A topological group action is a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> map
</p>

<div class="math-block">\begin{align*}
\triangle: G \times X \rightarrow X
\end{align*}</div>
<p>
which is also a <a href="20230501095041-gruppenwirkung.html#ID-e8246fd3-cb62-4245-9ef1-59bc0326501a">group action</a> on the underlying sets
</p>
