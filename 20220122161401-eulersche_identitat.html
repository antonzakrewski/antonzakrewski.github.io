<span id="ID-1b64c8bb-9338-4e8b-91e6-6e43cb9b1984"></span><h1 class="title">Eulersche Identität</h1>



<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
e^{i\pi} + 1 = 0
\end{align*}</div>

<h2 id="herleitung">Herleitung</h2>
<ul>
<li>Spezialfall der <a href="20220225202318-eulersche_formel.html#ID-a44af9b5-a187-4031-a3a1-06a464bbe064">Eulersche Formel</a>:</li>
</ul>
<div class="math-block">\begin{align*}
e^{ix} =&amp; \cos(x) + i \sin(x) \\
e^{i \pi} =&amp; \cos(\pi) + i \sin(x) \\
=&amp; -1 &amp;&amp; \vert +1 \\
e^{i\pi} + 1 =&amp; 0
\end{align*}</div>
