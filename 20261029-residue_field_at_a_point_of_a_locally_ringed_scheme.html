<span id="ID-4c4fa1bd-7073-4f19-bc0e-f31bd049b11b"></span><h1 class="title">residue field at a point of a locally ringed scheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20230826-locally_ringed_space.html#ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728">locally ringed space</a> on a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $X$.
Then for any point $x \in X$, let $\mathfrak{m}_{x}$ be the <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a> of the <a href="20230825-stalk.html#ID-6fcbbbf4-984b-401a-840b-c614a03bd6a7">stalk</a> $\mathcal{O}_{X,x}$.
then the residue field is $\mathcal{O}_{X,x}/\mathfrak{m}_{x}$
</p>
