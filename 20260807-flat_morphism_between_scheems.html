<span id="ID-26c73138-988a-4592-8d60-8e7765c7a9fd"></span><h1 class="title">flat morphism between schemes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: S \rightarrow R$ be a morphism between <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">schemes</a>
Then $f$ is said to be flat, if the induced morphism on <a href="20230825-stalk.html#ID-6fcbbbf4-984b-401a-840b-c614a03bd6a7">stalks</a> is a <a href="20240702-flat_ring_morphism.html#ID-9d6a0006-5aec-4d6f-b8b8-9a8b75e43ba8">flat ring morphism</a>.
</p>
