<span id="ID-749963f0-191f-4a53-8b75-e645366b3d23"></span><h1 class="title">Totalität einer Relation</h1>

<h2 id="definition">Definition</h2>
<p>
Eine <a href="20220929191054-homogene_relation.html#ID-c0565fb9-7b15-4077-8f3a-5e8dce75c105">homogene Relation</a> auf einer <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $M$ erfüllt die Totalität, wenn für $x,y \in M$ gilt:
</p>

<div class="math-block">\begin{align*}
x \leq y \lor y \leq x
\end{align*}</div>
