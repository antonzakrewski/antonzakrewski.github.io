<span id="ID-def6ffac-1c21-427b-bacf-7b8580f5d7dd"></span><h1 class="title">Bildmenge</h1>

<h2 id="defintion">Defintion</h2>
<p>
Seien $M,N$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und Sei $f: M \rightarrow N$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
Für eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $U \subseteq M$ ist die Bildmenge definiert als
</p>

<div class="math-block">\begin{align*}
f[U]  \coloneqq \{y \in N \vert \exists u \in U : y = f(u)\}
\end{align*}</div>
