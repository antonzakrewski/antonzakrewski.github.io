<h2 id="definition">Definition</h2>
<p>
Die Supervenienz eines Phänomens / einer Theorie $A$ über einem anderen Phänomen / Theorie $B$ ist die Vorstellung, dass eine vollständig gleiche Kopie des mikroskopischen Systems $B$ auch eine vollständig Beschreibung des Systems $A$ erzeugt
