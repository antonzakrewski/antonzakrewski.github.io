<span id="ID-8f3e284b-c3c9-4aaf-8bf5-5eadc47faa78"></span><h1 class="title">Well Order</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>.
Eine Wohlordnung $&lt;$ auf $M$ ist eine <a href="20221010083632-totalordnung.html#ID-30e940f3-5f30-43e3-acda-3066e8c7e2fd">Totalordnung</a>, so dass für jede <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nichtleere</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $U \subseteq M$ genau ein <a href="20230825-minimal_element.html#ID-180a1321-d0d3-4200-89a3-fc5996c98ff8">minimales Element</a> existiert.
</p>
