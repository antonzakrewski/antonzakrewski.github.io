<span id="ID-3437d8b4-5940-4b93-b57c-e1e693be94f1"></span><h1 class="title">finitely generated A-Algebra over a noetherian ring is noetherian</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian</a> <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $B$ a <a href="20230731-finitely_generated_a_algebra.html#ID-20861333-797d-4ab1-9ad5-375661f357fc">finitely generated A-Algebra</a>.
Then $B$ is <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian</a>
</p>

<h2 id="proof">Proof</h2>
<p>
equivalent to <a href="20230725-hilberts_basissatz.html#ID-bafb9d38-4685-49aa-ae07-dd401c3ab8ba">Hilbert's basis theorem</a>:
</p>
<ul>
<li><a href="20230802-surjective_image_of_a_finitely_generated_ideal.html#ID-5f096f22-3249-4d19-ac4a-629fc3d5119e">surjective image of a finitely generated ideal</a></li>
</ul>
