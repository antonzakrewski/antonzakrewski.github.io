<span id="ID-71bb2d24-cad6-4ce3-84f1-89e0c4feac7e"></span><h1 class="title">Leitmonom</h1>

<h2 id="definition">Definition</h2>
<p>
sei $R$ ein <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">kommutativer Ring</a>, $f \in R[X_1,...,X_n]$ ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> im <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">Polynomring</a>.
Dann ist der Leitmonomo von $f$ definiert als
</p>

<div class="math-block">\begin{align*}
LM(f) = X^{\mathrm{multideg}(f)}
\end{align*}</div>
<p>
für ein <a href="20231030-multidegree.html#ID-21ca0a84-2650-4024-9515-825661563ebd">multidegree</a>
</p>
