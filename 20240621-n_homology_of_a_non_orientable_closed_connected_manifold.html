<span id="ID-cbdc3c92-b444-45db-8f27-f409ca995c7c"></span><h1 class="title">n homology of a non orientable closed connected manifold</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(M\) be a <a href="20240606-closed_topological_manifold.html#ID-e5619774-ee4d-40ce-ba8a-b98f23ddb7f2">closed</a>, <a href="20230118223336-zusammenhangender_raum.html#ID-bcc53507-bc5a-46d4-bd83-53e504f62b9d">connected</a>, \(n\)-dimensional non-<a href="20240613-orientable_manifold.html#ID-0d005026-25b5-4ebf-96b6-13ebb62c9c15">orientable</a> <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifold</a>.
Then the \(n\)-th homology is zero
</p>

<div class="math-block">\begin{align*}
H_n(M) = 0
\end{align*}</div>
