<span id="ID-c3333f7e-774b-4ecf-8ac4-bc488e50d9e2"></span><h1 class="title">idempotent ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathfrak{a} \subseteq A$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then $\mathfrak{a}$ is said to be idempotent, if for the <a href="20221227230103-komplexprodukt_von_idealen.html#ID-3b33d732-713a-4420-83bc-b934074e04ce">product</a> it holds
</p>

<div class="math-block">\begin{align*}
\mathfrak{a}^2 = \mathfrak{a}
\end{align*}</div>
