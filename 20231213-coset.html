<span id="ID-e34f7ab6-0ade-4026-b95f-34575a0904fa"></span><h1 class="title">coset</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $H \subseteq G$ a <a href="20221210192900-normalteiler.html#ID-f971f946-d0ca-444a-a450-efbef237a278">normal subgroup</a>.
Then a coset is defined as
</p>

<div class="math-block">\begin{align*}
gH \coloneqq \{g \cdot h \vert h \in H\}
\end{align*}</div>
