<span id="ID-f0ed140e-cbb8-4181-a3fd-cb4658c8f6e5"></span><h1 class="title">wide subdiagram</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $I: \mathcal{I} \rightarrow \mathcal{C}$ a <a href="20220821183856-diagramm_kategorientheorie.html#ID-ad9d3642-913a-4374-8605-52121d00b349">diagram</a> and $J: \mathcal{J} \rightarrow \mathcal{C}$ a <a href="20220821183856-diagramm_kategorientheorie.html#ID-ad9d3642-913a-4374-8605-52121d00b349">diagram</a>.
Then $J$ is said to be a wide subdiagram, if $\mathcal{J}$ is a <a href="20230923-wide_subcategory.html#ID-5402f354-344a-4dae-925e-ffa3eacd502e">wide subcategory</a> of $\mathcal{I}$
</p>
