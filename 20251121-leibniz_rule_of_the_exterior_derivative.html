<span id="ID-6311731d-3537-456b-abc5-2983853ae971"></span><h1 class="title">leibniz rule of the exterior derivative</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\omega, \psi \in \Omega^k(U)$ and $\varphi \in \Omega^p(U)$.
Then the <a href="20251120-exterior_deriderivative_of_a_differential_form.html#ID-cf820d40-a275-47aa-b0a7-113f72f65c85">exterior derivative</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{d}(\omega \wedge \psi) = \mathrm{d} \omega \wedge (-1)^k \omega \wedge \mathrm{d} \psi
\end{align*}</div>
