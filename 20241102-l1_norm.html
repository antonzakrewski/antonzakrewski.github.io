<span id="ID-dd5cd720-8352-4982-832f-e66762119fe1"></span><h1 class="title">L1 Norm</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{A}, \mu)$ ein <a href="20241019-maßraum.html#ID-2135bec8-c3bb-4fca-a24a-21334f66d7ae">Maßraum</a>, und $\mathcal{L}^1$ der <a href="20241102-l1_eines_maßraums.html#ID-88146254-0449-4704-9793-1ecad0d975ba">L1-Raum</a>
Dann ist die $\mathcal{L}^1$ Norm gegeben durch
</p>

<div class="math-block">\begin{align*}
\| g \|_1 \coloneqq \int \vert g \vert \mathrm{d} \mu
\end{align*}</div>
