<span id="ID-e3778ee7-f584-4361-b2c6-50797dafd308"></span><h1 class="title">trivial relation as equivalence relation</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>, then the <a href="20240128-trivial_relation.html#ID-7d24af1c-d488-4b2e-ae4a-abc6f418cdbd">trivial relation</a> is an <a href="20211227225754-aquivalenzrelation_mengenlehre.html#ID-bf83e0aa-4df1-48a5-b910-2837942bdd19">equivalence relation</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Nach Anname gilt für beliebiges $x,y \in S$ auch $x \sim y$.
Daraus folgt, dass $\sim$ reflexiv, symmetrisch und transitiv ist.
</p>
