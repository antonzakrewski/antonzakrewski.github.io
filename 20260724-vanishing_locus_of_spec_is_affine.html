<span id="ID-43198823-7beb-4dfc-9351-ca628a3e59db"></span><h1 class="title">vanishing locus of spec is affine</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $F \subseteq A$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>.
Then the <a href="20260611-vanishing_locus.html#ID-a6d0b1e2-0bfd-46db-9235-a7feb3ec46a1">vanishing locus</a> $V(F) \subseteq \mathrm{Spec}(A)$ is also an <a href="20260714-affine_scheme.html#ID-cf016ac0-38e9-410b-86e4-837df6983335">affine scheme</a>
</p>
