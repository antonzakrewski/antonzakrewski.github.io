<span id="ID-929f39d6-8392-4a4e-9a55-e3de5293e075"></span><h1 class="title">n-jet functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: Y \rightarrow X$ be a map of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Then the \(n\)-jet functor of $f$ is defined as
</p>

<div class="math-block">\begin{align*}
J_n(f)(-): \mathrm{CRing} \rightarrow&amp; \mathrm{Set}
R \mapsto Y(R[x]/(x^{n+1})) \times_{X(R[x]/(x^{n+1}))} X(R)
\end{align*}</div>

<p>
i.e. the pullback
