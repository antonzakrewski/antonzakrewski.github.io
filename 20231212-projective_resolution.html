<span id="ID-0d6124f2-59f2-4f96-838a-e8b023821bc6"></span><h1 class="title">projective resolution of an object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-additive_category.html#ID-e50cd553-69ee-4360-bd27-43b73e7a9945">additive</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $A \in \mathrm{Ob}(\mathcal{A})$ an <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> and $E_n \rightarrow A$ a <a href="20230903-left_resolution.html#ID-e89108bc-65a7-4d25-98a1-e02783af9995">resolution</a>.
Then $E_n$ is said to be projective, if each $E_n$ is a <a href="20230727-projective_object.html#ID-605bb0c6-3cb5-44d6-bb3e-660f0fef14d1">projective object</a>
</p>
