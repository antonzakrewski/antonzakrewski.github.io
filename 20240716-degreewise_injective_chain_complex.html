<span id="ID-6787d2d3-3fb9-4577-b4d0-3afb96013643"></span><h1 class="title">degreewise injective chain complexes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>
Then a <a href="20230802-chain_complex.html#ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36">chain complex</a> $I*_$ is said to be degreewise injective, if each $I_n$ is an <a href="20230903-injective_object.html#ID-7fbb0ef7-bb6c-4135-b65f-2d8fb5f2df00">injective object</a>
</p>
