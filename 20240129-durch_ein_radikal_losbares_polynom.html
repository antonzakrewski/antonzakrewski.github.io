<span id="ID-bbefb85c-71cf-4cd8-ac0c-6e55a0052cbb"></span><h1 class="title">durch ein radikal lösbares Polynom</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> mit $\mathrm{char}(K) = 0$ und $f \in K[X]$ ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a>.
Dann ist $f$ durch ein Radikal lösbar, falls eine <a href="20240124-radikalerweiterung.html#ID-4f0963a4-0b90-4a6d-8b87-abcac4024c3b">Radikalerweiterung</a> $M/K$ existiert, so dass $f$ in $M$ <a href="20221229010309-zerfallen_eines_polynoms.html#ID-8e83cdb4-e8e8-465c-806e-0960939bd509">zerfällt</a>
</p>
