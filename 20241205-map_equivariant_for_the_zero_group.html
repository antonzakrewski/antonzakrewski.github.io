<span id="ID-56c5bf3e-f649-4d6a-aaf0-9c5f08942f6c"></span><h1 class="title">map equivariant for the zero group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $0$ be the <a href="20230724-zero_group.html#ID-0f5c843a-aad5-40cb-9636-cf70849691aa">zero group</a> and $f: X \rightarrow Y$ a set theoretic <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> between <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> $X,Y$.
Then $f$ is <a href="20231205-g_equivariant_map.html#ID-3053c70b-dd6f-44e2-ba1e-dce86ece54f0">0-equivariant map</a> for the unique <a href="20241205-zero_group_action.html#ID-1d9b1e0f-febb-483f-94bc-5c3f5a66e84d">zero group action</a>
</p>
