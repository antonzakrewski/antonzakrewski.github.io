<span id="ID-0581a17b-a677-4694-aad8-d2d62355680f"></span><h1 class="title">solvable galois group induces radical solvable polynomial</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> of <a href="20221030164602-charakteristik_eines_korpers.html#ID-857e2abc-6f76-404f-bf65-6822c05d6bd3">characteristic</a> $\mathrm{char}(K) = 0$ and $f \in K[X]$ a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a>, such that the <a href="20231022-galoisgruppe_eines_polynoms.html#ID-9bb6b1e5-6ba5-446a-b3a7-600bbb167e14">galois group</a> is a <a href="20230808-solvable_group.html#ID-f168e64c-10ea-4dde-b86a-75dfc1e0e190">solvable group</a>
Then $f$ is <a href="20240129-durch_ein_radikal_losbares_polynom.html#ID-bbefb85c-71cf-4cd8-ac0c-6e55a0052cbb">solvable through radicals</a>.
</p>
