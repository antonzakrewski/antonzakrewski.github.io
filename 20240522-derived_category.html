<span id="ID-944ca246-1184-47bc-858b-76b6ff140f1d"></span><h1 class="title">derived category</h1>

<h2 id="definition">Definition</h2>
<p>

then the derived category is the <a href="20231111-localization_of_a_category.html#ID-85d80d2e-d195-492e-ad38-1c93a91972af">localization</a> at the <a href="20231212-quasi_isomorphism.html#ID-4d0430a5-c6db-4a21-8c43-cd224592d992">quasi-isomorphisms</a>
</p>
