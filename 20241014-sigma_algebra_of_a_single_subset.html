<span id="ID-fd6f9285-fb1b-4700-8305-4b2c755e42e5"></span><h1 class="title">sigma algebra of a single subset</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>, $A$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>
Then the <a href="20220903142815-sigma_algebra.html#ID-54306c73-fba1-4737-a42e-adc9ce14a354">sigma-algebra</a> of $A$ is defined as
</p>

<div class="math-block">\begin{align*}
\sigma(A) = \{\emptyset, X, A, A^{c}\}
\end{align*}</div>
