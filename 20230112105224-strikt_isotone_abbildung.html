<span id="ID-e3c2cf03-af7c-4ae7-b2ee-7f1fea4a0bd3"></span><h1 class="title">strikt isotone Abbildung</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M,N$ zwei <a href="20221010083701-strenge_halbordnung.html#ID-dff923e4-485d-47da-a612-5ad65818c875">streng halbgeordnete</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und $f: M \rightarrow N$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>
$f$ ist eine strikt isotone Abbildung, falls für $m,m' \in M$ gilt:
</p>

<div class="math-block">\begin{align*}
m &lt;_M m' \Rightarrow f(m) &lt;_N f(m')
\end{align*}</div>
