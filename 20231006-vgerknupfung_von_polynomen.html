<span id="ID-0ea18f67-8661-4f62-aef0-3c4035fd4981"></span><h1 class="title">Composition of Polynomials</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $f,g \in R[X]$ <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomials</a>.
</p>

<p>
Then the composition $f \circ g$ is defined as the image of the <a href="20221226010643-einsetzungshomomorphismus.html#ID-714a456e-dcd8-4e03-906b-2b497bf77766">evaluation homomorphism</a> $\varphi_g: R[X] \rightarrow R[X]$
</p>

<div class="math-block">\begin{align*}
f \circ g \coloneqq \varphi_g(f) 
\end{align*}</div>
