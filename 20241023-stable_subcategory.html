<span id="ID-bfd1a6f2-74c1-4474-a8d1-786c0b4ac46a"></span><h1 class="title">stable subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity category</a> and $\mathcal{C}_0$ a <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a>.
Then $\mathcal{C}_0$ is said to be a stable subcategory, if it contains the <a href="20241017-infinity_zero_object.html#ID-ec40b632-b794-428c-b987-81a9b53bd650">zero object</a> and is closed under <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber</a>s and <a href="20241022-cofiber_of_an_infinity_morphis3.html#ID-c9321dad-6e04-418b-a0a5-ad8546205938">cofibers</a>
</p>
