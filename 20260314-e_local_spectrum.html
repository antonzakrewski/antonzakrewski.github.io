<span id="ID-428f60df-5c7b-4edd-9bfd-f9fcb062f3f3"></span><h1 class="title">E-local spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,E$ be <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra.</a>
Then $X$ is said to be an \(E\)-local spectrum, if the <a href="20240603-mapping_space_of_objects_in_a_quasi_category.html#ID-b5b60979-1586-4548-b06f-5ceca4b045fa">mapping anima</a> $\mathrm{Hom}_{\mathrm{Sp}}(X,A)$ is contractible for all <a href="20260215-e_acyclic_spectrum.html#ID-dc701420-f509-471a-935c-d2c2f28108d2">E-acyclic spectra</a> $A$.
</p>
