<span id="ID-f8c7363e-df86-4b35-aee3-3eb004a5303c"></span><h1 class="title">Lower set</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> mit einer <a href="20220817224552-quasiordnung.html#ID-bccd39d9-8112-4631-b0b0-41b568820901">Quasiordnung</a> $\leq$.
Eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $L$ ist ein Lower Set, wenn gilt:
</p>

<div class="math-block">\begin{align*}
\forall l \in L \forall m \in M : m \leq l \Rightarrow m \in L
\end{align*}</div>
