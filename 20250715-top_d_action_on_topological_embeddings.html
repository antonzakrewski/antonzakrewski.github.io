<span id="ID-a9ab1d12-424f-42fd-9fcc-60a20c9c2c7a"></span><h1 class="title">Top_0(d) action on pointed topological embeddings</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">topological manifold</a>, then there exists a <a href="20231020-topological_group_action.html#ID-38e7118c-8f31-4e4f-b958-9af22f05af15">topological group action</a> of <a href="20250429-top_0_d.html#ID-8e8d3a09-54ad-4547-9134-ff46556b0430">Top_0(d)</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Top}(d) \curvearrowright \mathrm{Emb}_0(\mathbb{R}^d, M)
\end{align*}</div>
<p>
on the <a href="20250715-pointed_embeddings_out_of_r_d.html#ID-cc2d9162-9778-4575-ae2f-c06dfa36f3ca">pointed embeddings out of R^d</a>
</p>
