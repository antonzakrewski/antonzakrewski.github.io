<span id="ID-a6508800-dca4-4416-a98f-20852e72335a"></span><h1 class="title">affine covering of a projective variety</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a> <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a> and $X \subseteq \mathbb{P}_{K}^n$ <a href="20230901-projective_variety.html#ID-15ff0e97-1d25-461a-aef8-dac9ace2de9c">projective variety</a>
Then the <a href="20231130-affine_covering_of_a_projective_space.html#ID-64c52d90-bb63-426b-97b8-de22b5f703bb">affine covering of a projective space</a> induces an <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open cover</a> by <a href="20230313162316-affine_varietat.html#ID-d401938b-d6e1-4d50-a84a-73eb4e945380">affine varieties</a>
</p>
