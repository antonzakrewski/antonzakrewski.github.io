<span id="ID-e2219f15-fed4-45d5-95d2-c97756caa74c"></span><h1 class="title">finitely complete infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
An <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> $\mathcal{C}$ is said to be finitely complete, if it admits all <a href="infinity-limit.html#ID-a8bcf958-5282-4984-8415-7a64cca74613">limits</a> $I \rightarrow \mathcal{C}$ where $I$ is a <a href="20240919-finite_simplicial_set.html#ID-fc424857-42c4-40cc-9f8a-6bf59686baa6">finite simplicial set</a>
</p>
