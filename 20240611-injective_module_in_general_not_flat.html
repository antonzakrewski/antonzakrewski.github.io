<span id="ID-364489f6-540a-40ab-87ba-4ad23bca69bb"></span><h1 class="title">injective module in general not flat</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let (A) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ an <a href="20230803-injective_module.html#ID-c14a1ecb-aad5-402f-b835-7857c7b39dfb">injective</a> left (A)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then $M$ is in general not <a href="20230801-flat_module.html#ID-1fec67f0-a4f2-444f-a53f-3e8e7fcfc491">flat</a>
</p>

<h2 id="proof">Proof</h2>
<p>
consider the
</p>
<ul>
<li><a href="20240611-rational_circle_group.html#ID-a8f3345e-dea5-4198-85c5-40d15d60521d">rational circle group</a> </li>

<li><a href="20240611-rational_circle_group_as_injective_group.html#ID-c05a5861-831a-4dbf-9f7d-aa2ca4bda5f8">rational circle group as injective group</a>   </li>
</ul>
<p>
using <a href="20230801-flat_module_as_torsion_free_module.html#ID-e155454e-0540-4509-afab-fac1426220e4">flat module as torsion free module</a> this is a contradiction
</p>
