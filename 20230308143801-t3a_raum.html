<span id="ID-4c7876f8-c1d5-40d4-93e4-ac1d9fcc9ae0"></span><h1 class="title">Tychonoff-Raum</h1>

<h2 id="definition">Definition</h2>
<p>
Ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> $(X,\mathcal{T})$ ist ein Tychonoff-Raum, falls für eine <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">abgeschlossene</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $A \subseteq X$ und $x \in X \setminus A$ eine <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">stetige</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f$ mit:
</p>

<div class="math-block">\begin{align*}
f: X \rightarrow&amp; [0,1] \\
f_{\vert A} =&amp; 0 \\
f(x) =&amp; 1
\end{align*}</div>

</div>
