<span id="ID-cf287558-75d7-4743-8a95-bda7f1456036"></span><h1 class="title">nonvanishing locus of Proj_d is affine</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">N-graded ring</a>, $f \in A_d$.
Then $D(f) \subseteq \mathrm{Proj}_d(A)$ is <a href="20241206-equivalent_objects_in_an_infinity_category.html#ID-cbb1ac2c-2755-4d4a-9a75-56978060b40f">equivalent</a> to the <a href="20260714-affine_scheme.html#ID-cf016ac0-38e9-410b-86e4-837df6983335">affine scheme</a> $\mathrm{Spec}(A_{(f)})$ or $\mathrm{Spec}((A_f)_0)$.
</p>
