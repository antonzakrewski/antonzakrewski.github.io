<span id="ID-dc3f315e-037a-4e32-ae37-092c62fe3f94"></span><h1 class="title">Koabzählbare Menge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ eine <a href="20220903142722-grundmenge.html#ID-2b5bcaae-5d96-4b8b-b31d-b77527fe22d3">Grundmenge</a>, dann ist $Y \subseteq X$ eine koabzählbare Menge, falls $X \setminus Y$ <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">abzählbar</a> ist.
</p>
