<span id="ID-dca64cdc-1909-4d6e-a33f-f38205c55474"></span><h1 class="title">tensor product of projective modules is a projective module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $P,Q$ <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective modules</a>.
Then so is $P \otimes_A Q$
</p>
