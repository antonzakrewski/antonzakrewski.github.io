<span id="ID-e5cedcc9-20d9-4a8d-b8c9-d361df6a944d"></span><h1 class="title">sheaf for a site</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \tau$ be a <a href="20240905-topology_on_a_category.html#ID-1d3088ed-8349-4321-bc74-474deaece4b1">topology on a category</a> and $\mathcal{F}: \mathcal{C}^{\mathrm{op}} \rightarrow \mathrm{Set}$ a <a href="20220821183047-pragarbe.html#ID-6aa2a293-0ff3-4cba-b6c3-61d8eabf0871">presheaf</a>
Then $\mathcal{F}$ is said to be a sheaf if it satisfies <a href="20250831-descent_of_a_presheaf.html#ID-cd6e7dc2-9935-4c5f-8793-0ff22b2048e2">descent</a> for each <a href="20230923-sieve.html#ID-4682cea8-3c62-49f6-ae4c-3deb9dd4dec6">sieve</a> in the topology.
</p>
