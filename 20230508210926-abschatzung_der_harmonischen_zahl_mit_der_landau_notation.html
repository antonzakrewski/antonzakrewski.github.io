<h2 id="satz">Satz</h2>
<p>
Für die <a href="20230327225748-harmonische_zahl.html#ID-a4bfe849-4829-48a0-a660-bcb7c06886f6">Harmonische Zahl der Ordnung 1</a> gilt:
</p>

<div class="math-block">\begin{align*}
H_{n-1} = \ln(n) + \gamma - \frac{1}{2n} - \sum_{k=1}^{m} \frac{B_{2k}}{2k}n^{-2k} + O(n^{-2m-2})
\end{align*}</div>
