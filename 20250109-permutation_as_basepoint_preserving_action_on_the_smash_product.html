<span id="ID-bb2e8a78-7075-4730-a0b0-b7f054b4a980"></span><h1 class="title">permutation as basepoint preserving action on the smash product</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X,*)$ be a <a href="20230331112759-based_space.html#ID-2b4bad5a-2a2b-4aac-8f24-1ed9951887f8">based space</a>, $\bigvee_{i \in I} X$ the <a href="20231024-smash_product_of_topological_spaces.html#ID-c5721341-7916-4887-a652-2faf2755f195">smash product of topological spaces</a>.
Then the <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">symmetric group</a> acts basepoint preserving by permutation of the components.
</p>
