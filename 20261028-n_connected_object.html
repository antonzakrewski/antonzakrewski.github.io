<span id="ID-b02e1142-87c3-4c42-abe5-f0ba1399b84c"></span><h1 class="title">n-connected object in a presentable category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241016-presentable_infinity_category.html#ID-346bd670-f443-4290-83e6-015d1801ed20">presentable</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>.
then an object $x$ is said to be n-connected, if $\tau_{\leq n} x \cong *$ is contractible.
</p>
