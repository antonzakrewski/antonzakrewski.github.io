<span id="ID-025bc26d-909b-451b-85fe-090bebcfba86"></span><h1 class="title">R/Rs is S-nilpotent</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be an (\mathbb{E}_1)-<a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a> and $S \subseteq \pi_*(R)$ be a <a href="20250824-homogeneous_subset_of_a_graded_ring.html#ID-70f4eba6-6766-49dd-9887-ae5903c7e7dc">homogeneous subset</a> satisfying the <a href="20250823-left_ore_condition.html#ID-5992e9ea-9007-4905-8cd5-a70a6ae7693b">left ore condition</a>.
Then <a href="20250824-r_rs_of_a_module_spectrum.html#ID-41934a58-888a-43ef-b386-723f993c9bae">R/Rs</a> is <a href="20250823-s_nilpotent_ring_spectrum.html#ID-d6f80a66-9acf-4190-81f5-8c65d13d9523">S-nilpotent</a>
</p>
