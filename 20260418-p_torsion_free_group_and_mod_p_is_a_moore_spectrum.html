<span id="ID-ee7080d7-ae4e-474f-917b-c44f14a73d57"></span><h1 class="title">p-torsion free group and mod p of the moore spectrum is a moore spectrum</h1>

<h2 id="proposition">Proposition</h2>
<p>

<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$\mathbb{S}_{A}/p$ is also a moore spectrum  </li>

<li>$A$ is \(p\)-<a href="20230222205807-torsionsfreier_modul.html#ID-46622402-49f7-4528-89d0-1f69bb8c8ca0">torsion-free</a></li>
</ol>
