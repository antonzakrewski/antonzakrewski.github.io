<h2 id="definition">Definition</h2>
<p>

Then $M$ is artinian, if every <a href="20230222205150-kette.html#ID-0b38d50a-42b8-4d13-9f40-0248f887ca7d">chain</a> of <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodules</a>
</p>

<div class="math-block">\begin{align*}
m_1 \supseteq m_2 ...
\end{align*}</div>

stabilizes (see: <a href="20230725-descending_chain_condition.html#ID-d6aa0469-ff91-49ff-8550-b30c24f37e99">descending chain condition</a>)
