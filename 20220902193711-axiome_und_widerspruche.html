<span id="ID-6a9ec67b-2a46-4d62-a1b7-ee0654ce9185"></span><h1 class="title">Axiome und Widersprüche</h1>

<h2 id="these">These</h2>
<p>
Durch Hinzufügen von <a href="20211218202759-axiom.html#ID-b8bfc71a-3de8-4144-9b1d-35dbd818ffd3">Axiomen</a> werden keine <a href="20220902194001-widerspruch.html#ID-d758d8be-c0f8-45d8-b7b4-5d9ecc65476a">Widersprüche</a> aufgelöst, da durch die <a href="20211218202759-axiom.html#ID-b8bfc71a-3de8-4144-9b1d-35dbd818ffd3">Axiome</a> die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> an beweisbaren Sätzen größer wird.
Sollte ein <a href="20220902194001-widerspruch.html#ID-d758d8be-c0f8-45d8-b7b4-5d9ecc65476a">Widerspruch</a> unter gewissen Annahmen bestehen, so sind durch den <a href="20210305204939-beweis_durch_widerspruch.html#ID-ee659788-c975-494a-aef0-85087f3db839">Beweis durch Widerspruch</a> die Annahmen falsch.
</p>
