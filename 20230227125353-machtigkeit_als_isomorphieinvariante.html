<span id="ID-1283512b-c1b3-4930-a44a-cd476ec80e4e"></span><h1 class="title">Mächtigkeit als Isomorphieinvariante</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $A$ und $B$ <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">Objekte</a> einer <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">Kategorie</a> $\mathcal{C}$ und $f: A \rightarrow B$ ein <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">Isomorphismus</a>, dann ist die <a href="20220830165831-machtigkeit_kategorientheorie.html#ID-c26840e3-a2ed-466f-9bfd-51f524549287">Mächtigkeit</a> eine <a href="20230226183037-isomorphieinvariante.html#ID-c2b2faa5-362f-4a92-949c-ed3751f4acba">Isomorphieinvariante</a>
</p>

folgt aus der Definition der <a href="20211227215415-machtigkeit_menge.html#ID-a53ec5a2-0adb-4575-bf21-e3ac15eff75f">Mächtigkeit</a> und der <a href="20230225172642-bijektive_abbildung_kategorientheorie.html#ID-76c83ef0-2fc8-43c5-b243-5dec6eb96914">Bijektivität</a> eines <a href="20230318213240-isomorphismus_algebra.html#ID-3e254a9d-81eb-40a1-90bb-ba7634aab1ee">Isomorphismus</a>
