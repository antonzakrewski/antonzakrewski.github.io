<span id="ID-d4cb689c-b2b7-4493-a64b-73283e71f8ae"></span><h1 class="title">Urbildfilter</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $X,Y$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und $f: X \rightarrow Y$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> und $\mathcal{F}$ ein <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Mengenfilter</a> auf $Y$.
Dann ist der von der <a href="20230307220152-filterbasis.html#ID-b663b997-58b1-4959-89ec-725ed853a062">Filterbasis</a> $f^{-1}[\mathcal{F}]$ erzeugte <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Mengenfilter</a> - sofern <a href="20220304105106-wohldefiniert_mathe.html#ID-81e35048-a75d-47ae-ada1-99f600ac072f">wohldefiniert</a> - der Urbildfilter.
</p>
