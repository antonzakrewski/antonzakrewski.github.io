<span id="ID-d3f14aae-8e33-42b6-baf9-f9c9806a49e5"></span><h1 class="title">differentiability class with compact support</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230905-differentiable_manifold.html#ID-ba8bdca8-4840-4256-a470-293790ae1aca">differentiable manifold</a>, $k \in \mathbb{N}_0 \cup \{\infty\}$.
Then $C^k_{c}(M)$ is defined as subset of $C_c^k(M)$ (cf.  <a href="20241117-differentiability_class_of_a_manifold.html#ID-473c3dd9-f398-4e26-97f5-5400964d4102">differentiability class</a>) where for $f \in C_c^k(M)$ the <a href="20230624-trager.html#ID-f53b74a3-1cba-4145-af24-c4023be0c782">support</a> $\mathrm{supp}(f)$ is <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a>
</p>
