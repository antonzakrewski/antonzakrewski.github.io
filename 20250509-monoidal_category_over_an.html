<span id="ID-30099c3c-7ae9-4b8d-bbfd-0a64d446145d"></span><h1 class="title">monoidal category over a cartesian pattern</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{O}$ be an <a href="20250509-cartesian_pattern.html#ID-17215c26-413d-44d3-9405-6d0c808acfd7">cartesian pattern</a>.
</p>

<p>
Then an \(\mathcal{O}\)-monoidal pattern is a <a href="20241016-cocartesian_fibration.html#ID-7a1a4669-5b45-4337-a199-3e24eacd9d71">cocartesian fibration</a>
</p>

<div class="math-block">\begin{align*}
\mathcal{V}^{\otimes} \rightarrow \mathcal{O}
\end{align*}</div>
<p>
such that the <a href="20241112-straightening_functor_of_cocartesian_fibrations.html#ID-8758c87e-000f-43c9-88bb-1a7d7a566ea5">straightening</a> is an <a href="20250509-monoid_over_a_cartesian_pattern.html#ID-029139df-2f9c-46d5-9cd3-5c15dda5e60e">monoid</a>
</p>
