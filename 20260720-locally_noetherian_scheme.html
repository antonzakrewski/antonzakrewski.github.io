<span id="ID-dfd685c3-9a28-4ed4-b6d3-6fdad64f5ce9"></span><h1 class="title">locally noetherian scheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a>
Then $X$ is said to be locally noetherian, if there exists an <a href="20260808-affine_open_cover.html#ID-a9d9c61f-a292-4700-a718-fe736d40ab5d">affine open cover</a> with $\mathrm{Spec}(A_i)$ for <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian rings</a> $A_i$.
</p>
