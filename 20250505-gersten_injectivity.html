<span id="ID-e7eb5f3d-e07c-49e1-9abe-1d15a10fe804"></span><h1 class="title">gersten injectivity conjecture</h1>

<h2 id="conjecture">Conjecture</h2>
<p>
Let $R$ be a <a href="20230915-discrete_valuation_ring.html#ID-9dbbc45d-7387-4f66-9cbd-14cbc9773b7a">discrete valuation ring</a>.
Then for all $n \in \mathbb{N}$ the map
</p>

<div class="math-block">\begin{align*}
K_n(R) \rightarrow K_n(Q(R))
\end{align*}</div>
<p>
is <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injective</a>
</p>

<p>
where $Q(R)$ is the (? fraction field) <a href="20230603-universal_property_of_a_quotient_field.html#ID-cd4c145d-0938-4732-9bde-52806452ab2a">quotient field</a>
</p>
