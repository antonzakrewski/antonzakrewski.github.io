<span id="ID-b1aa18db-007c-4efd-bf7a-732ffed6b248"></span><h1 class="title">sum of subsets of a module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, Let $M$ be an A-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and $M_1,M_2 \subseteq M$ be <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subsets</a>.
Then the sum is defined as
</p>

<div class="math-block">\begin{align*}
M_1 + M_2 \coloneqq \{m_1 + m_2 \vert m_1 \in M_1, m_2 \in M_2\} 
\end{align*}</div>
