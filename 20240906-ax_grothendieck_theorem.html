<span id="ID-04ece39d-517d-45ff-842e-3c35355f631d"></span><h1 class="title">Ax-Grothendieck theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: \mathbb{C}\mathbb{P}^n \rightarrow \mathbb{C}\mathbb{P}^n$ be a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a>
Suppose $f$ regarded as function with the <a href="20221226010643-einsetzungshomomorphismus.html#ID-714a456e-dcd8-4e03-906b-2b497bf77766">evaluation homomorphism</a> is <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injective</a>, then $f$ is <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a>
</p>
