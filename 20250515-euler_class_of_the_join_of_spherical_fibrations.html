<span id="ID-1abe82df-00ba-4751-a1f6-ae653907f698"></span><h1 class="title">euler class of the join of spherical fibrations</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\pi: E \rightarrow B, \pi': E' \rightarrow B'$ be <a href="20250429-spherical_fibration.html#ID-5101116a-27b3-43c5-accd-2eb9fa285974">spherical fibrations</a>.
Then the <a href="20250506-euler_class_of_a_spherical_fibration.html#ID-4b5bbe4c-c759-4354-a93d-060bac75d685">F2 euler class</a> is given by
</p>

<div class="math-block">\begin{align*}
e(\pi \star \pi') = e(\pi) \times e(\pi')
\end{align*}</div>
