<span id="ID-8e826462-6f21-4c19-a763-fc1105fdde78"></span><h1 class="title">locally closed</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $E \subseteq X$.
Then $E$ is locally closed, if for each $x \in E$ there exists an <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $U$ such that $E \cap U$ is <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a>
</p>
