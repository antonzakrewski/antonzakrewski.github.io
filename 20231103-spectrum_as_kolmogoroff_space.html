<span id="ID-f373acf0-bab7-4cef-88aa-cf2bbbb9484e"></span><h1 class="title">Spectrum as Kolmogoroff Space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $\mathrm{Spec}(A)$ the <a href="20230725-zariski_spectrum.html#ID-be298171-f5f5-4ad4-8574-afe3257110d2">zariski spectrum</a> with the <a href="20230725-zariski_topology.html#ID-1535e0f9-be74-4d53-9ca1-c88439a2a34b">Zariski topology</a>.
Then $\mathrm{Spec}(A)$ is a <a href="20230227195003-t0_raum.html#ID-d6e07759-ca3c-4719-883b-6adf2b193256">Kolmogoroff Space</a>
</p>
