<span id="ID-812f7ce4-7570-4366-875f-29b329af6906"></span><h1 class="title">relative singular homology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,A)$ be a <a href="20230331113453-pair_of_spaces.html#ID-a5c438a8-0ae6-40b1-93a4-5f5b59a22cf3">pair of spaces</a>, then the relative singular homology is defined as the homolog group of the <a href="20240123-relative_singular_chain_complex.html#ID-532368dd-a2df-4546-8d07-64315e110c9f">relative singular chain complex</a>
</p>

<div class="math-block">\begin{align*}
H_{n}(X,A) = \mathrm{ker}(\partial^{n-1})/\mathrm{im}(\partial^n)
\end{align*}</div>
