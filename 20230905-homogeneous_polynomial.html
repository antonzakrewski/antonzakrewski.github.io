<span id="ID-43659155-fbcc-4058-b0b3-5ff0a9c911ac"></span><h1 class="title">homogeneous polynomial</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $f \in R[X_i \vert i \in I]$ hte <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a>.
Then $f$ is said to be a homogoneous polynomial, if each <a href="20230905-monomial.html#ID-0c3d60db-952a-4c22-a40e-9b951ec409e7">monomial</a> has the same <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">degree</a>.
</p>
