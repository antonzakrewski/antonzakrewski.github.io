<span id="ID-6cdb2717-12c2-4233-87b8-2a91f9c965ea"></span><h1 class="title">characters are linearly independent</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\{V_i\}$ be non-isomorphic <a href="20261013-irreducible_representation_of_an_algebra.html#ID-d63374c8-6c64-4ee3-bc2b-bd75c8272d12">simple A-representations</a> over a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> <a href="20221125133249-k_algebra.html#ID-74ada59f-7a40-49a2-b525-be8af0628fe9">K-Algebra</a> $A$.
Then $\chi_{V_i}: A \rightarrow k$ are <a href="20220207224644-lineare_unabhangigkeit.html#ID-c4d1496f-6012-4ade-8b98-3e29dad89ded">linearly independent</a> in the vector space $A^*$
