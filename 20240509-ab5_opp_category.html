<span id="ID-0d44407d-fb10-4f44-86e5-bd30e658ed0b"></span><h1 class="title">ab5 opp category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>
Then $\mathcal{A}$ is said to be ab5 $\mathrm{opp}$ if $\mathcal{A}$ is <a href="20240308-ab5_category.html#ID-e7f6fe0a-037c-45e4-940a-37c6c1b068a3">Ab5</a>
</p>

<p>
i.e. $\mathcal{A}$ is <a href="20230923-complete_category.html#ID-8877dd56-54c0-42cc-a1d8-2785b0cec19b">complete</a> and <a href="20231015-cofiltered_limit.html#ID-7c4bbb0b-1471-425f-9dec-8cf3814ce7dc">cofiltered limits</a> are <a href="20230726-exact_functor.html#ID-9541d8fb-ddba-43d6-941a-32b3b3bd7086">exact</a>
</p>
