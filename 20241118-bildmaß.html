<span id="ID-e35088e9-e9a9-4934-92f9-f9731fc28080"></span><h1 class="title">Bildmaß</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{A}, \mu)$ ein <a href="20241019-maßraum.html#ID-2135bec8-c3bb-4fca-a24a-21334f66d7ae">Maßraum</a>, $(E, \mathcal{E})$ ein <a href="20230302132218-messraum.html#ID-7d8d7a50-6fe1-4cee-a847-365b73490c86">Messraum</a> und $f: X \rightarrow E$ eine <a href="20241028-messbare_abbildung.html#ID-5ff4140d-12c6-47ae-bcca-fbfaf4a56018">messbare Abbildung</a>.
Dann ist das Bildmaß definiert als
</p>

<div class="math-block">\begin{align*}
(f^{-1})^*(\mu): \mathcal{E} \rightarrow&amp; \mathbb{R}_0^+ \\
A \mapsto \mu(f^{-1}[A])
\end{align*}</div>


</div>
