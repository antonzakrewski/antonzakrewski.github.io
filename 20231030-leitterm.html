<span id="ID-dd651610-0a3f-4d3a-a023-7054df6eec87"></span><h1 class="title">Leitterm</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $f \in R[X_1,...,X_n]$ a <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a> and $&gt;$ a <a href="20231030-monomordnung.html#ID-6e957901-1e39-4a42-936c-cdb51c862a3c">monomial order</a>
Then the Leitterm of $f$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{LT}(f) \coloneqq LC(f) \cdot LM(f)
\end{align*}</div>
