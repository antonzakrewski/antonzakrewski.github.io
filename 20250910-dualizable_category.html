<span id="ID-d570b7cb-a637-4628-80ab-81f7d9664421"></span><h1 class="title">dualizable category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241016-presentable_infinity_category.html#ID-346bd670-f443-4290-83e6-015d1801ed20">presentable</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>.
Then $\mathcal{C}$ is said to be dualizable, if it is a <a href="20250604-dualizable_object.html#ID-d7ce66ea-0546-4473-8c08-89abdaf29e7a">dualizable object</a> in <a href="20241021-infinity_category_of_l_presentable_categories.html#ID-27acd6b6-61c9-45fc-98f4-e8edef2835d4">category PrL</a> with respect to the <a href="20250307-category_prl_as_closed_symmetric_monoidal_category.html#ID-2567d539-b762-4b09-99e1-a022b6007879">monoidal structure</a>
</p>
