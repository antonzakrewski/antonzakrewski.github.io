<span id="ID-aa94b66d-bdeb-4885-ab5e-cc7a05cb378f"></span><h1 class="title">cube poset union</h1>

<h2 id="definition">Definition</h2>
<p>
Given $[m]$ as <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> linear order, $i \leq j \leq k$ with $i,j,k \in [m]$ there exists the canonical <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> of <a href="20240708-cube_poset.html#ID-1c594c5d-4b9b-4c2f-80df-8b7cedf4df4a">cube poset</a> <a href="20230827-partially_ordered_set_as_category.html#ID-0f6d0690-68f0-4695-ba6d-d417aa9eb938">regarded as categories</a>
</p>

<div class="math-block">\begin{align*}
\cup: P_{i,j} \times P_{j,k} \arrow[]{r}{} P_{i,k}
I,I' \mapsto&amp; I \cup I'
\end{align*}</div>
