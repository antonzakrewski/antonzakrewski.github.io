<span id="ID-abcc4488-70f4-435a-b442-d50a83da1ef3"></span><h1 class="title">uniform structure induced by a pseudometric</h1>

<h2 id="definition-proposition">Definition / proposition</h2>
<p>
Let $(M,d)$ be a <a href="20221115113143-pseudometrik.html#ID-85960f3d-c84e-4099-ab8f-f7ab99f228f5">pseudometric</a>.
Then the pseudometric induces a <a href="20230405231607-uniform_structure.html#ID-22331a0e-55ad-4240-9ad1-80ebdbfa9e20">uniform structure</a> defined by following <a href="20230406002119-fundamental_system_of_entourages.html#ID-405ca9ae-393b-4bf6-939a-892858b11634">fundamental system of entourages</a>:
</p>

<div class="math-block">\begin{align*}
U_a = \{(x,y) \in X \times X : d(x,y) \leq a, a &gt; 0 \}
\end{align*}</div>
