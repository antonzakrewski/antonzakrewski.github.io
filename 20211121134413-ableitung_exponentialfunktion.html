<span id="ID-37b13ba9-4b00-4576-ab98-9b5e4002cefc"></span><h1 class="title">Ableitung der Exponentialfunktion (Q12)</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $f(x) = a^x$ die Exponentialfunktion für $a \in \mathbb{R}^+$.
Dann ist $f$ <a href="20210217184102-differenzierbarkeit.html#ID-3a5a92c4-2d28-46ae-91f9-92603797aa69">differenzierbar</a> mit <a href="20210217212957-ableitungsfunktion.html#ID-868ce7d4-5ad4-4475-a5c1-26f943fe851a">Ableitung</a>
</p>

<div class="math-block">\begin{align*}
f'(x) = \ln(a) \cdot a^x
\end{align*}</div>
