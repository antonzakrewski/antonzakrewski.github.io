<span id="ID-7f492f3c-d9be-484c-a976-bccb4baf4ec1"></span><h1 class="title">r-bipartite graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">Graph</a>.
Then $G$ is said to be \(r\)-bipartite, if the <a href="20250527-chromatic_number_of_a_graph.html#ID-cbaa42bb-fc17-4114-a5c2-270351a4b1f2">chromatic number</a> is at most $r$
</p>

<div class="math-block">\begin{align*}
\chi(G) \leq r
\end{align*}</div>
