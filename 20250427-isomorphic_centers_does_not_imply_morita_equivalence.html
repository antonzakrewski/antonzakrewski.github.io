<span id="ID-c5621f20-113f-4e51-bd46-7a285e09d061"></span><h1 class="title">isomorphic centers does not imply morita equivalence</h1>

<h2 id="proposition">Proposition</h2>
<p>

Then $R,S$ are in general not <a href="20240210-morita_equivalence.html#ID-571462f5-987c-4b28-9cbb-d7d0ad581c5d">morita equivalent</a>
