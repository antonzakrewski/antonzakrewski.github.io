<span id="ID-c3bf6fee-bf24-4e3d-a809-f985db95ef54"></span><h1 class="title">submodule of an artinian module as artinian module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $M$ an <a href="20230724-artinian_module.html#ID-f6f7b960-e8a5-434f-a60b-4571e0567afa">Artinian module</a> over $R$ and $N \subesetq M$ a <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodule</a>.
Then $N$ is also artinian
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of:
</p>

</ul>
