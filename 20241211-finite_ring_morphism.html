<span id="ID-035ef44b-bdfc-4728-88ed-a5021816c3c8"></span><h1 class="title">finite type ring morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: A \rightarrow B$ be a <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a> between <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a> $A,B$.
Then $f$ is said to be of finite type, if $B$ regarded as \(A\)-module is of <a href="20230731-finitely_generated_a_algebra.html#ID-20861333-797d-4ab1-9ad5-375661f357fc">finite type</a>
</p>
