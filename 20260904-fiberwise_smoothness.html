<span id="ID-3b2f98ee-bb8f-4cf8-a013-fa784940b1eb"></span><h1 class="title">fiberwise smoothness</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: Y \rightarrow X$ be a <a href="20260807-flat_morphism_between_scheems.html#ID-26c73138-988a-4592-8d60-8e7765c7a9fd">flat morphism</a> <a href="20260714-map_of_locally_finite_presentation.html#ID-f0ae4d12-6455-4ae1-9813-9dc1db89a0d4">locally of finite presentation</a> such that for every <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a> <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> $k$ and every map $x: \mathrm{Spec}(k) \rightarrow X$, the <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a> $Y_x$ is <a href="20260807-smooth_morphism_between_schemes.html#ID-ff5714e8-e1de-4ca2-8124-411e2989d136">smooth</a> over $k$.
Then $f$ is a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map.</a>
</p>
