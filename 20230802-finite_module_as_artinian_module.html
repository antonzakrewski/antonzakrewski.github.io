<span id="ID-9a920c76-00ef-4dbc-8935-81e28115d041"></span><h1 class="title">finite module as artinian module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>, such that $M$ is <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>, i.e. $\vert M \vert &lt; \infty$
Then $M$ is <a href="20230724-artinian_module.html#ID-f6f7b960-e8a5-434f-a60b-4571e0567afa">Artinian</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from
</p>

<div class="math-block">\begin{align*}
\mathcal{P}(M) = 2^{\vert M \vert} &lt; \infty
\end{align*}</div>
