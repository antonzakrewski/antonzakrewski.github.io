<span id="ID-2f321326-a0cd-41a2-bb36-c9779601735f"></span><h1 class="title">degree k chain map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>.
Suppose $C,D$ are <a href="20230802-chain_complex.html#ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36">chain complexes</a>, then a degree \(k\) chain map $f$ is defined as <a href="20230802-chain_map.html#ID-366c9675-ed47-4bc2-a01d-3d0c6911e226">chain map</a>
</p>
