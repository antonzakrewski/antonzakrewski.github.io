<h2 id="definition">Definition</h2>
<p>
Let $T$ be the collection of maps $\mathrm{Spec}(K) \hookrightarrow \mathrm{Spec}(V)$ where $V$ is a <a href="20230922-valuation_ring.html#ID-3cd6a0db-2f86-41d3-b4d3-f57741906df2">valuation ring</a> with <a href="20230112165631-quotientenkorper_uber_einem_ring.html#ID-2a6b3703-3a34-4104-8a40-c52449e48181">fraction field</a> $K$.
A morphism $f: X \rightarrow Y$ is formally prim, if it is a <a href="20260901-t_monomorphism.html#ID-6fb6cf00-7fde-4b50-9cf4-b44d4ab1a82a">T-monomorphism</a>
