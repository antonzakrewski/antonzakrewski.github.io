<h2 id="definition">Definition</h2>
<p>
Seien $f,g$ <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktionen</a>, dann sind das $\Omega, \omega$ in der Landau-Notation definiert als:
</p>

<div class="math-block">\begin{align*}
f = \Omega(g) \Leftrightarrow&amp; g = O(f) \\
f = \omega(g) \Leftrightarrow&amp; g = o(f)
\end{align*}</div>
