<span id="ID-663c959a-0b4a-42fa-84a8-a5cea2d08d59"></span><h1 class="title">bilipschitzäquivalenz von Normen</h1>

<h2 id="definition">Definition</h2>
<p>
Zwei <a href="20220920053006-norm_eines_vektors.html#ID-445db843-5369-48de-a31f-f1f245833425">Normen</a> sind bilipschitzäquivalent, falls die <a href="20230111204631-von_einer_norm_induzierte_metrik.html#ID-84892f7a-017a-4af9-a330-28a0ccc2b172">induzierte Metriken</a> <a href="20230418113734-lipschitz_aquivalente_metriken.html#ID-56e3645d-7a57-4f92-9b09-dba47a55112f">Bilipschitzäquivalent</a> sind, d.h. es exisistiert ein L \geq 1$ mit
</p>

<div class="math-block">\begin{align*}
\frac{1}{L} \| \cdot \| \leq \| \cdot \|' \leq L \cdot \| \cdot \|
\end{align*}</div>
