<h2 id="definition">Definition</h2>
<p>

Then an abelianized space of $X$ is a space $Y$ with a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $f: X \rightarrow Y$ such that
</p>

<div class="math-block">\begin{align*}
f_*: \pi_{1}(X,x) \rightarrow \pi_1(Y,y)
\end{align*}</div>
<p>
is the <a href="20240109-abelianization_functor.html#ID-7b47ea27-7f41-41ed-ad5f-7eebea33ea64">abelianization</a>
</p>
