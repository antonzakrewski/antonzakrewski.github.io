<span id="ID-5e5c60c5-d4f7-446b-a205-b75ceb0428a0"></span><h1 class="title">abelian normal series</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $G_i$ a <a href="20230808-normal_series.html#ID-d21f4eb8-0fd2-4ad5-9b21-e143578d9dc0">normal series</a>.
Then $G_i$ is said to be an abelian normal series, if
</p>

<div class="math-block">\begin{align*}
G_{i+1} / G_i
\end{align*}</div>
<p>
is <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a>
</p>
