<span id="ID-a0f7a5fd-f328-4df1-83f4-697dcdce760f"></span><h1 class="title">Summe von Eigenwerten und Spur</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $V \cong K^n$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $A \in K^{n \times n}$ eine <a href="20230222202527-diagonalisierbarer_endomorphismus.html#ID-57f0f0cd-6af1-46ac-b845-8f6fc78092b6">diagonalisierbarer Endomorphismus</a> (?).
Dann gilt für das <a href="20230222202647-spektrum_eigenwert.html#ID-c96aba86-5bd4-4e5d-8bc1-b4dc31c38f63">Spektrum</a> und die <a href="20230124183844-spur_einer_matrix.html#ID-43d339ec-a7cf-4a00-b934-0efaf54090f7">Spur</a>:
</p>

<div class="math-block">\begin{align*}
\mathrm{tr}(A) = \sum_{a \in \sigma(A)} a
\end{align*}</div>
