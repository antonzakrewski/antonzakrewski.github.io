<span id="ID-2e801e8d-7fa7-46bd-b406-1babefcad0c6"></span><h1 class="title">Poissonverteilung</h1>

<h2 id="definition">Definition</h2>
<p>
Die Poissonverteilung zum Parameter $\lambda &gt; 0$ ist das <a href="20241014-wahrscheinlichkeitsmaß.html#ID-e70fc7d3-0fc7-474f-9401-a6272df7991a">Wahrscheinlichkeitsmaß</a> $\mathrm{Poi}(\lambda)$ auf $(\mathbb{N}, \mathbb{P}(\mathbb{N}_0))$ mit der Zähldichte
</p>

<div class="math-block">\begin{align*}
\rho(k) = \frac{\lambda^k}{k!} \mathrm{e}^{- \lambda}
\end{align*}</div>
