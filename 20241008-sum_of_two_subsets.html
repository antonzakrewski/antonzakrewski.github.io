<span id="ID-036dec6a-9a9a-4075-878b-de0664fa0ac1"></span><h1 class="title">sum of two subsets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $X,Y \subseteq G$ be <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subsets</a>, then the sum is defined as
</p>

<div class="math-block">\begin{align*}
X + Y = \{x \cdot y \vert x \in X, y \in Y\}
\end{align*}</div>
