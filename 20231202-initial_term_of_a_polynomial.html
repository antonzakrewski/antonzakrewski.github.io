<span id="ID-81d1bc9d-0a5e-4e77-9d89-52d3481384d2"></span><h1 class="title">initial term of a polynomial</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $R[X_i]$ a <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a> and $f \in R[X_i]$ <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a>.
Then the initial term of $R[X_i]$ is defined as homogenous component $f_i \neq 0$ with lowest <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">degree</a>
</p>
