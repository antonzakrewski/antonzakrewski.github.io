<span id="ID-3a65f2d3-a465-4b75-a8de-67cef00b97f9"></span><h1 class="title">kurzes kriterium für einen Unterraum</h1>

<h2 id="proposition">Proposition</h2>
<p>
Sei $V$ ein K-<a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a> und $U \subseteq V$.
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$U$ ist ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Unterraum</a></li>

<li>es gelten folgende beiden Kriterien</li>
</ol>
<p>
a) $U \neq \emptyset$
b) für $\alpha \in K, u_1,u_2 \in U$ folgt $\alpha u_1 + u_2 \in U$
</p>
