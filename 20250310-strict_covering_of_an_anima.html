<span id="ID-00707035-54c7-47b7-bc23-5f29341e2661"></span><h1 class="title">strict covering of an anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>, $p: X' \rightarrow X$ a <a href="20250310-covering_of_an_anima.html#ID-f30771b0-9dc5-46a7-9697-39ef11460ec1">covering</a>.
Then $p$ is said to be strict, if each <a href="20240717-fibre_of_a_morphisms.html#ID-88467be8-d154-4c5b-9922-28e1c3c42044">fibre</a>
</p>

<div class="math-block">\begin{align*}
p^{-1}[ \{x\}]
\end{align*}</div>
<p>
is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> as a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a> to a disjoint union of copies of $*$
</p>
