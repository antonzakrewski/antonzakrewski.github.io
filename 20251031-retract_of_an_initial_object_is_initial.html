<span id="ID-9448ab74-48ce-447f-ae53-6934eb8a6b1c"></span><h1 class="title">retract of an initial object is initial</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $x$ be a <a href="20241206-infinity_retract.html#ID-e6eb12e4-5533-41cf-827b-0985688a5bb8">retract</a> of an <a href="20241014-initial_object_in_an_infinity_category.html#ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89">initial object</a> $\emptyset$.
Then $x$ is already an initial object.
</p>

<h2 id="proof">Proof</h2>
<p>
dual to <a href="20251031-retract_of_a_terminal_object_is_terminal.html#ID-6b2965c0-c792-4ab4-8192-8c65ce53a381">retract of a terminal object is terminal</a>
</p>
