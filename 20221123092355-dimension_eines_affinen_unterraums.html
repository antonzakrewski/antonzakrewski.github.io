<span id="ID-ad01fa38-d731-440e-bc23-3564b6531d3f"></span><h1 class="title">Dimension eines affinen Unterraums</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a>, $U \subseteq V$ ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Unterraum</a> und $A = a + U$ ein <a href="20221119123122-affiner_unterraum.html#ID-bfb9ff4c-c2f2-477c-bc90-88da2de01cf9">affiner Unterraum</a> für $a \in V$
Dann ist die <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">Dimension</a> von $A = a + U$ definiert als
</p>

<div class="math-block">\begin{align*}
\mathrm{dim}_{}(A) = \mathrm{dim}_{}(U)
\end{align*}</div>
