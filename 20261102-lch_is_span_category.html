<span id="ID-65bf26d3-88ff-43f4-9f62-b5f432fa38c9"></span><h1 class="title">LCH_+ is span category</h1>

<h2 id="proposition">Proposition</h2>
<p>
There exsits an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{LCH}_+ \simeq \mathrm{Span}(I, P)
\end{align*}</div>
<p>
for $I$ the open inclusions and $P$ the proper maps in the category $\mathrm{LCH}$ (cf. <a href="20251019-category_lch.html#ID-73423fb7-00b0-4acb-ad24-eecaac7af4f7">category LCH</a> ).
</p>
