<span id="ID-1f342442-cfea-4aa5-b4a9-faefab99332c"></span><h1 class="title">alternating form</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V$ be a <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> over $K$.
Then an alternating k-form is an $S_k$ equivariant <a href="20230121215031-multilineare_abbildung.html#ID-cb913b22-e3ec-42c8-9049-9228735bbed4">multilinear map</a>
</p>

<div class="math-block">\begin{align*}
w: \prod_{i=1}^k V \rightarrow K \\
\end{align*}</div>

<p>
where
</p>
<ol>
<li>$S_k$ <a href="20230501095041-gruppenwirkung.html#ID-e8246fd3-cb62-4245-9ef1-59bc0326501a">acts</a> by permutation on $\prod_{i=1}^k  V$</li>
</ol><ul>
<li></li>
</ul><ol>
<li>$S_k$ acts by the sign on $K$</li>
</ol>
