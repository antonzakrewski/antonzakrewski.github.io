<span id="ID-0da06fb7-1eed-4ce0-9c83-f1123f592a95"></span><h1 class="title">quotient topology for a subset</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $Z$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> and $f: X \rightarrow Z$ a set-theoretic <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjection</a>.
Then the quotient topology on $Z$ is defined as <a href="20230224180620-finaltopologie.html#ID-089a51e7-dbea-4600-a1ce-6e758f44ee49">final topology</a> on $Z$
</p>
