<span id="ID-c96aba86-5bd4-4e5d-8bc1-b4dc31c38f63"></span><h1 class="title">Spektrum (Eigenwert)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V \cong K^n$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $A$ eine <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">Matrix</a>.
Dann ist das Spektrum $\sigma(A)$ die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20220303190024-eigenwert.html#ID-c96ef2bb-2cf6-4ca8-9d98-40991bd99031">Eigenwerte</a> von $A$.
</p>
