<span id="ID-50466f54-e0ed-4327-aab9-c811d3915e15"></span><h1 class="title">index and quotient group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $N \trianglelefteq G$ a <a href="20221210192900-normalteiler.html#ID-f971f946-d0ca-444a-a450-efbef237a278">normal subgroup</a> and $U \subseteq G$ a <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a> with $N \subseteq U$.
Then it holds for the <a href="20221023184358-index_gruppentheorie.html#ID-f06e3f56-1c1b-4e9d-b5b1-3e9a25fdb500">Index</a>
</p>

<div class="math-block">\begin{align*}
(G : U) = (G/N : \pi_{N}[U])
\end{align*}</div>
