<span id="ID-528b3ef7-0327-4169-9c4e-399b7c651a2c"></span><h1 class="title">bijection between prime ideals and affine varieties</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{A}_{K}^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a>.
Then there exists a order reversing <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">Bijection</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(K[X_1,...,X_n]) \cong \{\mathrm{affine varieties in } \mathbb{A}_K^n\}
\end{align*}</div>
