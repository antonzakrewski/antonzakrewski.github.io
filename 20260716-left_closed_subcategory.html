<span id="ID-37a6e589-341c-45ab-84ef-253a7655e04a"></span><h1 class="title">left closed subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $\mathcal{D} \subseteq \mathcal{C}$ a <a href="20240711-sub_infinity_category.html#ID-79df3d53-7239-474c-bfa4-a3fdbcf588d6">subcategory</a>.
Then $\mathcal{D}$ is said to be left closed, if for any $X \in \mathcal{D}$ and $f: Y \rightarrow X$ is a morphism in $\mathcal{C}$, then $Y \in \mathcal{D}$.
</p>
