<span id="ID-9166bf00-4713-4046-a61c-47ace5dd6495"></span><h1 class="title">nilpotent self-map</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20260918-self_map.html#ID-829c5144-ab74-419e-be25-3239105bec0a">self-map</a> $f: \Sigma^d X \rightarrow X$ is said to be nilpotent, if it is <a href="20230315113206-nilpotent.html#ID-e1be03af-ebb8-42d9-8caa-1fe3a1093c3f">nilpotent</a> in $\pi_*(\mathrm{End}_{\mathrm{Sp}}(X))$ or in other words $f^k \simeq 0$.
</p>
