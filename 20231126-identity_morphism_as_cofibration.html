<span id="ID-c6b034ee-0c93-49f4-8b13-9cc8042141d5"></span><h1 class="title">identity morphism as cofibration</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $\mathrm{id}_{X}: X \rightarrow X$ is a <a href="20231124-cofibration.html#ID-05c7be72-ecee-40a2-a48e-8df8cada2404">cofibration</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20231124-cofibration_and_retraction.html#ID-70c6038d-368d-40b6-a5d6-c3972a28fd8a">cofibration and retraction</a>, as $\mathrm{id}: X \times [0,1] \rightarrow X \times [0,1]$ is the desired retraction
</p>
