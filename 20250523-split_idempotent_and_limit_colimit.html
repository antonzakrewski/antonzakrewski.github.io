<span id="ID-77594317-3c24-4fd4-812e-2a7c71d3492c"></span><h1 class="title">split 1-idempotent and limit / colimit</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a \(1\)-<a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $e: x \rightarrow x$ a <a href="20240807-split_idempotent_morphism.html#ID-4e2d20d6-753e-42d2-b481-7a12ec9769bf">split idempotent</a> with $y \hookrightarrow x \twoheadrightarrow y$.
Then the <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> / <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimit</a> of $e$ is given by $y$.
</p>
