<span id="ID-74690e83-541b-4690-b16c-7d72677c6747"></span><h1 class="title">locally cartesian closed category with finite limits is cartesian closed</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20260908-locally_cartesian_closed_category.html#ID-402e997b-0648-4bdc-9578-811bb7e4924b">locally cartesian closed</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> with <a href="20231018-finite_limit.html#ID-265414ac-0939-4106-ad91-4f3da00bd5bb">finite limits</a>.
Then $\mathcal{C}$ is <a href="20231115-cartesian_closed_category.html#ID-315f9f64-ca45-4064-b89d-c1da8a889115">cartesian closed</a>.
</p>

<h2 id="proof">Proof</h2>

follows from:

</ul>
