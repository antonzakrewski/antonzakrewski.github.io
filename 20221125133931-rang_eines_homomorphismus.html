<span id="ID-dd19e361-c0fd-44d0-837e-68792db63468"></span><h1 class="title">Rang eines Homomorphismus</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $V,W$ <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorräume</a> und sei $f: V \rightarrow W$ ein <a href="20221119162741-vektorraumhomomorphismus.html#ID-863f0f55-054c-413e-9cf4-2c2704ea5b14">Homomorphismus</a>.
Dann ist der Rang $r(f)$ definiert als:
</p>

<div class="math-block">\begin{align*}
r(f) = \mathrm{dim}_{K}(\mathrm{im}(f))
\end{align*}</div>
