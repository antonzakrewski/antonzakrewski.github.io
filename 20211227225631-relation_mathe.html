<span id="ID-20e17f2d-e102-4093-8c48-e5b41db0ffbf"></span><h1 class="title">Relation (Mengenlehre)</h1>

<h2 id="definition">Definition</h2>
<p>
Eine $n$ stellige Relation auf den <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $M_1, M_2,...,M_n$ ist eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $\rho$ oder $R \subseteq M_1 \times ... \times M_n$ (<a href="20211226220618-kartesische_produkt.html#ID-0dd71736-db78-4510-8588-7811037d0796">Kartesische Produkt</a>)
Die Kurzschreibweise lautet dann für eine zweistellige Relation $x \in X, y \in Y \quad x \sim y$
</p>
