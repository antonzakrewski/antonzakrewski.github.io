<span id="ID-18688231-0f3e-4b4a-aafd-95b44fe0b862"></span><h1 class="title">prestable infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity category</a>.
Then $\mathcal{C}$ is said to be prestable, if it
</p>
<ol>
<li>admits <a href="20231018-finite_colimit.html#ID-45769a25-b177-43a7-a8dc-ce5984aad851">finite colimits</a> </li>

<li>the <a href="20250121-suspension_functor.html#ID-e9fa07ee-4a2e-4c76-9a53-fabd07305e6d">suspension functor</a> is <a href="20240701-fully_faithful_functor_between_infinity_categories.html#ID-bb0d3e0e-92a5-4687-999c-a99d4043ea38">fully faithful</a></li>

<li>for each map $x \rightarrow \Sigma y$ there exists a <a href="20250204-bifiber_sequence.html#ID-4759a304-878a-4f79-9a13-46afcb981e12">bifiber</a> sequence</li>
</ol>
