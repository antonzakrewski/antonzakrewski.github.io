<span id="ID-73648315-aa1e-4e87-a5e8-ce378a8a8015"></span><h1 class="title">integral element over a subring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $A \subseteq B$ a <a href="20230227130935-unterring.html#ID-157d533b-1650-499e-be1d-341b1fa8fa15">subring</a>.
Then $\alpha \in B$ is an integral element, if there exists an <a href="20221226010524-normiertes_polynom.html#ID-f17a0f11-0953-4728-91a6-9a81df943813">monic</a> <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynomial</a> $f \in A[X]$, such that $\alpha$ is a <a href="20220320113706-nullstelle.html#ID-b094e637-5f3c-42a2-a2c2-ae73bbbe29a2">root</a> in the <a href="20221226010643-einsetzungshomomorphismus.html#ID-714a456e-dcd8-4e03-906b-2b497bf77766">evaluation homomorphism</a>
</p>

<div class="math-block">\begin{align*}
f(\alpha) = 0
\end{align*}</div>
