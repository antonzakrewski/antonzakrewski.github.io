<span id="ID-f0c82596-0f6f-4acd-a366-671d4506e231"></span><h1 class="title">homology chain complex as trivial boundary complex</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a> and $H_*(-)$ the <a href="20230817-homology_functor.html#ID-c35a52a1-7174-408f-8480-9746e1c374bc">homology functor</a> and $C_*$ a <a href="20230802-chain_complex.html#ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36">chain complex</a>
Then $H_*(C_*)$ is a <a href="20240509-zero_boundary_complex.html#ID-b6251547-a5c3-4015-8ae8-b84dc05af692">trivial boundary complex</a>
</p>
