<span id="ID-a6a036b9-fc40-44db-b4ef-fd092f9212c6"></span><h1 class="title">finite type cw structure</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathrm{SK}_n(X))$ be a <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complex</a>.
</p>

<p>
Then $X$ is said to be of finite type, if for each $n \in \mathbb{N}$, the Indexset $I_n$ of the <a href="20231122-attaching_maps_of_a_cw_complex.html#ID-67055fca-497b-48ef-8ae5-aa7bdb795252">attaching maps</a> is <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>
</p>
