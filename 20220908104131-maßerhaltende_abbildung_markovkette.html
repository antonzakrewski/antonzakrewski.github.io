<span id="ID-7ad89b8b-8a1e-43e3-a944-d3ffb69b296e"></span><h1 class="title">Maßerhaltende Abbildung (Markovkette)</h1>

<h2 id="definition">Definition</h2>
<p>
Wenn $\theta$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> auf <a href="20220904101519-markow_kette.html#ID-7ed34770-d827-4d65-806c-4590f95b642b">Markovketten</a> ist,
dann heißt $\theta$ maßerhaltend für X, wenn $\theta(X)$ eine Markovkette ist, die genauso verteilt ist wie $X$
