<span id="ID-b46aca44-e223-4c33-9d64-4f1ad49bfca8"></span><h1 class="title">pseudo n-lipschitz map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M,d), (M',d')$ be <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metric spaces</a> and $f: M \rightarrow M'$ a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
Then $f$ is said to be pesudo n-lipschitz, if there exists a point $m$ such that
</p>

<div class="math-block">\begin{align*}
d_{M'}(f(m) - f(n)) \leq n d_{M}(x - y)
\end{align*}</div>
<p>
for all $n$ in $M$
</p>


</div>
