<span id="ID-f93303c0-0da2-4014-aea8-4a271d5c74a4"></span><h1 class="title">enough injectives</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{C}$ is said to have enough injectives, if for every <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $A \in \mathrm{Ob}(\mathcal{C})$, there exist
</p>
<ol>
<li>an <a href="20230903-injective_object.html#ID-7fbb0ef7-bb6c-4135-b65f-2d8fb5f2df00">injective object</a> $I$</li>

<li>a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> $f: A \rightarrow I$</li>
</ol>
