<span id="ID-a5f59058-3c32-430e-a346-4ecc73f2afe7"></span><h1 class="title">Binomialkoeffizient durch Fakultät</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $n \in \mathbb{N}_0$ mit $n \geq k$, so gilt:
</p>

<div class="math-block">\begin{align*}
\binom{n}{k} = \frac{n!}{k! \cdot (n-k)!}
\end{align*}</div>
