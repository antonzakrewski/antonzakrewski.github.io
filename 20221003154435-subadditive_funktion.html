<span id="ID-eed9c954-3134-4591-bed8-fd1d028d9695"></span><h1 class="title">Subadditive Funktion</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171225-definition_halbgruppe.html#ID-704f2f2a-6b57-4168-8b52-4a2965ee69de">Halbgruppe</a> mit der <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfung</a> $+$
Eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> $f: M \rightarrow M$ ist subadditiv, wenn gilt
</p>

<div class="math-block">\begin{align*}
 \forall x,y \in M : (f(x + y) \leq f(x) + f(y))
\end{align*}</div>
