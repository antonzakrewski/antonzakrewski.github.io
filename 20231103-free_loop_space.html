<span id="ID-c48b86ec-6c5e-45e8-895f-8338f16b9220"></span><h1 class="title">free loop space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then the free loop space $\mathcal{L}(X)$ on $X$ is defined as the <a href="20231103-mapping_space.html#ID-233d712d-03e8-4415-b86e-25bc8b6c3cef">mapping space</a> $\mathrm{Map}(S^1,X)$, equipped with the <a href="20231103-compact_open_topology.html#ID-fcb63ee4-436d-4523-9277-bb9678883c5c">compact open topology</a>, for the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">1-sphere</a> $S^1$
</p>
