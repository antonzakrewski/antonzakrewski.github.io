<span id="ID-2723470e-e679-4218-b3b0-e69decd633cf"></span><h1 class="title">classification of open subfunctors of affine schemes</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then the construction $F \mapsto D(F)$ induces an order reversing <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">bijection</a>
</p>

<div class="math-block">\begin{align*}
\{\textrm{radical ideals}\} \simeq \{\textrm{open subfunctors of } \mathrm{Spec}(A)\}
\end{align*}</div>
