<span id="ID-0689573f-d036-45cf-ab70-e159be869929"></span><h1 class="title">C^k partition of unity</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a $C^k$ <a href="20230905-differentiable_manifold.html#ID-ba8bdca8-4840-4256-a470-293790ae1aca">differentiable manifold</a>, $U_i$ an <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open cover</a>
Then a $C^k$ partition of unity subordinate to $U_i$ is a <a href="20230624-untergeordnete_partition_der_eins.html#ID-c043bd4e-d16e-4171-9fd9-653eb0dff1c6">subordinate partition of unity</a> $\gamma_i: M \rightarrow [0,1]$ such that each $\gamma_i$ is \(C^k\)-<a href="20241117-differentiability_class_of_a_manifold.html#ID-473c3dd9-f398-4e26-97f5-5400964d4102">differentiable</a>
</p>
