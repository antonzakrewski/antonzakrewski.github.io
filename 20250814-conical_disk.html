<span id="ID-cb0678be-c3fe-4082-9dd6-a8f9060728e8"></span><h1 class="title">conical disk</h1>

<h2 id="definition">Definition</h2>
<p>
A conical disk is a stratified manifold, which <a href="20250124-abstract_isomorphic.html#ID-d8e7f3ab-7225-4584-93b5-be16488ea664">abstractly isomorphic</a> to one of the following:
$D(X,n) = CX \times \mathbb{R}^n \rightarrow CX \rightarrow P$ where $X$ is a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a>  <a href="20250814-stratified_manifold.html#ID-fe175674-124b-407d-8bcb-490708dd8e46">stratified manifold</a>
</p>
