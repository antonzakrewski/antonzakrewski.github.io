<span id="ID-c1a287b9-4e58-4f3d-bc43-d12dc117964e"></span><h1 class="title">Normalenvektor einer Untermannigfaltigkeit</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M \subseteq \mathbb{R}^d$ eine <a href="20241214-c_l_untermannigfaltigkeit_von_r_n.html#ID-b213538e-ad15-476b-838b-bca5966fcfc7">C^l Untermannigfaltigkeit von R^n</a> und $m \in M$
Dann ist ein $w \in \mathbb{R}^d$ ein Normalenvektor von $M$, falls $w \bot T_{m}M$ <a href="20230303172749-orthogonale_vektoren.html#ID-50cd928d-4b8c-4832-9831-c7b3180831e5">orthogonal</a> zum <a href="20230301044425-tangentialraum.html#ID-230922aa-69cc-4795-a3aa-f23d1b7d1a3e">Tangentialraum</a> ist.
</p>
