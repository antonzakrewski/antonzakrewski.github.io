<span id="ID-044b472e-3d33-4fe6-af8f-383b511fef86"></span><h1 class="title">graded ring as graded module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a> and $R = \bigoplus_{m \in m} R_m$ a <a href="20230920-graded_ring.html#ID-934737de-8f00-4050-b210-c984897d335d">graded ring</a>.
Then $R = \bigoplus{m \in M} R_m$ is a <a href="20230904-graded_module.html#ID-5508d8a0-9b2a-476f-95ca-a6502e8eb0f9">graded module</a>.
