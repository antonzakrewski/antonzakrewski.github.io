<span id="ID-feb7833f-4dbd-47a6-bcc5-14460d07b300"></span><h1 class="title">torsion of a module is a zariski-local property</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and $\mathfrak{a}$ a nontrivial <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then being a <a href="20251028-torsion_module.html#ID-0f2ef7f5-2ae3-415c-bf96-454b812a29b0">torsion module</a> is a <a href="20260714-zariski_local_property.html#ID-401f82f1-7f90-4db7-a5cb-2cb710007b93">zariski-local property of modules</a>.
</p>
