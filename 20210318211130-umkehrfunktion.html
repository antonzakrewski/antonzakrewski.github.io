<span id="ID-35d2e288-1bec-4daf-866a-99566d5d0d8f"></span><h1 class="title">Umkehrfunktion</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $f: X \rightarrow Y$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>
Eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> $f^{-1}: Y \rightarrow X$ ist eine Umkehrfunktion der <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> $f$, falls für $x \in X$ und $y \in Y$ gilt:
</p>


<div class="math-block">\begin{align*}
f^{-1}(f(x)) =&amp; x \\
f(f^{-1}(y)) =&amp; y
\end{align*}</div>

</div>
