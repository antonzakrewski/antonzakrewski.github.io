<span id="ID-a7a4184a-a6d6-482e-998e-ae34d997d030"></span><h1 class="title">conjugation of the quaternions and norm</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $q = a + b I + c J + d K$ be a <a href="20211230225918-quaternion.html#ID-3f46036d-daf8-4b3f-a79a-31c4b070e907">Quaternion</a>.
Then $q \cdot \overline{q} = \overline{q} \cdot q = a^2 + b^2 + c^2 + d^2 \in \mathbb{R}$ is the <a href="20251104-norm_of_quaternions.html#ID-5500280a-e99a-4748-96ab-ededf852a799">norm</a>
</p>
