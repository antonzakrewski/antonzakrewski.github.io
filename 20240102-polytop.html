<span id="ID-55026263-4411-4364-b4a8-5e3337862929"></span><h1 class="title">Polytop</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller Vektorraum</a> und $P \subseteq V$.
Dann ist $P$ ein Polytop, falls <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endlich</a> viele Punkte $a_1,...,a_n$ existieren, so dass für die <a href="20230204210743-konvexe_hulle.html#ID-09b6cea7-7e99-4deb-a301-a3dbb315a55b">Konvexe Hülle</a>
</p>

<div class="math-block">\begin{align*}
P = \mathrm{Conv}(a_1,...,a_n)
\end{align*}</div>
