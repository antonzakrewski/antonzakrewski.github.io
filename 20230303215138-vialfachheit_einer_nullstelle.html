<span id="ID-b5c3b6c4-fe35-4d9d-9ebe-d974f1fca90e"></span><h1 class="title">Vialfachheit einer Nullstelle</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $K \subseteq L$ <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $f \in K[X]$, $c \in L$
Sei $f = (x - c)^m \cdot g$ mit $g \in L[X]$ und $g(c) \neq 0$, so ist $m$ die Vielfachheit von $c$ als Nullstelle
</p>
