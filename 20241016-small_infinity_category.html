<span id="ID-e28e9ce9-b62e-4ca8-a8d5-6416d476582a"></span><h1 class="title">small infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>.
Then $\mathcal{C}$ is said to be small, if the underlying <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a> is <a href="20241016-kappa_small_simplicial_set.html#ID-215e45be-03d6-4cf6-8414-358125f9b03f">kappa-small</a> for some <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinal</a> $\kappa$ in our universe.
</p>
