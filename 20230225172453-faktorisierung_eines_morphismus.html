<span id="ID-03fc6d28-e9bd-4fa3-8093-a113eaf06a6e"></span><h1 class="title">factorization (morphism)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\mathcal{C}$ eine <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">Kategorie</a> und $A,B,C \in \mathrm{Ob}(\mathcal{C})$ und $f: A \rightarrow B$.
Eine Faktorisierung von $f$ ist eine Darstellung:
</p>

<div class="math-block">\begin{align*}
f =&amp; g \circ h
\end{align*}</div>
<p>
mit $h: A \rightarrow C$ und $g: C \rightarrow B$
</p>
