<span id="ID-8ba78c92-f92f-40cc-8d5d-562e4df6ecac"></span><h1 class="title">Binomialverteilung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $n \in \mathbb{N}$ und $p \in [0,1]$.
Dann ist die Binomialverteilung das <a href="20241014-wahrscheinlichkeitsmaß.html#ID-e70fc7d3-0fc7-474f-9401-a6272df7991a">Wahrscheinlichkeitsmaß</a> auf $(\{0,...n\}, \mathcal{P}( \{0,...,n\})$ mit <a href="20241022-maß_auf_einer_diskreten_abzahlbaren_sigma_algebra_bestimmt_durch_einzelelemente.html#ID-41d943c8-05d2-4b6f-b32a-e5df10e2c915">Zähldichte</a>
</p>

<div class="math-block">\begin{align*}
\rho(k) = \binom{n}{k} p^k (1 -p)^{n-k}
\end{align*}</div>
