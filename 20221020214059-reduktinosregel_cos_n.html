<span id="ID-74a256b4-7816-4fd7-9465-3f556fd2ecf7"></span><h1 class="title">Reduktionsregel $\cos^n$</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\int_{}^{} \cos(x)^n \mathrm{d}x =&amp; \frac{n-1}{n} \int_{}^{} \cos(x)^{n-2} \mathrm{d}x + \frac{\cos(x)^{n-1}\sin(x)}{n}
\end{align*}</div>
