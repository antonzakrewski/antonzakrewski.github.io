<span id="ID-0f6d0690-68f0-4695-ba6d-d417aa9eb938"></span><h1 class="title">partially ordered set as category</h1>

<h2 id="definition-proposition">Definition / Proposition</h2>
<p>
Let $A$ be a <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">partially ordered</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>, then $A$ is canonically a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> with
</p>
<ol>
<li><a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">elements</a> $\alpha \in A$ as <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> </li>

<li><a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a> $f: \alpha \rightarrow \beta$ <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> $\alpha \leq \beta$</li>
</ol>
<p>
see:
</p>
<ul>
<li><a href="20231223-preordered_set_as_category.html#ID-db0d5142-3afa-466a-b831-002d04cbedf6">preordered set as category</a> </li>
</ul>
