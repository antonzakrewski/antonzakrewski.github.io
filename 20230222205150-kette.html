<span id="ID-0b38d50a-42b8-4d13-9f40-0248f887ca7d"></span><h1 class="title">Chain</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M, \leq)$ eine <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">halbgeordnete</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und $K \subseteq M$ eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a>.
Dann ist $K$ eine Kette, falls für $k,k' \in K$ stets $k \leq k'$ oder $k' \leq k$ gilt, d.h. $K$ ist <a href="20221010083644-strenge_totalordnung.html#ID-a15ef82b-7f83-4955-9afc-7e380a7e564f">linear geordnet</a>
</p>
