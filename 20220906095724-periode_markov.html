<span id="ID-8abfbcd4-1a5b-4249-816b-b04bd26a9bda"></span><h1 class="title">Periode eines Zustasnds einer Markovkette</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\pi: E \times E \rightarrow \mathbb{R}$ eine <a href="20220904101519-markow_kette.html#ID-7ed34770-d827-4d65-806c-4590f95b642b">Markovkette</a>.
Dann ist die Periode von $x \in E$ definiert als
</p>

<div class="math-block">\begin{align*}
d(x) \coloneqq \mathrm{ggT} \{n \in \mathbb{N}, \pi^n(x,x) &gt; 0\}
\end{align*}</div>
