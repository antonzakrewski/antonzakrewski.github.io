<span id="ID-42b40fe8-60c3-44fa-8e3c-f7970a7e5bc0"></span><h1 class="title">maximum modulus principle</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\Omega \subseteq \mathbb{C}$ be <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> and <a href="20230118223336-zusammenhangender_raum.html#ID-bcc53507-bc5a-46d4-bd83-53e504f62b9d">connected</a> and let $f: \Omega \rightarrow \mathbb{C}$ be a <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic</a> and non-constant function.
Then $\vert f \vert$ does not attain a maximum in $\Omega$
</p>
