<span id="ID-a78cde87-f657-41ac-8f4b-a1e0a8c96bf7"></span><h1 class="title">nonvanishing locus of Spec for a single element is affine</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $f \in A$ an <a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">element</a>.
Then the localization map $A \rightarrow A_f$ induces an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(A_f) \simeq D(f) \subseteq \mathrm{Spec}(A)
\end{align*}</div>
