<span id="ID-571462f5-987c-4b28-9cbb-d7d0ad581c5d"></span><h1 class="title">Morita equivalence</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R,S$ be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a>.
Then $R$ and $S$ are said to be morita equivalent, if there exists a categorical <a href="20231118-equivalence_of_categories.html#ID-9f984af9-949c-46b1-9221-7ba43cdae897">equivalence</a> of the <a href="20230225170152-kategorie_mod.html#ID-15b21b3a-18bb-4d60-a716-c69681d7222d">module categories</a> $\mathrm{RMod}$ and $\mathrm{SMod}$
</p>
