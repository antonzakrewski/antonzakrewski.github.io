<span id="ID-c8ccc9c4-2b11-48ba-b90c-f26f3bcb5be1"></span><h1 class="title">trace of a matrix invariant under base change</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $A \in M_n(R)$ and $g \in \mathrm{GL}_n(R)$.
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{tr}(g^{-1} A g) = \mathrm{tr}(A)
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
follows from
<a href="20230124184424-kommutativitat_der_spur_matrix.html#ID-4c648f4d-9564-4fcd-82bd-4382a6ee97be">trace commutes with cyclic permutations</a>
</p>
