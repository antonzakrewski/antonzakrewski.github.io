<span id="ID-64fd23a9-f95d-43db-b031-3eaae04ee18f"></span><h1 class="title">composition of open maps</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y,Z$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $f: X \rightarrow Y$ and $g: Y \rightarrow Z$ be <a href="20230227190111-offene_abbildung_topologie.html#ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52">open maps</a>.
Then the <a href="20220104114218-komposition.html#ID-7dbdf503-309d-418b-8b3d-5c2fe27bbfeb">composition</a> $g \circ f$ is also an open map
</p>

<h2 id="proof">Proof</h2>
<p>
Suppose $O \subseteq X$ is <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a>, then $f[O]$ is open, therefore also $g[f[O]] = (g \circ f)[O]$
</p>
