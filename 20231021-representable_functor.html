<span id="ID-31b596c9-5984-4672-900f-de9718d2e524"></span><h1 class="title">covariant representable functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20230225165858-lokal_kleine_kategorie.html#ID-29f14fa2-ae57-46d2-8e23-3f2924bc1ebe">locally small</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $\mathrm{Set}$ the <a href="20221216142701-kategorie_set.html#ID-dc78356f-1fcf-41e8-b05a-47cdd731513c">category set</a>.
</p>

<p>
A <a href="20220830173246-kovarianter_funktor.html#ID-c5286004-d249-4969-86d5-c75655b7f5d3">covariant functor</a> $\mathcal{F}: \mathcal{C} \rightarrow \mathrm{Set}$ is said to be representable, if it admits a <a href="20231123-representation_of_a_functor.html#ID-0994a159-32b4-433a-8642-9baa7a99b3e6">representation</a>
</p>
