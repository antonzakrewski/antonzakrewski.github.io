<span id="ID-5f3b5586-0018-45f9-ac13-41b9685fa803"></span><h1 class="title">residue field and immersions</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a> and $Y \hookrightarrow X$ an <a href="20260714-immersion_of_algebraic_functors.html#ID-0bea763f-3f4a-40c8-b030-3ec43c8114d0">immersion</a>, let $y \in \vert Y \vert$ be a <a href="20260721-underlying_space_point_of_an_algebraic_functor.html#ID-4d28a5d1-320b-4681-bbf5-897d061e5e93">point</a> with image $x \in \vert X \vert$.
Then the functor $\mathrm{Field}_{(Y,y)} \rightarrow \mathrm{Field}_{(X,x)}$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>
