<span id="ID-9d225c6c-ef25-44c8-9cb2-4d677ed59727"></span><h1 class="title">fast überall</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{A}, \mu)$ ein <a href="20241019-maßraum.html#ID-2135bec8-c3bb-4fca-a24a-21334f66d7ae">Maßraum</a> und $Q(x)$ eine mathematische Aussage für $x \in X$.
Dann gilt $Q$ \(\mu\) fast überall, falls eine <a href="20220902125205-nullmenge.html#ID-4edd0c4c-7828-4cbc-a25d-1031fecd0d5f">Nullmenge</a> $N \in \mathcal{A}$ existiert, so dass $Q(x)$ für $x \in X \setminus N$ gilt
</p>
