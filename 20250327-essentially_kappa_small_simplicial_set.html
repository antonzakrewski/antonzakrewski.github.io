<span id="ID-1e3e13e2-e632-47c3-8e57-f8eb16a047a7"></span><h1 class="title">essentially kappa small simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\kappa$ be a <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinal</a> and $X$ a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>
Then $X$ is said to be essentially \(\kappa\)-small, if $X$ is <a href="20240703-joyal_equivalence_between_simplicial_sets.html#ID-0b735a57-8c6f-4e38-a681-e5cd3c5c2fad">joyal equivalent</a> to a <a href="20241016-kappa_small_simplicial_set.html#ID-215e45be-03d6-4cf6-8414-358125f9b03f">kappa-small simplicial set</a>
</p>
