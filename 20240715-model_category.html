<span id="ID-a617e6d1-b76b-48fc-99bc-acce1d7da2fa"></span><h1 class="title">model category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a (sometimes only <a href="20240114-finitely_bicomplete_category.html#ID-55ef0c40-98eb-4b05-b2e6-415502ca1ff0">finitely</a>)  <a href="20230923-bicomplete_category.html#ID-b259f0df-b6aa-4a20-8135-22332d04ebf8">bicomplete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>
Then $\mathcal{C}$ is said to be a model category, if it has a <a href="20240704-model_structure.html#ID-06c5c7d8-056d-4429-9c19-993908ff80fc">model structure</a> (usually functorial for convenience)
</p>
