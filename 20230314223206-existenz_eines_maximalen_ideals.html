<span id="ID-028984d3-9095-4e31-ad1f-5acfc2e4c3c8"></span><h1 class="title">Existenz eines maximalen Ideals</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein
<a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a>
Dann existiert ein <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximales Ideal</a> $M \subsetneq R$
</p>

<h2 id="beweis">Beweis</h2>
<p>
Let $\{0\}$ be the <a href="20230725-zero_ideal.html#ID-44d27475-7790-426b-a9cc-8e321e6dd3d1">zero ideal</a>, then the statement is a corollary of <a href="20230727-existence_of_a_maximal_ideal_for_an_ideal.html#ID-2fbd18c2-a2f1-45b6-8f53-0f729e57674a">existence of a maximal ideal for an ideal</a>
</p>
