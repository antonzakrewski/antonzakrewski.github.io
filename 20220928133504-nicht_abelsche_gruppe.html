<span id="ID-b45d2780-5c48-47e4-8829-b97de48bbcde"></span><h1 class="title">nicht-abelsche Gruppe</h1>

<h2 id="definition">Definition</h2>
<p>
Eine <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppet</a> $(G,\circ)$ ist nicht-abelsch, wenn gilt:
</p>

<div class="math-block">\begin{align*}
\exists a \in G  \exists b \in G : (a \circ b \neq b \circ a)
\end{align*}</div>
