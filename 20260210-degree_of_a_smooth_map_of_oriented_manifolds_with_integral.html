<span id="ID-7c284348-e54b-4506-89c3-08066d835451"></span><h1 class="title">degree of a smooth map of oriented manifolds with integral</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M,N$ be <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a> with <a href="20251202-volume_form.html#ID-e01c9701-5e4d-45a7-a90e-6d7f6acfe50e">volume forms</a> $\omega$.
Then the degree is given by
</p>

<div class="math-block">\begin{align*}
\mathrm{deg}(f) = \frac{\int_{M} f^*( \omega)}{\int_{N} \omega}
\end{align*}</div>
