<span id="ID-24542220-bbf5-4bba-80cb-327831396ed3"></span><h1 class="title">Standardbasis</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K^n$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a>.
Dann ist die Standard<a href="20221030151204-basis_vektorraum.html#ID-4b0d1e47-5503-4b26-9ab3-a142097c2624">basis</a> $e_1,...,e_n$ definiert als
</p>

<div class="math-block">\begin{align*}
e_i  \coloneqq \sum_{j=1}^n \delta_{ij}
\end{align*}</div>
