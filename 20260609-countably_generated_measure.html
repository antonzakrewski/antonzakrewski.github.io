<span id="ID-09aa0107-b670-4ffa-9ef3-6bb16b039f95"></span><h1 class="title">countably generated measure</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{A}, \mu)$ be a <a href="20220902124943-maßraum.html#ID-5bbf8866-cd44-4090-9e26-37f6752275d5">measure space</a>.
Then it is countably generated, if there exists a <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">countable</a> set $\mathcal{E} \subseteq \mathcal{P}(X)$ such that $\mathcal{A}$ is <a href="20241015-generated_borel_algebra.html#ID-d1f1ee03-ae6b-461c-ab1c-32880a8d6520">generated by</a> $\mathcal{E}$
</p>
