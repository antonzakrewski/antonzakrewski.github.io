<span id="ID-cc4d49ce-a91e-4e70-8c0a-465abc177af0"></span><h1 class="title">metacompact space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
$X$ is a paracompact space, if every <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open covering</a> has a <a href="20230330231212-punktendliche_uberdeckung.html#ID-5627b50b-30ed-4bd1-8eff-65b46729b8c7">point finite</a> <a href="20230406114448-refinement.html#ID-a6603a8e-c953-4650-a2d0-6502a10f9891">refinement</a>
</p>
