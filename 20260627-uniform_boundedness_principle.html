<span id="ID-d5693964-d4c8-4b14-8723-f147946a36ce"></span><h1 class="title">uniform boundedness principle</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20221124132702-banachraum.html#ID-43ef125e-d9bb-454f-9427-4d3d8426893a">banach space</a>, $Y$ a <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a> and $\mathcal{F} \subseteq \mathrm{BL}(X,Y)$.
Suppose $\mathrm{sup}_{T \in \mathcal{F}} \| Tx \| &lt; \infty$ for all $x \in X$, then $\mathrm{sup}_{T \in \mathcal{F}} \| T \| &lt; \infty$
</p>
