<span id="ID-7ea67616-c641-4eaf-bae6-04478180e6e3"></span><h1 class="title">splitting of a suspension spectrum into reduced and base</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250310-category_of_pointed_anima.html#ID-dcecc787-a204-4e27-a71a-4a8348602f92">pointed anima</a> and $E$ any <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a> , then there exists a splitting
</p>

<div class="math-block">\begin{align*}
E[X] \simeq \tilde{E}[X] \oplus E[*]
\end{align*}</div>
