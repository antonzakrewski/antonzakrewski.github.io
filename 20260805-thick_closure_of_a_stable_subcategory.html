<span id="ID-1adaa2f4-6347-4f3f-8557-9d99eea28a72"></span><h1 class="title">thick closure of a stable subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a> and $\mathcal{D} \subseteq \mathcal{C}$ a (<a href="20241023-stable_subcategory.html#ID-bfd1a6f2-74c1-4474-a8d1-786c0b4ac46a">stable</a>) <a href="20240711-sub_infinity_category.html#ID-79df3d53-7239-474c-bfa4-a3fdbcf588d6">subcategory</a>.
Then the thick closure $\mathrm{Thick}(\mathcal{D})$ is defined as smallest, <a href="20250621-stable_retract_closure.html#ID-fdb868c3-c525-4172-ab72-3e9d4049830f">thick stable subcategory</a> containing $\mathcal{D}$
</p>
