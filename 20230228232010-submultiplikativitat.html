<span id="ID-5b8a1359-1ef6-4bf4-9825-37218f84865d"></span><h1 class="title">Submultiplikativität</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $f: R \rightarrow R_+$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
$f$ ist submultiplikativ, falls gilt:
</p>

<div class="math-block">\begin{align*}
f(a \cdot b) \leq f(a) \cdot f(b)
\end{align*}</div>
