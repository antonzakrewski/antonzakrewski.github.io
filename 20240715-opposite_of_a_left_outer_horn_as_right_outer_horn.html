<span id="ID-5991a6ff-430a-435b-b8eb-98fbf0a8d935"></span><h1 class="title">opposite of a left outer horn as right outer horn</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
</p>

<p>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$X = \Lambda_0^n$ is the <a href="20240627-left_outer_horn.html#ID-f558c647-9a1d-44ba-96a6-6b09f928e5d9">left outer horn</a>.</li>

<li>the <a href="20240703-opposite_simplicial_set.html#ID-550299d4-3dcb-4318-9126-99b454001292">opposite simplicial set</a> $X^{\mathrm{op}}$ is the <a href="20240627-right_outer_horn.html#ID-28cc184d-2497-4370-925e-c5d2359cd7d8">right outer horn</a> </li>
</ol>

<p>
see:

</ul>
