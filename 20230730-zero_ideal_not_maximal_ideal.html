<span id="ID-36a11920-6a74-4713-bf83-dafa136fda17"></span><h1 class="title">zero ring not a local ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $0$ be the <a href="20230112165803-nullring.html#ID-638f0759-37dc-472c-bb27-7cfccbd3c550">zero ring</a>, then $0$ is not a <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
The only <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a> is $0$, which is not <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal</a>.
</p>
