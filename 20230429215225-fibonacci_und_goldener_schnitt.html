<span id="ID-c282d7ab-2359-47ef-8465-4566b63f7257"></span><h1 class="title">Fibonacci und Goldener Schnitt</h1>

<h2 id="satz">Satz</h2>
<p>
Sei die <a href="20220105152935-fibonacci_folge.html#ID-eb92de88-6dd3-44c8-b074-4dc119f0d0e0">Fibonacci Folge</a> $F_n$ gegeben, dann gilt:
</p>

<div class="math-block">\begin{align*}
\lim_{n \to \infty}\left(\frac{F_{n+1}}{F_n}\right) =&amp; \phi
\end{align*}</div>
<p>
mit $\phi$ als dem <a href="20230327125530-goldene_schnitt.html#ID-d9144bf3-7de1-45ea-a83e-453c577cd5c7">Goldener Schnitt</a>
</p>
