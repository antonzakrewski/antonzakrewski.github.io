<span id="ID-803d6c34-11ce-472d-8d83-3a3756028e44"></span><h1 class="title">weiss cover</h1>

<h2 id="definition">Definition</h2>
<p>
A cover $\mathcal{W} \rightarrow \mathcal{U}$ is called a Weiss cover, if for all $n \in \mathbb{N}$ and $x_1,...,x_n \in \mathcal{U}$ there exists one $W \in \mathcal{W}$ such that $x_1,...,x_n \in \mathcal{W}$
