<span id="ID-fe131d8e-03b1-43ae-8699-4c3693fb852b"></span><h1 class="title">Binomialkoeffizient als Polynom</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $n \in \mathbb{N}_0$ und $z \in \mathbb{C}$.
Dann folgt, dass
</p>

<div class="math-block">\begin{align*}
\binom{s}{n} = \prod_{j=1}^{n} \frac{s + 1 - j}{n}
\end{align*}</div>
<p>
Durch Ausmultiplizieren ist der Binomialkoeffizient als <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> mit <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">Grad</a> $n$ interpretierbar
</p>
