<span id="ID-8446f9c6-82cf-4bd8-a74a-47852d6792cf"></span><h1 class="title">sphere spectrum not in the heart of spectra</h1>

<h2 id="proposition">Proposition</h2>
<p>
The sphere spectrum $\mathbb{S}$ does not lie in the <a href="20241031-heart_of_a_t_structure.html#ID-6cea50da-b823-4b1a-b388-f03c30ce512e">heart</a> of <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra</a> for the canonical <a href="20241023-t_structure_on_a_stable_infinity_category.html#ID-6e276613-1d75-469a-a934-a7f6211cdadd">t-structure</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as
</p>

<div class="math-block">\begin{align*}
\pi_1(\mathbb{S}) = \mathbb{Z}/2 \mathbb{Z} \neq 0
\end{align*}</div>
