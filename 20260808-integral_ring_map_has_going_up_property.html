<span id="ID-9ab7a463-f5e4-4d56-9550-2f9829c1146a"></span><h1 class="title">integral ring map has going-up property</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: Y \rightarrow X$ be an <a href="20240517-integral_ring_homomorphism.html#ID-1ede1280-74b5-4711-a86a-78d2efc7f714">integral ring homomorphism</a>.
Then $\vert f \vert: \mathrm{Spec}(X) \rightarrow \mathrm{Spec}(Y)$ (cf. <a href="20260721-underlying_space_functor_from_algebraic_functors.html#ID-b14d9467-5141-4162-b38a-8278e51860b0">underlying space functor</a>) has the <a href="20260807-going_up_property_of_topological_spaces.html#ID-e2f41732-b263-4cdb-b079-6a4cc5f500da">going up property</a>.
</p>
