<span id="ID-a9b7d3e5-2062-4b3c-8fd6-4184a9b6c7d2"></span><h1 class="title">removable singularity theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: \Omega \setminus \{z_0\} \rightarrow \mathbb{C}$ be <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic function</a> for $z_0 \in \Omega$.
Assume that $f$ is bounded, then there exists a holomorphic continuation on $\Omega$
</p>

<h2 id="proof">Proof</h2>
<p>
use <a href="20250525-cauchy_integral_formula.html#ID-7e398d29-b86c-4323-9281-6e574101059c">cauchy integral formula</a>
</p>
