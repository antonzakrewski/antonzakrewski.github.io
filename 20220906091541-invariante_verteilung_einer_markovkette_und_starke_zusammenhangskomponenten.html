<span id="ID-9855d05f-e305-4761-b3a8-693cc3c03d45"></span><h1 class="title">Invariante Verteilung einer Markovkette und starke Zusammenhangskomponenten</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(S,E)$ eine <a href="20220904101519-markow_kette.html#ID-7ed34770-d827-4d65-806c-4590f95b642b">Markovkette</a> mit <a href="20220904154240-stationare_verteilung.html#ID-2595e864-cf3d-4b8d-a6eb-13dd4ba8f638">stationärer Verteilung</a> $\Pi$.
Dann gilt für alle <a href="20220904101327-zustandsraum.html#ID-9c8ff692-6b30-4e2d-9fad-0b1894476a4d">Zustände</a> $s_i$, deren <a href="20220904224157-starke_zusammenhangskomponente.html#ID-849254d8-1d45-4228-a282-ff881e2c2a98">Klasse</a> eine ausgehende <a href="20220904171142-kante.html#ID-ee89f9c4-02d1-4312-9f41-09d9a1811714">Kante</a> hat $\Pi(s_i) = 0$
</p>
