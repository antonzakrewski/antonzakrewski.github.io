<p>
Let $c: \mathcal{P}(X) \rightarrow \mathcal{P}(X)$ be a <a href="20231009-choice_function.html#ID-93c065b6-8f40-44dc-9750-12061ce4f598">choice function</a>.
Then $c$ satisfies Sens condition $\alpha$ if for all sets $U \subseteq S$ with $s \in U \subseteq S$ we get:
If $s \in c(S)$, then $s \in c(U)$.
