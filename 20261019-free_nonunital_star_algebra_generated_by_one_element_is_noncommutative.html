<h2 id="proposition">Proposition</h2>
<p>
the <a href="20261019-free_star_algebra_functor.html#ID-27f7f0e3-1723-4453-9f76-d408c84ce34c">free nonunital star algebra</a> generated by one element $s$ is noncommutative.
