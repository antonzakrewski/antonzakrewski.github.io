<span id="ID-e2b7aa14-959b-4d85-93a4-7cd2ea814dc1"></span><h1 class="title">fundamental groupoid of a path connected space as connected groupoid</h1>

<h2 id="proposition">Proposition</h2>
<p>
Suppose $X$ is a <a href="20230308142110-wegzusammenhangender_raum_topologie.html#ID-09b1d548-9ac2-461c-8b3e-f72097f54a99">pathconnected</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
</p>

<p>
Then the <a href="20231128-fundamental_groupoid_of_space.html#ID-e436d255-fa9c-4743-ac40-6d62f88116a3">fundamental groupoid</a> is a <a href="20231111-connected_category.html#ID-663060d5-07ae-4dfc-b5d3-ed866fa75bdc">connected category</a>
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of <a href="20231114-path_induces_isomorphism_between_fundamental_groups.html#ID-6ecb51fd-2bbe-49b9-a22d-531d229be317">path induces isomorphism between fundamental groups</a>
</p>
