<h2 id="proposition">Proposition</h2>
<p>
Let $q \in \mathbb{Q}, z \in \mathbb{C}$.
Then
</p>

<div class="math-block">\begin{align*}
(1 + zX)^q = \sum_{n \geq 0} \binom{q}{n} z^n X^n
\end{align*}</div>
