<h2 id="definition">Definition</h2>
<p>
Let $(G, \cdot)$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $G$ is said to be divisible, if for every positive integer $n \in \mathbb{N}^+$ and group element $x \in G$ there exists a $y \in G$ such that
</p>

<div class="math-block">\begin{align*}
x =&amp; y^n
\end{align*}</div>
