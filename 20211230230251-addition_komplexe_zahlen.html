<span id="ID-61ab3eb5-8a2f-464c-b770-c424f67ffe70"></span><h1 class="title">Addition komplexer Zahlen</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $z = a + b \mathrm{i}$ und $z' = a' + b' \mathrm{i}$ <a href="20210702104546-komplexe_zahlen.html#ID-ca121ea4-6b83-47aa-a6f1-31a6e0d0667d">komplexe Zahlen</a>.
Dann ist die <a href="20210618084656-addition.html#ID-d9bb4990-4623-4957-bf16-ff3483acb12c">Addition</a> folgendermaßen (<a href="20211230231122-komponentweise_algebra.html#ID-c836a51b-7c63-421d-a20d-edb77934cdcd">komponentweise</a>) definiert:
</p>

<div class="math-block">\begin{align*}
z + z'  \coloneqq (a,b) + (a',b)  \coloneqq&amp; (a+a', b+b') \\
=&amp; a+a' + \mathrm{i}(b+b')
\end{align*}</div>

</div>
