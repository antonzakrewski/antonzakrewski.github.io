<span id="ID-685f4867-c2fc-44e6-8f68-0790a8c16f02"></span><h1 class="title">prime ideal and N-graded ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R = \bigoplus_{n \in \mathbb{N}_0} R_n\) be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">N-graded ring</a> and $\mathfrak{p} \subseteq R_0$ a <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a>.
Then $\mathfrak{p}R$ is also a prime ideal.
</p>
