<span id="ID-c4d788ac-1077-4e55-8b41-3691c39f38bb"></span><h1 class="title">additive functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20250306-preadditive_category.html#ID-bd625aa5-3c5c-46f8-a7d9-d405eaf85c96">preadditive categories</a>, then a <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a> $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ is said to be additive if it <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves</a> <a href="20250307-finite_infinity_products.html#ID-deea3950-a8f7-486d-88c3-19a27fd48f05">finite products</a> (or equivalently finite coporducts)
</p>
