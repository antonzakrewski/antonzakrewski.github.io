<span id="ID-c9d8303e-fb5d-4162-8e20-2f1f4edb7398"></span><h1 class="title">right order topology</h1>

<h2 id="definition">Definition</h2>
<p>
Sei eine <a href="20221010083644-strenge_totalordnung.html#ID-a15ef82b-7f83-4955-9afc-7e380a7e564f">streng totalgeordnete</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $X$ gegeben, dann ist die right order topology auf $ \{- \infty\} \sqcup X \sqcup \{+\infty\}$ definiert durch die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20220401195853-intervall.html#ID-ea9ab8cb-ef38-4c06-bab0-d392820614f3">Intervalle</a> $(a, +\infty)$ für $a \in X$ als <a href="20221002152517-basis_einer_topologie.html#ID-1a5a6999-876a-4b54-b786-acafe4968fd6">Basis</a>
</p>
