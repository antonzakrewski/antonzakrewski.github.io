<span id="ID-22a782a5-d1a3-4a80-bfb0-23619c5c56ed"></span><h1 class="title">infinity category with finite coproducts as weakly contractible</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nonempty</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> with <a href="20250121-finite_infinity_coproducts.html#ID-ab4db636-5608-4949-a763-4b53e3eafe90">finite coproducts</a>.
Then $\mathcal{C}$ is <a href="20241018-weakly_contractible_simplicial_set.html#ID-2902b340-ff8c-4755-a61d-1bf9e86695b0">weakly contractible</a>
</p>

<h2 id="proof">Proof</h2>
<p>
dual to <a href="20250327-infinity_category_with_finite_products_as_weakly_contractible.html#ID-c3fa6577-4d69-42c8-ac08-51748f3e7efd">infinity category with finite products as weakly contractible</a>
</p>
