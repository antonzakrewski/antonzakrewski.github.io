<span id="ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9"></span><h1 class="title">Mengenfamilie</h1>

<h2 id="definition">Definition</h2>
<p>
Eine Mengenfamilie der Grund<a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">menge</a> $\Omega$ ist eine  <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> A von einer beliebigen <a href="20220821183538-indexmenge.html#ID-0facf307-a830-4bf8-aeab-1aa67c3cced2">Indexmenge</a> I in die <a href="20220108205337-potenzmenge.html#ID-2615a647-bca5-49f5-919d-cf131c750c2b">Potenzmenge</a> $P(\Omega)$ der Grundmenge $\Omega$
</p>

<div class="math-block">\begin{align*}
A: I \rightarrow&amp; P(\Omega) \\
i \mapsto&amp; A_i
\end{align*}</div>

<h2 id="intuition">Intuition</h2>
<p>
Also eine Ansammlung von Mengen
