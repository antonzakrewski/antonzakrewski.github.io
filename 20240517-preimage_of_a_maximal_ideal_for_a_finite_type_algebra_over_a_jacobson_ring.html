<span id="ID-ab5998fe-8915-4303-a8ba-f56ba9227fc9"></span><h1 class="title">preimage of a maximal ideal for a finite type algebra over a jacobson ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230725-jacobson_ring.html#ID-b17f8891-8d7b-454c-9c22-773ed8d942e1">Jacobson ring</a>, $B$ a <a href="20230731-finitely_generated_a_algebra.html#ID-20861333-797d-4ab1-9ad5-375661f357fc">finite type</a> <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">A-Algebra</a> for $\iota: A \rightarrow B$.
Then the <a href="20230723-urbild_eines_ideals.html#ID-368eb159-1214-4cc3-8cba-86ea3ce6c43c">contraction</a> of a <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a>
</p>

<div class="math-block">\begin{align*}
\iota^{-1}[\mathfrak{m}]
\end{align*}</div>
<p>
is also maximal
