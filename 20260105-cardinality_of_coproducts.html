<span id="ID-e94336ca-d447-455b-9dd0-787aef5f2588"></span><h1 class="title">cardinality of coproducts</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a>
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{card}(X \coprod Y) = 
    \begin{cases}
    \mathrm{card}(X) + \mathrm{card}(Y) &amp; \mbox{if } \mathrm{card}(X), \mathrm{card}(Y) &lt; \infty \\
    \mathrm{max}(\mathrm{card}(X), \mathrm{card}(Y)) 
    \end{cases}
\end{align*}</div>
