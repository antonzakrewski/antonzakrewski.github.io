<span id="ID-cd3ed9d2-8ad1-4bf9-a8b2-1a064cde54b2"></span><h1 class="title">free product of groups</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G_i$ be <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a>, then the free product of $G_i$ is defined
</p>

<div class="math-block">\begin{align*}
\coprod G_i = \langle \bigcup S_i \vert \bigcup R_i \rangle
\end{align*}</div>

<p>
for the <a href="20240128-trivial_presentation_of_a_group.html#ID-f1782ff7-2966-4f5d-a812-ac99e643f867">trivial presentation</a> <a href="20231216-presentation_of_a_group.html#ID-7d0819e4-381a-43e4-9f5e-8adb052b5c39">presentation</a> $\langle \bigcup G_i \vert \bigcup R_i\rangle$
</p>
