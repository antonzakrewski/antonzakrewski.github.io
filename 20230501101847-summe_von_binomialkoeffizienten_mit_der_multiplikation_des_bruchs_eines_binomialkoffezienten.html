<span id="ID-04cf8f64-e0d9-4128-8468-c4f77bd2e064"></span><h1 class="title">Summe von Binomialkoeffizienten mit der Multiplikation des Bruchs eines Binomialkoffezienten</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $m,n \in \mathbb{N}_0$ mit $0 \leq m \leq n$, dann folgt:
</p>

<div class="math-block">\begin{align*}
\sum_{k=0}^{m} \binom{m}{k} (\binom{n}{k})^{-1} =&amp; \frac{n+1}{n+1-m}
\end{align*}</div>
