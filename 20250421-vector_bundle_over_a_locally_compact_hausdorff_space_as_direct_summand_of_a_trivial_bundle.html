<span id="ID-90d49fb2-2c98-4998-bd82-7d20b38a75af"></span><h1 class="title">vector bundle over a compact hausdorff space as direct summand of a trivial bundle</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $Y$ be a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">hausdorff</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">space</a> and $E \rightarrow X$ a <a href="20230905-topological_vector_bundle.html#ID-821f2fea-f858-4555-ae30-90ea23209a2e">topological vector bundle</a>
Then $E$ is a <a href="20230905-direkte_summe_von_vektorbundeln.html#ID-084c66a8-e60d-4e6a-9b5c-585d83cb5e84">direct sum</a> of a <a href="20241005-trivial_vector_bundle.html#ID-192bbd45-ad8f-41a4-93cb-ed05879b6fce">trivial vector bundle</a> $X \times \mathbb{K}^n$ for sufficiently large $n$
</p>
