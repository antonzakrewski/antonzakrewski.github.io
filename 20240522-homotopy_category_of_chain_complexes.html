<span id="ID-cb0c2ef3-7fa3-42d4-95f4-198864ecb6e3"></span><h1 class="title">homotopy category of chain complexes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>
Then the homotopy category is defined as <a href="20240107-quotient_category.html#ID-16329e93-8d67-4141-8e7f-b54ed7ac143f">quotient category</a> relative to <a href="20240119-chain_homotopy.html#ID-779721d8-47c9-4616-8c2e-eb6cc27f5de1">chain homotopy</a>
</p>
