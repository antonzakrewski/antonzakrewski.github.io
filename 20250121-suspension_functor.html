<span id="ID-e9fa07ee-4a2e-4c76-9a53-fabd07305e6d"></span><h1 class="title">suspension functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> admitting (enough) <a href="20241022-cofiber_of_an_infinity_morphis3.html#ID-c9321dad-6e04-418b-a0a5-ad8546205938">cofibers</a> and a <a href="terminal-object-in-an-infinity-category.html#ID-b49b437f-7d5c-4d8a-a413-1c995de811f6">terminal object</a>.
Then the suspension functor is defined as functor
</p>

<div class="math-block">\begin{align*}
\Sigma - \coloneqq \mathrm{cofib}(- \rightarrow 0)
\end{align*}</div>
