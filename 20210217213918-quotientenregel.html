<span id="ID-6b07168c-c2fd-4a8e-a0c6-1cbf4f462118"></span><h1 class="title">Quotientenregel (11)</h1>

<h2 id="satz">Satz</h2>
<p>
Sind die <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktionen</a> $g$ und $h$ <a href="20210217184102-differenzierbarkeit.html#ID-3a5a92c4-2d28-46ae-91f9-92603797aa69">differenzierbar</a>, so gilt:
</p>

<div class="math-block">\begin{align*}
f(x)  \coloneqq&amp; \frac{g(x)}{h(x)} \\
\Rightarrow f'(x) =&amp; \frac{g'(x) \cdot h(x) - g(x) \cdot h'(x)}{h(x)^2}
\end{align*}</div>
