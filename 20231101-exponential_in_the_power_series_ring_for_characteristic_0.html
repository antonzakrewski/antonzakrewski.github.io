<span id="ID-3531b9fc-4871-4957-a541-cd65ae84f03c"></span><h1 class="title">exponential in the power series ring for characteristic 0</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> with <a href="20221030164602-charakteristik_eines_korpers.html#ID-857e2abc-6f76-404f-bf65-6822c05d6bd3">characteristic</a> $\mathrm{char}(R) = 0$.
Then the exponential in the <a href="20230427070950-ring_der_formalen_potenzreihen.html#ID-8c920542-3559-472f-8af9-c0d8690cf10a">power series ring</a> $R[[X] ]$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{exp} \coloneqq \sum_{i=0}^{n} \frac{1}{n!}X^n
\end{align*}</div>

</div>
