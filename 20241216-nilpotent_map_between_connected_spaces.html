<span id="ID-86ddb3b1-8680-4886-ba35-93a682989b3c"></span><h1 class="title">nilpotent map between connected spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> between <a href="20230118223336-zusammenhangender_raum.html#ID-bcc53507-bc5a-46d4-bd83-53e504f62b9d">connected</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
Then $f$ is said to be nilpotent, if the $\pi_1(X)$ action on the $\pi_1(F)$ (cf.  ) is <a href="nilpotent-action.html#ID-84de1caf-ad6b-424d-af61-1eaa712c4954">nilpotent</a> $n \geq 1$
</p>
