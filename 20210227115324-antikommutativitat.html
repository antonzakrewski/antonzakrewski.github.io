<span id="ID-7489e75e-9bd0-4422-b6a4-6abde30c4b9e"></span><h1 class="title">Antikommutativität</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M, \circ)$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a>.
Then $M$ is said to be anticommutative, if for $m,n \in M$ it holds that
</p>

<div class="math-block">\begin{align*}
(m \cdot n) \cdot (n \cdot m) = 1
\end{align*}</div>
