<span id="ID-28895c55-7639-4ad3-877d-1d8965891fed"></span><h1 class="title">uniquely divisible group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $G$ is said to be uniquely divisible, if for each element $h \in G$ and each $n \in \mathbb{N}$, there exists a <strong>unique</strong> element $g'$ such that
</p>

<div class="math-block">\begin{align*}
h^n = g
\end{align*}</div>
