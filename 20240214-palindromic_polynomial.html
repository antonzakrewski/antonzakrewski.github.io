<span id="ID-9031b9e8-09f6-4cf2-aa6d-581852928904"></span><h1 class="title">palindromic polynomial</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>,
</p>

<div class="math-block"> \begin{align*}
f = \sum_{i=0}^{n} \alpha_i X^i
\end{align*}</div>
<p>
a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a>
</p>

<p>
Then $R$ is said to be palindromic, if
</p>

<div class="math-block">\begin{align*}
\sum_{i=0}^{n} \alpha_i X^i = \sum_{i=0}^{n} \alpha_{n-i} X^i
\end{align*}</div>

</div>
