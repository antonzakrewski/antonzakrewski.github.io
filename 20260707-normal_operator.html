<span id="ID-64a6069f-efc7-4816-b586-fcb37089e245"></span><h1 class="title">normal operator</h1>

<h2 id="definition">Definition</h2>
<p>

Then $T$ is said to be a normal operator, if
</p>

T T^* = T^* T
\end{align*}</div>
