<span id="ID-c12922d6-c06f-4315-96e7-9fcb0eca496a"></span><h1 class="title">faithful module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $M$ an \(A\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then $M$ is said to be faithful, if for the <a href="20230522201427-annihilator.html#ID-63ba0a41-8f52-40ac-9128-ae29c17b8cf2">Annihilator</a> is the <a href="20230725-zero_ideal.html#ID-44d27475-7790-426b-a9cc-8e321e6dd3d1">zero ideal</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Ann}_A(M) = (0)
\end{align*}</div>
