<span id="ID-de6f024e-a6c2-4023-9d46-c31ffb4095e1"></span><h1 class="title">dirac-delta operator</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $C_b(X)$ the space of bounded functions.
Then for $x \in X$, the dirac delta is defined as
</p>

<div class="math-block">\begin{align*}
\delta_x: C_b(X) \rightarrow&amp; \mathbb{K} \\
f \mapsto f(x)
\end{align*}</div>
