<span id="ID-00bbd65b-c459-408d-a83c-306dee28d2f6"></span><h1 class="title">symmetric group</h1>

<h2 id="definition">Definition</h2>
<p>
Die Symmetrische Gruppe ist die <a href="20230302210538-automorphismengruppe.html#ID-ad2bea99-3395-41e7-84ca-c93a1fc0efab">Automorphismengruppe</a> eines <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">Objekts</a> $M \in \mathrm{Set}$,  der <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">Kategorie</a> <a href="20221216142701-kategorie_set.html#ID-dc78356f-1fcf-41e8-b05a-47cdd731513c">Set</a>, also die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20221026161747-permutation_abbildung.html#ID-af424eae-548d-4d43-8ff0-3c2930186d7c">Permutationen</a>.
Ist $\vert M \vert &lt; \infty$, so schreibt man $S_n$ und spricht vom Grad $n$ der <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a>
</p>
