<h2 id="proposition">Proposition</h2>
<p>
Let $(E_{p,q}^r, M_n)$ be a first quadrant <a href="20250826-spectral_sequence.html#ID-37b89bcc-af64-4182-9e25-2a7ac65f9ec4">spectral sequence</a> (using: <a href="20250514-serre_spectral_sequence.html#ID-16001db6-bfb8-4a57-80f4-4582c8a7d02e">cohomological serre grading</a>) and assume that the axes of the \(E^1\)-page survive.
Then objects in the \(k\)-th diagonal survive at least at the \(k\)-th page
