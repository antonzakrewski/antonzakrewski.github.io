<span id="ID-bfb9ff4c-c2f2-477c-bc90-88da2de01cf9"></span><h1 class="title">affiner Unterraum</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a>, $U \subseteq V$ ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Unterraum</a> und $a \in V$.
Ein affiner Unterraum $A \subset V$ ist eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a>
</p>

<div class="math-block">\begin{align*}
A = a + U = \{a + u \vert u \in U\} \subseteq V
\end{align*}</div>
