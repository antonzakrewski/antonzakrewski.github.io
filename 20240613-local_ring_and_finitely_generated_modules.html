<span id="ID-545459d4-93db-453f-affe-e5b7a3428997"></span><h1 class="title">local ring and finitely generated modules and tensoring as zero object</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a> and $M,N$ <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated modules</a> such that
</p>

<div class="math-block">\begin{align*}
M \otimes_A N = 0
\end{align*}</div>
<p>
Then $M = 0$ or $N = 0$
</p>

<h2 id="proof">Proof</h2>
<p>
<a href="20230904-nakayama_lemma_for_local_rings.html#ID-695613e9-c2df-4250-a3fd-65df81d1ea1b">Nakayama's Lemma for local rings</a>
</p>
