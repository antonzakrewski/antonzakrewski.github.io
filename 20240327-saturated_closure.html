<span id="ID-0e8f1827-78e4-4e37-b70e-aaf942c28e12"></span><h1 class="title">saturated closure</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20230923-cocomplete_category.html#ID-89cedbd1-199b-47a8-bc3f-574dd3accda9">cocomplete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>,  $S \subseteq \mathrm{Mor}(\mathcal{C})$ a collection of morphisms.
Then the saturated closure is defined as smallest supercollection $\overline{S} \supseteq S$ such that $\overline{S}$ is <a href="20240327-saturated_set_of_morphisms.html#ID-c7e099f7-6292-4de2-809f-5d792c2bb969">saturated</a>
</p>
