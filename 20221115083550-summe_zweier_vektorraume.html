<span id="ID-da2e73df-a954-4165-a658-a914c6adabcf"></span><h1 class="title">Summe zweier Vektorräume</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a>, $W$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $U,V \subseteq W$ <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Untervektorräume</a>, dann ist $U + V$ definiert als:
</p>

<div class="math-block">\begin{align*}
U + V  \coloneqq \{x \vert x = u + v u \in U, v \in V\}
\end{align*}</div>
