<span id="ID-5a3b7e46-b09b-4ee7-8b06-e217edd67c81"></span><h1 class="title">group action on the cosets</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $H \subseteq G$ be a <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a>.
Then $G$ acts on the <a href="20231213-coset.html#ID-e34f7ab6-0ade-4026-b95f-34575a0904fa">cosets</a> by left multiplication
</p>

<div class="math-block">\begin{align*}
\varphi: G \times G/H \rightarrow G/H \\
(g_1,g_2H) \mapsto&amp; g_1 \cdot g_2 H
\end{align*}</div>
