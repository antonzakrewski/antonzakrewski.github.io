<span id="ID-22534660-9561-4ec9-b277-f9f37cbc140e"></span><h1 class="title">exactification of a homomorphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G,H$ be <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a> and $\varphi: G \rightarrow H$ a <a href="20220928134932-gruppenhomomorphismus.html#ID-7d86b4b2-8f83-4da4-b1ef-08c3d37aa417">homomorphism</a>.
Then there exists an <a href="20230722-exact_group_homomorphisms.html#ID-aa569635-5f4a-4c4a-9e9b-af9c577e377d">exact sequence</a>
</p>

<div class="equation-container"><span class="equation"><img src="ltximg/6cb0b7ee359f298ab241.svg" class="org-svg" alt="diagram" /></span></div>

<h2 id="proof-sketch">Proof (sketch)</h2>

<h3 id="h">$H$</h3>
<p>
$\pi(h) = 0$ iff $h \in \mathrm{im}(\varphi)$
</p>

<h3 id="mathrmcokervarphi">$\mathrm{coker}(\varphi)$</h3>
<p>
$\pi$ is surjective
</p>
