<span id="ID-6dfbcf67-7022-489c-839a-9f7b79bfbcbf"></span><h1 class="title">Quantilsfunktion</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $F: \mathbb{R} \rightarrow [0,1]$ eine <a href="20241022-kumulative_verteilungsfunktion.html#ID-88e304c8-6899-451a-b399-b2df0533825b">kumulative Verteilungsfunktion</a>.
Dann sit die Quantilsfunktion von $F$ definiert als
</p>

<div class="math-block">\begin{align*}
q: (0,1) \rightarrow&amp; \mathbb{R}
y \mapsto \mathrm{inf}\{x \in \mathbb{R} \vert F(x) \geq y \}
\end{align*}</div>
