<h2 id="proposition">Proposition</h2>
<p>

Assume that $X$ has  a <a href="20240903-nonsingular_point_of_a_quasi_projective_algebraic_set.html#ID-01f7732a-fcdf-47a9-9cd8-9894c831dc11">nonsingular point</a>
</p>

<p>
Then $X$ is not <a href="20240905-normal_quasi_projective_variety.html#ID-7deb6f1d-d8ed-484e-ae33-090fd273e450">normal</a>
</p>
