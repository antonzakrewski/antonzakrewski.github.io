<span id="ID-5fc68318-e707-4fe8-9971-51e701816091"></span><h1 class="title">functor creating colimits of a shape</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}s \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>
Then $\mathcal{F}$ is said to create colimits of a shape $I$, if $\mathcal{F}$ <a href="20240110-functor_reflecting_colimits.html#ID-10287946-2261-41a3-867e-eeaac4694f33">reflects</a> and <a href="20231014-functor_preserving_colimits.html#ID-3d77cdc9-e177-40d9-b57d-dc17d897d8a7">preserves colimits</a> of the shape $I$.
</p>
