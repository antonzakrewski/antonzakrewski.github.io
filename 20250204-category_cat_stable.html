<span id="ID-b528357e-93c4-47ad-bfe5-4b5493d84b8d"></span><h1 class="title">category Cat Stable</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathrm{Cat}_{\infty}^{\mathrm{lex}}$ be the <a href="20250204-category_cat_lex.html#ID-08eee26c-cc99-4a28-a7ec-1add726b5243">category cat lex</a>.
Then $\mathrm{Cat}^{\mathrm{st}}$ is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full sub infinity category</a> containing <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable categories</a>
</p>

<p>
i.e. stable infinity categories and <a href="20241022-exact_infinity_functor.html#ID-ad972639-9cea-45ab-8f5f-595d620392cf">exact infinity functors</a>
</p>
