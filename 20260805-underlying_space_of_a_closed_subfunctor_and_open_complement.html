<span id="ID-1684fda9-96e2-469c-9ac5-c673ed5385c0"></span><h1 class="title">underlying space of a closed subfunctor and open complement</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $Z \subseteq X$ be a <a href="20260713-closed_subfunctor.html#ID-d952d35b-1a92-4447-97b0-37c5363be496">closed subfunctor</a> with <a href="20260721-open_complement_of_a_closed_subfunctor.html#ID-c6bb704f-9d3d-4a22-8c56-7e9e73929c3b">open complement</a> $U$.
Then the <a href="20260721-underlying_space_functor_from_algebraic_functors.html#ID-b14d9467-5141-4162-b38a-8278e51860b0">underlying space</a> of $U$ is given by $\vert U \vert = \vert X \vert \setminus \vert Z \vert$.
</p>
