<span id="ID-97150a62-94d4-4ba2-85fc-e7ca74db2064"></span><h1 class="title">suspension prespectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>.
Then the suspension prespectrum is given by
</p>

<div class="math-block">\begin{align*}
X_0 \coloneqq X \\
X_i \coloneqq \Omega \Sigma X_{i-1}
\end{align*}</div>
<p>
with the <a href="20241109-infinity_unit_transformation.html#ID-2938f9f8-5823-47ef-b80a-c23e2dd61aea">unit</a> as map $X_{n-1} \rightarrow \Omega X_n$
</p>


<div class="math-block">\begin{align*}
X \rightarrow \Omega
\end{align*}</div>
