<span id="ID-768b7017-fee0-405e-ad69-f267f651b648"></span><h1 class="title">monoidal functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20221223192944-monoidal_category.html#ID-e7314567-2c1d-4ebd-8aa0-323b3145b541">monoidal category</a>.
A monoidal functor is a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ equipped equipped with a <a href="20231201-monodial_structure_on_a_functor.html#ID-62bbd5d5-f943-430d-870a-bde433e2bf84">monoidal structure</a>
<a href="20231201-strict_monodial_structure_on_a_functor.html#ID-e8192af1-0d51-4d94-a498-e5a6d271e025">strict monoidal structure on a functor</a>
</p>
