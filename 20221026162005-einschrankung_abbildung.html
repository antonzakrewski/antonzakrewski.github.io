<span id="ID-c9f04287-e549-4811-8538-f4a3c521866f"></span><h1 class="title">restriction of a map</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $A,B,T$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> mit $T \subseteq B$  und sei $f: A \rightarrow B$ eine Abbildung
Die Abbildung $f_{\vert T} T \rightarrow B$ ist dann eine Einschränkung oder Restriktion der Abbildung $f$ auf die Teilmenge $T$
