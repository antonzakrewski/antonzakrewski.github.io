<span id="ID-62a5ec35-cc96-4b7f-b94c-d49e565a6e6f"></span><h1 class="title">split mono</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $f \in \mathrm{Hom}_{\mathcal{C}}(A,B)$.
Then $f$ is said to be a spilt mono, if there exists a <a href="20230914-left_inverse_morphism.html#ID-ed02ff6a-1614-4295-aa50-66c756be4551">left-inverse</a> $g \in \mathrm{Hom}_{\mathcal{C}}(B,A)$ such that
</p>

<div class="math-block">\begin{align*}
g \circ f = \mathrm{id}_{A} 
\end{align*}</div>
