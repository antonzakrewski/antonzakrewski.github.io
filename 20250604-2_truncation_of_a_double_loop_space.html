<span id="ID-c1d8c97c-0588-47c6-8c5d-0b83bbe2a4e0"></span><h1 class="title">2-truncation of a double loop space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X \simeq \Omega^2 Y$ be a double <a href="20241022-loop_functor_of_a_stable_infinity_category.html#ID-33f8cc50-742f-4636-a5ea-2cd078602f80">loop space</a>.
Then the <a href="20250331-truncation_functor_of_anima.html#ID-508e81f5-2d80-40c0-99d4-d22b24f3da38">2-truncation</a> of the underlying <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a> is given by
</p>

<div class="math-block">\begin{align*}
\tau_{\leq 2} X \simeq \mathrm{B}\pi_1(X) \times K(\pi_2(X), 2)
\end{align*}</div>
