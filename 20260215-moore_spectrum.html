<span id="ID-fc4b7793-a90b-42d7-9d80-43fea35d272c"></span><h1 class="title">moore spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then the k-th moore spectrum is defined as <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a> $M(A,n)$ with
</p>
<ol>
<li>$\pi_i(M(A,n)) = 0$ for $i &lt; n$</li>

<li>$\pi_n(M(A,n)) = A$</li>

<li>$H_i(M(A,n)) = 0$ for $i &gt; n$       </li>
</ol>
