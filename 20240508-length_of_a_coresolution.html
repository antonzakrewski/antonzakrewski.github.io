<span id="ID-fcc7dfde-c430-4bfc-af29-f44f3234bac4"></span><h1 class="title">length of a coresolution</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $M \rightarrow I_*$ a <a href="20240319-coresolution.html#ID-2fd18efc-a63f-43ae-8438-cb106dfcb420">coresolution</a>
Then the length is defined as <a href="20240416-length_of_a_resolution.html#ID-c401d919-4064-47a0-9daa-017f5f023d08">length</a> of the <a href="20230903-left_resolution.html#ID-e89108bc-65a7-4d25-98a1-e02783af9995">resolution</a> $I_*^{\mathrm{op}} \rightarrow M^{\mathrm{op}}$ in the <a href="20220830192239-duale_kategorie.html#ID-711d7a6e-e765-4a59-90a2-baeee955dea1">opposite category</a>
</p>
