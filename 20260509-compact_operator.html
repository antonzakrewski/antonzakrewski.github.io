<span id="ID-eff9525d-2e92-42ce-acaa-8674b0f4f80a"></span><h1 class="title">compact operator</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector spaces</a> and $T: X \rightarrow Y$ a <a href="20221119162741-vektorraumhomomorphismus.html#ID-863f0f55-054c-413e-9cf4-2c2704ea5b14">vectorspace-homomorphism</a>
Then $T$ is said to be a compact operator, if $T$ maps <a href="20230417142747-bounded_set_metric_space.html#ID-59957e79-a7f9-4b24-b9d7-6808ef50e46f">bounded subsets</a> to <a href="20230703-relativ_kompakt.html#ID-d391211b-72f2-4209-9324-b88974799018">relatively compact</a> subsets.
</p>
