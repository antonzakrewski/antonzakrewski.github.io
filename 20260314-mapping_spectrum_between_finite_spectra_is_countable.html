<span id="ID-56db1802-b77b-4b1c-a33e-40d6be4187c3"></span><h1 class="title">mapping spectrum between finite spectra is countable</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectra</a>, then $\mathrm{map}_{\mathrm{Sp}}(X,Y)$ is a <a href="20260314-countable_anima.html#ID-ba484b13-204f-4662-aa49-fad9438d36ce">countable anima</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20260314-mapping_spectrum_between_finite_spectra_is_finite.html#ID-afe2dd61-e9d8-4f2e-9d73-a725ced45cfa">mapping spectrum between finite spectra is finite</a> </li>

<li><a href="20260314-finite_spectrum_is_countable.html#ID-4d2f7f74-5478-49e5-bb2b-ead75501dc7c">finite spectrum is countable</a></li>
</ul>
