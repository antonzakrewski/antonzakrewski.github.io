<h2 id="proposition">Proposition</h2>
<p>
Let $(U_i \subseteq X)_i$ and $(V_j \subseteq X)_j$ be <a href="20260721-open_covering_of_an_algebraic_functor.html#ID-ed95b8a1-c3ee-41f3-b7a5-8a61cb60f0af">open coverings</a>.
Then $(V_{j} \cap U_i \subseteq X)_{i,j}$ is an open covering of $X$.
