<span id="ID-b8422ae4-c20f-468f-8f66-aa736833f806"></span><h1 class="title">epsilon-Umgebung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>  und $x \in M$.
Die epsilon-Umgebung ist dann definiert als:
</p>

<div class="math-block">\begin{align*}
U_{\epsilon}^M(x)  \coloneqq \{y \in \mathbb{R} \vert d(y,x) &lt; \epsilon \} 
\end{align*}</div>
