<span id="ID-2c2bd3d4-a57b-45b3-bd21-3bac2ce28bda"></span><h1 class="title">left fibration as inner fibration</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $f: X \rightarrow Y$ a <a href="20240327-left_fibration.html#ID-bdbcb3cc-0793-4a96-9303-7f78702f03fb">left fibration</a>
Then $f$ is also an <a href="20240327-inner_fibration.html#ID-1915e43c-9378-4583-b34c-5f4e084cb5a0">inner fibration</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows, as an <a href="20240128-inner_horn.html#ID-9f3066a1-77af-4de4-b1f9-331f8aa919e8">inner horn</a> is by definition also a <a href="20240404-left_horn.html#ID-306d5f03-d203-4943-8592-559252e44954">left horn</a>
</p>
