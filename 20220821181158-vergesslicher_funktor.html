<span id="ID-ab7c2501-acb6-479f-bb8d-565ccba09aad"></span><h1 class="title">forgetful functor</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> is a forgetful functor, if it maps from a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> with more structure to a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> with less structure
e.g. the <a href="20230402143832-underlying_set_functor.html#ID-71f19a78-b839-4247-b1c5-3488dbd8d69c">underlying-set functor</a>
</p>
