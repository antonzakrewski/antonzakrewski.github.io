<h2 id="definition">Definition</h2>
<p>
Sei $(V, \phi(\cdot, \cdot))$ ein <a href="20221109121525-endlich_erzeugter_vektorraum.html#ID-477797e9-4b4d-4886-9606-6e1c5f378a4f">endlich erzeugter</a> <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilbertraum</a> mit einer <a href="20221030151204-basis_vektorraum.html#ID-4b0d1e47-5503-4b26-9ab3-a142097c2624">Basis</a> $a_1,...,a_n$.
Dann ist die Strukturmatrix definiert als
</p>

<div class="math-block">\begin{align*}
B_{\varphi, a_1,...,a_n} \coloneqq (\phi(a_i, a_j))
\end{align*}</div>
