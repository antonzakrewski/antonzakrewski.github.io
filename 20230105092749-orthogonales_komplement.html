<span id="ID-e1d31ecf-7be2-4812-ba03-7145c5c0dbe8"></span><h1 class="title">orthogonal complement</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(V, (\cdot, \cdot))$ ein <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilbertraum</a> und $U$ ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Untervektorraum</a>.
Dann ist das orthoganel Komplement
</p>

<div class="math-block">\begin{align*}
U^{\bot} =&amp; \{v \in V : v \bot U\} \\
=&amp; \{v \in V \vert (v,m) = 0 \forall m \in U \}
\end{align*}</div>
