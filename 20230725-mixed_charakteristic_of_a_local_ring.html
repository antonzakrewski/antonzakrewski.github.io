<span id="ID-c7f4118c-2d95-4b3a-96b6-1639e6963e69"></span><h1 class="title">mixed charakteristic</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $R$ is said to be of mixed characteristic if there exists an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a> $I$ such that
</p>

<div class="math-block">\begin{align*}
\mathrm{char}(R) =&amp; 0 \\
\mathrm{char}(R/I) \neq 0
\end{align*}</div>
<p>
see: <a href="20221030164602-charakteristik_eines_korpers.html#ID-857e2abc-6f76-404f-bf65-6822c05d6bd3">Characteristic</a>, <a href="20221226124908-faktorring.html#ID-302f063f-b9f6-4806-b78a-47d210d78bcb">quotient ring</a>
</p>
