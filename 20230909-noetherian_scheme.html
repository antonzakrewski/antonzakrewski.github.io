<span id="ID-3a45cf3b-326d-4b8b-a655-3c4909ad14dc"></span><h1 class="title">noetherian scheme (boomer)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_X, O_i)$ be a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a>.
then $X$ is said to be noetherian, if it is <a href="20230909-locally_noetherian_scheme.html#ID-05be7653-79b0-4289-a8c9-872338b91158">locally noetherian</a> and $X$ as a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> is <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a>
</p>
