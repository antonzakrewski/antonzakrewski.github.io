<span id="ID-2738cccc-2b00-4aa9-b6bd-ca0b0a59f749"></span><h1 class="title">Zweiter Hauptsatz der Differential- und Integralrechnung</h1>

<h2 id="satz">Satz</h2>
<p>
sei $f: [a,b] \rightarrow \mathbb{R}$ eine  <a href="20220819232419-stetigkeit.html#ID-b2d86612-ee0d-43a3-b49c-6953d712ecc5">stetige</a> <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> mit der <a href="20221014123755-stammfunktion.html#ID-14e5eab8-30c3-4028-94ed-a40b17e90c87">Stammfunktion</a> $F: [a,b] \rightarrow \mathbb{R}$
Dann gilt:
</p>

<div class="math-block">\begin{align*}
\int_{a}^{b} f(x) \mathrm{d}x =&amp; F(b) - F(a) 
\end{align*}</div>


</div>
