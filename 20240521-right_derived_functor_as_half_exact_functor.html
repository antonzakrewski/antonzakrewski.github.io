<span id="ID-939ffc72-7342-49d0-bd01-3fa29a1349d7"></span><h1 class="title">right derived functor as half exact functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}, \mathcal{B}$ be <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{RF}: \mathcal{A} \rightarrow \mathcal{B}$ a <a href="20240317-right_derived_functor.html#ID-7c3a1066-402a-45c7-8df2-6810632ee3d2">right derived functor</a>
Then $\mathcal{RF}$ is <a href="20230903-covariant_half_exact_functor.html#ID-262cbe81-1b42-4d9e-bbbb-47a127bf2d27">half exact</a>
</p>
