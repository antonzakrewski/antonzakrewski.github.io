<span id="ID-46622402-49f7-4528-89d0-1f69bb8c8ca0"></span><h1 class="title">torsion-free module</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ ein $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a> über einem <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> $R$, dann ist $M$ torsionsfrei, falls $0$ das einzige <a href="20230222205653-torsionselement.html#ID-8529376b-0b2f-4bc4-94e1-b111293af63c">Torsionselement</a> ist.
