<span id="ID-c4409141-e5e2-411b-9a41-8d34c4f7b051"></span><h1 class="title">small limit</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $F: \mathcal{D} \rightarrow \mathcal{C}$ be <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> and $A \in \mathrm{Ob}(\mathcal{C})$ a <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> of $F$.
Then $A$ is said to be a small limit, if $\mathcal{D}$ is a <a href="20220819181004-kleine_kategorie.html#ID-3c3f1c0d-53ad-476e-810a-756acd885263">small category</a>
</p>
