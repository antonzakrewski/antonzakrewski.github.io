<span id="ID-b24d8b39-6624-4cae-af42-bd29c730df59"></span><h1 class="title">stetiger Pfad</h1>

<h2 id="definition">Definition</h2>
<p>

Dann ist das <a href="20221224140013-bildmenge.html#ID-def6ffac-1c21-427b-bacf-7b8580f5d7dd">Bild</a> $f \left[ [0,1] \right]$ ein stetiger Pfad von $x$ nach $y$
