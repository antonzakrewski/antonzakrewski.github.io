<span id="ID-922baf31-c324-4ca2-adf9-0d96c6436e33"></span><h1 class="title">localization along an element</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $f \in A$.
Then the <a href="20230724-localization_of_a_ring.html#ID-0b26fdfb-9d28-4981-acde-2ea1ea96837d">localization</a> along $f$ is defined as
</p>

<div class="math-block">\begin{align*}
R_f \coloneqq S^{-1}R
\end{align*}</div>
<p>
for
</p>

<div class="math-block">\begin{align*}
S \coloneqq \{1,f^1,f^2,...\}
\end{align*}</div>


<p>
Analogously for <a href="20230725-localization_of_a_module.html#ID-eeaa3c03-2f86-4dee-871b-2d7dd14c981c">localization</a> of a <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>
</p>
