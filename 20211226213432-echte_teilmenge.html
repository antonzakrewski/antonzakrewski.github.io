<span id="ID-d91c99f3-9e8a-4620-8508-ff80ecb5351b"></span><h1 class="title">proper subset</h1>

<h2 id="definition">Definition</h2>

<div class="math-block">\begin{align*}
B \subsetneq A  := \exists x ( x \in A \land x \not\in B) \land \forall y (y \in B \rightarrow y \in A)
\end{align*}</div>


<h3 id="bedeutung">Bedeutung</h3>

<li>B als <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> </li>
