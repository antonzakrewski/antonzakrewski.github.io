<span id="ID-68c8e56d-cf23-4d00-bf3e-79a5946b1295"></span><h1 class="title">finite cw complex is homologically finite space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20231121-finite_cw_complex.html#ID-a06cd5e3-3aed-4af2-a7b2-2b0a58b90a82">finite cw-complex</a>.

</p>
