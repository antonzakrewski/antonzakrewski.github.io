<h2 id="definition">Definition</h2>
<p>
Let $X \in \mathrm{An}$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>
Then it is called an infinite loop space, if for $n \in \mathbb{N}$ there exists (? is specified) another space $X_n$ and an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>

<div class="math-block">\begin{align*}
\Omega^n X_n \simeq X
\end{align*}</div>
