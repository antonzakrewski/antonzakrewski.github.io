<span id="ID-e4ae289a-86a8-4bd6-a880-f512b5d182bc"></span><h1 class="title">weakly contractible space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is said to be weakly contractible, if every <a href="20230722-homotopy_group.html#ID-8aa4161f-9373-468e-90e1-7ab31641c24a">homotopy group</a> is the <a href="20230724-zero_group.html#ID-0f5c843a-aad5-40cb-9636-cf70849691aa">zero group</a>
</p>
