<span id="ID-ab9bd57a-4953-49bd-ac64-684f8430c4ff"></span><h1 class="title">reduced scheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a>
Then $X$ is said to be reduced, if there exists an <a href="20230826-affine_scheme.html#ID-db53fdff-23db-4578-95b6-9cc1e057c336">affine</a> <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open</a> cover, where each <a href="20260714-coordinate_ring_of_an_algebraic_functor.html#ID-aadc56a9-2716-4ffc-978d-7e8f5335e817">coordinate ring</a> is a <a href="20230725-reduced_ring.html#ID-1480b16c-0de6-4614-9ae9-a70abea088a9">reduced ring</a>
</p>
