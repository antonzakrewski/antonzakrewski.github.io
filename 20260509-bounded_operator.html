<span id="ID-c9aa0020-0a75-4250-9116-0d18e171bb90"></span><h1 class="title">bounded operator</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M,N$ be <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector spaces</a>.
Then a <a href="20221119162741-vektorraumhomomorphismus.html#ID-863f0f55-054c-413e-9cf4-2c2704ea5b14">vectorspace-homomorphism</a> $T: M \rightarrow N$ is said to be bounded, if the <a href="20230228183044-operatornorm_als_echte_norm.html#ID-ee5d7893-af98-4807-8118-00bde790b509">Operatornorm</a> is <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>.
</p>
