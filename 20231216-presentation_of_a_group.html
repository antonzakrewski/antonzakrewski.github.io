<span id="ID-7d0819e4-381a-43e4-9f5e-8adb052b5c39"></span><h1 class="title">presentation of a group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $S$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>, $F_S$ the <a href="20230302220045-freie_gruppe.html#ID-58be942b-0278-427c-b1d9-e90bfef1b3ff">free group</a> on $S$ and $R \subseteq F_s$ be a set of <a href="20231004-word.html#ID-861b8256-3430-41a9-9fe6-c9535f43b1f5">words</a>.
Let $N_S$ be the <a href="20230809-normal_closure.html#ID-3c739923-795b-4c9d-a87e-857d681e3c22">normal closure</a>
</p>

<p>
Then a presentation is the <a href="20221210201536-faktorgruppe.html#ID-37068c77-35dd-45c0-8051-01704f97222c">quotient group</a>
</p>

<div class="math-block">\begin{align*}
\langle S \vert R\rangle \coloneqq F_S/N
\end{align*}</div>
