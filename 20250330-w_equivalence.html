<span id="ID-ffebcb53-26f3-4640-ae14-fd3039f8195d"></span><h1 class="title">W-equivalence</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>, $x \in \mathcal{C}$ an object.
Then $x$ is said to be \(W\)-local, if the <a href="20241017-mapping_space_functor.html#ID-1c67265d-2f8e-4079-b043-e71c8100d080">mapping space functor</a>  is a <a href="20250114-w_local_functor.html#ID-d958dcb1-73e0-479a-9d13-3756d8e17d6b">W-local functor</a>
</p>
