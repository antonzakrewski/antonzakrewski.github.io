<span id="ID-07618ba7-fce0-4a2e-b5a0-dc92054a0de7"></span><h1 class="title">extremal epimorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $e \in \mathrm{Mor}(\mathcal{C})$ an <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">epimorphism</a>.
Then $e$ is said to be extremal, if for a <a href="20230225172453-faktorisierung_eines_morphismus.html#ID-03fc6d28-e9bd-4fa3-8093-a113eaf06a6e">factorization</a>
</p>

<div class="math-block">\begin{align*}
e = m \circ g
\end{align*}</div>
<p>
for a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> $m$ it follows, that $m$ is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
