<span id="ID-57342d30-867c-4c96-bc4c-3365539c42e6"></span><h1 class="title">time projection of the join</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X_i$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>, $i \in I$ and $\star_I X_i$ the <a href="20241204-join_of_topological_spaces.html#ID-8dac152a-ae15-44df-984a-930bf3d96bfe">join of topological spaces</a>.
The \(i\)-th time projection of the join is defined
</p>

<div class="math-block">\begin{align*}
t_i: \star_{I} X_i \rightarrow&amp; [0,1] \\
(x_i,t_i) \mapsto&amp; t_i
\end{align*}</div>
