<span id="ID-4c248dad-9023-49e2-a59b-44fef836cde5"></span><h1 class="title">numerable principal g-bundle</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: E \rightarrow B$ be a <a href="20241113-principal_g_bundle.html#ID-41366781-604c-4d30-ac8e-985b2fb48728">principal g-bundle</a> for a <a href="20230226210828-topologische_gruppe.html#ID-0aa20bcb-5c3d-4d06-aeee-e61b46a46e48">topological group</a> $G$.
Then $p$ is said to be numerable, if there exists a trivializing cover of $p$ as principal G-bundle, which admits a <a href="20230624-untergeordnete_partition_der_eins.html#ID-c043bd4e-d16e-4171-9fd9-653eb0dff1c6">subordinate partition of unity</a>
</p>
