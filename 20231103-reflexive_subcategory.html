<span id="ID-1108fa98-a30d-4f4b-9fe7-44eb86152649"></span><h1 class="title">reflective subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $\mathcal{D}$ a <a href="20230225184516-volle_unterkategorie.html#ID-02c96fc8-ac4f-42b6-804d-bc08d25bfb2a">full subcategory</a> for an inclusion $\iota: \mathcal{D} \rightarrow \mathcal{C}$
Then $\mathcal{D}$ is said to be reflective, if the inclusion <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> admits a <a href="20220831221344-linksadjungierte.html#ID-1e87e6b9-24df-41fb-bc1b-d35cfd2eaa7f">left adjoint</a>
</p>

<p>
resp. a fully faithful right adjoint
