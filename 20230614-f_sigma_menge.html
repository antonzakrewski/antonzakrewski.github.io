<span id="ID-7a904f2e-2ec3-418e-a97c-9654839a7554"></span><h1 class="title">F-Sigma Menge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $A \subseteq X$.
Dann ist $A$ eine F-Sigma <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>, falls <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">abzählbar</a> viele, <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">abgeschlossene</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> $A_i$ existieren mit
</p>

<div class="math-block">\begin{align*}
A = \bigcup_{i = 1}^{\mathbb{N}} A_i 
\end{align*}</div>
