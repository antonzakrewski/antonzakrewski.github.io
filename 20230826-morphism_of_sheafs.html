<span id="ID-47f39e2b-dfcb-414c-aeaf-ac8479b0ea2f"></span><h1 class="title">morphism of sheaves</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $\mathcal{V}$ a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $\mathcal{F}, \mathcal{G}$ a <a href="20230818-v_valued_presheaf.html#ID-0b3df3a6-6fbc-4d13-bce5-3199c201cd8f">V-valued</a> <a href="20230825-sheaf.html#ID-e25c21b0-0380-4bb6-95e6-867026f82aca">sheaf</a> on $X$.
Then a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a> of sheafs $f: \mathcal{F} \rightarrow \mathcal{G}$ is a <a href="20230826-morphism_of_presheafs.html#ID-ed9790a3-3f6c-4ed6-b876-8600f9a86de0">morphism of presheafs</a> $f: \mathcal{F} \rightarrow \mathcal{G}$
</p>
