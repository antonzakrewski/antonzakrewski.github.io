<span id="ID-fb5ac3e6-1002-470c-9e77-c91fa0cc9efc"></span><h1 class="title">n-th component functor of chain complexes as exact functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>
Then the <a href="20240123-n_th_component_functor_of_chain_complexes.html#ID-4a67c8de-368c-48be-9dca-abff5453583e">n-th component functor of chain complexes</a> is an <a href="20230726-exact_functor.html#ID-9541d8fb-ddba-43d6-941a-32b3b3bd7086">exact functor</a>
</p>
