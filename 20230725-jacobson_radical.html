<span id="ID-7ee4f832-79a1-47c6-9602-c636a3ba8daa"></span><h1 class="title">Jacobson radical</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>
Then the jacobson radical $\mathcal{J}_A$ is defined as <a href="20230317161158-allgemeiner_schnitt.html#ID-d7547939-8d3f-48f8-b2fd-cfb5734ae78f">intersection</a> of (left-)maximal ideals
</p>

<div class="math-block">\begin{align*}
\mathcal{J}_A = \bigcap_{\mathfrak{m} \in \mathrm{Spec}_{\mathrm{max}}(A)} \mathfrak{m}
\end{align*}</div>
