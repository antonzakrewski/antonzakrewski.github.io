<span id="ID-f84495eb-c5b2-4e1c-aea1-f695f2de9dcd"></span><h1 class="title">finiteness of homotopy groups of spheres</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $S^n$ be the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">n-sphere</a>

</p>
