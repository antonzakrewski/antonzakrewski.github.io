<span id="ID-f168e64c-10ea-4dde-b86a-75dfc1e0e190"></span><h1 class="title">solvable group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $G$ is said to be solvable, if for the <a href="20230808-derived_series.html#ID-6223de29-c290-4e70-941f-3a8ae8b7f86c">derived series</a> it holds:
</p>

<div class="math-block">\begin{align*}
1 \triangleleft G^{(n)} \triangleleft G^{(n-1)} \triangleleft... \triangleleft G^{(1)} \triangleleft G^{(0)} = G
\end{align*}</div>
