<span id="ID-95f02d36-c116-4f88-8fe6-9f08a8e08097"></span><h1 class="title">topology associated to a pretopology</h1>

<h2 id="definition-proposition">Definition / Proposition</h2>
<p>
Let $\pi$ be a <a href="20231218-grothendieck_pretopology.html#ID-77f10376-a2b2-4a9f-afe0-c208cf5894c0">Grothendieck pretopology</a> on $\mathcal{C}$.
Then the <a href="20230923-grothendieck_topology.html#ID-f8aa1670-d596-4a50-ab33-df3ec728f680">grothendieck topology</a> associated to $\pi$ is the <a href="20260720-coarser_grothendieck_topology.html#ID-d0217d6b-9bb6-4bca-b00b-e2a2abcfb8ae">coarsest grothendieck topology</a> such that for whicch $\pi$-covering families generate covering sieves.
</p>
