<span id="ID-8c4522dc-7da5-40f7-9ba7-54cc0e1a60a9"></span><h1 class="title">Partition of a set</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $Y$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>, dann ist eine Partition von $Y$ gegeben durch <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmengen</a> $Y_i \subseteq Y$ für $i \in I$ welche
</p>
<ol>
<li>paarweise <a href="20211226220255-disjunkte_mengen.html#ID-2000e1f4-7e9e-45f9-91ed-16ded8a15190">disjunkt</a> sind, d.h. für $i\neq j$ gilt $Y_i \cap Y_j = \emptyset$</li>

<li>$\bigcup_{i \in I} Y_i$   </li>
</ol>
