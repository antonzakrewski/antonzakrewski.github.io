<span id="ID-938f13bc-a51e-4670-b154-237bbe237b42"></span><h1 class="title">transcendence degree</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A \subseteq B\) be <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">integral domains</a> with <a href="20230603-universal_property_of_a_quotient_field.html#ID-cd4c145d-0938-4732-9bde-52806452ab2a">quotient fields</a> $Q(A), Q(B)$.
Then the transcendence degree of $B$ over $A$ is defined as maximal <a href="20211227215415-machtigkeit_menge.html#ID-a53ec5a2-0adb-4575-bf21-e3ac15eff75f">cardinality</a> of an <a href="20230725-algebraically_independent.html#ID-2d9f2ebd-c68a-4b8e-a59f-4a5d4f6656d9">algebraically independent</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>
</p>
