<span id="ID-4e2d20d6-753e-42d2-b481-7a12ec9769bf"></span><h1 class="title">split idempotent 1-morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $e: A \rightarrow B \in \mathcal{C}$ a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a>.
Then $e$ is said to be split idempotent if there exists <a href="20240327-retract_of_a_morphism.html#ID-e679bfdc-8c9e-43a7-85ed-665dcd22f1d6">retract of</a> $e$ with $\mathrm{id}: B \rightarrow B$ for an <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $B$, i.e. a commutative diagram
</p>
