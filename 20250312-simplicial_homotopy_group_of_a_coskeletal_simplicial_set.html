<span id="ID-e8be5b14-3213-4b58-a220-7a156af88055"></span><h1 class="title">simplicial homotopy group of a coskeletal simplicial set</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be an <a href="20250311-coskeletal_simplicial_set.html#ID-998a9022-f680-475f-8c23-b3d9b18bb838">n-coskeletal simplicial set</a>.
Then the <a href="20240506-homotopy_group_of_kan.html#ID-1f7ff4f8-7081-4ce6-b114-76bacebba05f">simplicial homotopy groups</a> are trivial for $k &gt; n$
</p>

<div class="math-block">\begin{align*}
\pi_k(X,x) = 0
\end{align*}</div>
