<span id="ID-561a98bd-c7aa-4bf5-bf2f-43521eb17c78"></span><h1 class="title">infinity epimorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>, $f: x \rightarrow y$ a morphism.
Then $f$ is said to be an epimorphism, if it induces a <a href="20250331-infinity_monomorphism.html#ID-8e516328-9c65-4ed3-b459-4751009c7c2a">infinity monomorphism</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{map}_{\mathcal{C}}(-,x) \rightarrow \mathrm{map}_{\mathcal{C}}(-,y) 
\end{align*}</div>
