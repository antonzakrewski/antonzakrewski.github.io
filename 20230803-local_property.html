<span id="ID-f4230f8a-704b-4781-874b-1fdcaf46c1cb"></span><h1 class="title">prime local property of a ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\Pi$ be a property of a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> $A$
Then $\Pi$ is said to be a local property
</p>

<p>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$A$ has the property $\Pi$</li>

<li>for each <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a> $\mathfrak{p}$, the <a href="20230811-localization_at_a_prime_ideal.html#ID-3ea2a099-8f1a-4085-abd1-446a0290dbce">localization at a prime ideal</a> $A_{\mathfrak{p}}$ has the property $\Pi$</li>
</ol>
