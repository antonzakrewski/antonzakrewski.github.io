<span id="ID-0bb6c5b2-6788-4e28-9e2c-7e2d7492b57a"></span><h1 class="title">strict monoidal category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> equipped with a <a href="20231201-monoidal_structure.html#ID-8154212c-03a1-4e66-bb02-e77906bb67d8">monoidal structure</a>.
then $\mathcal{C}$ is said to be a strict monoidal category, if the monoidal structure is a <a href="20231201-strict_monoidal_structure.html#ID-f6f10c94-ac2e-473f-8edf-53c2e2c2772d">strict monoidal structure</a>
</p>
