<span id="ID-8672ae2c-65d1-462e-80b3-debf3fc9841d"></span><h1 class="title">Functor preserving pullbacks</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $\mathcal{F}$ is said to preserve pushouts, if every <a href="20230806-pullback.html#ID-730c4312-492d-4b9c-a347-9281309d3e6f">pullback</a> $P$ is <a href="20231015-preserved_pullback.html#ID-8ba2d4ec-46c6-42ef-a160-bac72d2ae99d">preserved</a> under $\mathcal{F}$
</p>
