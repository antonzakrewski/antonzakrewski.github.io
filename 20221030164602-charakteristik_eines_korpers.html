<span id="ID-857e2abc-6f76-404f-bf65-6822c05d6bd3"></span><h1 class="title">Characteristic</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> und $\varphi: \mathbb{Z} \rightarrow R$ der kanonische <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">Ringhomomorphismus</a> mit $\varphi(1) = 1_R$.
Dann ist die charakteristik $\mathrm{char}(R) \in \mathbb{N}_0$ von $R$ definiert als <a href="20230722-erzeugendensystem_eines_ideals.html#ID-8fefc2d7-34d4-4591-91cc-67ebfdffb814">Erzeuger</a> des <a href="20221111200152-kern_algebra.html#ID-438e68de-0603-419c-8b21-5cb3b4add3a1">Kerns</a> als <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">Ideal</a> definiert
</p>
