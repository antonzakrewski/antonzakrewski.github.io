<span id="ID-1b42f7c2-5f2c-41e9-8725-51a66b857826"></span><h1 class="title">reflection of a sphere</h1>

<h2 id="definition">Definition</h2>
<p>
Given the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">n-sphere</a>, the \(k\)-th reflection for $k \in \{1,...,n+1\}$ is defined as <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
</p>

<div class="math-block">\begin{align*}
r_{k}: S^n \rightarrow&amp; S^n \\
(s_1,...,s_k,...,s_{n+1}) \mapsto&amp; (s_1,...,-s_k,...,s_{n+1})
\end{align*}</div>
