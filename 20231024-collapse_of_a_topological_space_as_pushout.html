<span id="ID-f1effa48-0089-4613-8c57-933e624106b1"></span><h1 class="title">collapse of a topological space as pushout</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $A \subseteq X$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> with the <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace topology</a>.
Then the <a href="20230604-kollaps_eines_topologischen_raums.html#ID-a6c84a23-6bfe-4089-b94e-bae9c0cf25a9">collapse</a> $X/A$ is a <a href="20230806-pushforward.html#ID-a4141d87-68ee-4337-8f80-997a6d4b4091">pushout</a>
</p>
