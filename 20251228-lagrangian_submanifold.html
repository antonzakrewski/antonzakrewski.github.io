<span id="ID-c2dc4298-0fd9-4874-889b-28aa3c0ce6f5"></span><h1 class="title">lagrangian submanifold</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M,\omega)$ be a <a href="20230907-symplektische_mannigfaltigkeit.html#ID-888018cd-b63e-4fe7-a14e-2af7ab8c2385">symplectic manifold</a>
Then a lagrangian is a <a href="20230724-untermannigfaltigkeit.html#ID-4cbfea3f-6f77-453a-b018-e39f14e31af2">submanifold</a> which is both <a href="20251228-isotropic_submanifold.html#ID-cb9c2664-81ce-4cfc-91e4-73f56d0e00c4">isotropic submanifold</a> and <a href="20251228-coisotropic_submanifold.html#ID-f97503de-2404-4a98-ae35-0961f473889f">coisotropic submanifold</a>
</p>
