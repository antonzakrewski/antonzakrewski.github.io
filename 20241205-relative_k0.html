<span id="ID-18676acc-b66f-4b79-9163-9d911f0b0d32"></span><h1 class="title">relative k0</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $\mathfrak{a}$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>
Then the relative K0 group is defined as
</p>

<div class="math-block">\begin{align*}
K_0(R,\mathfrak{a}) = \{\mathrm{ker}(\pi_1)_* K(R \times_{R/\mathfrak{a}} R) \rightarrow K_0(R)\}
\end{align*}</div>
