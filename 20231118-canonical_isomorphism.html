<span id="ID-4b7d0d2f-2843-4201-8c6e-75a150670f52"></span><h1 class="title">canonical isomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $A,B \in \mathrm{Ob}(\mathcal{C})$ <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a>.
</p>

<p>
Then a canonical isomorphism is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> , arising naturally without arbitrary choice from some <a href="20230404185319-universal_property.html#ID-97334d2a-9fb2-4542-9d53-144c4f4cb4d6">universal property</a>
</p>
