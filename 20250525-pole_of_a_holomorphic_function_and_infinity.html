<span id="ID-9325e9a4-5470-4263-91b4-b9f34d2785d8"></span><h1 class="title">pole of a holomorphic function and infinity</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\Omega \subseteq \mathbb{C}$ be <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a>, $z_0\in \Omega$ and $f: \Omega \setminus \{z_0\} \rightarrow \mathbb{C}$ be <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic</a>.
Then $f$ has a pole at $z_0$ <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> $\vert f(z) \vert \rightarrow \infty$
</p>
