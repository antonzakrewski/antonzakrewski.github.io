<span id="ID-fd31d400-7b29-40ec-a165-79fb4638be9c"></span><h1 class="title">R-local equivalence for a spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a> and $f: X \rightarrow Y$ a map between <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>
Then $f$ is said to be an \(R\)-local equivalence if $R_*(f)$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> on homology
</p>
