<span id="ID-f612e43a-118a-4f54-b17f-7caca5e0a44c"></span><h1 class="title">abelian group object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> with <a href="20250307-finite_infinity_products.html#ID-deea3950-a8f7-486d-88c3-19a27fd48f05">finite infinity products</a>.
Then an abelian group object is an <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">infinity functor</a>
</p>

<div class="math-block">\begin{align*}
N(\mathrm{FinFreeZ-Mod})^{\mathrm{op}} \rightarrow \mathcal{C}
\end{align*}</div>
<p>
which <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves finite limits</a>
</p>
