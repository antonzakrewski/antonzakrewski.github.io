<span id="ID-e2f41732-b263-4cdb-b079-6a4cc5f500da"></span><h1 class="title">going up property of topological spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: Y \rightarrow X$ be a map of <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
Then $f$ is said to have the going-up property, if for every $y \in Y$ and every <a href="20230822-specialization_of_a_point.html#ID-7e9ebeb7-9a5d-4434-8a75-62d48385341d">specialization</a> $f(y) \leadsto x'$, there exists a specialization $y \leadsto y'$ with $f(y') = x'$.
</p>
