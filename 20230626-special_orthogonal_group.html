<span id="ID-01d50177-e754-49cd-b5c6-0286c572311e"></span><h1 class="title">Special orthogonal group</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a>, dann ist die Special Linear Group definiert als
</p>

<div class="math-block">\begin{align*}
\mathrm{SO}_{n}(K) = \{A \in K^{n \times n} \vert \det(A) = \pm 1\}
\end{align*}</div>
