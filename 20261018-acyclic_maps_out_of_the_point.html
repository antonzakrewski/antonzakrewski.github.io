<span id="ID-9cd935de-957d-47f0-9b7c-63a8b6b5c913"></span><h1 class="title">acyclic maps out of the point are trivial</h1>

<h2 id="proposition">Proposition</h2>
<p>
The only <a href="20250425-acyclic_map_between_spaces.html#ID-f4e36710-8925-4856-9968-b0ca0484121b">acyclic</a> map $f: * \rightarrow X$ is given by the <a href="20220817165031-identitatsmorphismus.html#ID-18d8207c-a2f4-499b-ab59-b7efe4858e31">identity morphism</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Observe that $X$ is <a href="20250310-simply_connected_anima.html#ID-61761264-9731-42f7-80ef-72f6247f6ea7">simply connected</a> (cf. <a href="20250604-acyclic_map_as_surjection_on_pi_1_with_perfect_kernel.html#ID-7a6ae324-94fa-4750-8902-71544f9e6df9">acyclic map as surjection on pi_1 with perfect kernel</a>) and an <a href="20251009-homology_is_left_adjoint.html#ID-5b3f02bc-8681-4fa5-a4eb-ce9365892cd6">homology</a> <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> .
</p>
