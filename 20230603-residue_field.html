<h2 id="defintion">Defintion</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $\mathfrak{m}$ a <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a>.
</p>

<p>
Then the residue field is the <a href="20230603-universal_property_of_a_quotient_field.html#ID-cd4c145d-0938-4732-9bde-52806452ab2a">quotient field</a>
</p>

<div class="math-block">\begin{align*}

\end{align*}</div>
