<span id="ID-be5ffda1-8696-4a06-988e-294ce15de6e1"></span><h1 class="title">Homeomorphie impliziert lokale Homeomorphie</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $(X, \mathcal{T})$ und $(X', \mathcal{T}')$ <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räume</a> und $f: X \rightarrow X'$ ein <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">Homeomorphismus</a>.
Dann ist $X$ <a href="20230601074735-lokal_homeomorph.html#ID-131f523a-aa28-4f22-bcde-ce172f7f8edb">lokal homeomorph</a> zu $X'$.
</p>

<h2 id="beweis">Beweis</h2>
<p>
Folgt, indem man für $x \in X$ eine beliebige <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebung</a> - z.B. $X$ - wählt.
</p>
