<span id="ID-13de1873-c1d2-4ca6-82f9-905e82eb8c15"></span><h1 class="title">domain of a rational function</h1>

<h2 id="definition">Definition</h2>
<p>
Let $F$ be an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a> <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $V,W$ <a href="20230313162316-affine_varietat.html#ID-d401938b-d6e1-4d50-a84a-73eb4e945380">affine varieties</a> and
</p>

<div class="math-block">\begin{align*}
f: V \rightarrow W
\end{align*}</div>
<p>
a <a href="20230909-rational_function.html#ID-3433e32e-b522-4427-8b11-a3ae6fc0b622">rational function</a>.
</p>

<p>
Then the domain of $f$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{dom}(f) = \bigcup_{(U,f)} U
\end{align*}</div>
