<span id="ID-fb0a05af-af7a-4864-b37e-6e0635bb1588"></span><h1 class="title">rank of a module (dimension)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M$ an \(R\)-module and $k$ an <a href="20260714-r_field.html#ID-2dce005c-122e-49ca-9289-a45ce7e59bdf">R-field</a>.
Then the rank of $M$ is defined as $\mathrm{dim}(M \otimes_R k)$
</p>
