<span id="ID-e203bf2d-80a3-426b-9848-22238f663aae"></span><h1 class="title">Charakteristische Untergruppe</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $G$ eine <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> und $H \leq G$ eine <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">Untergruppe</a>.
$H$ ist eine charakteristische Untergruppe, falls für jeden <a href="20220928135903-gruppenautomorphismus.html#ID-bde82a42-2a52-4890-a477-dc738b045a46">Gruppenautomorphismus</a> $f: G \rightarrow G$ gilt:
</p>

<div class="math-block">\begin{align*}
f[H] \subseteq H
\end{align*}</div>
