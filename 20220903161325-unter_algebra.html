<span id="ID-cffec4b9-aadc-4da2-9db2-41f36dd2fe1b"></span><h1 class="title">A-subalgebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $B$ an <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">A-Algebra</a> for $\iota: A \rightarrow B$.
Then a subalgebra is defined as <a href="20230227130935-unterring.html#ID-157d533b-1650-499e-be1d-341b1fa8fa15">subring</a> $B' \hookrightarrow B$ such that
</p>

<div class="math-block">\begin{align*}
\iota[A] \subseteq B'
\end{align*}</div>
