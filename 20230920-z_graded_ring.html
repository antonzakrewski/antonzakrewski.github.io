<span id="ID-4ea98b68-3467-4060-a39a-78ebb40f5648"></span><h1 class="title">ℤ-graded Ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $R$ is said to be \(\mathbb{Z}\)-graded, if there exists a decomposition
</p>

<div class="math-block">\begin{align*}
S = \bigoplus_{n \in \mathbb{Z}_0} S_n
\end{align*}</div>
<p>
such that for $n,m \in \mathbb{Z}$ it holds, that
</p>

<div class="math-block">\begin{align*}
S_n \cdot S_d = S_{n + d}
\end{align*}</div>
