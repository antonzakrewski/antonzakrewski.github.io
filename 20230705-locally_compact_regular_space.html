<span id="ID-f89f4ba5-4eb9-448b-bf35-da8e5aeaa963"></span><h1 class="title">locally regular compact Space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
</p>

<p>
Then $X$ is said to be locally regular compact, if for each $x \in X$ and <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $U \subseteq X$, there exists a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $K$ of $X$
</p>
