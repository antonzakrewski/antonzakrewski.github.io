<span id="ID-603c409f-4fc6-43bd-96d3-2406e175ac2b"></span><h1 class="title">well-ordered set has only finite descending sequence</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20220929195946-wohlordnung.html#ID-8f3e284b-c3c9-4aaf-8bf5-5eadc47faa78">Well Order</a>, then any strictly descending sequence $x_n$ is <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $\{x_n \vert n \in \mathbb{N}\}$, then it has a minimum $x_m$.
In particular, it has to be finite.
</p>
