<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed category</a> and
A functor
</p>

<div class="math-block">\begin{align*}
\mathcal{F}: \mathrm{Cat}_{\infty}^{\mathrm{st}} \rightarrow \mathcal{C}
\end{align*}</div>


<p>
Then $\mathcal{F}$ is called a verdier localization if it maps <a href="20250204-verdier_sequence.html#ID-bce7b93f-5431-42a7-8f1c-6ff324627bc3">verdier sequences</a> to <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber</a> sequences
</p>
