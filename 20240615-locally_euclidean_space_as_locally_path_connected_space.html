<span id="ID-63fb4d29-3e67-4e58-a210-d1dc78258f63"></span><h1 class="title">locally euclidean space is locally path connected space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20231017-locally_euclidean.html#ID-61ff6b6a-4957-4dc3-a94b-247e3a79b8ee">locally euclidean</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
Then $X$ is <a href="20230308142220-lokal_wegzusammenhangend.html#ID-440c77bf-ffb1-45dc-92a4-b1fd98e19cb1">locally path connected</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $x \in X$ be a point.
Choose a chart $U \cong \mathbb{R}^n$.
Then $U$ suffices as path connected <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a>
</p>
