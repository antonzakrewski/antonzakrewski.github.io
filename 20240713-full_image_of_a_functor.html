<span id="ID-aea681f7-4e6d-4c8c-88f4-b689f91519cd"></span><h1 class="title">full image of a functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a>, $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then the full image of $\mathcal{F}$ is defined as <a href="20220824221623-unterkategorie.html#ID-2165c92b-8025-4134-b3b1-4d523a8795a4">subcategory</a> of $\mathcal{D}$ generated by the <a href="20230402194515-image_of_a_functor.html#ID-70ce7618-7873-4fc4-a139-a84fcda6d996">Image of a functor</a>.
</p>
