<span id="ID-c1e315df-a333-4b7f-9663-a5b9f2f19201"></span><h1 class="title">base change preserves locally finite type algebraic functors</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\varphi: k \rightarrow k'$ be a <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a> between <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative rings</a>.
Then the <a href="20260715-base_change_for_a_ring_map.html#ID-8106baba-6105-4b78-82c4-07c6953e5ee3">base change functor</a> along $\varphi$ preserves <a href="20260714-algebraic_functor_locally_of_finite_type.html#ID-eef10d23-0814-4b43-b551-ba3610f32b8f">algebraic functor locally of finite type</a>.
</p>
