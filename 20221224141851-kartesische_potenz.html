<span id="ID-b0b8eeb6-abc0-45f0-a270-34c4d7912c3d"></span><h1 class="title">kartesische Potenz</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und $I$ eine <a href="20221009193146-indexmenge.html#ID-e6a8afd0-169d-4286-9d21-d170d12af180">Indexmenge</a>, welche auf $M$ abbildet.
Die kartesische Potenz von $M$ mit $I$ ist dann das <a href="20221224141628-allgemeine_kartesische_produkt.html#ID-1fa0c762-e1d2-4ee7-8212-15395a725dd9">allgemeine kartesische Produkt</a>
</p>

<div class="math-block">\begin{align*}
M^I  \coloneqq \prod_{i \in I}^{} M
\end{align*}</div>
