<span id="ID-a06cf3c6-3bed-4dd9-bc26-3028bbaa86aa"></span><h1 class="title">splitting of an idempotent</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $f: X \rightarrow X$ a <a href="20240216-idempotent_morphism.html#ID-5aee0c75-377b-4bdb-939e-b54bf662cf66">idempotent morphism</a>.
Then $f$ is said to split, if it is the composite of a <a href="20231210-retract_category_theory.html#ID-3e3a3171-127b-4439-a0e1-224a54c26b78">retract</a> followed by its <a href="20230818-section_presheaf.html#ID-b721bbf8-7d5b-47a4-b6b1-24f9315227c4">section</a>
</p>
