<span id="ID-e9c09e86-27d9-4eb4-b996-a8e12f3f15e8"></span><h1 class="title">kappa filtered colimit and order of cardinals</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\kappa, \kappa'$ be <a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinals</a> with $\kappa &lt; \kappa'$.
Then a $\kappa'$ <a href="kappa-filtered-colimit.html#ID-4435e491-8d1a-4889-b240-19a69d781978">filtered colimit</a> is a $\kappa'$ filtered colimit.
</p>
