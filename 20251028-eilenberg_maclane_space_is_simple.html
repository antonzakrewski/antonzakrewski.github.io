<span id="ID-a2c7ef1c-508e-4ea7-bca6-b00a9575d338"></span><h1 class="title">eilenberg-maclane space is simple</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any <a href="20240417-eilenberg_maclane_space.html#ID-ea371170-ec9b-4f59-afe5-4dc951855bb3">Eilenberg-MacLane space</a> $K(A,n)$ is a <a href="20250526-simple_anima.html#ID-9ec1c341-1d6b-4f81-af4d-73f93b582663">simple anima</a>
</p>

<h2 id="proof">Proof</h2>

<h3 id="n-1">$n = 1$</h3>
<p>
follows as $\pi_1(K(A,n)) = A$ hence abelian
then use <a href="20251027-simple_anima_has_abelian_fundamental_group.html#ID-58ad5d87-d38e-485f-8a7f-38a8473b8fc9">simple anima has abelian fundamental group</a>
</p>

<h3 id="n-1">$n &gt; 1$</h3>
<p>
then it is <a href="20250310-simply_connected_anima.html#ID-61761264-9731-42f7-80ef-72f6247f6ea7">simply connected anima</a>
</p>
