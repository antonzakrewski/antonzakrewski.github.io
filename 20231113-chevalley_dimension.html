<span id="ID-1edd2817-02d6-4d37-8d4a-a460b249a8ef"></span><h1 class="title">chevalley dimension</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then the chevalley dimension is defined as smallest <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinal</a>, such that there exists a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> $S \subseteq A$, that the <a href="20230722-erzeugendensystem_eines_ideals.html#ID-8fefc2d7-34d4-4591-91cc-67ebfdffb814">generated Ideal</a> is <a href="20231109-primary_ideal.html#ID-31c88ba2-9577-4b73-b19a-364e0e7b01c9">primary</a>
</p>
