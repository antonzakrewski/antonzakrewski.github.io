<span id="ID-ebccfd45-6c4b-4a93-818a-8f6848600874"></span><h1 class="title">Monoid</h1>

<h2 id="definition">Definition</h2>
<p>
Ein Monoid ist eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">menge</a> $M$ mit einer <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfung</a> $\cdot: M \times M \rightarrow M$, so dass ein <a href="20210702074906-neutrales_element_mathe.html#ID-2a95aac8-42e6-4724-9f37-15f6143a35ca">neutrales Element</a> $1$ existiert, d.h.
</p>

<div class="math-block">\begin{align*}
\forall m \in M : 1 \cdot m = m \cdot 1 = m
\end{align*}</div>

<p>
"Gruppe ohne der Forderung, dass inverse existieren"
</p>
