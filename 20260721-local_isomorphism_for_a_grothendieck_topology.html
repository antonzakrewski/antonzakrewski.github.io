<span id="ID-6c4f2bfa-3265-4774-97e8-2c36451eb66f"></span><h1 class="title">local isomorphism for a grothendieck topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(\mathcal{C}, \tau)$ be a <a href="20230923-grothendieck_topology.html#ID-f8aa1670-d596-4a50-ab33-df3ec728f680">grothendieck topology</a>.
Then a map $f: X \rightarrow Y$ is a local isomorphism, if it s both a <a href="20260721-local_monomorphism_for_a_grothendieck_topology.html#ID-49f84e9f-0170-4453-9bcf-34e381780253">local monomorphism</a> and a <a href="20260721-local_epimorphism_for_a_grothendieck_topology.html#ID-e2ff9a61-37fa-4ef0-a484-9174ee4b31a1">local epimorphism</a>.
</p>
