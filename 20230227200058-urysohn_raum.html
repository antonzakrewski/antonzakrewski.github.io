<span id="ID-5d878903-e31d-464b-8e00-d881866a05c6"></span><h1 class="title">Urysohn Raum</h1>

<h2 id="definition">Definition</h2>
<p>
Ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> $(X, \mathcal{T})$ ist ein Urysohn Raum, falls für $x,y \in X$, $x \neq y$ (<a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">abgeschlossene</a>) <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebungen</a> $U_x, U_y$ existieren mit:
</p>

<div class="math-block">\begin{align*}
\overline{U_x} \cap \overline{U_y} = \emptyset
\end{align*}</div>
