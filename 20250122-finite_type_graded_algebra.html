<span id="ID-e95fcccd-2bf7-4836-a66f-478442cd04ad"></span><h1 class="title">finite type graded-Algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a> and $R = \bigoplus_{m \in m} R_m$ a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a>, $A = \bigoplus_{m \in M} R_m$ a <a href="20240528-graded_r_algebra.html#ID-c9a02bbf-f09d-4d7f-88e3-7a37c2f6dc92">graded R-algebra</a>.
Then $A$ is said to be a finite type graded Algebra, if each $A_m$ is a <a href="20230731-finitely_generated_a_algebra.html#ID-20861333-797d-4ab1-9ad5-375661f357fc">finite type</a>  $R_0$-Algebra
</p>
