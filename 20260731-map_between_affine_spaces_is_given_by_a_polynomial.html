<span id="ID-b98a1cba-f44d-4759-b6bc-3ca1767ba45e"></span><h1 class="title">map between affine spaces is given by a polynomial</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: \mathbb{A}_k^I \rightarrow \mathbb{A}_k^J$ be a map of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Then it is equivalently given by $I$ many polynomials in $J$ variables.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20241017-infinity_yoneda_lemma.html#ID-4941e6c7-72ea-47ae-a7ba-310e1ed582f9">yoneda argument</a>
</p>
