<span id="ID-5413acf2-40d6-4d73-9e6c-9fb2cbd9303a"></span><h1 class="title">Euler-Mascheroni-Konstante</h1>

<h2 id="definition">Definition</h2>
<p>
Die Euler-Mascheroni-Konstante ist definiert als:
</p>

<div class="math-block">\begin{align*}
\gamma =&amp; 1 - \sum_{k \geq 2}^{}  \frac{1}{k} (\mathcal{S}(k) - 1) \\
\approx 0.577
\end{align*}</div>
<p>
mit $\mathcal{S}(k) = \sum_{i \geq 1} \frac{1}{i^k}$
</p>
