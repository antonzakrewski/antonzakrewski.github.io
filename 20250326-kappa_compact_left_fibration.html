<span id="ID-1a8f01aa-0654-4602-9999-d32eb7975877"></span><h1 class="title">kappa compact left fibration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\overline{\mathcal{C}} \rightarrow \mathcal{C}$ be a <a href="20240327-left_fibration.html#ID-bdbcb3cc-0793-4a96-9303-7f78702f03fb">left fibration</a>.
Then $\overline{\mathcal{C}}$ is said to be \(\kappa\)-compact, if the <a href="20241126-straightening_functor_of_left_fibrations.html#ID-96cbd41a-4208-43c6-a076-1116647d60c6">starightened</a> version is <a href="20241021-kappa_continuous_infinity_functor.html#ID-7737a786-1520-4472-a42c-071945644b98">kappa continuous infinity functor</a>
</p>
