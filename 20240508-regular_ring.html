<span id="ID-ffeea81e-b303-4ac7-a799-8f0032298873"></span><h1 class="title">weakly regular ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian ring</a>.
Then $R$ is said to be regular, if each <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a> \(R\)-module admits a <a href="20240225-finite_resolution_of_a_module.html#ID-6b2e5bdb-265e-4775-87b5-11eebc56d825">finite</a>  <a href="20231212-projective_resolution.html#ID-0d6124f2-59f2-4f96-838a-e8b023821bc6">projective resolution</a> consisting of <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a> modules.
</p>
