<h2 id="satz">Satz</h2>
<p>
Seien $X,Y$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a>, $f: X \rightarrow Y$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> und $Y_i$ ein e <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a>von <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmengen</a> von $Y$
Dann gilt:
</p>

<div class="math-block">\begin{align*}
f^{-1}[\bigcup_{i \in I} Y_i] = \bigcup_{i \in I} f^{-1}[Y_i]
\end{align*}</div>
