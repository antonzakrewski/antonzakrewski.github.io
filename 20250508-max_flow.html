<h2 id="definition">Definition</h2>
<p>
Let $N$ be a <a href="20250508-network_graph.html#ID-b0096be3-39ac-43e4-bf2c-900b52d5f5de">network</a>.
The max flow is defined as <a href="20220718133117-supremum.html#ID-0694ad6d-ce06-4c52-9f5c-29b040425dd1">Supremum</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{max-flow}(N) \coloneqq \mathrm{sup}( \mathrm{val}(f) \vert f \in \mathrm{flows})
\end{align*}</div>
