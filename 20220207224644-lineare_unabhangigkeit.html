<span id="ID-c4d1496f-6012-4ade-8b98-3e29dad89ded"></span><h1 class="title">linearly independent</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M$ a \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and $S \subseteq M$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>.
Then $S$ is linearly independent, if for a <a href="20220107122959-linearkombination.html#ID-5c5d77fa-325c-4762-9327-9000a960ed88">linear combination</a> with $r_i \in R, m_i \in S$
</p>

<div class="math-block">\begin{align*}
\sum_{i=1}^{n} r_i m_i = 0 \Rightarrow r_i = 0
\end{align*}</div>
