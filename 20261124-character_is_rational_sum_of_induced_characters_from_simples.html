<span id="ID-940c20ee-6438-4f15-97cc-cf87cc69c51e"></span><h1 class="title">character is rational sum of induced characters from simples</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $\chi$ a <a href="20261021-character_of_a_finite_dimensional_representation.html#ID-a90819b6-3e3e-4d23-b247-e3e202b62fcb">character</a>
Then every characetr of $G$ is a rational sum of characters induced from <a href="20230127191852-zyklische_gruppe.html#ID-dce4ae88-c1e1-4fcc-aa58-ea917d0e197f">cyclic subgroup</a>
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of <a href="20261124-artins_theorem.html#ID-a5d1ef63-4607-4d9e-ba9c-5b6158933a8f">artins theorem</a>
</p>
