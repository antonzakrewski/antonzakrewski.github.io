<span id="ID-be13285d-1d09-4f27-b6fb-3accb44ee5ea"></span><h1 class="title">essentially constant functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $\mathcal{F}$ is said to be essentially constant, if $\mathcal{F}$ is <a href="20230404122456-natural_isomorphism.html#ID-0977f626-bc15-4197-93bd-092d014c8270">naturally isomorphic</a> to a <a href="20220830195220-constant_functor.html#ID-4ff6affe-14a3-4ed7-a0e3-1837838e8409">constant functor</a>
</p>
