<span id="ID-ea1892d9-b5a5-4374-98a1-5657f6181038"></span><h1 class="title">continuous functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $F: \mathcal{C} \rightarrow \mathcal{D}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $F$ is said to be continuous, if $F$ <a href="20230811-preserved_limit.html#ID-d066f140-543f-4d14-a7ad-bc500399e821">preserves limits</a>
</p>
