<span id="ID-c2692cc4-543f-4470-bc47-e6046721f8e5"></span><h1 class="title">Linksdistributivgesetz</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> mit den dazugehörigen <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfungen</a> $+$ und $\cdot$.
Das Rechtsdistributivgesetzt ist dann folgendermaßen deifniert
</p>

<div class="math-block">\begin{align*}
\forall a\forall b\forall c(a \cdot  (b + c) = a \cdot b +  a \cdot c)
\end{align*}</div>
