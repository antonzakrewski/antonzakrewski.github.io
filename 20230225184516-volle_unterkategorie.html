<span id="ID-02c96fc8-ac4f-42b6-804d-bc08d25bfb2a"></span><h1 class="title">full subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20220824221623-unterkategorie.html#ID-2165c92b-8025-4134-b3b1-4d523a8795a4">subcategory</a> $\mathcal{D}$ of a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> $\mathcal{C}$ is full, if for all <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> $A,B \in \mathrm{Ob}(\mathcal{D})$ following statement holds true:
</p>

<div class="math-block">\begin{align*}
\mathrm{Hom}_{\mathcal{D}}(A, B) = \mathrm{Hom}_{\mathcal{C}}(A, B)
\end{align*}</div>
