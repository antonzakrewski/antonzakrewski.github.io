<span id="ID-3e1736cf-ec12-4f3b-96d9-dc7a3f6ce24f"></span><h1 class="title">bounded continuous functions into a c star algebra is a c star algebra</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $A$ a <a href="20261022-c_star_algebra.html#ID-6d7e5583-c3c1-4165-b589-78e1d42c0420">C star algebra</a>
Then the set of boundde <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">functions</a>  $C_b(X,\mathcal{A})$ is a 8 star algebra with the <a href="20230110111654-supremumsnorm.html#ID-4e52ce2f-dff5-4404-ad69-4b1f6dcf95cc">Supremumsnorm</a> and the pointwise star operation.
</p>
