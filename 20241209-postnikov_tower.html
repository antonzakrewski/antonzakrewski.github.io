<span id="ID-7a8649fb-3de9-4533-b6b0-ce5b3f53fcca"></span><h1 class="title">Postnikov tower of an anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20230308142110-wegzusammenhangender_raum_topologie.html#ID-09b1d548-9ac2-461c-8b3e-f72097f54a99">pathconnected</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">space</a>.
Then the Postnikov tower of $X$ is defined as <a href="20241209-moore_postnikov_tower.html#ID-6a475e04-832c-4056-8859-7bb98df74d05">Moore-Postnikov tower</a> of the <a href="20230404183731-terminal_morphism.html#ID-ad3ab3aa-eac9-4e11-8a03-6a8e703aefdf">terminal morphism</a> $X \rightarrow *$
</p>
