<span id="ID-a9687a43-e4af-4f74-900a-9ac9cf3933b2"></span><h1 class="title">ind-object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20230225165858-lokal_kleine_kategorie.html#ID-29f14fa2-ae57-46d2-8e23-3f2924bc1ebe">locally small</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $\mathcal{F} \in \mathcal{P}(\mathcal{C})$ a <a href="20230603-presheaf_of_sets.html#ID-d49e3c63-1428-4b98-9f00-238ae7770cbf">presheaf</a>.
Then $\mathcal{F}$ is said to be an ind-object, if it is the <a href="20230804-filtered_limit.html#ID-35b9e3f0-b5d0-41c4-94ac-6bd183d66ee3">filtered colimit</a> of <a href="20240102-contravariant_representable_functor.html#ID-cf9f355c-405a-48e1-8bb2-19945b50d430">contravariant representable functors</a>
</p>
