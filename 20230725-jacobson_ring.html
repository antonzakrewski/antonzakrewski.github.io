<span id="ID-b17f8891-8d7b-454c-9c22-773ed8d942e1"></span><h1 class="title">Jacobson ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $A$ is a Jacobson ring, if for all <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideals</a> $\mathfrak{p}$ it holds
</p>

<div class="math-block">\begin{align*}
\mathfrak{p} = \bigcap \{\mathfrak{m} \subseteq A \vert \mathfrak{m} \text{ maximal with }\mathfrak{p} \subseteq \mathfrak{m}\}
\end{align*}</div>
