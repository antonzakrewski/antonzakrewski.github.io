<span id="ID-f9aa3d81-7775-4a9b-a959-5102e2307c64"></span><h1 class="title">nullteilerfreier Ring</h1>

<h2 id="definition">Definition</h2>
<p>
Ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> $R$ ist ein nullteilerfreier Ring, falls $0$ der einzige <a href="20221226125328-nullteiler.html#ID-dc985755-3df5-4b03-929e-659ee65ad000">Nullteiler</a> ist.
</p>

<p>
Im gegensatz zu einem <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> wird dabei keine <a href="20210702075801-kommutativgesetz.html#ID-2a5d302a-0c7a-4757-83be-0731dfa75d86">Kommutativität</a> gefordert
</p>
