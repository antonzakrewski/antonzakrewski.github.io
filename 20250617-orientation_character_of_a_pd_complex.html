<span id="ID-b865471e-b12e-4d5f-ae7a-0e5bf2d45bcb"></span><h1 class="title">orientation character of a poincare duality complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20250520-poincare_duality_complex.html#ID-9e35ba28-8260-48ca-869c-531b0374e00d">poincare duality complex</a> of <a href="20250617-dimension_of_a_poincare_duality_complex.html#ID-b0a3eee5-852b-4413-b2a9-8065510c9c4d">dimension</a> $d$.
Then the orientation character is defined as
</p>

<div class="math-block">\begin{align*}
\Sigma^d D_{X}^{\mathbb{Z}}
\end{align*}</div>
<p>
where $D_X^{\mathbb{Z}}$ is the <a href="20250604-r_dualizing_spectrum.html#ID-7c238ade-10a7-4fd9-951e-92371f4bda5b">R-dualizing spectrum</a>
</p>
