<span id="ID-0249ccf2-d05b-4385-993b-196a5a353d50"></span><h1 class="title">projective n-space over a ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, then the projective \(n\)-space over $A$ is defined as <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a>
</p>

<div class="math-block">\begin{align*}
P_A^n = \mathrm{Proj} A[x_0,...,x_n]
\end{align*}</div>

see:
