<span id="ID-776aac1a-1057-4712-ad4f-60ac79aa3f9a"></span><h1 class="title">supremum of ordinals as union</h1>

<h2 id="proposition">Proposition</h2>
<p>
Suppose $A$ is a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of <a href="20230516130028-ordinalzahl.html#ID-f638eb2b-0e4a-40c1-aac6-d3518403288b">ordinals</a>, then it follows for the <a href="20230605-supremum_of_an_ordinal_as_union.html#ID-776aac1a-1057-4712-ad4f-60ac79aa3f9a">supremum</a>:
</p>

<div class="math-block">\begin{align*}
\sup A = \bigcup_{\alpha \in A} \alpha
\end{align*}</div>
