<span id="ID-f57f0bca-7bb2-4ad1-b610-32d83f12ef62"></span><h1 class="title">stiefel whitney class of an orientable PD complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20250310-connected_anima.html#ID-3a5f1513-1e7e-49aa-90e7-a728c310990c">connected</a> <a href="20250520-poincare_duality_complex.html#ID-9e35ba28-8260-48ca-869c-531b0374e00d">poincare duality complex</a> of <a href="20250617-dimension_of_a_poincare_duality_complex.html#ID-b0a3eee5-852b-4413-b2a9-8065510c9c4d">dimension</a> $n$.
Then the stiefel whitney classes of $X$ are defined as <a href="20250513-stiefel_whitney_class.html#ID-e517ed4b-8778-4ca0-b72d-f14039cb4466">stiefel whitney class</a> of the <a href="20250617-spivak_tangent_fibration.html#ID-67884935-62fc-43cc-9d90-6f6169a25d43">Spivak tangent fibration</a>.
</p>
