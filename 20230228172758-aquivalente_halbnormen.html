<span id="ID-b2f4cd86-6069-4b23-9931-d6dfde18f72d"></span><h1 class="title">äquivalente Halbnormen</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $\| \cdot \|_A, \| \cdot \|_B$ <a href="20230223221746-seminorm.html#ID-4bd6ec86-e434-4b37-9d50-e73ab6b454d4">Seminormen</a>.
$\| \cdot \|_A$ und $\| \cdot \|_B$ sind äquivalent zu einander, falls sie die gleiche <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">Topologie</a> <a href="20230223222954-von_einer_halbmetrik_induzierte_topologie.html#ID-d7347783-8cd1-4bcb-ba36-e31b6fa1652d">induzieren</a>
</p>
