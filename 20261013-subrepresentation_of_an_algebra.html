<span id="ID-5d7c05be-0bd2-4cdc-b28b-1e274618b997"></span><h1 class="title">subrepresentation of an algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V \in \mathrm{Rep}_{A}$ be a <a href="20261013-representation_of_an_algebra.html#ID-2382e24c-8a21-4f51-94be-8f7cc7321c83">representation of an R-algebra</a>, then a subrepresentation $W \subseteq V$ is an $R$ <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodule</a> such that for all $a \in A, w \in W, aw \in W$.
</p>

<h2 id="alternatively">Alternatively</h2>
<p>
<a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodule</a> of the $A$-module $V$.
</p>
