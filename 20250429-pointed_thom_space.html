<span id="ID-98b8f07b-99d8-4f03-a11f-cbdc4c15a29f"></span><h1 class="title">pointed Thom space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\pi:  E \rightarrow B$ be a <a href="20250501-pointed_spherical_fibration.html#ID-784908b9-6bc8-4a1d-abc7-5addb6b9ea49">pointed spherical fibration</a>  with section $s: B \rightarrow E$.
Then the pointed thom space is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{Th}_*(\pi) = \mathrm{cofib}(s)
\end{align*}</div>
