<span id="ID-8e83cdb4-e8e8-465c-806e-0960939bd509"></span><h1 class="title">splitting of a polynomial</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $K \subseteq L$ <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $f \in K[x]$.
Das <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> $f$ zerfällt über $L$, falls $a,c_1,...,c_n \in L$ existieen, so dass (in $L[x]$) gilt:
</p>

<div class="math-block">\begin{align*}
f = a \cdot \prod_{j=1}^{n} (x - c_j)
\end{align*}</div>
