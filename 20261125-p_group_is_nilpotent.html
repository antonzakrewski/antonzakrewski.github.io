<span id="ID-aac3a0da-b01f-4ddf-9890-33f40fd2e258"></span><h1 class="title">p-group is nilpotent</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any <a href="20230722-p_gruppe.html#ID-847c0e25-f5eb-45cd-bc0d-356b7bbe2497">p-group</a> is a <a href="20240317-nilpotent_group.html#ID-822a30f5-0ad9-43db-aa27-03b7737ce540">nilpotent group</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Recall that the <a href="20230730-zentrum_einer_p_gruppe_nichttrivial.html#ID-7159f05b-a311-4d86-8ae0-419f9246c2c1">center of a p-group is nontrivial</a>
</p>

<p>
then we can <a href="20221024165350-beweis_durch_vollstandige_induktion_mit_starkerer_induktionsvoraussetzung.html#ID-1534f6c1-e094-4672-8e87-f36eb0e54b8b">argue by induction</a>:
consider $Z(G) \rightarrow G \twoheadrightarrow G/Z(G)$ where the RHS is a nilpotent group by indcution hypothesis.
</p>
