<span id="ID-28ba96bf-402a-4b9d-b244-42631987e073"></span><h1 class="title">nullary union</h1>

<h2 id="satz">Satz</h2>
<p>
Die leere Vereinigung \bigcup_{i = 1}^0 A_i$ ist $\emptyset$
</p>

<h2 id="beweis">Beweis</h2>
<p>
Sei $x$ beliebig, so existiert kein $A_i$, $i \in \emptyset$ mit $x \in A_i$.
Daraus folgt $x \not\in \bigcup_{i=1}^0 A_i$
</p>
