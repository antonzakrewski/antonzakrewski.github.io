<span id="ID-7778de18-4bb8-4134-ae93-e29cec934203"></span><h1 class="title">cyclic field extension</h1>

<h2 id="definition">Definition</h2>
<p>
Let $L/K$ be a <a href="20230725-galoiserweiterung.html#ID-7fff7689-4ad5-4b67-bba7-1367615c1d5d">galois field extension</a>.
Then $L/K$ is said to be a cyclic field extension, if the  <a href="20230805-galoisgruppe.html#ID-4c1b3e1a-1418-4ec4-b878-8903e671c272">galois group</a> is a <a href="20230127191852-zyklische_gruppe.html#ID-dce4ae88-c1e1-4fcc-aa58-ea917d0e197f">cyclic group</a>
</p>
