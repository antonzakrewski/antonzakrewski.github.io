<span id="ID-f86be864-cfdd-4c0c-af03-c1671ffaceb7"></span><h1 class="title">poincare duality isomorphism of a 2n manifold</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(M\) be an \(2n\)-dimensional <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifold</a> with an <a href="20240613-r_orientation_of_a_manifold.html#ID-a0336fa3-412e-4f8f-9e97-2cffccc1c87c">R-Orientation</a> $\sigma$
Then the poincare duality isomorphism is defined as <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>

<div class="math-block">\begin{align*}
- \cap \sigma: H^n(M;R) \rightarrow H_{n}(M;R)
\end{align*}</div>
