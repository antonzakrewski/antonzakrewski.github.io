<p>
Let $G = ([n],E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a> and $\pi \in S_n$ a <a href="20221026161747-permutation_abbildung.html#ID-af424eae-548d-4d43-8ff0-3c2930186d7c">Permutation</a>.
Then the greedy chromatic number is defined as maximum number of the <a href="20250527-greedy_coloring_of_a_permutation.html#ID-84b7a6ea-dcb7-42da-930a-2777c966e900">greedy coloring of graph and a permutation</a>.
