<span id="ID-c3dd36b3-b048-4b37-8e86-9279147688cc"></span><h1 class="title">H-free Graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $H = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then another graph $G$ is said to be $H$ free if there does not exist a <a href="20231206-subgraph.html#ID-191bebce-741d-4771-bd78-eb39c0ef6837">subgraph</a> of $G$ which is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> to $H$
</p>
