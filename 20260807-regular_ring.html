<span id="ID-31302393-d85c-4aec-85fa-4bf4b950c24f"></span><h1 class="title">regular ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian ring</a>.
Then $R$ is said to be regular if for every <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a> $\mathfrak{p}$, $R_{\mathfrak{p}}$ is a <a href="20240707-regular_local_ring.html#ID-a8f34b67-a907-470f-8f04-e9fe438080fa">regular local ring</a>.
</p>
