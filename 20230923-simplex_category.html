<span id="ID-2952609d-1bab-4ac4-bbd7-1c0814af1314"></span><h1 class="title">simplex category</h1>

<h2 id="definition">Definition</h2>
<p>
The simplex category is defined as <a href="20230225184516-volle_unterkategorie.html#ID-02c96fc8-ac4f-42b6-804d-bc08d25bfb2a">full subcategory</a> of <a href="20230225170427-kategorie_pos.html#ID-b0504140-e5f4-46c3-b469-0d59a4eea81f">Category Pos</a>, that is
</p>
<ol>
<li><a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> <a href="20220819181756-klasse_mengenlehre.html#ID-998a9e01-e369-490b-bb26-657678f61d7a">classes</a> of <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> $[n] = \{0,1...,n\}$ for $n \in \mathbb{N}$ with the natural <a href="20221010083644-strenge_totalordnung.html#ID-a15ef82b-7f83-4955-9afc-7e380a7e564f">linear order</a> as <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a></li>

<li><a href="20230112105124-isotone_abbildung.html#ID-df6ce142-72d8-414f-a7b5-395f462666b0">(weakly) monotone maps</a> $\varphi: [n] \rightarrow [m]$</li>
</ol>
