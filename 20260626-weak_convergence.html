<span id="ID-85a7527f-c55a-42c6-8c67-6f53b16d3479"></span><h1 class="title">weak convergence</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V$ be a <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a>, then a sequence $x_n$ converges weakly to an $x$ if it <a href="20220105153330-konvergenz_einer_folge.html#ID-63fa4879-51cf-4ad6-8be5-0e9e10d29726">converges</a> in the <a href="20260607-weak_topology_of_a_normed_space.html#ID-b9d0ae60-615c-4e20-a578-0ff8997d7bb4">weak-topology of a normed space</a>
</p>

<h2 id="remark">Remark</h2>
<p>
the <a href="20260626-weak_topology_is_hausdorff.html#ID-9abea5bb-1063-4b86-a0fd-ce5d47822581">weak topology is hausdorff</a>, hence weak limits are unique.
</p>
