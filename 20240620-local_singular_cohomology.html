<h2 id="proposition">Proposition</h2>
<p>
Let $(X,A)$ be a <a href="20230331113453-pair_of_spaces.html#ID-a5c438a8-0ae6-40b1-93a4-5f5b59a22cf3">pair of spaces</a>, $M$ an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, then the local singular cohomology at $A$ with coefficients in $M$ is defined as <a href="20240528-singular_cohomology_algebra_functor.html#ID-b8ba0340-46d1-4776-af49-535d855627a0">singular cohomology</a>
</p>

<div class="math-block">\begin{align*}
H^*(X, X \setminus A;M)
\end{align*}</div>
