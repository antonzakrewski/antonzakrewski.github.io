<span id="ID-4381b9a4-ef2b-4648-9e40-2538dd706311"></span><h1 class="title">spectrum of a commutative ring as sober space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathrm{Spec}(A)$ the <a href="20230725-zariski_spectrum.html#ID-be298171-f5f5-4ad4-8574-afe3257110d2">zariski spectrum</a> with the <a href="20230725-zariski_topology.html#ID-1535e0f9-be74-4d53-9ca1-c88439a2a34b">Zariski topology</a>
Then $\mathrm{Spec}(A)$ is a <a href="20240904-sober_space.html#ID-66f7c45a-ac23-4abb-8f79-585dc3eb1cd6">sober space</a>
</p>
