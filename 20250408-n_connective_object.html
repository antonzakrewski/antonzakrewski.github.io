<span id="ID-2536c4d5-8861-41a6-92a5-66102fecba64"></span><h1 class="title">n-connective object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity category</a> with a <a href="20241023-t_structure_on_a_stable_infinity_category.html#ID-6e276613-1d75-469a-a934-a7f6211cdadd">t-structure</a>.
Then an object $x \in \mathcal{C}$ is said to be \(n\)-connective, if
</p>

<div class="math-block">\begin{align*}
x \in \mathcal{C}_{\geq n}
\end{align*}</div>
