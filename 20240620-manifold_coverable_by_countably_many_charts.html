<span id="ID-41aa8d21-8c9f-44b8-9cb9-aa394791c031"></span><h1 class="title">manifold coverable by countably many charts</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(M\) be a <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifold</a>
Then there exists countably many <a href="20230723-karte_mannigfaltigkeit.html#ID-ba69f262-31e8-4d80-b2b1-d9e270e32a08">charts</a> $U_i$ such that
</p>

<div class="math-block">\begin{align*}
\bigcup U_i = M
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20230211132410-zweite_abzahlbarkeitsaxiom.html#ID-155a3f29-5e48-4647-a11e-5bc32b501755">secondcountability</a>
</p>
