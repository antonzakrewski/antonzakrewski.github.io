<span id="ID-be722915-1d8d-4d4a-92e3-2c631561f0c0"></span><h1 class="title">cofibration of simplicial sets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\iota: A \rightarrow X$ be a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of</a> <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> $A,X$.
Then $\iota$ is said to be a cofibration, if the <a href="20240429-boxtensor_of_morphisms.html#ID-009efabf-6ba7-4845-a3f9-07ce51b7fa72">boxtensor</a> has the <a href="20240404-left_lifting_property.html#ID-79b76b6b-ee9c-4690-ab83-c4323b803152">left lifting property</a> against <a href="20240429-kan_fibration.html#ID-1869d74a-d2cf-4e24-bd3a-10bb92fa3a49">kan fibrations</a> $X \rightarrow \Delta^0$
</p>
