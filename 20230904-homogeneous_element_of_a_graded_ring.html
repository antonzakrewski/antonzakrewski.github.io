<h2 id="definition">Definition</h2>
<p>
Let $R = \bigoplus_{n \in \mathbb{N}_0} R_n$ be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a>
