<span id="ID-fdd553dc-1b1f-470d-8fe3-56f36dc4202f"></span><h1 class="title">topological manifold with paracompactness</h1>

<h2 id="definition">Definition</h2>
<p>
An (\(n\)-dimensional8 topological manifold is a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $(M, \mathcal{T})$ such that
</p>
<ol>
<li>$M$ is <a href="20231017-locally_euclidean.html#ID-61ff6b6a-4957-4dc3-a94b-247e3a79b8ee">locally euclidean</a> - sometimes with fixed dimension $n$</li>

<li>$M$ is <a href="20230406114101-paracompact_space.html#ID-e335d767-4989-4ad5-ba4e-28c7559ae05a">paracompact space</a></li>

<li>$M$ is <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">Hausdorff</a></li>
</ol>
