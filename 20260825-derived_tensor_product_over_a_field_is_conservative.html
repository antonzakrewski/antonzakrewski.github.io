<span id="ID-ead154da-f99a-44b1-976b-cbff57cd6e0f"></span><h1 class="title">derived tensor product over a field is conservative</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $k$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $R,S \in \mathcal{D}(k)$ be <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a>.
Suppose $R \otimes_{k} S \simeq 0$, then at least $R$ or $S$ are trivial.
</p>
