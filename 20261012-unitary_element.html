<span id="ID-11f0f6b8-4173-46e3-98ac-9efe91207fd3"></span><h1 class="title">unitary element</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be an <a href="20251019-unital_c_star_algebra.html#ID-d54563d5-c056-4fce-b50b-07c790023019">unital C-star Algebra</a>.
Then $u \in A$ is said to be unitary, if $u u^* = u^* u = \mathbbm{1}$.
