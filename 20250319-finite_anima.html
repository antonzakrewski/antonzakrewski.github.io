<span id="ID-30921a08-94d0-49f1-86b3-c034afbee61a"></span><h1 class="title">finite anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>.
Then $X$ is said to be finite, if there exists a <a href="20240919-finite_simplicial_set.html#ID-fc424857-42c4-40cc-9f8a-6bf59686baa6">finite simplicial set</a> $A$ such that
</p>

<div class="math-block">\begin{align*}
\mathrm{colim}_{A} * \simeq&amp; \vert A \vert \\
\simeq&amp; X
\end{align*}</div>

<p>
see:
</p>
<ul>
<li><a href="20250328-colimit_of_a_point_in_anima.html#ID-4f935030-8450-493c-a0c0-9f5ac3c165ee">colimit of a point in Anima</a> </li>
</ul>
