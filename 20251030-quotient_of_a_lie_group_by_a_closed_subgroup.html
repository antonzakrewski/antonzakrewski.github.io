<span id="ID-8ac9d1ae-a2f9-4da6-8bd8-5b30396863c7"></span><h1 class="title">quotient of a lie group by a closed subgroup</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20240905-lie_group.html#ID-7f22c609-ba54-44fc-99d4-b401bcb0c871">lie group</a> and $H$ a <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a> <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a>.
Then the <a href="20221210201536-faktorgruppe.html#ID-37068c77-35dd-45c0-8051-01704f97222c">quotient group</a> $G/H$ admits a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth structure</a> such that the projection
</p>

<div class="math-block">\begin{align*}
\pi: G \rightarrow G/H
\end{align*}</div>
<p>
is a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a>
