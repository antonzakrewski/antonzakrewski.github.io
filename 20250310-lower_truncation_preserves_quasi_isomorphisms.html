<span id="ID-988efef8-3653-4963-92a0-cdcb4b85ddcb"></span><h1 class="title">lower truncation preserves quasi-isomorphisms</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="lower-truncation-of-chain-complexes.html#ID-79144a71-fa2c-4afc-9454-2d9a1b9f661b">lower truncation of chain complexes</a> preserves <a href="20231212-quasi_isomorphism.html#ID-4d0430a5-c6db-4a21-8c43-cd224592d992">quasi-isomorphisms</a>
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of <a href="20250310-homology_of_a_lower_truncation.html#ID-71c6fcdb-1388-4d57-b5c9-877475959c5d">homology of a lower truncation</a> where the <a href="20240424-zero_functor.html#ID-9cc1dedc-d8c3-4694-9315-85abdc896d49">zero functor</a> sends any morphism to a (quasi-)isomorphism.
</p>
