<span id="ID-d6655470-bd3f-49f4-bc7a-20f1c2f6c3b3"></span><h1 class="title">homology of a manifold bounded</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(X\) be an \(n\)-dimensional <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifold</a> and $M$ an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>
Then for $k &gt; n$ the <a href="20230901-homologie.html#ID-1b7b88ca-b993-46dc-8ebe-8531d90dc8f4">singular homology</a> is given by the <a href="20230517113245-nullmodul.html#ID-0de85912-72ca-4309-9566-8a117a409930">zero module</a>
</p>

<div class="math-block">\begin{align*}
H_k(X;M) = 0
\end{align*}</div>
