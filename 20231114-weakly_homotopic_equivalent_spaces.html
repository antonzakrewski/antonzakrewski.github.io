<span id="ID-e0f1451b-9d5d-46e8-a3cf-65a5ef8e465d"></span><h1 class="title">weakly homotopy equivalent spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,\mathcal{T}_X)$ and $(Y,\mathcal{T}_Y)$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
Then $X,Y$ are said to be weakly homotopy equivalent, if there exists a <a href="20231114-weak_homotopy_equivalence.html#ID-560d1751-c604-40c4-9f8b-787e7e47e5ed">weak homotopy equivalence</a> $f: X \rightarrow Y$ or $f: Y \rightarrow X$
</p>
