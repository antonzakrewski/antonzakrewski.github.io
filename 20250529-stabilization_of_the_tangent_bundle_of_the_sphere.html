<span id="ID-520a715a-5d32-4c9b-bd74-2e9095355399"></span><h1 class="title">tangent bundle of the sphere is stably trivial</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20230905-tangential_bundle.html#ID-9be27bef-7843-4f67-9883-3f2471e8e894">tangential bundle</a> of the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">n-sphere</a> is stably trivial.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as the <a href="20250905-normal_bundle_of_a_smooth_embedding.html#ID-03bcd944-92a8-414d-8812-076b03514f3b">normal bundle</a> of $S^n \hookrightarrow \mathbb{R}^{n+1}$ is trivial and the tangent bundle of $\mathbb{R}^{n+1}$ is trivial.
</p>
