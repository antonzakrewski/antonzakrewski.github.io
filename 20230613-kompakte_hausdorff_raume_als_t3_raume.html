<span id="ID-6d883fc9-1a97-4a5a-a8ec-d4d6fed8c5fa"></span><h1 class="title">kompakter Hausdorff-Räume ist T3-Raum</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20230121142600-kompaktheit_topologie.html#ID-58037a78-9969-4077-ad91-ce5e70c6c32c">Kompakter</a>, <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">Hausdorff-Raum</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">Raum</a>.
Dann ist $X$ ein <a href="20230207113114-t3_raum.html#ID-1496cd1c-f753-4113-8c6c-997de305c027">T3-Raum</a>.
</p>
