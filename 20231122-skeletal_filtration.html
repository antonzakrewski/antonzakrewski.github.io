<span id="ID-0c3a9878-a71f-413d-949a-0dd0f6341973"></span><h1 class="title">skeletal filtration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
A skeletal filtration $(\mathrm{SK}_n)_{n \geq -1}$ is a sequence of <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspaces</a> $\mathrm{SK}_n$ such that
</p>

<div class="math-block">\begin{align*}
X = \mathrm{colim}_{n} \mathrm{SK}_n
\end{align*}</div>
