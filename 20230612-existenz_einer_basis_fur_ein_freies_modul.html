<span id="ID-3d2f2211-d04b-42b8-b837-d2d432f1acc2"></span><h1 class="title">Existenz einer Basis für einen endlich erzeugten, freien Modul</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $M$ ein <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">freier</a> $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a>.
Dann existiert eine <a href="20230303171607-basis_eines_moduls.html#ID-4d94d36c-5d43-4344-a837-6c9705d279a1">Basis</a> von $M$
</p>

<h2 id="bewies">Bewies</h2>
<p>
Nach Annahme existiert ein <a href="20230303170548-modulisomorphismus.html#ID-808e406f-ac3b-433c-a704-4f83909ef60d">Isomorphismus</a> $\phi: M \rightarrow R^n$
Dabei existiert für $R^n$
</p>
