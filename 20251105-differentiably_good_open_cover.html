<span id="ID-4a02bffe-5b6c-4928-87c5-fecbc24d8371"></span><h1 class="title">differentiably good open cover</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>
Then a <a href="20251105-good_open_cover.html#ID-ac7c2d96-3e72-4fda-8989-011ea98f5893">good open cover</a> is said to be a differentiably good open cover if each finite intersection $\bigcap_{i=1}^n U_i$ is <a href="20230301205440-diffeomorphismus.html#ID-573a56f9-0240-4c4a-a241-ee598afdd9f5">diffeomorphic</a> to $\mathbb{R}^m$ for $n \in \mathbb{N}^+$
</p>
