<span id="ID-58bbaf4e-7310-4524-8008-513e209f798d"></span><h1 class="title">ringed space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $k$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, then a \(k\)-ringed space is a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $(X, \mathcal{O}_{X})$ together with a <a href="20260720-sheaf_on_a_grothendieck_topology.html#ID-6aa8bbd3-b259-4c58-b9e6-7c22333ad318">sheaf</a> of <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">k-Algebras</a> $\mathcal{O}_X$ on $X$
</p>
