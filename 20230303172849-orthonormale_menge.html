<span id="ID-5e5ba861-ae74-444c-a8f9-e7dbf26e9690"></span><h1 class="title">orthonormale Menge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> mit einem <a href="20221031195957-inneren_produkt.html#ID-98914861-db37-4206-807f-5f8e390ecf3d">inneren Produkt</a> $\langle \, , \, \rangle$ und $M \subseteq V$ eine <a href="20230303172844-orthogonale_menge.html#ID-07ebca84-e55a-4e58-81c8-d65cedf69820">orthogonale Menge</a>.
$M$ ist ornhonormal, falls für $v \in M$ und die <a href="20230223222320-von_einem_skalarprodukt_induzierte_norm.html#ID-be00afe0-7e89-4842-838a-8943b323920c">von einem Skalarprodukt induzierte Norm</a> gilt:
</p>

<div class="math-block">\begin{align*}
\| v \| = 1
\end{align*}</div>
