<span id="ID-86304bfa-f969-4de7-b2a5-1c629a0414f2"></span><h1 class="title">erzeugende Funktion als Erwartungswert</h1>

<h2 id="proposition">Proposition</h2>

<p>
Dann ist
</p>

<div class="math-block">\begin{align*}
G_{X}(s) = \mathbb{E}[s^{X}]
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
folgt aus
</p>

<div class="math-block">\begin{align*}
\mathbb{E}[s^{X}] =&amp; \sum_{n \in X[\Omega]} s^n p(X = n) \\
=&amp; G_X(s)
\end{align*}</div>
