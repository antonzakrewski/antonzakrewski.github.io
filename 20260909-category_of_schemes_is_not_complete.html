<span id="ID-26d7a4a0-f100-4bde-8b0f-072c4fafa668"></span><h1 class="title">category of schemes is not complete</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20240225-category_of_schemes.html#ID-6d88d721-8051-4017-a7b2-3b2441ec1a77">category of schemes</a> is in general not <a href="20230923-complete_category.html#ID-8877dd56-54c0-42cc-a1d8-2785b0cec19b">complete</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $\mathbb{P}_k^1$ be the <a href="20260801-projective_space_functor_from_set.html#ID-99b69683-7a7d-442b-92af-9b29223ebfe4">projective space</a>.
Then $\prod_{\mathbb{N}} \mathbb{P}_k^1$ does not exist.
</p>
