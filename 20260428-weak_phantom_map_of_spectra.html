<span id="ID-8b7b9ca9-42fe-4b5d-a02f-fa8cd184e502"></span><h1 class="title">weak phantom map of spectra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a> and $f: X \rightarrow Y$ be a map.
Then $f$ is said to be a weak phantom map, if $\pi_*(f)$ is the zero map for $* \in \mathbb{N}_0$.
</p>
