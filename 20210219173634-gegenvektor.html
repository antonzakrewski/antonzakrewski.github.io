<span id="ID-819bea3a-1ffb-410d-83c9-b75ce1aff982"></span><h1 class="title">Gegenvektor</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\vec{v}$ ein <a href="20210217215228-vektor.html#ID-be50263b-d29c-41c5-9909-2f5e106dc49c">Vektor</a>.
Dann ist der Gegenvektor $-\vec{v} = -1 \cdot \vec{v}$.
Der Gegenvektor $-\vec{v}$ ist damit genauso lang wie der ursprüngliche Vektor $\vec{v}$, nur um 180 Grad gedreht.
