<span id="ID-789c6b4a-7518-42e7-9153-4183d8b285c7"></span><h1 class="title">category nPr</h1>

<h2 id="definition">Definition</h2>
<p>
Let $n \in \mathbb{N}$ and $\kappa$ be a fixed <a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinal</a>.
Then $\mathrm{nPR}$ is inductively defined as
</p>
<ol>
<li>$\mathrm{0Pr} \coloneqq \mathrm{An}$</li>

<li>$\mathrm{(n+1)Pr} \coloneqq \mathrm{Mod}_{nPr}(\mathrm{Pr}^{L}_{\kappa})$</li>
</ol>
<p>
see:
</p>

</ul>
