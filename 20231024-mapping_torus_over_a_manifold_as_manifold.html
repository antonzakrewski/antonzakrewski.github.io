<span id="ID-791fa1e6-ae9f-473c-ab8a-b6e379e86ef8"></span><h1 class="title">mapping torus over a manifold as manifold</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(M\) be an \(n\)-dimensional <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifold</a>, $\varphi: M \rightarrow M$ a <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphism</a>.
Then the <a href="20231024-mapping_torus.html#ID-37ab9b5e-bf91-4764-8b44-9a35b1f5513b">mapping torus</a> is canonically an \(n+1\)-dimensional Manifold
</p>
