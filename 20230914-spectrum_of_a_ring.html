<span id="ID-80de2982-9ef9-4a53-8c68-1e9612ff2447"></span><h1 class="title">Spectrum of a Ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, then the spectrum $\mathrm{Spec}(A)$ - in the context of algebraic geometry - is defined as the <a href="20230725-zariski_spectrum.html#ID-be298171-f5f5-4ad4-8574-afe3257110d2">zariski spectrum</a> equipped with the <a href="20230725-zariski_topology.html#ID-1535e0f9-be74-4d53-9ca1-c88439a2a34b">Zariski topology</a> with the <a href="20230914-structure_shaef_of_the_spectrum.html#ID-4d38655d-6db1-48aa-a5cc-db31a4ae4228">structure sheaf of the spectrum</a>
</p>
