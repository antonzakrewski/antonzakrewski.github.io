<span id="ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728"></span><h1 class="title">locally ringed space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_X)$ be a <a href="20230825-ringed_space.html#ID-58bbaf4e-7310-4524-8008-513e209f798d">ringed space</a>.
Then $(X, \mathcal{O}_X)$ is said to be locally ringed, if every <a href="20230825-stalk.html#ID-6fcbbbf4-984b-401a-840b-c614a03bd6a7">stalk</a> is a <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a>
</p>
