<span id="ID-e41a956d-64ee-4ab8-ac64-05890e3c6316"></span><h1 class="title">semi weakly locally contractible</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is said to be semi-weakly locally contractible, if each point admits a <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $V$ such that the inclusion
</p>

<div class="math-block">\begin{align*}
\iota: V \rightarrow X
\end{align*}</div>
<p>
is <a href="20230331213346-nullhomotopic.html#ID-a7d1984d-81e7-4e03-ad95-59bc1cdaeda8">nullhomotopic</a>
</p>
