<span id="ID-f8f55825-967f-40d4-895f-5f084e8326a8"></span><h1 class="title">infinite elementary linear group</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, then the infinite elementary linear group is defined as <a href="20231105-sequential_colimit.html#ID-16ff2225-6ea8-421d-83cc-f3f3cd9832ef">sequential colimit</a>
</p>

<div class="math-block">\begin{align*}
E(A) := \mathrm{colim}_{n \in \mathbb{N}} E_n(A)
\end{align*}</div>
