<span id="ID-ee5d7893-af98-4807-8118-00bde790b509"></span><h1 class="title">Operatornorm</h1>

<h2 id="definition-satz">Definition / Satz</h2>
<p>
Die Operatornorm ist eine
Seien $V,W$ <a href="20221003143917-normierter_raum.html#ID-250c7843-ade4-44e9-9d45-05423ddaa1d8">normierte Räume</a> und $A: V \rightarrow W$ ein <a href="20230601104215-linearer_operator.html#ID-f0820723-a046-4b6e-bb52-0e14a4bbb688">Linearer Operator</a>, dann sit die Operatornorm von $A$ definiert als
</p>

<div class="math-block">\begin{align*}
\| A \| =&amp; \sup_{x \in V \setminus \{0\}
\end{align*}</div>
