<span id="ID-8a607a60-5597-4642-bb11-994a3f033418"></span><h1 class="title">surjection induces trivial cotangent module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\varphi: R \rightarrow S$ be a <a href="20230301170300-ringepimorphismus.html#ID-0354f59c-3b74-4c1d-994a-74dffbfc0897">ring-epimorphism.</a>
Then the <a href="20260807-cotangent_module.html#ID-ddb9f41c-9c58-4373-aa03-b42b3a5483fe">cotangent module</a> is trivial.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the <a href="20260807-presentation_of_the_cotangent_module.html#ID-9aa2ccd0-570f-45b0-87bd-b34ccd989939">presentation of the cotangent module</a>, where we dont have any generators.
</p>
