<span id="ID-bf0457c7-3d2b-4423-ac4b-7f006f517928"></span><h1 class="title">Factorial</h1>

<h2 id="definition">Definition</h2>
<p>
Für $n \in \mathbb{N}$ ist die Fakultät folgendermaßen definiert:
</p>

<div class="math-block">\begin{align*}
n!  \coloneqq \prod_{k=1}^n k = 1 \cdot 2 \cdo ... \cdot n
\end{align*}</div>
