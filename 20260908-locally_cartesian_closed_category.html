<span id="ID-402e997b-0648-4bdc-9578-811bb7e4924b"></span><h1 class="title">locally cartesian closed category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>.
Then $\mathcal{C}$ is said to be locally cartesian closed, if for every $x \in \mathcal{C}$, the category $\mathcal{C}_{/x}$ is a <a href="20231115-cartesian_closed_category.html#ID-315f9f64-ca45-4064-b89d-c1da8a889115">cartesian closed category</a>.
</p>
