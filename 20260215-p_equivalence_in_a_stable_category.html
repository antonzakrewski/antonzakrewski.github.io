<span id="ID-b9081fa9-8c6b-4027-92fd-c317184948eb"></span><h1 class="title">p-equivalence in a stable category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{D}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category.</a>
Then a morphism $f: E \rightarrow F$ is a p-equivalence, if $f_{//p}$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> (cf. <a href="20260215-mod_p_endofunctor_of_a_stable_category.html#ID-5f88d226-6f9a-41ed-ae41-e6e2189199fe">mod p endofunctor of a stable category</a>)
</p>
