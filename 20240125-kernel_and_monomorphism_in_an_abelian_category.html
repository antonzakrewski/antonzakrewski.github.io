<span id="ID-ce09d997-c1d4-490a-8278-eb423230325a"></span><h1 class="title">kernel and monomorphism in pointed category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be a <a href="20231215-pointed_category.html#ID-0783589b-3d52-46d9-a7ad-fb1c3130a223">pointed</a> and $f: X \rightarrow Y$ a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a>
</p>

<p>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$f$ is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> </li>

<li>the <a href="20221111200152-kern_algebra.html#ID-438e68de-0603-419c-8b21-5cb3b4add3a1">kernel</a> is the <a href="20230402213821-zero_object.html#ID-9ea95c71-2120-411e-8447-87c82ba32c98">zero object</a>: $\mathrm{ker}(f) = 0$</li>
</ol>
<h2 id="proof">Proof</h2>
<p>
follows dually to <a href="20240125-cokernel_and_epimorphism_in_an_abelian_category.html#ID-c291af89-eb4d-4de8-9d2a-1dc99af41d63">cokernel and epimorphism in an abelian category</a>
</p>
