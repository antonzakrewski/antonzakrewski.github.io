<span id="ID-c474d25d-5e3a-46ac-91f5-851a45fab518"></span><h1 class="title">object classifier</h1>

<h2 id="definition">Definition</h2>
<p>
Let $T$ be a <a href="20241016-presentable_infinity_category.html#ID-346bd670-f443-4290-83e6-015d1801ed20">presentable</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>, then an object classifier is an object $U \in \mathrm{Fun}^{\lim}(T^{\mathrm{op}}, \widehat{\mathrm{An}})$ such that $\mathrm{Hom}_{}(X,U) \simeq (T_{/X})^{\simeq}$
</p>
