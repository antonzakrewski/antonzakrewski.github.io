<span id="ID-5559fc6f-42c5-4139-9d80-fb7034c949db"></span><h1 class="title">stable range of an anima</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be an \(n-1\)-<a href="20250331-n_connected_anima.html#ID-8d54c8e2-dcbc-4c3f-a2c6-43654b0c9786">connected</a> <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>, then the stable range consists of
</p>

<div class="math-block">\begin{align*}
\pi_{*}(X) = \pi_{*+k}(\Sigma^k X)
\end{align*}</div>
<p>
for $* \leq 2n-1$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20240718-freudenthal_suspension_theorem.html#ID-16add9ca-5b65-4579-8982-b4ef46ef299a">freudenthal suspension theorem</a>
</p>
