<span id="ID-082502c3-ec06-4c51-bf2c-69ddcfd0b872"></span><h1 class="title">rationals not a projective group</h1>

<h2 id="proposition">Proposition</h2>
<p>
$\mathbb{Q}$ is not a <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective</a> <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
Note that multiplication by $2$ is a <a href="20220928135903-gruppenautomorphismus.html#ID-bde82a42-2a52-4890-a477-dc738b045a46">group-automorphism</a> on $\mathbb{Q}$
But it is not surjective on a summand of $\coprod \mathbb{Z}$
</p>
