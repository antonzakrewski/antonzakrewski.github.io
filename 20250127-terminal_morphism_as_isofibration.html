<span id="ID-1e87d15d-6f18-4bc0-ac8f-914d3ce2d457"></span><h1 class="title">terminal morphism as isofibration</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then the <a href="20230404183731-terminal_morphism.html#ID-ad3ab3aa-eac9-4e11-8a03-6a8e703aefdf">terminal morphism</a> $X \rightarrow *$ is an <a href="20240405-isofibration_between_infinity_categories.html#ID-1b53e4b6-37d1-4052-9cd9-d832a02aa3a8">isofibration</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from lifting
