<span id="ID-68c990ed-cfbf-43e3-a5e8-e9080faedcee"></span><h1 class="title">factor group of a series</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and
</p>

<div class="math-block">\begin{align*}
1 \triangleleft G_n \triangleleft ... \triangleleft G_0 = G
\end{align*}</div>
<p>
a <a href="20230808-subnormal_series.html#ID-e20880a1-49a6-45a3-8a23-a02d910a6a61">subnormal series</a>.
Then a factor group of the series is a <a href="20221210201536-faktorgruppe.html#ID-37068c77-35dd-45c0-8051-01704f97222c">quotient group</a> $G_{i+1}/G_{i}$ for $i \in \{0,...,n-1\}$
</p>
