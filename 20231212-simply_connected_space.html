<span id="ID-ebb69dd9-193c-49e5-9d69-dad026b1a8ea"></span><h1 class="title">simply connected space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
</p>

<p>
Then $X$ is said to be simply connected, if it <a href="20230308142110-wegzusammenhangender_raum_topologie.html#ID-09b1d548-9ac2-461c-8b3e-f72097f54a99">pathconnected</a> and every <a href="20230308142118-weg.html#ID-7c6527d3-2217-4c14-85ab-d1545b889ba8">path</a> is <a href="20230331213346-nullhomotopic.html#ID-a7d1984d-81e7-4e03-ad95-59bc1cdaeda8">nullhomotopic</a>
</p>
