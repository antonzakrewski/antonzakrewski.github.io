<span id="ID-be298171-f5f5-4ad4-8574-afe3257110d2"></span><h1 class="title">zariski spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
The spectrum of $A$ is the <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of all <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideals</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(A) = \{\mathcal{p} \subseteq A \vert \mathcal{p} \text{ prime Ideal}\}
\end{align*}</div>
