<span id="ID-186f7dc2-6513-4fac-a055-8a169d596881"></span><h1 class="title">connected limit</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
A connected limit is a <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> of a <a href="20220821183856-diagramm_kategorientheorie.html#ID-ad9d3642-913a-4374-8605-52121d00b349">diagram</a> $J: \mathcal{J} \rightarrow \mathcal{C}$ where $\mathcal{J}$ is a <a href="20231111-connected_category.html#ID-663060d5-07ae-4dfc-b5d3-ed866fa75bdc">connected category</a>
</p>
