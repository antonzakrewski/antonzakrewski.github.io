<span id="ID-cb1fd960-4d36-48f5-b189-d39866fe59b8"></span><h1 class="title">image of a morphism of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a morphism of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>.
Then the image of $f$ is defined as functor
</p>

\mathrm{im}(f): \mathrm{CAlg}_k \rightarrow&amp; \mathrm{Set} \\
R \mapsto&amp; \{\mathrm{im}(X(R) \rightarrow Y(R)\}
\end{align*}</div>
