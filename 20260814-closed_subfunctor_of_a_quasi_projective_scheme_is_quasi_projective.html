<span id="ID-b61b4ffa-5da8-481f-9a1f-49b399a4b03b"></span><h1 class="title">closed subfunctor of a quasi-projective scheme is quasi-projective</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20260715-quasi_projective_scheme.html#ID-605dee32-34ca-4d8c-84c9-a96de97f65c1">quasi-projective k-scheme</a> and $Z \hookrightarrow X$ a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a>.
Then $Z$ is also a quasi-projective k scheme.
</p>
