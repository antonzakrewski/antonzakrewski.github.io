<span id="ID-f3db4ae5-f553-4428-8b63-c6814d3f14c9"></span><h1 class="title">maximal matching</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20250426-bipartit_graph.html#ID-a2f92440-01b7-42a5-9529-fad127a7e9ea">bipartite graph</a> and $M$ a <a href="20250521-matching.html#ID-cf8a30fa-4ffa-475e-8620-ba2765330472">matching</a>.
A matching is maximal, if it is a matching with highest <a href="20211227215415-machtigkeit_menge.html#ID-a53ec5a2-0adb-4575-bf21-e3ac15eff75f">cardinality</a> $\vert M \vert$
</p>
