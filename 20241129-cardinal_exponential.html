<h2 id="definition">Definition</h2>
<p>
Let $\kappa_1,\kappa_2$ be <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinals</a>, then the exponential is defined as cardinal of
</p>

\kappa_2^{\kappa_1} \vert \mathrm{Hom}_{\mathrm{Set}}(K_1,K_2) \vert
\end{align*}</div>
<p>
where $K_1,K_2$ are the sets representing $\kappa_1,\kappa_2$
