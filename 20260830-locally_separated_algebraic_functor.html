<span id="ID-8a788393-09dc-4be6-b792-67647bab2530"></span><h1 class="title">locally separated algebraic functor</h1>

<h2 id="definition">Definition</h2>
<p>
An <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a> $X$ is called locally separeted, if the <a href="20230404183731-terminal_morphism.html#ID-ad3ab3aa-eac9-4e11-8a03-6a8e703aefdf">terminal morphism</a> $X \rightarrow \mathrm{Spec}(\mathbb{Z})$ is a <a href="20260716-locally_separated_map_of_algebraic_functors.html#ID-f8f114fa-79db-4612-b9c4-0c8c084f7577">locally separated morphism</a>.
</p>
