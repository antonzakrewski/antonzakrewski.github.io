<span id="ID-e8192af1-0d51-4d94-a498-e5a6d271e025"></span><h1 class="title">strict monoidal structure on a functor</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20231201-monodial_structure_on_a_functor.html#ID-62bbd5d5-f943-430d-870a-bde433e2bf84">monodial structure on a functor</a> on a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>  is said to be strict, if the <a href="20231204-multiplication_isomorphism_of_a_monoidal_functor.html#ID-963bd7fb-4a49-4e15-a77e-35ae33b72c65">multiplication</a> is the <a href="20231017-identity_natural_transformation.html#ID-c8ccbb51-f801-49b6-a648-c950b1c95c57">identity natural transformation</a> and  the  <a href="20231204-unit_constraint_of_a_monoidal_functor.html#ID-9ded9060-5667-4c46-903d-3eedeeff5578">unit constraint</a> the <a href="20220817165031-identitatsmorphismus.html#ID-18d8207c-a2f4-499b-ab59-b7efe4858e31">identity morphism</a>
</p>
