<span id="ID-a1debaca-99d4-46f6-9552-5fa41cbfdea1"></span><h1 class="title">complex star algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathbb{C}$ star algebra $A$ is an associative, (possibly non-unital), \(\mathbb{C}\)<a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">-Algebra</a>, with an <a href="20230228182410-antilinearer_operator.html#ID-425e09e2-b1a2-4470-8de8-12f9640bdd6f">antilinear</a>, anti-commutative <a href="20250128-involution.html#ID-8e7a40a5-6d87-4f12-9e79-882aa5cf186a">involution</a> $(-)^*$.
</p>

<p>
In other words
</p>
<ol>
<li>$(a \cdot b)^* = b^* a^*$</li>

<li>$(\lambda \cdot a)^* = \overline{\lambda} a^*$</li>
</ol>
