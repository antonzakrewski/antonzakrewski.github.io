<span id="ID-939deff4-d7fc-4f40-97e2-08008a3c70c1"></span><h1 class="title">H0 of a commutative ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $H_0$ is defined as
</p>

<div class="math-block">\begin{align*}
H_0(R) \coloneqq \mathrm{Hom}_{\mathrm{Top}}(\mathrm{Spec}(R), \mathbb{Z})
\end{align*}</div>
<p>
where $\mathbb{Z}$ is equipped with the <a href="20221002144647-diskrete_topologie.html#ID-c9466868-60fd-4b1f-ae1c-1bf7606f3ec7">discrete topology</a>
</p>

<p>

</ul>
