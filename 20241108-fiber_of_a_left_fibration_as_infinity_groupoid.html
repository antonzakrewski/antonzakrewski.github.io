<span id="ID-e8bdba71-6bf6-4455-87f4-eaac8aafbe0f"></span><h1 class="title">fiber of a left fibration as infinity groupoid</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a>, $p: X \rightarrow Y$ a <a href="20240327-left_fibration.html#ID-bdbcb3cc-0793-4a96-9303-7f78702f03fb">left fibration</a>
Then for $x \in X_0$ the <a href="20240717-fibre_of_a_morphisms.html#ID-88467be8-d154-4c5b-9922-28e1c3c42044">fiber</a> $Y_x$ is an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">infinity-groupoid</a>
</p>
