<span id="ID-4d6f8444-acdf-4754-ab68-01da1c917c5a"></span><h1 class="title">coproduct of cw complexes as cw complex</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X_i, \emptyset, \mathrm{SK}_n(X_i))$ be <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complexes</a>.
Then the <a href="20230404161607-categorical_coproduct.html#ID-25822c41-825b-480b-b8a6-eeb904ca5649">categorical coproduct</a> as <a href="20230303000539-topologische_summe.html#ID-7c03dcbb-604d-4d61-9d6d-2d50e50aa5a6">topological sum</a> is also canonically a CW-complex.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20231125-colimits_commute_with_colimits.html#ID-7b27ef2b-b942-4338-b20b-01c4713c526d">colimits commute with colimits</a> </li>
</ul>
