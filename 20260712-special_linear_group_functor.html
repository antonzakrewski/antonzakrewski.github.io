<span id="ID-87ee9024-edd2-457c-859a-1049b084a3e7"></span><h1 class="title">special linear group functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $n \in \mathbb{N}$, then the special linear group functor is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{SL}_n(-): \mathrm{CAlg}_R \rightarrow&amp; \mathrm{Grp} \\
S \mapsto&amp; \mathrm{SL}_n(S) 
\end{align*}</div>
