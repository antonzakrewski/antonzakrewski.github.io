<span id="ID-c025c821-0f3d-48e4-a186-f7cc4b9b169d"></span><h1 class="title">Nullfolgenkriterium</h1>

<h2 id="satz">Satz</h2>
<p>
Wenn die Reihe $\sum_{k=1}^{\infty} a_k$ <a href="20220105153330-konvergenz_einer_folge.html#ID-63fa4879-51cf-4ad6-8be5-0e9e10d29726">konvergiert</a>, dann ist die <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Folge</a> $(a_k)$ eine <a href="20220105153234-nullfolge.html#ID-7249b9ac-2afc-4157-9427-c368e5d287d3">Nullfolge</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
Nach dem <a href="20220105225912-cauchysches_konvergenz_kriterium.html#ID-08b989d3-4b14-4823-b00a-8c5392d5ca82">Cauchysches Konvergenz-Kriterium</a> gilt:
</p>

<div class="math-block">\begin{align*}
a_m = s_m - s_{m-1} \\
a_m \rightarrow 0
\end{align*}</div>
