<span id="ID-7249b9ac-2afc-4157-9427-c368e5d287d3"></span><h1 class="title">null sequence</h1>


<h2 id="satz">Satz</h2>
<p>
Sei $(V, \| \cdot \|)$ ein <a href="20221003143917-normierter_raum.html#ID-250c7843-ade4-44e9-9d45-05423ddaa1d8">normierter Raum</a> und $(v_n)_{n \in \mathbb{N}}$ eine <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Folge</a>.
Dann heißt $(v_n)$ eine nullfolge, falls $v_n$ gegen $0$ konvergiert, d.h.
</p>

<div class="math-block">\begin{align*}
\lim_{n \to \infty}\left(v_n \right) = 0
\end{align*}</div>
