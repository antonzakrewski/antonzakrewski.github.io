<h2 id="definition">Definition</h2>
<p>

</p>

<div class="math-block">\begin{align*}

\end{align*}</div>

is <a href="20250831-qc_condensed_set.html#ID-f23a19bb-551b-427f-bd36-168709e71cae">qc</a>
