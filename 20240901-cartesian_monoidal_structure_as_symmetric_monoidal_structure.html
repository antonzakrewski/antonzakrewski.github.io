<span id="ID-cccdd6a5-e5e7-40ce-b0d9-de43d0cb63b6"></span><h1 class="title">cartesian monoidal structure as symmetric monoidal structure</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(\mathcal{V}, \otimes_{\mathcal{V}}, \mathds{1}_{\mathcal{V}})$ be a <a href="20231201-cartesian_monoidal_category.html#ID-5be7b25c-9925-4427-82fb-859d029ba7d1">cartesian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{V}$ is a <a href="20240121-symmetric_monoidal_category.html#ID-a3104144-74b9-4bc8-8537-16eda80767f1">symmetric monoidal category</a>
</p>
