<span id="ID-a4d01b92-dca3-4920-a42c-4688523f0dfe"></span><h1 class="title">universal property of a delta n</h1>

<h2 id="proposition">Proposition</h2>
<p>
Given <a href="20240128-category_sset.html#ID-e9c2723a-dd7e-48df-84af-05e865106a54">category sSet</a>, there exists a a natural bijection
</p>

<div class="math-block">\begin{align*}
\mathrm{Hom}_{\mathrm{sSet}}(\Delta^n, X) \simeq X_n
\end{align*}</div>

<p>
where $X_n$ is the set of <a href="20240128-set_of_n_simplices.html#ID-aca7dc6e-27f0-4de2-85f2-a5e375540215">n-simplices</a>
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of
<a href="20240102-natural_transformation_from_contravariant_hom_functor_as_precomposition.html#ID-2879cce2-1bea-4614-8e01-601c41b997bc">contravariant Yoneda Lemma</a>
</p>
