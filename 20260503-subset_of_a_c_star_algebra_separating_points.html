<span id="ID-ad86aee0-3fc5-45d8-9fff-50ed8c63a742"></span><h1 class="title">subset of a C-star algebra separating points</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $B \subseteq C(X)$ a subset.
Then $B$ separates points in $X$, if for every pair of distinct points $x,y$ in $X$, there exists a function $f$ with $f(x) \neq f(y)$.
</p>
