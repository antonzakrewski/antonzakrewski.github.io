<span id="ID-d0b5aab9-e9d9-40c1-9807-3a8bfe0bb8cd"></span><h1 class="title">Milnor Axiom for Homology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X_{i}$ be a <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">family</a> of <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>, then it holds for the homology functor
</p>

<div class="math-block">\begin{align*}
H_n(\coprod X_i, \emptyset) \cong \bigoplus_{i} H_n(X_i, \emptyset)
\end{align*}</div>
