<span id="ID-1db23977-36ae-4dba-83d4-4a5962ec72a6"></span><h1 class="title">orientation reversing map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M, \sigma),(N, \tau)$ be <a href="20240613-orientation_of_a_manifold.html#ID-015ad7ba-6538-407f-9593-139399f789f6">oriented</a> \(n\)-dimensional <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">Manifolds</a>.
Then a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $f: M \rightarrow N$ is said to be order reversing, if
</p>

<div class="math-block">\begin{align*}
f(\sigma_{x}) = -\tau_{f(x)}
\end{align*}</div>


</div>
