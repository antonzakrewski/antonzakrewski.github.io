<span id="ID-8a7fc05b-7ce5-47d2-8cc7-87a31f90b066"></span><h1 class="title">regular scheme</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a> is called regular, if it is <a href="20260720-noetherian_scheme.html#ID-09bb2763-9378-4616-a138-dbd62d99bf39">noetherian</a> and for each point $x \in \vert X \vert$, the <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a> $\mathcal{O}_{X,x}$ is a <a href="20240707-regular_local_ring.html#ID-a8f34b67-a907-470f-8f04-e9fe438080fa">regular local ring</a>.
</p>
