<span id="ID-38d3d730-4558-48bc-a907-ab9c6e9ca533"></span><h1 class="title">Union of multiple sets</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $N_j \subseteq M$, $j \in J$ und $J$ eine <a href="20221009193146-indexmenge.html#ID-e6a8afd0-169d-4286-9d21-d170d12af180">Indexmenge</a>.
Dann ist der Schnitt von $N_j$ definiert als
</p>

<div class="math-block">\begin{align*}
\cup_{j \in J} N_j = \{m \in M \vert \exists j \in J : m \in N_j\}
\end{align*}</div>
