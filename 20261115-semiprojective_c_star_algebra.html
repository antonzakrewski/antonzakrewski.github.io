<span id="ID-5dd4581f-27f0-477e-b75a-e4f5f1c1b834"></span><h1 class="title">semiprojective c star algebra</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20261022-c_star_algebra.html#ID-6d7e5583-c3c1-4165-b589-78e1d42c0420">C star algebra</a> $D$ is called semiprojective, if for every $C^*$ algebra $B$ and every increasing net of closed two sided ideals $J_i$ and $J = \bigcup_{ \overline{i \in I} J_i}$, every homomorphism $D \rightarrow B/J$ lifts to some $B/J_i$.
</p>
