<span id="ID-02475589-5b10-4909-a5ef-7da6dc479912"></span><h1 class="title">singular cohomology ring of the sphere</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $S^n$ be the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">n-sphere</a>, then the <a href="20240528-singular_cohomology_algebra_functor.html#ID-b8ba0340-46d1-4776-af49-535d855627a0">singular cohomology ring</a> is given by the <a href="20240529-exterior_algebra.html#ID-ea8c2948-cd3c-42a7-8032-406989241f81">exterior algebra</a>
</p>

<div class="math-block">\begin{align*}
H^*(S^n) \ismeq \Lambda(x)
\end{align*}</div>
<p>
for $\vert x \vert = n$
</p>
