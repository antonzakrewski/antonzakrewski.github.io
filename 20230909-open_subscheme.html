<span id="ID-d5d26a4c-5f81-4c3f-9588-11fa4e53330f"></span><h1 class="title">open subscheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_X, O_i)$ be a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a>.
An open subscheme of $X$ is a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a> $(U, \mathcal{O}_U, U_i)$ which is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> to $(O, \mathcal{O}_O, (O_i \cap O)$, where $O$ is an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> and $\mathcal{O}_O$ is the <a href="20230909-restriction_of_a_sheaf.html#ID-b92f2e42-7556-43b1-95ba-66f0431fd2d7">restriction</a>
</p>
