<span id="ID-e9f7fbe0-d3b7-485a-a12b-9c87d1e0d87c"></span><h1 class="title">multiplicatively closed set as monoid</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $S \subseteq A$ be a <a href="20230724-multiplicatively_closed_set.html#ID-d3df0441-9f2f-476f-b18e-d513ae149906">multiplicatively closed</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>.
then $S$ is a multiplicative <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from closedness under multiplication and inheritance of associativity
</p>
