<span id="ID-f319a9f2-8e04-43ab-81b1-cc25c19f1a3e"></span><h1 class="title">additively symmetric monoidal category</h1>

<h2 id="definition">Definition</h2>
<p>
A stably monoidal infinity category is an <a href="20241217-additive_infinity_category.html#ID-e168d6e3-8dc6-424e-a950-8b24f6ed45f8">additive</a>  <a href="20250307-symmetric_monoidal_infinity_category.html#ID-40c08a37-68ce-4dc1-8647-31caa12e9598">symmetric</a> <a href="20250306-monoidal_infinity_category.html#ID-4b1bd9a8-674e-47cd-bfff-f5af725c95ab">monoidal infinity category</a> $\mathcal{C}, \otimes$ where the tensor product is <a href="20250616-additive_infinity_functor.html#ID-c4d788ac-1077-4e55-8b41-3691c39f38bb">additive</a> in in each variables.
</p>
