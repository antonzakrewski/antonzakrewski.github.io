<span id="ID-d8735ca7-350b-43ac-8274-2ce5f094820d"></span><h1 class="title">weakly terminal infinity object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> and $x \in \mathcal{C}_0$ an object.
Then $x$ is said to be weakly terminal, if for each object $s \in \mathcal{C}_0$ the <a href="20240603-mapping_space_of_objects_in_a_quasi_category.html#ID-b5b60979-1586-4548-b06f-5ceca4b045fa">mapping space</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{map}_{\mathcal{C}}(s,x)
\end{align*}</div>
<p>
is not <a href="20240624-initial_simplicial_set.html#ID-499255b5-d636-47eb-8c31-eb224cfc1882">empty</a>
</p>
