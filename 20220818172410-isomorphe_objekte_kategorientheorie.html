<span id="ID-8dd8d458-cca4-4a45-a9b4-6c62821088c4"></span><h1 class="title">Isomorphe Objekte (Kategorientheorie)</h1>

<h2 id="definition">Definition</h2>
<p>
Zwei <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">Objekte</a> $A_1, A_2$ sind isomorph, sofern es <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">Morphismen</a> $f_{12} : A_1 \rightarrow A_2$ und $f_{21}: A_2 \rightarrow A_1$
</p>

<div class="math-block">\begin{align*}
f_{21} \circ f_{12} = id_{A_1} \\
f_{12} \circ f_{21} = id_{A_2}
\end{align*}</div>
