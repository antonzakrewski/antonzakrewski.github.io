<span id="ID-ac7c2d96-3e72-4fda-8989-011ea98f5893"></span><h1 class="title">good open cover</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $U_i$ an <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open cover</a>.
Then $U_i$ is said to be a good open cover if all <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> ($n \geq 1$) <a href="20230317161158-allgemeiner_schnitt.html#ID-d7547939-8d3f-48f8-b2fd-cfb5734ae78f">intersections</a> $\bigcup_{i=1}^n U_i$ are either <a href="20211226215449-leere_menge.html#ID-abf22513-8cde-4019-8690-8b02edd4337d">empty</a> or <a href="20240703-contractible_simplicial_set.html#ID-5db3dfcd-9f98-41a8-9550-a49351d833cf">contractible</a>
</p>
