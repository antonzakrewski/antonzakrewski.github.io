<span id="ID-1fe94a80-d060-40c2-8154-d6a130dd9160"></span><h1 class="title">Sorgenfrey-Gerade als erstabzählbarer Raum</h1>

<h2 id="satz">Satz</h2>
<p>
Die <a href="20230401154949-lower_limit_topology.html#ID-a879df90-f12e-4460-b9ff-f1b4831a84aa">Sorgenfrey-Gerade</a> $\mathbb{R}$ ist <a href="20230211132406-erste_abzahlbarkeitsaxiom.html#ID-8ec08cf5-0668-49c6-a8f3-7ec959f31636">erstabzählbar</a>.
</p>

<h2 id="beweis">Beweis</h2>
<p>
Sei $x \in \mathbb{R}$, so ist $[x, \frac{1}{n} x)$ eine <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">abzählbar</a> <a href="20230211132320-umgebungsbasis.html#ID-24c84114-5d59-4fa3-87fb-10baabcc5faa">Umgebungsbasis</a>
</p>
