<span id="ID-36d4955e-8f90-4fdb-a676-6e43c942859b"></span><h1 class="title">filtration of a representation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> $A$ representation.
Then a filtration of $V$ is a finite filtered object $0 = V_0 \subseteq V_1 ... \subseteq V_n = V$ such that each <a href="20230914-quotient_object.html#ID-4ba8c757-1b9f-472c-bb28-c54df04b26cb">quotient</a> is a <a href="20261013-irreducible_representation_of_an_algebra.html#ID-d63374c8-6c64-4ee3-bc2b-bd75c8272d12">simple representation</a>
</p>
