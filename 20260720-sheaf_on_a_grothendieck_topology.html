<span id="ID-6aa8bbd3-b259-4c58-b9e6-7c22333ad318"></span><h1 class="title">sheaf on a grothendieck topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $\tau$ a <a href="20240905-topology_on_a_category.html#ID-1d3088ed-8349-4321-bc74-474deaece4b1">topology on a category</a>.
Then a <a href="20241021-infinity_presheaf.html#ID-463d818a-2c01-4c74-a241-fd6db6e244fd">presheaf</a> is a \(\tau\)-sheaf, if it <a href="20250831-descent_of_a_presheaf.html#ID-cd6e7dc2-9935-4c5f-8793-0ff22b2048e2">satisfies descent with respect to all sieves</a>
</p>
