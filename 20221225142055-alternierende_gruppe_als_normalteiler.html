<span id="ID-f029ec2e-0a8a-460a-9e79-4d0b4fc6cc47"></span><h1 class="title">Alternierende Gruppe als Normalteiler</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $n \geq 2$, $S_n$ die <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">Symmetrische Gruppe</a> und $A_n$ die <a href="20221225141902-alternieredne_gruppe.html#ID-d4aeb80b-33a1-4ae6-a923-8437f50d7cf3">Alternierende Gruppe</a>.
dann gilt:
</p>

<div class="math-block">\begin{align*}
A_n \trianglelefteq S_n
\end{align*}</div>
