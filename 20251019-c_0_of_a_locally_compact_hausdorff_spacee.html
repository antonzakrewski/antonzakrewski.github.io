<span id="ID-a90a01c3-e4a4-45eb-80f8-0f0e548ad768"></span><h1 class="title">C_0 of a locally compact hausdorff space</h1>

<h2 id="definition">Definition</h2>

<div class="math-block">\begin{align*}
C_0(X) \coloneqq \{f: X \rightarrow \mathbb{C} \vert \text{ continuous and } \forall \varepsilon &gt; 0 f^{-1}[\mathbb{C} \setminus B_{\varepsilon}(0)] \subseteq K \text{ for some compact } K \subseteq X\}
\end{align*}</div>
