<span id="ID-f4fccb2e-3fc5-4dab-b39d-6cf8014d6ad6"></span><h1 class="title">subbundle of a topological vector bundle</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: E \rightarrow B$ be a <a href="20230905-topological_vector_bundle.html#ID-821f2fea-f858-4555-ae30-90ea23209a2e">topological vector bundle</a>.
Then a subbundle consists of a <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a> $E' \subseteq B$ such that
</p>

<div class="math-block">\begin{align*}
p_{\vert E'}: E' \rightarrow B
\end{align*}</div>
<p>
is also a vector bundle
</p>
