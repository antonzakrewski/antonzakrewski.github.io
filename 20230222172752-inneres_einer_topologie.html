<span id="ID-14daf62f-ca16-4f9a-a71f-a84e86b23c1c"></span><h1 class="title">interior of a topology</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $A \subseteq X$.
Dann ist das Innere $A^{\circ}$ von $A$ definiert als <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> aller <a href="20230222172815-innerer_punkt_topologischer_raum.html#ID-47791b32-716b-4159-94e7-31c4f0b9e4cd">innerer Punkte</a>
</p>

<div class="math-block">\begin{align*}
\{a \in X \vert A \in \mathcal{U}(a) \} =&amp; \{a \in A \vert A \in \mathcal{U}(a) \} 
\end{align*}</div>
