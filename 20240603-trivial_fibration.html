<span id="ID-e6f29863-7f0d-4ac3-aa0b-f3d104146c24"></span><h1 class="title">trivial fibration between simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A,B$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $f: A \rightarrow B$ a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>.
Then $f$ is said to be a trivial fibration, if it has the <a href="20240327-right_lifting_property.html#ID-d782de36-512e-44c3-8cbc-1106a79a58a6">right lifting property</a> withr respect to <a href="20240129-boundary_of_a_simplicial_object.html#ID-ce2392e6-1259-4e44-879f-76b3c4f910ba">boundary</a> inclusions
</p>
