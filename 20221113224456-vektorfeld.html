<span id="ID-4ba13abc-c766-4899-bdb9-b74c537d86d2"></span><h1 class="title">smooth vector field</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>.
Then a smooth vectorfield is a <a href="20231210-section_category_theory.html#ID-8405819a-ec18-4a66-a354-b19f98b61fbf">section</a> (of course <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth</a>)
</p>

<div class="math-block">\begin{align*}
p: M \rightarrow \mathrm{TM}
\end{align*}</div>
<p>
of the <a href="20250917-tangent_bundle_functor.html#ID-e0b9c376-8c48-41d6-80b7-11b372e6f8f6">smooth tangent bundle functor</a>
</p>
