<span id="ID-94876ece-4021-4c66-bc85-52e2cb7c7429"></span><h1 class="title">preregular space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
$X$ is a preregular space, if two <a href="20230320211013-topologisch_unterscheidbare_punkte.html#ID-c203e63d-59c8-4a4a-8966-95f9f66718fe">topologically distinguishable</a> points have <a href="20211226220255-disjunkte_mengen.html#ID-2000e1f4-7e9e-45f9-91ed-16ded8a15190">disjoint</a> <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhoods</a>
</p>
