<span id="ID-7428dc84-9acd-49bc-8e93-b1541326a6b9"></span><h1 class="title">functor between infinity categories</h1>

<h2 id="definition">Definition</h2>
<p>
A functor between <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> is a <a href="20220821182915-naturliche_transformation_kategorientheorie.html#ID-4e6e50c0-c0df-44ff-a140-bebfa492ef7e">natural transformation</a> between the <a href="20240422-quasicategory.html#ID-004ed508-3a84-4869-b5e6-618763186c2b">quasicategories</a>, regarded as <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functors</a> $\Delat^{\mathrm{op}} \rightarrow \mathrm{Set}$, i.e. a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>
</p>
