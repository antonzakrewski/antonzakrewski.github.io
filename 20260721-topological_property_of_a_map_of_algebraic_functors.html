<span id="ID-b26c903a-4651-49ef-8ef7-3415421e315d"></span><h1 class="title">topological property of a map of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $P$ be a <a href="20260802-property_in_a_category.html#ID-bd04268c-9bb1-4e3e-a384-1bb0bcd4b7da">property</a> in $\mathrm{Ar}(\mathrm{Top})$ the <a href="20230403183725-arrow_category.html#ID-0554b693-0143-4f63-be7a-4a7af587c98b">arrow category</a> of <a href="20230225170221-kategorie_top.html#ID-55f8744f-3e21-4c41-889f-06a52add975b">category Top</a>.
Then a morphism of algebraic functor $f: X \rightarrow Y$ has the property $P$ if the map on <a href="20260721-underlying_space_functor_from_algebraic_functors.html#ID-b14d9467-5141-4162-b38a-8278e51860b0">underlying spaces</a> has the property $P$.
</p>
