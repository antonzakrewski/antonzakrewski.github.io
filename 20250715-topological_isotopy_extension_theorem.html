<span id="ID-a3555874-fc0d-4beb-b2ed-aecdf19fd9b3"></span><h1 class="title">topological isotopy extension theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M,W$ be <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">topological manifolds</a> and $K \subseteq W$ a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> <a href="20230724-untermannigfaltigkeit.html#ID-4cbfea3f-6f77-453a-b018-e39f14e31af2">submanifold</a>
Then the restriction map
</p>

<div class="math-block">\begin{align*}
\mathrm{Emb}^t(W,M) \rightarrow \mathrm{Emb}^t(K,M)
\end{align*}</div>
<p>
is a <a href="20240702-serre_fibration.html#ID-b429be95-8451-46cb-8c4f-7e1be057a766">serre fibration</a>
</p>

<p>
see: <a href="20250625-continuous_embedding_space.html#ID-2bd7797c-f5f6-47d3-90fa-8d17d0e89645">continuous embedding space</a>
</p>
