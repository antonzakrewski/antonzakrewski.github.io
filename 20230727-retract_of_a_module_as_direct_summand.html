<span id="ID-0b9b5b51-a4e6-43b5-8182-813c089b9163"></span><h1 class="title">retract of a group as direct summand</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $H \subseteq G$ a <a href="20230727-retract_group_theory.html#ID-ce5765c3-03d7-44f5-873d-ec30d79c8155">retract</a>.
Then there exists an <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a> $H' \subseteq G$ such that
</p>

<div class="math-block">\begin{align*}
G = H \oplus H'
\end{align*}</div>
