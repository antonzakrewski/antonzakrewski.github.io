<span id="ID-2d9f2ebd-c68a-4b8e-a59f-4a5d4f6656d9"></span><h1 class="title">algebraically independent</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $B$ an <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">A-Algebra</a> and $T \subseteq B$.
Then $T$ is said to be algebraically independent, if the <a href="20221226010643-einsetzungshomomorphismus.html#ID-714a456e-dcd8-4e03-906b-2b497bf77766">evaluation homomorphism</a>
</p>

<div class="math-block">\begin{align*}
\varphi: A[X_t \vert t \in T] \rightarrow&amp; B
\end{align*}</div>
<p>
is a <a href="20230301165850-ringmonomorphismus.html#ID-f893fb26-272b-41b0-8943-52596b2804ba">monomorphism</a>
</p>
