<span id="ID-37184a35-721f-4108-85d9-c78d66ad615a"></span><h1 class="title">komplexwertig integrierbare Abbildung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{A}, \mu)$ ein <a href="20241019-maßraum.html#ID-2135bec8-c3bb-4fca-a24a-21334f66d7ae">Maßraum</a>, $f: X \rightarrow \mathbb{C}$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
Dann ist $\mu$ komplexwertig messbar, falls $\mathrm{Re} \circ f, \mathrm{Im} \circ f$ <a href="20221014122223-lebesgue_integrierbar.html#ID-256bdd18-94ed-434b-9847-bee1c2965eaf">lebesgue integrierbar</a> ist.
</p>
