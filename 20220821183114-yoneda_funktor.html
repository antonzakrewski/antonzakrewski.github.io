<span id="ID-19d8c3f0-cdaf-4770-91df-251aa8e441c4"></span><h1 class="title">Yoneda-Funktor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220819181004-kleine_kategorie.html#ID-3c3f1c0d-53ad-476e-810a-756acd885263">small</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then the Yoneda-Functor is the functor
</p>

<div class="math-block">\begin{align*}
\mathrm{Yon}: \mathcal{C} \rightarrow&amp; \mathrm{Fun}(\mathcal{C}^{\mathrm{op}}, \mathrm{Set}) \\
X \mapsto&amp; \mathrm{Hom}_{\mathcal{C}}(-, X)
\end{align*}</div>
<p>
see <a href="20220825194828-funktorkategorie.html#ID-39ebe96a-b96d-4a11-8642-30527c1b92ea">functor category</a> /
</p>
