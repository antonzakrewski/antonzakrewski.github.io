<span id="ID-88214768-ec2d-4dbc-b207-f705e321134f"></span><h1 class="title">signature of 4n sphere</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20240625-signature_of_a_oriented_4n_manifold.html#ID-acc5728c-b18c-421a-b8b7-aef53f43eb18">signature of</a> the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">4n-sphere</a> is the zero morphism
</p>

<h2 id="proof">Proof</h2>
<p>
follows as
</p>

<div class="math-block">\begin{align*}
H_{2n}(S^4n) = 0
\end{align*}</div>

<p>
showing that
</p>

<div class="math-block">\begin{align*}
0 \simeq H_{2n}(S^4) \otimes H_{2n}(S^4) \otimes \mathbb{R} \rightarrow&amp; \mathbb{Z}
\end{align*}</div>
