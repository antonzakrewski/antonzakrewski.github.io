<span id="ID-ab0e15fa-8d67-43c1-bdca-ece986308a29"></span><h1 class="title">Produkterhaltende Abbildung als Monomorphismus</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $V,W$ <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilberträume</a> und $A: V \rightarrow W$ eine <a href="20230628-produkterhaltende_abbildung.html#ID-4353d871-33f0-4dc8-b56c-6d6f51c64671">Produkterhaltende Abbildung</a>.
Dann ist $A$ ein <a href="20230303151658-vektorraummonomorphismus.html#ID-f0288756-d404-4cf9-8f45-508ac443d32c">Vektorraummonomorphismus</a>.
</p>

<h2 id="beweis">Beweis</h2>
<p>
Sei $v \in \mathrm{ker}(A)$, so gilt
</p>

<div class="math-block">\begin{align*}
 \| v \| \\ =&amp; \| Av \| \\
=&amp; 0
\end{align*}</div>
