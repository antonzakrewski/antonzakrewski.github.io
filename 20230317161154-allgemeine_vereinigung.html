<span id="ID-69c0d505-311b-4ea6-a337-8450d6529d02"></span><h1 class="title">allgemeine Vereinigung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(A_i)_{i \in I}$ eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a> von <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> über einer <a href="20220903142722-grundmenge.html#ID-2b5bcaae-5d96-4b8b-b31d-b77527fe22d3">Grundmenge</a> $M$, d.h. $A_i \subseteq M$ so ist die allgemeine Vereinigung definiert als:
</p>

<div class="math-block">\begin{align*}
\bigcup_{i \in I} A_i = \{m \in M \vert \exists i \in I : m \in A_i\}
\end{align*}</div>
