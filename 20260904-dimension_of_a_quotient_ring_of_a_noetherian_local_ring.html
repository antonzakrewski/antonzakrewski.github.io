<span id="ID-c5be9879-fe63-44de-b21d-b218915f987f"></span><h1 class="title">dimension of a regular quotient ring of a noetherian local ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian</a> <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a> $R$ and $(f_1,...,f_n)$ a sequence in $\mathfrak{m}$.
Then $\mathrm{dim}(R/(f_1,...,f_n)) = \mathrm{dim}(R) - n$.
</p>
