<h2 id="definition">Definition</h2>
<p>
Let $X_i$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> for $i \in I$, then the disjoint union is defined as
</p>
