<span id="ID-4f46b1ac-5aa1-44f1-931e-3ef1b5ec2053"></span><h1 class="title">monomorphism locus is an open subfunctor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $f: M \rightarrow N$ a map of \(A\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">modules</a>.
Suppose that $N,M$ are <a href="20260612-vector_bundle_over_a_ring.html#ID-12c6e13e-440a-4d54-b689-c17c1850f0fc">vector bundles</a>, then the <a href="20260719-monomorphism_locus_of_a_map_of_a_modules.html#ID-e007f59e-9845-4013-837f-bdcd5cf683e4">monomorphism locus</a> $V(f) \subseteq \mathrm{Spec}(A)$ is an <a href="20260713-open_subfunctor_of_an_algebraic_functor.html#ID-3591ec98-a7a9-4668-a975-fdf935c815e8">open subfunctor</a>
</p>
