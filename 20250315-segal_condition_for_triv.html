<span id="ID-1e4f30f4-6ec8-4aca-9682-fd6f1a09fff9"></span><h1 class="title">segal condition for Triv</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: N(\mathrm{Triv}) \rightarrow \mathcal{C}$ be an <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">infinity functor</a>.
Then $p$ satisfies the segal condition, if the <a href="20250314-projection_morphism_in_fin.html#ID-c1618098-a44a-4623-851a-9d22b83eb03c">projection morphisms</a> induce an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>

<div class="math-block">\begin{align*}
\mathcal{C}[n] \rightarrow \prod_{i=1}^n \mathcal{C}[1]
\end{align*}</div>
