<span id="ID-fe169bc0-e94e-44e9-99e8-7b0dbc74a9f6"></span><h1 class="title">Normalenform: Punkt auf einer Ebene</h1>

<h2 id="satz">Satz</h2>
<p>
Ein <a href="20220210092817-punkt.html#ID-913dde3e-0d27-4b76-b5fe-adc0922e64e0">Punkt</a> $\vec{P} = \begin{pmatrix} p_1 \\ p_2 \\ p_3 \end{pmatrix}$ liegt genau dann auf einer <a href="20220102143805-ebene.html#ID-9910f26c-7642-4457-a277-fff78834421c">Ebene</a> $E  \coloneqq (\vec{A}, \vec{n})$ in <a href="20220214124828-normalenform_darstellung_einer_ebene.html#ID-fdb46612-81b5-461c-834e-b507814f44e6">Normalenform</a> , wenn gilt:
</p>

<div class="math-block">\begin{align*}
\left(\vec{P} - \vec{A} \right) \circ \vec{n} = 0
\end{align*}</div>
