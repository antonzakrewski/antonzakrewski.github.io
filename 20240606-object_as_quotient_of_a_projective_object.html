<span id="ID-58aaf22c-0b3f-4803-9667-5c2d0edd7898"></span><h1 class="title">object as quotient of a projective object</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> admitting <a href="20231212-enough_projectives.html#ID-8699327b-1cf6-41fc-9eda-522460057625">enough projectives</a>
Then each <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $A \in \mathrm{Ob}(\mathcal{A})$ is a <a href="20240327-quotient_object_in_an_abelian_category.html#ID-c45e1e9f-b2c1-439e-8f5c-48ad417670ab">quotient object</a> of a <a href="20230727-projective_object.html#ID-605bb0c6-3cb5-44d6-bb3e-660f0fef14d1">projective</a>
</p>
