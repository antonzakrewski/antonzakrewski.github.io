<span id="ID-ee503b28-03a0-4ecd-949b-82eb53c76f3a"></span><h1 class="title">large category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\lambda$ be a <a href="20230923-inaccessible_cardinal.html#ID-2332c906-78f1-4512-9d94-7a59453b52e4">inaccessible cardinal</a>.
Then a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> $\mathcal{C}$ is said to be \(\lambda\)-large, if
</p>
<ol>
<li>$\vert \mathrm{Mor}(\mathcal{C}) \vert \leq \lambda$</li>

<li>$\vert \mathrm{Ob}(\mathcal{C}) \vert \leq \lambda$</li>
</ol>
