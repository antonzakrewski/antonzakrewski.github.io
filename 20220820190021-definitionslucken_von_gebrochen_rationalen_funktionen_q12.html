<span id="ID-dc4da267-cdd4-498b-a606-d9ae9f739f50"></span><h1 class="title">Definitionslücken von gebrochen rationalen Funktionen (Q11)</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $f(x) = \frac{p(x)}{q(x)}$ eine <a href="20220102212658-definition_gebrochen_rationale_funkttionen.html#ID-1b393d0a-c72b-48ef-93c5-d28b8924d63b">gebrochen rationalen Funktionen</a>.
Dann sind die <a href="20210217182414-definitionsluecken.html#ID-9b684639-61bc-4e2f-95d8-33703fe98c3e">Definitionslücken</a> genau die <a href="20220320113706-nullstelle.html#ID-b094e637-5f3c-42a2-a2c2-ae73bbbe29a2">Nullstellen</a> des <a href="20220820190234-nennerpolynom.html#ID-0fa87e2d-0c0a-44aa-a0e7-258e1204c6a4">Nennerpolynoms</a>, bedingt durch <a href="20220122162648-division_durch_null.html#ID-040cd49f-94c4-4075-9645-db9c377ffc11">Division durch Null</a>
</p>
