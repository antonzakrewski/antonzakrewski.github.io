<span id="ID-d4116c44-e0f9-4f13-8b0b-3c3cd0ecfbb7"></span><h1 class="title">direct product of modules</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $(M_i)_{i \in I}$ eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a> von <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Moduln</a>.
Dann ist das direkte Produkt definiert als kartesische Produkt $\prod_{i \in I} M_i$
</p>

<p>
Dabei ist die <a href="20221106145934-vektoraddition.html#ID-c6777ed8-3226-470d-b58c-471165f21783">Vektoraddition</a> und die <a href="20221106150206-skalarmultiplikation.html#ID-de889a87-12eb-4fc5-b2b8-08b71c449885">Skalarmultiplikation</a> komponentenweise definiert.
</p>
