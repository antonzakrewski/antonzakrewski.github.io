<span id="ID-dbbbb6b8-da82-4e23-a5c9-07ec3bcd254a"></span><h1 class="title">pullback of a monomorphism is a monomorphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let
</p>

<div class="equation-container"><span class="equation"><img src="ltximg/8fc849a7e17f7c2984e4.svg" class="org-svg" alt="diagram" /></span></div>
<p>
be a <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a> diagram, where $f: x \hookrightarrow y$ is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> .
</p>

<p>
Then $f: x' \rightarrow y'$ is also a monomorphism.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the diagram
</p>

<div class="equation-container"><span class="equation"><img src="ltximg/7ad33028c63c24778124.svg" class="org-svg" alt="diagram" /></span></div>
<p>
plus applying <a href="20250121-glueing_lemma_for_infinity_pullbacks.html#ID-6626a145-a80b-42f9-90d1-fcd32579aeaf">glueing lemma for pullbacks</a> and <a href="20250121-window_lemma_for_infinity_pullbacks.html#ID-c78e0c21-f4a3-413c-af76-dd8955e88a04">pasting lemma for pullbacks</a>.
</p>
