<span id="ID-1b2a4c05-8059-4595-abf2-67dfe1fd9605"></span><h1 class="title">bounded p-torsion spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectrum</a>.
Then $X$ is said to be a bounded \(p\)-torsion spectrum, if each $\pi_n(M)$ is a <a href="20260531-bounded_p_torsion_module.html#ID-83655151-ea45-449a-b367-efa3318bdb54">bounded p-torsion</a> <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
</p>
