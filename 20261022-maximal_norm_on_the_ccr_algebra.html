<span id="ID-235a8c87-4ce1-473f-bd5c-47790f5dd717"></span><h1 class="title">maximal seminorm on the CCR algebra</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be the <a href="20261022-ccr_algebra.html#ID-ad15ed3e-6ab8-450b-9cb5-c90544947063">CCR Algebra</a>.
Then the <a href="20261019-maximal_norm_of_a_star_algebra.html#ID-0181d76a-2bc8-4f1e-ae09-29a31a393131">maximal norm</a> on $A$ vanishes.
</p>

<h2 id="proof">Proof</h2>
<p>
Observe that $[p,q^n]  = \pm i q^{n-1}$.
</p>
