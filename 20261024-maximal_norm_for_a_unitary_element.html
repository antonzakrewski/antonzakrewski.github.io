<span id="ID-5d4fade2-5266-4cb6-a9e6-4d60a89b0aad"></span><h1 class="title">maximal norm for a unitary element</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20261019-nonunital_star_algebra.html#ID-0e4fad4a-8cf9-4d8a-965a-59c8a1c5171d">nonunital star algebra</a> and $u$ a <a href="20261012-unitary_element.html#ID-11f0f6b8-4173-46e3-98ac-9efe91207fd3">unitary element</a>.
Then $\| u \|_{\mathrm{max}} \leq 1$.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the  <span class="broken-link" title="unresolved id:af022640-b719-4aef-b363-4eb144c86dfd">c star identity</span> in $\mathcal{B}(H)$.
</p>
