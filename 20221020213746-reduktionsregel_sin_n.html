<span id="ID-7c9e6173-98f8-4090-a5ac-81885c6b4aaf"></span><h1 class="title">Reduktionsregel $\sin^n$</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\int_{}^{} \sin(x)^n \mathrm{d}x  =&amp; \frac{n - 1}{n} \int_{}^{} \sin(x)^{n - 2} \mathrm{d}x - \frac{\cos(x)\sin(x)^{n-1}}{n} 
\end{align*}</div>
