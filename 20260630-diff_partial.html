<span id="ID-35bfd120-c1a4-4dfc-9c15-40d60dcdfad8"></span><h1 class="title">Diff partial</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>.
Then $\mathrm{Diff}_{\partial}(M) \subseteq \mathrm{map}_{C^{\infty}}(M,M)$ is the <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a> (<a href="20250715-whitney_c_star_topology.html#ID-cf23cd59-3731-43e0-9c9e-113b3f175390">Whitney C infinity topology</a>)  of <a href="20230301205440-diffeomorphismus.html#ID-573a56f9-0240-4c4a-a241-ee598afdd9f5">diffeomorphisms</a>, which fix a <a href="20240625-collar_neighbourhood.html#ID-a3f75f32-fa84-4cf0-9c3b-4c888c2ed6c9">collar neighbourhood</a> of the <a href="20230222175154-rand_in_einer_topologie.html#ID-64116a9b-5bef-479f-8df7-b8edd8d49baa">boundary</a>  .
</p>
