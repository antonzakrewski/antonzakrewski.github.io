<span id="ID-8c9ce5d9-9e6f-4251-8740-8e7377bcbbd5"></span><h1 class="title">inner automorphism group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
The inner automorphism group is the <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a> of the <a href="20230302210538-automorphismengruppe.html#ID-ad2bea99-3395-41e7-84ca-c93a1fc0efab">automorphism group</a> $\mathrm{Aut}(G)$ containing only <a href="20231031-inner_automorphism.html#ID-d852c34a-c069-41ae-8a74-73a365b544f3">inner automorphisms</a>
</p>
