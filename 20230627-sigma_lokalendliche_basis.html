<span id="ID-6fd9e1d8-1a41-4431-ad26-4637a1da8044"></span><h1 class="title">sigma lokalendliche Basis</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $\mathcal{B}$ eine <a href="20221030151204-basis_vektorraum.html#ID-4b0d1e47-5503-4b26-9ab3-a142097c2624">Basis</a>.
Dann ist $\mathcal{B}$ eine sigma-lokalendliche Basis, falls $\mathcal{B}$ <a href="20230627-sigma_lokalendlich.html#ID-a2cf2bf5-51e9-4a37-9281-de5d9c2f8b4f">sigma lokalendlich</a> ist.
</p>
