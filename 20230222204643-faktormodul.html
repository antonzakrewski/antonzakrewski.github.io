<span id="ID-9f848ff8-95b8-4f0b-ad74-7997012399a0"></span><h1 class="title">quotient module</h1>

<h2 id="definition-satz">Definition / Satz</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $M$ ein $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a> und $N$ ein <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">Untermodul</a>.
Dann ist das Faktormodul $M/N$ definiert als <a href="20221210201536-faktorgruppe.html#ID-37068c77-35dd-45c0-8051-01704f97222c">Faktorgruppe</a> $M/N$ mit der Multiplikation:
</p>

<div class="math-block">\begin{align*}
r \cdot (m + N) = rm + N
\end{align*}</div>
<p>
siehe auch: <a href="20230314184007-faktormodul_als_modul.html#ID-8620e5c0-c473-48f9-bbd4-33b87f77e49e">Faktormodul als Modul</a>
</p>
