<span id="ID-33fa0f34-1ff9-4da3-b015-b1343aaa1fdf"></span><h1 class="title">cauchy estimate</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: D_{R}(z_0) \rightarrow \mathbb{C}$ be <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic</a>, then for all $n \in \mathbb{N}_0$ and $r &lt; R$
</p>

<div class="math-block">\begin{align*}
\vert f^{n}(z_0) \vert \leq \frac{n!}{r^n} \mathrm{sup}_{z \in C_r(z_0)} \vert f(z) \vert
\end{align*}</div>
