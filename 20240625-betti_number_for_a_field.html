<span id="ID-34d44405-2720-4787-9f06-6ef93a1407aa"></span><h1 class="title">betti number for a field</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240223-homologically_finite_topological_space.html#ID-b3b41cef-afdf-4070-ba0a-3fd50cd32fd2">homologically finite topological space</a> and $K$ a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>
Then the \(n\)-th betti number is defined as <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimension</a> of the <a href="20230817-homology_functor.html#ID-c35a52a1-7174-408f-8480-9746e1c374bc">homology</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{dim}(H_n(X;K))
\end{align*}</div>
<p>
with coefficients in $K$
</p>
