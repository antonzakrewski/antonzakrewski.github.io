<span id="ID-663060d5-07ae-4dfc-b5d3-ed866fa75bdc"></span><h1 class="title">connected category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{C}$ is said to be connected, if for <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> $A,B \in \mathrm{Ob}(\mathcal{C})$ there exists a <a href="20231111-zigzag.html#ID-8ed3d733-f4b9-4660-bf45-553c1d886032">zigzag</a> from $A$ to $B$
</p>
