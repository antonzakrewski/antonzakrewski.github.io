<span id="ID-08f3b0cb-d9f7-470d-9304-f1e2adb2812a"></span><h1 class="title">kappa small abelian groups is a serre class</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\kappa$ be a <a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinal</a>.
Then the category of $\kappa$ small <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a> is a <a href="20251027-serre_class.html#ID-affd7ccd-e9a4-46e3-85a3-d19b79e852e1">serre class</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as any extension $A \rightarrow B \rightarrow C$ is given by $A \times C$
</p>
