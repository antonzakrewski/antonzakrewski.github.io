<span id="ID-28fa4ab0-91e6-4044-bcdb-b90fb0f5a3dc"></span><h1 class="title">stratified space</h1>

<h2 id="definition">Definition</h2>
<p>
A stratified space is a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $X$ together with a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjection</a>
</p>

<div class="math-block">\begin{align*}
X \rightarrow P
\end{align*}</div>
<p>
to a <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">partially ordered</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> with the <a href="20230225212410-ordnungstopologie.html#ID-01b4bc63-62e3-4d71-9c78-1255941c1837">topology of a partial order</a>
</p>
