<span id="ID-a6603a8e-c953-4650-a2d0-6502a10f9891"></span><h1 class="title">refinement</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $\mathcal{A} := A_i \subseteq X$ be a <a href="20230227163531-uberdeckung.html#ID-804615a8-2307-4f8e-8f51-f4be70e817b3">Covering</a>.
A <a href="20230227163531-uberdeckung.html#ID-804615a8-2307-4f8e-8f51-f4be70e817b3">Covering</a> $\mathcal{B} := B_i \subseteq X$ is said to be a refinement, if for every $B_i$ there exists an $A_{j}$ such that:
</p>

<div class="math-block">\begin{align*}
B_i \subseteq A_j
\end{align*}</div>
