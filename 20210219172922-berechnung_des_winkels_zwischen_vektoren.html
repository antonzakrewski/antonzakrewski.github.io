<span id="ID-cc2d88d9-34da-4bc0-87ab-94c4446b3566"></span><h1 class="title">Schnittwinkel zwischen zwei Vektoren</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $\vec{a}$ und $\vec{b}$ <a href="20220917131559-vektor_q11.html#ID-bdf90627-1100-46eb-b3fa-077dd9dd456d">Vektoren</a>.
Der <a href="20220115224246-winkel.html#ID-621bc460-b78e-4dc9-81c1-3db0a8b55baa">Winkel</a> zwischen beiden ist dann:
</p>

<div class="math-block">\begin{equation}
    \gamma = \cos^{-1}\left(\left\frac{\vec{a}\circ\vec{b}}{|(\vec{a})| \cdot |(\vec{b})|}\right\right)
\end{equation}</div>
