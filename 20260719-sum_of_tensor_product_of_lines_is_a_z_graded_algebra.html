<span id="ID-dc680236-3535-4e9d-920f-a2dec1329eec"></span><h1 class="title">sum of tensor product of lines is a Z-graded algebra</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $L$ be a <a href="20260714-line_over_a_commutative_ring.html#ID-3d6d5fc6-574d-4bfb-b4d7-8ab9133a989a">line</a> over a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $k$, then
</p>

<div class="math-block">\begin{align*}
\bigoplus_{d \in \mathbb{Z}} L^{\otimes d}
\end{align*}</div>
<p>
is a <a href="20230920-z_graded_ring.html#ID-4ea98b68-3467-4060-a39a-78ebb40f5648">Z-graded algebra</a>.
</p>
