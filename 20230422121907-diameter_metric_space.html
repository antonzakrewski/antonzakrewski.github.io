<span id="ID-2feee508-fb83-4b80-9365-f6eed9de6952"></span><h1 class="title">diameter (metric space)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a> und $A \subseteq M$ <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nichtleer</a>, so ist der Durchmesser von $A$ definiert als:
</p>

<div class="math-block">\begin{align*}
\mathrm{diam}(A)  \coloneqq \sup \{d(a,a') \vert a,a' \in A\} \in [0, +\infty]
\end{align*}</div>
