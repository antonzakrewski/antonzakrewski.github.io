<span id="ID-e7d49d33-95a1-4c4e-b540-23a794cf78ac"></span><h1 class="title">algebraische Hodge Klasse</h1>

<h2 id="definition">Definition</h2>
<p>
Eine Hodge-Klasse $\alpha \in H^{c,c}(X, \mathbb{Z})$ heißt algebraisch, wenn es <a href="20230907-projective_subvariety.html#ID-a3b595d7-5ab1-47a5-acd3-27513791df4a">Untervarietäten</a> $Z_1,...,Z_r$ von Kodimension $Z$ und $k_1,...,k_r \in \mathbb{Z}$  mit $\alpha = \sum_{i=1}^{r} k_i[Z_i]$ gibt
</p>
