<span id="ID-3c26471f-b00b-4f48-b27a-a873f66bdbac"></span><h1 class="title">ω-accumulation point</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $S \subseteq X$.
A point $x \in X$ is a $\omega$-accumulation point of $S$ if for every <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $N \in \mathcal{N}(x)$ there exist <a href="20230826-infinite.html#ID-66aecdb2-720e-4e41-9a27-dab1700474fc">infinite</a> points $y \in N \cap S$
</p>
