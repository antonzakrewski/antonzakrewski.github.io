<span id="ID-b75ba96c-a2c2-4880-972a-61c2bd93289a"></span><h1 class="title">Normalenraum einer Untermannigfaltigkeit</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M \subseteq \mathbb{R}^d$ eine <a href="20241214-c_l_untermannigfaltigkeit_von_r_n.html#ID-b213538e-ad15-476b-838b-bca5966fcfc7">C^l Untermannigfaltigkeit von R^n</a> und $m \in M$
Dann ist der Normalenraum von $M$ in $m$ definiert als <a href="20230105092749-orthogonales_komplement.html#ID-e1d31ecf-7be2-4812-ba03-7145c5c0dbe8">orthogonales Komplement</a>
</p>

<div class="math-block">\begin{align*}
N_mM = (T_a M)^{\bot}
\end{align*}</div>
