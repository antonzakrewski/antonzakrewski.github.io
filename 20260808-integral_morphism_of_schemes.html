<span id="ID-c6b564c4-a949-42d0-86d9-c8d4bb7ff634"></span><h1 class="title">integral morphism of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a morphism of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>.
Then $f$ is said to be integral, if it is an <a href="20260724-affine_morphism_of_algebraic_functors.html#ID-4c2d66a8-67b6-47b1-b210-b8e29a921330">affine morphism</a> and the corresponding <a href="20260715-category_of_quasi_coherent_algebras_over_an_algebraic_functor.html#ID-8c05ef13-3e74-40f5-b491-e455f46e04f3">quasi-coherent algebra</a> is <a href="20230820-integral_algebra.html#ID-587307b5-d976-489d-9940-a201f2249d59">integral</a>.
</p>
