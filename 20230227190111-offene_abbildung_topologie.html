<span id="ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52"></span><h1 class="title">open map</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $(X, \mathcal{T})$ und $(X', \mathcal{T}')$ <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räume</a>.
Eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f: X \rightarrow X'$ ist offen, falls für eine <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">offene Menge</a> $A \in \mathcal{T}$ $f[A] \subseteq X'$ ebenfalls <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">abgeschlossen</a> ist
</p>
