<span id="ID-ebd5f07a-9a2e-4d1e-baa6-11fd390daad6"></span><h1 class="title">tor for an absolutely flat ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be an <a href="20230817-absolutely_flat_ring.html#ID-c8b36819-f616-4e9f-b5cf-a341fc7deb88">absolutely flat ring</a>, $\mathrm{Tor}_n^R(-,-)$ the <a href="20230902-tor_functor.html#ID-b722ea72-1c6d-45c9-bf92-84164a0b360a">Tor Functor</a>.
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{Tor}_n^R(-,-) = 0
\end{align*}</div>
<p>
for $n \geq 1$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from
</p>
<ul>
<li><a href="20240416-tor_functor_for_a_flat_module.html#ID-1b9d3f7c-aa13-4d1a-ba0b-67963b45173b">tor functor for a flat module</a></li>
</ul>
