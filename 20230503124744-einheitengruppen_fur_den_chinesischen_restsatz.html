<span id="ID-9a6999a1-645e-4024-8094-e9e275f02da4"></span><h1 class="title">Einheitengruppen für den Chinesischen Restsatz für die ganzen Zahlen</h1>

<h2 id="satz">Satz</h2>
<p>
Sei qm \in $\mathbb{N}$ mit einer <a href="20221226132205-primzerlegung.html#ID-662cc04a-0cb1-4a87-bbf1-9e3a88e08552">Primzerlegung</a> $m = \prod_{i = 1}^n p_i^{k_i} $
Dann gilt
</p>

<div class="math-block">\begin{align*}
(\mathbb{Z} / m \mathbb{Z})^{\times} \cong \prod_{i=1} (\mathbb{Z} / p_1^k_i)^{\times}
\end{align*}</div>
