<span id="ID-5d892946-fe78-4d1b-95e0-aac6fc9661a2"></span><h1 class="title">indecomposable, finite dimensional representation is simple over a semi-simple algebra</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $V$ be an <a href="20261013-indecomposable_representation.html#ID-5ec61ec7-94c1-48e4-ace6-125d0dbbb957">indecomposable</a>, <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> over a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a>  <a href="20261021-semi_simple_algebra.html#ID-f2f76840-0edb-40d1-bf2e-1f05378e1038">semi-simple k-algebra</a> $A$.
Then $V$ is already a <a href="20261013-irreducible_representation_of_an_algebra.html#ID-d63374c8-6c64-4ee3-bc2b-bd75c8272d12">simple representation.</a>
</p>
