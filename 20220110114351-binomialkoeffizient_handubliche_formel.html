<span id="ID-fff4e124-3f8f-4f8f-808e-01cd4ee1e1d9"></span><h1 class="title">Formel des Binomialkoeffizienten durch Fakultät</h1>

<h2 id="satz">Satz</h2>
<p>
Für $n,k \in \mathbb{N}$ gilt für den <a href="20211216205729-binomialkoeffizient.html#ID-89b0e19a-c480-407f-8939-1074be74e04d">Binomialkoeffizienten</a>:
</p>

<div class="math-block">\begin{align*}
\binom{n}{k} = \frac{n!}{k! \cdot (n-k)!} \quad (\text{für } n &gt; k \land n,k \in \mathbb{N} )
\end{align*}</div>
