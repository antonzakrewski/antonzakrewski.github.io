<span id="ID-027d0918-545f-44b7-8ecf-3ff8019cad17"></span><h1 class="title">regressive function</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $S$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> von <a href="20230516130028-ordinalzahl.html#ID-f638eb2b-0e4a-40c1-aac6-d3518403288b">Ordinalzahlen</a> und $f: S \rightarrow S$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
Dann ist $f$ eine regressive Funktion, falls für $\alpha \in S$ gilt:
</p>

<div class="math-block">\begin{align*}
f(\alpha) &lt; \alpha
\end{align*}</div>


<p>
(wird es auch anderweitig verwendet, z.B. für (halb)ordnungen ?)
</p>
