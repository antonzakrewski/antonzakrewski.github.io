<span id="ID-84005654-8c16-4351-9298-18742bb76dea"></span><h1 class="title">summand of a simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then $S$ is said to be a summand of $X$, if there exists a simplicial set $S'$ such that $X$ is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> to the <a href="20230404161607-categorical_coproduct.html#ID-25822c41-825b-480b-b8a6-eeb904ca5649">coproduct</a>
</p>

<div class="math-block">\begin{align*}
X \cong S \coprod S'
\end{align*}</div>
