<span id="ID-1e4fc4e9-8550-4360-810e-1cdee40ca631"></span><h1 class="title">rising factorial</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $x \in \mathbb{C}$ und $k \in \mathbb{N}$, so ist die steigende Faktorielle definiert als:
</p>

<div class="math-block">\begin{align*}
x^{\overline{k}}  \coloneqq \prod_{i=0}^{k-1} (x+i)
\end{align*}</div>
