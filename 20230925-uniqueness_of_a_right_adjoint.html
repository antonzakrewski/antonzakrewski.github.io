<span id="ID-6c220e1a-9830-4240-81b0-d2aae24d0d5a"></span><h1 class="title">uniqueness of a right adjoint</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{L}: \mathcal{C} \rightarrow \mathcal{D}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then the <a href="20220831221352-rechtsadjungierte.html#ID-9d92e651-1d26-4e9b-a0b9-32a09ca84328">right adjoint</a>  $\mathcal{R}: \mathcal{D} \rightarrow \mathcal{C}$ to $\mathcal{L}$, if it exists, is unique up to <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphisms</a>
</p>
