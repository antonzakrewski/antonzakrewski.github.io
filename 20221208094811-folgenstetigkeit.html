<span id="ID-934a1a9a-3464-4876-babd-3ece8651719e"></span><h1 class="title">Folgenstetigkeit in metrischen Räumen</h1>

<h2 id="definition">Definition</h2>
<p>
Eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> $f: M \rightarrow N$  über <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrische Räume</a> $M,N$ ist folgenstetig,
falls für eine beliebige <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Folge</a> $(m_i)$ mit <a href="20211120130127-grenzwert.html#ID-c9d16981-08f6-40ca-af81-22b5db6f06df">Grenzwert</a> $m$ gilt:
</p>

<div class="math-block">\begin{align*}
(f(m_i))_{i} = f(m)
\end{align*}</div>

</div>
