<span id="ID-11bcdf05-a184-4cdc-8eec-2b3bbe3e980f"></span><h1 class="title">Bild eines Monoidhomomorphismus als Untermonoid</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $M,M'$ <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">Monoide</a> und $\varphi: M \rightarrow M'$ ein <a href="20230722-monoidhomomorphismus.html#ID-d97d8a1c-6fdb-446c-9006-22f08dae62f6">Monoidhomomorphismus</a>.
Dann ist das <a href="20221224140013-bildmenge.html#ID-def6ffac-1c21-427b-bacf-7b8580f5d7dd">Bild</a> $\varphi[M] \subseteq M'$ ein <a href="20230524094139-untermonoid.html#ID-1fd4d539-ed15-4239-8302-43c57d9cb669">Untermonoid</a>
</p>
