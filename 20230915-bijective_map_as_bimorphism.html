<span id="ID-84d35734-5c2c-46d3-9f6e-d336e2a1613c"></span><h1 class="title">bijective map as bimorphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20230402143946-concrete_category.html#ID-5445ec6b-bf83-4c73-a8d1-b2bd4e7e37a7">concrete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $f \in \mathrm{Hom}_{\mathcal{C}}(A,B)$ a <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">bijective</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
Then $f$ is a <a href="20230316122317-bimorphismus.html#ID-935d48e0-4b5b-466a-8718-738bbd22fbad">bimorphism</a>
</p>
