<span id="ID-654e9595-5e89-464b-ab49-986030c33d81"></span><h1 class="title">Krull&#x27;s Hauptidealsatz</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian commutative ring</a> and $f \in A \setminus A^{\times}$ sucht that $f$ is not a <a href="20221226125808-einheit_ring.html#ID-a3b1e1af-c3e3-433c-a4dd-2ee2c6e1d69a">unit</a> and not a <a href="20221226125328-nullteiler.html#ID-dc985755-3df5-4b03-929e-659ee65ad000">zero divisor</a>
Then every <a href="20230725-minimal_prime_ideal.html#ID-9946ee7b-3aab-4f22-be35-f48f255ff9ae">minimal prime ideal</a> $\mathfrak{p}$ with $f \in \mathfrak{p}$ has <a href="20230906-height_of_a_prime_ideal.html#ID-81c0c250-629c-41d9-a9ff-871710796c92">height</a> $1$
</p>
