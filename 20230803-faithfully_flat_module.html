<span id="ID-90fff949-02f7-46e7-beca-eacf14cbb932"></span><h1 class="title">faithfully flat module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $M$ an \(A\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then $M$ is said to be faithfully flat, if for the <a href="20230801-tensor_product.html#ID-42c4ecff-8f9a-40cf-bebc-70569ded24bf">tensor product</a> it holds for all $N$
</p>

<div class="math-block">\begin{align*}
M \otimes N = 0 \Leftrightarrow N = 0
\end{align*}</div>
