<span id="ID-56633f8a-2202-40e7-ae6d-312f072e5292"></span><h1 class="title">Dieters identity</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
x^n - 1 = (x + 1) \cdot \left(\sum_{i=0}^{n-1} x^i \right)
\end{align*}</div>
