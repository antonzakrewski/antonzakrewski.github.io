<span id="ID-dfbd92de-75ea-4942-ac88-6bda5ca44c2a"></span><h1 class="title">whitehead group of a group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, then the whitehead group is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{Wh}(G) \coloneqq K_1(\mathbb{Z} G)/ \{\mathrm{im}(\pm g) \vert g \in G \}
\end{align*}</div>
