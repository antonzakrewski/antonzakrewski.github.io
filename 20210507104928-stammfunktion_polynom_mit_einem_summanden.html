<span id="ID-5d78eaca-c2db-447a-9005-8fcdea921419"></span><h1 class="title">Stammfunktion: Polynom mit einem Summanden</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{equation}
f(x) = x^n \Rightarrow F(x) = \frac{1}{n+1} \cdot x^{n+1} + c, \quad c \in \mathbb{R}, n \neq -1
\end{eqaution}
\begin{equation}
f(x) = x^{-1} = \frac{1}{x} \Rightarrow F_c(x) = \ln(|x|) + c
\end{equation}</div>
