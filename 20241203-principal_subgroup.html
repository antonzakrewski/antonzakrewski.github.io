<span id="ID-75f504bb-4deb-401f-9cfb-2fa9e1a18822"></span><h1 class="title">principal subgroup</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20230226210828-topologische_gruppe.html#ID-0aa20bcb-5c3d-4d06-aeee-e61b46a46e48">topological group</a>, $H$ an <a href="20241203-embedded_topological_subgroup.html#ID-5240afd4-8e6c-4696-98b8-50cf44a44727">embedded topological subgroup</a>.
Then $H$ is said to be a principal subgroup, if the <a href="20241203-quotient_topological_group.html#ID-0ac0fd67-d4dd-4ca9-a56e-cb73494756ae">quotient topological group</a>
</p>

<div class="math-block">\begin{align*}
\pi: G \rightarrow G/H
\end{align*}</div>
<p>
is a <a href="20241113-principal_g_bundle.html#ID-41366781-604c-4d30-ac8e-985b2fb48728">principal H-bundle</a>
</p>
