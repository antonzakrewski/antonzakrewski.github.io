<span id="ID-544200ae-c9a6-4469-8cdb-40745c19493f"></span><h1 class="title">independent set of vertices</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a> and $H \subseteq V$.
Then $H$ is said to be independ, if the induced <a href="20231206-subgraph.html#ID-191bebce-741d-4771-bd78-eb39c0ef6837">subgraph</a> $H$ contains no <a href="20220904171142-kante.html#ID-ee89f9c4-02d1-4312-9f41-09d9a1811714">edge</a>s
</p>
