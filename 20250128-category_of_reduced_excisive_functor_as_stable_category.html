<span id="ID-f490df6c-ee5d-4270-a578-02e058a7e447"></span><h1 class="title">category of reduced excisive functor as stable category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20250121-finitely_cocomplete_infinity_category.html#ID-25104316-86cf-4ff4-8ce2-1077c74573be">finitely cocomplete</a> <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity category</a> and $\mathcal{D}$ a <a href="20250121-finitely_complete_infinity_category.html#ID-e2219f15-fed4-45d5-95d2-c97756caa74c">finitely complete infinity category</a>.
Then the <a href="20250128-category_of_reduced_excisive_functors.html#ID-289820af-6e2c-4e54-b5ed-5981543b90be">category of reduced excisive functors</a> is a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity category</a>
</p>
