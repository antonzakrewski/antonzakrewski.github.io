<span id="ID-23d52593-80f0-40f7-acbc-74c8ddade95f"></span><h1 class="title">Identitätsmorphismus als Isomorphismus</h1>

<h2 id="satz">Satz</h2>
<p>
Der <a href="20220817165031-identitatsmorphismus.html#ID-18d8207c-a2f4-499b-ab59-b7efe4858e31">Identitätsmorphismus</a> ist ein <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">Isomorphismus</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
Es gilt:
</p>

<div class="math-block">\begin{align*}
\mathrm{id}_{} \circ \mathrm{id}_{} = \mathrm{id}_{} 
\end{align*}</div>
<p>
und damit ist $\mathrm{id}_{}^{-1} = \mathrm{id}_{}$
</p>
