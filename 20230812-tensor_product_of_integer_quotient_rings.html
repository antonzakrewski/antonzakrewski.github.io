<h2 id="proposition">Proposition</h2>
<p>
Let $n,m \in \mathbb{Z}$, then
</p>

<div class="math-block">\begin{align*}
\mathbb{Z} / n \mathbb{Z}  \otimes_{\mathbb{Z}} \mathbb{Z} / m \mathbb{Z}  \cong \mathbb{Z} / \mathrm{gcd}(m,n)\mathbb{Z} 
\end{align*}</div>
