<span id="ID-c4dbb355-8a77-4b0b-92da-cf8302d1b820"></span><h1 class="title">sum of modules surjects onto tensor product</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M,N$ \(A\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">modules</a>.
Then there exists a canonical <a href="20230301170300-ringepimorphismus.html#ID-0354f59c-3b74-4c1d-994a-74dffbfc0897">algebrabic ring-epimorphism</a> from the <a href="20230827-biproduct.html#ID-5741dcb7-1fbe-4287-866d-a3b724b7437e">sum</a>
</p>

<div class="math-block">\begin{align*}
\varphi: M \oplus N \twoheadrightarrow M \otimes_A N
(m,n) \mapsto&amp; m \otimes_A n
\end{align*}</div>
