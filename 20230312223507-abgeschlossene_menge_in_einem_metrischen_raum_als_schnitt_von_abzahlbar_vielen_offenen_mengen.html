<span id="ID-b90f4ef4-57e6-423d-8bbf-812048760d48"></span><h1 class="title">Abgeschlossene Menge in einem metrischen Raum als Schnitt von abzählbar vielen offenen Mengen</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(M,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a> und $A$ ein <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">abgeschlossene</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>, so existieren <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">abzählbar</a> viele <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">offene</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> $O_i$, so dass gilt
</p>

<div class="math-block">\begin{align*}
\bigcap_{i \in \mathbb{N}} O_i = A
\end{align*}</div>
