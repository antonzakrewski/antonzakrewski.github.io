<span id="ID-20865072-f3f3-4cff-a820-74b2e6990467"></span><h1 class="title">cofibrant object in a model category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a  <a href="20240715-model_category.html#ID-a617e6d1-b76b-48fc-99bc-acce1d7da2fa">model category</a> and $C \in \mathrm{Ob}(\mathcal{C})$
Then $C$ is said to be a cofibrant object, if the <a href="20230404183726-initial_morphism.html#ID-95a8bd02-e32c-4eaf-a0e5-e0b8de53fb59">initial morphism</a>
</p>

<div class="math-block">\begin{align*}
\emptyset \rightarrow C
\end{align*}</div>
<p>
is a &lt;cofibraiton&gt;
</p>
