<span id="ID-f0a7c88f-26ef-478a-baf5-9667b5e3cd19"></span><h1 class="title">invariant basis property</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $R$ is said to satisfy the (left/right) invariant basis property (IBP) if
</p>

<div class="math-block">\begin{align*}
R^n \cong R^m \Rightarrow n = m
\end{align*}</div>
<p>
as (left resp. right) <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">modules</a>
</p>
