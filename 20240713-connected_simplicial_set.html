<span id="ID-eaf1d0e7-0849-4604-9924-b5ed61053e7f"></span><h1 class="title">connected simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then $X$ is said to be connected, if the only <a href="20240918-summand_of_a_simplicial_set.html#ID-84005654-8c16-4351-9298-18742bb76dea">summands</a> are given by $X$ and the <a href="20240624-initial_simplicial_set.html#ID-499255b5-d636-47eb-8c31-eb224cfc1882">empty simplicial set</a> $\underline{\emptyset}$
</p>
