<span id="ID-aa1574c4-e660-4d0d-848d-f50a928a81cc"></span><h1 class="title">restriction of an injective map as injection</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A,B$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a>, $f: A \rightarrow B$ an <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injection</a>.
Suppose $C \subseteq A$ is a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>
</p>

<p>
Then the <a href="20221026162005-einschrankung_abbildung.html#ID-c9f04287-e549-4811-8538-f4a3c521866f">restriction</a>
</p>

<div class="math-block">\begin{align*}
f_{\vert C}: C \rightarrow B
\end{align*}</div>
<p>
is also an injection
</p>

<h2 id="proof">Proof</h2>
<p>
straightforward
</p>
