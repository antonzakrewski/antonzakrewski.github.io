<span id="ID-eb14a3c0-c7ca-4fd7-94c0-f13f8d005913"></span><h1 class="title">half smash product</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a>, and $f: X \rightarrow Y$ a map in a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> with <a href="terminal-object-in-an-infinity-category.html#ID-b49b437f-7d5c-4d8a-a413-1c995de811f6">terminal object</a>.
Then the half-smash product $X \rtimes Y$ is defined as <a href="20241022-cofiber_of_an_infinity_morphis3.html#ID-c9321dad-6e04-418b-a0a5-ad8546205938">cofiber</a>
</p>

<div class="math-block">\begin{align*}
X \rtimes_{f} Y \coloneqq \mathrm{cofib}(X \xrightarrow{\mathrm{id}, f} X \times Y)
\end{align*}</div>
