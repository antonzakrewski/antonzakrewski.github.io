<span id="ID-28210c89-7d15-4b35-aac3-68dd27f0f3fa"></span><h1 class="title">thickening of a ring</h1>

<h2 id="definition">Definition</h2>
<p>
A thickening of a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> is a <a href="20230301170300-ringepimorphismus.html#ID-0354f59c-3b74-4c1d-994a-74dffbfc0897">ring-epimorphism</a> $\varphi: R' \twoheadrightarrow R$ where the <a href="20230827-kernel_category_theory.html#ID-1f1c40b0-77e0-4949-8893-3cb7b0166eba">kernel</a> is a <a href="20260901-nilideal.html#ID-68d71a67-7ade-47da-8c65-e7eff4789d30">nilideal</a>
</p>
