<span id="ID-29638e20-8c0c-4100-b503-9184997c33fd"></span><h1 class="title">complete bipartite graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $n,m \in \mathbb{N}$.
Then the complete bipartit graph for $n,m$ is defined as
</p>

<div class="math-block">\begin{align*}
K_{n,m} \coloneqq ([n+m], \{i,n+j\}, i \in [n], j \in [m])
\end{align*}</div>

<p>
note that
</p>

<div class="math-block">\begin{align*}
[n] = \{1,...,n\}
\end{align*}</div>
