<span id="ID-4988613f-8afe-4742-a55e-2fca1f161c87"></span><h1 class="title">AP of an ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathfrak{a}$ a <a href="20230427200359-echtes_ideal.html#ID-fa54a328-b081-4a6c-9106-4348783138df">strict ideal</a>, then $\mathrm{AP}(\mathfrak{a})$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{AP}(\mathfrak{a}) = \{\mathfrak{p} \in \mathrm{Spec}(A) \vert \mathfrak{p} \mathrm{ is associated to } \mathfrak{a}\}
\end{align*}</div>

</div>
