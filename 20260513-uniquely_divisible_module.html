<span id="ID-d6944335-784f-4ca8-b95f-48dc0b1abae0"></span><h1 class="title">uniquely divisible module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $M$ an \(A\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and $a \in A$ a non <a href="20221226125328-nullteiler.html#ID-dc985755-3df5-4b03-929e-659ee65ad000">zero divisor</a>.
Then $M$ is said to be uniquely divisible, if the map (of sets)
</p>

<div class="math-block">\begin{align*}
a \cdot: M \rightarrow&amp; M  \\
m \mapsto&amp; a \cdot m
\end{align*}</div>
<p>
is a <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">Bijection</a>.
</p>
