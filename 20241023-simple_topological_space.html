<span id="ID-8d748ba6-d8c9-47b7-982d-f15c706def04"></span><h1 class="title">simple topological space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
Then $X$ is said to be simple, if for all $n \geq 0$ the <a href="20240712-fundamental_group_acts_on_homotopy_groups.html#ID-710a44b0-a560-4824-9fa9-fb266ca48bba">fundamental group action</a> on the <a href="20230722-homotopy_group.html#ID-8aa4161f-9373-468e-90e1-7ab31641c24a">homotopy groups</a> is a <a href="20231209-trivial_group_action.html#ID-ff85b7f2-45a1-40c2-a445-f5ae303adf5d">trivial group action</a>
</p>
