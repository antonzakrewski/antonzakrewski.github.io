<span id="ID-95676ed2-b5af-4500-8379-1d83cc1527a3"></span><h1 class="title">self-map nilpotence theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectrum</a> and $f: \Sigma^n X \rightarrow X$ a map which is zero on $\mathrm{MU}_*$ homology.
Then $f$ is nilpotent in $\mathrm{End}_{\mathrm{Sp}}(X)$ under composition.
</p>
