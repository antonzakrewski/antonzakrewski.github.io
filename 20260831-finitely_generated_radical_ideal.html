<span id="ID-b91abf33-4e02-4f83-8dd9-f46598e20143"></span><h1 class="title">finitely generated radical ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $\sqrt{I} \subseteq R$ a <a href="20230725-radical_ideal.html#ID-a09d853a-3453-49c0-82a0-5ee102e45c53">radical ideal.</a>
Then $\sqrt{I}$ is called finitely generated, if there exists a finite set $J$ such that $\sqrt{J} = \sqrt{I}$
</p>
