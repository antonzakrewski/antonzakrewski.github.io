<span id="ID-9fc57c69-d882-4cd9-a709-13f4a7219be1"></span><h1 class="title">dimension of a dual space for a finite dimensional vector space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $V$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a>.
Then $\mathrm{dim}(V) = \mathrm{dim}(V^*)$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20230130155449-duale_basis.html#ID-60195b87-8c69-430a-a8b8-e4bd1da17e5f">duale Basis</a> </li>
</ul>
