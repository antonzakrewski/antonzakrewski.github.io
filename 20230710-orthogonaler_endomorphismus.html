<span id="ID-022a6900-ca4c-42f6-863f-aa0d3b101a39"></span><h1 class="title">orthogonaler Endomorphismus</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller</a>  <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilbertraum</a> und $A \in \mathrm{End}_{}(V)$.
Dann ist $A$ ein <a href="20230710-orthogonaler_endomorphismus.html#ID-022a6900-ca4c-42f6-863f-aa0d3b101a39">orthogonaler Endomorphismus</a>, falls $A$ eine <a href="20230628-unitare_abbildung.html#ID-cf245337-af79-469e-b2eb-16f58d3c9f70">unitäre Abbildung</a> ist.
</p>
