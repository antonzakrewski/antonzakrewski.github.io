<span id="ID-579e0294-b3c9-4abf-9557-df845aa8fba6"></span><h1 class="title">metric map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,d_X), (Y,d_Y)$ be <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metric spaces</a>.
a metric map is <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
</p>

<div class="math-block">\begin{align*}
f: X \rightarrow Y
\end{align*}</div>
<p>
such that for $x,y, \in X$ it holds, that
</p>

<div class="math-block">\begin{align*}
d_X(x,y) \leq&amp; d_Y(x,f(y))
\end{align*}</div>

</div>
