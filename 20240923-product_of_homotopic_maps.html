<span id="ID-69b59f63-dc43-4a73-9602-e9db4ec2517e"></span><h1 class="title">product of homotopic maps</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f_i,g_i: X_i \rightarrow Y_i$ be pairwise <a href="20240404-homotopic_maps_of_simplicial_sets.html#ID-5e2f12ae-d457-4488-a4a8-0409d2319c60">homotopic maps</a> of <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a>.
Then
</p>

<div class="math-block">\begin{align*}
\prod f_i \sim \prod g_i
\end{align*}</div>
<p>
are homotopic
</p>
