<span id="ID-5e2f12ae-d457-4488-a4a8-0409d2319c60"></span><h1 class="title">homotopic maps of simplicial sets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a>, $A \subseteq X$ a <a href="20240422-sub_simplicial_set.html#ID-2e012cf6-41e5-4630-9cd6-ca3a5d43dd29">sub simplicial set</a> and $f,g: X \rightarrow Y$ be <a href="20220821182915-naturliche_transformation_kategorientheorie.html#ID-4e6e50c0-c0df-44ff-a140-bebfa492ef7e">natural transformations</a>.
Then $f,g$ are said to be homotopic rel $A$, if there exists a <a href="20240422-homotopy_between_morphisms_of_simplicial_sets.html#ID-037a7313-6b02-4731-b0e2-2fd01fe9012e">homotopy</a> rel $A$
</p>
