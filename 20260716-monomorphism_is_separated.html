<span id="ID-286c9423-7542-4ca8-bfef-dd53abcaa751"></span><h1 class="title">monomorphism is separated</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a>  between <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Then $f$ is a <a href="20260716-separated_map_of_algebraic_functors.html#ID-64189ee2-b49e-4eb2-a1f2-0107dfbcddb5">separated morphism</a>
</p>
