<span id="ID-73cc2e5f-4112-45a4-8819-89fe7ca47722"></span><h1 class="title">einfacher Leitkoeffizient</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">kommutativer Ring</a> und $f = \sum_{i=0}^{n} r_i X^i \in R[X]$ ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> vom <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">Grad</a> $n$.
Der Leitkoeffizient von $f$ ist definiert als <a href="20220820203558-koeffizient_polynom.html#ID-ce6c79cf-3232-40a4-b504-a84a62ea500c">Koeffizient</a> von $X^n$ bzw. $r_n$
</p>
