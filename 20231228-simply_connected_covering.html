<span id="ID-0c400b21-d70e-41fa-991c-b6ac6c76a026"></span><h1 class="title">simply connected covering</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $p: E \rightarrow B$ a <a href="20230729-covering_map.html#ID-b817dc02-5dea-4e8d-8ccd-adf7ef14e6bc">covering map</a>.
</p>

<p>
Then $p$ is said to be simply connected, if $E$ is a <a href="20231212-simply_connected_space.html#ID-ebb69dd9-193c-49e5-9d69-dad026b1a8ea">simply connected space</a>
</p>
