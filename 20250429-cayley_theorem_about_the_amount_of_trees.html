<span id="ID-2cf38dea-5ced-44c0-84a3-39747f4a23ed"></span><h1 class="title">cayley theorem about the amount of trees</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $n \in \mathbb{N}$.
Then there exist precisely $n^{n - 2}$ many <a href="20221024152607-baum.html#ID-b2969a00-e313-42e8-afe1-62a33cb45013">trees</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20250429-prufer_code_as_bijection.html#ID-1a21690a-bfc2-4eba-81e6-d5a8fe6fde28">prüfer code as bijection</a> </li>
</ul>
<p>
where the case $n=1, n=2$ can be seen by hand and the other follow from the cardinality of $\{1,...,n\}^{n-2}$
</p>
