<span id="ID-980f16e1-2f0f-489f-83d7-68de978d5b6b"></span><h1 class="title">saturation of a multiplicative set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $S \subseteq R$ a <a href="20230724-multiplicatively_closed_set.html#ID-d3df0441-9f2f-476f-b18e-d513ae149906">Multiplicatively closed set</a>.
Then the Saturation of $S$ is defined as
</p>

<div class="math-block">\begin{align*}
\widehat{S} = \{r \in R \vert \exists r' \in R, r \cdot r' \in S\}
\end{align*}</div>
