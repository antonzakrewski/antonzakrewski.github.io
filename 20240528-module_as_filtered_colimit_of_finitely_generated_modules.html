<span id="ID-862d84fe-a506-4bd0-b3bf-879ca5dfec12"></span><h1 class="title">module as filtered colimit of finitely generated submodules</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>
Then $M$ is a <a href="20230804-filtered_limit.html#ID-35b9e3f0-b5d0-41c4-94ac-6bd183d66ee3">filtered colimit</a> of <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated modules</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Consider the diagram with inclusions as <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> and finitely generated <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodules</a> as <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a>
</p>
