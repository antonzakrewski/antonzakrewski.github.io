<span id="ID-925ec77c-0ad7-4055-a770-706d5d9246c6"></span><h1 class="title">invertible object in the derived category of a field</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>  and $\mathcal{D}(K)$ the <a href="20250310-derived_infinity_category_of_a_ring.html#ID-8ce59f1d-54bc-4042-a93f-fb1a4b492cb9">derived category of a ring</a>.
Then the <a href="20250315-invertible_object.html#ID-9b8aca58-3e20-4474-9d08-afbfed57027a">invertible objects</a> are precisely shifts of $K$.
</p>
