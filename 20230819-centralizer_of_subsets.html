<span id="ID-1bdab7b4-5204-4c05-a5af-c5826e8a106f"></span><h1 class="title">centralizer of subsets</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $S_1 \subseteq S_2 \subseteq G$.
Then for the <a href="20230819-centralizer.html#ID-f115e19c-5182-4f85-ac86-d522fbd04412">centralizer</a> it holds,
</p>

<div class="math-block">\begin{align*}
C_G(S_2) \subseteq C_G(S_1)
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
Definitions:
if $g \in C_G(S_2)$, then $g$ also commutes with any $s \in S_1$.
Hence $g \in C_G(S_1)$
</p>
