<span id="ID-217b6de3-7673-4ef7-9ecb-2ba26dcc3b26"></span><h1 class="title">g-torsor in set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $T$ a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>
Then a \(G\)-torsor is defined as <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
</p>

<div class="math-block">\begin{align*}
\alpha: G \times T \rightarrow T 
\end{align*}</div>
<p>
such that
</p>

<div class="math-block">\begin{align*}
(\alpha, \mathrm{pr}_2): G \times T \rightarrow T \times T
\end{align*}</div>
<p>
is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
