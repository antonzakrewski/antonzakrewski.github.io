<span id="ID-0ed94339-533f-4640-bd82-bae9113717ae"></span><h1 class="title">infinite real projective space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathbb{R}\mathbb{P}^n$ be the <a href="20230902-projektiver_raum.html#ID-9330afd6-d1a4-451f-b4d1-4f747b5ef58a">real projective space</a>.
Then $\mathbb{R}\mathbb{P}^{\infty}$ is defined as <a href="20230804-filtered_limit.html#ID-35b9e3f0-b5d0-41c4-94ac-6bd183d66ee3">filtered colimit</a>
</p>

<div class="math-block">\begin{align*}
\mathbb{R}\mathbb{P}^{\infty} \coloneqq \mathrm{colim}_{n \in \mathbb{N}} \mathbb{R}\mathbb{P}^n
\end{align*}</div>
