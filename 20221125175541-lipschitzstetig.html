<span id="ID-53d30a09-5724-4c59-9495-2ffa2f053707"></span><h1 class="title">Lipschitzstetig</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $(X,d_x)$ und $(Y, d_y)$ <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrische Räume</a>.
Eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> $f: X \rightarrow Y$ heißt lipschitzstetig, falls ein $L \in \mathbb{R}$ existiert, sodass gilt
</p>

<div class="math-block">\begin{align*}
\forall x,x' \in X : d_Y(f(x_1),f(x_2)) \leq L \cdot d_X(x_1,x_2)
\end{align*}</div>


</div>
