<span id="ID-c2fcce19-2d44-4af1-862e-40537958b663"></span><h1 class="title">ideal of vanishing polynomials</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $A \subseteq R^n$.
Then the ideal of common zeros, $I(A)$, is defined as <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a> in the <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a>
</p>

<div class="math-block">\begin{align*}
\{f \in R[X_1,...,X_n] \vert f(a) = 0 \forall a \in A\}
\end{align*}</div>
