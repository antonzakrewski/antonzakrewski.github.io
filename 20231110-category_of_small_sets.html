<h2 id="definition">Definition</h2>
<p>
Let $\kappa$ be an <a href="20230923-inaccessible_cardinal.html#ID-2332c906-78f1-4512-9d94-7a59453b52e4">inaccessible cardinal</a>.
Then the category of small sets is defined as <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> containing
</p>
<ol>
<li><a href="20230402175422-small_set.html#ID-6f42c88c-bd66-4d85-9be5-2f9fa901a8cc">small sets</a> with respect to $\kappa$ <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> </li>

</ol>
