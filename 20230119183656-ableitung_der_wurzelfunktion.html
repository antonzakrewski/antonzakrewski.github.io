<span id="ID-4847b16b-4f32-4d58-b8f4-dc65b7835c1c"></span><h1 class="title">Ableitung der Wurzelfunktion für eine natürliche Zahl</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $k \in \mathbb{N}^+$ und $f(x) = \sqrt[k]{x}$.
Dann gilt für die <a href="20230118224205-ableitung.html#ID-162033bf-f6b9-49d6-a75b-07c444a70de4">Ableitung</a>
</p>

<div class="math-block">\begin{align*}
f'(x) =&amp; \frac{1}{k} \cdot \frac{\sqrt[k]{x}}{x}
\end{align*}</div>
