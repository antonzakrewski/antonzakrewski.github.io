<span id="ID-b22a0384-739c-42ac-9acc-1de0c328ae58"></span><h1 class="title">coherent sheaf of modules</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a> and $\mathcal{F}$ a <a href="20240226-quasicoherent_sheaf_of_modules.html#ID-ed42ef0b-1ce6-4478-8ab6-8ffc5b7b9ce7">quasicoherent sheaf of modules</a> for on <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open cover</a> $O_i$ with $\mathcal{F}_{\vert O_i} \cong \tilde{M}_i$.d
Then $\mathcal{F}$ is said to be coherent, if each $M_i$ is a <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated module</a> over $A_i$
</p>
