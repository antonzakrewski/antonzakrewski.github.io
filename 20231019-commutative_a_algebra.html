<span id="ID-95d0425a-7d4b-4446-8db2-2cd183655ce1"></span><h1 class="title">commutative A-Algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then an <a href="20221228202836-r_algebra.html#ID-f1401a23-6bbb-4e91-812e-071fddeb1e67">A-Algebra</a> is said to be commutative, if the multiplicative <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a> is <a href="20210702075801-kommutativgesetz.html#ID-2a5d302a-0c7a-4757-83be-0731dfa75d86">commutative</a>
</p>
