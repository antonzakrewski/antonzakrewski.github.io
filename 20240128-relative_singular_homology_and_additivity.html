<h2 id="proposition">Proposition</h2>
<p>

</p>

<div class="math-block">\begin{align*}
H_n(\coprod_{i \in I} X_i, \emptyset) \cong \bigoplus_{i \in I} H_n(X_i, \emptyset)
\end{align*}</div>
