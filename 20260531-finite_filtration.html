<span id="ID-276efd24-218f-407a-802f-f6d3bcb89148"></span><h1 class="title">finite filtration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed category</a>, then a finite filtration is a <a href="20230605-filtration.html#ID-936d9bbe-e350-4775-a8b5-a9fd489ee465">filtration</a> $X_*$ such that
</p>
<ol>
<li>$X_{n} \simeq 0$ for all $n &lt;&lt; 0$,</li>

<li>$X_{n} \simeq X_{n+1}$ for all $n &gt;&gt; 0$. </li>
</ol>
