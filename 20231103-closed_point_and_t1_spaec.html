<span id="ID-525e5130-1cb0-4801-82f9-878de784fab1"></span><h1 class="title">closed point and t1 space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$X$ is a <a href="20230207113106-t1_raum.html#ID-0bc02ce3-dbb8-4a80-9a2b-53c3ac9393f1">Frechet-Topology</a> </li>

<li>each point $x \in X$ is <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a> as singleton $\{x\}$</li>
</ol>
