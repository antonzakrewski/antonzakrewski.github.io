<span id="ID-2a20d8a2-ee0b-4991-8ab7-a60b41b9dd3d"></span><h1 class="title">colimit of bimodules</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R,S\) be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a> and $\mathrm{R-S-Mod}$ the <a href="20240524-category_of_bimodules.html#ID-cb0728a0-5204-42b3-ba8a-8fe34c8bb709">category of bimodules</a>.
Then a <a href="20230725-colimit.html#ID-581b1561-25d0-479a-b0cc-063c894e10be">colimit</a> of <a href="20230825-bimodule.html#ID-5c24133d-ebe8-445c-bb1a-d2ec406c84f8">bimodules</a> is given by the underlying limit of left \(R\)-modules (resp. right \(S\)-modules).
</p>
