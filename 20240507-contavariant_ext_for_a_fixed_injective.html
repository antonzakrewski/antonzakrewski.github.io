<span id="ID-6b4dd4cc-8ca8-48cf-9173-eceaa42262aa"></span><h1 class="title">contravariant ext for a fixed injective</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> <a href="20231212-enough_injectives.html#ID-f93303c0-0da2-4014-aea8-4a271d5c74a4">enough injectives</a> and $I$ an <a href="20230903-injective_object.html#ID-7fbb0ef7-bb6c-4135-b65f-2d8fb5f2df00">injective object</a>
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{Ext}(-,I) = 0
\end{align*}</div>

<p>
corollary of:

</ul>
