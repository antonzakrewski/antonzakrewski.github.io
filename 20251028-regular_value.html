<span id="ID-61b4b9f8-04b8-40e0-bde3-a6f6fa14a6bd"></span><h1 class="title">regular value of a smooth map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: M \rightarrow N$ be a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a> between <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifolds.</a>
Then $p \in N$ is said to be regular if the preimage $f^{-1}[ \{p\}]$ consists of <a href="20251028-regular_point_of_a_smooth_map.html#ID-ed862443-a0c9-43bc-9880-73fd29a1090d">regular points</a>
</p>
