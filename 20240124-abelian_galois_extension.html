<span id="ID-69bec126-5aae-4628-b886-37f68453339c"></span><h1 class="title">abelian field extension</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $L/K$ a <a href="20230725-galoiserweiterung.html#ID-7fff7689-4ad5-4b67-bba7-1367615c1d5d">galois extension</a>.
Then $L/K$ is said to be abelian, if the <a href="20230805-galoisgruppe.html#ID-4c1b3e1a-1418-4ec4-b878-8903e671c272">galois group</a> is <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a>
</p>
