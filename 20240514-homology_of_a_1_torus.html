<span id="ID-bd8d82c2-c676-4e61-9cf1-f8c0175c8694"></span><h1 class="title">homology of a 1-torus</h1>

<h2 id="proposition">Proposition</h2>
<p>
the <a href="20230901-homologie.html#ID-1b7b88ca-b993-46dc-8ebe-8531d90dc8f4">singular homology</a> of a <a href="20231017-torus.html#ID-417071ec-29f3-4c26-8a30-f53d1c30d565">1-torus</a> is given by
</p>

<div class="math-block">\begin{align*}
H_k(T^1) =&amp; 
    \begin{cases}
    \mathbb{Z} &amp; \mbox{if } k \in \{0,1\} \\
0  &amp; \mbox{else } \\ 
    \end{cases}
\end{align*}</div>
