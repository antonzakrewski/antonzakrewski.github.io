<span id="ID-46dd72b0-0138-4d08-8ba1-c190ff93844e"></span><h1 class="title">limit of kan complexes as kan complex</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K_i$ be <a href="20240326-kan_complex.html#ID-ee0dffb7-ca44-444d-84a4-492e65c05e84">Kan complexes</a> and $\mathrm{lim} K_i$ the <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> in <a href="20240128-category_sset.html#ID-e9c2723a-dd7e-48df-84af-05e865106a54">category sSet</a>.
Then $\mathrm{lim} K_i$ is also a <a href="20240326-kan_complex.html#ID-ee0dffb7-ca44-444d-84a4-492e65c05e84">Kan complex</a>
</p>
