<span id="ID-708c1313-11b5-4aa0-ab2f-f349fd032bcf"></span><h1 class="title">coherent ring</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>  is said to be coherent, if it is both <a href="20240528-left_coherent_ring.html#ID-a3c588a3-14fb-4c7b-8bd8-1eab89e19683">left coherent</a> &amp;  <a href="20250505-right_coherent_ring.html#ID-23d1001e-e1ad-445d-9b35-b977bbf28759">right coherent</a>.
</p>

<p>
That is, $\mathrm{Mod}_{R}^{\mathrm{fp}} \subseteq \mathrm{Mod}_{R}$ is closed under finite <a href="infinity-limit.html#ID-a8bcf958-5282-4984-8415-7a64cca74613">limits</a> and <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimits</a>
</p>
