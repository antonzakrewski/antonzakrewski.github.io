<span id="ID-897fa2e6-f094-43b3-a8c9-ef369796fbad"></span><h1 class="title">nonvanishing locus of Proj_d</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">N-graded ring</a> and $d \geq p$.
Let $f \in A_d$ and $D(f) \subseteq \mathrm{Proj}_d(A)$ be the <a href="20230922-subfunctor.html#ID-e3017b76-a5ac-43b3-a458-b3ede2132fec">Subfunctor</a> of pairs $(L, \varphi)$ such that $\varphi(f)$ generates $L$.
