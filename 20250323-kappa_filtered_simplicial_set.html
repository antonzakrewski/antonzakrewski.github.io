<span id="ID-be4ce817-4a53-4c72-8cdc-20dc13d7e85e"></span><h1 class="title">kappa filtered simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\kappa$ be a <a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinal</a>, $S$ a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>
Then $S$ is said to be \(\kappa\)-filtered, if it is <a href="20240703-joyal_equivalence_between_simplicial_sets.html#ID-0b735a57-8c6f-4e38-a681-e5cd3c5c2fad">joyal equivalent</a> to a <a href="kappa-filtered-infinity-category.html#ID-b0e18bee-b030-4a19-9891-4053dd98931d">kappa filtered infinity category</a>
</p>
