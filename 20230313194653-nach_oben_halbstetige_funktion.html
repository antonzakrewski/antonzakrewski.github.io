<span id="ID-94678cdd-453f-4360-a89c-822a0d0338c7"></span><h1 class="title">nach oben halbstetige Funktion</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $\mathbb{R}$ mit der <a href="20230227174434-naturliche_topologie.html#ID-956b4fb0-31c8-4401-a276-04d1e04a0d36">natürlichen Topologie</a> versehen.
Eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f: X \rightarrow \mathbb{R}$ ist nach oben halbstetig, falls $f$ in jedem Punkt $x \in X$ <a href="20230313194711-in_einem_punkt_nach_oben_halbstetige_funktion.html#ID-b6bd8a20-856a-4471-bba5-cf50859832f9">nach oben halbstetig</a> ist.
</p>
