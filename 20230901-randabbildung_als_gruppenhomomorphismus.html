<h2 id="satz">Satz</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $C_n(X)$ die <a href="20230901-menge_der_n_ketten_als_abelsche_gruppe.html#ID-03532dd9-5423-404f-85a3-79f003f15efd">Menge der n-Ketten als abelsche Gruppe</a>.
Dann ist die <a href="20230901-boundary_map_of_a_simplex.html#ID-a0218452-70ae-4217-8959-07378b2ff32e">Randabbildung</a>
</p>

<div class="math-block">\begin{align*}

\end{align*}</div>
<p>
ein <a href="20220928134932-gruppenhomomorphismus.html#ID-7d86b4b2-8f83-4da4-b1ef-08c3d37aa417">homomorphismus</a>
