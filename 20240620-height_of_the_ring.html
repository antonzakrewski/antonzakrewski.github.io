<span id="ID-35456ec6-fa0a-430b-bb27-23d6b0c03c3c"></span><h1 class="title">height of the ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>
Then the height of $A$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{ht}(A) = \mathrm{dim}(A) + 1
\end{align*}</div>
<p>
where $\mathrm{dim}(A)$ is the <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimension</a>
</p>
