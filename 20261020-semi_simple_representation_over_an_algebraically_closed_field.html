<span id="ID-7e0d51a1-8aa4-48be-8bc9-cde77e421bd0"></span><h1 class="title">semi-simple representation over an algebraically closed field</h1>

<h2 id="proposition">Proposition</h2>
<p>

Thne $V \cong \bigoplus_{W \textrm{simple} \mathrm{Hom}_{A}(W,V) \otimes W$ by schurs lemma.
