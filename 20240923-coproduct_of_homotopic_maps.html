<span id="ID-20754495-7c75-4b5b-b91c-28004ae506e3"></span><h1 class="title">coproduct of homotopic maps</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f_i,g_i: X_i \rightarrow Y_i$ be pairwise <a href="20240404-homotopic_maps_of_simplicial_sets.html#ID-5e2f12ae-d457-4488-a4a8-0409d2319c60">homotopic maps</a> of <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a>.
Then
</p>

<div class="math-block">\begin{align*}
\coprod f_i \sim \coprod g_i
\end{align*}</div>
<p>
are homotopic
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20240923-finite_product_commutes_with_colimits_in_sset.html#ID-6fddf57c-e210-4c30-8a46-bdef9025f998">finite product commutes with colimits in sSet</a> </li>
</ul>
