<span id="ID-be785ad6-c295-47f9-bb76-e3278559fdb6"></span><h1 class="title">symplectic form</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>.
Then a symplectic form is a <a href="20230905-geschlossene_form.html#ID-b1ddc1c8-9d7a-4169-945e-a72e6a4d4fce">closed</a>, <a href="20230705-nicht_ausgeartete_form.html#ID-cff5f6e7-f385-4803-bb24-cafbadaa5b53">non degenerate</a> <a href="20230905-differentialform.html#ID-134d05c2-9f29-4321-a418-e1acb965dc53">2-form</a>, i.e. for all $p \in M$ there exists an $u \in T_p$ such that
</p>

<div class="math-block">\begin{align*}
\omega(u,-) = - \omega(-,u) \neq 0
\end{align*}</div>
