<span id="ID-4bf0e2fb-ca68-4321-875f-99903b9e26fe"></span><h1 class="title">Vervollständigung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,d)$ ein <a href="20230224123147-semimetrischer_raum.html#ID-e2594bf0-67cb-4d50-a605-39627074bcd2">semimetrischer Raum</a>.
Ein <a href="20211227211436-n_tupel.html#ID-833c603f-1b79-4180-9d4f-1b44ce68769b">Tripel</a> $(M',d',i)$ ist eine Vervollständigung von $M$, falls gilt:
</p>
<ol>
<li>$i: (M,d) \rightarrow (M',d')$ ist eine <a href="20221209134652-isometrie_metrischer_raum.html#ID-897a11a6-874c-4734-9d2b-7bf717ba7867">Isometrie</a></li>

<li>$i[M]$ ist <a href="20221124232157-dichte_menge_topologie.html#ID-921fe319-4945-4303-a9a5-3723804e0737">dicht</a> in $(M',d')$</li>

<li>Der <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a> $(M',d')$ ist <a href="20220717170446-vollstandigkeitsaxiom.html#ID-2772514a-cfc0-4f1c-9762-b5565967613c">vollständig</a>    </li>
</ol>
