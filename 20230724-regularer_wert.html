<span id="ID-a125e91a-8a3e-4d9e-a2c0-3237c3db4656"></span><h1 class="title">regulärer Wert</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M,N$ <a href="20230723-differenzierbare_mannigfaltigkeit.html#ID-805c972a-cf4f-4229-a4dc-b6755639f890">differenzierbare Mannigfaltigkeiten</a> und $F: M \rightarrow N$ eine <a href="20230601102558-totale_differenzierbarkeit.html#ID-2bdfcfac-76de-4f04-b2c7-6eca0297c586">total differenzierbare</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
Dann ist $n \in N$ ein regulärer Wert, falls das <a href="20211230205442-urbild_mengenlehre.html#ID-55e63f0f-4499-43f1-af07-5c56577a9c73">Urbild</a> $f^{-1}[m]$ aus <a href="20230724-regularer_punkt.html#ID-9ec2cef2-9bcc-4ce4-a6e6-d3357a9f9854">regulären Punkten</a> besteht
</p>
