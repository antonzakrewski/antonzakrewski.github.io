<span id="ID-e3af9268-1e39-47cd-a180-e8c13bc076b1"></span><h1 class="title">forgetful functor is an algebaric functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
The forgetful functor $\mathrm{CAlg}_k \rightarrow \mathrm{Set}$ is an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic k-functor</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as it is <a href="20230404122456-natural_isomorphism.html#ID-0977f626-bc15-4197-93bd-092d014c8270">naturally isomorphic</a> to $\mathbb{A}^1_k$ or $\mathrm{Hom}_{\mathrm{CAlg}_k}(k[x],-)$.
</p>
