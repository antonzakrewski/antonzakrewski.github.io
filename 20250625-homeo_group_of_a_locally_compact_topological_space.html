<span id="ID-448b1031-3b63-4737-984f-6b047ead91bf"></span><h1 class="title">Homeo group of a locally compact topological space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20230705-locally_compact_regular_space.html#ID-f89f4ba5-4eb9-448b-bf35-da8e5aeaa963">locally compact</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{Homeo}(X) \subseteq \mathrm{Map}_{\mathrm{Top}}(X,X)
\end{align*}</div>
<p>
is the <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a> containing <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphisms</a>
see:
</p>
<ul>
