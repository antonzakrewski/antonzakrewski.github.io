<span id="ID-289820af-6e2c-4e54-b5ed-5981543b90be"></span><h1 class="title">category of reduced excisive functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> admitting <a href="20241017-infinity_pushout.html#ID-91244ae5-b853-45df-bbe0-af6ae9a8da47">pushouts</a> and a <a href="terminal-object-in-an-infinity-category.html#ID-b49b437f-7d5c-4d8a-a413-1c995de811f6">terminal object</a> and $\mathcal{D}$ another category.
Then the category of excisive functors is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full sub infinity category</a> containing <a href="20250128-reduced_infinity_functor.html#ID-8c1e14a4-5e7b-415e-987f-69485f17a66f">reduced</a> <a href="20250128-excisive_functor.html#ID-5e984c3a-38f7-45f0-bc34-58637794263f">excisive functors</a> as objects.
</p>
