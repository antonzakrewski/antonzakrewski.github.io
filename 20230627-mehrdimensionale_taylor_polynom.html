<span id="ID-2b82849a-cee5-4db0-8759-af4420084dc8"></span><h1 class="title">mehrdimensionale Taylor-Polynom</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $U \subseteq \mathbb{R}^n$ <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">offen</a> und
</p>

<p>
Dann ist das \(k\)-te Taylorpolynom von $f$ in $p$ definiert als
</p>

<div class="math-block">\begin{align*}
T_{p,k}^f(x) \coloneqq \sum_{j=0}^{k} \frac{1}{j!} \mathrm{d}^f f_p(x - p)^j
\end{align*}</div>
