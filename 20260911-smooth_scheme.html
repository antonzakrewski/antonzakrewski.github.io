<span id="ID-95ff7250-3686-4aca-aea0-d6743958254b"></span><h1 class="title">smooth scheme over a base</h1>

<h2 id="definition">Definition</h2>
<p>
Let $u: X \rightarrow Y$ be a <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a> over another <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a> $Y$.
Then $X$ is said to be smooth over $Y$ if $X \rightarrow Y$ is a <a href="20260807-smooth_morphism_between_schemes.html#ID-ff5714e8-e1de-4ca2-8124-411e2989d136">smooth morphism</a>
</p>
