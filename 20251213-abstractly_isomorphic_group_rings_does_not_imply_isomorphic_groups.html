<span id="ID-d4f831f7-53a2-4c8b-88c4-fb130c54e644"></span><h1 class="title">abstractly isomorphic group rings does not imply isomorphic groups</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a nonzero <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, and $G,G'$ be (even <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>) <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a>
Suppose $R[G],R[G']$ are <a href="20250124-abstract_isomorphic.html#ID-d8e7f3ab-7225-4584-93b5-be16488ea664">abstractly isomorphic</a> <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> as <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a>.
</p>

<p>
Then $G \not\cong G'$ in general.
</p>
