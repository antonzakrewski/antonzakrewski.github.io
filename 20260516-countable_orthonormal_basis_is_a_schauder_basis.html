<span id="ID-e4a27ce2-02a0-41e6-b293-f32723a01d18"></span><h1 class="title">countable orthonormal basis is a schauder basis</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20230521021534-hilbert_space.html#ID-6c70b215-2588-4ecc-9240-f21ab3ec7d81">Hilbert space</a> and $e_n$ a <a href="20220903164044-abzahlbar.html#ID-96f3063e-a99a-4c33-93c2-5c9f99f15717">countable</a> <a href="20221113213002-orthonormalbasis.html#ID-0b12dce4-b595-4efc-9eec-157043948f68">Orthonormalbasis</a>.
Then $e_n$ is a <a href="20260510-schauder_basis.html#ID-f5011dfd-e9e7-4520-aa0c-764cd2a78058">schauder basis</a>.
</p>
