<span id="ID-9452bc6c-1da3-4faa-b466-2e2d141ed9ca"></span><h1 class="title">Ableitung Sinus/Cosinus</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $\sin, \cos: \mathbb{R} \rightarrow \mathbb{R}$ die <a href="20220908075102-sinus.html#ID-1a046dc9-6b19-4aa4-8420-1373adccc5ce">Sinus</a>- bzw. <a href="20220908184544-cosinus.html#ID-231c020d-948b-4809-94b6-4ad78d87fd31">Kosinus</a>-<a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">funktionen</a>
Dann sind $\sin, \cos$ <a href="20210217184102-differenzierbarkeit.html#ID-3a5a92c4-2d28-46ae-91f9-92603797aa69">differenzierbar</a> mit <a href="20210217212957-ableitungsfunktion.html#ID-868ce7d4-5ad4-4475-a5c1-26f943fe851a">Ableitung</a>
</p>

<div class="math-block">\begin{align*}
\sin(x)' =&amp; \cos(x) \\
\cos(x)' =&amp; -\sin(x)
\end{align*}</div>
