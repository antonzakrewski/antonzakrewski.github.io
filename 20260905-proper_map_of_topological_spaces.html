<span id="ID-6d930a42-e468-4bbe-9dd1-d054c762465b"></span><h1 class="title">proper map of topological spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y $ be a map of <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
Then $f$ is said to be proper, if it is both <a href="20260905-separated_map_of_topological_spaces.html#ID-85e3e560-6206-4f4c-9996-5c3ea9102d3a">separated map</a> and <a href="20260905-universally_closed_map_of_topological_spaces.html#ID-122fd1c6-0a30-4c44-9dd7-55e8c14cfe5e">universally closed</a>.
</p>
