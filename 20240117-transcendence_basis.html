<span id="ID-15e82306-a4c3-4903-b751-83a6ec4953e1"></span><h1 class="title">transcendence basis</h1>

<h2 id="definition">Definition</h2>
<p>
Let $L/K$ be a <a href="20230603-field_extension.html#ID-afbdca38-90b9-4db1-9d10-cfd826cbfac6">field extension</a>.
Then a transcendence basis is a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> $A \subseteq L$ which is a <a href="20230825-minimal_element.html#ID-180a1321-d0d3-4200-89a3-fc5996c98ff8">maximal</a> <a href="20230725-algebraically_independent.html#ID-2d9f2ebd-c68a-4b8e-a59f-4a5d4f6656d9">algebraically independent</a> over $K$
</p>
