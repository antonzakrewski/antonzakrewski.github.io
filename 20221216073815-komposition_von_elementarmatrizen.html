<span id="ID-4a4ad3b1-cf05-44f2-8081-dd1602b8bd31"></span><h1 class="title">Komposition von Elementarmatrizen</h1>

<h2 id="lemma">Lemma</h2>
<p>
Sei $K^{n \times n}$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a>.
Dann gilt für $\alpha,\beta \in K$ und die  <a href="20221208191647-elementarmatrix.html#ID-78b77753-7806-4c23-9442-63216ad410f8">Elementarmatrizen</a> $T_{ij}(\alpha)$
</p>

<div class="math-block">\begin{align*}
T_{ij}(\alpha) \cdot T_{ij}(\beta) =&amp; T_{ij}(\alpha + \beta)
\end{align*}</div>
