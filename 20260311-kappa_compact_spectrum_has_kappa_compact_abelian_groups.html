<span id="ID-f8cf4ba8-a229-49ef-b977-d2b6a6e5f1e6"></span><h1 class="title">kappa compact spectrum has kappa compact abelian groups</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\kappa$ be a <a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinal</a> and $X$ be a $\kappa$ <a href="20241016-kappa_compact_object.html#ID-4a8967b2-7c84-4c8b-b590-aadea095f9fd">compact</a> <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a>.
Then $\pi_n(X)$ is a $\kappa$ generated abelian group for $n \in \mathbb{Z}$.
</p>
