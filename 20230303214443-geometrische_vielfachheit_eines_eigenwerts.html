<span id="ID-5e8b27fb-6a6b-473d-a512-543f4f13aa74"></span><h1 class="title">geometrische Vielfachheit eines Eigenwerts</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V \cong K^n$ ein <a href="20221109121525-endlich_erzeugter_vektorraum.html#ID-477797e9-4b4d-4886-9606-6e1c5f378a4f">endlich erzeugter</a> <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $A \in \mathrm{End}_{K}(V)$ mit $\alpha \in \sigma(A)$.
Dann ist die geometrische Vielfachheit definiert als <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">Dimension</a> des <a href="20230222202719-eigenraum.html#ID-7b4ccb37-5162-4759-a114-c7985217ebd6">Eigenraums</a>
</p>
