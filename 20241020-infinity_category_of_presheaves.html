<span id="ID-aec2b71f-20b0-4c66-9a4f-73ae7add1b0e"></span><h1 class="title">infinity category of presheaves</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>, then the infinity category of presheaves is defined as <a href="20240405-infinity_functor_category.html#ID-280a46fe-59f2-4b5e-9f58-b06d46dc4d5c">infinity functor category</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Fun}(\mathcal{C}^{\mathrm{op}}, \mathrm{Spc})
\end{align*}</div>
<p>
where $\mathrm{Spc}$ is the <a href="20240713-infinity_category_of_spaces.html#ID-7a8f95e9-9a42-40a5-aa46-7fabec2ef09a">category Spc</a>
</p>
