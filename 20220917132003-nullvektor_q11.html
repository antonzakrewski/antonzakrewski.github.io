<h2 id="definition">Definition</h2>
<p>
In drei Dimensionen ist der Nullvektor:
</p>

<div class="math-block">\begin{equation}
\vec{o} = \begin{pmatrix} 0\\ 0\\ 0\end{pmatrix} 
\end{equation}</div>
<p>
Insbesondere gilt:
</p>

<div class="math-block">\begin{align*}
\vec{v} + \vec{o} = \vec{v}
\end{align*}</div>
