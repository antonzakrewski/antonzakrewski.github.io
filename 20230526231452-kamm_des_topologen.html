<span id="ID-32b31100-04dd-4a8c-bd12-b13368aff847"></span><h1 class="title">Kamm des Topologen</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\mathbb{R}^2$ die euklidische Ebene, dann ist der Kamm des Topologen der <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">Unterraum</a> für
</p>

<div class="math-block">\begin{align*}
K  \coloneqq [0,1] \times \{0\} \cup \{(\frac{1}{n},r) \vert r \in [0,1], n \in \mathbb{N}^+\}
\end{align*}</div>
