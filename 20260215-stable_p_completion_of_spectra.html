<span id="ID-9e1ba89d-f603-497f-b3a1-3ea3abf40e80"></span><h1 class="title">p-completion of spectra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be be a <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectrum</a>.
Then the p-completion is defined as
</p>

<div class="math-block">\begin{align*}
\lim_{n \in \mathbb{N}} (... \rightarrow X/p^{n+1} \rightarrow X/p^n \rightarrow X/p^{n-1})
\end{align*}</div>
<p>
see:
</p>
<ul>
<li><a href="20260215-p_completion_functor.html#ID-9afcda75-aabf-4117-9f23-5513999fae7c">stable p-completion functor</a> </li>
</ul>
