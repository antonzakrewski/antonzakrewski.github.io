<span id="ID-650787e1-e85e-490c-936d-294d1a5a4bc3"></span><h1 class="title">hausdorff filtration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $F_s$ a <a href="20250825-filtration_of_an_object.html#ID-af47851f-7394-4232-9f2c-d16d44acbde6">filtration</a>.
Then the filtration is said to be hausdorff, if
</p>
<ol>
<li>the limit $\mathrm{lim}_{\mathbb{Z}^{-}}$ exists</li>

<li>and is given by the <a href="terminal-object-in-an-infinity-category.html#ID-b49b437f-7d5c-4d8a-a413-1c995de811f6">terminal object</a>    </li>
</ol>
