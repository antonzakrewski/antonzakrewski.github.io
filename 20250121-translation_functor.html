<span id="ID-b252ce3a-6920-4a3c-8b68-def74752c2c3"></span><h1 class="title">translation functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity category</a>
Then the translation functor is defined as
</p>

<div class="math-block">\begin{align*}
(-)[n] = 
    \begin{cases}
    \Sigma^n(-) &amp; \mbox{if } n &gt; 0 \\
    \mathrm{id}(-)  &amp; \mbox{if } n = 0 \\
 \Omega^{-n}(-)  &amp; \mbox{if } n &lt; 0 \\ 
    \end{cases}
\end{align*}</div>
