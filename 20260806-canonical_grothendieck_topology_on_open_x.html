<span id="ID-90a800a8-4285-42c2-9fa3-aa8e3905d63f"></span><h1 class="title">canonical grothendieck topology on Open(X) for a topological space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space.</a>
Then the canonical grothendieck topology on the <a href="20260715-locale.html#ID-758e2296-be31-4618-b3cd-41648ba57953">locale</a> $\mathrm{Open}(X)$ is the <a href="20260806-canonical_topology_on_a_locale.html#ID-b3df74df-eab8-42a9-ad51-c85c1c42c33c">canonical grothendieck topology on the locale</a>.
</p>
