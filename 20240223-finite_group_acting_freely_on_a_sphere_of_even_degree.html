<span id="ID-af2d9996-8e2b-4b67-ab3e-2077369b2777"></span><h1 class="title">finite group acting freely on a sphere of even degree</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> which <a href="20230501095041-gruppenwirkung.html#ID-e8246fd3-cb62-4245-9ef1-59bc0326501a">acts</a> <a href="20230802-free_action.html#ID-48265c0f-9e40-425c-986d-16b06e5f356c">freely</a> on the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">sphere</a> $S^{2n}$.
Then $\vert G \vert \leq 2$
</p>
