<span id="ID-1ac79ec4-d304-40eb-9a06-cfac06a32777"></span><h1 class="title">dimension of a polynomial ring over a noetherian ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian ring</a>, $A[X]$ the <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a>
Then the <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimension</a> is given by
</p>

<div class="math-block">\begin{align*}
\mathrm{dim}(A[X]) = \mathrm{dim}(A) + 1
\end{align*}</div>
