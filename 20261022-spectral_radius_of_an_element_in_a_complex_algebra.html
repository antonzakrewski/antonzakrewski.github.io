<span id="ID-ab4805bf-4676-4148-a3ff-0c2463970e94"></span><h1 class="title">spectral radius of an element in a complex algebra</h1>

<h2 id="proposition">Proposition</h2>
<p>
let $B$ be a $\mathbb{C}$ <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">Algebra</a>.
Then the spectral radius is defined as
</p>

<div class="math-block">\begin{align*}
r_{B}(b) \coloneqq \mathrm{sup} \{\vert \lambda \vert \vert \lambda \in \sigma_{B}(B)\}
\end{align*}</div>
