<span id="ID-216110c7-505b-4937-b171-908c8618e4fd"></span><h1 class="title">R-orientation of a manifold with boundary</h1>

<h2 id="definition">Definition</h2>
<p>
Let $W$ be a \(n+1\)-dimensional <a href="20240607-manifold_with_boundary.html#ID-4b5854ef-a389-4076-9c87-d81fc63653bd">topological manifold with boundary</a> and $R$ a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then an \(R\)-orientation of $W$ is defined as <a href="20240613-r_orientation_of_a_manifold.html#ID-a0336fa3-412e-4f8f-9e97-2cffccc1c87c">R-Orientation</a> of the <a href="20240624-interior_of_a_manifold.html#ID-800668f1-55a6-4d8a-afc1-6eea1445a912">interior</a> $\mathrm{int}(W)$
</p>
