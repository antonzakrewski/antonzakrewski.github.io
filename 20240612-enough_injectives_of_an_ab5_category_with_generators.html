<span id="ID-acc0442e-e5c4-49d6-8445-08b0ff1afa77"></span><h1 class="title">enough injectives of an ab5 category with generators</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20240308-ab5_category.html#ID-e7f6fe0a-037c-45e4-940a-37c6c1b068a3">Ab5</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> with a family of <a href="20240210-generator_of_a_category.html#ID-7849a7fb-3def-4dbb-b31a-444da1b86df1">generators</a>.
Then $\mathcal{A}$ admits <a href="20231212-enough_injectives.html#ID-f93303c0-0da2-4014-aea8-4a271d5c74a4">enough injectives</a>
</p>
