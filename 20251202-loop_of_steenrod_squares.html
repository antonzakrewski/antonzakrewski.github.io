<span id="ID-51e25b3c-d34b-4c2d-b441-d549899febe3"></span><h1 class="title">loop of steenrod squares</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathrm{Sq}^i: K(\mathbb{F}_2,n) \rightarrow K(\mathbb{F}_2,n+i)$ be some <a href="20250108-steenrod_square.html#ID-6f3b2c3c-d3aa-4c10-8a29-f7a97601ca8d">steenrod square</a>.
Then $\Omega \mathrm{Sq}^i: \Omega(K(\mathbb{F}_2,n-1)) \rightarrow \Omega(K(\mathbb{F}_2,n+i-1)$ also identifies as steenrod square.
</p>
