<span id="ID-1a1d76bf-d670-4f8d-a7b3-77639af314fb"></span><h1 class="title">category of strict commutative groups is additive</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> with <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20241017-infinity_product.html#ID-07afb527-f81d-470f-946f-dfcac235ce22">product</a>s, then the <a href="20260221-category_of_strict_commutative_groups.html#ID-aa463309-2bce-421f-ba7e-8e4c583e4db5">category of strict commutative groups</a> is also an <a href="20241217-additive_infinity_category.html#ID-e168d6e3-8dc6-424e-a950-8b24f6ed45f8">additive category</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20250307-product_preserving_functor_category_as_additive_category.html#ID-9aa003f6-bd84-4f3b-8ed2-86c6cd4b4259">product preserving functors out of an additive category is additive</a> </li>
</ul>
