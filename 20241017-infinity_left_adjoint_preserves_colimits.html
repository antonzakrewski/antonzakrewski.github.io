<span id="ID-ff10459a-fda2-46aa-9bb0-faf773545dce"></span><h1 class="title">infinity left adjoint preserves colimits</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity categories</a> and $f: \mathcal{C} \rightarrow \mathcal{D}$ an <a href="20241017-infinity_left_adjoint.html#ID-2ba0e3a5-7a57-4093-837c-b1f0feabd7c2">infinity left adjoint</a>.
Then $\mathcal{F}$ <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimit</a>s, which exist.
</p>

<h2 id="proof">Proof</h2>
<p>
<a href="20231014-left_adjoint_preserves_limits.html#ID-b74a606d-2b63-4e0c-8f74-d8983694896c">left adjoint preserves colimits</a>
</p>
