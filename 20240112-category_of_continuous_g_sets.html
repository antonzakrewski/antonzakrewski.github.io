<span id="ID-37167cbf-a75c-4c5e-8ca3-4f942991111a"></span><h1 class="title">category of continuous G-Sets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20230226210828-topologische_gruppe.html#ID-0aa20bcb-5c3d-4d06-aeee-e61b46a46e48">topological group</a>.
The category of continuous <a href="20231205-g_set.html#ID-2e1771aa-7af3-4f27-8538-4f5a67ab9782">G-Sets</a> contains
</p>
<ol>
<li><a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> $X$ with a <a href="20231020-topological_group_action.html#ID-38e7118c-8f31-4e4f-b958-9af22f05af15">topological group action</a>  as <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a></li>

<li><a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20231205-g_equivariant_map.html#ID-3053c70b-dd6f-44e2-ba1e-dce86ece54f0">G-equivariant maps</a> as <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> </li>
</ol>
