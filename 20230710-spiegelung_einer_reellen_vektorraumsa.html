<span id="ID-abc81686-2f89-4321-8e3f-24a7594e874e"></span><h1 class="title">Spiegelung einer reellen Vektorraum</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller</a> <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilbertraum</a> und $w \in V$.
Dann ist eine Spiegelung eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>
</p>

<div class="math-block">\begin{align*}
s_v: V \rightarrow&amp; V \\
w \mapsto&amp; w - 2 \frac{ \langle w,v\rangle}{ \langle v,v\rangle}v
\end{align*}</div>

</div>
