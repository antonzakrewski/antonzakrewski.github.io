<h2 id="definition">Definition</h2>
<p>
The nilpotent element functor is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{Nil}: \mathrm{CAlg}_{R} \rightarrow&amp; \mathrm{Set} \\
A \mapsto \{a \in A \vert \exists n \in \mathbb{N} : a^n = 0 \}
\end{align*}</div>
