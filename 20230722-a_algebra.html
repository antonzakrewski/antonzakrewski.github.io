<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
An \(A\)-Algebra is given by a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> $B$ and a <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a> $\varphi: A \rightarrow C(B)$ into the <a href="20230226213449-zentrum_einer_gruppe.html#ID-1a8fbb74-8226-4029-90aa-f7f67bddbfb5">center</a> of $B$
