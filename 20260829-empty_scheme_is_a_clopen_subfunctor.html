<h2 id="proposition">Proposition</h2>
<p>
Let $\emptyset_{X}$ be the <a href="20260712-empty_scheme.html#ID-acd3e2de-f929-463d-98b2-527e7adc2d1c">empty scheme</a> over an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a> $X$.
Then $X$ is a <a href="20260803-clopen_subfunctor.html#ID-f28d23e2-f9be-4343-9dfd-b7bd22379d28">clopen subfunctor</a>.
