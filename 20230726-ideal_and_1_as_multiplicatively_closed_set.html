<span id="ID-4b4af080-33da-4d35-be9b-66e9f800b62a"></span><h1 class="title">Ideal and 1 as multiplicatively closed set</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $I \subseteq R$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then $\{1\} \cup I$ is a <a href="20230724-multiplicatively_closed_set.html#ID-d3df0441-9f2f-476f-b18e-d513ae149906">multiplicatively closed set</a>
</p>
