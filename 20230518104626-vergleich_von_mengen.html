<span id="ID-fb96e575-caa0-4771-bf7e-61107246a558"></span><h1 class="title">Vergleich von Mengen</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X,&lt;)$ eine <a href="20221010083632-totalordnung.html#ID-30e940f3-5f30-43e3-acda-3066e8c7e2fd">totalgeordnete</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und $A,B \subseteq X$.
Man schreibt dann $A &lt; B$, falls gilt:
</p>

<div class="math-block">\begin{align*}
\forall a \in A \forall b \in B : a &lt; b
\end{align*}</div>
