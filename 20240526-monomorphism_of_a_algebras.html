<span id="ID-ae65618e-a1c4-465d-881d-4af5f7a3e853"></span><h1 class="title">monomorphism of A-Algebras</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B,C$ be <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">A-Algebras</a> for a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> $A$.
Then a <a href="20230726-morphism_of_a_algebras.html#ID-0b458fde-ab1b-4066-b6c3-f7cac22900d8">morphism of Algebras</a> $\varphi: A \rightarrow B$ is said to be a monomorphism, if it is <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injective</a>
</p>
