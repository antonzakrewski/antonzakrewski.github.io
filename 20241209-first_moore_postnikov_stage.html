<span id="ID-6f74a973-5a43-46f8-bc91-868877d7dade"></span><h1 class="title">first Moore-Postnikov stage</h1>

<h2 id="convention">Convention</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> between <a href="20230308142110-wegzusammenhangender_raum_topologie.html#ID-09b1d548-9ac2-461c-8b3e-f72097f54a99">pathconnected</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">spaces</a>, where $Y$ is <a href="20230308142220-lokal_wegzusammenhangend.html#ID-440c77bf-ffb1-45dc-92a4-b1fd98e19cb1">locally path connected</a>, <a href="20231212-semi_locally_simply_connected_space.html#ID-e2aa2769-6b34-4028-aeba-b519dd2a6223">semi-locally simply connected</a>
Let $Z_1$ be the <a href="20231228-connected_covering.html#ID-9ad8710c-00ab-46d4-8f16-1a2b0f7fa2d5">connected covering</a> of $Y$ with <a href="20231228-characteristic_subgroup.html#ID-9b5f4b61-3ef5-4ffd-aacd-dbecdc659416">characteristic subgroup</a> $\mathrm{Im}(\pi_1(f)) \subseteq \pi_1(Y)$.
</p>
