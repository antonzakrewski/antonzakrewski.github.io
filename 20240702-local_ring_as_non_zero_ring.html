<span id="ID-5c64cc53-ee3d-4f73-9e2f-8ac0e9513f5b"></span><h1 class="title">local ring as non zero ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a>, then $A \neq 0$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the existence of a <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a>
</p>
