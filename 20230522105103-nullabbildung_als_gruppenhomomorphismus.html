<span id="ID-dcb5f4a8-b4ac-4057-adb0-7a738e28bc1f"></span><h1 class="title">Nullabbildung als Gruppenhomomorphismus</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $G,G'$ <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppen</a>, dann ist
</p>

<div class="math-block">\begin{align*}
1: G \rightarrow G' \\
g \mapsto 1
\end{align*}</div>
<p>
ein <a href="20220928134932-gruppenhomomorphismus.html#ID-7d86b4b2-8f83-4da4-b1ef-08c3d37aa417">Gruppenhomomorphism</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
Seien $g,g' \in G$, so folgt:
</p>

<div class="math-block">\begin{align*}
1(g \cdot g') =&amp; 1 \\
=&amp; 1 \cdot 1 \\
=&amp; 1(g) \cdot 0(g')
\end{align*}</div>


</div>
