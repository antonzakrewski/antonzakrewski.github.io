<span id="ID-ac79c7ce-e8d8-4d58-a507-09f487220786"></span><h1 class="title">almost compact object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20250328-compactly_generated_infinity_category.html#ID-53e1ad7b-88aa-4698-a710-e7656c498d1f">compactly generated infinity category</a>.
Then an object $C \in \mathcal{C}$ is said to be almost compact, if $\tau_{\leq}(C)$ is a <a href="20241016-kappa_compact_object.html#ID-4a8967b2-7c84-4c8b-b590-aadea095f9fd">compact object</a> of $\tau_{\leq n}(\mathcal{C}}$
