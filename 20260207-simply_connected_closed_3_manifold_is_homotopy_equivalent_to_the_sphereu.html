<span id="ID-165977f2-c583-4a2b-9ee3-96dfb99f1038"></span><h1 class="title">simply connected, closed 3 manifold is homotopy equivalent to the sphere</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20231212-simply_connected_space.html#ID-ebb69dd9-193c-49e5-9d69-dad026b1a8ea">simply connected</a>, <a href="20240606-closed_topological_manifold.html#ID-e5619774-ee4d-40ce-ba8a-b98f23ddb7f2">closed topological 3 manifold</a>.
Then $M$ is <a href="20240423-simplicial_homotopy_equivalence.html#ID-8c9e05e4-4626-4bad-91da-7d99541981f4">homotopy equivalent</a> to $S^3$
