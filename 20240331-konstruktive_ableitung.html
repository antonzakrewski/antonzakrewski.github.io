<span id="ID-e0a6179d-53b3-433d-a154-17c28c7075c6"></span><h1 class="title">konstruktive ableitung für ringe</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $f: R \rightarrow R$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> zwischen <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ringen</a>.
Sei
</p>

<div class="math-block">\begin{align*}
g: D \rightarrow&amp; R \\
d \mapsto&amp; f(x + d)
\end{align*}</div>

<p>
Dann ist die Ableitung $f'(x)$ definiert als
</p>

<div class="math-block">\begin{align*}
g(d) = f(x) + f'(x) \cdot d
\end{align*}</div>

</div>
