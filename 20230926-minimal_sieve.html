<span id="ID-abe77961-b9b9-4a64-bb1e-09b7f9a2c669"></span><h1 class="title">minimal sieve</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220819181004-kleine_kategorie.html#ID-3c3f1c0d-53ad-476e-810a-756acd885263">small</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $O \in \mathrm{Ob}(\mathcal{C})$
Then the minimal sieve $S$ on $O$ is defined as
</p>

<div class="math-block">\begin{align*}
S(U) = \emptyset \subseteq \mathrm{Hom}_{\mathcal{C}}(U,O)
\end{align*}</div>
