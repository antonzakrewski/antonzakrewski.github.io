<span id="ID-dda94565-bf08-4572-a968-99451f75e11e"></span><h1 class="title">Ext Funktor einer endlich erzeugten Abelschen Gruppe</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $G \cong \mathbb{Z}^r \oplus \bigoplus_{i = 1}^n \mathbb{Z}/m_i$ eine <a href="20230608-endlich_erzeugte_gruppe.html#ID-9d1d22d5-501a-45b6-a05d-abbe73155a04">endlich erzeugte</a> <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelsche</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a> und $A$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, dann gilt
</p>

<div class="math-block">\begin{align*}
\mathrm{Ext}(G,A) = \bigoplus_{i=1}^n \mathbb{Z}/m_i
\end{align*}</div>
