<span id="ID-21143e66-add4-4323-a951-05a4f53f7ef6"></span><h1 class="title">Additivität einer Linearen Abbildung (Vektorraum)</h1>

<h2 id="axiom">Axiom</h2>
<p>
Seien $V$ und $W$ <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorräume</a> über einem <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> $K$.
Eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f: V \rightarrow W$ ist homogen, wenn für alle $x,y \in V$ und $\alpha \in K$ gilt:
</p>

<div class="math-block">\begin{align*}
f(x + y) = f(x) + f(y)
\end{align*}</div>
