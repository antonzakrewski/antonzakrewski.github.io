<span id="ID-3e2ac02b-198b-4e9b-ab1c-8d3679ac4cbd"></span><h1 class="title">coprime and bigger ideal</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathfrak{p} \subseteq \mathfrak{p}',\mathfrak{q}$ are <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideals</a>, such that $\mathfrak{p}, \mathfrak{q}$ are <a href="20230410004341-coprime_ideal.html#ID-b5d829a1-26dc-4274-a072-42fd3f2cba7c">coprime</a>.
Then $\mathfrak{p}', \mathfrak{q}$ are coprime
</p>

<h2 id="proof">Proof</h2>
<p>
consequence of <a href="20230803-sum_of_ideals_and_order.html#ID-66817b3f-fd7b-429d-bc0b-906e30a421c7">sum of ideals and order</a>
</p>
