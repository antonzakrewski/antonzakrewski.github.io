<span id="ID-1412dc13-3d80-45e4-8430-f03012b26838"></span><h1 class="title">metric space as coarse space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M_d$ be a <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metric space</a>
Then the coarse space of $d$ is defined as generated coarse space of
</p>

<div class="math-block">\begin{align*}
\{U_{r} \vert r \in \mathbb{R}\}
\end{align*}</div>
<p>
with
</p>

<div class="math-block">\begin{align*}
U_r = \{(x,y) \vert d(x,y) \leq r \}
\end{align*}</div>

</div>
