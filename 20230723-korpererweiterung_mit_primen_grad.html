<span id="ID-b82d1b1e-bbcc-417a-8875-a105c615d799"></span><h1 class="title">Körpererweiterung mit primen Grad</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und
</p>

<div class="math-block">\begin{align*}
K \subseteq L \subseteq M
\end{align*}</div>
<p>
<a href="20230603-field_extension.html#ID-afbdca38-90b9-4db1-9d10-cfd826cbfac6">Körpererweiterungen</a> mit <a href="20211228193940-primzahl.html#ID-d7857a86-c778-478d-aa48-7e239fcd8076">primen</a> <a href="20230722-grad_einer_korpererweiterung.html#ID-33c15990-df05-43a4-bfb7-ed9d17d629a5">Grad</a>
</p>

<div class="math-block">\begin{align*}
[M : K] = p
\end{align*}</div>
<p>
Dann gilt $L = K$ oder $L = M$
</p>
