<span id="ID-58037a78-9969-4077-ad91-ce5e70c6c32c"></span><h1 class="title">Kompaktheit (Topologie)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>.
Eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $M \subseteq X$ heißt kompakt, wenn jede <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">offene Überdeckung</a> $(U_{i})$ von $M$ eine <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endliche</a> <a href="20221224121300-teiluberdeckung.html#ID-592bb00c-d4d2-4853-a393-ef6977c82437">Teilüberdeckung</a> besitzt
</p>

<p>
oft wird noch die <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">Hausdorff-Eigenschaft</a> gefordert
</p>
