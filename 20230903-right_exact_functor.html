<span id="ID-9af3df51-d300-4ca2-b340-8ac92cdd3fca"></span><h1 class="title">right exact functor</h1>


<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20231018-finitely_cocomplete_category.html#ID-a7a2af91-710c-441d-acfa-53f9b14f3349">finitely cocomplete</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $\mathcal{F}$ is said to be left exact, if $\mathcal{F}$ <a href="20240114-functor_preserving_finite_colimits.html#ID-3c78631e-53a0-450f-a19c-f2fc35825f44">preserves finite colimits</a>
</p>

<p>
<a href="20230903-right_exact_functor.html#ID-9af3df51-d300-4ca2-b340-8ac92cdd3fca">right exact functor</a>
