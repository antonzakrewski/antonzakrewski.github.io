<span id="ID-1869d74a-d2cf-4e24-bd3a-10bb92fa3a49"></span><h1 class="title">kan fibration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $f: X \rightarrow Y$ be a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>.
Then $f$ is said to be a kan-fibration, if it has the <a href="20240327-right_lifting_property.html#ID-d782de36-512e-44c3-8cbc-1106a79a58a6">right lifting property</a> with respect to all <a href="20240404-horn_inclusion.html#ID-ee65ae8d-03d4-46bc-bd60-515f7e24e7b9">horn inclusions</a>, i.e. it is both an <a href="20240327-left_fibration.html#ID-bdbcb3cc-0793-4a96-9303-7f78702f03fb">left</a> and <a href="20240327-right_fibration.html#ID-cab43683-f467-4a4d-8c8e-9635ca3f01f1">right fibration</a>
</p>
