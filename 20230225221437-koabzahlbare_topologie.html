<span id="ID-6d3bd64b-222f-451c-8788-f7cddf3f44f9"></span><h1 class="title">cocountable topology</h1>

<h2 id="definition-satz">Definition / Satz</h2>
<p>
Sei $X$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>, dann ist die Koabzählbare <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">Topologie</a> $\mathcal{T}$ die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der <a href="20230225221506-koabzahlbare_menge.html#ID-dc3f315e-037a-4e32-ae37-092c62fe3f94">koabzählbaren Mengen</a> und $X$ selbst.
</p>

<div class="math-block">\begin{align*}
\mathcal{T} = \{ A \subseteq X : A = \emptyset \lor X \setminus A \text{ ist abzählbar}\}
\end{align*}</div>
