<span id="ID-f28d23e2-f9be-4343-9dfd-b7bd22379d28"></span><h1 class="title">clopen subfunctor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic k-functor</a>.
Then a <a href="20230922-subfunctor.html#ID-e3017b76-a5ac-43b3-a458-b3ede2132fec">Subfunctor</a> $Y \subseteq X$ is said to be clopen, if it is both an <a href="20260713-open_subfunctor_of_an_algebraic_functor.html#ID-3591ec98-a7a9-4668-a975-fdf935c815e8">open subfunctor</a> &amp; <a href="20260713-closed_subfunctor.html#ID-d952d35b-1a92-4447-97b0-37c5363be496">closed subfunctor</a>
</p>
