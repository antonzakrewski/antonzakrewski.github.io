<span id="ID-804615a8-2307-4f8e-8f51-f4be70e817b3"></span><h1 class="title">Covering</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und sei $M \subseteq X$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>.
Eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Mengenfamilie</a> $(U_i){i \in I}$ $U_i \subseteq \mathbb{R}$ heißt Überdeckung von $M$, wenn gilt:
</p>

<div class="math-block">\begin{align*}
M \subseteq \bigcup_{i \in I} U_i
\end{align*}</div>
