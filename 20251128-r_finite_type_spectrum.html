<span id="ID-ba0c7153-ca33-4654-9038-58278f3d42a2"></span><h1 class="title">R-finite type spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a> and $X \in \mathrm{Mod}(R)$ a <a href="20250621-module_over_a_ring_spectrum.html#ID-ff15d87e-6808-4cb5-ab80-8484014dbc6d">module spectrum</a>
Then $X$ is said to be of \(R\)-finite type, if $\pi_n(X)$ is <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a> as $\pi_0(R)$ (or $\pi_*(R)$ ???) module.
</p>
