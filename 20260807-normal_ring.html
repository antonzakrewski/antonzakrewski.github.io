<span id="ID-d8a212d7-e707-4262-9f2a-61333c04f1b0"></span><h1 class="title">normal ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $R$ is said to be a normal ring, if for every <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a> $\mathfrak{p}$, the ring $R_{\mathfrak{p}}$ is an <a href="20260807-integrally_closed_integral_domain.html#ID-7c34a9c4-08cf-468a-ba82-e888530fc11c">integrally closed integral domain</a>.
</p>
