<span id="ID-bf207dd1-7a6b-43c9-a33a-7cfaf92de902"></span><h1 class="title">empirische Varianz</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $X_1,...,X_n$ <a href="20241229-unabhangig_und_identisch_verteilt.html#ID-d6d1ec17-b656-496c-a71c-24e688bb6285">unabhängig und identisch verteilte</a> <a href="20241028-zufallsvariable.html#ID-6798db97-4391-4eed-acb0-86d90bc1ec7f">Zufallsvariablen</a>
Dann ist die empirische Varianz definiert als Zufallsvariable:
</p>

<div class="math-block">\begin{align*}
\frac{1}{n-1} \sum_{i=1}^n \left(X_i - \frac{\sum_{i=1}^n X_i}{n} \right)^2
\end{align*}</div>
