<span id="ID-8f0c2646-07a2-4cf5-95ed-d413e91526c0"></span><h1 class="title">formal group law</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>
Then a formal group law is defined as element $F \in R[[x,y] ]$ in the <a href="20230427070950-ring_der_formalen_potenzreihen.html#ID-8c920542-3559-472f-8af9-c0d8690cf10a">power series ring</a>  such that
</p>
<ol>
<li>$F(x,0) = x, F(0,y) = y$</li>

<li>$F(x,y) = F(y,x)$</li>

<li>$F(F(x,y),z) = F(x,F(y,z))$</li>
</ol>
