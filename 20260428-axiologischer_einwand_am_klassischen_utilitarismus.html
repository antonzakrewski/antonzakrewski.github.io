<h2 id="definition">Definition</h2>
<p>
Ein Einwand am klassischen Utilitarismus ist, dass wir auch andere Güter haben, die wir befördern möchten:
So sehen wir z.B. Freiheit als intrinsisch gut an, ohne das über etwaige Glückmaximierung zu rechtfertigen.
