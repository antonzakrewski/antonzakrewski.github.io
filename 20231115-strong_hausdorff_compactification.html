<span id="ID-11894245-69c5-4456-938b-3a7fc3576b4e"></span><h1 class="title">strong hausdorff compactification</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
A strong hausdorff compactification is a <a href="20230706-kompaktifizierung.html#ID-dae75348-ecf4-4dd9-ba2c-d4dc01518a64">strong compactification</a> $\iota:X \rightarrowtail Y$, such that $Y$ is <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">Hausdorff</a>
</p>
