<span id="ID-e61a5288-ad50-4f47-b2d2-ee894113a970"></span><h1 class="title">cohomology of a double cover</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X \rightarrow X/C_2$ be a <a href="20231212-sheteed_cover.html#ID-173d7fe5-cb39-4bfd-8022-f7293c6d3368">2-sheeted covering</a> and $R$ a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> where $2\in R^{\times}$ is a <a href="20221226125808-einheit_ring.html#ID-a3b1e1af-c3e3-433c-a4dd-2ee2c6e1d69a">unit</a>.
Then using the <a href="20231228-deck_action_on_a_fibre.html#ID-9d09d2ef-648d-423e-9403-78bbe4b84bc8">deck action on the fibre</a> we get
</p>

<div class="math-block">\begin{align*}
H^*(X/C_2, ?) \cong H^*(X, ?)^{C_2}
\end{align*}</div>
