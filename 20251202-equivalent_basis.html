<span id="ID-e9f0f91d-da89-4f71-8666-07882a78e627"></span><h1 class="title">equivalent basis</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathbb{R}^n$ be the $\mathbb{R}$ <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a>.
Let $(v_i)$ and $(w_i)$ be <a href="20221030151204-basis_vektorraum.html#ID-4b0d1e47-5503-4b26-9ab3-a142097c2624">basis</a>
Then both are equivalent if the map defined via $v_i \mapsto w_i$ has positive <a href="20221126201331-determinante.html#ID-eb5c60bd-2e36-4d02-aa16-f58c8e846d07">determinant</a>
</p>
