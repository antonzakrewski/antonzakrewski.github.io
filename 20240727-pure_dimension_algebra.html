<span id="ID-30453dc0-615f-42c8-b955-85051e7752b5"></span><h1 class="title">pure dimension Ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $A$ is said to be of pure dimension, if each <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a> has the same <a href="20230906-height_of_a_prime_ideal.html#ID-81c0c250-629c-41d9-a9ff-871710796c92">height</a>
</p>
