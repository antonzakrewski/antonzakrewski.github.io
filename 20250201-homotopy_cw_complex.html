<span id="ID-e443a230-8ec8-4580-9ea4-4f393fce47b2"></span><h1 class="title">homotopy cw complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is said to be a homotopy CW complex, if it is <a href="20230330150414-homotopieaquivalenz.html#ID-0e303b14-738c-496f-ab77-bd62472d54f6">Homotopy equivalent</a> to a <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complex</a>
</p>
