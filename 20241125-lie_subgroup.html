<span id="ID-eb090fa0-9abe-4fc3-b79a-bacf0a0a8b7a"></span><h1 class="title">lie subgroup</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20240905-lie_group.html#ID-7f22c609-ba54-44fc-99d4-b401bcb0c871">lie group</a>.
Then a lie subgroup is a <a href="20241125-subgroup_object.html#ID-192bc7b3-49e3-45bd-84d0-31e247af105d">subgroup object</a> $H$ such that the inclusion is a <a href="20231215-regular_monomorphism.html#ID-8cd69639-67f8-4173-86ab-9c46fbb62043">regular monomorphism</a>
</p>

<p>
"i.e. $H \subseteq G$ is a <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a>"
</p>
