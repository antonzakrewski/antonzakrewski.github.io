<span id="ID-f30771b0-9dc5-46a7-9697-39ef11460ec1"></span><h1 class="title">covering of an anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>
Then a covering of $X$ is a <a href="20240429-kan_fibration.html#ID-1869d74a-d2cf-4e24-bd3a-10bb92fa3a49">kan fibration</a>
</p>

<div class="math-block">\begin{align*}
p: X' \rightarrow X
\end{align*}</div>
<p>
(where $X'$ is necessarily another anima) where each <a href="20240717-fibre_of_a_morphisms.html#ID-88467be8-d154-4c5b-9922-28e1c3c42044">fibre</a>
</p>

<div class="math-block">\begin{align*}
p^{-1} [\{x\}]
\end{align*}</div>
<p>
is a <a href="20241028-discrete_anima.html#ID-ff8017f0-3ad8-47e2-bf3a-31e6928a9782">discrete Anima</a>
</p>
