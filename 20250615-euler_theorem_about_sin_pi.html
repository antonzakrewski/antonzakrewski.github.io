<h2 id="proposition">Proposition</h2>
<p>
Let $z \in \mathbb{C}$, then
</p>

<div class="math-block">\begin{align*}
\frac{\mathrm{sin}(\pi z)}{\pi} = z \cdot \prod_{n=1}^\infty (1 - \frac{z^2}{n^2})
\end{align*}</div>
