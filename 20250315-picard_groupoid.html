<span id="ID-a51c1ad7-81c3-42df-8fa0-377ca336ee98"></span><h1 class="title">picard groupoid of a symmetric monoidal category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \otimes, \mathbbm{1}$ be a <a href="20250307-symmetric_monoidal_infinity_category.html#ID-40c08a37-68ce-4dc1-8647-31caa12e9598">symmetric monoidal category</a>.
Then the picard groupoid is defined as <a href="20240404-maximal_subgroupoid.html#ID-333b5238-078c-4545-aa40-d87678f67985">groupoid core</a> of the <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a>.
</p>
