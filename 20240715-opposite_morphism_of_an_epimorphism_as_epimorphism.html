<span id="ID-af9d218a-893b-46ae-b544-46d896d734bd"></span><h1 class="title">opposite morphism of an epimorphism as epimorphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a>, $f: X \rightarrow Y$ a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$f$ is an <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">epimorphism</a> </li>

<li>the <a href="20240715-opposite_morphism_between_simplicial_sets.html#ID-b77abaa1-e067-48fe-9919-d04e9f6bab12">opposite morphism</a> $f^{\mathrm{op}}$ is an epi</li>
</ol>
<h2 id="proof">Proof</h2>
<ul>
<li><a href="20240109-left_adjoint_preserves_epimorphisms.html#ID-ffc5da9c-b335-44d3-bd6b-1f41fa12cf0e">left adjoint preserves epimorphisms</a> </li>
</ul>
