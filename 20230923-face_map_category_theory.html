<span id="ID-33641221-7fdf-41b9-a328-6b1af414de0c"></span><h1 class="title">face map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\Delta$ be the <a href="20230923-simplex_category.html#ID-2952609d-1bab-4ac4-bbd7-1c0814af1314">simplex category</a>.
Then the \(i\)-th face map is defined as <a href="20230112105042-monotone_abbildung.html#ID-fd948c7c-4e32-4778-9b82-865df89f680a">monotone map</a>
</p>

<div class="math-block">\begin{align*}
\partial^i: [k] \rightarrow&amp; [k+1] \\
j \mapsto&amp; 
    \begin{cases}
    j &amp; \mbox{if } j &lt; i \\
    j + 1  &amp; \mbox{else } \\  
    \end{cases}
\end{align*}</div>
