<span id="ID-7ece597c-bd99-4a02-9682-db019ae4eb48"></span><h1 class="title">standard etale algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $S$ be a commutative <a href="20221228202836-r_algebra.html#ID-f1401a23-6bbb-4e91-812e-071fddeb1e67">R-Algebra</a> over a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $R$.
Then $S$ is said to be standerd etale, if $S \simeq (R[x]/(f))_g$ where
</p>
<ol>
<li>$f$ is a <a href="20221226010524-normiertes_polynom.html#ID-f17a0f11-0953-4728-91a6-9a81df943813">monic</a> <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a> </li>

<li>$g$ is a polynomial, such that the <a href="20230110201419-ableitungsfunktion_eines_polynoms.html#ID-c98ee615-0976-4bde-b0e4-c2ee6d3ed778">derivative</a> is a unit in $R[x]/(f)$   </li>
</ol>
