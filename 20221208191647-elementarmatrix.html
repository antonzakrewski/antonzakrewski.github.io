<span id="ID-78b77753-7806-4c23-9442-63216ad410f8"></span><h1 class="title">Elementarmatrix</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $i \neq j$.
Eine Elementarmatrix $T_{ij}(\alpha) = (\alpha_{aj} \in K)$ hat die Form:
a) $\alpha \in K$ an der Stelle $\left(i,j\right)$ für $i \neq j$
b) $1$ auf der Diagonalen (d.h. $\alpha_{ii} = 1$ für alle $i$)
c) $0$ an allen anderen Stellen
</p>
