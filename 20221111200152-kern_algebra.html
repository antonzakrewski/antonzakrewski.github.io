<span id="ID-438e68de-0603-419c-8b21-5cb3b4add3a1"></span><h1 class="title">Kern (Gruppenhomomorphismus)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G,G'$ be <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a>, $1 \in G'$ the neutral element and $f: G \rightarrow G'$ a <a href="20220928134932-gruppenhomomorphismus.html#ID-7d86b4b2-8f83-4da4-b1ef-08c3d37aa417">group homomorphism</a>.
Then the kernel is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{ker}(f)  \coloneqq \{g \in G \vert f(g) = 1\}
\end{align*}</div>
