<span id="ID-f2dbbfee-efd0-499d-a674-c463b7e667c6"></span><h1 class="title">Menge der Inversionen</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $S_n$ die <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">Symmetrische Gruppe</a> und $\pi \in S_n$, dann ist die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der Inversionen für $\pi$ gegeben durch:
</p>

<div class="math-block">\begin{align*}
\mathrm{inv}(\pi) = \{(i,j) \in \{1,...,n\} \times \{1,...,n\} \vert i &lt; j \land \pi(i) &gt; \pi(j) \}
\end{align*}</div>
