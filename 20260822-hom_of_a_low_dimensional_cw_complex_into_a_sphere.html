<span id="ID-ce5b52a2-d759-46a8-bc96-21775c6903a2"></span><h1 class="title">hom of a low dimensional cw complex into a sphere</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complex</a> with cells in dimension $\leq n$, then there exists an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>

<div class="math-block">\begin{align*}
\pi_0(\mathrm{Hom}_{\mathrm{An}}(A, S^n)) \cong H^n(A,\mathbb{Z})
\end{align*}</div>
