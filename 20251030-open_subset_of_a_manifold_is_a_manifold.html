<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">Manifold</a> and $O\subseteq M$ an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> subset.
Then $O$ is also a <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">Manifold</a> (even <a href="20230724-untermannigfaltigkeit.html#ID-4cbfea3f-6f77-453a-b018-e39f14e31af2">submanifold</a>)
