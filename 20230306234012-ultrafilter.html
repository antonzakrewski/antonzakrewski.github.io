<span id="ID-88624d50-ad13-4c2a-ad1a-a1ed607768e9"></span><h1 class="title">Ultrafilter</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und $\mathcal{F}$ ein <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Mengenfilter</a> auf $X$.
Dann ist $\mathcal{F}$ ein Ultrafilter auf $X$, falls kein anderer, <a href="20230307220219-feinerer_filter.html#ID-bb924e3f-d87b-4236-b446-70032cc51df6">feinerer</a> <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Mengenfilter</a> existiert.
</p>
