<span id="ID-a028f145-69f4-4642-bab7-63f4512156f9"></span><h1 class="title">displacement of a map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20231121-finite_cw_complex.html#ID-a06cd5e3-3aed-4af2-a7b2-2b0a58b90a82">finite cw-complex</a> with a <a href="20220716173517-metrik.html#ID-0aa21afc-5f24-4618-a61e-e5ebf2e9640c">metric</a>  and $f: X \rightarrow X$ a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> without a <a href="20230106151403-fixpunkt.html#ID-824fe4ef-c999-4137-9c67-f6699ac21755">fixed point</a>.
Then the displacement of $f$ is defined as
</p>

<div class="math-block">\begin{align*}
\delta(f) \coloneqq \mathrm{inf}_{x \in X}(d(x,f(x))
\end{align*}</div>
