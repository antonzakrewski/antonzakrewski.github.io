<span id="ID-45207bd3-a18e-4c45-be42-4f43d9d64d4e"></span><h1 class="title">rouche theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f,g$ be <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic</a> in a <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $\overline{D}$ and assume that
</p>

<div class="math-block">\begin{align*}
\vert f(z) \vert  &gt; \vert g(z) \vert &amp; \forall z \in \partial D
\end{align*}</div>
<p>
Then $f$ and $f + g$ have the same number of zeros in $D$, counted with multiplicities
</p>
