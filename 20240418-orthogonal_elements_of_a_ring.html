<span id="ID-c83a7937-6237-49a1-9378-c36c49cce44a"></span><h1 class="title">orthogonal set of a ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $\{e_i\}$ a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of elements.
Then $\{e_i\}$ is said to be an orthogonal set if
</p>

<div class="math-block">\begin{align*}
e_i \cdot e_j = 0
\end{align*}</div>
<p>
for $i \neq j$
</p>
