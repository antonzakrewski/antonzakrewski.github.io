<span id="ID-5ec61ec7-94c1-48e4-ace6-125d0dbbb957"></span><h1 class="title">indecomposable representation</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20261013-representation_of_an_algebra.html#ID-2382e24c-8a21-4f51-94be-8f7cc7321c83">representation of an algebra</a> $V$ is said to be indecomposable, if $V \neq 0$ and there does not exist $V_1,V_2$ with $V_1, V_2 \neq 0$ such that $V \cong V_1 \oplus V_2$.
</p>
