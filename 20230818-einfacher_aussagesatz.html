<span id="ID-423243d4-297c-49eb-ae14-606d920065d6"></span><h1 class="title">einfacher Aussagesatz</h1>

<h2 id="definition">Definition</h2>
<p>
Ein einfacher Aussagesatz ist ein <a href="20220821085213-aussage.html#ID-372f5460-a89b-4876-9fbe-71865312af7d">Aussagesatz</a>, deren logische Form eine Folge von $n+1$ Ausdrücken ist, so dass
</p>
<ul>
<li>das erste Glied eine \(n\)-stellige <a href="20220926230519-pradikation.html#ID-3e323ea9-1b84-47b6-925e-ba2adb404c29">Prädikation</a> $P^n$ ist</li>

<li>das zweite bis \(n + 1\)-te Glied jeweils $n$ <a href="20230725-singularer_term.html#ID-7a517f86-1245-4c8b-8b39-fa0a556d64f0">singuläre Term</a> $t_1,...,t_n$ sind.</li>
</ul>
