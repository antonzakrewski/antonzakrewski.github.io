<span id="ID-edc40acf-84c0-4531-ad66-c1462a94f47d"></span><h1 class="title">ggT der Exponenten rausteilen</h1>

<h2 id="satz">Satz</h2>
<p>
Gegeben ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> $f = \sum_{i=0}^{n} \alpha_i X^n$ mit
</p>

<div class="math-block">\begin{align*}
g \coloneqq \mathrm{gcd}(i \vert \alpha_i \neq 0) \neq 1
\end{align*}</div>
<p>
kann es ratsam sein,
</p>

<div class="math-block">\begin{align*}
f = f'(X^g)
\end{align*}</div>


</div>
