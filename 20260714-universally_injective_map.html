<span id="ID-fdf71e59-8492-44bc-afe9-830cc1bde019"></span><h1 class="title">universally injective map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\varphi: M \rightarrow N$ be a map of \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">modules</a>.
Then $\varphi$ is said to be universally injective, if for every <a href="20221228202836-r_algebra.html#ID-f1401a23-6bbb-4e91-812e-071fddeb1e67">R-Algebra</a> $S$, the map $\varphi \otimes_{R} S: M \otimes_{R} S \rightarrow N \otimes_{R} S$ is <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injective</a>
</p>
