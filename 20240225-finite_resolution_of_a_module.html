<span id="ID-6b2e5bdb-265e-4775-87b5-11eebc56d825"></span><h1 class="title">finite resolution of a module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and $E_n$ a <a href="20230903-left_resolution.html#ID-e89108bc-65a7-4d25-98a1-e02783af9995">resolution</a>.
Then $E_n$ is said to be a finite resolution, if $E_n$ is of <a href="20240225-resoultion_of_finite_length.html#ID-c8883af0-7144-424f-8023-519368e4ae75">finite length</a> and a <a href="20240502-resolution_of_finitely_generated_modules.html#ID-b7f99a98-19e5-4856-bea2-b900145aa503">resolution of finitely generated modules</a>
</p>
