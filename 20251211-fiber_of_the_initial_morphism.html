<span id="ID-c8748e75-3d49-494e-86d2-1b8127095904"></span><h1 class="title">fiber of the initial morphism in Anima</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $0: \emptyset \rightarrow B$ be the <a href="20241014-initial_object_in_an_infinity_category.html#ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89">initial</a> map.
Then the <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber</a> of $0$ is given by $\emptyset$
</p>

<h2 id="proof">Proof</h2>
<p>
there exists a map
</p>

<div class="math-block">\begin{align*}
\mathrm{fib} \rightarrow \emptyset
\end{align*}</div>
<p>
<a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> $\mathrm{fib} = \emptyset$
</p>
