<span id="ID-643d2138-554f-41c0-9dd8-9ec3f3972bf9"></span><h1 class="title">lie algebra homomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathfrak{g}, \mathfrak{h}$ be <a href="20240331-lie_algebra.html#ID-60d606d5-b143-4a52-932b-9cc88b7d512b">Lie-Algebras</a>.
Then a <a href="20221119162741-vektorraumhomomorphismus.html#ID-863f0f55-054c-413e-9cf4-2c2704ea5b14">vectorspace-homomorphism</a> $\varphi: \mathfrak{g} \rightarrow \mathfrak{h}$ is said to be a lie algebra homomorphism if
</p>

<div class="math-block">\begin{align*}
[\varphi(v),\varphi(w)] = \varphi([v,w])
\end{align*}</div>
