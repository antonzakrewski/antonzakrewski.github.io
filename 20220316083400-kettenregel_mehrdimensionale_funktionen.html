<span id="ID-d6537032-9a80-4f1c-8374-b99e236a0293"></span><h1 class="title">Kettenregel (mehrdimensionale Funktionen)</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\frac{d}{dt} f(\vec{x(t)}) =&amp; \frac{d}{dt}f(x_1(t), x_2(t),..., x_n(t)) \\
=&amp; f_{x_1}(\vec{x}(t) \cdot \dot{x_1} + ... + f_{x_n}(\vec{x}(t)) \cdot \dot_{x_n})  \\
=&amp; \text{grad} f(\vec{x}(t)) \cdot \frac{d}{dt} \vec{x}(t)
\end{align*}</div>
