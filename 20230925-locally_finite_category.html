<span id="ID-7a393e8a-9ace-4e3a-bdb7-b49279a5410c"></span><h1 class="title">locally finite category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{C}$ is locally finite, if the <a href="20230403133054-hom_set.html#ID-1d0f0263-2498-4c3b-b9d1-e79b1fad0167">hom-set</a> $\mathrm{Hom}_{\mathcal{C}}(A,B)$ for $A,B \in \mathcal{C}$ is a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>
</p>
