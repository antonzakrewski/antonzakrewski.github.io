<span id="ID-ece4a963-9f41-4c24-9a1e-6e7be4a7a8e0"></span><h1 class="title">essential map between topological spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
Then $f$ is said to be essential, if
</p>

<div class="math-block">\begin{align*}
\Sigma^n f: \Sigma^n X \rightarrow \Sigma^n Y
\end{align*}</div>
<p>
is not <a href="20230331213346-nullhomotopic.html#ID-a7d1984d-81e7-4e03-ad95-59bc1cdaeda8">nullhomotopic</a>
</p>
