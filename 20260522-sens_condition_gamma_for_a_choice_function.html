<span id="ID-6871ae77-7f20-428d-a83d-24006acf7f3c"></span><h1 class="title">Sens condition gamma for a choice function</h1>

<h2 id="definition">Definition</h2>
<p>
Let $c: \mathcal{P}(X) \rightarrow \mathcal{P}(X)$ be a <a href="20231009-choice_function.html#ID-93c065b6-8f40-44dc-9750-12061ce4f598">choice function</a>.
Then $c$ satisfies Sens condition $\gamma$ if $x \in C(A \cup B)$ for all $x \in X, B \subseteq A \subseteq X$ with $x \in c(A), x \in c(B)$.
</p>
