<span id="ID-8a4d4670-b765-4905-be0a-365e38617f9e"></span><h1 class="title">essential morphism_</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> with <a href="20241022-cofiber_of_an_infinity_morphis3.html#ID-c9321dad-6e04-418b-a0a5-ad8546205938">cofibers</a>
Then a morphism $f: X \rightarrow Y$ is an essential morphism if $\Sigma^n f \neq 0$ for each $0$.
</p>
