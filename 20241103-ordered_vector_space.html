<span id="ID-8dd7d3aa-bacb-467a-9721-97c58fbce65f"></span><h1 class="title">ordered vector space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> over $\mathbb{R}$.
Then $X$ is said to be ordered, if it equipped with a <a href="20220817224552-quasiordnung.html#ID-bccd39d9-8112-4631-b0b0-41b568820901">preorder</a> $\leq$ such that for $x,y \in X$ with $x \leq y$ it follows that
</p>

<div class="math-block">\begin{align*}
r \cdot x + z \leq r \cdot y + z
\end{align*}</div>
<p>
for $r \geq 0, z \in X$
</p>
