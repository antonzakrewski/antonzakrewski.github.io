<span id="ID-24d75e6c-c6c0-48fb-9e97-0fdb88498b45"></span><h1 class="title">norm-analytic map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $D \subseteq \mathbb{C}$ be a <a href="20230306233037-gebiet.html#ID-dfa67937-8210-40a9-aaab-7c70743ea46c">region</a> and $X$ a $\mathbb{C}$-valued <a href="20221124132702-banachraum.html#ID-43ef125e-d9bb-454f-9427-4d3d8426893a">banach space</a>.
then $f$ is said to be norm-analytic, if it is <a href="20260714-norm_differentiable_map.html#ID-59f08dde-f617-407e-93b8-fb6d58318fe1">norm-differentiable map</a> in every point in $D$
