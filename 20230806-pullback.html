<span id="ID-730c4312-492d-4b9c-a347-9281309d3e6f"></span><h1 class="title">pullback</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $A,B,C \in \mathrm{Ob}(\mathcal{C})$ and $f \in \mathrm{Hom}_{\mathcal{c}}(A,C), g \in \mathrm{Hom}_{\mathcal{C}}(B,C)$.
A pullback is a <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> $P = A \times_{f,g} B$
</p>
