<span id="ID-b567735a-d2a6-499f-b1ec-fa9819e9aa87"></span><h1 class="title">identische Geraden</h1>

<h2 id="satz">Satz</h2>
<p>
Zwei <a href="20220207224841-gerade.html#ID-d80cd3d8-0f5b-481f-9034-4f26b426bade">Geraden</a> $g$ und $h$ sind identisch, falls gilt:
</p>
<ul>
<li>Ihre Richtungsvektoren sind <a href="20220920050250-lineare_unabhangigkeit_q12.html#ID-6a505e6a-5021-427c-9e0a-9eef46855f65">lineare abhängig</a> (vgl. <a href="20220207223846-parameterform_darstellung_einer_gerade.html#ID-c54c1af3-21a6-4444-842e-c084cb216785">Parameterform</a>)</li>

<li>Sie besitzen eine Lösung der Gleichung $g(\lambda') = h(\mu')$ und damit auch eine Lösung für ein beliebiges $\lambda'$</li>
</ul>
