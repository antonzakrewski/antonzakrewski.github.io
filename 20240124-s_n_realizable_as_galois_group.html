<span id="ID-481ad990-c624-443d-96b6-f5f9326aeb49"></span><h1 class="title">S_n realizable as galois group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $n \in \mathbb{N}$ and $S_n$ be the <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">symmetric group</a>.
Then there exists a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a> $f \in \mathbb{Q}[X]$ such that the <a href="20231022-galoisgruppe_eines_polynoms.html#ID-9bb6b1e5-6ba5-446a-b3a7-600bbb167e14">galois group of the polynomial</a> is $S_n$
</p>
