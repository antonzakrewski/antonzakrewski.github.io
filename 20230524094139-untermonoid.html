<span id="ID-1fd4d539-ed15-4239-8302-43c57d9cb669"></span><h1 class="title">submonoid</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,\cdot)$ ein <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">Monoid</a> und $U \subseteq M$.
Dann ist $U$ ein <a href="20230524094139-untermonoid.html#ID-1fd4d539-ed15-4239-8302-43c57d9cb669">Untermonoid</a>, falls $(U, \cdot)$ ein <a href="20230524094139-untermonoid.html#ID-1fd4d539-ed15-4239-8302-43c57d9cb669">Untermonoid</a> ist.
