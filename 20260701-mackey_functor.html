<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a &lt;nice&gt; <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>, $\mathcal{A}$ an <a href="20241217-additive_infinity_category.html#ID-e168d6e3-8dc6-424e-a950-8b24f6ed45f8">additive category</a> and $\mathrm{Span}(\mathcal{C})$ the <a href="20260701-span_category.html#ID-0f91858c-60b0-48f5-b563-bbaabae4914e">span category</a>.

</p>
