<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{F}: \mathrm{Ab} \rightarrow \mathcal{A}$ be an <a href="20230726-exact_functor.html#ID-9541d8fb-ddba-43d6-941a-32b3b3bd7086">exact functor</a> for an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> $\mathcal{A}$.
Then $\mathrm{ker}(\mathcal{F})$ is a <a href="20251027-serre_class.html#ID-affd7ccd-e9a4-46e3-85a3-d19b79e852e1">serre class</a>
