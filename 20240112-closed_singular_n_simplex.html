<span id="ID-2d8d2663-b344-4d8a-a5bc-9716bf81c8b2"></span><h1 class="title">closed singular n-simplex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $x \in C_n(X)$ be a <a href="20230901-i_kette_topology.html#ID-8d08bd27-b7a6-4a75-b50c-12b033ae1da4">singular n-chain</a>.
Then $x$ is said to be closed, if for the <a href="20230901-boundary_map_of_a_simplex.html#ID-a0218452-70ae-4217-8959-07378b2ff32e">singular boundary map</a> $d_n: C_n(X) \rightarrow C_{n-1}(X)$, it hold, that
</p>

<div class="math-block">\begin{align*}
d_n(x) = 0
\end{align*}</div>
