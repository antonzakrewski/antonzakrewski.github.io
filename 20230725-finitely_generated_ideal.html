<span id="ID-5991201d-b2b8-4c56-ab67-bd80dac44625"></span><h1 class="title">finitely generated ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $\mathfrak{a} \subseteq R$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then $\mathfrak{a}$ is said to be finitely generated, if there exist $a_1,...,a_n \in R$ such that
</p>

<div class="math-block">\begin{align*}
(a_1,...,a_n) = \mathfrak{a}
\end{align*}</div>
<p>
see: <a href="20230722-erzeugendensystem_eines_ideals.html#ID-8fefc2d7-34d4-4591-91cc-67ebfdffb814">Erzeugendensystem eines Ideals</a>
</p>
