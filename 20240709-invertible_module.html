<span id="ID-010f8a9b-b171-429f-be15-6cb62881df34"></span><h1 class="title">invertible module</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $\mathrm{RMod}$ the <a href="20230225170152-kategorie_mod.html#ID-15b21b3a-18bb-4d60-a716-c69681d7222d">category RMod</a>
Then a module $M$ is said to be invertible, if there exists an $N$ such that
</p>

<div class="math-block">\begin{align*}
M \otimes_A N \simeq A
\end{align*}</div>
