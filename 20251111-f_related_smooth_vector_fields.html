<span id="ID-1e60dbd9-7b37-4eb1-94cc-d85ae59d5b05"></span><h1 class="title">f-related smooth vector fields</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: M \rightarrow N$ be a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a> between <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifolds</a> and $X\in \mathfrak{X}(M), Y\in \mathfrak{X}(M)$ <a href="20221113224456-vektorfeld.html#ID-4ba13abc-c766-4899-bdb9-b74c537d86d2">smooth vector fields</a>.
Then $X$ and $Y$ are \(f\)-related if for all $p \in M$
</p>

<div class="math-block">\begin{align*}
Df_{p}: X_p = Y_{f(p)}
\end{align*}</div>
