<span id="ID-4ab083c8-b90a-4048-9c19-de9ca4fe8f49"></span><h1 class="title">stably symmetric monoidal infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
A stably monoidal infinity category is a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable</a> <a href="20250307-symmetric_monoidal_infinity_category.html#ID-40c08a37-68ce-4dc1-8647-31caa12e9598">symmetric</a> <a href="20250306-monoidal_infinity_category.html#ID-4b1bd9a8-674e-47cd-bfff-f5af725c95ab">monoidal infinity category</a> $\mathcal{C}, \otimes$ where the tensor product is <a href="20241022-exact_infinity_functor.html#ID-ad972639-9cea-45ab-8f5f-595d620392cf">exact</a> in in each variables.
</p>
