<span id="ID-f73f4325-e7d4-4989-913e-752181c0c7d0"></span><h1 class="title">negative orientierung einer Basis</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $(v_1,...,v_n), (b_1,...,b_n) \in \mathbb{R}^n$ geordnete <a href="20221030151204-basis_vektorraum.html#ID-4b0d1e47-5503-4b26-9ab3-a142097c2624">Basen</a>
Dann sind $(v_1,...,v_n)$ und $(b_1,...,b_n)$ positiv zueinander geordent, falls die  <a href="20221126201331-determinante.html#ID-eb5c60bd-2e36-4d02-aa16-f58c8e846d07">Determinante</a> der <a href="20221210160045-satz_uber_den_basiswechsel.html#ID-b624872f-ba84-4d92-bfdb-930136bbb24a">Basiswechselmatrix</a> positiv ist
</p>
