<span id="ID-fb1cdf10-3fa1-4554-b751-07499910b9da"></span><h1 class="title">Rabinowitsch spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then the Rabinowitsch spectrum is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}_{\mathrm{rab}}(A) = \{\mathfrak{m} \cap A \in \mathrm{Spec}(A) \vert \mathfrak{m} \subseteq A[X] \text{ maximal}\}
\end{align*}</div>
