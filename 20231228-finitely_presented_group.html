<span id="ID-41a1178c-c4d0-48bf-a701-8f7790afdcbd"></span><h1 class="title">finitely presented group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
</p>

<p>
Then $G$ is said to be finitely presented, if there exists a <a href="20231216-presentation_of_a_group.html#ID-7d0819e4-381a-43e4-9f5e-8adb052b5c39">presentation of a group</a> $(S,R)$ of a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $S$ and relations $R$, such that
</p>

<div class="math-block">\begin{align*}
\vert S \vert &lt;&amp; \infty \\
\vert R \vert &lt;&amp; \infty
\end{align*}</div>
<p>
are <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>
</p>


</div>
