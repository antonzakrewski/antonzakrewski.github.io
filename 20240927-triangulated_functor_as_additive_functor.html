<span id="ID-3fd7cc50-9d4d-436d-9f80-60c058753f84"></span><h1 class="title">triangulated functor as additive functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{D}, \mathcal{D}'$ be a <a href="20240611-pre_triangulated_category.html#ID-a61d8b15-70b4-4bf3-aa11-7cebeb6d189e">pre-triangulated categories</a> and $\mathcal{F}: \mathcal{D} \rightarrow \mathcal{D}'$ be a <a href="triangulated-functor.html#ID-0e11c52d-d1d8-425d-bb96-892541c443f4">triangulated functor</a>.
Then $\mathcal{F}$ is an <a href="20230827-additive_functor.html#ID-194ea42e-600c-4119-8889-5b46998201e6">additive functor</a>
</p>
