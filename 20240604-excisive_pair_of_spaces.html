<span id="ID-ef8616ee-7e12-46ea-ba4c-5293a0ce1c3c"></span><h1 class="title">excisive pair of pairs of spaces</h1>

<h2 id="definition">Definition</h2>
<p>

</p>

(X \times Y, X \times B, A \times Y)
\end{align*}</div>
