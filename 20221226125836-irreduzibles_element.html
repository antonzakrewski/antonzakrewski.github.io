<span id="ID-0cc3140d-cb4c-48a2-8cb6-2d9801e34db0"></span><h1 class="title">irreducible element</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">kommutativer Ring</a>.
$p \in R \setminus \{0\}$ ist irreduzibel, falls für $x,y \in R$ gilt:
</p>

<div class="math-block">\begin{align*}
p = xy \Rightarrow x \in R^{\times} \lor y \in R^{\times}
\end{align*}</div>
