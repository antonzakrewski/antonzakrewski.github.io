<span id="ID-6598aa2c-c26d-4984-95a7-68ee8edd829c"></span><h1 class="title">Umkehrbarkeit</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $X,Y$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und $f: X \rightarrow Y$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
Dann ist $f$ umkehrbar, falls eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $f^{-1}: Y \rightarrow X$ existiert mit
</p>

<div class="math-block">\begin{align*}
f^{-1} \circ f =&amp; \mathrm{id}_{X}  \\
f \circ f^{-1} =&amp; \mathrm{id}_{Y} 
\end{align*}</div>

</div>
