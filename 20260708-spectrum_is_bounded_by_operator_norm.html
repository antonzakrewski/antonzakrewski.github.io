<span id="ID-c3b22ffc-ca8b-44df-84af-d406a782b421"></span><h1 class="title">spectrum is bounded by operator norm</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $T \in \mathrm{BL}(X)$ , then the <a href="20260707-spectrum_of_a_bounded_lienar_functional.html#ID-44e9a02c-597a-49d9-baff-f7588ac96632">spectrum</a> $p(T) \subseteq \{z \vert \| z \| \leq \| T \|\}$
</p>

<h2 id="proof">Proof</h2>
<p>
For any $\vert z \vert &gt; \| T\|, we have $\| T / z \| &lt; 1$ and hence by <a href="20260708-neumann_series_of_a_bounded_linear_operator.html#ID-9b1b65cc-346c-4c7e-ab40-6da03d300981">neumann series of a bounded linear operator</a>
</p>
