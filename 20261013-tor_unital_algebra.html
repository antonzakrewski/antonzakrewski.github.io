<span id="ID-02b4fe3b-8027-4eac-ad1d-4e53b8f1303b"></span><h1 class="title">tor unital algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be an \(\mathbb{E}_1\) <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a> and $A$ an \(R\)-algebra.
Then $A$ is said to be tor unital, if the multiplication map
</p>

<div class="math-block">\begin{align*}
A \otimes_{R} A \rightarrow A
\end{align*}</div>
<p>
is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> of <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra</a>
</p>
