<span id="ID-7e459e96-da79-45f2-aab5-bd6a56881327"></span><h1 class="title">rank map as locally constant map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M$ a <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a> <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective module</a>.
Then the rank map
</p>

<div class="math-block">\begin{align*}
\mathrm{rk}: \mathrm{Spec}(R) \rightarrow \mathbb{N}_0
\end{align*}</div>
<p>
is <a href="20240903-locally_constant_map.html#ID-80369494-b256-438e-bd94-26330a5ff08e">locally constant</a>.
</p>
