<span id="ID-7d86b4b2-8f83-4da4-b1ef-08c3d37aa417"></span><h1 class="title">group homomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Gegeben seien zwei <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppen</a> $(G, \circ)$ und $(H, *)$.
</p>

<p>
Eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $\phi: G \rightarrow H$ heißt Gruppenhomorphismus, falls gilt:
</p>

<div class="math-block">\begin{align*}
\forall g_1 \in G \forall g_2 \in G : (\phi(g_1) * \phi(g_2) = \phi(g_1 \circ g_2))
\end{align*}</div>
