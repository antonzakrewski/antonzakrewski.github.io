<span id="ID-6c1b68ac-5656-490d-a1e9-f1dc33948f84"></span><h1 class="title">A-nilpotent pi-group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20260216-pi_group.html#ID-3d2528ef-1e88-4cb1-a07d-639da35eacfb">pi-group</a> and $\mathcal{A} \subseteq \mathrm{Grp}$ a collection of groups, then $G$ is said to be a \(\mathcal{A}\)-nilpotent $\pi$ group if there exists an <a href="20260216-a_central_pi_series.html#ID-907e2ea8-ee17-479f-876c-5765688234f3">A-central pi-series</a>
</p>
