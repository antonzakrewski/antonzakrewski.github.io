<span id="ID-77de4316-1f70-4acf-b894-5826213c1a60"></span><h1 class="title">extending local on the base properties of morphisms of rings</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $P$ be a <a href="20260802-property_in_a_category.html#ID-bd04268c-9bb1-4e3e-a384-1bb0bcd4b7da">property</a> of $\mathrm{Ar}(\mathrm{CRing}$.
Suppose <a href="20260719-property_local_on_the_base.html#ID-af7d8e43-88ea-45e6-b0d6-f728e8ac230a">P is local on the base</a>, then  it extends uniquely to a property of  <a href="20260724-affine_morphism_of_algebraic_functors.html#ID-4c2d66a8-67b6-47b1-b210-b8e29a921330">affine morphisms of</a> <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">schemes</a>, that is local on the base.
</p>
