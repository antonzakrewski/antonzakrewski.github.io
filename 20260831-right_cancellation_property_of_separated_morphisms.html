<span id="ID-7d48e1f2-0977-4adc-ae36-901776f77016"></span><h1 class="title">right cancellation property of separated morphisms</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $Z \xrightarrow{g} Y \xrightarrow{f} X$ be morphisms of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Suppose that $f \circ g$ is a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a> and $f$ is <a href="20260716-separated_map_of_algebraic_functors.html#ID-64189ee2-b49e-4eb2-a1f2-0107dfbcddb5">separated</a>, then $g$ is a closed immersion.
</p>
