<span id="ID-7bbd1182-fe69-4ceb-91b2-6c89a00eb8b8"></span><h1 class="title">category of finite field extensions</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>

</p>
