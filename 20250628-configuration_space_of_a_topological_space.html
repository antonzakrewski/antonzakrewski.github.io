<span id="ID-91a88808-e9db-4768-bbb5-41dd5800c175"></span><h1 class="title">configuration space of a topological space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $S$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> endowed with the <a href="20221002144647-diskrete_topologie.html#ID-c9466868-60fd-4b1f-ae1c-1bf7606f3ec7">discrete topology</a> and $X$ any <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> .
Then the \(S\)-configuration space is defined as <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Inj}(S, X) \subseteq \mathrm{Map}(S, X)
\end{align*}</div>
