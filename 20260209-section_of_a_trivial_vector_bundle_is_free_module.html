<span id="ID-ffd0ecf3-1ff6-4fe2-8ea6-87f513d4aa7e"></span><h1 class="title">sections of a trivial vector bundle is free module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>, $p: M \times \mathbb{R}^n \rightarrow M$ the <a href="20230903-trivial_vector_bundle.html#ID-046cc27d-41e5-41d4-b359-77088aff15d6">trivial real vector bundle</a>.
Then $\Gamma(p)$ is a <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">free module</a> of <a href="20230222205618-rang_eines_moduls.html#ID-32dff54d-1956-4458-9354-10f3d29e3ed4">rank</a> $n$.
</p>
