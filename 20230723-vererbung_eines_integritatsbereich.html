<span id="ID-0e4725de-f29c-4678-b2d6-c34c7faf6443"></span><h1 class="title">Vererbung eines Integritätsbereich</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> und $S \subseteq R$ ein <a href="20230227130935-unterring.html#ID-157d533b-1650-499e-be1d-341b1fa8fa15">Unterring</a>.
Dann ist $S$ ebenfalls ein Integritätsbereich
</p>

<h2 id="beweis">Beweis</h2>
<p>
Nach Annahme existieren in $R$ keine nichttriviale <a href="20221226125328-nullteiler.html#ID-dc985755-3df5-4b03-929e-659ee65ad000">Nullteiler</a>, damit auch insbesondere auch nicht in $S$
</p>
