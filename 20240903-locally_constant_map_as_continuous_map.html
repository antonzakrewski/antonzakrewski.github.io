<span id="ID-8a9f7c58-39a3-4cef-9df6-9fb7fcca5243"></span><h1 class="title">locally constant map as continuous map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $f: X \rightarrow Y$ a <a href="20240903-locally_constant_map.html#ID-80369494-b256-438e-bd94-26330a5ff08e">locally constant map</a>
Then $f$ is <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a>
</p>
