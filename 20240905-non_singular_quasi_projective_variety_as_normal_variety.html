<span id="ID-5ca0e17d-bd88-4c73-b7d7-e2097a4589de"></span><h1 class="title">non-singular quasi-projective variety as normal variety</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a>  <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a> and $X \subseteq \mathbb{P}_{K}^n$ a <a href="20241206-nonsingular_quasi_projcective_variety.html#ID-b6bfc819-0873-4932-8876-b267c3705c60">nonsingular</a> <a href="20230907-quasi_projective_variety.html#ID-7b70c39a-5b6f-4604-ad2c-e24b4d98ee60">quasi-projective variety</a>.
</p>

<p>
Then $X$ is a <a href="20240905-normal_quasi_projective_variety.html#ID-7deb6f1d-d8ed-484e-ae33-090fd273e450">normal quasi-projective variety</a>
</p>
