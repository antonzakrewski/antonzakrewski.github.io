<p>

Die Restklasse von $a$ modulo $m$

% =&amp; a + m \mathbb{Z} \\
=&amp; \{b \vert b = a + k \cdot m, k \in \mathbb{Z}\}
\end{align*}</div>

ist die <span class="broken-link" title="unresolved id:5ee76318-ae03-4cb3-877f-6b6ff88ad6fa">Äquivalenzklasse</span> von $a$ bezüglich der <a href="20220304180058-kongruenz_zahlentheorie.html#ID-c5f66615-7d0e-43db-b6ad-abad6fbc3658">Kongruenz</a> modulo $m$
