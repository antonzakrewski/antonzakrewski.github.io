<span id="ID-72751e64-f284-4fca-810e-6211cf5485ec"></span><h1 class="title">simplicial identity of commuting degeneracy maps</h1>

<h2 id="proposition">Proposition</h2>
<p>
Given the opposite <a href="20230923-simplex_category.html#ID-2952609d-1bab-4ac4-bbd7-1c0814af1314">simplex category</a> $\Delta^{\mathrm{op}}$ (and hence every <a href="20230923-simplicial_object.html#ID-1501453f-3753-43db-ab32-9f7cf332945d">simplicial object</a>) for $i \leq j$, it holds for the <a href="20230923-degeneracy_map_category_theory.html#ID-f8817509-7551-4eeb-8d9d-a121ee359e75">degeneracy map</a>
</p>

<div class="math-block">\begin{align*}
\sigma_j \circ \sigma_i = \sigma_i \circ \sigma_{j-1}
\end{align*}</div>
