<span id="ID-18bb5953-1ca0-4fdb-87dc-5aab3f063fa1"></span><h1 class="title">bousfield classes and tensor product</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $E,X,F$ be <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra</a> such that $F$ is \(E\)-<a href="20260215-e_acyclic_spectrum.html#ID-dc701420-f509-471a-935c-d2c2f28108d2">acyclic</a>.
Then $X \otimes_{\mathbb{S}} F$ is also \(E\)-acyclic.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as the tensor product is <a href="20250307-symmetric_monoidal_infinity_category.html#ID-40c08a37-68ce-4dc1-8647-31caa12e9598">symmetric monoidal structure</a>
</p>
