<span id="ID-28708d4d-deb6-4787-984a-bbdb1bff9a20"></span><h1 class="title">Biholomorphe Funktion</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M,N$ <a href="20230905-komplex_differenzierbare_mannigfaltigkeit.html#ID-73078df1-9429-41be-af61-85d3e07b5b4e">komplexe Mannigfaltigkeiten</a> und $f: M \rightarrow N$ eine <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">Bijektion</a>.
Dann ist $f: M \rightarrow N$ ein Biholomorphismus, falls $f,f^{-1}$ jeweils <a href="20230907-holomorphe_abbildung_zwischen_komplexen_mannigfaltigkeite.html#ID-a85c8e7b-a10c-4d9d-a66a-715f38bdbab8">holomorph</a> sind.
</p>
