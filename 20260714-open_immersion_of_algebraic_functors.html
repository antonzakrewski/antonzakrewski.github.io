<span id="ID-fd558b43-65ae-46ba-b2da-122e5e128c19"></span><h1 class="title">open immersion of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $j: X \rightarrow Y$ be a map of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Then $j$ is an open immersion, if it is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> whose image is an <a href="20260713-open_subfunctor_of_an_algebraic_functor.html#ID-3591ec98-a7a9-4668-a975-fdf935c815e8">open subfunctor</a>
</p>
