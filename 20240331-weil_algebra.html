<span id="ID-0501f235-0bd5-4990-9dc4-f0c67c1dd0d2"></span><h1 class="title">Weil-Algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, dann ist eine \(n\)-te Weil-Algebra definiert als
</p>

<div class="math-block">\begin{align*}
R[X_1,...,X_n]/(f_1,...,f_m)
\end{align*}</div>

<p>
so dass $(1,0,...,0)$ das einselement ist und
das ideal
</p>

<div class="math-block">\begin{align*}
\langle (0,x_2,...,x_n)\rangle
\end{align*}</div>
<p>
<a href="20230904-nilpotent_ideal.html#ID-0794a339-36ae-4b04-be2a-53de597632b7">nilpotent ideal</a>
</p>
