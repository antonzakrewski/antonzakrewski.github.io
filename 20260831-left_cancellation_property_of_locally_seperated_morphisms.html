<span id="ID-0fa38b8c-e988-462d-a4cc-a1d0ab796066"></span><h1 class="title">left cancellation property of locally seperated morphisms</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $Z \xrightarrow{g} Y \xrightarrow{f} X$ be morphisms of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Suppose that $f \circ g$ is a <a href="20260716-locally_separated_map_of_algebraic_functors.html#ID-f8f114fa-79db-4612-b9c4-0c8c084f7577">locally separated morphism</a>, then so is $g$
</p>
