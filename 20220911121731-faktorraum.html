<span id="ID-d2c3fc95-35f3-4882-8c30-06959d0b1f79"></span><h1 class="title">quotient vector space</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> und $U \subseteq V$ ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Unterraum</a>.
Für $a \in V$ sei $a + U = \{a + u \vert u \in U\} \subseteq V.
Der Faktorraum von $V$ nach $U$ ist definiert als:
</p>

<div class="math-block">\begin{align*}
V / U = \{a + U \vert a \in V\}
\end{align*}</div>
