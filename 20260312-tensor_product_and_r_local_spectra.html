<p>
Let $R = \mathbb{Z}[p^{-1} \vert p \in P] \subseteq \mathbb{Q}$ be a <a href="20230227130935-unterring.html#ID-157d533b-1650-499e-be1d-341b1fa8fa15">subring</a> and $X$ an <a href="20260312-r_local_spectrum.html#ID-b6cce41b-8f55-46d2-8043-6e03ffd6b9a4">R-local spectrum.</a>
Then $X \otimes_{\mathbb{S}} Y$ is R-local for each spectrum $Y$.
</p>
