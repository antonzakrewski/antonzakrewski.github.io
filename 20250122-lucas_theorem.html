<span id="ID-65e76761-7b89-4255-9722-cc891def1486"></span><h1 class="title">Lucas Theorem</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $0 \leq k \leq n$, $p \in \mathbb{N}$ prime, $k = \sum_{i=0}^l k_i p^i$ and $n = \sum_{i = 0}^{l} n_i p^i$ and $0 \leq k_i,n_i &lt; p$.
Then
</p>

<div class="math-block">\begin{align*}
\binom{n}{k} \equiv \prod_{i=1}^l \binom{n_i}{k_i} \mathrm{mod} p
\end{align*}</div>
