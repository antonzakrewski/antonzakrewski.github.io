<span id="ID-4ff55e55-c6e4-4453-a2f0-95c1ebf262f3"></span><h1 class="title">idempotent ring spectrum and multiplication</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$R$ is an <a href="20260417-idempotent_spectrum.html#ID-27575593-fcfb-470b-8fb1-2b8244aec8bf">idempotent ring spectrum</a>, i.e. $R \rightarrow R \otimes R$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> </li>

<li>$R \otimes R \rightarrow R$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> </li>
</ol>
