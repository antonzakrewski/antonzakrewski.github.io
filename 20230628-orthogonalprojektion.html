<span id="ID-49dcf74d-6fab-460d-a38b-d05aa50e429e"></span><h1 class="title">Orthogonalprojektion</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilbertraum</a> und $P: V \rightarrow V$ ein <a href="20230303151710-vektorraumendomorphismus.html#ID-ecd3affd-0dbf-4f53-8c43-79af608c67e9">Endomorphismus</a> und $U \subseteq V$ ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Untervektorraum</a>.
Dann ist $P$ eine Orthogonalprojektion, falls $P$ eine <a href="20230628-projektion.html#ID-23da86e5-dc06-470a-b6b8-a9564f520047">Projektion</a> ist mit
</p>

<div class="math-block">\begin{align*}
p(v) = u
\end{align*}</div>
<p>
für $v = u + w, u \in U, w \in U^{\bot}$
</p>
