<span id="ID-c72343ff-76a5-44ce-b65b-4525734f34f2"></span><h1 class="title">coproduct of covering maps in both arguments as covering map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $p_i: E_i \rightarrow B_i$ be <a href="20230729-covering_map.html#ID-b817dc02-5dea-4e8d-8ccd-adf7ef14e6bc">covering maps</a>,
Then
</p>

<div class="math-block">\begin{align*}
\coprod p_i: \coprod E_i \rightarrow \coprod B_i
\end{align*}</div>
<p>
is also a covering map
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the locality of the definition
</p>
