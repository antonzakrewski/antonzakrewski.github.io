<span id="ID-00146484-4743-4298-8bc0-d128ee201a84"></span><h1 class="title">aktuer-relativ / akteur-neutrale Handlungsgründe</h1>

<h2 id="definition">Definition</h2>
<p>
Ein akteur-relativer Handlungsgrund ist ein Handlungsgrund, der sich explizit auf die handelnde Person bezieht.
Ein akteur-neutraler Handlungsgrund ist ein Handlungsgrund, der unabhängig von der Person als guter Grund anerkannt wird.
