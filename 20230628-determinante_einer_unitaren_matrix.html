<span id="ID-44329070-b51d-4334-96d8-0f542af28fd2"></span><h1 class="title">Determinante einer unitären Matrix</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $A \in \mathbb{C}^{n \times n}$ eine <a href="20230628-unitare_matrix.html#ID-95ce0efd-44be-410d-8455-4388b16899b6">unitäre Matrix</a>, so gilt für die <a href="20221126201331-determinante.html#ID-eb5c60bd-2e36-4d02-aa16-f58c8e846d07">Determinante</a>:
</p>

<div class="math-block">\begin{align*}
\det(A) = e^{\mathrm{i} x}
\end{align*}</div>
