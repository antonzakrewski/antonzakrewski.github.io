<span id="ID-2c9f530b-0c58-4a29-86c0-04fed690e05b"></span><h1 class="title">residue field at a point of a scheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a>.
Then for $x \in X$ the residue field is defined as
</p>

<div class="math-block">\begin{align*}
\mathcal{O}_x/ \mathfrak{m}_x
\end{align*}</div>
<p>
where $\mathcal{O}_x$ is the <a href="20230825-stalk.html#ID-6fcbbbf4-984b-401a-840b-c614a03bd6a7">stalk</a> and $\mathfrak{m}_x$ is the <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a> of the <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a> $\mathcal{O}_x$
</p>
