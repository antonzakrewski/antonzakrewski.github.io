<span id="ID-519add31-e07b-404b-9241-2d85ec57ffe8"></span><h1 class="title">ring of regular functions as coordinate ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $\mathbb{A}_{K}^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a> and $X \subseteq \mathbb{A}_{K}^n$ be an <a href="20230313162316-affine_varietat.html#ID-d401938b-d6e1-4d50-a84a-73eb4e945380">affine variety</a>.
Then the <a href="20230725-coordinate_ring_of_an_affine_variety.html#ID-a8a51cad-5066-4ea6-b16e-eb4381a5dcae">coordinate ring</a> of $X$ is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> to the <a href="20230916-ring_of_regular_functions.html#ID-aa223062-3fc0-4fc3-8d27-25754a4e50be">ring of regular functions of an affine variety</a>.
</p>
