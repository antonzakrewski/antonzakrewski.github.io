<span id="ID-339ea8b3-0652-407f-bc2d-ca1e3c06b63b"></span><h1 class="title">homotopy category of a pointed category admitting cofibers as additive category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity category</a> and suppose that the <a href="20241022-suspension_of_a_stable_infinity_category.html#ID-67566a91-a891-4523-b9b0-3c70ae69285f">suspension</a> functor is a <a href="20240703-joyal_equivalence_between_simplicial_sets.html#ID-0b735a57-8c6f-4e38-a681-e5cd3c5c2fad">joyal equivalence</a>
Then the <a href="20240715-homotopy_category_of_a_model_structure.html#ID-66c83e4b-98f4-44e8-bb7b-bee7f06ca0a2">homotopy category</a> $h \mathcal{C}$ is an <a href="20230827-additive_category.html#ID-e50cd553-69ee-4360-bd27-43b73e7a9945">additive category</a>
</p>
