<span id="ID-96734d9f-cd02-4008-9e38-65e80f86bbf5"></span><h1 class="title">reduced singular homology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,x)$ be a <a href="20230331112759-based_space.html#ID-2b4bad5a-2a2b-4aac-8f24-1ed9951887f8">based space</a>, then the reduced singular homology $\tilde{H}_n$ is defined
</p>

<div class="math-block">\begin{align*}
\tilde{H}_n =&amp; \mathrm{coker}(H_n(*) \rightarrow H_n(X,x))
\end{align*}</div>
