<span id="ID-04463860-40bb-4fa7-b90f-9d71dcb838ec"></span><h1 class="title">local property of morphisms</h1>

<h2 id="definition">Definition</h2>
<p>
Let $P$ be a property of <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> of <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">schemes</a>.
Then $P$ is local if it is <a href="20260719-property_local_on_the_source.html#ID-b99f3ee7-8d97-402a-a485-aa1fc64b18ae">local on the source</a> &amp; <a href="20260719-property_local_on_the_base.html#ID-af7d8e43-88ea-45e6-b0d6-f728e8ac230a">local on the base</a>.
