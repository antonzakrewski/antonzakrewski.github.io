<span id="ID-9e35ba28-8260-48ca-869c-531b0374e00d"></span><h1 class="title">poincare duality complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20250503-compact_anima.html#ID-4350f2db-b8b4-4124-b850-2a59af4df2dd">compact anima</a>.
Then $X$ is said to be a poincare duality complex, if
</p>

<div class="math-block">\begin{align*}
D_X \in \mathrm{Fun}(X, \mathrm{Pic}(\mathbb{S})) \subseteq \mathrm{Fun}(X, \mathrm{Sp})
\end{align*}</div>
<p>
restricts to the <a href="20250521-picard_of_the_sphere_spectrum.html#ID-d0587ae7-68bc-4ab7-a287-a6303331928d">Picard of the sphere spectrum</a>
</p>
