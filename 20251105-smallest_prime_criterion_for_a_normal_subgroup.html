<span id="ID-bb0f6cf6-8197-4cc8-a879-1399a7971ab1"></span><h1 class="title">smallest prime criterion for a normal subgroup</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> of <a href="20221225213606-ordnung_gruppe.html#ID-fb68b5de-9a0c-4c45-8ee9-eb232370ed2e">group order</a> $n$.
Suppose $H$ is a <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a> of order $p$ such that $p$ is the smallest prime dividing $n$.
</p>

<p>
Then $H$ is a <a href="20221210192900-normalteiler.html#ID-f971f946-d0ca-444a-a450-efbef237a278">normal subgroup</a>
</p>
