<span id="ID-9fec4b3e-6ef0-402d-8520-84d472c133ff"></span><h1 class="title">clutching construction induces bijection</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20230301102114-kompakter_raum.html#ID-42e72d20-188a-4a96-b46c-f62f622ff9c7">compact</a> <a href="20221122074811-hausdorff_raum.html#ID-f49f9b47-9f16-456f-837f-7b9656c46aba">hausdorff</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">space</a>.
Then the <a href="20241005-clutching_construction_for_vector_bundles.html#ID-60da7fae-8699-4a85-8d34-380d8c1a7f16">clutching construction</a> induces a bijection
</p>

<div class="math-block">\begin{align*}
[X,\mathrm{GL}_n(\mathbb{K})] \cong \mathrm{Vect}_n(\Sigma X) 
\end{align*}</div>
