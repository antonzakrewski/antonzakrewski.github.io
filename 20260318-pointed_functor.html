<span id="ID-6e3ce10b-63b6-4def-bb8b-2d1c163676e7"></span><h1 class="title">pointed functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor.</a>
Then $\mathcal{F}$ is said to be pointed, if it <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves</a> the <a href="20241017-infinity_zero_object.html#ID-ec40b632-b794-428c-b987-81a9b53bd650">zero object</a>
</p>

<p>
I guess it is (mostly) just a different word for reduced functor :/
</p>
