<span id="ID-4353d871-33f0-4dc8-b56c-6d6f51c64671"></span><h1 class="title">Produkterhaltende Abbildung</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $V,W$ <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">Prähilberträume</a> über dem gleichen <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $A \in \mathrm{Hom}_{}(V,W)$
Dann ist $A$ eine produkterhaltende Abbildung, falls für alle $v,w \in V$ gilt:
</p>

<div class="math-block">\begin{align*}
(v,w)_V = (Av, Aw)_W
\end{align*}</div>
