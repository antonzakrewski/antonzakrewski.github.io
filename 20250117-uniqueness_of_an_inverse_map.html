<span id="ID-27b6351d-a11b-4a37-84ec-8669bdac8dc4"></span><h1 class="title">uniqueness of an inverse map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A,B$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> and $f: A \rightarrow B$ a <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">Bijection</a>
Then the <a href="20210318211130-umkehrfunktion.html#ID-35d2e288-1bec-4daf-866a-99566d5d0d8f">inverse map</a> is unique.
</p>

<h2 id="proof">Proof</h2>
<p>
special case of <a href="20230403175130-uniqueness_of_a_two_sided_inverse_morphism.html#ID-eeec873b-3ed0-43a8-a312-f9097223acc0">uniqueness of a two-sided inverse morphism</a>
</p>
