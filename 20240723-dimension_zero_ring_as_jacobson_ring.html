<span id="ID-052c378f-00fd-47f0-adf3-721a8228f8cb"></span><h1 class="title">dimension zero ring as jacobson ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> with <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimension</a> $0$.
Then $R$ is a <a href="20230725-jacobson_ring.html#ID-b17f8891-8d7b-454c-9c22-773ed8d942e1">Jacobson ring</a>
</p>

<h2 id="proof">Proof</h2>
<p>
note that each <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideal</a> is <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal</a>, hence this holds.
</p>
