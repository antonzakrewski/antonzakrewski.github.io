<span id="ID-d6ed25e6-8ebf-4836-b92b-57cc2f1f28c4"></span><h1 class="title">automorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Ein Automorphismus eines <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">Objektes</a> A ist ein <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">Isomorphismus</a> $f: A \rightarrow A$, d.h. es gibt einen <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">Morphismus</a> $g: A \rightarrow A$  mit:
</p>

<div class="math-block">\begin{align*}
f\circ g = Id_{A}
\end{align*}</div>
<p>
(vgl. <a href="20220817165031-identitatsmorphismus.html#ID-18d8207c-a2f4-499b-ab59-b7efe4858e31">Identitätsmorphismus</a>)
</p>
