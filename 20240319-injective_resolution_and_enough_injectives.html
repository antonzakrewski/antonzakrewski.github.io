<h2 id="proposition">Proposition</h2>
<p>

<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$\mathcal{A}$ admits <a href="20231212-enough_injectives.html#ID-f93303c0-0da2-4014-aea8-4a271d5c74a4">enough injectives</a></li>

<li>each <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $A$ in $\mathcal{A}$ admits an <a href="20240319-injective_coresolution.html#ID-d76386fb-0aa3-45c1-964e-27347b0cdfa2">injective coresolution</a></li>
</ol>
