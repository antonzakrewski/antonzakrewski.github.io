<span id="ID-4aaf364e-28c1-46d6-9dd4-c4f24aee6b7c"></span><h1 class="title">underlying graded module over the underlying graded ring of a module spectrum</h1>

<h2 id="definition-proposition">Definition / Proposition</h2>
<p>
