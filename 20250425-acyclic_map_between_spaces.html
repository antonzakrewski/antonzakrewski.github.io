<span id="ID-f4e36710-8925-4856-9968-b0ca0484121b"></span><h1 class="title">acyclic map between spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20230331112759-based_space.html#ID-2b4bad5a-2a2b-4aac-8f24-1ed9951887f8">based spaces</a> and $f: X \rightarrow Y$ a <a href="20230331111108-based_map.html#ID-aa4fea9e-f25f-4f59-845f-bdc4d31a8654">based map</a>.
Then $f$ is said to be acyclic, if the <a href="20240702-homotopy_fibre.html#ID-54aeb20a-4a90-4f8e-b8f2-6110f73fe306">homotopy fibre</a> is an <a href="20250425-acyclic_space.html#ID-c16c914a-c7ff-494a-bc99-e09fc9af2dd8">acyclic space</a>
</p>
