<span id="ID-eb875ce2-1868-4136-af2e-ee55899db6b2"></span><h1 class="title">combinatorial euler characteristic of a cw complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20231121-finite_cw_complex.html#ID-a06cd5e3-3aed-4af2-a7b2-2b0a58b90a82">finite cw-complex</a>, then the combinatorial euler characteristic is defined
</p>

<div class="math-block">\begin{align*}
\chi_{\mathrm{CW}}(X) = \sum_{n \geq 0} (-1)^n \vert J_n \vert
\end{align*}</div>
<p>
where $J_n$ is the <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of $\mathrm{CW}$ cells
</p>
