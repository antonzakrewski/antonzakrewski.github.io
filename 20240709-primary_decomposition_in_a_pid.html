<span id="ID-0f4c0b80-ad1d-403e-abe2-6720ede26cfd"></span><h1 class="title">primary decomposition in a pid</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221227223925-hauptidealring.html#ID-41717608-2c65-435a-aca7-549eff5b4ca2">principal ideal domain</a>, $(a) \subseteq A$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>
</p>

<p>
Then a <a href="20240709-primary_decomposition.html#ID-e6fb74c8-ac54-4f3b-a9c1-7971d9f5c275">primary decomposition</a> for $a = \prod p_i^n$ is given by
</p>

<div class="math-block">\begin{align*}
a = \bigcap (p_i^n) 
\end{align*}</div>

<h2 id="proof">Proof</h2>
<ul>
<li><a href="20230410004550-product_of_coprime_ideals_equals_intersection.html#ID-e03799a6-13b3-42ff-b2fe-0808d2659c5e">Product of coprime Ideals equals Intersection</a></li>
</ul>
