<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima.</a>
Then the category of strict coverings is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full sub infinity category</a> of $\mathrm{LFib}(X)$ containing <a href="20250310-strict_covering_of_an_anima.html#ID-00707035-54c7-47b7-bc23-5f29341e2661">strict coverings</a>
