<span id="ID-86fdaa6e-51bf-4779-857d-50e436838787"></span><h1 class="title">topological space of a scheme in general not compact</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{O}_X, O_i)$ be a <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a>.
Then $X$ is in general not <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a>
</p>

<h2 id="proof">Proof</h2>
<p>
consider the <a href="20240905-coproduct_of_schemes.html#ID-bade133e-1bd5-4d94-a465-ff7edd1a8519">disjoint glueing of schemes</a> for <a href="20230826-infinite.html#ID-66aecdb2-720e-4e41-9a27-dab1700474fc">infinitely</a> many $U_i$
</p>
