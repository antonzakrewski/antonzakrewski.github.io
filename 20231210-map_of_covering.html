<span id="ID-92f224c5-7fd5-427d-b514-fb57c7b95d99"></span><h1 class="title">map of covering</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B,E,E'$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $p: E \rightarrow B, p': E' \rightarrow B$ <a href="20230729-covering_map.html#ID-b817dc02-5dea-4e8d-8ccd-adf7ef14e6bc">covering maps</a>.
A map of covering is a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a> in the <a href="20231208-category_of_covering_maps.html#ID-08acd67c-5e99-4f6b-a763-94d0fdbe9d26">category of covering maps</a>
</p>

<p>
resp. a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> map
