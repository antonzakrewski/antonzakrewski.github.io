<span id="ID-77f6a16a-9a94-40d9-aca9-919bb4f8998f"></span><h1 class="title">Beschränktheit einer Folge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ ein <a href="20221003143917-normierter_raum.html#ID-250c7843-ade4-44e9-9d45-05423ddaa1d8">normierter Raum</a>  und die <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Folge</a> $(a_n)$ in $M$.
$(a_n)$ ist beschränkt, falls ein $m \in M$ und $r \in \mathbb{R}$ existieren, so dass für alle $s \in M$ gilt:
</p>

<div class="math-block">\begin{align*}
\| a_n \| \leq r \forall n \in \mathbb{N} 
\end{align*}</div>
