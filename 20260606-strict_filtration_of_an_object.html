<span id="ID-399595e3-2131-4d7f-9309-72428c1341d7"></span><h1 class="title">strict filtration of an object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>
Then a strict filtration of an object $x \in \mathcal{C}$ is given by a <a href="20260606-category_of_filtrations.html#ID-7e4038f2-fc5d-49a5-b8bf-53e437560c38">filtration</a> $X: (\mathbb{Z} \cup \{- \infty\})^{\mathrm{op}} \rightarrow \mathcal{C}$ such that each morphism is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a>
</p>
