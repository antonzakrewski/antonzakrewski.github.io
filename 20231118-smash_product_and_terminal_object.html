<span id="ID-66ebeeef-3424-4637-aee5-8cb6f9acdf9c"></span><h1 class="title">smash product preserves terminal object</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X,x_0)$ be a <a href="20230331112759-based_space.html#ID-2b4bad5a-2a2b-4aac-8f24-1ed9951887f8">based space</a> and $\{*\}$ the <a href="20220825145511-terminales_objekt.html#ID-16825b5e-51d8-4e5e-ac19-2a05cd9fb110">terminal object</a>.
Then
</p>

<div class="math-block">\begin{align*}
X \wedge \{*\} \cong \{*\}
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
follows from construction, as
</p>

<div class="math-block">\begin{align*}
X \wedge \{*\} = \{[*]\}
\end{align*}</div>

</div>
