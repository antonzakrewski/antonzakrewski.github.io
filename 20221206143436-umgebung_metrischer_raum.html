<span id="ID-c68f3091-12bb-48b4-896f-9d42d8ef1d09"></span><h1 class="title">Umgebung (metrischer Raum)</h1>

<h2 id="definition-satz">Definition / Satz</h2>
<p>
Sei $M$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>, $x \in M$ und $U \subset M$.
$U$ ist eine Umgebung von $x$, wenn $x$ ein <a href="20221027080050-innerer_punkt.html#ID-0e0b3053-63c0-4dea-9ce2-a419979c1f2b">innerer Punkt</a> von $U$ ist, d.h. es existiert eine <a href="20221027092741-epsilon_umgebung.html#ID-b8422ae4-c20f-468f-8f66-aa736833f806">epsilon-Umgebung</a> $U_{\varepsilon}(x)$ von $x$ mit $U_{\varepsilon}(x) \subseteq U$
</p>
