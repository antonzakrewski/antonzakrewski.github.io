<span id="ID-76efb2a8-50c8-4207-a379-3d6cc80c81be"></span><h1 class="title">Länge einer Kurve</h1>

<h2 id="theorem">Theorem</h2>
<p>
Sei eine <a href="20221106115258-parametrisierung_einer_kurve.html#ID-dc61abb2-502c-4136-b116-4e72dd67396d">Parametrisierung einer Kurve</a> $r: I \rightarrow \mathbb{R}^n$ gegeben:
Dann ist die Länge der <a href="20221106115125-kurve_in_r_n.html#ID-9f8b7e77-baeb-4d66-a030-47cc0b6c7871">Kurve in R^n</a> von $a \in I$ bis $b \in I$ gegeben durch
</p>

<div class="math-block">\begin{align*}
\int_{a}^{b} \| \frac{\mathrm{d}}{\mathrm{d}t} r(t) \|
\end{align*}</div>
