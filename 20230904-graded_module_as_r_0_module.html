<span id="ID-e73893cc-959f-4814-9857-d3053881034d"></span><h1 class="title">graded Module as R_0-module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R = \bigoplus_{n \in \mathbb{N}_0} R_n\) be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a> and $M = \bigoplus_{n \in \mathbb{N}_0} a <a href="20230904-graded_module.html#ID-5508d8a0-9b2a-476f-95ca-a6502e8eb0f9">graded module</a>.
Then $M$ is a $R_0$ <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>
</p>
