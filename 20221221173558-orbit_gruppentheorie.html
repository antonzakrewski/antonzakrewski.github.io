<span id="ID-73c744de-33e1-4ea7-9b28-815229e1b186"></span><h1 class="title">orbit</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $X$ a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $\alpha: G \times X \rightarrow X$ a <a href="20230501095041-gruppenwirkung.html#ID-e8246fd3-cb62-4245-9ef1-59bc0326501a">group action</a>.
Then the orbit of $x$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathcal{O}_x = \{g \cdot x \in X \vert g \in G\} \subseteq X
\end{align*}</div>
