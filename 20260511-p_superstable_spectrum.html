<span id="ID-e430addf-1266-44a4-8ff3-4fe140649803"></span><h1 class="title">p-superstable spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectrum</a> and $p$ a <a href="20230426123442-primelement.html#ID-ffa743e1-94ee-49fe-9647-396eeb233982">prime</a>
Then $X$ is \(p\)-superstable, if for each element $x \in H^*(X,\mathbb{F}_p) \setminus \{0\}$ and each $n \geq 0$, there exists an $n' \geq n$ such that $\mathrm{Sq}^n(x) \neq 0$.
</p>
