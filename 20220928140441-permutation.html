<span id="ID-01de1cf3-b2f6-4908-a06a-1e9479c0f756"></span><h1 class="title">Permutation - to watch</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X = \{x_1, x_2, ..., x_n\}$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> mit <a href="20211227215415-machtigkeit_menge.html#ID-a53ec5a2-0adb-4575-bf21-e3ac15eff75f">Mächtigkeit</a> $n$, d.h. $n$ <a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">Elementen</a>.
Eine Permutation ist dann eine <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">bijektive</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>
</p>

<div class="math-block">\begin{align*}
\pi: \{x \in \mathbb{N} : 1 \leq x \leq n \} \rightarrow X
\end{align*}</div>
