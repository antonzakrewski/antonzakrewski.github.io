<span id="ID-8a3dc3f7-c1bb-4b54-9467-4b46ee936d8f"></span><h1 class="title">Einschluss von beschränkten Folgen</h1>

<h2 id="lemma">Lemma</h2>
<p>
Sei $(a_n)$ eine <a href="20220123200843-beschranktheit_einer_folge.html#ID-77f6a16a-9a94-40d9-aca9-919bb4f8998f">beschränkte</a> <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Folge</a>.
Dann $s_n  \coloneqq \inf\{a_k \vert k \geq n \}$ und $S_n  \coloneqq \sup\{a_k \vert k \geq n\}$.
Daraus folgt für $n \leq n'$ $s_n \leq s_{n'} \leq S_{n'} \leq S_{n}$.
Weiter schreiben ?
</p>
