<span id="ID-0ec11b4d-caf8-4758-af02-b7742954181f"></span><h1 class="title">Jacobi-Identität</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $F: V \times V \rightarrow V$ eine <a href="20221003210458-bilineare_abbildung.html#ID-4a5036f7-358f-484f-88aa-638a29f2e1f7">bilineare Abbildung</a>.
$F$ erfüllt die Jacobi-Identität falls für $x,y,z \in Vbeliebige $ gilt
</p>

<div class="math-block">\begin{align*}
F(F(x,y),z) + F(F(y,z),x) + F(F(z,x),y) =&amp; 0
\end{align*}</div>
