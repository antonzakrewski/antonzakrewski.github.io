<span id="ID-ffa743e1-94ee-49fe-9647-396eeb233982"></span><h1 class="title">prime element</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be an <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integral domain</a>.
</p>

<p>
Then $p \in A$ is said to be prime, if
</p>
<ol>
<li>$p \not\in A^{\times}$ is not a <a href="20221226125808-einheit_ring.html#ID-a3b1e1af-c3e3-433c-a4dd-2ee2c6e1d69a">unit</a></li>

<li>for $p \mid \alpha \cdot \beta$ it follows that $p \mid \alpha$ or $p \mid \beta$.</li>
</ol>
