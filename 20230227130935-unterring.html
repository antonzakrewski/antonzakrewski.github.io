<span id="ID-157d533b-1650-499e-be1d-341b1fa8fa15"></span><h1 class="title">Subring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(R,+,\cdot)$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
A <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> $U \subseteq R$ is a subring, if $(U, +, \cdot)$ is a ring with $1_R = 1_U$
</p>
