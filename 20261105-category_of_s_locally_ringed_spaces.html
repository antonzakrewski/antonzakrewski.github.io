<span id="ID-766ee864-361d-49fc-9de8-7888f75d4b89"></span><h1 class="title">category of S-locally ringed spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $S$ be a <a href="20230826-locally_ringed_space.html#ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728">locally ringed space</a>.
Then the category of S-locally ringed spaces is defined as <a href="20240924-infinity_slice_category.html#ID-62e46e6b-dcf7-4ba7-8e8a-92bc1476d165">slice category</a> $\mathrm{LRS}_{/S}$.
</p>


<h2 id="remark">Remark</h2>
<p>
we write $\mathrm{Hom}_{S}(X,Y)$ for $\mathrm{Hom}_{\mathrm{LRS}_{S}}(X,Y)$
</p>
