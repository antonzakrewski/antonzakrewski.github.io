<span id="ID-5fd53bbe-4719-4e22-b73e-6389cee1d1b0"></span><h1 class="title">deck transformation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B,E$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $p: E \rightarrow B$ a <a href="20230729-covering_map.html#ID-b817dc02-5dea-4e8d-8ccd-adf7ef14e6bc">covering map</a>.
</p>

<p>
A deck transformation is an <a href="20220818172827-automorphismus_eines_objekts.html#ID-d6ed25e6-8ebf-4836-b92b-57cc2f1f28c4">automorphism</a> in the <a href="20231208-category_of_covering_maps.html#ID-08acd67c-5e99-4f6b-a763-94d0fdbe9d26">category of covering maps</a>, i.e. a <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphism</a>
</p>

<div class="math-block">\begin{align*}
\varphi: E \rightarrow E
\end{align*}</div>
<p>
compatible with $p: E \rightarrow B$
</p>
