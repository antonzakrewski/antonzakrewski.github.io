<h2 id="proposition">Proposition</h2>
<p>
Let $G$ a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> $G$ and $k$ a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> with $\vert G \vert \not\mid \mathrm{char}(k)$.
Then $k[G]$ is a <a href="20261021-semi_simple_algebra.html#ID-f2f76840-0edb-40d1-bf2e-1f05378e1038">semi-simple k algebra</a>.
