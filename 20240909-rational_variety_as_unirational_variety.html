<span id="ID-9d2c64c5-a8b4-4527-a9ff-24a6614b2931"></span><h1 class="title">rational variety as unirational variety</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20231123-rational_variety.html#ID-9d51e57c-591f-4eb3-941c-9a41c63fbd3a">rational variety</a>.
Then $X$ is <a href="20240909-unirational_affine_variety.html#ID-8e72d4a7-3cc9-42bf-a83f-4e890bc6502f">unirational</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from <a href="20240909-function_field_functor_from_dominant_rational_maps.html#ID-c8361fa6-3f4c-4360-a7b1-1c3ccbc9c989">function field functor from dominant rational maps</a>
where an iso is clearly a <a href="20230909-dominant_rational_map.html#ID-1b964f0e-1da7-4553-b7ce-0a9a19e0a76c">dominant rational map</a>
</p>
