<span id="ID-238fccf5-2a5d-4aa2-bca1-38395190d3e3"></span><h1 class="title">Eindeutigkeit eines Hauptelements eines Mengenfilters</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>, $\mathcal{F}$ ein <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Mengenfilter</a> mit einem <a href="20230307220916-hauptelement_eines_ultrafilters.html#ID-a4df6abe-9691-472e-8ee3-cd4cbe3fc8dd">Hauptelement</a> $p \in X$, so folgt dass $pq eindeutig ist.
</p>

<h2 id="beweis">Beweis</h2>
<p>
Seien $p,p'$ <a href="20230307220916-hauptelement_eines_ultrafilters.html#ID-a4df6abe-9691-472e-8ee3-cd4cbe3fc8dd">Hauptelement</a>
</p>
