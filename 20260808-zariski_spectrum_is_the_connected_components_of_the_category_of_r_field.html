<span id="ID-56628795-280f-4b24-a63d-61d6ab9d78d8"></span><h1 class="title">zariski spectrum is the connected components of the category of R-field</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then there exists a <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">Bijection</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Field}_{R} \simeq \mathrm{Spec}(R)
\end{align*}</div>


<h2 id="proof">Proof</h2>
<p>
follows from the <a href="20260715-decomposition_of_the_category_of_r_fields.html#ID-a9ce5af3-738f-4094-bc22-4493fae1a8cf">decomposition of the category of R-fields</a>
</p>
