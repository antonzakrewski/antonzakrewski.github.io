<span id="ID-058ff3bf-17e5-4ccc-afc2-ae8097769685"></span><h1 class="title">kernel functor is a left exact functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $\mathrm{Fun}([1], \mathcal{A})$ the <a href="20230403183725-arrow_category.html#ID-0554b693-0143-4f63-be7a-4a7af587c98b">arrow category</a> and $\mathrm{ker}(-)$ the <a href="20240424-kernel_functor.html#ID-079c0a66-8956-4e48-b90b-8de9abec9ac0">kernel functor</a>.
Then $\mathrm{ker}(-)$ is <a href="20230903-covariant_left_exact_functor.html#ID-451552fa-0c6a-46d1-8bbd-9683937c52f3">left exact functor</a>
</p>
