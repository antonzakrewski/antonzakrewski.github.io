<span id="ID-e03049b2-bae8-4a8d-bce4-d4264469e3bc"></span><h1 class="title">quasi-coherent algebra of functions for an algebraic functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a>
Then the <a href="20260715-category_of_quasi_coherent_algebras_over_an_algebraic_functor.html#ID-8c05ef13-3e74-40f5-b491-e455f46e04f3">quasi-coherent algebra</a> $\mathcal{O}_{X}$ is the <a href="20241014-initial_object_in_an_infinity_category.html#ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89">initial object</a> in the category $\mathrm{Alg}_{X}$ or the monoidal unit of $\mathrm{Mod}_{X}$.
</p>
