<span id="ID-cd98db08-a889-40cd-b065-2a6e1bf34346"></span><h1 class="title">infinitesimally cohesive morphism of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a map of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>.
Then $f$ is said to be infinitesimally cohesive, if for every <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a> square of <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative rings</a>
</p>

<div class="equation-container"><span class="equation"><img src="ltximg/68e882499c01e816e5e6.svg" class="org-svg" alt="diagram" /></span></div>
<p>
where the legs are <a href="20260901-thickening_of_a_ring.html#ID-28210c89-7d15-4b35-aac3-68dd27f0f3fa">thickenings</a>, the induced square
</p>

<div class="equation-container"><span class="equation"><img src="ltximg/c307d4bd9cb8fa697ff0.svg" class="org-svg" alt="diagram" /></span></div>
<p>
is a <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a>
</p>
