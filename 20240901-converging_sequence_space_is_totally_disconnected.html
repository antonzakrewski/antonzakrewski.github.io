<span id="ID-3d3c958b-6c46-4b29-a4fa-90745259b8d3"></span><h1 class="title">converging sequence space is totally disconnected</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20231125-space_of_converging_sequences.html#ID-26bfafae-5130-480f-b32c-a5fad71dd924">converging sequence space</a> is <a href="20230113082334-total_unzusammenhangende_menge.html#ID-faafd123-2cf7-4e51-87b0-020a9b527443">totally disconnected</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Note that for each element $\frac{1}{n}$ is <a href="20230207075730-clopen_set.html#ID-f8defda0-b0fc-49cb-ab4f-21c64be93fe5">clopen</a>, hence the connected component is $\{\frac{1}{n}\}$
Hence there remains only $\{0\}$ as connected component of $0$
</p>
