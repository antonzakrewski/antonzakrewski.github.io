<span id="ID-32dd5f4f-577a-41e5-9ebd-a458735d4190"></span><h1 class="title">augmentation map of a graded module over a connected graded Algebra</h1>

<h2 id="definition">Definition</h2>
<p>

</p>

M \rightarrow \tau_{\leq 0} M 
\end{align*}</div>
