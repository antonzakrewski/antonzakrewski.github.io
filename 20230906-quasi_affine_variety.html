<span id="ID-3ef8df48-4b44-4453-a107-37c89deecacc"></span><h1 class="title">simple quasi-affine variety</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{A}_K^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a>.
Then an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> $O \subseteq \mathbb{A}_K^n$ is said to be a <a href="20230906-quasi_affine_variety.html#ID-3ef8df48-4b44-4453-a107-37c89deecacc">quasi-affine variety</a>
</p>
