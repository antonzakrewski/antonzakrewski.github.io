<span id="ID-654d421c-1da5-4c79-b796-377435527956"></span><h1 class="title">parallelizable manifold</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>, then $M$ is said to be parallelizable, if the <a href="20250917-tangent_bundle_functor.html#ID-e0b9c376-8c48-41d6-80b7-11b372e6f8f6">smooth tangent bundle</a> is  <a href="20230903-trivial_vector_bundle.html#ID-046cc27d-41e5-41d4-b359-77088aff15d6">trivial</a>
</p>
