<h2 id="definition">Definition</h2>
<p>
Sei $(M, \circ)$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> mit der <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfung</a> $\circ$ und bezüglich $\circ$ <a href="20220814141200-abgeschlossenheit_einer_algebraischen_struktur.html#ID-8d0963bb-1256-4adb-9fb2-dad2e261f500">abgeschlossen</a>, d.h. für $m_1, m_2 \in M$
</p>

<div class="math-block">\begin{align*}
m_1 \circ m_2 \in M
\end{align*}</div>
<p>
Dann ist $(M, \circ)$ ein Magma
