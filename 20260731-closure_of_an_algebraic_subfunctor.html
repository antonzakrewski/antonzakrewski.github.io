<span id="ID-8564c7aa-fbed-4314-9c56-19e603a9bad1"></span><h1 class="title">closure of an algebraic subfunctor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $Y \subseteq X$ be a <a href="20230922-subfunctor.html#ID-e3017b76-a5ac-43b3-a458-b3ede2132fec">Subfunctor</a> of an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor.</a>
Then the closure is the smallest closed subfunctor $\overline{Y} \subseteq X$ containing $Y$.
</p>
