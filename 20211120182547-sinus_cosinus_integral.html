<span id="ID-9b8a6d3a-1d52-41b1-85ba-6158b2970880"></span><h1 class="title">Sinus/Cosinus - Integral</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\int \sin(x)\mathrm{d}x =&amp; -\cos(x) + c \\
\int -\cos(x)\mathrm{d}x =&amp; -\sin(x) + c \\
\int -\sin(x)\mathrm{d}x =&amp; \cos(x) + c \\
\int \cos(x)\mathrm{d}x =&amp; \sin(x) + c \\
\end{align*}</div>
