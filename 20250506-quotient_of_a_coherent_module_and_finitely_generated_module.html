<span id="ID-139e885e-41ec-40ee-94b7-84ea8331d23f"></span><h1 class="title">quotient of a coherent module and finitely generated module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20240529-coherent_module.html#ID-35df9c79-23c4-4135-9d25-d9fe847f921e">coherent module</a> and $N \subseteq M$ <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated module</a>.
Then the quotient $M/N$ is also coherent
