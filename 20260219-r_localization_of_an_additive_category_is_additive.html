<span id="ID-d01ec2bb-c9b7-43d4-9809-becdef6e8516"></span><h1 class="title">R-localization of an additive category is additive</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241016-presentable_infinity_category.html#ID-346bd670-f443-4290-83e6-015d1801ed20">presentable</a> <a href="20241217-additive_infinity_category.html#ID-e168d6e3-8dc6-424e-a950-8b24f6ed45f8">additive category</a>.
Then the <a href="20260219-r_localization_of_a_presentable_additive_category.html#ID-68aff1bd-d81e-4f88-b9c8-8b8ecc94b86c">R-localization</a> is again additive
</p>

<h2 id="proof">Proof</h2>
<p>
follows as it is closed under <a href="infinity-limit.html#ID-a8bcf958-5282-4984-8415-7a64cca74613">limit</a>s
</p>

</ul>
