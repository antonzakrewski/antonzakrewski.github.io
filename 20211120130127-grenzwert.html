<span id="ID-c9d16981-08f6-40ca-af81-22b5db6f06df"></span><h1 class="title">limit of a sequence</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $(\alpha_n)_{n \in \mathbb{N}}$ a <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">Sequence</a>.
Then $x \in X$ is said to be a limit of $(\alpha_n)$, if for every <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $U$ of $x$, <a href="20221013222501-fast_alle.html#ID-a3da14cb-05c1-4f9e-a68a-a693980f5ede">almost all</a> $x_n \in U$
</p>
