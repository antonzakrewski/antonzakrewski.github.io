<span id="ID-9684fd07-3d0f-4977-8124-0f4aa63a505e"></span><h1 class="title">rank over an integral domain and tensor product</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R\) be an <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integral domain</a>, $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then
</p>

<div class="math-block">\begin{align*}
\mathrm{rank}(M) = \mathrm{dim}(M \otimes_R Q(R))
\end{align*}</div>
<p>
where $Q(R)$ is the <a href="20230603-universal_property_of_a_quotient_field.html#ID-cd4c145d-0938-4732-9bde-52806452ab2a">quotient field</a> and $\otimes_R$ the <a href="20230801-tensor_product.html#ID-42c4ecff-8f9a-40cf-bebc-70569ded24bf">tensor product</a>
</p>
