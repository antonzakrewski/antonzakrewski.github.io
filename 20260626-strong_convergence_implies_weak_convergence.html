<span id="ID-0532c7b8-01cf-4bf4-8998-69a47f51d818"></span><h1 class="title">strong convergence implies weak convergence</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a>.
Then a strong <a href="20220105153330-konvergenz_einer_folge.html#ID-63fa4879-51cf-4ad6-8be5-0e9e10d29726">convergent</a> sequence $x_n$ is also <a href="20260626-weak_convergence.html#ID-85a7527f-c55a-42c6-8c67-6f53b16d3479">weakly convergent</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from
</p>
<ul>
<li><a href="20260627-map_from_weak_topology_to_strong_topology.html#ID-592c0986-50ee-47b4-b2fd-087740a1c6a9">map from weak topology to strong topology</a> </li>
</ul>
