<span id="ID-cf8a30fa-4ffa-475e-8620-ba2765330472"></span><h1 class="title">matching</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20250426-bipartit_graph.html#ID-a2f92440-01b7-42a5-9529-fad127a7e9ea">bipartite graph</a> with $V = A \coprod B$.
Then a matching is given by a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> $M \subseteq E$ of <a href="20220904171142-kante.html#ID-ee89f9c4-02d1-4312-9f41-09d9a1811714">edges</a> with the property that two distinct edges connect four distinct vertices.
