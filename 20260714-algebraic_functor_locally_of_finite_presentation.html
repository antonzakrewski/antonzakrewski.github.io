<span id="ID-6f5ba542-2ad9-41e0-9e2b-e89f2032ee4e"></span><h1 class="title">algebraic functor locally of finite presentation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic k-functor</a>.
Then $X$ is said to be locally of finite presentation, if it <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> <a href="kappa-filtered-infinity-colimit.html#ID-b8bba4f3-4065-46e4-9f89-f79a3b3fbb97">filtered colimits</a>
</p>
