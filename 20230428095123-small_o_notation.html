<span id="ID-ee7da507-41c4-4803-8dc2-ec2e5068a895"></span><h1 class="title">small-o notation</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $f,g$ reelle <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktionen</a>.
Man schreibt
</p>

<div class="math-block">\begin{align*}
f &lt;&lt;&amp; g \\
f \in&amp; o(g)
\end{align*}</div>
<p>
Falls gilt (modulo nullstellen stuff):
</p>

<div class="math-block">\begin{align*}
\lim_{n \to \infty}\left(\frac{\vert f(n) \vert}{\vert g(n) \vert}\right) = 0
\end{align*}</div>
