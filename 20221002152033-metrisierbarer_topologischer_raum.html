<span id="ID-1efd811d-97cd-4201-a254-1cb23e32d10a"></span><h1 class="title">metrizable space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
</p>

<p>
Then $X$ is said to be metrizable, if there exists a <a href="20220716173517-metrik.html#ID-0aa21afc-5f24-4618-a61e-e5ebf2e9640c">metric</a> $d$, such that the <a href="20221002152150-zu_einer_metrik_assoziierte_topologie.html#ID-aee5269f-4b03-4c46-bd0b-12f367d633c0">associated topology</a> is precisely $\mathcal{T}$
</p>
