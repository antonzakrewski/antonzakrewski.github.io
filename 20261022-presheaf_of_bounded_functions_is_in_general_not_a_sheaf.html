<span id="ID-4fc9e09a-9000-41b8-a6cc-674a5653f780"></span><h1 class="title">presheaf of bounded functions is in general not a sheaf</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a noncompact (!) <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
</p>

<h2 id="proof">Proof</h2>
<p>
use that locally bounded does not imply globally bounded, e.g. $\mathrm{id}: X \rightarrow X$ is locally bounded, but not globally
</p>
