<span id="ID-53a9e163-5529-4f63-be9e-44010e057285"></span><h1 class="title">finitary functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{E}$ be a <a href="20241016-cocomplete_infinity_ctaegory.html#ID-83e128ac-9183-45c2-ace4-f14e864ad783">cocomplete</a> <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable infinity category</a>.
Then a finitary functor is an <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">infinity functor</a>
</p>

<div class="math-block">\begin{align*}
E: \mathrm{Cat}_{\infty}^{\mathrm{perf}} \rightarrow \mathcal{E}
\end{align*}</div>
<p>
is a functor which <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> <a href="20250703-infinity_filtered_diagram.html#ID-ba2ebfd7-9120-42b2-b8e6-59a67bcf04c9">infinity filtered</a> <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimits</a>
</p>
