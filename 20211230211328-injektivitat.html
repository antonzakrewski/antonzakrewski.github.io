<span id="ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237"></span><h1 class="title">Injection</h1>

<h2 id="definiton">Definiton</h2>
<p>
Sei $f: X \rightarrow Y$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
$f$ ist injektiv, wenn gilt:
</p>

<div class="math-block">\begin{align*}
\forall x \in X \forall x_2 \in X (f(x) = f(x_2) \Rightarrow x = x_2)
\end{align*}</div>

</div>
