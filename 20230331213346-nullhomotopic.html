<span id="ID-a7d1984d-81e7-4e03-ad95-59bc1cdaeda8"></span><h1 class="title">nullhomotopic</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,\mathcal{T}_X)$ and $(Y,\mathcal{T}_Y)$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $f: X \rightarrow Y$ a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
Then $f$ is said to be nullhomotopic, if $f$ is <a href="20231107-homotopy_relative_to_a_map.html#ID-d86d5b2e-b71e-40a2-ae5c-b625d3b6125a">homotopic</a> relative to a constant map $f: X \rightarrow \{y\}$
</p>
