<span id="ID-48e6ea4f-de2a-45ab-8d8f-9720f56ba8c0"></span><h1 class="title">space admitting universal cover</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $b \in B$ a point
</p>

<p>
Then $B$ admits a universal cover at $b$, if the <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Fib}_b: \mathrm{Cov}(B) \rightarrow \mathrm{Set}
\end{align*}</div>
<p>
is <a href="20231021-representable_functor.html#ID-31b596c9-5984-4672-900f-de9718d2e524">representable</a>
</p>
