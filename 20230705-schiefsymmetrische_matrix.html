<span id="ID-8da76140-6321-4b49-b171-345899125d57"></span><h1 class="title">schiefsymmetrische Matrix</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $K^n$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> über einem <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> $K$ und $A \in K^{n \times n}$ eine <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">matrix</a>.
Dann ist $A$ eine schiefsymmetrische Matrix, falls gilt
</p>

<div class="math-block">\begin{align*}
A^t = - A
\end{align*}</div>

siehe: <a href="20220326224000-transponierte_matrix.html#ID-377b0cb6-81d3-4a2d-933a-f3556e44c27f">Transponierte Matrix</a>
