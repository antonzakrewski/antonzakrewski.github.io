<span id="ID-9274ac6f-f638-4756-9eea-3798a3f595e5"></span><h1 class="title">connected space as weakly connected space</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20230118223336-zusammenhangender_raum.html#ID-bcc53507-bc5a-46d4-bd83-53e504f62b9d">connected</a> <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
Then $X$ is also <a href="20231024-weakly_locally_connected_space.html#ID-43c46218-18e0-4590-8296-ade560f3eb28">weakly locally connected space</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Take $X$ as <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a>
</p>
