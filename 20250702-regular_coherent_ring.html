<span id="ID-36a17bfd-3ebe-4138-9109-ce4cef46ef73"></span><h1 class="title">left regular coherent ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $R$ is said to be left regular coherent ring if any <a href="20230801-finitely_presented_module.html#ID-7ccb4638-bc9e-414e-a304-75a46e1f34f5">finitely presented left module</a> has finite <a href="20240511-projective_dimension_of_an_object.html#ID-6d94393a-b9d6-4221-ab94-8f82379c02ba">projective dimension</a>
</p>
