<span id="ID-bc1d3d8f-b206-429b-8bf9-310487a51440"></span><h1 class="title">A1 homotopy equivalence</h1>

<h2 id="definition">Definition</h2>
<p>
A map $f: X \rightarrow Y$ in $\mathcal{P}(\mathrm{Sm}_{S})$ is an $\mathbb{A}^1$ homotopy equivalence, if there exists a map $g: Y \rightarrow X$ such that
</p>
<ol>
<li>$f \circ g \sim_{\mathbb{A}^1} \mathrm{id}$</li>

<li>$g \circ f \sim_{\mathbb{A}^1} \mathrm{id}$   </li>
</ol>
