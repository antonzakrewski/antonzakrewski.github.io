<h2 id="definition">Definition</h2>
<p>

Then $X$ is said to be quasi-compact if, $Y \times_{X} Z$ is quasi-compact for <a href="20260716-quasi_compact_algebraic_functor.html#ID-91a6a538-b27d-44da-b253-16c2853f58a4">quasi-compact</a> algebraic functors $Y,Z$.
