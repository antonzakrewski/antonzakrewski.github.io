<span id="ID-4fcd0531-43a8-4865-b851-4e3b68ca8c1f"></span><h1 class="title">an irrelevant ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a> and $R = \bigoplus_{m \in m} R_m$ a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a>.
Then an <a href="20230904-homogeneous_ideal.html#ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3">homogeneous ideal</a> $\mathfrak{a}$ is said to be irrelevant, if its <a href="20230725-radical_of_an_ideal.html#ID-a5fd42b5-ba84-4c7e-8a5b-e36101a7fa1e">radical</a> contains <a href="20230920-irrelevant_ideal.html#ID-88f0eebb-9a3f-49fa-8155-9e3b2a1b29c8">the irrelevant ideal</a> $R_+$
</p>
