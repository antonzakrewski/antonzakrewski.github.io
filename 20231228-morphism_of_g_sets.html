<span id="ID-b7dbc6e8-16e4-413b-9509-8ea104208354"></span><h1 class="title">morphism of G-Sets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $(X,\varphi)$ and $(Y,\psi)$ be <a href="20231205-g_set.html#ID-2e1771aa-7af3-4f27-8538-4f5a67ab9782">G-Sets</a>.
Then a morphism is a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
</p>

<div class="math-block">\begin{align*}
f: X \rightarrow Y
\end{align*}</div>
<p>
such that
</p>

<div class="math-block">\begin{align*}
\psi(g,f(x)) = f(\varphi(g,x))
\end{align*}</div>

<p>
see:
</p>
<ul>
<li><a href="20231205-g_equivariant_map.html#ID-3053c70b-dd6f-44e2-ba1e-dce86ece54f0">G-equivariant map</a> </li>
</ul>
</div>
