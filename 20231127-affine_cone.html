<span id="ID-b3399ff6-a03b-4a36-aaee-a86029b9d537"></span><h1 class="title">affine cone</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $J \subseteq K[X_0,...,X_n]$ a <a href="20230904-homogeneous_ideal.html#ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3">homogeneous ideal</a>.
Then the affine cone over $V^{\mathrm{proj}}(J) \subseteq \mathbb{P}K^{n}$ is defined as <a href="20231019-zero_locus.html#ID-78bd19fb-0e3f-4a42-9e36-a58a2aeb9aa9">zero locus</a>
</p>

<div class="math-block">\begin{align*}
V^{\mathrm{aff}}(J) \subseteq \mathbb{A}_K^{n+1}
\end{align*}</div>
