<span id="ID-9f658c4c-1ca9-405a-9449-d74f89e720e4"></span><h1 class="title">transgressive pair</h1>

<h2 id="definition">Definition</h2>
<p>
Let $E$ be a <a href="20250826-spectral_sequence.html#ID-37b89bcc-af64-4182-9e25-2a7ac65f9ec4">spectral sequence</a>.
A pair $(x,y) \in E_2^{0,n} \times E_2^{n+1,0}$ is called transgressive if
</p>
<ol>
<li>$d_{r}(x) = 0$ for $2 \leq r\leq n$</li>

<li>$d_{n+1}(x) = y \in E_{n+1}^{n+1,0}$</li>
</ol>
