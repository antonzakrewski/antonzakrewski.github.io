<span id="ID-b1ab645f-e5b6-4409-8fc3-b4b2c7594629"></span><h1 class="title">q-Weyl algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $k$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $q \in k \setminus \{0\}$.
Then the q-weyl algebra is the algebra defined by the operation
</p>

<div class="math-block">\begin{align*}
W = k \langle x^{\pm 1},y^{\pm 1}\rangle / \langle xy - qyx\rangle
\end{align*}</div>
