<span id="ID-4435e491-8d1a-4889-b240-19a69d781978"></span><h1 class="title">kappa filtered colimit</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a>, $I: \mathcal{I} \rightarrow \mathcal{C}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> and $\mathrm{colim}_{I}$ the <a href="20230725-colimit.html#ID-581b1561-25d0-479a-b0cc-063c894e10be">colimit</a>
Then $\mathrm{colim}_{I}$ is said to be $\kappa$ filtered, if $\mathcal{I}$ is a <a href="20241016-kappa_filtered_category.html#ID-498fc03f-81c4-4887-85a2-2827e40a514b">kappa filtered category</a>
</p>
