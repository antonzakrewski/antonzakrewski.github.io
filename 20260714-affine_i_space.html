<span id="ID-6b731e1b-8665-4a70-a40b-56549d43cb48"></span><h1 class="title">affine I space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $I$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>.
Then the affine \(I\)-space is the <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a>
</p>

<div class="math-block">\begin{align*}
\mathbb{A}_k^n: \mathrm{CAlg}_k \rightarrow&amp; \mathrm{Set} \\
R \mapsto R^I
\end{align*}</div>
<p>
or equivalently $\mathrm{Hom}_{\mathrm{CAlg}_k}(k[x_i \vert i \in I], -)$
</p>
