<span id="ID-6b64d894-6881-42c7-846f-16a7bded5242"></span><h1 class="title">RP^2n not nullbordant</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathbb{R}\mathbb{P}^{2n}$ be the <a href="20230902-projektiver_raum.html#ID-9330afd6-d1a4-451f-b4d1-4f747b5ef58a">real projective space</a>.

</p>
