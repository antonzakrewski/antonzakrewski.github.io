<span id="ID-90d3a437-5d77-4a47-ad36-6ba1d388d688"></span><h1 class="title">artinian ring as jacobson ring</h1>

<p>
Let $A$ be an <a href="20230724-artinian_ring.html#ID-a0bcecf0-0701-4159-ad21-9fff7aa6057c">artinian</a> <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">ring</a>.
Then $A$ is a <a href="20230725-jacobson_ring.html#ID-b17f8891-8d7b-454c-9c22-773ed8d942e1">Jacobson ring</a>
</p>
