<span id="ID-41d1e390-0df4-41f4-95ae-39d1a9ef5a19"></span><h1 class="title">euler characteristic of the complex projective space</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20240223-euler_characteristic.html#ID-a1fa5115-e292-441f-a5b9-ea6a4f7faf25">euler characteristic</a> of the <a href="20231025-complex_projective_space.html#ID-a647b6b1-d4cd-4e0a-897c-517013a00204">complex projective space</a> is given by
</p>

<div class="math-block">\begin{align*}
\chi(\mathbb{C}\mathbb{P}^{n}) = n + 1
\end{align*}</div>
