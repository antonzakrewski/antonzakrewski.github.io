<span id="ID-8699327b-1cf6-41fc-9eda-522460057625"></span><h1 class="title">enough projectives</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{C}$ is said to have enough projectives, if for every <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $A \in \mathrm{Ob}(\mathcal{C})$, there exists
</p>
<ol>
<li>an <a href="20230727-projective_object.html#ID-605bb0c6-3cb5-44d6-bb3e-660f0fef14d1">projective object</a> $P$</li>

<li>an <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">epimorphism</a> $f: A \rightarrow P$</li>
</ol>
