<span id="ID-5c801c5c-ec81-4ef4-87e8-25f35e212d7b"></span><h1 class="title">bicosimplicial object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, then a bisimplicial \(\mathcal{C}\)-object $X$ is defined as <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>
</p>

<div class="math-block">\begin{align*}
X: \Delta \times \Delta \rightarrow \mathcal{C}
\end{align*}</div>
<p>
where $\Delta$ is the <a href="20230923-simplex_category.html#ID-2952609d-1bab-4ac4-bbd7-1c0814af1314">simplex category</a>
</p>
