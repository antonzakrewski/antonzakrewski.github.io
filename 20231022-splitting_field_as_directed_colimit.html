<span id="ID-45be17bd-eee4-40d7-bba1-a1cbadbc5bfa"></span><h1 class="title">splitting field as filtered colimit</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $\mathfrak{F} \subseteq K[X]$ a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomials</a>.
Then the <a href="20230723-zerfallungskorper.html#ID-4e827de3-231e-4dfc-8a60-60227e9ca3e8">splitting field</a> is a <a href="20230804-filtered_limit.html#ID-35b9e3f0-b5d0-41c4-94ac-6bd183d66ee3">filtered colimit</a>.
see: <a href="20231021-category_field_contains_filtered_colimits.html#ID-1c9e8b00-aa68-436a-b232-9722679cdfb6">category field contains filtered colimits</a>
</p>
