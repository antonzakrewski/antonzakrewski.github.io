<span id="ID-9d8184cb-db41-47eb-9a19-380a01158ea2"></span><h1 class="title">n-idempotent ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $A$ is said to be \(n\)-idempotent, if for each $\alpha \in A$ there exists an $n \in \mathbb{N}$ such that
</p>

<div class="math-block">\begin{align*}
\alpha^n = \alpha
\end{align*}</div>
