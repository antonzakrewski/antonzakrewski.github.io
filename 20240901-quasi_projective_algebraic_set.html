<span id="ID-cdc16500-8514-4add-a245-37805c77c905"></span><h1 class="title">quasi-projective algebraic set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a> and $X \subseteq \mathbb{P}_{K}^n$ a <a href="20240903-projective_algebraic_set.html#ID-2de5f93c-d089-41e8-b212-6fb55d447a54">projective algebraic set</a>.
Then a quasi-projective algebraic set is defined as <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> subset of $X$
</p>
