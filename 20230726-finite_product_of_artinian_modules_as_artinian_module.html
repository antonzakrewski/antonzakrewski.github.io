<span id="ID-96243ca6-e553-4a5b-b5a8-8c1434e3dd52"></span><h1 class="title">finite product of artinian modules as artinian module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M_1,M_2$ \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">modules</a>.
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$M_1,M_2$ are <a href="20230724-artinian_module.html#ID-f6f7b960-e8a5-434f-a60b-4571e0567afa">Artinian modules</a> </li>

</ol>
