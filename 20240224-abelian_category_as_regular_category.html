<span id="ID-1bfc4329-d687-4e86-9c69-f9bb3c96353f"></span><h1 class="title">abelian category as regular category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{A}$ is a <a href="20231215-regular_category.html#ID-08846215-ab96-4d0b-ae63-ff1b228cf307">regular category</a>
</p>

<h2 id="proof">Proof</h2>
<ul>
<li>finitely cocomplete follows from <a href="20230827-additive_category.html#ID-e50cd553-69ee-4360-bd27-43b73e7a9945">additive category</a> </li>

<li>the coequalizer follows from <a href="20230828-pre_abelian_category.html#ID-594a1b99-3cab-4bfc-aba9-ca6668ee8b56">pre-abelian category</a> </li>
</ul>
