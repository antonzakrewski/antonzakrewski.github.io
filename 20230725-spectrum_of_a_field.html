<span id="ID-b2260e6b-6c8e-435b-8a40-50c39affc0ed"></span><h1 class="title">spectrum of a field</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, then the <a href="20230725-zariski_spectrum.html#ID-be298171-f5f5-4ad4-8574-afe3257110d2">zariski spectrum</a> is
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(A) = \{0\}
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
Let $a \in K \setminus \{0\}$, then $a$ is a <a href="20221226125808-einheit_ring.html#ID-a3b1e1af-c3e3-433c-a4dd-2ee2c6e1d69a">unit</a> and therefore $(a) = K$ and $(a)$ isn't <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime</a>
</p>
