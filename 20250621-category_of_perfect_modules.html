<span id="ID-6ca4fb06-b472-4501-bfbc-52b7812fd824"></span><h1 class="title">category of perfect modules over a ring spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a>.
Then the category of perfect modules is defined as <a href="20230225184516-volle_unterkategorie.html#ID-02c96fc8-ac4f-42b6-804d-bc08d25bfb2a">full subcategory</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Perf}(R) \subseteq \mathrm{Mod}(R) 
\end{align*}</div>
<p>
containing all <a href="20241016-kappa_compact_object.html#ID-4a8967b2-7c84-4c8b-b590-aadea095f9fd">compact objects</a>
</p>
