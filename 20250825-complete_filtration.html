<span id="ID-207e6b50-b9e0-4767-b717-fd7188c3d78c"></span><h1 class="title">complete filtration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R = R_0$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $\mathrm{GrRMod}$ the <a href="20240416-category_of_graded_modules.html#ID-72b3a654-bab8-47fd-a6c5-0376bae06a09">category of graded modules</a> and $M$ a <a href="20230904-graded_module.html#ID-5508d8a0-9b2a-476f-95ca-a6502e8eb0f9">graded module</a>.
Then a <a href="20250825-filtration_of_an_object.html#ID-af47851f-7394-4232-9f2c-d16d44acbde6">filtration</a> is said to be complete, if every <a href="20250825-cauchy_sequence_for_a_filtration.html#ID-001e2d58-7c27-48cd-a105-5cd740e80c05">cauchy sequence</a> converges.
</p>
