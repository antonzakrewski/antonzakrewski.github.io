<span id="ID-77b98a23-01fe-49b2-abb0-c9cf8108e8e9"></span><h1 class="title">universal cover of a finite anima in general not a finite anima</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250319-finite_anima.html#ID-30921a08-94d0-49f1-86b3-c034afbee61a">finite anima</a>.
Then the <a href="20250311-universal_covering_of_an_anima.html#ID-96a5a9f1-cfb3-4f82-bfa7-7c85e82abffc">universal cover</a> is in general not <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from $S^1 \vee S^n$ with <a href="20250311-universal_covering_of_an_anima.html#ID-96a5a9f1-cfb3-4f82-bfa7-7c85e82abffc">universal cover</a> $\bigvee S^n$, which has <a href="20230826-infinite.html#ID-66aecdb2-720e-4e41-9a27-dab1700474fc">infinite</a> <a href="20251009-homology_is_left_adjoint.html#ID-5b3f02bc-8681-4fa5-a4eb-ce9365892cd6">homology</a>.
</p>
