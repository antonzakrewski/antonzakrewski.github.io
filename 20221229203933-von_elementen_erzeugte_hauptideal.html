<span id="ID-bd140f14-cad5-47f2-877f-23eb74ac441d"></span><h1 class="title">spanned Ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Familie</a> $x_i \in R$ gegeben.
Dann ist
</p>

<div class="math-block">\begin{align*}
(x_i) = \{ \sum_{i \in I} r_i x_i r_i' \vert r_i, r_i' \in R \land \text{ fast alle } r_i = 0\}
\end{align*}</div>
<p>
das von $x_i$ erzeugte <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">Ideal</a>
</p>
