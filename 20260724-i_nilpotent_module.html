<span id="ID-85ee6fd7-f7ae-4a15-8e32-58f63a5d258f"></span><h1 class="title">I-nilpotent module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $I \subseteq R$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then $M$ is said to be \(I\)-nilpotent, if the <a href="20260724-i_nilpotent_submodule.html#ID-2cf90839-393c-4ea3-860b-387557a67f9f">maximal I-nilpotent submodule</a> $M$
