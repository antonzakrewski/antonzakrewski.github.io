<span id="ID-58be942b-0278-427c-b1d9-e90bfef1b3ff"></span><h1 class="title">free group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $S$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>, then the free group is defined as <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of <span class="broken-link" title="unresolved id:5ee76318-ae03-4cb3-877f-6b6ff88ad6fa">equivalence classes</span> of <a href="20231004-word.html#ID-861b8256-3430-41a9-9fe6-c9535f43b1f5">words</a> over the alphabet $S \sqcup \{s^{-1} \vert s \in S\}$with concatenation as <a href="20220925215102-binare_verknupfung.html#ID-213966ae-84e5-480d-93a3-f1d55034b939">operation</a>.
Two words are equivalent, if there exist &lt;cancellation&gt;
