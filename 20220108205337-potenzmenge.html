<span id="ID-2615a647-bca5-49f5-919d-cf131c750c2b"></span><h1 class="title">Power set</h1>

<h2 id="definition">Definition</h2>

<p>
Let $X$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>.
</p>

<p>
Then the power set is defined as set of <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subsets</a> of $A$:
</p>

<div class="math-block">\begin{align*}
\mathcal{P}(X) \coloneqq \{A \vert A \subseteq X\}
\end{align*}</div>

</div>
