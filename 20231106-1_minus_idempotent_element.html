<span id="ID-57a1de7f-25f9-43bc-8cf2-e3aadadcf746"></span><h1 class="title">1 minus idempotent element</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> und $e \in R$ ein <a href="20230605-idempotentes_element.html#ID-08520735-6a21-4b2e-83ab-772d2f9eb0d8">idempotentes</a> element.
Dann ist $1 - e$ ebenfalls idempotent
</p>

<h2 id="beweis">Beweis</h2>
<p>
es gilt
</p>

<div class="math-block">\begin{align*}
(1 - e)^{2} =&amp; 1 - 1 \cdot e - e \cdot 1 + e^2 \\
=&amp; 1 - 2e + e^2 \\
=&amp; 1 - 2e + e \\
=&amp; 1 - e
\end{align*}</div>


</div>
