<span id="ID-93486ae7-ad31-4cdc-910a-abd15d98dad9"></span><h1 class="title">E-localization of spectra</h1>

<h2 id="definition">Definition</h2>
<p>

</p>

<li>$f$ is an <a href="20260215-e_equivalence_for_a_spectrum.html#ID-6432ba97-db5f-4b28-8d58-b10d52f23e00">E-equivalence for a spectrum</a> </li>

<li>$Y$ is an <a href="20260314-e_local_spectrum.html#ID-428f60df-5c7b-4edd-9bfd-f9fcb062f3f3">E-local spectrum</a> </li>
</ol>
