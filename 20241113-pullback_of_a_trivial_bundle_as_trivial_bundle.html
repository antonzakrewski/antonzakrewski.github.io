<span id="ID-e1f45276-30ec-41c0-863b-8183d2edfc50"></span><h1 class="title">pullback of a trivial bundle as trivial bundle</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $p: E \times B \rightarrow B$ be a <a href="20241114-trivial_fibre_bundle.html#ID-c998baab-b6cc-41a4-80e1-03bf0dd7a429">trivial fibre bundle</a>, $f: B' \rightarrow B$ a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
Then the <a href="20241103-pullback_of_a_fiber_bundle.html#ID-8aae6005-4562-440f-ade4-d77ba4ef1225">pullback</a> is also a trivial bundle
</p>

<h2 id="proof">Proof</h2>
<p>
follows from
</p>

<div class="math-block">\begin{align*}
(E \times B) \times_{B} B' \cong E \times B' 
\end{align*}</div>
