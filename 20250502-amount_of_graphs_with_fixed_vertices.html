<span id="ID-e4633a59-c7be-468d-b514-84a06e28003b"></span><h1 class="title">amount of graphs with fixed vertices</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $n \in \mathbb{N}$ and $V = \{1,...,n\}$.
Then there exists $2^{\binom{n}{2}$ many <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">Graphs</a> $G$ with $V_G = V$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the combinatorial interpretation of the binomial coefficient.
</p>
