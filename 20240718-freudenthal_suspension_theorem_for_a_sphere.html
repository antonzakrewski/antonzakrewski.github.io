<h2 id="proposition">Proposition</h2>
<p>
Let $n \geq 1$.
Then the  <a href="20240718-freudenthal_suspension_theorem_for_homotopy_groups.html#ID-7e183fae-1917-48bd-8224-9aa47e6a25dc">freudenthal suspension map</a>
</p>

<div class="math-block">\begin{align*}
\pi_k(S^n) \rightarrow \pi_{k+1}(S^{n+1})
\end{align*}</div>

is

<li>an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> for $k &lt; 2n - 1$</li>

</ol>
