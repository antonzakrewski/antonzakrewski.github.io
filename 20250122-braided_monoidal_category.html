<span id="ID-10f4f66e-77b9-47d8-a46c-7ed697a1c060"></span><h1 class="title">braided monoidal category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(\mathcal{V}, \otimes_{\mathcal{V}}, \mathds{1}_{\mathcal{V}})$ be a <a href="20221223192944-monoidal_category.html#ID-e7314567-2c1d-4ebd-8aa0-323b3145b541">monoidal category</a>.
Then $\mathcal{V}$ together with a <a href="20250122-braiding.html#ID-4e94b7f5-7a4d-4d3e-8bff-15b381628810">braiding</a> is said to be a braided monoidal category.
</p>
