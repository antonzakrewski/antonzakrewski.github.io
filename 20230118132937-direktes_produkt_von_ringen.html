<span id="ID-65a3746e-123a-4a98-8edf-3ff02e33750e"></span><h1 class="title">direct product of rings</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a>, dann ist das <a href="20230118133027-direktes_produkt_algebra.html#ID-cd5fc934-6be0-49ad-8f4b-6706e8ee4971">direktes Produkt (Algebra)</a> definiert als:
</p>

<div class="math-block">\begin{align*}
R^n = \{(r_1,...,r_n) \vert r_i \in R\}
\end{align*}</div>
<p>
mit der komponentenweise definierten Addition und Multiplikation
