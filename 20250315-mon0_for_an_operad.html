<span id="ID-fea69e0a-8bc5-4b65-9a04-b15706ec606c"></span><h1 class="title">Mon0 for an operad</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> and $\mathcal{O}^{\otimes}$ an <a href="20250314-infinity_operad.html#ID-c7cfb23c-f4af-4d83-9bff-0a3a73a51534">infinity operad</a>
Then $\mathrm{Mon}_{\mathcal{O}^{\otimes}}(\mathcal{C})$ is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full sub infinity category</a> of $\mathrm{Fun}(\mathcal{O}^{\otimes}, \mathcal{C})$ containing <a href="20250315-o_monoid.html#ID-54ab168c-6785-46d4-a152-3bd78e1fe672">O-monoids</a>
</p>
