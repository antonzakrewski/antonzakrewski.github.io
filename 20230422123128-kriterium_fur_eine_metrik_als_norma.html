<span id="ID-76005cf1-8f37-47e8-b052-eb8a52c0fbd4"></span><h1 class="title">Kriterium für eine Metrik als Norm</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a> und $(V,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>.
Dann ist $V$ ein <a href="20221003143917-normierter_raum.html#ID-250c7843-ade4-44e9-9d45-05423ddaa1d8">normierter Raum</a> mit der von $d$ womöglich induzierten <a href="20220920053006-norm_eines_vektors.html#ID-445db843-5369-48de-a31f-f1f245833425">Norm</a>, falls
</p>

<div class="math-block">\begin{align*}
\| \cdot \|  \coloneqq d(0, \cdot)
\end{align*}</div>
<p>
eine <a href="20220920053006-norm_eines_vektors.html#ID-445db843-5369-48de-a31f-f1f245833425">Norm</a>  ist
</p>
