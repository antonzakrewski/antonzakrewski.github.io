<span id="ID-a1bd1ef5-dcc7-41fb-82da-8110139351f4"></span><h1 class="title">Trivialer Schnitt und direktes Summe von Moduln</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $M$ ein $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a> über einem <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> $R$.
Dann sind <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">Untermodule</a> $N,N'$ eine <a href="20230222204832-direkte_summe_von_moduln.html#ID-e8bbb659-8f22-4f7b-bc98-3d4d09a07f32">interne direkte Summe</a>, falls gilt
</p>

<div class="math-block">\begin{align*}
N \cap N' = \emptyset
\end{align*}</div>
