<span id="ID-ee740e55-cc2b-4121-9acb-73fead769bb9"></span><h1 class="title">Umgebungssystem</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $x \in X$ ein Punkt, dann ist das Umgebungssystem von $x$ definiert als <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> aller <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebungen</a> von $x$
</p>

<div class="math-block">\begin{align*}
\mathcal{U}(x)  \coloneqq \{U \subseteq X \vert U \text{ ist Umgebung von } x\}
\end{align*}</div>
