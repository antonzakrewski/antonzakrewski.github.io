<span id="ID-1dea3db8-b570-4133-a1da-b691ab956ee5"></span><h1 class="title">algebraic set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{A}_{K}^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a> and $S \subseteq \mathbb{A}_K^n$.
Then $S$ is said to be an algebraic set, if it the <a href="20231019-zero_locus.html#ID-78bd19fb-0e3f-4a42-9e36-a58a2aeb9aa9">zero locus</a> of some <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomials</a> $f_i \in K[X_1,...,X_n]$, i.e.
</p>

<div class="math-block">\begin{align*}
S = Z(f_i)
\end{align*}</div>
