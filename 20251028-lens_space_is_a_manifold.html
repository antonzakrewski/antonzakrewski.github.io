<span id="ID-4e72d0d1-e6e2-4676-95d9-635ced893504"></span><h1 class="title">lens space is a manifold</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $p,q_1,...,q_n$ be <a href="20210702104458-ganze_zahlen.html#ID-179209f5-5cb0-426c-b035-470f9b3935a8">integers</a> such that $q_i$ is <a href="20230410004341-coprime_ideal.html#ID-b5d829a1-26dc-4274-a072-42fd3f2cba7c">coprime</a> to $p$.
Then the <a href="20231020-lens_space.html#ID-d72e7a29-6800-4a80-b71e-e5cb954e449c">lens space</a> $L(p;q_1,...,q_n)$ is a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a>
</p>
