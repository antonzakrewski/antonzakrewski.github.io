<span id="ID-eb6e589c-57ff-4817-bb94-e72d6a14c9fb"></span><h1 class="title">zero functor coeffacable</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}, \mathcal{B}$ be <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a>, $0: \mathcal{A} \rightarrow \mathcal{B}$ the <a href="20240424-zero_functor.html#ID-9cc1dedc-d8c3-4694-9315-85abdc896d49">zero functor</a>.
Then $0$ is coeffacable
</p>

<h2 id="proof">Proof</h2>
<p>
follows from $\mathrm{id}: A \rightarrow A$
</p>
