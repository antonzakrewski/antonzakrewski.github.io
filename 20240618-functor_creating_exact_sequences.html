<span id="ID-acd29f12-d610-4647-b1e3-bb1ffb9bb5c5"></span><h1 class="title">faithfully exact functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}, \mathcal{B}$ be <a href="20230827-additive_category.html#ID-e50cd553-69ee-4360-bd27-43b73e7a9945">additive</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}: \mathcal{A} \rightarrow \mathcal{B}$ be an <a href="20230827-additive_functor.html#ID-194ea42e-600c-4119-8889-5b46998201e6">additive functor</a>
Then $\mathcal{F}$ is said to be faithfully exact if it
</p>
<ol>
<li>is an <a href="20230726-exact_functor.html#ID-9541d8fb-ddba-43d6-941a-32b3b3bd7086">exact functor</a> </li>

<li><a href="20240619-functor_reflecting_exact_sequences.html#ID-8097f1b9-0040-45b4-806e-cb6019feac9b">reflects exact sequences</a></li>
</ol>
