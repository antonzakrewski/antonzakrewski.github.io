<span id="ID-647db208-ddbf-49c8-a335-9a883bdb69a0"></span><h1 class="title">infinity cocone</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>, $\mathcal{C}$ an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> and $\mathcal{F}: K \rightarrow \mathcal{C}$ a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>
Then a cocone is a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>
</p>

<div class="math-block">\begin{align*}
\overline{F}: \Delta^0 \star K \rightarrow \mathcal{C}
\end{align*}</div>
