<span id="ID-284e8428-e5a8-4684-9b16-26ae9bf83c5f"></span><h1 class="title">quotient map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,\mathcal{T})$ and $(Y,\mathcal{T}_Y)$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
</p>

<p>
A quotient map is a <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a> <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $f: X \rightarrow Y$, such that $O \subseteq Y$ is <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> the <a href="20211230205442-urbild_mengenlehre.html#ID-55e63f0f-4499-43f1-af07-5c56577a9c73">preimage</a> $f^{-1}[O]$ is open.
</p>
