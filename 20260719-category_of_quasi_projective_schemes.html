<span id="ID-f78a9e62-ab51-4f27-bd12-43c6d9b74d2d"></span><h1 class="title">category of quasi-projective schemes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $k$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then the category of quasi-projective \(k\)-schemes is defiend as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a> $\mathrm{QProj}_{k} \subseteq \mathrm{Fun}(\mathrm{CAlg}_k, \mathrm{Set})$ containing <a href="20260715-quasi_projective_scheme.html#ID-605dee32-34ca-4d8c-84c9-a96de97f65c1">quasi-projective schemes</a>
</p>
