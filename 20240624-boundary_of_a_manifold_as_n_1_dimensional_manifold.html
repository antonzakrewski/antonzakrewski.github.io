<h2 id="proposition">Proposition</h2>
<p>
Let \(M\) be a \(n\)-dimensional <a href="20240607-manifold_with_boundary.html#ID-4b5854ef-a389-4076-9c87-d81fc63653bd">topological manifold</a>.
