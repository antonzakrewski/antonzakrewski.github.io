<span id="ID-edd9bd06-4e5b-4521-b5a3-5e223a3a27fb"></span><h1 class="title">empty set as projective algebraic set</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a>.
Then the <a href="20211226215449-leere_menge.html#ID-abf22513-8cde-4019-8690-8b02edd4337d">empty set</a> $\emptyset \subseteq \mathbb{P}_K^n$ is a <a href="20240903-projective_algebraic_set.html#ID-2de5f93c-d089-41e8-b212-6fb55d447a54">projective algebraic set</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Consider the ideal
</p>

<div class="math-block">\begin{align*}
K[X_1,...,X_n]
\end{align*}</div>
<p>
which is generated by $1$
</p>
