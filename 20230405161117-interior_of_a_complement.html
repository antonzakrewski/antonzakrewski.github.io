<span id="ID-9177a70c-8eb8-4511-856c-99b49e6a4f73"></span><h1 class="title">Interior of a complement</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $A \subseteq X$.
Then the following statement holds true:
</p>

<div class="math-block">\begin{align*}
(X \setminus A)^{\circ} =&amp; X \setminus \overline{A}
\end{align*}</div>
