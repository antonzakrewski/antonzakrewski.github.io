<span id="ID-a3b595d7-5ab1-47a5-acd3-27513791df4a"></span><h1 class="title">projective subvariety</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a> and $A \subseteq \mathbb{P}_{K}^n$ <a href="20230901-projective_variety.html#ID-15ff0e97-1d25-461a-aef8-dac9ace2de9c">projective variety</a>.
Then a projective subvariety is a <a href="20230908-subvariety.html#ID-e0c8604a-8f5d-4234-ba13-a61051936d56">subvariety</a> $A \subseteq \mathbb{P}_K^n$
</p>
