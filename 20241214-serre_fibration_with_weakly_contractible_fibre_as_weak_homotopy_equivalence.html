<span id="ID-c323e70f-1107-44de-b600-00900cc8d470"></span><h1 class="title">surjective serre fibration with weakly contractible fibre as weak homotopy equivalence</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a> <a href="20240702-serre_fibration.html#ID-b429be95-8451-46cb-8c4f-7e1be057a766">serre fibration</a> with <a href="20240614-weakly_contractible_space.html#ID-e4ae289a-86a8-4bd6-a880-f512b5d182bc">weakly contractible</a> <a href="20240717-fibre_of_a_morphisms.html#ID-88467be8-d154-4c5b-9922-28e1c3c42044">fibre</a>.
Then $f$ is a <a href="20231114-weak_homotopy_equivalence.html#ID-560d1751-c604-40c4-9f8b-787e7e47e5ed">weak homotopy equivalence</a>
</p>
