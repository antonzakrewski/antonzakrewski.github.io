<span id="ID-4bab5379-ff84-4cdb-8df5-f40f8cebe9a8"></span><h1 class="title">Modulo auf einem Ring mit einem Ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $I$ ein <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">Ideal</a> von $R$, dann ist für $r_1,r_2 \in R$ definiert:
</p>

<div class="math-block">\begin{align*}
r_1 \equiv r_2 \mod{I} \Leftrightarrow r_1 - r_2 \in I
\end{align*}</div>
