<span id="ID-fe3946eb-ee47-477f-9d28-9ec919c3ce88"></span><h1 class="title">beschränkter semimetrischer Raum</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M, d)$ ein <a href="20230224123147-semimetrischer_raum.html#ID-e2594bf0-67cb-4d50-a605-39627074bcd2">semimetrischer Raum</a> und $N \subseteq M$
$N$ ist beschränkt, falls gilt
</p>

<div class="math-block">\begin{align*}
\exists r \in \mathbb{R} \forall a \in N \forall b \in N : d(a,b) &lt; r
\end{align*}</div>
