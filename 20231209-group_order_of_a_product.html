<span id="ID-a5551146-c954-4195-a3af-6840abc6d5e5"></span><h1 class="title">group order of a product</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G_i$ be <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">groups</a> for $i \in \{1,...,n\}$, then the <a href="20221225213606-ordnung_gruppe.html#ID-fb68b5de-9a0c-4c45-8ee9-eb232370ed2e">group order</a> of the <a href="20221227225321-direktes_produkt.html#ID-342c22a0-c9fa-487a-a497-8a146a49363b">direct product</a> is
</p>

<div class="math-block">\begin{align*}
\vert G_1 \times ... G_n \vert = \prod_i \vert G_i \vert
\end{align*}</div>
