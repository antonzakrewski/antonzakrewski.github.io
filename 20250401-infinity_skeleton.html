<span id="ID-d68f3913-ee4e-401a-82cb-0fc9ff680c68"></span><h1 class="title">infinity skeleton</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>
Then an infinity skeleton is a <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a> $\mathcal{C}_0$ which is a <a href="20231209-skeleton_of_a_category.html#ID-31835e76-42be-4631-b31a-cf858a8235c1">skeleton</a> of the <a href="20241208-infinity_homotopy_category_functor.html#ID-55df1197-802b-4e72-9a64-1f2f2e32ca2b">homotopy category</a>
</p>
