<span id="ID-1f84aacb-e3a3-435b-8782-3749bc56c6b9"></span><h1 class="title">inductible subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $\mathcal{Q} \subseteq \mathcal{A}$ a <a href="20250509-infinity_wide_subcategory.html#ID-fdd0f55c-8d3c-47be-aeda-442793487336">wide subcategory</a>.
Then $\mathcal{Q}$ is said to be inductible, if
</p>
<ol>
<li>$\mathcal{Q}$ is closed under <a href="20260702-relative_diagonal.html#ID-f37e2979-027b-41bc-a803-09ba6007a2d7">relative diagonals</a> </li>

<li>every map in $\mathcal{Q}$ is <a href="20260519-n_truncated_map.html#ID-9459d1c0-3220-4890-bc0b-43823777ddfc">n-truncated</a>     </li>
</ol>
