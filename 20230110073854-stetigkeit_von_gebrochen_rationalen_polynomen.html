<span id="ID-2cecba05-e296-4242-972c-7a748f855d25"></span><h1 class="title">Stetigkeit von gebrochen rationalen Polynomen</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $f,g \in \mathbb{C}[x]$ <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynome</a> mit $g \neq 0$.
Dann ist $\frac{f}{g}$ <a href="20220819232419-stetigkeit.html#ID-b2d86612-ee0d-43a3-b49c-6953d712ecc5">stetig</a> in $D  \coloneqq \{z \in \mathbb{C} \vert g(x) \neq 0\}$ (richtige formulierung)
</p>
