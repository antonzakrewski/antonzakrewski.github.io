<span id="ID-61a63e60-fa49-40be-aa0b-4c3ff15ff2e3"></span><h1 class="title">semiorthogonal gluing of stable categories</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{F}: \mathcal{D} \rightarrow \mathcal{C}$ be an exact <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a> between <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable categories</a>.
Then the semiorhtogonal glueing of $\mathcal{C}$ and $\mathcal{D}$ via $\mathcal{F}$ is the <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber</a>
</p>
