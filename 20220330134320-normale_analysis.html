<span id="ID-bde06898-4670-4fbf-b902-d368574aed58"></span><h1 class="title">Normale (11)</h1>

<h2 id="definition">Definition</h2>
<ul>
<li>Die Normale ist eine Gerade, die zur <a href="20220330134435-tangente.html#ID-0a81cb9d-c5fb-44e0-b947-a78fbe6a235f">Tangente</a> $t_{x_1}(x)$ an der Stelle $x_1$ senkrecht steht</li>
</ul>
<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
n(x_1)  \coloneqq - \frac{1}{f'(x_1)} \cdot (x - x_1) + f(x_1)
\end{align*}</div>
