<span id="ID-f94fb25b-25e8-4cf2-94b7-7e899658a3fb"></span><h1 class="title">root of unity</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\overline{K}$ ein <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraisch abgeschlossener</a> <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $n \in \mathbb{N} \setminus \{0\}$.
Dann ist die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $U_n$ der \(n\)-ten Einheitswurzeln definiert als <a href="20220320113706-nullstelle.html#ID-b094e637-5f3c-42a2-a2c2-ae73bbbe29a2">Nullstellenmenge</a>
</p>

<div class="math-block">\begin{align*}
U_n = \{ \alpha \in \overline{K} \vert \alpha^n = 1\}
\end{align*}</div>
