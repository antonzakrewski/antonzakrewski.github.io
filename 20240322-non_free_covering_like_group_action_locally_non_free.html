<span id="ID-2d447505-b4ce-44da-9da7-009dd9e14a71"></span><h1 class="title">non free covering like group action locally non free</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $X$ a a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> such that $G$ acts <a href="20231205-covering_like_group_action.html#ID-8600d471-d8c0-4830-b295-fae56c74d14c">covering-like</a> on $X$.
Suppose $G$ acts non freely on $x$, then it acts non freely in a <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $U$ of $x$.
</p>
