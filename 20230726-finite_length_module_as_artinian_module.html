<span id="ID-3ae1d9fc-a079-4105-9069-c001b65a800d"></span><h1 class="title">finite length module as artinian module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $M$ a <a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> of <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20230726-length_of_a_module.html#ID-1404f565-6eb1-4b6b-bfab-c19c67c6d235">length</a>.
Then $M$ is an <a href="20230724-artinian_module.html#ID-f6f7b960-e8a5-434f-a60b-4571e0567afa">artinian module</a>.
</p>
