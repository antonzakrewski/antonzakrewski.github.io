<span id="ID-d0217d6b-9bb6-4bca-b00b-e2a2abcfb8ae"></span><h1 class="title">coarser grothendieck topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $\tau,\rho$ <a href="20240905-topology_on_a_category.html#ID-1d3088ed-8349-4321-bc74-474deaece4b1">topologies on</a> $\mathcal{C}$.
Then $\tau$ is said to be coarser than $\rho$, if every <a href="20230923-sieve.html#ID-4682cea8-3c62-49f6-ae4c-3deb9dd4dec6">sieve</a> in $\tau$ is a sieve in $\rho$.
</p>
