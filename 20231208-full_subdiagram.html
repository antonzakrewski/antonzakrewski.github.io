<span id="ID-f334b7ff-fb8f-42bd-a4fd-1fc839ce7041"></span><h1 class="title">full subdiagram</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $I: \mathcal{I} \rightarrow \mathcal{C}$ be a <a href="20220821183856-diagramm_kategorientheorie.html#ID-ad9d3642-913a-4374-8605-52121d00b349">diagram</a> and $J: \mathcal{J} \rightarrow \mathcal{C}$ a <a href="20231208-subdiagram.html#ID-460f42e6-c27c-4cfe-bffa-1831d337a98d">subdiagram</a>.
</p>

<p>
Then $J$ is said to be full, if the <a href="20230225172453-faktorisierung_eines_morphismus.html#ID-03fc6d28-e9bd-4fa3-8093-a113eaf06a6e">factorization</a> $\iota: \mathcal{J} \rightarrow \mathcal{I}$ is <a href="20230301211925-voller_funktor.html#ID-300944ac-0e6d-4b27-99f1-176a261999aa">full</a>
</p>
