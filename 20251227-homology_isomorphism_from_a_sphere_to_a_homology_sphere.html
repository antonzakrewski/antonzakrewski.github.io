<span id="ID-7c59546a-bdda-44dd-8ba7-972a00374e1f"></span><h1 class="title">homology isomorphism from a sphere to a homology sphere</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250423-homology_sphere.html#ID-7a6e8e50-f0be-45b9-9731-4cde682e27cd">homology n-sphere</a>
Then there exists a map
</p>

<div class="math-block">\begin{align*}
S^n \rightarrow X
\end{align*}</div>
<p>
which is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> on <a href="20251009-homology_is_left_adjoint.html#ID-5b3f02bc-8681-4fa5-a4eb-ce9365892cd6">homology</a>
</p>

</p>
