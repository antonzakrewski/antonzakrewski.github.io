<span id="ID-5508d8a0-9b2a-476f-95ca-a6502e8eb0f9"></span><h1 class="title">graded module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a> and $R = \bigoplus_{m \in m} R_m$ a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>.
Then $M$ is said to be a (compatibly) graded module, if $M = \bigoplus M_n$ and for $n,m \in \mathbb{N}_0$
</p>

<div class="math-block">\begin{align*}
R_n M_m \subseteq M_{n+m}
\end{align*}</div>
