<span id="ID-c228349a-53f3-41a2-873f-58b8de8461b5"></span><h1 class="title">valuation ring and maximal local subring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>  and $R \subseteq K$ a <a href="20230227130935-unterring.html#ID-157d533b-1650-499e-be1d-341b1fa8fa15">subring</a>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$R$ is a <a href="20230922-valuation_ring.html#ID-3cd6a0db-2f86-41d3-b4d3-f57741906df2">valuation ring</a> and $\mathrm{Frac}(R) = K$</li>

<li>R is a maximal <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local</a> <a href="20230227130935-unterring.html#ID-157d533b-1650-499e-be1d-341b1fa8fa15">subring</a> of $K$ with respect to &lt;local inclusions&gt;  </li>
</ol>
