<span id="ID-978f69ac-e22a-4e67-af11-7693a42ce810"></span><h1 class="title">existence of a maximal purely transcendental field extension</h1>

<h2 id="proposition">Proposition</h2>
<p>

</p>
<ol>
<li>$E/K$ is <a href="20240108-purely_transcendental_field_extension.html#ID-7a20217a-c2f5-4c4f-919e-f45818418cdf">purely transcendental field extension</a>  </li>

<li>$L/E$ is <a href="20230722-algebraische_korpererweiterung.html#ID-434e42fe-1036-44f2-86e7-9dd391760e46">algebraic field extension</a> </li>
</ol>
