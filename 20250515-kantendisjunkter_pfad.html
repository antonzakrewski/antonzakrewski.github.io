<span id="ID-0c402630-b0be-404c-84a8-642a97df4944"></span><h1 class="title">edge disjoint path</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a> and $v_1,v_2 \in V$ be vertices.
Then two paths $\gamma_1,\gamma_2: P_n \rightarrow G$ are said to be edge disjoint, if they don't have any common edge.
</p>
