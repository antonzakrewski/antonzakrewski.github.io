<span id="ID-c00df447-7fea-4055-853d-be4c586a16ae"></span><h1 class="title">sphere as S3 bundle of quaternionic projective space</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">4n+3-sphere</a> is a <a href="20241113-principal_g_bundle.html#ID-41366781-604c-4d30-ac8e-985b2fb48728">principal g-bundle</a> of the <a href="20231020-projective_space_of_the_quaternions.html#ID-ae527a1d-5d72-42cb-a76c-0489cc7a19c3">quaternionic projective space</a> with topological group $S^3$ (cf. <a href="20241114-s3_as_topological_group.html#ID-27ad9199-ddee-4d80-9f97-727d3ee5aa2a">S3 as topological group</a>)
</p>

</ul>
