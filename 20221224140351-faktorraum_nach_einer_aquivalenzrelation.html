<span id="ID-b4f6e2f6-99b2-49a4-bc81-3f11a55ca49b"></span><h1 class="title">Faktorraum nach einer Äquivalenzrelation</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> mit einer <a href="20211227225754-aquivalenzrelation_mengenlehre.html#ID-bf83e0aa-4df1-48a5-b910-2837942bdd19">Äquivalenzrelation</a> $\sim$
Der Faktorraum nach $\sim$ ist definiert als
</p>

<div class="math-block">\begin{align*}
M / \sim  \coloneqq \{[x]_{\sim} \vert x \in M\}
\end{align*}</div>
