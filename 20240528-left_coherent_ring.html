<span id="ID-a3c588a3-14fb-4c7b-8bd8-1eab89e19683"></span><h1 class="title">left coherent ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $A$ is said to be left coherent, if $A$ is a <a href="20240529-coherent_module.html#ID-35df9c79-23c4-4135-9d25-d9fe847f921e">coherent</a> $A$ module, i.e. every finitely generated <a href="20221204161514-linksideal.html#ID-57b19243-1c18-4d75-9523-4e3413879578">left ideal</a> (submodule) is <a href="20230801-finitely_presented_module.html#ID-7ccb4638-bc9e-414e-a304-75a46e1f34f5">finitely presented</a> as module (cf. <a href="20231214-ideal_as_module.html#ID-7e58ae9c-1dc2-488e-bf56-f8de16aa208b">ideal as module</a>)
</p>
