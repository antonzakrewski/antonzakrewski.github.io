<span id="ID-e90f630d-d589-4e9d-8bf5-7cde7a0b37e8"></span><h1 class="title">homotopy relative to the empty set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,\mathcal{T}_X)$ and $(Y,\mathcal{T}_Y)$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $f,g: X \rightarrow Y$ be <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">maps</a>.
Then the homotopy relative to $\emptyset$ is defined as <a href="20231110-homotopy_relative_to_a_subset.html#ID-1bb0bedb-5fa3-4186-adab-5d5bc845b62a">homotopy relative to</a> $\emptyset$.
</p>
