<span id="ID-62e6b382-1b70-45ae-882b-604187ac2f84"></span><h1 class="title">reduced suspension spectrum of a moore space is a moore spectrum</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M(A,n)$ be a <a href="20241023-moore_space.html#ID-b1285fc5-6d3d-4e00-8f77-f2a6ddf00710">Moore space</a> for an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> $A$ and $n &gt; 0$.
Then the <a href="20260310-reduced_suspension_spectrum_funcotr.html#ID-d86b9354-dd09-4bf5-ab71-475fe62f1369">reduced suspension spectrum functor</a> $\tilde{\mathbb{S}}[M(A,n)]$ is a (shifted) <a href="20260215-moore_spectrum.html#ID-fc4b7793-a90b-42d7-9d80-43fea35d272c">moore spectrum</a>.
