<span id="ID-180a1321-d0d3-4200-89a3-fc5996c98ff8"></span><h1 class="title">minimal element - old</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $&lt;$ a <a href="20220929191054-homogene_relation.html#ID-c0565fb9-7b15-4077-8f3a-5e8dce75c105">relation</a> on $A$.
Then $m \in A$ is said to be a minimal (or dually maximal element), if there doesn't exist an $a \in A \setminus \{m\}$ with $a &lt; m$.
</p>
