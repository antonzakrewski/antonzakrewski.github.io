<span id="ID-1865b844-cfea-426e-a811-f7f19bfebadb"></span><h1 class="title">punktweise Konvergenz einer Funktionsfolge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(f_i(x))_{i \in \mathbb{N} }$ eine <a href="20230110111536-funktionenfolge.html#ID-679d2805-ad6f-4a4e-bcbb-1fbed51e8745">Funktionenfolge</a> und $f,f_i: D \rightarrow Z$ mit $Z$ als <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>.
$(f_i)$ <a href="20220105153330-konvergenz_einer_folge.html#ID-63fa4879-51cf-4ad6-8be5-0e9e10d29726">konvergiert</a> gegen $f$, falls für alle $d \in D$ gilt:
</p>

<div class="math-block">\begin{align*}
(f_n(d)) \rightarrow f(d)
\end{align*}</div>
