<span id="ID-569afb86-884f-497f-908a-ab5ffed389f7"></span><h1 class="title">spectra with abstractly isomorphic homotopy groups are not equivalent</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra</a> such that $\pi_*(X)$ and $\pi_*(Y)$ are <a href="20250124-abstract_isomorphic.html#ID-d8e7f3ab-7225-4584-93b5-be16488ea664">abstractly isomorphic.</a>
Then $X$ and $Y$ are in general not <a href="20241206-equivalent_objects_in_an_infinity_category.html#ID-cbb1ac2c-2755-4d4a-9a75-56978060b40f">equivalent</a> as spectra
