<span id="ID-fd1b210c-d6fc-4f3d-9e60-ba470d404e7b"></span><h1 class="title">extension of scalars of the ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(A,B\) be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a>, $\varphi: A \rightarrow B$ the <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a>
Then
</p>

<div class="math-block">\begin{align*}
B \otimes_{A} A \cong B
\end{align*}</div>
<p>
as \(B\)-module
</p>

<h2 id="proof">Proof</h2>
<p>
using the <a href="20240525-tensor_hom_adjunction.html#ID-9d72073f-c071-4622-855a-cffa16dfbc6b">tensor hom adjunction</a>
</p>
