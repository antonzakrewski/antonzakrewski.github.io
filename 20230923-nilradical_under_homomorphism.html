<span id="ID-570bdf0e-c442-424c-92e2-c3855728990c"></span><h1 class="title">nilradical under homomorphisms</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(A,B\) be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a>, $\mathcal{N}_{A}, \mathcal{N}_B$ the <a href="20230531075602-menge_der_nilpotenten_element_als_ideal.html#ID-603c79c1-6511-45a3-898a-83df20df86ea">nilradicals</a> and $\varphi: A \rightarrow B$ a <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a>
Then $\varphi[\mathcal{N}_A] \subseteq \mathcal{N}_B$
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of <a href="20230923-nilpotent_element_under_homomorphisms.html#ID-8b436333-afa1-4eb7-a70f-6bd452ca41cf">nilpotent element under homomorphisms</a>
</p>
