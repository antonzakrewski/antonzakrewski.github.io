<span id="ID-5ebbf6b9-e6a6-49c5-bc4b-44ad1fc536ba"></span><h1 class="title">normal integral domain and integrally closed</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be an <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integral domain</a>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$R$ is a <a href="20260807-normal_ring.html#ID-d8a212d7-e707-4262-9f2a-61333c04f1b0">normal ring</a> </li>

<li>$R$ is <a href="20230727-integrally_closed_in_a_ring.html#ID-5ee4ff2d-0c85-4ed2-b613-9101a5a350b2">integrally closed</a> </li>
</ol>

<p>
follows from:
</p>
<ul>
<li><a href="20260807-integrally_closed_is_a_point_local_property.html#ID-da743e3e-c58a-4954-8a0f-221834e14351">integrally closed is a point local property</a> </li>
</ul>
