<span id="ID-24d65ccc-73c5-4f29-bade-cb251c0fbf48"></span><h1 class="title">simple mapification of a polynomial for a finite field is surjective</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $F$ be a <a href="20230110203253-endlicher_korper.html#ID-621e7dbb-a704-44aa-9aba-112f6bc27a5f">finite field</a>, $F[X_1,...,X_n]$ the <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a>.
Then the <a href="20231020-mapification_of_a_polynomial.html#ID-2048322e-81a4-4f3a-bf02-81f2501ea9f4">mapification</a>  $\mathrm{map}$ is <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the <a href="20230425173927-lagrange_interpolation_polynomial.html#ID-19f3f849-00a2-4f6f-a2ac-9080af2a9722">Lagrange Interpolation Polynomial</a>
</p>
