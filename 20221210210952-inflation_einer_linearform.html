<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a>, sei $U \subseteq V$ ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Untervektorraum</a> und $f \in V^{*}$
Für $g \in (V/U)^*$ ist die Inflation $I: (V/U)^* \rightarrow V*$ definiert durch
</p>

<div class="math-block">\begin{align*}
(Ig)(v) =&amp; g(v + U) &amp;&amp; v \in V, g \in (V/U)^*
\end{align*}</div>
