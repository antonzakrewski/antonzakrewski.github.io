<span id="ID-5240afd4-8e6c-4696-98b8-50cf44a44727"></span><h1 class="title">embedded topological subgroup</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be <a href="20230226210828-topologische_gruppe.html#ID-0aa20bcb-5c3d-4d06-aeee-e61b46a46e48">topological group</a> and $H$ a <a href="20241203-topological_subgroup.html#ID-2d47cd9e-a2f2-4d50-8f56-9b4b7e72cebf">weak topological subgroup</a>.
Then $H$ is an embedded topological subgroup, if the inclusion
</p>

<div class="math-block">\begin{align*}
\iota: H \rightarrow G
\end{align*}</div>
<p>
is a <a href="20230211133059-einbettung_einer_topologie.html#ID-0cc33b7e-a336-4565-a867-c2859bcb0a82">topological embedding</a>
</p>
