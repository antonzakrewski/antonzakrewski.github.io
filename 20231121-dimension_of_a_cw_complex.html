<span id="ID-88a5d944-49a1-472d-b985-c3e7e7a8c3eb"></span><h1 class="title">dimension of a CW Complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complex</a> with a filtration $\mathrm{SK}_n$.
Then $X$ is said to be \(n\)-dimensional, if there exists an $n$ such that
</p>

<div class="math-block">\begin{align*}
\mathrm{SK}_n = \mathrm{SK}_{n'} \forall n' \geq n
\end{align*}</div>
