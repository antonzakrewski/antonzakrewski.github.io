<span id="ID-d97e4b2e-16ae-483f-92bb-6438a08821a8"></span><h1 class="title">zusammenhängende Menge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>.
Eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $M \subseteq X$ ist zusammenhängend, falls die von $M$ induzierte <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">Unterraumtopologie</a> <a href="20230118223336-zusammenhangender_raum.html#ID-bcc53507-bc5a-46d4-bd83-53e504f62b9d">zusammenhängend</a> ist.
</p>
