<span id="ID-78b305ab-3e64-4045-8558-cc16b8a7e631"></span><h1 class="title">affine space nonsingular</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a>  <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{A}_{K}^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a>.
Then $\mathbb{A}_K^n$ is <a href="20241206-nonsingular_quasi_projcective_variety.html#ID-b6bfc819-0873-4932-8876-b267c3705c60">nonsingular</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
Follows from
</p>
<ul>
<li><a href="20240903-nonsingular_point_and_jacobi_matrix.html#ID-c6d5eaea-d80a-4aa8-b70e-e1df01689757">nonsingular point and jacobi matrix</a> </li>
</ul>
<p>
where we may take the <a href="20221223184351-nullpolynom.html#ID-3ecc5d53-e0d1-4b33-a9a8-12103316164a">zero polynomial</a> and get the zero matrix $(0) \in K^n$
</p>
