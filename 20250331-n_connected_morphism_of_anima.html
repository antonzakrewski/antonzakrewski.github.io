<span id="ID-aede7973-1d85-4205-98a4-be203c9a39d3"></span><h1 class="title">n-connected morphism of anima</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a morphism in <a href="20240713-infinity_category_of_spaces.html#ID-7a8f95e9-9a42-40a5-aa46-7fabec2ef09a">Anima</a>.
Then $f$ is said to be \(n\)-connected, if for each $* \rightarrow Y$ the <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber</a> is an <a href="20250331-n_connected_anima.html#ID-8d54c8e2-dcbc-4c3f-a2c6-43654b0c9786">n-connected anima</a>
</p>
