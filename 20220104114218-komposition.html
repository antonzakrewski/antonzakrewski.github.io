<span id="ID-7dbdf503-309d-418b-8b3d-5c2fe27bbfeb"></span><h1 class="title">Function composition</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $A,B,C$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und $f: A \rightarrow B$, $g: B \rightarrow C$ <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildungen</a>
Dann ist die Komposition definiert als
</p>

<div class="math-block">\begin{align*}
g \circ f: A \rightarrow&amp; C \\
 a \mapsto g(f(a))
\end{align*}</div>
