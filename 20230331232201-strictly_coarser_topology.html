<span id="ID-e45ac465-bcb6-48bd-a143-90ad4c51826b"></span><h1 class="title">strictly coarser topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{T}$ and $\mathcal{T}'$ be <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">topologys</a> over a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $X$.
If $\mathcal{T} \subsetneq \mathcal{T}'$, then $\mathcal{T}$ is said to be strictly coarser than $\mathcal{T}$
