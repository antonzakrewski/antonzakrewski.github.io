<span id="ID-23d1001e-e1ad-445d-9b35-b977bbf28759"></span><h1 class="title">right coherent ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $R$ is said to be right coherent, if $R$ regarded as right \(R\)-module is a <a href="20240529-coherent_module.html#ID-35df9c79-23c4-4135-9d25-d9fe847f921e">coherent module</a>
</p>
