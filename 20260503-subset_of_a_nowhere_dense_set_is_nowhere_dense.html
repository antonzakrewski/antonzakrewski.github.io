<span id="ID-89112971-1969-4b64-8e51-cabdc3b70ef8"></span><h1 class="title">subset of a nowhere dense set is nowhere dense</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A \subseteq X$ be a <a href="20230222172146-nirgends_dicht_topologie.html#ID-022a1587-f478-44ec-a8c6-3ecb6fcc6ad8">nowhere dense</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> in a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $X$.
Then any subset $B \subseteq A$ is also nowhere dense.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20230305124527-abschluss_einer_teilmenge.html#ID-31866533-a3f7-4168-aa7e-4625b41b4790">Closure of a Subset</a> </li>

</ul>
