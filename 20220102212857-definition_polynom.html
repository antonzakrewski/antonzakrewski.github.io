<span id="ID-a2f108fc-4631-45ea-bf8c-70182b7714f9"></span><h1 class="title">polynomial</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a>, so ist ein Polynom $f \in R[X_i \vert i \in I]$ definiert als
</p>

<div class="math-block">\begin{align*}
f =&amp; \sum_{i \in I} \sum_{j=0}^{\infty} \alpha_j X^j
\end{align*}</div>
<p>
wobei <a href="20221013222501-fast_alle.html#ID-a3da14cb-05c1-4f9e-a68a-a693980f5ede">fast alle</a> Koeffizienten $\alpha_j = 0$
</p>
