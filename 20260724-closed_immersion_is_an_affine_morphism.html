<span id="ID-dcb44d6d-ac3f-4d66-94c7-8996c843565e"></span><h1 class="title">closed immersion is an affine morphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a>.
Then $f$ is an <a href="20260724-affine_morphism_of_algebraic_functors.html#ID-4c2d66a8-67b6-47b1-b210-b8e29a921330">affine morphism</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the <a href="20260804-pullback_criterion_for_affine_functors.html#ID-fa414105-a963-44bd-928a-aa4c675168ae">pullback criterion for affine functors</a>.
</p>
