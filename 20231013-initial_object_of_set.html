<span id="ID-8e5af251-6820-46d2-9ec9-9a3c76aa18e5"></span><h1 class="title">initial object of set</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20211226215449-leere_menge.html#ID-abf22513-8cde-4019-8690-8b02edd4337d">empty set</a> is the <a href="20220825145505-initiales_objekt.html#ID-7ad29aa1-f819-4a5b-8ef9-24c92a84802f">initial object</a> of <a href="20221216142701-kategorie_set.html#ID-dc78356f-1fcf-41e8-b05a-47cdd731513c">category set</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $A$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>.
Then the only <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $f: \emptyset \rightarrow A$ is the <a href="20231013-empty_function.html#ID-ced37f6f-318f-4df0-8c86-c6667d7cfb33">empty function</a>, as it is the only <a href="20211227225631-relation_mathe.html#ID-20e17f2d-e102-4093-8c48-e5b41db0ffbf">Relation</a> on $\emptyset \times A$
</p>
