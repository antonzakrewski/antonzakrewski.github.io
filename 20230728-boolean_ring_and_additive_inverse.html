<span id="ID-fe69f3c3-caac-4e70-8f67-e53f09936ea3"></span><h1 class="title">boolean ring and additive inverse</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20230728-boolean_ring.html#ID-f737096d-4f7a-4ebd-aa78-eed57b2ef54b">Boolean ring</a> and $r \in R$.
Then
</p>

<div class="math-block">\begin{align*}
r = -r
\end{align*}</div>

<h2 id="proof">Proof</h2>

<div class="math-block">\begin{align*}
(r + r)^2 - (r + r) = 0 \\
r^2 + r^2 + 2r - (r + r) =&amp; 0 \\
2r =&amp; 0 &amp;&amp; \vert -r \\
r = -r
\end{align*}</div>

</div>
