<span id="ID-632bc469-a87a-432f-9d6c-138b0e57f94d"></span><h1 class="title">cocartesian monoidal structure as symmetric monoidal structure</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(\mathcal{V}, \otimes_{\mathcal{V}}, \mathds{1}_{\mathcal{V}})$ be a <a href="20231204-cocartesian_monoidal_category.html#ID-63c168ff-edde-48d5-926b-e6ea9dc49dae">cocartesian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{V}$ is a <a href="20240121-symmetric_monoidal_category.html#ID-a3104144-74b9-4bc8-8537-16eda80767f1">symmetric monoidal category</a>
</p>
