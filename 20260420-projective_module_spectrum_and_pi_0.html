<span id="ID-66b72399-4aa4-4477-8562-6ec17ddf9e55"></span><h1 class="title">projective module spectrum with trivial pi_0 is trivial</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20250821-projective_module_spectrum.html#ID-1d9d9118-b853-48cc-9688-954d8bb6a724">projective module spectrum</a>.
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$\pi_0(M)$ is the <a href="20241017-infinity_zero_object.html#ID-ec40b632-b794-428c-b987-81a9b53bd650">zero object</a></li>

<li>$M$ is the zero object</li>
</ol>

follows from:
