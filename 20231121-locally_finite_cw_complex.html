<span id="ID-a4db8837-2063-4f71-bbbf-cb3ab332841b"></span><h1 class="title">locally finite cw complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathrm{SK}_n(X))$ be a <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complex</a>.
</p>

<p>
Then $X$ is said to be locally finite, if each cell $\beta_{i}[D^{n+1}] \subseteq X$ is <a href="20211226220255-disjunkte_mengen.html#ID-2000e1f4-7e9e-45f9-91ed-16ded8a15190">disjoint</a> from <a href="20221013222501-fast_alle.html#ID-a3da14cb-05c1-4f9e-a68a-a693980f5ede">almost all</a> other <a href="20231122-cell_of_a_cw_complex.html#ID-38297b9e-d953-4aac-b63c-ff55b9888ccf">cells of a cw-complex</a>
</p>
