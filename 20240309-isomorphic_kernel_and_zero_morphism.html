<span id="ID-4bc36439-2fbb-4dd9-9f4a-42f81d0aafa6"></span><h1 class="title">isomorphic kernel and zero morphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20231215-pointed_category.html#ID-0783589b-3d52-46d9-a7ad-fb1c3130a223">pointed</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $f: X \rightarrow Y$ a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a>.
</p>

<p>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$f$ is the <a href="20230402144657-zero_morphism.html#ID-6cb7ce09-7038-4581-bc67-91d231a2be10">zero morphism</a> </li>

<li>$\mathrm{ker}(f) \cong X$</li>
</ol>
<h2 id="proof">Proof</h2>
<p>
corollary of <a href="20231210-equalizer_and_equal_maps.html#ID-918555a4-c397-4613-be31-0fa70d5a06d4">equalizer and equal maps</a>
</p>
