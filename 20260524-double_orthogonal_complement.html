<span id="ID-0474415c-2bb2-4229-8650-872626cf3c8f"></span><h1 class="title">double orthogonal complement</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{H}$ be a <a href="20230105092710-prahilbertraum.html#ID-c83705a9-fdd0-441f-b0a3-116c78ef7c7b">prehilbert space</a> and $M \subseteq \mathcal{H}$.
Then $M \subseteq M^{\bot}^{\bot}$.
</p>

<h2 id="proof">Proof</h2>
<p>
Let $m \in M$ be fixed and $n \in M^{\bot}$ arbitrary, then $\langle m,n\rangle$ which shows that $m \in (M^{\bot})^{\bot}$.
