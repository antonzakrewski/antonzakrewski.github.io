<span id="ID-51cd65a2-e258-4fd0-b4cb-c60d681ce947"></span><h1 class="title">Quotientenmenge einer Äquivalenzrelation</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\sim$ eine <a href="20211227225754-aquivalenzrelation_mengenlehre.html#ID-bf83e0aa-4df1-48a5-b910-2837942bdd19">Äquivalenzrelation</a> und $A$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>.
Dann ist die zugehörige Quotientenmenge oder auch Faktormenge die Menge aller <span class="broken-link" title="unresolved id:5ee76318-ae03-4cb3-877f-6b6ff88ad6fa">Äquivalenzklassen</span> auf die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $A$
</p>

<div class="math-block">\begin{align*}
A/\sim  \coloneqq \{[a]_{\sim} \vert a \in A\}
\end{align*}</div>
