<span id="ID-e48b4c8f-cd71-41f6-a55e-c5898278904d"></span><h1 class="title">locally closed subfunctor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a>
Then a locally lcosed subfunctor is a <a href="20230922-subfunctor.html#ID-e3017b76-a5ac-43b3-a458-b3ede2132fec">Subfunctor</a> $Y \hookrightarrow X$ such that there exists an <a href="20260713-open_subfunctor_of_an_algebraic_functor.html#ID-3591ec98-a7a9-4668-a975-fdf935c815e8">open subfunctor</a> $U \hookrightarrow X$ containing $Y$ as <a href="20260713-closed_subfunctor.html#ID-d952d35b-1a92-4447-97b0-37c5363be496">closed subfunctor</a>.
</p>
