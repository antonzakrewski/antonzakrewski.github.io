<span id="ID-54329f3c-eac1-42cb-acd2-17c895172999"></span><h1 class="title">locally pointed contractible based space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,x)$ be a <a href="20230331112759-based_space.html#ID-2b4bad5a-2a2b-4aac-8f24-1ed9951887f8">based space</a>.
Then $(X,x)$ is said to be locally pointed contractible, if there exists a <a href="20230330173711-kontraktibler_raum.html#ID-97035c96-d3da-46f5-afad-856a662cb0e5">contractible</a> <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhood</a> $U$ of $x$
</p>
