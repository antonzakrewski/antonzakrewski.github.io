<span id="ID-60c304bd-d325-468c-b7dc-ffdfab5ec2e8"></span><h1 class="title">terminal object in an infinity category as empty limit</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>, $x \in \mathcal{C}_0$ an object
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$x$ is a <a href="terminal-object-in-an-infinity-category.html#ID-b49b437f-7d5c-4d8a-a413-1c995de811f6">terminal object</a></li>

<li>$x$ is a <a href="infinity-limit.html#ID-a8bcf958-5282-4984-8415-7a64cca74613">limit</a> for the <a href="20230404183726-initial_morphism.html#ID-95a8bd02-e32c-4eaf-a0e5-e0b8de53fb59">initial morphism</a> $\emptyset \rightarrow \mathcal{C}$ of the <a href="20240624-initial_simplicial_set.html#ID-499255b5-d636-47eb-8c31-eb224cfc1882">initial simplicial set</a> </li>
</ol>
