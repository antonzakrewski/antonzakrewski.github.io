<span id="ID-b11ba760-2ecb-4af0-a75a-76718317381a"></span><h1 class="title">birational map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $X,Y$ <a href="20230907-variety.html#ID-da516b65-c562-41ce-a656-39a949ee13fa">varieties</a> and $\varphi: X \rightarrow Y$ a <a href="20230909-rational_map.html#ID-21c5c5dc-5ad6-4f25-bfd9-30c46f5f23bf">rational map</a>
Then $\varphi$ is a birational map, if there exists an <a href="20220927213528-umkehrabbildung.html#ID-6852cd17-4614-4655-ad66-85727c75b0f5">inverse map</a> $\psi: Y \rightarrow X$ such that $\psi$ is also a <a href="20230909-rational_map.html#ID-21c5c5dc-5ad6-4f25-bfd9-30c46f5f23bf">rational map</a>
</p>
