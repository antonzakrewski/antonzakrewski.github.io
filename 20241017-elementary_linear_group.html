<span id="ID-0a939668-5790-49b7-8a78-b4b707e94ba1"></span><h1 class="title">elementary linear group</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then the elementary linear group is defined as <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a>  of the <a href="20221125172149-general_linear_group.html#ID-4ccb8f16-ca9c-4ec3-ba63-d1950d5bec89">general linear group</a> generated by the <a href="20221208191647-elementarmatrix.html#ID-78b77753-7806-4c23-9442-63216ad410f8">elementary matrices</a>
</p>
