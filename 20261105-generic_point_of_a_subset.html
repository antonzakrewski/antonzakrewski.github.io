<span id="ID-39c4072b-3743-465f-934c-18cfb31ac892"></span><h1 class="title">generic point of a subset</h1>

<h2 id="definition">Definition</h2>
<p>
Let $z \in Z \subseteq X$  be a point of a <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a> $Z \subseteq X$.
Then $z$ is a generic point of $z$ if $z$ is <a href="20221124232157-dichte_menge_topologie.html#ID-921fe319-4945-4303-a9a5-3723804e0737">dense</a> in $Z$.
</p>
