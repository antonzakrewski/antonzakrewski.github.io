<span id="ID-07fbfbda-e29e-43eb-ba55-062929da2661"></span><h1 class="title">mapping class groups</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a> and $\mathrm{Diff}_{\partial}(M)$ the <a href="20260630-diff_partial.html#ID-35bfd120-c1a4-4dfc-9c15-40d60dcdfad8">Diff partial</a>.
Thne the mapping class group of $M$ is defined as $\pi_0(\mathrm{Diff}_{\partial}(M))$
</p>
