<span id="ID-c127d1e5-19c1-4d61-a863-f2717b835e16"></span><h1 class="title">weil restriction preserves locally finitely presented algebraic functors</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\varphi: k \rightarrow k'$ be a <a href="20221226010233-ringhomomorphismus.html#ID-136298f7-3132-4bd7-934f-0eefaa48fcf9">ring-homomorphism</a> between <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative rings</a>.
Then the <a href="20260715-weil_restriction_for_a_ring_map.html#ID-cb8e6406-55ed-4820-8c70-ebce4e1ce810">weil restriction</a>  along $\varphi$ preserves <a href="20260714-algebraic_functor_locally_of_finite_presentation.html#ID-6f5ba542-2ad9-41e0-9e2b-e89f2032ee4e">algebraic functor locally of finite presentation</a>.
