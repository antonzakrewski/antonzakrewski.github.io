<span id="ID-571541e7-6ca9-496a-9356-bee7feaaec5e"></span><h1 class="title">formal taylor series for a power series ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f = \sum_{n\geq 0} f_n X^n$ be an element in the <a href="20230427070950-ring_der_formalen_potenzreihen.html#ID-8c920542-3559-472f-8af9-c0d8690cf10a">power series ring</a> $R[ [ X] ]$ where $\mathbb{Q} \rightarrow R$ are <a href="20221226125808-einheit_ring.html#ID-a3b1e1af-c3e3-433c-a4dd-2ee2c6e1d69a">units</a>.
Then
</p>

<div class="math-block">\begin{align*}
f = \sum_{n \geq 0} \frac{1}{n!} D^n(f)_0 \cdot X^n
\end{align*}</div>
