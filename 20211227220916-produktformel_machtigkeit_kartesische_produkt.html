<span id="ID-2e640704-ec66-4efd-8735-e1c5d3f51909"></span><h1 class="title">Produktformel für die Mächtigkeit kartesischen Produkts</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $X_1,...,X_n$ <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endliche</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> und $X = \prod_{i=1}^n X_i$ das <a href="20211226220618-kartesische_produkt.html#ID-0dd71736-db78-4510-8588-7811037d0796">Kartesisches Produkt</a>.
Dann gilt für die <a href="20211227215415-machtigkeit_menge.html#ID-a53ec5a2-0adb-4575-bf21-e3ac15eff75f">Mächtigkeit</a>
</p>

<div class="math-block">\begin{align*}
\vert \prod_{i=1}^n X_i \vert = \prod_{i=1}^n \vert X_i \vert
\end{align*}</div>
