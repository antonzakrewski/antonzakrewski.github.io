<span id="ID-4562b1e1-37f4-4ed2-9268-bf00a6f6b155"></span><h1 class="title">compactly assembled category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="accessible-infinity-category.html#ID-f23cff27-6e97-4440-a7bd-a3a94ce4e648">accessible category</a> with <a href="kappa-filtered-infinity-colimit.html#ID-b8bba4f3-4065-46e4-9f89-f79a3b3fbb97">filtered colimits</a>.
Then $\mathcal{C}$ is compactly assembled, if the colimit functor $\mathrm{colim}: \mathrm{Ind}(\mathcal{C}) \rightarrow \mathcal{C}$ has a <a href="20241017-infinity_left_adjoint.html#ID-2ba0e3a5-7a57-4093-837c-b1f0feabd7c2">left adjoint</a>
</p>
