<span id="ID-37b89bcc-af64-4182-9e25-2a7ac65f9ec4"></span><h1 class="title">spectral sequence</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>
Then a spectral sequence $E$ is given by <a href="20250826-r_th_page_of_a_spectral_sequence.html#ID-692a5c39-e145-465d-8e11-d5985bd90fcb">pages</a> $E_r^{p,q}$ for $r \geq r_0$ together with chosen <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a> $H^{p,q}(E_r) \simeq E_{r+1}^{p,q}$ (cf. <a href="20250826-homology_the_r_th_page.html#ID-6450f22d-cb86-4aa5-a69e-76b3241a2109">homology the r-th page</a>)
</p>
