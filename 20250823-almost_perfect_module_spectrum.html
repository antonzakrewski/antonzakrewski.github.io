<span id="ID-0def0ede-8422-4fff-b6f7-28890683ead8"></span><h1 class="title">almost perfect module spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M \in \mathrm{Mod}(R)$ be a <a href="20250621-module_over_a_ring_spectrum.html#ID-ff15d87e-6808-4cb5-ab80-8484014dbc6d">module spectrum</a> over an $\mathbb{E}_1$ <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a> $R$.
Then $M$ is said to be almost perfect, if
</p>
<ol>
<li>$M$ is <a href="20250823-bounded_below_object_for_a_t_structure.html#ID-3ff4f2ad-988a-4820-bc93-70cdf66c7192">bounded below</a> </li>

<li>$M$ is an <a href="20250823-almost_compact_object.html#ID-ac79c7ce-e8d8-4d58-a507-09f487220786">almost compact object</a> of $\mathrm{LMod}(R)_{\geq k}$</li>
</ol>
