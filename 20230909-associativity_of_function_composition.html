<span id="ID-ce992b9a-de60-421f-b4ea-8da23cc8bd22"></span><h1 class="title">associativity of function composition</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A,B,C,D$ be <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> and $f: A \rightarrow B, g: B \rightarrow C, h: C \rightarrow D$ be <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">maps</a>.
Then
</p>

<div class="math-block">\begin{align*}
(f \circ g) \circ h =&amp; f \circ (g \circ h)
\end{align*}</div>
<p>
i.e. <a href="20220104114218-komposition.html#ID-7dbdf503-309d-418b-8b3d-5c2fe27bbfeb">composition</a> of <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">maps</a> is <a href="20211008171532-assoziativgesetz.html#ID-124778f2-ef98-469b-8664-7777bb4bff01">associative</a>.
</p>
