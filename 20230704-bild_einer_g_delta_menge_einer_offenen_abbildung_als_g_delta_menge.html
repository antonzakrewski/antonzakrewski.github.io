<span id="ID-230cf010-3a55-488e-ba53-16dffc913060"></span><h1 class="title">Bild einer G-Delta Menge einer offenen Injektion als G-Delta Menge</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $(X, \mathcal{T}_X)$ und $(Y, \mathcal{T}_Y)$ <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räume</a> und $f: X \rightarrow Y$ eine <a href="20230227190111-offene_abbildung_topologie.html#ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52">offene Abbildung</a>.
Sei $A \subseteq X$ eine <a href="20230601132902-g_delta_menge.html#ID-6df4b467-3c98-44c3-a261-42d8185498a1">G-Delta Menge</a>, so ist $f[A]$ eine <a href="20230601132902-g_delta_menge.html#ID-6df4b467-3c98-44c3-a261-42d8185498a1">G-Delta Menge</a>
</p>
