<span id="ID-f6ec9591-ab5c-4d9b-b77f-cdde98952921"></span><h1 class="title">Addition auf beiden Seiten (Anordnung)</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
a &gt; b \Leftrightarrow a + x &gt; a + x
\end{align*}</div>

<h2 id="beweis">Beweis</h2>

<div class="math-block">\begin{align*}
a - b &gt; 0 \\
a - b + x - x &gt; 0 \\
(a + x) - (b + x) &gt; 0 \\
a + x &gt; b + x 
\end{align*}</div>
