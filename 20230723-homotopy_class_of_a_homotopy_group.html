<h2 id="definition">Definition</h2>
<p>

</p>

<div class="math-block">\begin{align*}
\mathrm{Map}((I^n, \partial I^n),(X,x_0))
\end{align*}</div>

modulo <a href="20230330144151-relative_homotopie.html#ID-69e06161-ad5b-4873-b52b-07908f57dd75">homotopy relative</a> to $\partial I^n$
