<span id="ID-6432ba97-db5f-4b28-8d58-b10d52f23e00"></span><h1 class="title">E-local equivalence for a spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a map of spectra.
Then $f$ is said to be an \(E\)-equivalence if one (and hence both) of the equivalent conditions is true
</p>
<ol>
<li>$E \otimes f$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a></li>

<li>$E \otimes \mathrm{cofib}(f) \simeq 0$    </li>
</ol>
