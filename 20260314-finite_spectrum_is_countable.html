<span id="ID-4d2f7f74-5478-49e5-bb2b-ead75501dc7c"></span><h1 class="title">finite spectrum has degreewise finitely generated homotopy groups</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectrum</a>.
Then $\pi_*(X)$ is <a href="20230608-endlich_erzeugte_gruppe.html#ID-9d1d22d5-501a-45b6-a05d-abbe73155a04">finitely generated</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from some <a href="20241222-long_exact_sequence.html#ID-e3fbc2e4-7c9f-4d19-9391-c118cb77f08f">long exact sequence</a> argument &amp; <a href="20251027-finitely_generated_abelian_groups_is_a_derived_serre_ring.html#ID-a906d60a-68fb-45cd-b453-79c551e2693a">finitely generated abelian groups is a derived serre ring</a>
</p>
