<span id="ID-f5cc1afb-f2a0-4d11-ab90-abcada2f964f"></span><h1 class="title">even spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectrum</a>.
Then $X$ is said to be even if $H_k(X,\mathbb{Z})$ is a <a href="20230302220041-freie_abelsche_gruppe.html#ID-42cd7600-d3fd-4c7d-b34f-fcc264bee308">free abelian group</a> for $k$ even and zero for $k$ odd.
</p>
