<h2 id="definition">Definition</h2>
<p>
Die Mesotes Lehre nach Aristoteles ist die Vorstellung, dass ethische/Charakter- Tugenden gegeben sind durch eine persönliche, rechte Mitte zwischen zwei Extremen.
</p>

<p>
Ethische Tugenden sind dabei insbesondere keine Verstandestugenden
