<span id="ID-b2b4ea42-4abf-40e1-99a4-04d9423180de"></span><h1 class="title">Medianwert einer Zufallsvariable</h1>

<h2 id="definition">Definition</h2>

<p>
Dann ist $\mu$ ein Median für $X$ falls gilt
</p>

<div class="math-block">\begin{align*}
\mathbb{P}(X \geq \mu) \geq&amp; \frac{1}{2} \\
\mathbb{P}(X \leq \mu) \geq&amp; \frac{1}{2}
\end{align*}</div>
