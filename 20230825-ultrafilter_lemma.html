<span id="ID-84a6691d-a160-4ff6-a87a-ddea25d48f41"></span><h1 class="title">ultrafilter lemma</h1>

<h2 id="definition">Definition</h2>
<p>
Let $S$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $\mathcal{F}$ a <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Setfilter</a> on $S$.
Then there exists an <a href="20230306234012-ultrafilter.html#ID-88624d50-ad13-4c2a-ad1a-a1ed607768e9">Ultrafilter</a> $\mathcal{U}$ such that $\mathcal{F} \subseteq \mathcal{U}$
