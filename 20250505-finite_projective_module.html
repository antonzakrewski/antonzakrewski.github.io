<span id="ID-469e6e1a-935f-41f5-a2c4-ac9754390664"></span><h1 class="title">finite projective module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a>
Then $M$ is said to be finite projective, if $M$ is <a href="20230727-projective_object.html#ID-605bb0c6-3cb5-44d6-bb3e-660f0fef14d1">projective</a> and
</p>

<div class="math-block">\begin{align*}
M \oplus N \cong R^n 
\end{align*}</div>
<p>
for some $n \in \mathbb{N}$
</p>
