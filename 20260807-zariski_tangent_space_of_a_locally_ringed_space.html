<span id="ID-bf4e922e-2c15-424b-ad97-6374eff94479"></span><h1 class="title">zariski tangent space of a locally ringed space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_{X})$ be a <a href="20230826-locally_ringed_space.html#ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728">locally ringed space</a> and $x \in X$.
Then the zariski tangent space is defined as the $k(x)$-module $(T(X)) = (T_{x}^*)^{\vee} = (\mathfrak{m}_{x}/\mathfrak{m}_{x}^2)^{\vee}$
</p>
