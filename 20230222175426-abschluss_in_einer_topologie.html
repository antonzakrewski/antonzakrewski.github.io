<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $A \subseteq X$, so ist der Abschluss $\overline{A}$ von $A$ definiert als <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>:
</p>

<div class="math-block">\begin{align*}

\end{align*}</div>
