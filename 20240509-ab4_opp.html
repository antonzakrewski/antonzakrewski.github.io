<span id="ID-3f5ea7a4-b9e0-4ff9-8e81-b26386b5fba1"></span><h1 class="title">Ab4 opp</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{A}$ is said to be Ab4 opp if the <a href="20220830192239-duale_kategorie.html#ID-711d7a6e-e765-4a59-90a2-baeee955dea1">opposite category</a>  $\mathcal{A}^{\mathrm{opp}}$ is <a href="20240308-ab4_category.html#ID-298aea03-e2c5-4992-9fa1-f8d4f716f270">Ab4</a>
</p>

<p>
i.e. $\mathcal{A}$ is <a href="20230923-complete_category.html#ID-8877dd56-54c0-42cc-a1d8-2785b0cec19b">complete</a> and <a href="20230404141718-categorical_product.html#ID-c6b25f4e-7486-4399-bea3-ace8da2a18c9">products</a> commute with <a href="20231018-finite_colimit.html#ID-45769a25-b177-43a7-a8dc-ce5984aad851">finite colimits</a>
</p>
