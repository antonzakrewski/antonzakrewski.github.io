<span id="ID-697133ef-c899-4551-923a-c5b61b5c6bef"></span><h1 class="title">tensor product in spectra as reduced functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectra.</a>
Then the <a href="20250316-tensor_product_of_spectra.html#ID-60e4fef7-d853-48af-bc49-f4c324e40682">tensor product of spectra</a> is an <a href="20250128-reduced_infinity_functor.html#ID-8c1e14a4-5e7b-415e-987f-69485f17a66f">reduced infinity functor</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as $- \otimes_{\mathbb{S}} X$ <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimit</a>s and the <a href="20241014-initial_object_in_an_infinity_category.html#ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89">initial object</a> is given as empty colimit.
</p>
