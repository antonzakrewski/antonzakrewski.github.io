<span id="ID-10b5c8d4-7ba7-4f90-8471-ef07d40fdd71"></span><h1 class="title">rank of a vector bundle</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: E \rightarrow B$ be a \(\mathbb{K}\)-<a href="20230905-topological_vector_bundle.html#ID-821f2fea-f858-4555-ae30-90ea23209a2e">vector bundle</a>.
Then $p$ has rank $n \in \mathbb{N}$ if each <a href="20240717-fibre_of_a_morphisms.html#ID-88467be8-d154-4c5b-9922-28e1c3c42044">fibre</a> regarded as <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> has <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimension</a> $n$
</p>
