<span id="ID-b6f325ea-2d24-43be-977b-2981baad9524"></span><h1 class="title">equalizer</h1>

<h2 id="definition">Definition</h2>
<p>
An equalizer is a <a href="20230804-fork.html#ID-ecc9c4d9-2d1d-44b1-a9c1-3c05ffc884d2">fork</a> $(\mathrm{E}, eq)$satisfying following <a href="20230404185319-universal_property.html#ID-97334d2a-9fb2-4542-9d53-144c4f4cb4d6">universal property</a>:
For any fork $(O,m)$ there exists an unique <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a> $u: O \rightarrow E$ such that following <a href="20220821183856-diagramm_kategorientheorie.html#ID-ad9d3642-913a-4374-8605-52121d00b349">diagram</a> <a href="20220824224824-kommutierendes_diagramm.html#ID-968cc45b-2492-4495-b9e3-261866c0901d">commutes</a>
</p>
