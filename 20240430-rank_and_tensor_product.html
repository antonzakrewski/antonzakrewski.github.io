<span id="ID-69a41372-32d9-4e60-b889-bcfdc6cdf4a8"></span><h1 class="title">rank map and tensor product</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $P,Q$ be <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a> <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective modules</a>
Then the <a href="20241114-rank_map_of_a_finitely_projective_map.html#ID-2fbe3e4d-5a29-43bd-b3f9-c2ec743d677f">rank map</a> is given by
</p>

<div class="math-block">\begin{align*}
\mathrm{rk}_{(-)}(P \otimes_R Q) = \mathrm{rk}_{(-)}(P) \cdot \mathrm{rk}_{(-)}(Q)
\end{align*}</div>
