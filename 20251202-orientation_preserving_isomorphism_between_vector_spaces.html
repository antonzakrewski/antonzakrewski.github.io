<span id="ID-6b2a139a-7c4f-48da-aad3-5ea90e9b4a7f"></span><h1 class="title">orientation preserving isomorphism between vector spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V,W$ be <a href="20251202-orientation_of_a_vector_space.html#ID-d0e60365-25a3-4a90-8daf-9fdf11884f70">oriented</a> <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector spaces</a>.
Then a <a href="20230227153105-vektorraumisomorphismus.html#ID-27b6dd7a-30ae-4eb8-b5c4-e1a268344d2e">vectorspace-isomorphism</a> $\varphi: V \rightarrow W$ is said to be orientation preserving if it maps the choosen <span class="broken-link" title="unresolved id:5ee76318-ae03-4cb3-877f-6b6ff88ad6fa">equivalence class</span> to the other choosen <span class="broken-link" title="unresolved id:5ee76318-ae03-4cb3-877f-6b6ff88ad6fa">equivalence class</span>
</p>
