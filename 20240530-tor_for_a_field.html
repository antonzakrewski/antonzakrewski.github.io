<span id="ID-a588046d-14e3-44c1-9a4d-1cf76cd99509"></span><h1 class="title">tor for a field</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>.
Then the <a href="20230902-tor_functor.html#ID-b722ea72-1c6d-45c9-bf92-84164a0b360a">Tor Functor</a> is <a href="20230404122456-natural_isomorphism.html#ID-0977f626-bc15-4197-93bd-092d014c8270">naturally isomorphic</a> to the <a href="20240424-zero_functor.html#ID-9cc1dedc-d8c3-4694-9315-85abdc896d49">zero functor</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Tor}_n^R(-,-) \cong 0
\end{align*}</div>
<p>
for $n \geq 1$
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of:

</ul>
