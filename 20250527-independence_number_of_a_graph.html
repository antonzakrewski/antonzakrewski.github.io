<span id="ID-1f76fdfe-a9c8-4ba4-b142-de2eb0f80e49"></span><h1 class="title">independence number of a graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then the independence number is defined as maximal number $n \in \mathbb{N}$ such that there exists an <a href="20250527-independent_set_of_vertices.html#ID-544200ae-c9a6-4469-8cdb-40745c19493f">independent set of vertices</a> with cardinality $n$
</p>
