<span id="ID-4f12b3c3-55cf-438c-88a2-5a79d4784650"></span><h1 class="title">inclusion of initial object is cofinal</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">categories</a> with <a href="20241014-initial_object_in_an_infinity_category.html#ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89">initial object</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a> which <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> the initial object.
Then $\mathcal{F}$ is <a href="20241017-cofinal_infinity_category.html#ID-7a01e020-1d0a-43b7-8a3a-37160eb9939d">cofinal</a>
</p>
