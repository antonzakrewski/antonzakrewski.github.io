<span id="ID-6dfca142-6532-4cc7-9d98-4620dbd6fbb4"></span><h1 class="title">finite product of kappa small sets</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X_i$ be $\kappa$ small <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> for a <a href="20230520205956-cardinal_number.html#ID-4fec3025-0ef5-493c-b7a0-323996dcd187">cardinal</a> $\kappa$.
Then $\prod_{i=1}^n X_i$ is also $\kappa$ small.
</p>
