<span id="ID-d97d8a1c-6fdb-446c-9006-22f08dae62f6"></span><h1 class="title">monoid homomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M,N$ be <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoids</a>.
A monoid homomorphism is a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
</p>

<div class="math-block">\begin{align*}
\varphi: M \rightarrow N \\
m \mapsto \varphi(m)
\end{align*}</div>
<p>
such that
</p>
<ol>
<li>$\varphi(e_m) = e_n$, see <a href="20210702074906-neutrales_element_mathe.html#ID-2a95aac8-42e6-4724-9f37-15f6143a35ca">neutral element</a> </li>

<li>$\varphi(m_1 \cdot m_2) = \varphi(m_1) \cdot \varphi(m_2)$ </li>
</ol>

</div>
