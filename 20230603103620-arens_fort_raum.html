<span id="ID-6f323f20-a67e-46ac-92ac-2ca194420cbb"></span><h1 class="title">Arens-Fort Raum</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\mathbb{N} \times \mathbb{N}$ gegeben, dann ist der Arens-Fort Raum definiert durch die <a href="20221002152517-basis_einer_topologie.html#ID-1a5a6999-876a-4b54-b786-acafe4968fd6">basis</a>
</p>

<div class="math-block">\begin{align*}
\{A \subseteq \mathbb{N}^2 \vert (0,0) \not\in A\} \cup \{A \vert \text{ fast alle Spalten und fast alle restlichen Punkte in } A\}
\end{align*}</div>
