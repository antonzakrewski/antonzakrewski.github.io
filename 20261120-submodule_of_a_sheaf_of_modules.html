<span id="ID-ec995902-f48a-4115-9c73-cb6d8afed543"></span><h1 class="title">submodule of a sheaf of modules</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_{X})$ be a <a href="20230825-ringed_space.html#ID-58bbaf4e-7310-4524-8008-513e209f798d">ringed space</a>.
Let $\mathcal{F}$ a <a href="20230912-sheaf_of_a_module_over_a_ringed_space.html#ID-24b6084d-cd1d-469c-a1d8-a03fdda3bb7a">sheaf of modules</a>, then a $\mathcal{O}_{X}$ subomdule is a sheaf of modules $\mathcal{G}$ and a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> $\mathcal{G} \hookrightarrow \mathcal{F}$ of sheaves (of modules).
</p>
