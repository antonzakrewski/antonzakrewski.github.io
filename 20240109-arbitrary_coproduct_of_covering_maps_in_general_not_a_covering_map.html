<span id="ID-57d7a27f-36a7-47b6-be7a-4ede7258deb8"></span><h1 class="title">arbitrary coproduct of covering maps in general not a covering map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $B$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $p_i: E_i \rightarrow B$ be <a href="20230729-covering_map.html#ID-b817dc02-5dea-4e8d-8ccd-adf7ef14e6bc">covering maps</a>.
Then the <a href="20230404161607-categorical_coproduct.html#ID-25822c41-825b-480b-b8a6-eeb904ca5649">categorical coproduct</a>
</p>

<div class="math-block">\begin{align*}
\coprod_{i \in I} E_i \rightarrow B
\end{align*}</div>
<p>
is in general not a covering map
</p>
