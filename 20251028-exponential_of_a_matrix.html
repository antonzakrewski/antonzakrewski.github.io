<span id="ID-7fc69640-64bc-46b4-878e-3636fa0f5a77"></span><h1 class="title">exponential of a matrix</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A \in \mathrm{M}_{n\times n}(\mathbb{R})$ be a <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">matrix</a>
Then the matrix exponential is given by
</p>

<div class="math-block">\begin{align*}
\mathrm{exp}(A) = \sum_{k=0}^\infty \frac{1}{n!} A^n
\end{align*}</div>
