<span id="ID-f8aa1670-d596-4a50-ab33-df3ec728f680"></span><h1 class="title">1-grothendieck topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20230420221020-essentially_small_category.html#ID-a95068e6-6326-4f2a-98c5-956f6daedd83">essentially small</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
A grothendieck topology $\mathcal{T}$ on $\mathcal{C}$ is a <a href="20230923-covering_sieve.html#ID-64ab0cee-2058-400c-b014-0f5d680be33e">collection of covering sieves</a>  $\mathrm{Cov}_{\mathcal{T}}(X) \subseteq \mathrm{Sieve}(X)$ for each <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $X \in \mathcal{C}$
</p>
