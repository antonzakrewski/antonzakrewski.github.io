<span id="ID-e987a5ed-def4-4e4e-91bb-bb9051d8fd55"></span><h1 class="title">contractible chain complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>.
Then a <a href="20230802-chain_complex.html#ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36">chain complex</a> $A_*$ is said to be contractible, if it is <a href="20240119-chain_homotopy_equivalence.html#ID-ce380f52-3fbd-47a1-8693-537006faaec5">chain homotopy equivalent</a> to the <a href="20240218-zero_chain_complex.html#ID-f521ae7f-f2e7-4d1c-b193-a4caf997f7d9">zero chain complex</a>
</p>
