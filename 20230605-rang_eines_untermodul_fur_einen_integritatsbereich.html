<span id="ID-52b4159e-03e0-4f0d-9b52-3ea36bcd5a3b"></span><h1 class="title">Rang eines Untermodul für einen Integritätsbereich</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> und $M \cong R^n$ ein <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">freier</a> $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a>.
Dann gilt für einen <a href="20230222205257-freier_modul.html#ID-f31e26dc-9f62-4ff2-81db-88cd88c22229">freien</a> <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">Untermodul</a> $U \subseteq M$ und den <a href="20230222205618-rang_eines_moduls.html#ID-32dff54d-1956-4458-9354-10f3d29e3ed4">Rang</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{rank}(U) \leq \mathrm{rank}(M)
\end{align*}</div>
