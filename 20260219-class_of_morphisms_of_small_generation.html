<span id="ID-add540d0-bc4b-4650-bb50-e7194e4a987b"></span><h1 class="title">class of morphisms of small generation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>, then a collection of morphisms $S$ is of small generation, if there exists a set of morphisms $T$ such that the <a href="20250324-strongly_saturated_closure.html#ID-5df92162-a98c-436a-afff-7dbc015a590f">strongly saturated closure</a> $\overline{T} = S$.
</p>
