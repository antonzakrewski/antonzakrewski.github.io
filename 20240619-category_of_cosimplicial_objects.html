<span id="ID-05a31883-eade-497b-a400-c7bc23d3cb0e"></span><h1 class="title">category of cosimplicial objects</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, then the category of <a href="20230923-simplicial_object.html#ID-1501453f-3753-43db-ab32-9f7cf332945d">simplicial objects</a> is defined as <a href="20220825194828-funktorkategorie.html#ID-39ebe96a-b96d-4a11-8642-30527c1b92ea">functor category</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Simp}(\mathcal{C}) = \mathrm{Fun}(\Delta, \mathcal{C})
\end{align*}</div>
<p>
for the <a href="20230923-simplex_category.html#ID-2952609d-1bab-4ac4-bbd7-1c0814af1314">simplex category</a> $\Delta$
</p>
