<span id="ID-f0e862e3-5333-4cd8-af6e-e35eb541a9d3"></span><h1 class="title">n-finite category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20250310-n_category.html#ID-6a9ea22a-1915-4535-8af9-ba699d0487e4">(n,1)-category</a> for $n \in \mathbb{N}^+ \cup \{\infty\}$
Then it is said to be \(n\)-finite, if it lies in the smallest \(n+1,1\)-<a href="20240711-sub_infinity_category.html#ID-79df3d53-7239-474c-bfa4-a3fdbcf588d6">subcategory</a> of $\mathrm{Cat}_{n,1}$ containing $\emptyset, *, \Delta^1$ and which is closed under <a href="20241017-infinity_pushout.html#ID-91244ae5-b853-45df-bbe0-af6ae9a8da47">pushout</a>
</p>
