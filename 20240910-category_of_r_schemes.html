<span id="ID-495cd6ae-4012-41e3-a3ca-47508ffa6352"></span><h1 class="title">category of R-schemes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, then the category of \(R\)-schemes is defined as <a href="20230510092709-slice_category.html#ID-1e81c30c-0f74-4f7c-bf95-400bc8889156">slice category</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{Scheme} \rightarrow \mathrm{Spec}(R)
\end{align*}</div>
<p>
where $\mathrm{Scheme}$ is the <a href="20240225-category_of_schemes.html#ID-6d88d721-8051-4017-a7b2-3b2441ec1a77">category of schemes</a> and $\mathrm{Spec}(R)$ is the <a href="20230826-affine_scheme.html#ID-db53fdff-23db-4578-95b6-9cc1e057c336">affine scheme</a>
</p>
