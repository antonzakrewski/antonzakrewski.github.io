<span id="ID-8a95ce79-4a54-409d-ad75-e6c959dab5c1"></span><h1 class="title">function field of an affine variety</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $\mathbb{A}_{K}^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a> and $X \subseteq \mathbb{A}_{K}^n$ be an <a href="20230313162316-affine_varietat.html#ID-d401938b-d6e1-4d50-a84a-73eb4e945380">affine variety</a>.
Then the function field of $X$ is defined as <a href="20230603-universal_property_of_a_quotient_field.html#ID-cd4c145d-0938-4732-9bde-52806452ab2a">quotient field</a> of the <a href="20230725-coordinate_ring_of_an_affine_variety.html#ID-a8a51cad-5066-4ea6-b16e-eb4381a5dcae">coordinate ring</a>
</p>
