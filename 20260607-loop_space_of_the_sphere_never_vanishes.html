<span id="ID-f979d8f2-e773-4b91-b5c4-20cf91f3cc01"></span><h1 class="title">loop space of higher spheres never vanishes</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $S^n$ be the <a href="20250310-anima_sphere.html#ID-f2ffba28-2097-4e2d-a0b3-41b20fb568bb">anima n-sphere</a> for $n &gt; 1$ and $l$ arbitrary.
Then $\Omega^l S^n$ is nontrivial.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20251202-list_p_local_homotopy_groups_of_spheres.html#ID-758ade8e-69f5-4e1e-a011-6c096347222f">list: p-local homotopy groups of spheres</a> </li>

<li>for $S^2$ use that $\pi_*(S^2) \simeq \pi_*(S^3)$ for $* \geq 3$.</li>
</ul>
