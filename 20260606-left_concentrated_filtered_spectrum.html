<span id="ID-7fb8a7f2-fa55-4976-923f-c8200ac45583"></span><h1 class="title">left concentrated filtered spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X^{\bullet}$ be a <a href="20251020-filtered_spectrum.html#ID-09790f8b-966e-43cd-b6b3-2f9d37a66bb1">filtered spectrum</a>.
Then it is called left concentrated, if $X^{s+1} \rightarrow X^s$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a> for $s &lt;&lt; 0$.
</p>
