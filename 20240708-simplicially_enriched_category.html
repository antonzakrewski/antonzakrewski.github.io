<span id="ID-69f91677-71a4-4b86-bf39-0bc75e403489"></span><h1 class="title">simplicial category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>
Then $\mathcal{C}$ is said to be simplicial, if it <a href="20240121-enriched_category.html#ID-25b0a149-9c99-4434-8269-a02d6792da71">enriched</a> over the <a href="20231115-cartesian_closed_category.html#ID-315f9f64-ca45-4064-b89d-c1da8a889115">cartesian closed</a> <a href="20240128-category_sset.html#ID-e9c2723a-dd7e-48df-84af-05e865106a54">category sSet</a> (cf. <a href="20240708-category_sset_as_symmetric_monoidal_category.html#ID-0c98250d-4b5c-4eea-b102-64c7c62da779">category sSet as cartesian closed category</a>)
</p>
