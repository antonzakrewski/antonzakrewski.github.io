<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a> and $\mathrm{Ch_*}(\mathcal{A})$ be the <a href="20230817-category_of_chain_complexes.html#ID-57e47ad9-c74a-47af-a261-31b1a6a74f8b">category of chain complexes</a>.
Suppose $M_n$ is a <a href="20230722-long_exact_sequence.html#ID-b074fb17-3243-4a76-a429-6825d2c95343">long exact sequence</a>, then its <a href="20230817-homology_functor.html#ID-c35a52a1-7174-408f-8480-9746e1c374bc">homology functor</a> is trivial, i.e.
</p>

<div class="math-block">\begin{align*}
H_n(M_n) = 0
\end{align*}</div>
