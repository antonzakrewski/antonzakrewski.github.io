<span id="ID-c42a9837-a696-4e98-ba3a-5c38d53f2989"></span><h1 class="title">uniqueness of Eilenberg-MacLane spaces</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $K(A,n),K(A,n)'$ be two <a href="20240417-eilenberg_maclane_space.html#ID-ea371170-ec9b-4f59-afe5-4dc951855bb3">Eilenberg-MacLane spaces</a>, which are <a href="20230504195105-cw_komplex.html#ID-ee726694-2276-434b-8043-b02bf828177b">CW-Complexes</a>
Then $K(A,n)$ are uniquely <a href="20231107-homotopy_equivalent_spaces.html#ID-fd6255f6-c435-4901-9aee-e640e09f73a3">homotopy equivalent spaces</a>
</p>
