<span id="ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89"></span><h1 class="title">initial object in an infinity category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> and $X \in \mathcal{C}_0$ an object.
Then $X$ is said to be initial, if the <a href="20240603-mapping_space_of_objects_in_a_quasi_category.html#ID-b5b60979-1586-4548-b06f-5ceca4b045fa">mapping space</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{map}_{\mathcal{C}}(X,Y)
\end{align*}</div>
<p>
is <a href="20240703-contractible_simplicial_set.html#ID-5db3dfcd-9f98-41a8-9550-a49351d833cf">contractible</a> for each $Y \in \mathcal{C}_0$
</p>
