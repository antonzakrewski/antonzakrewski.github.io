<span id="ID-515d6a44-5b5c-4cab-b1d5-71e0f4ae4479"></span><h1 class="title">mapping aut</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> and $x \in \mathcal{C}$.
Then $\mathrm{Aut}_{\mathcal{C}}(x) \subseteq \mathrm{map}_{\mathcal{C}}(x,x)$ is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full sub infinity category</a> of the <a href="20240603-mapping_space_of_objects_in_a_quasi_category.html#ID-b5b60979-1586-4548-b06f-5ceca4b045fa">mapping anima</a> containing the <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalences</a>
</p>
