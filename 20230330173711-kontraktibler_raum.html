<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is said to be contractible, if it is <a href="20231107-homotopy_equivalent_spaces.html#ID-fd6255f6-c435-4901-9aee-e640e09f73a3">homotopy equivalent</a> to the space $\{*\}$
