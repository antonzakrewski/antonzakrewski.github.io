<h2 id="satz">Satz</h2>
<p>
Für jedes $x \in \mathbb{R}$ ist die <a href="20220105231353-exponentialreihe.html#ID-109164a3-9e81-4355-b041-802cd24efd33">Exponentialreihe</a>
</p>

<div class="math-block">\begin{align*}
exp(x)  \coloneqq \sum_{n=0}^{\infty} \frac{x^n}{n!}
\end{align*}</div>

<a href="20220718130957-absolute_reihe.html#ID-96128527-4a42-424c-b629-68bce48ddccb">absolut konvergent</a>
