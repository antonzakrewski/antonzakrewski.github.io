<span id="ID-7249f4be-213f-4e5e-8ed2-d86fdbf2f210"></span><h1 class="title">epsilon-separierte Menge</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>.
Eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a> $X \subseteq M$ ist $\varepsilon$-separiert, falls für zwei verschiedene Punkte $x,y \in M$ gilt:
</p>

<div class="math-block">\begin{align*}
d(x,y) \geq \varepsilon
\end{align*}</div>
