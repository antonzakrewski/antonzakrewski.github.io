<span id="ID-97cef19e-8e69-4c62-ad01-4ff3176b324b"></span><h1 class="title">separated presheaf</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{F} \in \mathcal{P}(\mathcal{C})$ be a <a href="20241021-infinity_presheaf.html#ID-463d818a-2c01-4c74-a241-fd6db6e244fd">presheaf</a> for a <a href="20251116-system_of_local_isomorphisms.html#ID-6aa72223-7fc1-4826-9d42-a874d33f2081">system of local isomorphisms</a>.
Then $\mathcal{F}$ is said to be separated, if precomposition with a local isomorphism is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a>
</p>
