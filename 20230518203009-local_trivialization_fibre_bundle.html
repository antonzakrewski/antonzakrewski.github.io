<span id="ID-c84f02b5-3f22-419d-8843-aeac8d6422b4"></span><h1 class="title">local trivialization (fibre bundle)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(E,B,\pi,F)$ be a <a href="20230518190355-fibre_bundle.html#ID-dc574422-b64c-49fb-a5df-1b528aadd681">Fibre bundle</a>.

</p>
