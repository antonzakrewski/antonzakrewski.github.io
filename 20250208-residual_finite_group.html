<span id="ID-f3b7d5c3-8bfb-4b30-b855-c484e876f021"></span><h1 class="title">residually finite group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $G$ is said to be residual finite, if for each $g \in G$ there existst a <a href="20221210201536-faktorgruppe.html#ID-37068c77-35dd-45c0-8051-01704f97222c">quotient group</a>
</p>

<div class="math-block">\begin{align*}
G \twoheadrightarrow Q
\end{align*}</div>
<p>
such that $Q$ is a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> group and $q(g) \neq 0$
</p>
