<span id="ID-8eda9af8-bd77-491e-a65d-c7cfaf1f1f3a"></span><h1 class="title">pi_1 of a wedge of anima</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20250310-category_of_pointed_anima.html#ID-dcecc787-a204-4e27-a71a-4a8348602f92">pointed anima</a>, then there exists an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>

<div class="math-block">\begin{align*}
\pi_1(X \vee Y) \cong \pi_1(X) * \pi_1(Y)
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
<a href="20230415004146-seifert_van_kampen_theorem.html#ID-4261a1ae-63e2-4c6e-94fa-73199a2b89c9">Seifert-Van Kampen Theorem</a>
</p>
