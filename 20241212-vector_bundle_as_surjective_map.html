<span id="ID-c7338f72-af61-48f8-b562-7a69cb3ca7b4"></span><h1 class="title">vector bundle as surjective map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $p: E \rightarrow B$ be a <a href="20230905-topological_vector_bundle.html#ID-821f2fea-f858-4555-ae30-90ea23209a2e">topological vector bundle</a>.
Then $p$ is <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows as each <a href="20240717-fibre_of_a_morphisms.html#ID-88467be8-d154-4c5b-9922-28e1c3c42044">fibre</a> is a <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> and hence <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nonempty</a>
</p>
