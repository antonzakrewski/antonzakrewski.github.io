<span id="ID-4ad91a63-4fb4-44fc-aabe-1bb37ee661a0"></span><h1 class="title">Existenz eines Neutralen Elements</h1>

<h2 id="axiom">Axiom</h2>
<p>
Sei $M$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und $\circ$ eine <a href="20220723085309-verknupfung_mathe.html#ID-03371b0b-4778-4ca8-8e67-9361dd544d83">Verknüpfung</a>.
Das Axiom ist erfüllt, wenn gilt:
</p>

<div class="math-block">\begin{align*}
\exists e \in M \forall a \in M : (e \circ a = a \circ e = a)
\end{align*}</div>
