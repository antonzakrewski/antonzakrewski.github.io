<span id="ID-5711d3ee-2006-44e1-adb6-22f509e0cbb5"></span><h1 class="title">finite type cw complex in general does not have finitely generated homotopy groups</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20260312-finite_type_cw_complex.html#ID-2249847a-559f-43ed-bba5-41d2390f4545">finite type cw-complex</a>.
Then $\pi_*(X)$ is in general not <a href="20230608-endlich_erzeugte_gruppe.html#ID-9d1d22d5-501a-45b6-a05d-abbe73155a04">finitely generated</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows from $S^1 \vee S^2$
