<span id="ID-b1281952-9072-462f-8a7e-061d75dd7fd0"></span><h1 class="title">hopf monoid in a symmetric monoidal category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(\mathcal{V}, \otimes_{\mathcal{V}}, \mathds{1}_{\mathcal{V}})$ be a <a href="20240121-symmetric_monoidal_category.html#ID-a3104144-74b9-4bc8-8537-16eda80767f1">symmetric monoidal category</a>.
Then a hopf monoid is a <a href="20250122-bimonoid.html#ID-91e87407-3962-488c-ad35-497cc7d466a6">bimonoid</a> together with an <a href="20250122-antipode_of_a_hopf_monoid.html#ID-f33d1bd8-bf87-466e-8acc-28dbbf75b8fb">antipode of a hopf monoid</a>
</p>
