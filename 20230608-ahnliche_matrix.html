<span id="ID-44f6fd3c-ffcc-4518-a4f1-43a15eb783a2"></span><h1 class="title">ähnliche Matrix</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20210702075801-kommutativgesetz.html#ID-2a5d302a-0c7a-4757-83be-0731dfa75d86">kommutativer</a>, <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $A,B \in R^{n\times n}$ <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">Matrizen</a>
Dann sind $A,B$ ähnlich, falls eine invertierbare <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">Matrix</a> $S \in \mathrm{GL}_{n}(K)$ existiert mit:
</p>

<div class="math-block">\begin{align*}
B = S^{-1} \cdot A \cdot S
\end{align*}</div>


</div>
