<span id="ID-dfcea672-4a0e-4582-9541-56ca429e2e37"></span><h1 class="title">intersection as absolute complement of a union</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A,B \subseteq X$ be <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subsets</a> of a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $X$.
Then
</p>

<div class="math-block">\begin{align*}
A \cap B =&amp; X \setminus (X \setminus A \cup X \setminus B)
\end{align*}</div>
