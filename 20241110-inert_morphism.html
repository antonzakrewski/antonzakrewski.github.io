<span id="ID-1e659ed0-d382-4158-8072-9b153e16b46c"></span><h1 class="title">inert morphism in Fin*</h1>

<h2 id="definition">Definition</h2>
<p>
Given <a href="20241110-category_fin.html#ID-decdce32-a0c7-4acf-9b1c-ffb3fe613e44">category Fin*</a>, a morphism $\alpha: \{*,1,...,n\} \rightarrow \{*,1,...,m\}$ is said to be inert, if for $i \in \{1,...,m\}$ the fiber $\alpha^{-1}[ \{i\}]$ has exactly one element.
</p>
