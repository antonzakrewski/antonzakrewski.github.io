<span id="ID-98db293d-c933-4d6f-bd2e-15c6764a88ac"></span><h1 class="title">treppenapproximierbare Funktion</h1>

<h2 id="definition">Definition</h2>
<p>
Eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a> $f: [a,b] \rightarrow \mathbb{C}$ ist treppenapproximierbar, falls für alle $\varepsilon &gt; 0$ eine <a href="20220819232744-treppenfunktion.html#ID-44a46263-b27e-4186-86da-d7a82b58b01b">Treppenfunktion</a> $\tau: [a,b] \rightarrow \mathbb{C}$ existiert mit
</p>

<div class="math-block">\begin{align*}
\| f - \tau \|_{[a,b]} &lt; \varepsilon
\end{align*}</div>
