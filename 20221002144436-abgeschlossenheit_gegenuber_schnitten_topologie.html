<span id="ID-12083782-9ff4-46b9-9b75-6be9b008d6cb"></span><h1 class="title">Openness of a finite intersection of open sets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $\mathcal{T}$ a <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">topology</a> on $X$.
Then for <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> amount of <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> $A_1,...,A_n$, the <a href="20230317161158-allgemeiner_schnitt.html#ID-d7547939-8d3f-48f8-b2fd-cfb5734ae78f">intersection</a>
</p>

<div class="math-block">\begin{align*}
\bigcap_{i = 1}^{n} A_i 
\end{align*}</div>
<p>
is <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a>
</p>
