<span id="ID-8ed8338a-9628-48b3-83b2-27f8fa0c6738"></span><h1 class="title">multiplicative unit is self-adjoint</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20261019-nonunital_star_algebra.html#ID-0e4fad4a-8cf9-4d8a-965a-59c8a1c5171d">unital star algebra</a>, then $1^* = 1$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from
</p>

<div class="math-block">\begin{align*}
1 =&amp; (1^*)^* \\
=&amp; (1 \cdot 1^*)^* \\
=&amp; 1 \cdot 1^* \\
=&amp; 1^*
\end{align*}</div>


</div>
