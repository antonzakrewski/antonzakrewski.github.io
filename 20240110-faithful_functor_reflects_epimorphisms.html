<span id="ID-24e62465-028f-4d68-b96d-af08f3cf0832"></span><h1 class="title">faithful functor reflects epimorphisms</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a>, $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20230301211921-treuer_funktor.html#ID-28e54961-a758-4c55-ba93-95268bcebd92">faithful</a> <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $\mathcal{F}$ <a href="20240110-functor_reflecting_epimorphisms.html#ID-0d887999-d79f-4b6b-8615-5c8f41fabfb7">reflects epimorphisms</a>
</p>

<h2 id="proof">Proof</h2>
<p>
is dual to <a href="20240110-functor_reflecting_epimorphisms.html#ID-0d887999-d79f-4b6b-8615-5c8f41fabfb7">reflects epimorphisms</a>
</p>
