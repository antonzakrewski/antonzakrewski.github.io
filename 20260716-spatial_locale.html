<span id="ID-5aaa4dc6-8bb9-4477-b7b9-0821d3ae2914"></span><h1 class="title">spatial locale</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{O}$ be a <a href="20260715-locale.html#ID-758e2296-be31-4618-b3cd-41648ba57953">locale</a>.
Then $\mathcal{O}$ is said to be spatial, if it is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> to $\mathrm{Open}(X)$ for some <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $X$ and the <a href="20260715-open_subset_functor_from_locales_to_topological_spaces.html#ID-af8a8c9e-5d0d-4daf-bd56-b94f503b8a2e">open subset functor from topological spaces to locales</a>.
</p>
