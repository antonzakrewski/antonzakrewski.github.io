<span id="ID-8f84dd15-dfc0-4d81-92bb-4dcd4d426fd5"></span><h1 class="title">Dedekindsche Schnittaxiom</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X,&lt;)$ eine <a href="20221010083632-totalordnung.html#ID-30e940f3-5f30-43e3-acda-3066e8c7e2fd">totalgeordnete</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>.
Dann erfüllt $X$ das Schnittaxiom, falls für eine <a href="20211230201833-partition_mengenlehre.html#ID-8c4522dc-7da5-40f7-9ba7-54cc0e1a60a9">Partition</a> $A \sqcup B$ mit $A &lt; B$ (siehe: <a href="20230518104626-vergleich_von_mengen.html#ID-fb96e575-caa0-4771-bf7e-61107246a558">Vergleich von Mengen</a>) jeweils ein <a href="20220718133117-supremum.html#ID-0694ad6d-ce06-4c52-9f5c-29b040425dd1">Supremum</a> bzw. <a href="20220718133120-infimum.html#ID-46cb173e-d119-4d6f-82b5-f27511bb0081">Infimum</a> existiert, so dass gilt
</p>

<div class="math-block">\begin{align*}
\sup A = \inf B
\end{align*}</div>
