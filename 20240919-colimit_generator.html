<span id="ID-be9c2a1f-f0b0-4394-9207-1aa535ca3a63"></span><h1 class="title">colimit-dense</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>
Then a <a href="20220824221623-unterkategorie.html#ID-2165c92b-8025-4134-b3b1-4d523a8795a4">subcategory</a> $G$ is said to be colimit-dense, if $\mathcal{C}$ is the smallest subcategory of $\mathcal{C}$ which contains all <a href="20230725-colimit.html#ID-581b1561-25d0-479a-b0cc-063c894e10be">colimits</a> formed through $G$
</p>
