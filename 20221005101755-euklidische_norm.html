<span id="ID-107b378e-c334-4bf8-baac-e136e1b65198"></span><h1 class="title">Euklidische Norm</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\mathbb{R}^n$ mit $n \in \mathbb{N}^+$ ein <a href="20221003093842-euklidischer_vektorraum.html#ID-1296acb5-82e7-4065-bfdf-ed44cd6708d4">Euklidischer Vektorraum</a>  und $\vec{v} \in \mathbb{R}^n$ ein <a href="20210217215228-vektor.html#ID-be50263b-d29c-41c5-9909-2f5e106dc49c">Vektor</a>.
Die Euklidische Norm für den <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a> ist folgendermaßen definiert:
</p>

<div class="math-block">\begin{align*}
\| \vec{v} \| = \sqrt{\sum_{i=1}^n v_i}
\end{align*}</div>
