<span id="ID-3af1755d-4028-4026-aa17-9c35180794b6"></span><h1 class="title">standard open is compact</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, then any <a href="20230826-standard_opens_of_the_zariski_topology.html#ID-465fb301-6138-44f2-8852-5e40e6b52b4d">standard open</a> is compact.
</p>

<h2 id="proof">Proof</h2>
<p>
Let $D(F) \subseteq \bigcup_{i} D(G_i)$, then $\mathrm{Spec}(R) \setminus \bigcup D(g_i) = \bigcap_{i} V(g_i) = V(\bigcup g_i ) \subseteq \mathrm{Spec}(R) \setminus D(f) = V(f)$ .
</p>
