<span id="ID-a94cf458-ff7d-42ec-88e4-4d59b600ed45"></span><h1 class="title">exponentiable morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> admitting <a href="20231018-finite_limit.html#ID-265414ac-0939-4106-ad91-4f3da00bd5bb">finite limits</a>.
Then a morphism $f: x \rightarrow y$ is said to be exponentiable, if the pullback functor
</p>

<div class="math-block">\begin{align*}
f^*: \mathcal{C}_{/y} \rightarrow \mathcal{C}_{/x}
\end{align*}</div>
<p>
admits a <a href="20241017-infinity_right_adjoint.html#ID-1ed94fd7-42a4-4328-a280-17e516d76e3d">right adjoint.</a>
</p>
