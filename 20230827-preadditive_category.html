<span id="ID-119377f5-8122-4d8e-8805-df30859be0ac"></span><h1 class="title">preadditive 1-category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-ab_enriched_category.html#ID-464e7983-8d86-4a83-b915-f926efada6c8">Ab-enriched</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{A}$ is said to be a preadditive category, if there exists a <a href="20220825145511-terminales_objekt.html#ID-16825b5e-51d8-4e5e-ac19-2a05cd9fb110">terminal object</a>
</p>

</p>
