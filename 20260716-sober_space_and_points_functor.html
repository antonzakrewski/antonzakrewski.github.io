<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$X$ is a <a href="20240904-sober_space.html#ID-66f7c45a-ac23-4abb-8f79-585dc3eb1cd6">sober space</a>, i.e. every <a href="20230226044934-irreduzibler_topologischer_raum.html#ID-2c6c8d23-0c2a-4989-afcc-34a0c34d4f36">irreducible</a> <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a> subset is the <a href="20230222175426-abschluss_in_einer_topologie.html#ID-9134c61c-5ec6-4cd6-8928-9ef53b6bfd37">closure</a>  of exactly one point.</li>

<li>$X$ is in the <a href="20240916-essential_image_of_a_functor.html#ID-21fdb2f0-df36-45a3-9da7-55fd74a0ead4">essential image</a> of the <a href="20260715-points_functor_from_locales_to_topological_spaces.html#ID-9f757f71-75a9-4946-9915-2bb9ab7fdf4d">points functor</a> </li>
</ol>
