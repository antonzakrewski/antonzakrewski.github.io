<span id="ID-b3565697-366d-42a6-90b3-71d332ba2e15"></span><h1 class="title">endlich erzeugte algebraische Körpererweiterung gegeben durch Polynomring</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a>, $L/K$ eine <a href="20230722-algebraische_korpererweiterung.html#ID-434e42fe-1036-44f2-86e7-9dd391760e46">algebraische</a>, durch $\alpha_1,...,\alpha_n \in L$ <a href="20230603-finitely_generated_field_extension.html#ID-4edd400f-5351-412a-8536-401e6eeeeaa9">endlich erzeugte</a> <a href="20230603-field_extension.html#ID-afbdca38-90b9-4db1-9d10-cfd826cbfac6">Körpererweiterung</a>.
Dann gilt
</p>

<div class="math-block">\begin{align*}
K(\alpha_1,...,\alpha_n) \cong K[X_i]/(X_i - \alpha_i)
\end{align*}</div>
