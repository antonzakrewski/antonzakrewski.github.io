<span id="ID-e71ac600-ad5f-44ee-ba6c-618ba9caa708"></span><h1 class="title">homotopy sphere</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(M\) be a \(n\)-dimensional <a href="20221113224914-mannigfaltigkeit.html#ID-635e5ff5-f006-46bf-891a-869ae972d6e6">manifold</a>.
Then $M$ is said to be a Homotopy sphere, if it is <a href="20231107-homotopy_equivalent_spaces.html#ID-fd6255f6-c435-4901-9aee-e640e09f73a3">homotopy equivalent</a> to the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">n-sphere</a>
</p>
