<span id="ID-3eceb341-8b26-4666-9700-08cf4470aa8d"></span><h1 class="title">telescope of a self-map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: \Sigma^n X \rightarrow X$ be a <a href="20260918-self_map.html#ID-829c5144-ab74-419e-be25-3239105bec0a">self-map</a> in a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a> with <a href="20231105-sequential_colimit.html#ID-16ff2225-6ea8-421d-83cc-f3f3cd9832ef">sequential colimits</a>.
Then the telescope is defined as colimit
</p>

<div class="math-block">\begin{align*}
f^{-1} X = \mathrm{colim} (\Sigma^n X \rightarrow X \rightarrow \Sigma^{-n} X \rightarrow ...)
\end{align*}</div>
