<span id="ID-ec552ebe-4f09-493a-9dc5-36479107488c"></span><h1 class="title">ring map of finite presentation induces finitely presented cotangent module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\varphi: R \rightarrow S$ be a <a href="20260721-ring_map_of_finite_presentation.html#ID-4cc00c0e-391f-42bc-94b8-84826f8f3503">ring map of finite presentation</a>.
Then the <a href="20260807-cotangent_module.html#ID-ddb9f41c-9c58-4373-aa03-b42b3a5483fe">cotangent module</a> $\Omega_{S/R}$ is also <a href="20230801-finitely_presented_module.html#ID-7ccb4638-bc9e-414e-a304-75a46e1f34f5">finitely presented module</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20260807-presentation_of_the_cotangent_module.html#ID-9aa2ccd0-570f-45b0-87bd-b34ccd989939">presentation of the cotangent module</a> </li>
</ul>
