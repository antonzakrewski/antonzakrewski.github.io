<span id="ID-014c89b7-f805-4089-9a40-feda0b212599"></span><h1 class="title">abelian group as solvable group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $G$ is <a href="20230808-solvable_group.html#ID-f168e64c-10ea-4dde-b86a-75dfc1e0e190">solvable</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Follows from
</p>

<div class="math-block">\begin{align*}
0 = G_0 \trianglelefteq G_n = G
\end{align*}</div>
<p>
where
</p>

<div class="math-block">\begin{align*}
G/0 \cong G
\end{align*}</div>
<p>
is abelian
</p>


</div>
