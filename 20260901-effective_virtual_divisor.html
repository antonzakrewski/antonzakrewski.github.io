<span id="ID-744338eb-260b-4f49-85c3-827c8a87ebc3"></span><h1 class="title">effective virtual divisor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a>.
Then an effective virtual divisor on $X$ is an element in $\mathrm{Line}_{\mathcal{O}(X)}$.
