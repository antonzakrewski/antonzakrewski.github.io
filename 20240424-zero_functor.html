<span id="ID-9cc1dedc-d8c3-4694-9315-85abdc896d49"></span><h1 class="title">zero functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20231215-pointed_category.html#ID-0783589b-3d52-46d9-a7ad-fb1c3130a223">pointed</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $\mathcal{D}$ another category.
Then the zero functor is defined as <a href="20220830195220-constant_functor.html#ID-4ff6affe-14a3-4ed7-a0e3-1837838e8409">constant functor</a>
</p>

<div class="math-block">\begin{align*}
\Delta 0: \mathcal{D} \rightarrow&amp; \mathcal{C} \\
D \mapsto&amp; 0 \\
(f: D \rightarrow D') \mapsto&amp; \mathrm{id}_{0} 
\end{align*}</div>
