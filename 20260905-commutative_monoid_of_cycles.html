<span id="ID-6999d535-a1ee-486c-84dd-e57d94739a2d"></span><h1 class="title">commutative monoid of cycles</h1>

<h2 id="definition">Definition</h2>
<p>
Let $T$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $A$ a <a href="20230722-kommutativer_monoid.html#ID-ccce1563-27e5-4b33-bbf8-255cccb94f44">commutative monoid</a>
Then the set of <a href="20260905-cycle_in_a_topological_space.html#ID-2e7b110f-9636-41e0-9121-ca89b15f6adf">cycles</a> $Z^*(T,A)$ has a <a href="20230722-kommutativer_monoid.html#ID-ccce1563-27e5-4b33-bbf8-255cccb94f44">commutative monoid</a> structure
</p>


<h2 id="remark">Remark</h2>
<p>
the addition of cycles is well-defiend, since we may intersect the neighborhoods for the locally finiteness condition.
</p>
