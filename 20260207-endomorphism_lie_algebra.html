<span id="ID-40287403-5e8c-4e94-bc1c-3e4b81ab0bbc"></span><h1 class="title">endomorphism lie algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $V$ be a <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a>, then the <a href="20240527-endomorphism_ring_in_an_abelian_category.html#ID-d5b502e2-b507-4fdd-a13c-539ee9b97d50">endomorphism ring</a> admits a  canonical <a href="20240331-lie_algebra.html#ID-60d606d5-b143-4a52-932b-9cc88b7d512b">Lie-Algebra</a> structure induced by the multiplication.
see: <a href="20260207-k_algebra_admits_lie_algebra.html#ID-b553f464-30a2-4d39-a135-46ae858df2c2">K-Algebra admits Lie Algebra</a>
</p>
