<span id="ID-63b5903d-a2d3-42fc-81ce-313bcce37c70"></span><h1 class="title">G-equivalence of categories</h1>

<h2 id="definition">Definition</h2>
<p>
A category $\mathcal{C}$ satisfies the G-property, if for any <a href="20231118-equivalence_of_categories.html#ID-9f984af9-949c-46b1-9221-7ba43cdae897">equivalence</a> $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{C}$ there exists a <a href="20230404122456-natural_isomorphism.html#ID-0977f626-bc15-4197-93bd-092d014c8270">natural isomorphism</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{id}_{\mathcal{C}} \cong \mathcal{F}
\end{align*}</div>
