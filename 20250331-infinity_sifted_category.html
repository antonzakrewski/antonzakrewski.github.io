<span id="ID-f99f340b-24a9-48b5-9210-11517bb128af"></span><h1 class="title">infinity sifted category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then $X$ is said to be \(\infty\)-sifted, if the <a href="20231229-diagonal_morphism.html#ID-7cb52460-29ae-4b75-9d8f-3b991c740063">diagonal morphism</a>
</p>

<div class="math-block">\begin{align*}
X \rightarrow X \times X
\end{align*}</div>
<p>
is <a href="20241017-cofinal_infinity_category.html#ID-7a01e020-1d0a-43b7-8a3a-37160eb9939d">cofinal</a>
</p>
