<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240225-scheme_over_some_scheme.html#ID-e29e7ce1-c73a-4a64-b900-98e7608f0465">schemes over</a> a another <a href="20230826-scheme.html#ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12">scheme</a> $S$.
Then the <a href="20230915-fibred_product_of_schemes.html#ID-d807243c-6865-4e38-8fd6-4f0281733b2a">fibred product of schemes</a> exists and is unique up to unique <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
