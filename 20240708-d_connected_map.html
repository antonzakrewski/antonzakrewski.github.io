<span id="ID-b5746a29-4c15-4b74-aae6-b5482569e0f1"></span><h1 class="title">n-connected map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> between <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
Then $f$ is said to be \(d\)-connected, if the <a href="20240702-homotopy_fibre.html#ID-54aeb20a-4a90-4f8e-b8f2-6110f73fe306">homotopy fibre</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{hofib}_y(f)
\end{align*}</div>
<p>
is \(d-1\)-<a href="20240708-d_connected_space.html#ID-71a7e289-8de9-43d0-a4de-f14bc4e84ae2">connected</a> for $y \in Y$
</p>
