<span id="ID-27615d67-b532-4a0c-8466-66ea0b2d52bb"></span><h1 class="title">length of a poset</h1>

<h2 id="definition">Definition</h2>
<p>
Let $P$ be a <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">partially ordered</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>
Then the length of $P$ is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{length}(P) = \mathrm{sup} \{n \in \mathbb{N} \vert \textrm{ exists a chain } x_0 \not\leq ... \not\leq x_n\} \in \mathbb{N} \cup \{\pm \infty\}
\end{align*}</div>
