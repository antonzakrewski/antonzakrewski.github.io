<span id="ID-9182da3b-5ef2-45e9-8d41-07371ed455ae"></span><h1 class="title">adjoint exterior derivative is adjoint</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20230907-riemannsche_mannigfaltigkeit.html#ID-765d4b7e-1edf-43c9-999a-9313ac3d8c76">riemannian manifold</a> without boundary and $\alpha \in \Omega^k(M), \beta \in \Omega^{k-1}(M)$.
Then
</p>

<div class="math-block">\begin{align*}
\left(\mathrm{d} \beta, \alpha\right) = (\beta , \mathrm{d}^{\dagger} \alpha)
\end{align*}</div>
