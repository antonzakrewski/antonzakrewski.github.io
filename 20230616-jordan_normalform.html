<span id="ID-11cb2029-895b-4516-a321-37d302675feb"></span><h1 class="title">Jordan-Normalform</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V \cong K^{n \times n}$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> über einem <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> $K$.
Dann ist eine Jordan-Normalform eine <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">Matrix</a>
</p>

<div class="math-block">\begin{align*}
\begin{pmatrix}
 J_1 &amp; &amp; \\
&amp; \ddots &amp; \\
 &amp; &amp; J_n  \\
 \end{pmatrix} 
\end{align*}</div>
<p>
welche aus <a href="20230616-jordanblock.html#ID-2e7d45d8-6ab4-4e1a-80b6-1af69fc7808c">Jordanblöcken</a> besteht
</p>
