<span id="ID-d4ab4c04-fb05-4ee9-a6d1-f04df776d54f"></span><h1 class="title">Stetigkeit einer Kontraktion</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $M$ ein <a href="20230224123147-semimetrischer_raum.html#ID-e2594bf0-67cb-4d50-a605-39627074bcd2">semimetrischer Raum</a> und $f: M \rightarrow M$ eine <a href="20230224182235-kontraktion.html#ID-51a3c508-415d-48a3-aab7-199035efc584">Kontraktion</a>.
Dann ist $f$ <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">stetig</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
Nach annahme ist $f$ <a href="20221125175541-lipschitzstetig.html#ID-53d30a09-5724-4c59-9495-2ffa2f053707">lipschitzstetig</a> und damit auch nach der <a href="20221222102607-lipschitzstetigkeit_als_verscharfte_bedingung.html#ID-c43f5ba6-aaf7-4fc0-9e9f-b489e0056a79">Lipschitzstetigkeit als verschärfte Bedingung</a> <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">stetig</a>
</p>
