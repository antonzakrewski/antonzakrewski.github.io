<span id="ID-cc470ff6-e532-4565-834d-ca64b04efd7d"></span><h1 class="title">boundary of a standard simplex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\Delta^n$ be the <a href="20240128-represented_simplicial_set.html#ID-ecbc7b48-4158-40fc-8130-b3e8183a17e9">standard n-simplex</a>.
Then the boundary is defined as sub <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a> $\partial \Delta^n \subseteq \Delta^n$ where
</p>

<div class="math-block">\begin{align*}
(\partial \Delta^n)_k = \{f \in (\Delta^n)_k \vert f \text{non surjective}\}
\end{align*}</div>
