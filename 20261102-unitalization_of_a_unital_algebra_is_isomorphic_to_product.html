<span id="ID-864d03c3-6c39-4007-b981-07316fb746a4"></span><h1 class="title">unitalization of a unital algebra is isomorphic to products</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a unital $B$ algebra.
then the <a href="20261102-unitalization_functor_of_algebras.html#ID-10841ccf-300f-4bb8-a472-dae648da1553">unitalization</a> $A^u$ is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> to $A \times B$ for the map
</p>

<div class="math-block">\begin{align*}
A^u \rightarrow&amp; A \times B \\
(a,\lambda) \mapsto (a + \lambda, \lambda)
\end{align*}</div>
