<span id="ID-a51934e2-95f9-4218-a160-49cb6832f2db"></span><h1 class="title">elementary group is nilpotent</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any <a href="20261124-elementary_group.html#ID-95fd1816-85ea-4bb3-bb2a-87ed85162cc6">elementary group</a> is a <a href="20240317-nilpotent_group.html#ID-822a30f5-0ad9-43db-aa27-03b7737ce540">nilpotent group.</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the central extension
</p>

<div class="math-block">\begin{align*}
C \rightarrow C \times P \rightarrow P
\end{align*}</div>
<p>
where $C$ is cyclic  and $P$ is nilpotent.
</p>
