<span id="ID-e4c10be9-3796-4aff-9579-5cc0b5f47e36"></span><h1 class="title">chain complex</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be a <a href="20231215-pointed_category.html#ID-0783589b-3d52-46d9-a7ad-fb1c3130a223">pointed</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>
</p>

<p>
A chain complex is a sequence $(M_n, d_n)$ of $M_n \in \mathrm{Ob}(\mathcal{A})$ and <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> $d_n: M_n \rightarrow M_{n-1}$ such that
</p>

<div class="math-block">\begin{align*}
d_n \circ d_{n+1} = 0
\end{align*}</div>
<p>
is the <a href="20230402144657-zero_morphism.html#ID-6cb7ce09-7038-4581-bc67-91d231a2be10">zero morphism</a>
</p>

</div>
