<span id="ID-fd6cc1bc-ddb9-4923-bb94-a90e44d0669d"></span><h1 class="title">quasi-affine covering of a quasi-projective variety</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a> <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{P}_{K}^n$ the <a href="20230906-projective_space.html#ID-5be9c15d-808c-4350-a0ff-054c31dbc3c4">projective space</a> and $X \subseteq \mathbb{P}_{K}^n$ a <a href="20230907-quasi_projective_variety.html#ID-7b70c39a-5b6f-4604-ad2c-e24b4d98ee60">quasi-projective variety</a>.
Then $X$ is openly <a href="20230227163531-uberdeckung.html#ID-804615a8-2307-4f8e-8f51-f4be70e817b3">covered</a> by <a href="20230906-quasi_affine_variety.html#ID-3ef8df48-4b44-4453-a107-37c89deecacc">quasi-affine varieties</a>
</p>
