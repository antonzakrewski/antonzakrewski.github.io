<span id="ID-79609d15-81cc-487a-a5ae-a8b62204f1fe"></span><h1 class="title">connected graded A-Algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then a $\mathbb{Z}$ <a href="20240528-graded_r_algebra.html#ID-c9a02bbf-f09d-4d7f-88e3-7a37c2f6dc92">graded R-algebra</a> $A$ is said to be connected, if it is <a href="20260514-connected_graded_k_module.html#ID-5a5965d8-ef7a-4ef0-8bdd-6fd6fb6a5f6f">connected as a graded R-module</a>.
</p>
