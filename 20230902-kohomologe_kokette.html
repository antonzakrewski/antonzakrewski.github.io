<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $\varphi, \psi \in Z^n(X,A)$ <a href="20230902-n_kozykel.html#ID-3ac923ed-0635-4769-b730-d6c94485f9d2">n-Kozykel</a> mit Koeffizienten in einem <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> $A$.
Dann heißen $\varphi, \psi$ kohomolog, falls gilt
</p>
