<span id="ID-bdc63c60-e0a4-4491-8718-f6c36b73ce59"></span><h1 class="title">left proper model category</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20240715-model_category.html#ID-a617e6d1-b76b-48fc-99bc-acce1d7da2fa">model category</a> is said to be left proper, if <a href="20230806-pushforward.html#ID-a4141d87-68ee-4337-8f80-997a6d4b4091">pushouts</a> along a <a href="20240704-cofibration.html#ID-ffcc319d-a3e4-4291-bdd1-634cb689792d">cofibration</a> preserve <a href="20240704-weak_equivalence.html#ID-4dbdf0bf-3558-4ea2-9bcb-5e53729c3391">weak equivalences</a>, i.e. for a weak equivalence $A \rightarrow B$ and a cofibration $A \hookrightarrow B$
