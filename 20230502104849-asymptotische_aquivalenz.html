<span id="ID-a6118653-7abc-46c2-a3a3-fba651d272b6"></span><h1 class="title">Asymptotische Äquivalenz</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $f,g$ reelle <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktionen</a> auf einem <a href="20230418124304-beschrankter_metrischer_raum.html#ID-a582443e-422f-45f5-8df6-eed57c5a2366">unbeschränktem</a> <a href="20220401195853-intervall.html#ID-ea9ab8cb-ef38-4c06-bab0-d392820614f3">intervall</a>.
Man definiert dann asympotitische Äquivalenz als folgende <a href="20211227225754-aquivalenzrelation_mengenlehre.html#ID-bf83e0aa-4df1-48a5-b910-2837942bdd19">Äquivalenzrelation</a>:
</p>

<div class="math-block">\begin{align*}
f ~ g \Leftrightarrow \exists h \in o(g) : f = g + h
\end{align*}</div>
