<span id="ID-4d9c9a0a-1c0e-4a9b-83cc-2d08342c47d0"></span><h1 class="title">Positive Definitheit einer Norm</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\| \cdot \|$ eine <a href="20220920053006-norm_eines_vektors.html#ID-445db843-5369-48de-a31f-f1f245833425">Norm</a> auf einem <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a> $V$ mit $x \in V$
Dann gilt
</p>

<div class="math-block">\begin{align*}
\| x \| \geq 0
\end{align*}</div>

<p>
mit gleichheit
</p>

<div class="math-block">\begin{align*}
\| x \| = 0 \Rightarrow x = 0
\end{align*}</div>

</div>
