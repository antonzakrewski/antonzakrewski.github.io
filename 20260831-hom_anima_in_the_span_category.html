<span id="ID-a9bdaa5c-c73e-4232-9bb9-950c7cd73086"></span><h1 class="title">Hom anima in the span category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a a <a href="20250121-finitely_complete_infinity_category.html#ID-e2219f15-fed4-45d5-95d2-c97756caa74c">finitely complete</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $x,Y$ be <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a>.
Then the <a href="20240603-mapping_space_of_objects_in_a_quasi_category.html#ID-b5b60979-1586-4548-b06f-5ceca4b045fa">Hom anima</a> is given by $\mathrm{Hom}_{\mathrm{Span}(\mathcal{C})}(x,y) \simeq \mathcal{C}_{/x \times y}$
</p>
