<span id="ID-a2f92440-01b7-42a5-9529-fad127a7e9ea"></span><h1 class="title">bipartite graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then $G$ is said to be bipartite, if there exist $n,m$ such that $G$ is a <a href="20231206-subgraph.html#ID-191bebce-741d-4771-bd78-eb39c0ef6837">subgraph</a> of the <a href="20250425-complete_bipartit_graph.html#ID-29638e20-8c0c-4100-b503-9184997c33fd">complete bipartite graph</a>
</p>

<p>
equivalently:
there exist $V = A \coprod B$ with $E \subseteq A \times B$
</p>
