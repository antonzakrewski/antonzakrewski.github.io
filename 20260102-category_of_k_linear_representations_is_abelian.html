<span id="ID-b6eb2af5-b3e9-4f63-8c0e-21c1c2f984a8"></span><h1 class="title">category of K-linear representations is abelian</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $K$ a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>.
Then $\mathrm{Fun}(BG, \mathrm{Vect}_K)$ is an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian category</a>
</p>
