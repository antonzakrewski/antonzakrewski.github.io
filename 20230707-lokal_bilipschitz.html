<span id="ID-397a19b6-62f8-4397-acfd-6fdc3c703299"></span><h1 class="title">lokal bilipschitz</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $M,N$ <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrische Räume</a> und $f: M \rightarrow N$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>
Dann ist $f$ lokal bilipschitz, falls für $m \in M$ eine <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebung</a> $U$ existiert, so dass
</p>

<div class="math-block">\begin{align*}
f_{\vert U}: U \rightarrow N
\end{align*}</div>
<p>
eine <a href="20230629-bilipschitz_einbettung.html#ID-e0799ba2-3850-4924-825c-33c63522133b">Bilipschitz-Einbettung</a> ist.
</p>
