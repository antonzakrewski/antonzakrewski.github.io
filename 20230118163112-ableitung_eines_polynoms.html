<span id="ID-636a714b-f2d9-4b8f-8aac-2501ae7193f7"></span><h1 class="title">Ableitung eines Polynoms</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $f \in \mathbb{C}[X]$ ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a> mit $f(x) =&amp; \sum_{i=0}^{n} a_i x^i$
Dann ist die <a href="20230118224205-ableitung.html#ID-162033bf-f6b9-49d6-a75b-07c444a70de4">Ableitungsfunktion</a>
</p>

<div class="math-block">\begin{align*}
f'(x) = \sum_{i=0}^{n-1} a_{i+1} x^i
\end{align*}</div>

<h2 id="beweis">Beweis</h2>
<p>
Folgt aus der <a href="20230119183134-ableitung_einer_potenz.html#ID-2ea2a6d0-cff0-4c5b-ac8b-f409de650fc8">Ableitung einer Potenz</a>, der <a href="20221015041614-ableitung_der_summe_zweier_funktionen.html#ID-1f316f3f-fc1f-431b-afd1-0a60c8cc29ed">Summenregel</a> und der <a href="20230118171223-faktorregel.html#ID-e0391322-9748-4256-9faa-9b65bcad4e76">Faktorregel</a>
</p>
