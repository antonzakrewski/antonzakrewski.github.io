<span id="ID-1fde65e5-8a99-4ac4-81e7-cca4d1c11671"></span><h1 class="title">alexander duality</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $S^n$ be the <a href="20230413003915-einheitssphare.html#ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee">n-sphere</a> and $K \subsetneq S^n$ a <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nonempty</a>, <a href="20230412003456-compact_set.html#ID-d09ae6d2-2b5c-41c1-a54d-3259d3e2f0f0">compact</a> <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a>.
Then there exists a nisomorphism
</p>

<div class="math-block">\begin{align*}
\mathrm{colim}_{U \supseteq K, \textrm{ open nbhd}} \tilde{H}^p(U) \simeq H_{n-p-1}(S^n \setminus K)
\end{align*}</div>
