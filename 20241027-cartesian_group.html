<h2 id="definition">Definition</h2>
<p>
Let $X: \Delta^{\mathrm{op}} \rightarrow \mathcal{C}$ be a <a href="20241027-cartesian_monoid.html#ID-1a201d8e-aa63-47d6-93c9-f81f58d7a66b">cartesian Monoid</a> in an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>
Then $X$ is said to be a cartesian group, if the map
</p>

(\mathrm{pr}_1, \mu): X_1 \times X_1 \rightarrow X_1 \times X_1
