<span id="ID-648f647b-3a4a-4378-b284-d8e6068d4b51"></span><h1 class="title">Mächtigkeit der Menge an Permutationen</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $P$ die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>  aller möglichen <a href="20220928140441-permutation.html#ID-01de1cf3-b2f6-4908-a06a-1e9479c0f756">Permutationen</a> einer \(n\)-Menge.
Die <a href="20211227215415-machtigkeit_menge.html#ID-a53ec5a2-0adb-4575-bf21-e3ac15eff75f">Mächtigkeit</a> von $P$ ist dann $n!$
</p>

<div class="math-block">\begin{align*}
\vert P \vert = n!
\end{align*}</div>
