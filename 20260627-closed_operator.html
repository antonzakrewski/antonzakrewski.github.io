<span id="ID-9067ea74-aa79-46aa-9aad-66bf0daef35a"></span><h1 class="title">closed operator</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector spaces</a> and $T: \mathrm{dom}(T) \rightarrow Y$ a <a href="20221119162741-vektorraumhomomorphismus.html#ID-863f0f55-054c-413e-9cf4-2c2704ea5b14">linear map</a> for $\mathrm{dom}(T) \subseteq X$
Then $T$ is said to be a closed operator if the <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a> $\mathrm{graph}(T) \subseteq X \times Y$ is a <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a> subspace.
</p>
