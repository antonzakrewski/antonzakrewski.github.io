<span id="ID-44858c7c-4b2c-4572-9ac9-c9e76a03f071"></span><h1 class="title">noetherian module as finitely generated module</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $M$ a <a href="20230726-noetherian_module.html#ID-a82bdcd4-bd89-4a2f-bf15-91a32a4bfd82">noetherian module</a> over $R$.
Then $M$ is a <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated module</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from taking the trivial <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodule</a> $M \subseteq M$
</p>
