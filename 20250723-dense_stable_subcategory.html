<span id="ID-bd3ae10e-23f2-4f45-910d-7b8c089eb8e1"></span><h1 class="title">dense stable subcategory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}_0 \subseteq \mathcal{C}$ be a <a href="20241023-stable_subcategory.html#ID-bfd1a6f2-74c1-4474-a8d1-786c0b4ac46a">stable subcategory</a>
