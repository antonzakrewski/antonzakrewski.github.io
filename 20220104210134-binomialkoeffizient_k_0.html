<span id="ID-f82e2b95-1e1d-48a0-84f0-bf99bf5a2a22"></span><h1 class="title">Binomialkoeffizient - k = 0</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\binom{n}{0} = 1
\end{align*}</div>

<h2 id="herleitung">Herleitung</h2>

<div class="math-block">\begin{align*}
\binom{n}{0} = \prod_{j=1}^{0} \frac{n-j+1}{j} = 1
\end{align*}</div>

<h3 id="handubliche-formel">Handübliche Formel</h3>

<div class="math-block">\begin{align*}
\frac{n!}{0! \cdot (n-0)!} = 1
\end{align*}</div>
