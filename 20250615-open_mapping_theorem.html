<span id="ID-adedd22a-295a-4aa0-8379-32eb74ee8501"></span><h1 class="title">open mapping theorem for holomorphic functions</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: \Omega \rightarrow \mathbb{C}$ be a <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic function</a> where $\Omega \subseteq \mathbb{C}$ is <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> and <a href="20230118223336-zusammenhangender_raum.html#ID-bcc53507-bc5a-46d4-bd83-53e504f62b9d">connected</a>.
Then $f$ is either
</p>
<ol>
<li>constant</li>
</ol>
<p>
or
</p>
<ol>
<li>an <a href="20230227190111-offene_abbildung_topologie.html#ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52">open map</a> </li>
</ol>
<h2 id="proof">Proof</h2>
<p>
assume that $f$ is not constant.t
