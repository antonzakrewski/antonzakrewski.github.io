<span id="ID-a37e00db-c7c4-4ac3-99d5-20fa3bdcafff"></span><h1 class="title">stable homotopy group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,x)$ be a <a href="20240702-well_pointed_space.html#ID-9809f18d-8211-410f-81f2-4ecf4f0f02ab">well pointed space</a>
Then the \(k\)-th stable homotopy group is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{colim}( \pi_k(X,x) \rightarrow \pi_{k+1}(\Sigma X,x)
\end{align*}</div>
<p>
for the <a href="20240718-reduced_suspension.html#ID-bf34b977-e946-4d18-9a05-470e5dd1ae20">reduced suspension</a>
</p>
