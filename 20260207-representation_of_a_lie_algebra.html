<span id="ID-4631f4c4-ea6e-49f0-bf3f-b8f5b49465b3"></span><h1 class="title">representation of a lie algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathfrak{g}$ be a <a href="20240331-lie_algebra.html#ID-60d606d5-b143-4a52-932b-9cc88b7d512b">Lie-Algebra</a> and $V$ a <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> over a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> $K$.
Then a representation is a <a href="20251113-lie_algebra_homomorphism.html#ID-643d2138-554f-41c0-9dd8-9ec3f3972bf9">lie algebra homomorphism</a>
</p>

<div class="math-block">\begin{align*}
\mathfrak{g} \rightarrow \mathrm{End}(V)
\end{align*}</div>

<p>
cf. <a href="20260207-endomorphism_lie_algebra.html#ID-40287403-5e8c-4e94-bc1c-3e4b81ab0bbc">endomorphism lie algebra</a>
</p>
