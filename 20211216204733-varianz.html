<span id="ID-9eaf3916-528b-4578-befd-2a1ca3841eb4"></span><h1 class="title">Varianz</h1>

<h2 id="definition">Definition</h2>
<p>
Für eine <a href="20211123085211-zufallsgroßen.html#ID-5a6cdfb1-52fb-424c-b4ca-8ab53eccfcf7">Zufallsgröße</a> mit <a href="20211216204418-erwartungswert.html#ID-121a95a8-4927-4d4b-b56d-884f605d62f3">Erwartungswert</a> $\mu$ ist die Varianz folgendermaßen definiert:
</p>


<div class="math-block">\begin{align*}
Var(X)  \coloneqq \sum_{i=1}^n (x_i - \mu)^2 \cdot P(X=x_i)
\end{align*}</div>
<p>
<a href="20220820160448-bedeutung_varianz.html#ID-3d7c7620-59d9-4249-a932-a2bccee5bfd2">Bedeutung: Varianz</a>
</p>
