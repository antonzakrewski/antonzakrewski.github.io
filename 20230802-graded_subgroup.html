<span id="ID-c186f9e1-c47e-4e9d-94a3-6a94a89fb2a6"></span><h1 class="title">graded subgroup</h1>

<h2 id="definiiton">Definiiton</h2>
<p>
Let $G \cong \bigoplus_{n \in \mathbb{Z}}$ be a <a href="20230802-graded_abelian_group.html#ID-eecddf79-d0b0-46c2-97d1-c0bb591c468b">graded</a> <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $A \subseteq G$ a <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a>.
Then $A$ is a graded subgroup, if $A$ is itself <a href="20230802-graded_abelian_group.html#ID-eecddf79-d0b0-46c2-97d1-c0bb591c468b">graded</a> $A \cong \bioplus_{n \in \mathbb{Z} } A_n$ and $A_n \subseteq C_n$ for $n \in \mathbb{Z}$
</p>
