<span id="ID-46affecb-3a32-4157-8e9e-14732642bb6b"></span><h1 class="title">finite polynomial ring over a field as noetherian ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $K[X_1,...,X_n]$ the <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a> in finite variables.
Then $K[X_1,...,X_n]$ is a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian</a> ring
</p>
