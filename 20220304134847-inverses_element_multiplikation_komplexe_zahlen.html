<span id="ID-9d0f8387-7b4a-46cb-9151-efea8bd0214f"></span><h1 class="title">Inverses Element - Multiplikation (komplexe Zahlen)</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $z = a + b \mathrm{i}$ eine <a href="20210702104546-komplexe_zahlen.html#ID-ca121ea4-6b83-47aa-a6f1-31a6e0d0667d">komplexe Zahl</a> ungleich $0$
Dann ist das <a href="20211218210712-inverses_element.html#ID-f9edb7bd-9975-4606-9f12-698118b3d992">Inverses Element</a> für $z$
</p>

<div class="math-block">\begin{align*}
\frac{a -  b \mathrm{i}}{a^2 + b^2}
\end{align*}</div>
