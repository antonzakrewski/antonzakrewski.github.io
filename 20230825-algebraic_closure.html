<span id="ID-764140fd-a4fc-4df7-a27e-a4373da7a514"></span><h1 class="title">algebraic closure</h1>

<h2 id="definition">Definition</h2>
<p>
Let $F$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $L/K$ a <a href="20230603-field_extension.html#ID-afbdca38-90b9-4db1-9d10-cfd826cbfac6">field extension</a>.
Then $L$ is said to be an algebraic closure, if $L$ is an <a href="20221017154133-algebraischer_abschluss.html#ID-ec785259-c20d-4d7a-af35-a0904d20d7b6">algebraically closed</a>, <a href="20230722-algebraische_korpererweiterung.html#ID-434e42fe-1036-44f2-86e7-9dd391760e46">algebraic field extension</a>
</p>
