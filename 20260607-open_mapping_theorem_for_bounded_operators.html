<span id="ID-92cecffe-d54a-4511-b4af-aa99b559de27"></span><h1 class="title">open mapping theorem for bounded operators on banach spaces</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20221124132702-banachraum.html#ID-43ef125e-d9bb-454f-9427-4d3d8426893a">banach spaces</a> and $T: X \rightarrow Y$ be a <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjective</a> <a href="20260509-bounded_operator.html#ID-c9aa0020-0a75-4250-9116-0d18e171bb90">bounded operator</a>.
Then $T$ is an <a href="20230227190111-offene_abbildung_topologie.html#ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52">open map</a>
