<span id="ID-46431534-3a37-498b-8af5-89eb247ed3f6"></span><h1 class="title">suspension spectrum of a finite cw complex is a finite spectrum</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20250618-suspension_spectrum.html#ID-1c33c4d1-9d66-4484-8634-ec10239353a1">suspension spectrum</a> of a <a href="20250319-finite_anima.html#ID-30921a08-94d0-49f1-86b3-c034afbee61a">finite anima</a> is a <a href="20250614-finite_spectrum.html#ID-a2a400a0-1f79-4abc-b8a1-6fde43764a91">finite spectrum</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows as the <a href="20250618-suspension_spectrum.html#ID-1c33c4d1-9d66-4484-8634-ec10239353a1">suspension spectrum</a> <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a> <a href="20241017-infinity_functor_preserving_colimits_of_a_shape.html#ID-896858bc-5a83-4c8f-94bf-8c2250524596">preserves</a> <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimits</a>.
</p>
