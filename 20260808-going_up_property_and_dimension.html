<span id="ID-65372e20-c68f-48b3-a49a-ab75dbe0122a"></span><h1 class="title">going-up property and dimension</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: Y \rightarrow X$ be a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> of <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>, which has the <a href="20260807-going_up_property_of_topological_spaces.html#ID-e2f41732-b263-4cdb-b079-6a4cc5f500da">going up property</a>.
Then $\mathrm{dim}(Y) \geq \mathrm{dim}(X)$.
</p>
