<span id="ID-73704274-a414-4801-b581-e1520544f1b8"></span><h1 class="title">diffeomorphism for Manifolds</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M,N$ be $\mathcal{C}^k$ <a href="20230905-differentiable_manifold.html#ID-ba8bdca8-4840-4256-a470-293790ae1aca">differentiable manifold</a>.
A <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $f: M \rightarrow N$ is said to be a diffeomorphism, if
</p>
<ol>
<li>$f$ is <a href="20211230211412-bijektivitat.html#ID-3d1c4c92-bf37-4557-980b-787589b9c3f6">bijective</a></li>

<li>$f$ is <a href="20230903-differenzierbare_funktion_auf_einer_differenzierbaren_mannigfaltigkeit.html#ID-2a55805a-56ac-4559-a06b-7876c0c116c9">differentiable</a> </li>

<li>$f^{-1}$ is also differentiable</li>
</ol>
