<p>
Das komplexe Vektorbündel der \(p,q\)-Formen ist auf einer <a href="20230905-komplex_differenzierbare_mannigfaltigkeit.html#ID-73078df1-9429-41be-af61-85d3e07b5b4e">komplexen Mannigfaltigkeit</a> ist definiert als
</p>

<div class="math-block">\begin{align*}
A^{p,q} \coloneqq (\bigwedge^p A^{1,0} \oplus \bigwedge^q A^{0,1} 
\end{align*}</div>
