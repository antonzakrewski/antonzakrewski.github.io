<span id="ID-9bd44167-ab60-4780-852c-6da67effa13c"></span><h1 class="title">separating family of seminorms</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a $\mathbb{K}$ <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a>, then a separating family of seminorms is a family of <a href="20230223221746-seminorm.html#ID-4bd6ec86-e434-4b37-9d50-e73ab6b454d4">seminorms</a> $p_i: X \rightarrow \mathbb{K}$ such that for each $x \in X \setminus \{0\}$, there exists an $p_i$ with $p_i(x) &gt; 0$.
</p>
