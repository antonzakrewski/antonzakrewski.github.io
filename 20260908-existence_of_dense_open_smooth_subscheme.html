<span id="ID-6375c963-893a-4d92-b13e-b6570aaedd28"></span><h1 class="title">existence of dense open smooth subscheme over a perfect field</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $k$ be a <a href="20231006-perfect_field.html#ID-c8e0d0aa-513a-4fcd-92f0-8df53355723b">perfect field</a> and $X$ a <a href="20260720-reduced_scheme.html#ID-ab9bd57a-4953-49bd-ac64-684f8430c4ff">reduced k-scheme</a> <a href="20260714-algebraic_functor_locally_of_finite_presentation.html#ID-6f5ba542-2ad9-41e0-9e2b-e89f2032ee4e">locally of finite presentation</a>.
Then there exists a <a href="20221124232157-dichte_menge_topologie.html#ID-921fe319-4945-4303-a9a5-3723804e0737">dense</a>  <a href="20230909-open_subscheme.html#ID-d5d26a4c-5f81-4c3f-9588-11fa4e53330f">open subscheme</a> $U \subseteq X$ which is <a href="20260807-smooth_morphism_between_schemes.html#ID-ff5714e8-e1de-4ca2-8124-411e2989d136">smooth</a> over $k$.
</p>
