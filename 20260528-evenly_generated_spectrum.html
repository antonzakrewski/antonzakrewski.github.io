<span id="ID-27285918-bd45-4c6a-a834-d43e15607d7c"></span><h1 class="title">evenly generated spectrum</h1>

<h2 id="definition">Definition</h2>
<p>
Let $E$ be a <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectrum</a>, then $E$ is said to be evenly generated, if for every map $X \rightarrow E$, where $x$ is a finite spectrum, there exists a factorization $X \rightarrow X' \rightarrow E$ where $X'$ is a (finite) <a href="20260528-even_spectrum.html#ID-f5cc1afb-f2a0-4d11-ab90-abcada2f964f">even spectrum</a>.
</p>
