<span id="ID-cbaf30c1-7bec-4cb0-9179-72441c542c40"></span><h1 class="title">Einheitsball</h1>

<h2 id="definition">Definition</h2>
<p>
Sei ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller Vektorraum</a> $V \neq \{0\}$ gegeben, so ist der Einheitsball $B[0]$ definiert als:
</p>

<div class="math-block">\begin{align*}
B_{r}^{\| \cdot \|}[0]  \coloneqq \{v \in V \vert \| v \| &lt; 1\}
\end{align*}</div>
