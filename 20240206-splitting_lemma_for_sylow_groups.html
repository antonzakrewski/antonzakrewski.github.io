<span id="ID-3913a2b2-5afe-4298-a172-bff9ff6eb969"></span><h1 class="title">splitting lemma for sole sylow groups</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> of <a href="20221225213606-ordnung_gruppe.html#ID-fb68b5de-9a0c-4c45-8ee9-eb232370ed2e">group order</a> $\vert G \vert = \prod p_i^{\nu_i}$ for <a href="20211228193940-primzahl.html#ID-d7857a86-c778-478d-aa48-7e239fcd8076">prime numbers</a> $p_i \in \mathbb{P}$.
Suppose for each $p_i$, there exists a sole <a href="20230722-p_sylow_gruppe.html#ID-6dc01061-42f1-44f1-9c11-b313099f13e2">sylow group</a>.
</p>

<p>
Then
</p>

<div class="math-block">\begin{align*}
G \cong \bigoplus S_{p_i}
\end{align*}</div>
