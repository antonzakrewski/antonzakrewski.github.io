<span id="ID-c566a7ac-8b60-4931-8c77-89ec8b307562"></span><h1 class="title">n coskeleton functor of a simplicial set</h1>

<h2 id="definition">Definition</h2>
<p>
Given <a href="20240128-category_sset.html#ID-e9c2723a-dd7e-48df-84af-05e865106a54">category sSet</a>, the <a href="20230923-simplex_category.html#ID-2952609d-1bab-4ac4-bbd7-1c0814af1314">simplex category</a> $\Delta$ and the <a href="20240415-simplex_category_leq_n.html#ID-8b0fddb4-5920-42ac-bc1b-c04f30bb48d1">n-reduced simplex category</a> $\Delta_{\leq}$.
Then the \(n\)-th coskeleton functor is defined as <a href="20220831221352-rechtsadjungierte.html#ID-9d92e651-1d26-4e9b-a0b9-32a09ca84328">right adjoint</a> to the <a href="20240415-n_skeleton_functor.html#ID-59f99a8f-8e72-46fb-b457-16734c486958">n skeleton functor</a>
</p>
