<span id="ID-d037cb34-4dae-45c6-9796-3c6957b43b80"></span><h1 class="title">degree of a variable</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $R[X_i \vert ]$ the <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a> and $f \in R[X_i]$.
Then the degree of $X_j$ in $f$ is defined as highest exponent of $X_j$ of a <a href="20230905-monomial.html#ID-0c3d60db-952a-4c22-a40e-9b951ec409e7">monomial</a> of $f$
</p>
