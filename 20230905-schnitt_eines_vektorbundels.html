<span id="ID-0be7b63e-b090-4433-8a0a-71656d30dcf9"></span><h1 class="title">section of a vector bundle</h1>

<h2 id="definition">Definition</h2>
<p>
Let $p: E \rightarrow B$ be a <a href="20230905-topological_vector_bundle.html#ID-821f2fea-f858-4555-ae30-90ea23209a2e">topological vector bundle</a>
Then a section is a <a href="20230818-section_presheaf.html#ID-b721bbf8-7d5b-47a4-b6b1-24f9315227c4">section</a>, i.e. a map
</p>

<div class="math-block">\begin{align*}
f: B \rightarrow E
\end{align*}</div>
<p>
such that $p \circ f = \mathrm{id}$
</p>
