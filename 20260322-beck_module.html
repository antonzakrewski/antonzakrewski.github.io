<span id="ID-7cc82b93-20dd-4242-9e78-08ea298834ae"></span><h1 class="title">beck module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> with <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a> and $C$ in $\mathcal{C}$ an <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a>.
Then a beck module over $C$ is an <a href="20241028-cartesian_commutative_group.html#ID-a6ce18f3-18ea-489a-8711-be0adb8dc00e">cartesian commutative Group</a> in the <a href="20240924-infinity_slice_category.html#ID-62e46e6b-dcf7-4ba7-8e8a-92bc1476d165">slice category</a> $\mathcal{C}_{/A}$
</p>
