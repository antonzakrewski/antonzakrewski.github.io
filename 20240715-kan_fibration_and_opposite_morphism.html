<span id="ID-9172755a-8607-4869-941b-f9d7885d24e1"></span><h1 class="title">kan fibration and opposite morphism</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: X \rightarrow Y$ a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>.
<a href="20230509170507-tfae.html#ID-d57bdf4a-ea91-4793-bfd9-931877d57b57">TFAE</a>:
</p>
<ol>
<li>$f$ is a <a href="20240429-kan_fibration.html#ID-1869d74a-d2cf-4e24-bd3a-10bb92fa3a49">kan fibration</a></li>

<li>the <a href="20240715-opposite_morphism_between_simplicial_sets.html#ID-b77abaa1-e067-48fe-9919-d04e9f6bab12">opposite morphism</a> $f^{\mathrm{op}}$ is an inner fibration</li>
</ol>
<h2 id="proof">Proof</h2>
<p>
follows from <a href="20240715-left_fibration_and_opposite_simplicial_set_as_right_fibration.html#ID-d2e858ad-9b5c-4d5d-a358-ce58495d800b">left fibration and opposite map as right fibration</a>
</p>
