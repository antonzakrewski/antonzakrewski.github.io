<span id="ID-9daee6b6-a3b5-401e-8645-8156508c3993"></span><h1 class="title">orthonormal basis in a hilbert space</h1>

<h2 id="definition">Definition</h2>
<p>
An <a href="20230303172849-orthonormale_menge.html#ID-5e5ba861-ae74-444c-a8f9-e7dbf26e9690">orthonormal set</a> $M$ in a <a href="20230521021534-hilbert_space.html#ID-6c70b215-2588-4ecc-9240-f21ab3ec7d81">Hilbert space</a> $\mathcal{H}$ is an orthonormal basis, if the <a href="20230105092749-orthogonales_komplement.html#ID-e1d31ecf-7be2-4812-ba03-7145c5c0dbe8">orthogonal complement</a> $\mathrm{span}(M)^{\bot} = 0$ is trivial.
</p>


<h2 id="remark">Remark</h2>
<p>
It is in general only fake basis
</p>
