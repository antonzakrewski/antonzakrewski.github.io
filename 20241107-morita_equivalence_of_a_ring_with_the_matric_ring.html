<span id="ID-663ff961-32b6-4caf-bcfe-c1f8a158c888"></span><h1 class="title">morita equivalence of a ring with the matrix ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, then $R$ is <a href="20240210-morita_equivalence.html#ID-571462f5-987c-4b28-9cbb-d7d0ad581c5d">morita equivalent</a> to the <a href="20230118133348-matrizenring.html#ID-f544f56c-5a91-4cc9-a621-61fad2777913">matrix ring</a> $M_n(R)$ for $n \geq 1$.
Then $R, M_n(R)$ are <a href="20240210-morita_equivalence.html#ID-571462f5-987c-4b28-9cbb-d7d0ad581c5d">morita equivalent</a>
</p>
