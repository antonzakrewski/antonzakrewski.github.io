<span id="ID-c8bd7402-b5c7-4519-9d8a-467eb0bd8c62"></span><h1 class="title">nilpotent endomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> <a href="20240121-enriched_category.html#ID-25b0a149-9c99-4434-8269-a02d6792da71">enriched</a> over <a href="20230225170046-kategorie_set.html#ID-95ae2391-14bd-4f4b-99e6-e3d98005856d">category set*</a>.
Then a <a href="20220819140031-endomorphismus.html#ID-50a12682-aaeb-4e29-9add-c505508e134e">endomorphism</a> $f: X \rightarrow X$ is said to be nilpotent, if
</p>

<div class="math-block">\begin{align*}
f^n = 0
\end{align*}</div>
<p>
where $0$ is the designated morphism.
</p>
