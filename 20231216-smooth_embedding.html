<span id="ID-a9019d7e-d7c3-402e-ac8d-afe439fbc67d"></span><h1 class="title">smooth embedding</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M,N$ be <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifolds</a> and $f: M \rightarrow N$ a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
</p>

<p>
Then $f$ is said to be a smooth embedding, if
</p>
<ol>
<li>it is a <a href="20230914-immersion.html#ID-50479778-cf05-47cd-be8c-81f610b33d45">Immersion</a></li>

<li>and a <a href="20230211133059-einbettung_einer_topologie.html#ID-0cc33b7e-a336-4565-a867-c2859bcb0a82">topological embedding</a></li>
</ol>
