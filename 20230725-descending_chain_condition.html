<span id="ID-d6aa0469-ff91-49ff-8550-b30c24f37e99"></span><h1 class="title">descending chain condition</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(P, \leq)$ be a <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">poset</a>.
Then $P$ satisfies the descending chain condition, if for each <a href="20230222205150-kette.html#ID-0b38d50a-42b8-4d13-9f40-0248f887ca7d">Chain</a>
</p>

<div class="math-block">\begin{align*}
p_1 \geq p_2 ... 
\end{align*}</div>
<p>
there exists an $p_m$ such that
</p>

<div class="math-block">\begin{align*}
p_m \leq p_n \forall n \in \mathbb{N} 
\end{align*}</div>


</div>
