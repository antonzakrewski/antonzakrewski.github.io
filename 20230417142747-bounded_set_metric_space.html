<span id="ID-59957e79-a7f9-4b24-b9d7-6808ef50e46f"></span><h1 class="title">bounded set (metric space)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M,d)$ be a <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metric space</a>.
A <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> $S \subseteq M$ is bounded, if there exists an $r \in \mathbb{R}$ such that for each $s,s' \in S$ following holds true:
</p>

<div class="math-block">\begin{align*}
d(s,s') &lt; r
\end{align*}</div>
