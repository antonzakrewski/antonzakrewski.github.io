<span id="ID-86660ca5-56b1-4a6e-ae09-048175747744"></span><h1 class="title">separated algebraic functor</h1>

<h2 id="definition">Definition</h2>
<p>
An <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functor</a> $X$ is called separeted, if the <a href="20230404183731-terminal_morphism.html#ID-ad3ab3aa-eac9-4e11-8a03-6a8e703aefdf">terminal morphism</a> $X \rightarrow \mathrm{Spec}(\mathbb{Z})$ is a <a href="20230914-separated_morphism_of_schemes.html#ID-0d7f4dab-63eb-45a8-a85b-1f38d658e680">separated morphism of schemes</a>.
</p>
