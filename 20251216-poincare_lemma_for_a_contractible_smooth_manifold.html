<span id="ID-723d7923-eedc-4acb-b122-a411799ad409"></span><h1 class="title">poincare lemma for a contractible smooth manifold</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $M$ be a <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifold</a> with $H^{m+1}(M, \mathbb{R}) = 0$.
Let $\omega$ be a <a href="20230905-geschlossene_form.html#ID-b1ddc1c8-9d7a-4169-945e-a72e6a4d4fce">closed m-Form</a>, then $\omega$ is also an <a href="20230905-exakte_k_form.html#ID-034f2c48-39e1-4c7e-b01b-fe4ef0da9e2d">exact m-Form</a>
</p>

<p>
in particular this holds if $M$ is <a href="20240703-contractible_simplicial_set.html#ID-5db3dfcd-9f98-41a8-9550-a49351d833cf">contractible</a>
</p>
