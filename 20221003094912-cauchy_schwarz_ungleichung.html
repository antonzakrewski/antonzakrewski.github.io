<span id="ID-918045db-a394-490d-93a8-d735215cfad0"></span><h1 class="title">Cauchy-Schwarz Ungleichung im euklidischen Raum</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $V \cong \mathbb{R}^n$ ein <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller</a>, <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normierter Vektorraum</a> mit einem <a href="20221003093414-skalarprodukt.html#ID-edd2aca6-e8ec-4a59-9b4a-879e89845014">Skalarprodukt</a>.
Dann gilt für $v,w \in V$
</p>

<div class="math-block">\begin{align*}
\vert \langle v,w \rangle \vert \leq \| \| v \| w \|
\end{align*}</div>
