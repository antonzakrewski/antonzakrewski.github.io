<span id="ID-0c5c3a6e-af1e-4305-881e-4a6ee0e68f8d"></span><h1 class="title">Polarform einer komplexen Zahl</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $z  \coloneqq a + b\mathrm{i}$ eine <a href="20210702104546-komplexe_zahlen.html#ID-ca121ea4-6b83-47aa-a6f1-31a6e0d0667d">Komplexe Zahl</a>.
Dann ist nach die Darstellung der <a href="20220225202318-eulersche_formel.html#ID-a44af9b5-a187-4031-a3a1-06a464bbe064">Eulersche Formel</a>:
</p>

<div class="math-block">\begin{align*}
z =&amp; \vert z\vert e^{ \mathrm{i} \theta} \\
=&amp; \vert z \vert \cdot ( \mathrm{i}\sin(\theta) + \cos(\theta)
\end{align*}</div>


</div>
