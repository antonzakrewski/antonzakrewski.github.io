<span id="ID-14d617c4-0691-40a6-83c4-e0a3dc9015e8"></span><h1 class="title">formal power series</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $A[X]$ the <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">polynomial ring</a>.
Then a formal power series is an expression
</p>

<div class="math-block">\begin{align*}
\sum_{i=0}^{\infty} \alpha_i X^i
\end{align*}</div>
