<span id="ID-be64a468-aa20-4a97-a4e4-0a406dcaa65e"></span><h1 class="title">commutative group object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $G$ a <a href="20231110-group_object.html#ID-19e7993e-1e10-4d1b-a739-3ece95ad96a5">group object</a>.
Then $G$ is said to be commutative, if the underlying monoid object is a <a href="20250122-commutative_monoid_object.html#ID-efce0f0b-54f6-4672-9659-e370aca98ad4">commutative monoid object</a>.
</p>
