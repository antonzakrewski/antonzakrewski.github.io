<span id="ID-004ed508-3a84-4869-b5e6-618763186c2b"></span><h1 class="title">quasicategory (merge)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a>.
Then $X$ is said to be a quasi category, if every <a href="20240128-inner_horn.html#ID-9f3066a1-77af-4de4-b1f9-331f8aa919e8">inner horn</a> inclusion $f: \Lambda_i^n \rightarrow X$
</p>

<div class="equation-container"><span class="equation"><img src="ltximg/f01891b87def7d183b6e.svg" class="org-svg" alt="diagram" /></span></div>
<p>
admits an extension for $n \geq 2, 0 &lt; i &lt; n$.
</p>

<p>
Note that this does not have to be unique.
</p>
