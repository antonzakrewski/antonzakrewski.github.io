<span id="ID-3d77cdc9-e177-40d9-b57d-dc17d897d8a7"></span><h1 class="title">Functor preserving colimits</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $\mathcal{F}$ is said to preserve limits, if every <a href="20230725-colimit.html#ID-581b1561-25d0-479a-b0cc-063c894e10be">colimit</a> is <a href="20231014-preserved_colimit.html#ID-42eb5a7f-24e0-4631-85e8-ef691f9ea336">preserved</a> under $\mathcal{F}$
</p>
