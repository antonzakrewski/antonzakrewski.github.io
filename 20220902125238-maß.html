<h2 id="definition">Definition</h2>
<p>
Let $\sigma$ be a <a href="20220903142815-sigma_algebra.html#ID-54306c73-fba1-4737-a42e-adc9ce14a354">sigma-algebra</a>.
Then a measure is a <a href="20241014-premeasure.html#ID-0391a3c3-2685-4503-a0a1-a00f90bfd119">premeasure</a>.
</p>

<p>
Note that $\sigma$ is required to be a sigma algebra and not only a <a href="20241010-ring_of_sets.html#ID-96a10eeb-f89d-4001-a253-a040a7bbe64a">ring of sets</a>
</p>
