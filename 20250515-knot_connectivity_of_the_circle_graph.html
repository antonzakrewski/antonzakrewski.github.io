<span id="ID-80dbc1dc-fceb-4a29-9680-6f2bf31a85f8"></span><h1 class="title">knot connectivity of the circle graph</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $C_n$ denote the <a href="20250425-circle_graph.html#ID-c9282a38-4c3a-4a8a-a16c-ea9000398c38">circle graph</a>.
Then it is given by
</p>

<div class="math-block">\begin{align*}
K(C_n) = 2
\end{align*}</div>

<h2 id="proof">Proof</h2>
<p>
for two different vertices $v_1,v_2$ we have precisely two <a href="20250515-kreuzungsfreier_pfad.html#ID-73e481fe-c533-4c97-a719-33d46564aaf2">vertex disjoint paths</a>, one given clockwise and the other counterclockwise.
</p>
