<span id="ID-02a5d15c-2ea4-4f01-b18f-8027595b7d12"></span><h1 class="title">scheme (boomer definition)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X,\mathcal{O}_X)$ be a <a href="20230826-locally_ringed_space.html#ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728">locally ringed space</a> and $(O_i)$ a <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open cover</a> of $X$
Then $(X,\mathcal{O}_X,(O_i)$ is said to be a scheme, if every <a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">element</a> $O_i$ is an <a href="20230826-affine_scheme.html#ID-db53fdff-23db-4578-95b6-9cc1e057c336">affine scheme</a>
</p>
