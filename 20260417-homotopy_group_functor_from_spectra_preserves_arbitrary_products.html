<span id="ID-8f5a380e-8428-4858-aa92-1f2568a0e608"></span><h1 class="title">homotopy group functor from spectra preserves arbitrary products</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20250128-homotopy_group_of_a_spectra.html#ID-2e0ad321-a2a2-4122-b620-9454acd8fca2">homotopy group functor of spectra</a> <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves</a> arbitrary <a href="20241017-infinity_product.html#ID-07afb527-f81d-470f-946f-dfcac235ce22">products</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows as it is the composition $\mathrm{Hom}_{\mathrm{Sp}}(\mathbb{S}^n, -)$ and $\pi_*(-)$ where both functors preserve products.
</p>
