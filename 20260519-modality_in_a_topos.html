<span id="ID-ee83d104-7579-4899-af29-6446b4c6ed55"></span><h1 class="title">modality in a topos</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{X}$ be a <a href="20260215-infinity_1_topos.html#ID-2dbca06b-baa3-45ef-b729-887a45754725">topos</a> and $(\mathcal{L}, \mathcal{R})$ a <a href="20241109-infinity_factorization_system.html#ID-764d292e-55bc-4de7-b441-679fc3920b40">factorization system</a>
Then it is said to be a modality, if $\mathcal{L}$ is closed under <a href="20250310-infinity_base_change_functor.html#ID-c5f4f9fb-1915-42c4-a8e7-bdcc0bb1abdb">base change</a> along arbitrary maps.
</p>
