<span id="ID-a0144ccb-0504-4ac6-8392-093ae84b2166"></span><h1 class="title">weak product in a pointed category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed category</a> and $c_i$ <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a>, then the weak product is defined as
</p>

<div class="math-block">\begin{align*}
\mathrm{colim}_{I \subseteq J, I \textrm{finite}} \prod_{I} c_i
\end{align*}</div>
