<span id="ID-d6ab1c8c-4800-49af-873d-d93b8cebd6f5"></span><h1 class="title">isometry between metric spaces is injective</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any <a href="20221209134652-isometrie_metrischer_raum.html#ID-897a11a6-874c-4734-9d2b-7bf717ba7867">isometry</a> between <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metric spaces</a> is <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injective</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $x,y \in X$ with $f(x) = f(y)$.
Then
</p>

<div class="math-block">\begin{align*}
d(x,y) = d(f(x),f(y)) = 0
\end{align*}</div>
<p>
hence $x = y$
</p>
