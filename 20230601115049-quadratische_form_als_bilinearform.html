<span id="ID-2d134952-d9f8-400b-80ff-42e03cf88327"></span><h1 class="title">quadratische Form als Bilinearform</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> und $R[X_1,..,X_n]$ der <a href="20220303185921-polynomring.html#ID-1a010da5-5e8a-407f-87ba-85383825403f">Polynomring</a> in $n$ Variablen und $q \in R[X_1,...,X_n]$ eine <a href="20230604-quadratische_form.html#ID-1c68a22f-54cc-48fc-9791-2f41df8be73c">quadratische Form</a>.
Dann ist $q$ die <a href="20221026162005-einschrankung_abbildung.html#ID-c9f04287-e549-4811-8538-f4a3c521866f">Restriktion</a> auf die <a href="20230330175154-diagonalabbildung.html#ID-d79d9003-736d-4f2e-b6e6-d2c6c636e4c2">diagonale</a> einer <a href="20230224164810-bilinearform.html#ID-48e29c9d-7941-405a-a653-1f728c298928">Bilinearform</a>  $q': R^n \times R^n \rightarrow R$
</p>
