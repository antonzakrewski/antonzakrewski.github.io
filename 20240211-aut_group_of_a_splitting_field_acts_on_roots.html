<span id="ID-08e18d17-93d2-41df-bcf7-8d3a81bf4e46"></span><h1 class="title">aut group of a splitting field acts on roots</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $f \in K[X]$ a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a>, then the <a href="20230302210538-automorphismengruppe.html#ID-ad2bea99-3395-41e7-84ca-c93a1fc0efab">automorphism group</a> $\mathrm{Aut}_K(K(f))$ <a href="20230501095041-gruppenwirkung.html#ID-e8246fd3-cb62-4245-9ef1-59bc0326501a">acts</a> on the <a href="20220320113706-nullstelle.html#ID-b094e637-5f3c-42a2-a2c2-ae73bbbe29a2">roots</a> of the <a href="20230723-zerfallungskorper.html#ID-4e827de3-231e-4dfc-8a60-60227e9ca3e8">splitting field</a> $K(f)$
</p>

<h2 id="proof">Proof</h2>
<p>
analogously to <a href="20240127-galois_group_acts_on_roots.html#ID-1ee85327-5a9a-477d-abde-215a20a21d22">galois group acts on roots</a>
</p>
