<span id="ID-e7ab96fa-ab98-4dd7-9295-37f589694eda"></span><h1 class="title">Symmetrie der Hesse-Matrix durch stetige Differenzierbarkeit</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $U \subseteq \mathbb{R}^n$ und $f: U \rightarrow \mathbb{R}$ eine <a href="20230627-mehrfach_stetig_differenzierbar.html#ID-78722803-0bdc-43c4-b470-2d8f3d49c27f">zweifach stetig differenzierbare</a> <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a>.
Dann ist die <a href="20230626-hesse_matrix.html#ID-ace6512a-3ddf-440f-be2e-35074901bdee">Hesse-Matrix</a> eine <a href="20230626-symmetrische_matrix.html#ID-bd9b88d8-cc80-4c54-ad93-f75e68d1695b">symmetrische Matrix</a>
</p>
