<span id="ID-ddb71e4c-6aa8-479a-8868-b0b412e65ea8"></span><h1 class="title">morphism of topological spaces induces morphism of locally ringed spaces</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f:X \rightarrow Y$ be a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> between <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>.
Then $f$ induces a <a href="20230909-morphism_of_locally_ringed_spaces.html#ID-8a0ca1ca-97ab-4031-8aed-6201f4efc0f3">morphism of locally ringed spaces</a> between the <span class="broken-link" title="unresolved id:c7dc6a36-d58c-4ff2-9668-24e629e30f2e">sheaf of continuous, R valued functions is a locally ringed space</span>.
</p>
