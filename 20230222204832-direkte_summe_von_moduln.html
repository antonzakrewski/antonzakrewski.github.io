<span id="ID-e8bbb659-8f22-4f7b-bc98-3d4d09a07f32"></span><h1 class="title">interne direkte Summe von Moduln</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M$ an \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and $N_i \subseteq M$ <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodules</a>
Then $N_i$ is a internal direct sum, if the <a href="20230222204703-modulhomomorphismus.html#ID-bb388d52-298a-4714-b290-80d9ab79eb2e">homomorphism</a>
</p>

<div class="math-block">\begin{align*}
\coprod N_i \rightarrow&amp; M \\
(n_i) \mapsto \sum_{i \in I} n_i
\end{align*}</div>
<p>
is an <a href="20230303170548-modulisomorphismus.html#ID-808e406f-ac3b-433c-a704-4f83909ef60d">isomorphism</a>
</p>
