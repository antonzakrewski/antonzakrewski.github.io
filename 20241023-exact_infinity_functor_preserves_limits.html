<span id="ID-072c13a6-0a4e-4d80-ac70-59f64588c224"></span><h1 class="title">exact infinity functor preserves limits</h1>

<h2 id="proposition">Proposition</h2>
<p>

Then $\mathcal{F}$ <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves finite limits</a>.
