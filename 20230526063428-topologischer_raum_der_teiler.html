<span id="ID-de40a148-43ec-40ec-ac43-f5c19efd438f"></span><h1 class="title">Topologischer Raum der Teiler</h1>

<h2 id="definition-satz">Definition / Satz</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a>, dann ist der Topologische Raum der Teiler definiert durch die <a href="20221002152517-basis_einer_topologie.html#ID-1a5a6999-876a-4b54-b786-acafe4968fd6">Basis</a>
</p>

<div class="math-block">\begin{align*}
\{r' \in R \vert r' \mid r, r \not\in R^{\times}\}
\end{align*}</div>
