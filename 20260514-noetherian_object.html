<span id="ID-f28b4969-9bb3-479b-8fd8-9b7c5b4b3da7"></span><h1 class="title">noetherian object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $c$ an object.
Then $c$ is said to be noetherian, if each chain $c = c_0 \supseteq c_1 \supseteq ...$ of <a href="20230911-subobject.html#ID-287d81f7-a81b-441c-947e-ba707aa4555b">subobjects</a> becomes stationary.
