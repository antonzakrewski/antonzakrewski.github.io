<span id="ID-64189ee2-b49e-4eb2-a1f2-0107dfbcddb5"></span><h1 class="title">separated morphisms of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: Y \rightarrow X$ be a map of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>
Then $f$ is said to be locally separated, if the <a href="20231229-diagonal_morphism.html#ID-7cb52460-29ae-4b75-9d8f-3b991c740063">diagonal</a> $\Delta_f: Y \rightarrow Y \times_{X} Y$ is a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a>
</p>
