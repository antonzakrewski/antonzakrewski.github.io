<h2 id="proposition">Proposition</h2>
<p>

Then $\mathcal{F}$ <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves</a> limits, which exists.
</p>
