<span id="ID-9026e1d5-2563-47f5-801c-d0afe99d24b2"></span><h1 class="title">cut functor is not coinitial</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20240331-cut_functor.html#ID-30088df7-d5a8-4116-8ad7-5f51930840a5">cut functor</a> is not <a href="20241017-coinitial_infinity_functor.html#ID-7c2e8e73-1566-48ed-a481-8ddc45412c3a">coinitial</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows as:
</p>
<ul>
<li>$\mathrm{Fin}_*$ is <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed</a></li>

<li>$\Delta^{\mathrm{op}}$ contains an <a href="20241014-initial_object_in_an_infinity_category.html#ID-2ad32d89-f7ec-4d07-b2f7-6395ddd9ee89">initial object</a> (terminal object in $\Delta$)   </li>
</ul>
