<span id="ID-b85d7085-92b3-4b3a-8dcc-f3692d4317b7"></span><h1 class="title">weiss topology for one</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20260806-kappa_weiss_topology.html#ID-94d5117a-5ea3-4bc3-b6a7-67409f2dd74c">kappa-weiss topology</a> for $\kappa = 1$ is the topology, where a sieve is covering <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> it is nonempty.
</p>

<h2 id="proof">Proof</h2>

see:

</ul>
