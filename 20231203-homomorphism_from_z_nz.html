<p>

\mathrm{Hom}_{\mathrm{Group}}(\mathbb{Z}/n \mathbb{Z}, G) \rightarrow&amp; \{g \in G \vert g^n = e\} \\
f \mapsto&amp; f([1])
\end{align*}</div>
