<span id="ID-52dc88b9-4e72-4d1f-9139-4d3809f8da28"></span><h1 class="title">Summe der m-ten Potenzen</h1>

<h2 id="definition">Definition</h2>
<p>
Die Summe der $m$-ten Potenzen $S_{m}(n)$ ist definiert als:
</p>

<div class="math-block">\begin{align*}
S_{m}(n)  \coloneqq \sum_{k=0}^{n-1} k^m
\end{align*}</div>
<p>
mit der Konvention $0^0 = 1$
</p>
