<span id="ID-2a1ae981-d090-4cee-b418-50a6151443bb"></span><h1 class="title">field as von Neumann regular ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>.
Then $K$ is a <a href="20230803-von_neumann_regular_ring.html#ID-2eb3bab2-7439-4dbd-ae53-951096e2956e">von Neumann regular ring</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Let $a \in K$, <a href="20220306182550-o_b_d_a.html#ID-e58125c9-5f34-4043-bf52-23ecb4c20f2e">w.l.o.g.</a> $a \neq 0$.
Then for $x = a^{-1}$ we get
</p>

<div class="math-block">\begin{align*}
a =&amp; a \cdot a \cdot a^{-1} \\
=&amp; a^2 \cdot x
\end{align*}</div>


</div>
