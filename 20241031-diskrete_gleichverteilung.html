<span id="ID-7c85a62d-cdbf-4c0e-b7c0-72b39b1f10bf"></span><h1 class="title">diskrete Gleichverteilung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X,\mathcal{P}(X))$ der  <a href="20230302132218-messraum.html#ID-7d8d7a50-6fe1-4cee-a847-365b73490c86">Messraum</a> für $X$ als <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endliche</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>.
Dann ist die diskrete Gleichverteilung definiert als
</p>

<div class="math-block">\begin{align*}
\mathbb{P}(A) = \frac{\vert A \vert}{\vert X \vert}
\end{align*}</div>
