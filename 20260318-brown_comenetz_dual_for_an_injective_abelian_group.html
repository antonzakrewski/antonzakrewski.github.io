<span id="ID-fa88cfd3-870c-4e33-b5b9-d91da39f7b97"></span><h1 class="title">brown comenetz dual for an injective abelian group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be an <a href="20230903-injective_object.html#ID-7fbb0ef7-bb6c-4135-b65f-2d8fb5f2df00">injective</a> <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then the brown-comenetz dual of $A$ is defined as <a href="20250324-spectra.html#ID-1ef9e5d3-8217-4f4a-b505-99a24ce06021">spectrum</a> $I_{A}$ corresponding to the cohomology theory.
</p>

<h2 id="remark">Remark</h2>
<p>
If I forget to say the group, then it is $\mathbb{Q}/\mathbb{Z}$
</p>
