<span id="ID-711ff6a3-a82b-408b-b7dc-15f0962be70b"></span><h1 class="title">right proper model category</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20240715-model_category.html#ID-a617e6d1-b76b-48fc-99bc-acce1d7da2fa">model category</a> is said to be right proper, if <a href="20230806-pullback.html#ID-730c4312-492d-4b9c-a347-9281309d3e6f">pullbacks</a> along a <a href="20240704-fibration.html#ID-e4559e2d-56be-4ba0-a4fb-44d81bc3663b">fibration</a> preserve <a href="20240704-weak_equivalence.html#ID-4dbdf0bf-3558-4ea2-9bcb-5e53729c3391">weak equivalences</a>, i.e. for a weak equivalence $C \rightarrow D$ and a fibration $B \hookrightarrow D$
