<span id="ID-101fa65b-2cb0-4d15-b853-e7bd5ae3fe01"></span><h1 class="title">Rad is a two sided ideal</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> algebra.
Then $\mathrm{Rad}(A)$ is a two-sided <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>
</p>

<h2 id="proof">Proof</h2>
<p>
use that $\mathrm{Rad}(A) = \bigcap_{\rho: A \xrightarrow{\textrm{ simple}} \mathrm{End}_{k}(V)} \mathrm{ker}(\rho)$  is the <a href="20230317161158-allgemeiner_schnitt.html#ID-d7547939-8d3f-48f8-b2fd-cfb5734ae78f">intersection</a> of <a href="20230827-kernel_category_theory.html#ID-1f1c40b0-77e0-4949-8893-3cb7b0166eba">kernels</a>
</p>
