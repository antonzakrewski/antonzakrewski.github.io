<span id="ID-a8392ada-8d4b-4248-913c-82a7886c10bd"></span><h1 class="title">cocartesian infinity operad</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{O}^{\otimes}$ be an <a href="20250314-infinity_operad.html#ID-c7cfb23c-f4af-4d83-9bff-0a3a73a51534">infinity operad</a>
Then $\mathcal{O}^{\otimes}$ is said to be coCartesian, if it is <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalent</a> to $C^{\coprod}$ for some <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial set</a> $C$ (cf. <a href="20250315-c_coprod_for_a_simplicial_set.html#ID-efd66a2b-7c1c-4912-8f98-2b55245e43d6">C^coprod</a>)
</p>
