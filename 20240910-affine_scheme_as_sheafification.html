<span id="ID-16abaf75-d1e9-4dba-8ea9-966d8675fa90"></span><h1 class="title">affine scheme as sheafification of localization presheaf</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathrm{Spec}(A)$ the <a href="20240903-spec_functor_from_ring_to_affine_schemes.html#ID-21578e09-8888-4b20-92be-8d754729674d">spec</a>.
Then $\mathrm{Spec}(A)$ is the <a href="20230827-sheafification.html#ID-5a0c005b-5122-4faf-ac75-e636e4ac4a76">sheafification</a> of the <a href="20240910-localization_presheaf.html#ID-5b1b0cc3-103b-4fbe-83ab-c0043e5a059b">localization presheaf</a>
</p>
