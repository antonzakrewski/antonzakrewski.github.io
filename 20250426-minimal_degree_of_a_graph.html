<span id="ID-7e86ee9c-e5e1-4480-83d1-05a2e55d6202"></span><h1 class="title">minimal degree of a graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then the minimal degree is defined as
</p>

<div class="math-block">\begin{align*}
\partial(G) \coloneqq \mathrm{min}_{v \in V} d_G(v)
\end{align*}</div>
