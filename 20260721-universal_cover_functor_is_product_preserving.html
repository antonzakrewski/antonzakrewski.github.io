<span id="ID-9e1c2e3b-8778-4b02-98b5-3a4168bda4f9"></span><h1 class="title">universal cover functor is product preserving</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20250608-universal_cover_functor.html#ID-f76ead59-9efb-4aa1-86a9-f5c20ec7eff7">universal cover functor</a> <a href="20241017-infinity_functor_preserving_limits_of_a_shape.html#ID-e13812db-b82b-43ed-8ab6-2913dcaf81a6">preserves</a> <a href="20241017-infinity_product.html#ID-07afb527-f81d-470f-946f-dfcac235ce22">products.</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows as the <a href="20250526-n_truncation_of_anima_preserves_products.html#ID-9939bdbd-d6d9-46b4-be4b-aa301f28f121">1-truncation of anima preserves products</a> and hence so will the <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber.</a>
</p>
