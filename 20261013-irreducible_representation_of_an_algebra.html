<span id="ID-d63374c8-6c64-4ee3-bc2b-bd75c8272d12"></span><h1 class="title">irreducible/simple representation of an algebra</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20261013-representation_of_an_algebra.html#ID-2382e24c-8a21-4f51-94be-8f7cc7321c83">representation</a> $V$ of an <a href="20221228202836-r_algebra.html#ID-f1401a23-6bbb-4e91-812e-071fddeb1e67">R-Algebra</a> $A$ is said to be irreducible (or simple) if it is nonzero and the only <a href="20261013-subrepresentation_of_an_algebra.html#ID-5d7c05be-0bd2-4cdc-b28b-1e274618b997">subrepresentations</a> of $V$ are $0$ and $V$.
</p>
