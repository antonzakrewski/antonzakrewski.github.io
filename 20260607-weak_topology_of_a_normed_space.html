<span id="ID-b9d0ae60-615c-4e20-a578-0ff8997d7bb4"></span><h1 class="title">weak-topology of a normed space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20221005101046-normierter_vektorraum.html#ID-2ba5953b-83c1-4e4f-8a82-198c6bbbd76a">normed vector space</a>
Then the weak topology on $X$ is defined as the <a href="20260626-locally_convex_topology.html#ID-c276a81b-2196-4235-a2b6-d5b1f75586eb">locally convex topology</a> on $X$ induced by the family of seminorms $\{x \mapsto \vert f(x) \vert \}_{f \in X^*$}$.
</p>
