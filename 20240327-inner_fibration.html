<span id="ID-1915e43c-9378-4583-b34c-5f4e084cb5a0"></span><h1 class="title">inner fibration</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $f: X \rightarrow Y$ a <a href="20220821182915-naturliche_transformation_kategorientheorie.html#ID-4e6e50c0-c0df-44ff-a140-bebfa492ef7e">natural transformation</a>.
Then $f$ is said to be a inner fibration, if it satisfies the <a href="20240327-right_lifting_property.html#ID-d782de36-512e-44c3-8cbc-1106a79a58a6">right lifting property</a> with respect to <a href="20240128-inner_horn.html#ID-9f3066a1-77af-4de4-b1f9-331f8aa919e8">inner horn</a> inclusions
