<span id="ID-2ec1fa86-f6ea-4323-9c4d-9f0829d6af1b"></span><h1 class="title">Multiplikativität der Asymptotik</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $f,g$ reelle <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktionen</a> dann gilt für die <a href="20230428093541-landau_notation.html#ID-aa09c71c-2c6b-4113-9d36-20f95aa0009a">Landau-Notation</a>:
</p>

<div class="math-block">\begin{align*}
f \cdot g \in&amp; O(f \cdot g) \\
f \cdot g \in&amp; o(f \cdot g) 
\end{align*}</div>
<p>
bzw.
</p>

<div class="math-block">\begin{align*}
O(f \cdot g) = f \cdot O(g)
\end{align*}</div>
