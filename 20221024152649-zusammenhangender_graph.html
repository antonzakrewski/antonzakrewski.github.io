<span id="ID-5c0f8ef4-52f7-4762-a4dd-8772c7ea392c"></span><h1 class="title">connected graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then $G$ is said to be connected, if for each $v_1,v_2$ there exists a <a href="20230327231733-pfad_graph.html#ID-c96c7b83-8e70-4f6c-bcbc-fb3e126bd9fe">path</a> $v_1 \leadsto v_2$ connecting $v_1$ and $v_2$
