<span id="ID-a86bd6b7-d26b-443a-9113-2c89849abfb5"></span><h1 class="title">cofinal functor as weak equivalence</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f: K \rightarrow L$ be <a href="20241017-cofinal_infinity_category.html#ID-7a01e020-1d0a-43b7-8a3a-37160eb9939d">cofinal</a>.
Then $f$ is a <a href="20240711-weak_equivalence_between_sset.html#ID-cab1bc8b-5969-4571-815a-34a9c02b0672">weak equivalence</a>
</p>

<h2 id="proof">Proof</h2>

<div class="math-block">\begin{align*}
\underline{\mathrm{Hom}}(L,Y) =&amp; \mathrm{Fun}_L(L, Y \times L) \\
\cong&amp; \mathrm{Fun}_f(K, Y \times L) \\
=&amp; \underline{\mathrm{Hom}}(K,Y)
\end{align*}</div>
