<span id="ID-500d1534-ecd5-48a1-8dcf-173e46c1e212"></span><h1 class="title">idempotent object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}, \otimes$ be an <a href="20250306-monoidal_infinity_category.html#ID-4b1bd9a8-674e-47cd-bfff-f5af725c95ab">monoidal infinity category</a>.
Then an object $I$ together with a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a> $1 \rightarrow I$ is said to be idempotent, if it induces <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalences</a>
</p>
