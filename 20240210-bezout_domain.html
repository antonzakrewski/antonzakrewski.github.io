<span id="ID-fc3ac825-5d3f-467c-8a1a-e296cc6e71f1"></span><h1 class="title">bezout domain</h1>

<h2 id="definition">Definition</h2>
<p>
A bezout domain is a <a href="20231120-gcd_domain.html#ID-51851273-9a39-487a-8f09-0b10d9b7547a">GCD Domain</a> $A$ such that that for $a,b \in A$ there exists $r_1,r_2 \in A$ such that
</p>

<div class="math-block">\begin{align*}
\mathrm{gcd}(a,b) = r_1 \cdot a + r_2 \cdot b
\end{align*}</div>
