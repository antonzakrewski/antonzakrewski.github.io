<span id="ID-283187fc-bdcf-4a0c-80e6-d97d46c3716a"></span><h1 class="title">finite union of closed sets</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $n \in \mathbb{N}$ und $K_i$ eine <a href="20220823154734-mengenfamilie.html#ID-d5f647a4-b9c9-406e-82fc-ceeaacb27fd9">Mengenfamilie</a> von abgeschlossene <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a>.
Dann ist:
</p>

<div class="math-block">\begin{align*}
\bigcup_{i \in \{1,...,n\}} K_i
\end{align*}</div>
<p>
ebenfalls eine abgeschlossene <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a>.
</p>
