<span id="ID-b721bbf8-7d5b-47a4-b6b1-24f9315227c4"></span><h1 class="title">section (presheaf)</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $O \in \mathcal{T}$ an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $F: \mathcal{T} \rightarrow \mathrm{Set}$ a <a href="20230603-presheaf_of_sets.html#ID-d49e3c63-1428-4b98-9f00-238ae7770cbf">presheaf on</a> $X$.
Then an <a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">element</a> $f \in \mathrm{Set}(F(O))$ is said to be a section
