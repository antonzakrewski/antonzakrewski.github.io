<span id="ID-347ece95-2b4b-484e-8c2e-1fae9698217a"></span><h1 class="title">pi-Torsionsmodul</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221227223925-hauptidealring.html#ID-41717608-2c65-435a-aca7-549eff5b4ca2">Hauptidealring</a> und $M$ ein $R$-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">Modul</a> sowie $\pi$ ein <a href="20221226125836-irreduzibles_element.html#ID-0cc3140d-cb4c-48a2-8cb6-2d9801e34db0">irreduzibles</a> Element
Dann ist
</p>

<div class="math-block">\begin{align*}
T_{\pi}(M)  \coloneqq \{m \in M \vert \exists n \in \mathbb{N} : \pi^n \cdot m = 0 \}
\end{align*}</div>
<p>
das $\pi$-Torsionsmodul von $M$
</p>
