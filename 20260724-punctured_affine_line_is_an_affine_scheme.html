<span id="ID-adb64276-b61e-441e-a834-3dc5c8eb364f"></span><h1 class="title">punctured affine line is an affine scheme</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20260712-punctured_affine_space.html#ID-732fe5f9-f843-4096-b3d1-38690967f075">punctured affine line</a> is an <a href="20260714-affine_scheme.html#ID-cf016ac0-38e9-410b-86e4-837df6983335">affine scheme</a>, <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalent</a> to $\mathbb{G}_m$
</p>

<h2 id="proof">Proof</h2>
<p>
see:
</p>
<ul>
<li><a href="20260724-nonvanishing_locus_of_spec_is_affine.html#ID-a78cde87-f657-41ac-8f4b-a1e0a8c96bf7">nonvanishing locus of Spec for a single element is affine</a> </li>
</ul>
<p>
where $k[x] \rightarrow k[x]_{x} \cong k[x, x^{-1}]$ witnesses the <a href="20241206-equivalent_objects_in_an_infinity_category.html#ID-cbb1ac2c-2755-4d4a-9a75-56978060b40f">equivalent</a>
</p>
