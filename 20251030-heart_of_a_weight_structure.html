<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a> equipped with a <a href="20250810-weight_structure.html#ID-67d2e6d1-fe9a-46eb-b463-5ac415a5a2af">weight structure</a>.
Then define the heart as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a>
</p>

<div class="math-block">\begin{align*}
\mathcal{C}^{\heartsuit} = \mathcal{C}_{\geq 0} \cap \mathcal{C}_{\leq 0}
\end{align*}</div>
