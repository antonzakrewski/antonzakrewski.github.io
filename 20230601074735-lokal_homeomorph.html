<span id="ID-131f523a-aa28-4f22-bcde-ce172f7f8edb"></span><h1 class="title">lokal homeomorph</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $(X, \mathcal{T})$ und $(X', \mathcal{T}')$ <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räume</a>, dann ist $f: X \rightarrow X'$ ein lokaler <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphismus</a>, falls für einen beliebigen Punkt $x \in X$ eine <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebung</a> $U$ existiert, so dass $f_{\vert U}$ eine <a href="20230211133059-einbettung_einer_topologie.html#ID-0cc33b7e-a336-4565-a867-c2859bcb0a82">topologische Einbettung</a> ist.
</p>
