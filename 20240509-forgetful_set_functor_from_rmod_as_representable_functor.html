<span id="ID-2c5ceefd-526f-46d1-9595-bb07aebffb17"></span><h1 class="title">forgetful set functor from RMod as representable functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let \(R\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $\mathrm{RMod}$ the <a href="20230225170152-kategorie_mod.html#ID-15b21b3a-18bb-4d60-a716-c69681d7222d">category RMod</a>, then the <a href="20230402143832-underlying_set_functor.html#ID-71f19a78-b839-4247-b1c5-3488dbd8d69c">underlying-set functor</a> is a <a href="20231021-representable_functor.html#ID-31b596c9-5984-4672-900f-de9718d2e524">covariant representable functor</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the <a href="20240509-universal_property_of_a_ring_as_modul.html#ID-d2116c82-bbdc-4a85-aa60-efeeceb0c6eb">universal property of a ring as module</a>
</p>
