<span id="ID-a37e2fc0-061d-4450-8806-51b8bf8a045f"></span><h1 class="title">lebesgue maß als sigma-endliches Maß</h1>

<h2 id="proposition">Proposition</h2>
<p>
Das <a href="20241028-lebesgue_maß.html#ID-5823a0cb-ada2-475c-b5f4-13d1e32b4f73">Lebesgue Maß</a> ist <a href="20241103-sigma_endliches_maß.html#ID-0755b55c-cb40-4e38-964a-dd44d1061a6a">sigma endlich</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Wähle
</p>

<div class="math-block">\begin{align*}
\prod_{i = 1}^d [n_i - 1, n_i + 1]
\end{align*}</div>
<p>
für $n \in \mathbb{N}^d$, wobei $\mathbb{N}^d$ <a href="20230321174223-abzahlbarkeit_des_endlichen_kartesischen_produkts_einer_abzahlbaren_menge.html#ID-5716ca51-0f9f-4f43-afe3-fcce2054d7e9">abzählbar</a> ist.
</p>
