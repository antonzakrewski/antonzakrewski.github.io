<span id="ID-e22a078c-ce33-48d6-adc3-a5c189ea32a7"></span><h1 class="title">I-adic completion for a maximal ideal yields a local ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $I$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Suppose that $I$ is a <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a>, then the <a href="20260804-i_adic_completion_of_a_ring.html#ID-8f50ea30-b09a-4f1e-8d1b-2357d2b33540">I-adic completion</a> is a <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a>
</p>


<h2 id="proof">Proof</h2>

</ul>
