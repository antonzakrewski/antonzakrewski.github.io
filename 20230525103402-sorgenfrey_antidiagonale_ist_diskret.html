<span id="ID-316cb525-7a9e-4695-a1ea-9c444fa4146c"></span><h1 class="title">Sorgenfrey-Antidiagonale ist diskret</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $(\mathbb{R}^2,\mathcal{T})$ die <a href="20230426145636-sorgenfrey_plane.html#ID-e34ee8cd-60f1-4873-b5a7-cbb02b6684e4">Sorgenfrey-Ebene</a>, dann ist die <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">Unterraumtopologie</a> &lt;Antidiagonale&gt; ein <a href="20221002144647-diskrete_topologie.html#ID-c9466868-60fd-4b1f-ae1c-1bf7606f3ec7">diskreter topologischer Raum</a>
</p>

<h2 id="beweis">Beweis</h2>
<p>
Folgt, indem man für $(x,-x)$ die <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">offene</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $[x,x + \varepsilon) \times [-x,-x + \varepsilon)$ wählt.
</p>
