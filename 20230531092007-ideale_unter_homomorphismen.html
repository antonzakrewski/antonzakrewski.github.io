<span id="ID-74859086-2238-4f10-b087-d9ba7b5cbf4c"></span><h1 class="title">image of an ideal under an epimorphism as ideal</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $R,R'$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ringe</a> und $\phi: R \rightarrow R'$ ein <a href="20230301170300-ringepimorphismus.html#ID-0354f59c-3b74-4c1d-994a-74dffbfc0897">epimorphismus</a> sowie $I \subseteq R$ ein <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">Ideal</a>.
Dann ist das <a href="20221224140013-bildmenge.html#ID-def6ffac-1c21-427b-bacf-7b8580f5d7dd">Bild</a> $\phi[I] \subseteq R'$ ein <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">Ideal</a>
</p>
