<span id="ID-e7f6fe0a-037c-45e4-940a-37c6c1b068a3"></span><h1 class="title">Ab5 category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20240210-ab3_category.html#ID-e25658e6-49ee-4287-9b49-618d020585a4">Ab3</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>.
Then $\mathcal{A}$ is said to be Ab5, if <a href="20230804-filtered_limit.html#ID-35b9e3f0-b5d0-41c4-94ac-6bd183d66ee3">filtered colimits</a> commute with <a href="20231018-finite_limit.html#ID-265414ac-0939-4106-ad91-4f3da00bd5bb">finite limits</a>.
</p>
