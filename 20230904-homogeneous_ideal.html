<span id="ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3"></span><h1 class="title">homogeneous ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R = \bigoplus_{n \in \mathbb{N}_0} R_n\) be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">graded ring</a> and $\mathfrak{a} \subseteq R$ an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then $\mathfrak{a}$ is said to be a homogeneous ideal, if
</p>

<div class="math-block">\begin{align*}
\mathfrak{a} = \bigcap_{n \in \mathbb{N}_0} (\mathfrak{a} \cap R_n)
\end{align*}</div>
