<span id="ID-94166617-5457-4699-9ecf-cf55ae352e09"></span><h1 class="title">class function</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $f: G \rightarrow X$ be a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map.</a>
Then $G$ is said to be a class function, if it descends onto <a href="20221210184513-konjugation_gruppe.html#ID-9c1eef3e-e33c-4393-a65a-20a5ac69663d">conjugation classes</a>, i.e.
</p>

<div class="math-block">\begin{align*}
f(g) = f(h \cdot g \cdot h^{-1})
\end{align*}</div>
