<span id="ID-e21de5b8-71b2-4ba5-af0c-bb04b79ff70a"></span><h1 class="title">k degenerate graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>.
Then $G$ is said to be \(k\)-degenerate, if every <a href="20231206-subgraph.html#ID-191bebce-741d-4771-bd78-eb39c0ef6837">subgraph</a> contains a vertex of <a href="20221024152000-grad_eines_knoten.html#ID-16f65dc5-0c38-41e7-b7df-2a2d8989f84b">degree</a> at most $k$.
</p>
