<span id="ID-7aea7075-1cbd-430a-84a8-1eb1edd5ab61"></span><h1 class="title">ultrametrische Ungleichung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>.
$M$ erfüllt die ultrametrische Ungleichung, falls gilt:
</p>

<div class="math-block">\begin{align*}
d(x,z) \leq \mathrm{max}(d(x,y),d(y,z)) \leq d(x,y) + d(y,z)
\end{align*}</div>
