<span id="ID-944373b1-827d-4f9e-83cb-d51cc9098a63"></span><h1 class="title">kritischer Punkt</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $U \subseteq \mathbb{R}^m$ <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">offen</a> und $f: U \rightarrow \mathbb{R}^n$ <a href="20230613-stetige_totale_differenzierbarkeit.html#ID-6ad0450c-f189-4fc4-a6d8-093546de7bf1">stetig total diffbar</a>.
Ein kritischer Punkt ist ein Wert $x_0 \in U$, so dass das <a href="20221113224442-totales_differential.html#ID-9361fe82-74cf-489a-8551-9da7453a92b7">totale Differential</a> $\mathrm{d}f_{x_0}: \mathbb{R}^m \rightarrow \mathbb{R}^n$ kein <a href="20230303151705-vektorraumepimorphismus.html#ID-76bd1cc2-7338-461c-9c43-48c24c80037c">Vektorraumepimorphismus</a> ist.
</p>
