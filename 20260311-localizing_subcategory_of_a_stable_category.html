<span id="ID-56c4e838-4529-498d-9d32-9f205e69ddf1"></span><h1 class="title">localizing subcategory of a stable category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{D}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a>
Then a <a href="20241023-stable_subcategory.html#ID-bfd1a6f2-74c1-4474-a8d1-786c0b4ac46a">stable subcategory</a> $\mathcal{C}$ is said to be localizing, if $\mathcal{C}$ is closed under all <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimits</a>
</p>
