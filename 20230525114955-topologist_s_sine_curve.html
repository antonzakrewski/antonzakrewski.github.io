<span id="ID-9b489e19-5190-492e-8d2c-145018be2bdc"></span><h1 class="title">topologist&#x27;s sine curve</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $\mathbb{R}^2$ die euklidische Ebene, dann ist die topologist's sine curve definiert als <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">Unterraumtopologie</a> auf
</p>

<div class="math-block">\begin{align*}
U  \coloneqq \{0\} \times [0,1] \cup \{(x, \sin(\frac{1}{x}) \vert x \in \mathbb{R}^+\}
\end{align*}</div>
