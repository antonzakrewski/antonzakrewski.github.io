<span id="ID-39cacee8-4752-43f4-bcf1-b24852e051ff"></span><h1 class="title">dedekind domain</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R\) be an <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integral domain</a>.
Then $R$ is said to be a dedekind domain, if every nonzero <a href="20230427200359-echtes_ideal.html#ID-fa54a328-b081-4a6c-9106-4348783138df">ideal</a> factors into a product of <a href="20230329081717-primideal.html#ID-a8ae10f5-3b84-4fab-9e76-b006780ccc7f">prime ideals</a>.
</p>
