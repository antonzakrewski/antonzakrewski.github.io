<span id="ID-ac4bdc11-5154-4583-bb69-6ddc5816926c"></span><h1 class="title">Varianz einer Zufallsverteilung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(\Omega, \mathcal{F}, \mathbb{P})$ ein <a href="20220903151423-wahrscheinlichkeitsraum.html#ID-0a7fdeda-13a2-44be-bc7e-d6ab02447255">Wahrscheinlichkeitsraum</a> und $X: \Omega \rightarrow \mathbb{R}$ eine <a href="20241028-zufallsvariable.html#ID-6798db97-4391-4eed-acb0-86d90bc1ec7f">Zufallsvariable</a>
Dann sit die Varianz definiert als
</p>

<div class="math-block">\begin{align*}
\mathbb{V}(X) \coloneqq \mathbb{E}((X - \mathbb{E}(X))^2)
\end{align*}</div>
