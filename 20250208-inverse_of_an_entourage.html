<span id="ID-af8b006e-13e6-4e35-bb5f-98536cb3768a"></span><h1 class="title">inverse of an entourage</h1>

<h2 id="definition">Definition</h2>
<p>
Let $U \subseteq X \times X$ be an <a href="20230405233409-entourage.html#ID-1b91514a-75f8-48b2-ae32-636fa6f55e45">entourage</a>
Then the inverse is defined as
</p>

<div class="math-block">\begin{align*}
U^{-1} = \{(x,y) \vert (y,x) \in U\}
\end{align*}</div>
