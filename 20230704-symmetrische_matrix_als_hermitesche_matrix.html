<span id="ID-5fcb4678-0dd1-4220-baee-98e667f81e2c"></span><h1 class="title">symmetrische Matrix als hermitesche Matrix</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $\mathbb{R}^n$ ein <a href="20230228165413-reeller_prahilbertraum.html#ID-66cc8c4c-9182-4e8c-be37-06075fc56a2d">reeller Prähilbertraum</a> und $A \in \mathbb{R}^{n \times n}$ eine <a href="20230626-symmetrische_matrix.html#ID-bd9b88d8-cc80-4c54-ad93-f75e68d1695b">symmetrische Matrix</a>.
Dann ist $A$ eine  <a href="20230628-hermitesche_matrix.html#ID-e47ba7ed-3d20-4b44-b9a6-b2a323c6d5ef">hermitesche Matrix</a>.
</p>

<h2 id="beweis">Beweis</h2>
<p>
Es gilt
</p>

<div class="math-block">\begin{align*}
\overline{A}^t =&amp; A^t \\
=&amp; A
\end{align*}</div>

</div>
