<span id="ID-0e9d247a-8a88-444a-8f79-95c986925430"></span><h1 class="title">locally closed embedding between topological spaces</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a>, then a <a href="20230112104451-stetigkeit_topologie.html#ID-f46120aa-e40b-4c09-9296-23b0783092a2">continuous</a> <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a> $f: X \rightarrow Y$ is said to be a locally closed embedding if it factors as <a href="20240426-closed_embedding.html#ID-d35c3597-ea39-47b5-b487-02dc3b4fc320">closed embedding</a> followed by an <a href="20260805-open_embedding_of_topological_spaces.html#ID-9b36ca2f-c733-4066-91bd-281a1994f887">open embedding</a>.
</p>
