<span id="ID-a8f34b67-a907-470f-8f04-e9fe438080fa"></span><h1 class="title">regular local ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian</a> <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local</a> <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then $A$ is said to be regular, if the <a href="20230314223428-maximales_ideal.html#ID-9d76bba3-11a8-42c9-9bdb-f774da2bb06a">maximal ideal</a> $\mathfrak{m}$ is generated by $\mathrm{dim}(A)$ many elements.
</p>
