<span id="ID-b32ef02d-b262-4c65-9717-6df372fd2444"></span><h1 class="title">integral homology of an non orientable spherical fibration</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\pi: E \rightarrow B$ be an <a href="20250429-oriented_fibration_between_anima.html#ID-7c78e5a5-27d5-4ee9-beae-a65a2b1ad276">non orientable spherical fibration</a> of rank $d-1$.
Then the integral <a href="20230509093056-homologiegruppe.html#ID-0567e0ce-98c9-4cee-8908-950248425a49">singular homology</a> is given by
</p>

<div class="math-block">\begin{align*}
H_d(\mathrm{Th}(\pi), \mathbb{Z}) = \mathbb{Z}/2 \mathbb{Z}
\end{align*}</div>
