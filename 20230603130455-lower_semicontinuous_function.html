<span id="ID-cde1e7b2-c083-4c5d-924f-5c0050210d1d"></span><h1 class="title">lower semicontinuous function</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $f: X \rightarrow \overline{\mathbb{R}}$ be a <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">function</a>.
Then $f$ is said to be lower semicontinuous, if for each $a \in \mathbb{R}$ the <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>
</p>

<div class="math-block">\begin{align*}
\{x \in X \vert f(x) &gt; a\}
\end{align*}</div>
<p>
is <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a>
</p>
