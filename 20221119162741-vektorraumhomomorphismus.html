<span id="ID-863f0f55-054c-413e-9cf4-2c2704ea5b14"></span><h1 class="title">Vektorraumhomomorphismus</h1>

<h2 id="defintion">Defintion</h2>
<p>
Seien $V,W$ <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorräume</a> und $f: V \rightarrow W$ ein <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
$f$ ist ein Vektorraumhomomorphismus, wenn für $v,v' \in V$ und $k \in K$ gilt:
</p>

<div class="math-block">\begin{align*}
f(v + v') =&amp; f(v) + f(v') \\
f(k \cdot v) =&amp; k \cdot f(v)
\end{align*}</div>


</div>
