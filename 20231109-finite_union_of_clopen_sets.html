<span id="ID-002e853c-f0b2-4178-bbaa-ea26cf582e2a"></span><h1 class="title">finite union of clopen sets</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $C_1,...,C_n$ be <a href="20230207075730-clopen_set.html#ID-f8defda0-b0fc-49cb-ab4f-21c64be93fe5">clopen</a>.
Then the <a href="20230317161154-allgemeine_vereinigung.html#ID-69c0d505-311b-4ea6-a337-8450d6529d02">union</a>
</p>

<div class="math-block">\begin{align*}
\bigcap_{i=1}^n C_i
\end{align*}</div>
<p>
is also clopen
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of:
</p>
<ul>
<li><a href="20230111173849-endliche_vereinigung_von_abgeschlossenen_mengen.html#ID-283187fc-bdcf-4a0c-80e6-d97d46c3716a">finite union of closed sets</a> </li>

<li><a href="20221002144355-abgeschlossenheit_gegenuber_vereinigung_topologie.html#ID-05b0c7bf-2407-4963-9c14-63deb190d8a9">Openness of a union of open sets</a>   </li>
</ul>
