<span id="ID-ce6c79cf-3232-40a4-b504-a84a62ea500c"></span><h1 class="title">Koeffizient (Polynom)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a> und $f = \sum_{i=0}^{n} r_i X^i \in R[X]$ ein <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynom</a>.
Dann sind $r_i$ für $i \in \{0,...,n\}$ die Koeffizienten von $f$
</p>
