<span id="ID-a4783a56-4cb3-4ee9-ba62-325c7994891f"></span><h1 class="title">Reduktion modulo p eines Polynoms</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221227223812-faktorieller_ring.html#ID-7bbf4bf1-38fd-4069-9816-6aa5aea3839f">faktorieller Ring</a>, und $p \in R$ <a href="20230426123442-primelement.html#ID-ffa743e1-94ee-49fe-9647-396eeb233982">prim</a>.
Dann ist die Reduktion modulo $p$ definiert
</p>

<div class="math-block">\begin{align*}
\pi: R[X] \rightarrow&amp; (R/(p))[X] \\
\sum_{i=0}^{n} \alpha_i X^i \mapsto&amp; \sum_{i=0}^{n} (\alpha_i + (p)) X^i
\end{align*}</div>
