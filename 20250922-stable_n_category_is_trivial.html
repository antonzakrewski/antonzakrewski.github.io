<span id="ID-8778d8ef-ae6e-484b-a898-950efb6cf7af"></span><h1 class="title">stable n-category is trivial</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a> which happens to be an <a href="20250310-n_category.html#ID-6a9ea22a-1915-4535-8af9-ba699d0487e4">(n,1)-category</a>.
Then $\mathcal{C} \simeq *$
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20250922-n_truncated_object_in_a_stable_category_is_zero_ojbect.html#ID-523e089a-0d51-473d-86e0-efe0f6682bbf">n-truncated object in a stable category is zero object</a> </li>
</ul>
