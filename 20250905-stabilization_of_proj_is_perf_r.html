<span id="ID-01639d3f-24e9-47f8-8bf1-13bf818357fb"></span><h1 class="title">stabilization of Proj(R) is Perf(R)</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, then the <a href="20250810-stabilization_of_additive_categories.html#ID-09ff3ad2-cf60-4993-a4af-598637a9dfae">stabilization</a> of <a href="20250310-category_proj_of_a_ring.html#ID-00e58c89-b111-4d2a-b4b6-33a254d69592">Proj</a> is given by <a href="20250621-category_of_perfect_modules.html#ID-6ca4fb06-b472-4501-bfbc-52b7812fd824">Perf(R)</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{St}(\mathrm{Proj}(R)) \cong \mathrm{Perf}(R)
\end{align*}</div>
