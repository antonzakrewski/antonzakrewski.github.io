<span id="ID-22bb6719-7ebf-4d4c-8409-d5b87415660f"></span><h1 class="title">stabilizing chain</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M,\leq)$ be a <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">poset</a> and $m_1 \leq m_2 \leq ...$ a <a href="20230222205150-kette.html#ID-0b38d50a-42b8-4d13-9f40-0248f887ca7d">chain</a> (or $m_1 \geq m_2 ...$)
Then the chain is said to be stabilizing, if there exists an $n \in \mathbb{N}$, such that
</p>

<div class="math-block">\begin{align*}
m_n = m_{n+1} = m_{n+2} = ...
\end{align*}</div>
