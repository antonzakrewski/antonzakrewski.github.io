<span id="ID-74b08f17-6c25-4002-9154-53ee84639f45"></span><h1 class="title">Proj functor of a graded ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a $\mathbb{N}$ <a href="20230920-graded_ring.html#ID-934737de-8f00-4050-b210-c984897d335d">graded ring</a>.
Then we define
</p>

<div class="math-block">\begin{align*}
\mathrm{Proj}(A) = \mathrm{colim}_{d \in \mathbb{N}_{&gt; 0}^{\mathrm{div}}} \mathrm{Proj}_d(A)
\end{align*}</div>

<p>
see:
n <a href="20260814-natural_transformation_from_proj_d_to_proj_nd.html#ID-dd9e644c-f04c-4f2d-a0d6-7967511e2907">natural transformation from Proj_d to Proj_nd</a>
</p>
