<span id="ID-9dddbe41-5ca6-4e87-8db5-17d19425461d"></span><h1 class="title">pullback induces equivalence relations</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">(1,1)-Category</a> with <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullbacks</a>.
Then any map $f: X \rightarrow Y$ defines an <a href="20260716-equivalence_relation_in_a_category.html#ID-db2cd450-0c4f-4111-89dd-fa0edc056c72">equivalence relation</a> $X \times_{Y} X \rightarrow X$.
