<span id="ID-0c355152-751d-415a-a232-9bd11b90d2c8"></span><h1 class="title">hinreichende Bedingung</h1>

<h2 id="definition">Definition</h2>
<p>
Wenn eine hinreichende Bedingung $B$ gilt, so folgt zwangsläufig die <a href="20220821085213-aussage.html#ID-372f5460-a89b-4876-9fbe-71865312af7d">Aussage</a> $A$.
Dabei muss die Bedingung $B$ nicht gelten, wenn $A$ gilt.
</p>

<div class="math-block">\begin{align*}
