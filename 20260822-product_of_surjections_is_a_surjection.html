<span id="ID-00243348-8966-4809-824c-ee345a15388c"></span><h1 class="title">product of surjections is a surjection</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $f_i: X_i \rightarrow Y_i$ be <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjections</a>
Then so is $\prod_{i \in I} f_i: \prod_{i \in I} X_i \rightarrow \prod_{i \in I} Y_i$
</p>

<h2 id="proof">Proof</h2>
<p>
<a href="20250117-surjektiv_und_split_epi_in_zfc.html#ID-f590e376-1605-4e20-9f81-e026953822fc">surjektiv und split epi in ZFC</a>
</p>

<h2 id="remark">Remark</h2>
<p>
this is just an equivalent formulation of the <a href="20220817142613-auswahlaxiom.html#ID-0fac098f-bed6-4f86-a90b-7a269c9fd21e">Axiom of choice</a>
</p>
