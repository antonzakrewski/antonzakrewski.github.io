<span id="ID-c89f1401-badb-4daf-8373-e34724d6f0a7"></span><h1 class="title">accessible infinity functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="accessible-infinity-category.html#ID-f23cff27-6e97-4440-a7bd-a3a94ce4e648">accessible infinity category</a> and $\mathcal{C}'$ another <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>
Then an <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">infinity functor</a> $f: \mathcal{C} \rightarrow \mathcal{C}'$ is said to be accessible, if it is <a href="20241021-kappa_continuous_infinity_functor.html#ID-7737a786-1520-4472-a42c-071945644b98">kappa continuous</a> for some <a href="20241016-regular_cardinal.html#ID-971d460d-ad43-48cd-b619-b83936191fce">regular cardinal</a>
</p>
