<span id="ID-06d42ccd-f463-4e42-acf2-9daf50db7a50"></span><h1 class="title">Symmetrischer Raum (Topologie)</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>.
$X$ ist ein symmetrischer Raum, falls für zwei <a href="20230320211013-topologisch_unterscheidbare_punkte.html#ID-c203e63d-59c8-4a4a-8966-95f9f66718fe">topologisch unterscheidbare Punkte</a> $x,y \in X$ gilt:
</p>

<div class="math-block">\begin{align*}
y \not \in&amp; \overline{ \{x\}}  \\
x \not \in&amp; \overline{ \{y\}} 
\end{align*}</div>
