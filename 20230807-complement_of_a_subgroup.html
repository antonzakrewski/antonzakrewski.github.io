<span id="ID-32b4ec81-b54d-41a2-bcbe-e2cccd1ed16d"></span><h1 class="title">complement of a subgroup</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $H,K$ <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroups</a>.
Then $H$ is said to be a complement of $K$ if for the <a href="20230807-product_of_group_subset.html#ID-e6644ef2-53ef-40d3-8f67-4328f0879f77">product of group subset</a> it holds, that
</p>

<div class="math-block">\begin{align*}
HK = G
\end{align*}</div>
<p>
and
</p>

<div class="math-block">\begin{align*}
G \cap H = \{e\}
\end{align*}</div>


</div>
