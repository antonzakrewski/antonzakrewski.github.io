<span id="ID-a2586cb3-aacc-4d2f-a2b4-6c363e8ec829"></span><h1 class="title">homogeneous topological space</h1>

<h2 id="definition">definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is topologically homogeneous, if for $x,y \in X$ there exists a <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphism</a> $f: X \rightarrow X$ such that:
</p>

<div class="math-block">\begin{align*}
f(x) = y
\end{align*}</div>
