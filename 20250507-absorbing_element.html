<span id="ID-c8d584b6-4643-4bb2-bc45-7a8e6acdb0d0"></span><h1 class="title">absorbing element of a monoid</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(M,\cdot)$ be a <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">monoid</a>
Then an absorbing element is given by an element $\infty$ with
</p>

<div class="math-block">\begin{align*}
a \cdot \infty =&amp; \infty \\
\infty \cdot a =&amp; \infty \\
\end{align*}</div>
<p>
for all $a \in M$
</p>

</div>
