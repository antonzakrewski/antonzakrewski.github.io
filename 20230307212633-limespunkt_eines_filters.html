<span id="ID-0aa952f5-da38-4e5c-9ecc-c20c16fa848f"></span><h1 class="title">Limespunkt eines Filters</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $\mathcal{F}$ ein <a href="20230306233743-mengenfilter.html#ID-b48f4cbe-1224-4298-a83b-c35e5e580a49">Mengenfilter</a>.
$x$ ist ein Limespunkt von $\mathcal{F}$, falls $\mathcal{F} \rightarrow x$ <a href="20230307211224-konvergenz_eines_filters.html#ID-719f368e-8b03-43e9-8932-1245f724206b">konvergiert</a>
</p>
