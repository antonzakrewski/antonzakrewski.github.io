<span id="ID-ed13fa3f-3106-4c24-82b4-a9dd10ee8568"></span><h1 class="title">Axiom of extensionality</h1>

<h2 id="axiom">Axiom</h2>
<p>
Zwei <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> sind genau dann gleich, wenn sie dieselben <a href="20211226213342-element_mengenlehre.html#ID-2ae7720e-1f94-4213-bbd8-76f8cec5e927">Elemente</a> haben
</p>

<div class="math-block">\begin{align*}
\forall x \forall y(\forall z ( z \in x \Leftrightarrow z \in y) \Rightarrow x = y)
\end{align*}</div>
