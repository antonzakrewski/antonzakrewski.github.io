<span id="ID-66be19f8-2349-40fd-ae59-87cb96e1e865"></span><h1 class="title">lokal endliche Zerlegung der Eins</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $(f_i)_{i \in I}$ eine <a href="20230624-zerlegung_der_eins.html#ID-10798e53-88ba-444d-8e06-c980d6ee8295">Zerlegung der Eins</a>.
Dann ist $(f_i)$ lokal endlich, falls $f^{-1}[0]$ ein <a href="20230330211854-lokalendliches_mengensystem.html#ID-bffd65a2-1765-486c-b04c-fb57dc333680">lokal-endliches</a> Mengensystem ist.
</p>
