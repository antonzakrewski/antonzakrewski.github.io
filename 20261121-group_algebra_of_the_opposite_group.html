<span id="ID-787a6fdd-58c2-43fc-9c11-c3ca6d9bc8c8"></span><h1 class="title">group algebra of the opposite group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>
Then there exists an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>

<div class="math-block">\begin{align*}
R[G] \rightarrow&amp; R[G^{\mathrm{op}}]  \\
g \mapsto&amp; g^{-1} \\
\end{align*}</div>

follows from the <a href="20241111-inversenabbildung_als_gruppenhomomorphism_fur_die_opposite_group.html#ID-0ba2a85d-8a6f-4bc3-b353-98ab5f0f8f8f">inversenabbildung als gruppenhomomorphism für die opposite group</a>
