<span id="ID-fd0af002-c231-4ad9-834c-60dc331e418a"></span><h1 class="title">Eindeutigkeit des Neutralen Elements</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $M$ ein <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">Monoid</a> (insbesondere eine <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">Gruppe</a>)  und $e_l$ bzy $e_r$ ein <a href="20220103211858-linksneutrales_element.html#ID-2bfee35b-bab8-449a-b082-ce1e1a11f8c6">Linksneutrales Element</a> bzw. <a href="20220103211916-rechtsneutrales_element.html#ID-449c4481-b2ca-47f8-9558-8e51f2957690">Rechtsneutrales Element</a>.
Dann folgt:
</p>

<div class="math-block">\begin{align*}
e_l = e_r
\end{align*}</div>

<h2 id="beweis">Beweis</h2>

<div class="math-block">\begin{align*}
e_l = e_l \circ e_r = e_r
\end{align*}</div>
