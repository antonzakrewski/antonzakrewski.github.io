<span id="ID-8f96d822-26d3-4a11-bd81-a997e10b9cbd"></span><h1 class="title">coprime elements</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $a,b \in A$.
Then $a,b$ are said to be coprime, if for $c \in A$ it holds
</p>

<div class="math-block">\begin{align*}
c \mid a,b \Rightarrow c \in A^{\times}
\end{align*}</div>
