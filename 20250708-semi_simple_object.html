<span id="ID-095667fa-cb09-43aa-a667-641000fde1fa"></span><h1 class="title">semi-simple object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20241217-additive_infinity_category.html#ID-e168d6e3-8dc6-424e-a950-8b24f6ed45f8">additive infinity category</a>.
Then an object $A \in \mathcal{A}$ is said to be semi-simple, if it is a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20250708-sum_in_an_additive_infinity_category.html#ID-b8713cf0-ee6d-4ad2-8206-b843246bc715">sum</a> of <a href="20250708-simple_object.html#ID-a275a20e-9384-4354-99f8-39ee827e2d7d">simple objects</a>
</p>
