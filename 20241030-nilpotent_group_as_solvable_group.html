<span id="ID-8dcbf920-a502-4b82-ace6-9139d0dda27e"></span><h1 class="title">nilpotent group as solvable group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be <a href="20240317-nilpotent_group.html#ID-822a30f5-0ad9-43db-aa27-03b7737ce540">nilpotent</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $G$ is <a href="20230808-solvable_group.html#ID-f168e64c-10ea-4dde-b86a-75dfc1e0e190">solvable</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the definition, as nilpotency requires that each $G_i \subseteq G$ is not only a normal subgroup of $G_{i+1}$ but also of $G_i$ (cf. <a href="20241030-normal_subgroup_and_restriction.html#ID-be9ad388-0db3-4530-813e-8276913b18c4">normal subgroup and restriction</a>)
</p>
