<span id="ID-8e9be337-1039-48c7-aa8d-c979fd03c157"></span><h1 class="title">first homology of a torus</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $k \geq 1$, then the <a href="20240112-reduced_singular_homology_functor.html#ID-9e6c8175-849b-4829-b364-38f0e49b6f62">first singular homology</a> of the <a href="20231017-torus.html#ID-417071ec-29f3-4c26-8a30-f53d1c30d565">k-torus</a> is given by
</p>

<div class="math-block">\begin{align*}
H_1(T^k) = \mathbb{Z}^k
\end{align*}</div>
