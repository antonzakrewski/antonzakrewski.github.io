<span id="ID-f3e40ee4-891d-4ecb-9f39-68f079459837"></span><h1 class="title">conjugation group action on a normal subgroup</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $N \trianglelefteq G$ a <a href="20221210192900-normalteiler.html#ID-f971f946-d0ca-444a-a450-efbef237a278">normal subgroup</a>.
Then $G$ acts on $N$ with
</p>

<div class="math-block">\begin{align*}
(G \times N) \rightarrow&amp; N \\
(g,n) \mapsto&amp; g \cdot n \cdot g^{-1}
\end{align*}</div>
