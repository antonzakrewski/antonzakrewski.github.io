<span id="ID-db53fdff-23db-4578-95b6-9cc1e057c336"></span><h1 class="title">affine scheme (locally ringed space)</h1>

<h2 id="definition">Definition</h2>
<p>
An affine scheme is a <a href="20230826-locally_ringed_space.html#ID-c7e68acd-dbff-43a0-8ffe-1ee7979d0728">locally ringed space</a> $(X, \mathcal{O}_X)$ which is <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphic</a> to the <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a> in the <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> of locally ringed spaces
