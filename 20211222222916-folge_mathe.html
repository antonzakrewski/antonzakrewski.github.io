<h2 id="definition">Definition</h2>
<p>

</p>

<div class="math-block">\begin{align*}
(a_n)_{n \in \mathbb{N}}
\end{align*}</div>
<p>
schreibt für
</p>

a_n \coloneqq f(n)
\end{align*}</div>
