<span id="ID-84ec2e2e-d4f1-4c8f-a37a-780fba83448e"></span><h1 class="title">boundary of a simplex as union of joins</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $n \in \mathbb{N}$, then the <a href="20240415-boundary_of_a_standard_simplex.html#ID-cc470ff6-e532-4565-834d-ca64b04efd7d">boundary</a> is given by
</p>

<div class="math-block">\begin{align*}
\partial \Delta^n = \partial \Delta^n \star \Delta^1 \coprod_{\partial \Delta^n \star \Delta^0} \Delta^n \star \Delta^0 
\end{align*}</div>
