<span id="ID-a28df24d-eb93-4c11-a519-aa320c7dfd0d"></span><h1 class="title">cohomological delta functor as half exact functor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{A}, \mathcal{B}$ be <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\{\mathcal{F}_n\}$ a <a href="20240507-cohomological_delta_functor.html#ID-f243e543-35a7-4b0e-beab-302ff617590f">cohomological delta functor</a>
Then $\mathcal{F}_n$ is <a href="20230903-covariant_half_exact_functor.html#ID-262cbe81-1b42-4d9e-bbbb-47a127bf2d27">half exact</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from the definition or analogously to <a href="20240425-delta_functor_as_half_exact_functor.html#ID-a2b69e27-8b18-4a4c-852f-28add60173bc">delta functor as half exact functor</a>
</p>
