<span id="ID-6c919bc5-8df1-4caf-8fbb-c8ae60225d2d"></span><h1 class="title">Mittlere Änderungsrate</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $f(x)$ eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a>
Dann ist die mittlere Änderungsrate über dem <a href="20220401195853-intervall.html#ID-ea9ab8cb-ef38-4c06-bab0-d392820614f3">Intervall</a> $[x_0,x_1]$
</p>

<div class="math-block">\begin{align*}
m_{[x_0;x_1]} =&amp; \frac{f(x_1) - f(x_0)}{x_1 - x_0}
\end{align*}</div>
