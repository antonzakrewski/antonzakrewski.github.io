<span id="ID-cac1df6b-34c3-46a5-9250-e8b802885138"></span><h1 class="title">semi-lineare Abbildung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20230204210448-komplexer_vektorraum.html#ID-b1836b1a-a3bd-4abc-86b6-2706f358a79f">komplexer</a> oder <a href="20230204210438-reeller_vektorraum.html#ID-47c426f6-4f34-402a-8c78-5ef0c3b88ce9">reeller Vektorraum</a> und $A: V \rightarrow V$ eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a>.
Dann ist $A$ semi-linear, falls für $\alpha \in \mathbb{C}$ bzw. $\alpha \in \mathbb{R}$ gilt:
</p>

<div class="math-block">\begin{align*}
A (\alpha v_1) =&amp; \overline{\alpha} A(v_1)
\end{align*}</div>

</div>
