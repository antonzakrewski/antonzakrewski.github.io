<span id="ID-eeef5017-73f8-4481-953b-7ffb8121124f"></span><h1 class="title">Teilnetz</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $(I, \triangleleft_I)$ und  $(J, \triangleleft_J)$  <a href="20230206161154-gerichtete_menge.html#ID-cd512190-83e1-4c9f-85f5-d2fc367cf4ff">Gerichtete Mengen</a> sowie $(x_i)_{i \in I}$ ein <a href="20230225212337-netz.html#ID-5cb7eafb-da4d-4b59-8bc4-215af31f6e6e">Netz</a> in der <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> $X$ und $\phi$ eine <a href="20230225213611-konfinale_abbildung.html#ID-b4697a60-ca88-478f-b466-ba16d9ed2432">konfinale Abbildung</a> dann ist ein Teilnetz definiert als
</p>

<div class="math-block">\begin{align*}
(x_{\phi(j)})_{j \in J}
\end{align*}</div>



</div>
