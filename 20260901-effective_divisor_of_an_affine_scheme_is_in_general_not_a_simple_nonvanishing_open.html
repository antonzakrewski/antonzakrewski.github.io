<span id="ID-eedde6bd-7b5c-4c8c-a138-f3a4ea5d4f00"></span><h1 class="title">effective divisor of an affine scheme is in general not a simple nonvanishing open</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathrm{Spec}(R)$ be an <a href="20260714-affine_scheme.html#ID-cf016ac0-38e9-410b-86e4-837df6983335">affine scheme</a> and $L$ an <a href="20260901-effective_divisor.html#ID-8c74b5f9-27ed-40a5-83ea-5e9197e660bb">effective divisor</a>.
Then $L$ is in general not of the form $V(f)$ for (a non zero divisor) $f \in R$.
