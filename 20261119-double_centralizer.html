<span id="ID-e1dcb44e-2ee1-444b-a050-f817e459e08a"></span><h1 class="title">double centralizer</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(L,R): A \rightarrow A$ be set-theoretic maps of <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a> $A$.
Then it is a double 8entralizer, if
</p>

<div class="math-block">\begin{align*}
a L(b) = R(a) b
\end{align*}</div>
<p>
for all $a,b \in A$.
</p>
