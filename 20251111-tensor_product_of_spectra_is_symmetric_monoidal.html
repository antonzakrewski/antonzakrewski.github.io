<span id="ID-189ebf56-36f4-4a59-ae0c-77cd3effe6f1"></span><h1 class="title">tensor product of spectra is symmetric monoidal</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R \in \mathrm{CAlg}(\mathrm{Sp})$ be a <a href="20250526-commutative_ring_spectrum.html#ID-913ba988-461d-45be-952d-ebe31f0ff380">commutative ring spectrum</a>.
Then the tensor product $\otimes_{\mathbb{S}} R: \mathrm{Sp}  \rightarrow \mathrm{Sp}$ is a <a href="20250317-symmetric_monoidal_infinity_functor.html#ID-58e3cc78-f94d-460d-b655-29030f21a65b">symmetric monoidal functor</a>
</p>
