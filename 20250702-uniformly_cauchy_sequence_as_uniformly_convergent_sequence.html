<span id="ID-998adb0b-863e-42da-bc7e-6f6c80ca9159"></span><h1 class="title">uniformly cauchy sequence as uniformly convergent sequence</h1>

<h2 id="proposition">Proposition</h2>
<p>
Any sequence $f_n: M \rightarrow N$ into a <a href="20221124122659-vollstandiger_metrischer_raum.html#ID-d68e391c-415a-49a8-93ce-0b1de559796d">complete metric space</a> $N$ which is <a href="20250702-uniformly_cauchy_sequence_of_functions.html#ID-b546bbb9-0b53-44ee-baa8-257de8b308a1">uniformly cauchy</a> is also <a href="20230110113621-gleichmaßige_konvergenz_einer_funktionenfolge.html#ID-e895942f-e89f-4078-875a-79790b2e125b">uniformly convergent</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows as it is a pointwise condition and <a href="20220923193420-vollstandigkeitsaxiom_konvergenz_einer_cauchy_folge.html#ID-254d105a-5243-43b1-b91c-d66b1687dd04">Konvergenz einer Cauchy-Folge</a>
</p>
