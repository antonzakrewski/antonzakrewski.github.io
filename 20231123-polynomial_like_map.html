<span id="ID-567bc93a-ed92-447c-af68-4b6d10b4234d"></span><h1 class="title">polynomial-like map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $B \subseteq A$ a <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">subset</a> and $g: A \rightarrow A$ a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>.
Then $A$ is said to be polynomial-like on $B$, if there exists a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a> $f \in A[X]$ such that for <a href="20221013222501-fast_alle.html#ID-a3da14cb-05c1-4f9e-a68a-a693980f5ede">almost all</a> $b \in B$, it holds:
</p>

<div class="math-block">\begin{align*}
f(b) = g(b)
\end{align*}</div>
