<span id="ID-a1a08852-83cc-4d99-a165-add55a10a4ef"></span><h1 class="title">Vanishing set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $T \subseteq A$, then the vanishing set is defined as
</p>

<div class="math-block">\begin{align*}
V(T) \coloneqq \{\mathfrak{p} \in \mathrm{Spec}(A) \vert T \subseteq \mathfrak{p}\} \subseteq \mathrm{Spec}(A)
\end{align*}</div>
