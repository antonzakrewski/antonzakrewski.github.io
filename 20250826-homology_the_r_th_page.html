<span id="ID-6450f22d-cb86-4aa5-a69e-76b3241a2109"></span><h1 class="title">homology at the r-th page</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-abelian_category.html#ID-9003af72-f684-4897-b096-c1d8a681c624">abelian</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $E_r$ an <a href="20250826-r_th_page_of_a_spectral_sequence.html#ID-692a5c39-e145-465d-8e11-d5985bd90fcb">r-th page</a>.
Then the homology of the \(r\)-th page at $p,q \in \mathbb{Z}$ is given by
</p>

<div class="math-block">\begin{align*}
H^{p,q}(E_r) \coloneqq \mathrm{ker}(d_{r}^{p,q})/\mathrm{im}(d_{r}^{p+r,q-r+1})
\end{align*}</div>
