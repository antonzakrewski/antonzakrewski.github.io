<span id="ID-ea4b38c7-ee0d-44ce-be36-68ad18e0b6ad"></span><h1 class="title">category of cartesian fibrations</h1>

<h2 id="definition">Definition</h2>
<p>
The category of cartesian fibrations is defined as  <a href="20240711-sub_infinity_category.html#ID-79df3d53-7239-474c-bfa4-a3fdbcf588d6">infinity subcategory</a> of the <a href="20240924-infinity_slice_category.html#ID-62e46e6b-dcf7-4ba7-8e8a-92bc1476d165">infinity slice category</a> $\mathrm{Cat}_{\infty}/B$ spanned by <a href="20241016-cartesian_fibration.html#ID-a7be8182-5c04-4496-9ddf-6de20e26470b">cartesian fibrations</a> of $B$ and <a href="20241016-morphism_of_cartesian_fibrations.html#ID-3a236cef-8acf-4aee-aef3-f665ccf3f461">morphism of cartesian fibrations</a>
</p>
