<span id="ID-91ae2b75-c0ff-4855-a312-59815d68607a"></span><h1 class="title">euclidean space as contractible space</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20221003093835-euklidischer_raum.html#ID-66f09aad-4268-439b-8f87-f160abb19672">euclidean space</a> $\mathbb{R}^n$ is <a href="20230330173711-kontraktibler_raum.html#ID-97035c96-d3da-46f5-afad-856a662cb0e5">contractible</a>
</p>

<h2 id="proof">Proof</h2>
<p>
Given by
</p>

<div class="math-block">\begin{align*}
H: \mathbb{R}^n \times [0,1] \rightarrow&amp; \mathbb{R}^n \\
((x_1,...,x_n),t) \mapsto&amp; (1 - t) \cdot (x_1,...,x_n)
\end{align*}</div>
