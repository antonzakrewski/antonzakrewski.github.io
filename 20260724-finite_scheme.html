<h2 id="definition">Definition</h2>
<p>
Let $k$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>.
Then an <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic k-functor</a> $X$ is said to be finite, if there exists a <a href="20231102-finitely_generated_integral_algebra.html#ID-efb485ec-07cb-4d65-8ebd-0f77fae15e56">finitely generated k-Algebra</a> $A$ such that
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(A) \cong X
\end{align*}</div>
