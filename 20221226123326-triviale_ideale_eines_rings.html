<span id="ID-f2da2bcb-33cf-4c2b-b686-68e3e626ed41"></span><h1 class="title">triviale Ideale eines Rings</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">Ring</a>, dann sind $I = R$ und $I  = \{0\}$ die triviale Ideale
</p>

<h2 id="beweis">Beweis</h2>

<h3 id="i-r">$I = R$</h3>
<p>
folgt aus der <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">Idealdefinition</a>
</p>

<h3 id="i-0">$I = \{0\}$</h3>
<p>
$\{0\}$ ist eine <a href="20221022204229-triviale_untergruppen.html#ID-6e7b45ba-6c76-41a3-909f-970cd9c64dd9">triviale Untergruppe</a> und es gilt für $r,r' \in R$:
</p>

<div class="math-block">\begin{align*}
r \cdot 0 \cdot r' = 0 \in I
\end{align*}</div>



</div>
