<span id="ID-b278b44f-3b4a-448f-a617-2de0b3151505"></span><h1 class="title">noetherian abelian category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20240308-ab5_category.html#ID-e7f6fe0a-037c-45e4-940a-37c6c1b068a3">Ab5</a> category.
Then $\mathcal{A}$ is said to be noetherian, if there exists a <a href="20241016-small_infinity_category.html#ID-e28e9ce9-b62e-4ca8-a8d5-6416d476582a">small</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of <a href="20260514-noetherian_object.html#ID-f28b4969-9bb3-479b-8fd8-9b7c5b4b3da7">noetherian</a> generators.
</p>
