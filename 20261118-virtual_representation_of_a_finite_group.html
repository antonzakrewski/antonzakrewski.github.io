<span id="ID-26216a06-b8b9-41c2-87d8-1cd8cf3fe019"></span><h1 class="title">virtual representation of a finite group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a> and $k$ a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>
Then a virtual representation is an object in the <a href="20261118-representation_ring_of_a_finite_group.html#ID-d70c3610-150a-49b5-b1e9-f7fe8808f1e9">representation ring</a>
</p>

<div class="math-block">\begin{align*}
\pi_0((\mathrm{Rep}_{k[G]}^{\mathrm{findim}}, \oplus)^{\mathrm{grp})
\end{align*}</div>
