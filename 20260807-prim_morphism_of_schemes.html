<span id="ID-116c2cf0-b877-4a80-9733-5329dc0dcac8"></span><h1 class="title">prim morphism of schemes</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: Y \rightarrow X$ be a morphism of <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">schemes</a>
Then $f$ is said to be prim, if it is <a href="20230915-locally_finite_type_morphism.html#ID-b609f4d8-f04c-472e-bd82-fb8298fca9e2">locally finite type</a> and <a href="20240226-universally_closed_morphism.html#ID-c79880a2-53de-4972-bbf7-7394e9a77ea7">universally closed morphism</a>.
</p>
