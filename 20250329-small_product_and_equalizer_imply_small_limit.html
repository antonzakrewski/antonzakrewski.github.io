<span id="ID-8237400a-add6-4f90-bb76-271d985ea301"></span><h1 class="title">small product and equalizer imply small limits</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a> which admits
</p>
<ol>
<li><a href="20241017-infinity_product.html#ID-07afb527-f81d-470f-946f-dfcac235ce22">products</a></li>

<li><a href="20250330-infinity_equalizer.html#ID-f0870543-f04a-493b-9372-90bb827dbe96">infinity equalizer</a> </li>
</ol>
<p>
Then $\mathcal{C}$ is <a href="20241017-complete_infinity_category.html#ID-ad2a4f6e-d8da-4193-90eb-96b36291cd9c">complete</a>
</p>
