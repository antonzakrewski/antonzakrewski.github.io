<span id="ID-695633c5-73bf-4677-9635-12e3c8c10ec1"></span><h1 class="title">right orthogonal morphisms</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be an <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity category</a>, $S \subseteq \mathcal{C}_1$ a subcollection of morphisms.
Then the set of right orthogonal morphisms $S^\bot$ is defined as set of morphism which are right <a href="20241109-orthogonal_morphisms.html#ID-c49531c1-c888-42cc-a9d2-3507006f0851">orthogonal</a> to each $f \in S$
