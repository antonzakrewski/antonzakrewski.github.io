<span id="ID-7a6e8e50-f0be-45b9-9731-4cde682e27cd"></span><h1 class="title">homology sphere_</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Then $X$ is said to be a homology n-sphere, if
</p>

<div class="math-block">\begin{align*}
H_l(X) \cong 
    \begin{cases}
    \mathbb{Z} &amp; \mbox{if } l \in \{0,n\}  \\
    0  &amp; \mbox{else } \\  
    \end{cases}
\end{align*}</div>
