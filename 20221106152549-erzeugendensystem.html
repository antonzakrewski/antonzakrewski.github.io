<span id="ID-f76ea8a6-1176-46cf-a300-c2312e60e6d8"></span><h1 class="title">Erzeugendensystem eines Vektorraums</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a> und $A \subseteq V$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> an <a href="20210217215228-vektor.html#ID-be50263b-d29c-41c5-9909-2f5e106dc49c">Vektoren</a>.
$A$ ist ein Erzeugendensystem wenn gilt:
</p>

<div class="math-block">\begin{align*}
\langle A \rangle = V
\end{align*}</div>
