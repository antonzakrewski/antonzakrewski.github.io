<span id="ID-16393361-ffc9-4082-94be-0641c7d476f6"></span><h1 class="title">boxtensor as right anodyne and component as right anodyne</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\iota: A \rightarrow B, g: S \rightarrow T$ be <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a> between <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a>.
Suppose $\iota$ or $g$ is an <a href="20240327-right_anodyne_map.html#ID-eb1ada66-cba3-4202-9ad9-dda3033b88b7">right anodyne map</a>
</p>

<p>
Then so is the <a href="20240429-boxtensor_of_morphisms.html#ID-009efabf-6ba7-4845-a3f9-07ce51b7fa72">boxtensor</a>
</p>

<div class="math-block">\begin{align*}
\iota \boxtimes g
\end{align*}</div>
