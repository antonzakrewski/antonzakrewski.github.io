<span id="ID-f39eaa32-a3fa-424c-9ccd-435de602ca32"></span><h1 class="title">central algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> and $A$ an <a href="20221228202836-r_algebra.html#ID-f1401a23-6bbb-4e91-812e-071fddeb1e67">R-Algebra</a>.
then $A$ is said to be central, if the <a href="20230227145122-zentrum_eines_rings.html#ID-120e0a50-2df7-4ef2-bbb9-c0df32af2135">center</a> is given by $R$.
</p>
