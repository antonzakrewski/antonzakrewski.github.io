<span id="ID-299ff3ee-fec9-413d-9de6-2126263a46b6"></span><h1 class="title">codimension of a cycle</h1>

<h2 id="definition">Definition</h2>
<p>
Let $T$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $A$ a <a href="20230722-kommutativer_monoid.html#ID-ccce1563-27e5-4b33-bbf8-255cccb94f44">commutative monoid</a> and $n \in \mathbb{N} \cup \{\infty\}$
Then a cycle $\sum_{V} a_V \cdot V$ has codimension $n$ if $a_{V} = 0$ whenever $\mathrm{codim}(V,X) \neq n$.
</p>
