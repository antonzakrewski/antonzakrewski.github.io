<span id="ID-42cd7600-d3fd-4c7d-b34f-fcc264bee308"></span><h1 class="title">free abelian group</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a>, so ist die freie abelsche Gruppe $G[X]$ definiert als <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> der Ausdrücke der Form
</p>

<div class="math-block">\begin{align*}
g = \sum_{x \in X} m_x x
\end{align*}</div>
<p>
wobei $m_x \in \mathbb{Z}$ mit <a href="20221013222501-fast_alle.html#ID-a3da14cb-05c1-4f9e-a68a-a693980f5ede">fast allen</a> $m_x = 0$.
</p>
