<span id="ID-8e16fe67-278e-4160-856b-a212db6ec0de"></span><h1 class="title">spectrum of a PID</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221130163614-hauptideal.html#ID-753ccf8e-7022-43b7-af18-0d3e1db9bcdb">principal ideal domain</a>, then the <a href="20230725-zariski_spectrum.html#ID-be298171-f5f5-4ad4-8574-afe3257110d2">zariski spectrum</a> is
</p>

<div class="math-block">\begin{align*}
\mathrm{Spec}(R) =&amp; \mathrm{Spec}_{\mathrm{max}}(A) \sqcup \{0\}
\end{align*}</div>
<p>
see: <a href="20230725-maximal_spectrum.html#ID-cd24fddf-34c6-4ad3-9c28-a1b5eb90ad46">maximal spectrum</a>
</p>
