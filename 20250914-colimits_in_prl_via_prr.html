<span id="ID-eed920a1-a887-442f-838f-a2aba8fe9f5b"></span><h1 class="title">colimits in PrL via PrR</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $I \rightarrow \mathrm{Pr}^L$ be a <a href="20241109-infinity_commutative_diagram.html#ID-2786f5c6-8d4d-4a25-87fb-1202aaa103a7">diagram.</a>
Then the <a href="20241016-colimit_in_an_infinity_category.html#ID-de45d65c-0326-401d-93b3-f10a929be459">colimit</a> is given by
</p>
<ol>
<li>passing to $\mathrm{Pr}^R$</li>

<li>forgetting to <a href="20240331-category_of_infinity_categories.html#ID-32071eab-bd49-4ebf-a9d6-8748f98c28e1">category Cat</a> $\mathrm{Cat}$   </li>
</ol>

<p>
use:
</p>
<ul>
<li><a href="20250317-anti_equivalence_of_prl_and_prr.html#ID-1d8d9240-4b6e-47f7-a38c-027931cc0c6b">anti-equivalence of PrL and PrR</a> </li>

<li><a href="20260414-forgetful_functor_from_prr_to_cat_preserves_limits.html#ID-a65f05bc-43ad-4e45-b10f-e0d04f157e30">forgetful functor from PrR to Cat preserves limits</a> </li>
</ul>
