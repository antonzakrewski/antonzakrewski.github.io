<span id="ID-f3bb5362-11d5-45bd-85d2-9e993bda942d"></span><h1 class="title">zeroth projective space is the final scheme</h1>

<h2 id="proposition">Proposition</h2>
<p>
The functor $\mathbb{P}_k^{0}$ is the <a href="20260712-final_scheme.html#ID-e915d794-e07a-4431-9f6e-34d233dc4da2">final scheme</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
follows as the only quotient of the <a href="20241017-infinity_zero_object.html#ID-ec40b632-b794-428c-b987-81a9b53bd650">zero object</a> is the <a href="20241017-infinity_zero_object.html#ID-ec40b632-b794-428c-b987-81a9b53bd650">zero object</a> (which happens to be a quotient line)
</p>
