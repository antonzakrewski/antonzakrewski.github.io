<span id="ID-a9892e0c-f4dc-45b4-b8c0-57231e4e3138"></span><h1 class="title">negative Binomialverteilung</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $r &gt; 0, p \in (0,1)$, dann ist die Negative Binomialverteilung definiert als <a href="20241014-wahrscheinlichkeitsmaß.html#ID-e70fc7d3-0fc7-474f-9401-a6272df7991a">Wahrscheinlichkeitsmaß</a> mit Zähldichte
</p>

<div class="math-block">\begin{align*}
\rho(k) =&amp; \binom{r+k-1}{k} \cdot (1- p)^k p^r
\end{align*}</div>
