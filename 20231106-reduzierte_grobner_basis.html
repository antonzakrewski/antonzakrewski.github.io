<h2 id="definition">Definition</h2>
<p>
Eine reduzierte Gröbner basis ist eine <a href="20231030-grobner_basis.html#ID-1743b7a4-d1c8-4e3e-96c0-6c2b208fdb47">Gröbner basis</a> $G = \{f_1,...,f_n\}$ so dass gilt
</p>
<ol>
<li>$\mathrm{LC}(f_i) = 1$</li>

<li>für alle $f_i \in G$ liegt kein Monom von $f_i \in \langle \mathrm{LT}(G) \setminus \{f_i\}\rangle$</li>
</ol>
