<span id="ID-62781d9d-7b1e-4658-b5ae-aab7564aeba7"></span><h1 class="title">restricted topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $Y$ a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $\iota: Y \rightarrow X$ a set-theoretic <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injection</a>.
Then the restricted topology is defined as <a href="20230223225929-initialtopologie.html#ID-c3a212d4-4f8e-44b6-a3e6-91932f8ea153">initial topology</a> on $Y$
</p>
