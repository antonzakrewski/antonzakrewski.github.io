<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{A})$ ein <a href="20230302132218-messraum.html#ID-7d8d7a50-6fe1-4cee-a847-365b73490c86">Messraum</a>, $\mu,\nu$ <a href="20241014-measure.html#ID-fad27267-4c6a-4159-831f-36ae94e4012e">Maße</a>.
Dann sind $\mu$ und $\nu$ zu einander singular, falls ein $A \in \mathcal{A}$ existiert mit
</p>

<div class="math-block">\begin{align*}
\mu(A) = \nu(A^c) = 0
\end{align*}</div>
