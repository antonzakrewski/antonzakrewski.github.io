<span id="ID-98ae6886-9cd6-49ba-8dc2-433761b1397c"></span><h1 class="title">egressive morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{W}$ be a <a href="20250621-waldhausen_infinity_category.html#ID-473e0213-34a1-428c-963e-a2cfa3366bc7">waldhausen category.</a>
Then a morphism $p: y \rightarrow z$ is said to be egressive, if there exists an ingressive morphism $f: x \rightarrow y$ which fits into a <a href="20241022-cofiber_of_an_infinity_morphis3.html#ID-c9321dad-6e04-418b-a0a5-ad8546205938">cofiber</a> sequence
