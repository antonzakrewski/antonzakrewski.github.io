<span id="ID-3187e8de-8196-4274-a57c-5d56b12abe90"></span><h1 class="title">pullback of a subfunctor</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A \hookrightarrow B$ be a <a href="20230922-subfunctor.html#ID-e3017b76-a5ac-43b3-a458-b3ede2132fec">Subfunctor</a>.
Then for any morphism $C \rightarrow B$, the <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a> $A \times_{B} C \rightarrow C$ is also a subfunctor.
</p>
