<span id="ID-f8531118-7ba0-436c-8248-8eafefa0f20b"></span><h1 class="title">trivial representation</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, $V$ a <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">vector space</a> over $K$.
Then the trivial representation on $V$ is given by the <a href="20230402144657-zero_morphism.html#ID-6cb7ce09-7038-4581-bc67-91d231a2be10">zero morphism</a>
</p>

<div class="math-block">\begin{align*}
G \rightarrow \mathrm{Aut}_{K}(V)
\end{align*}</div>
