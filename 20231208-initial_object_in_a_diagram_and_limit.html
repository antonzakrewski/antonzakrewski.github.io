<span id="ID-ed9a7a57-522b-416e-abb3-689907326572"></span><h1 class="title">initial object in a diagram and limit</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{I}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $1 \in \mathcal{I}$ an <a href="20220825145505-initiales_objekt.html#ID-7ad29aa1-f819-4a5b-8ef9-24c92a84802f">initial object</a> and $I: \mathcal{I} \rightarrow \mathcal{C}$ a <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a> for a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> $\mathcal{C}$.
</p>

<p>
Then the <a href="20230725-limit_category_theory.html#ID-b1acaf40-c197-4df4-aec7-af30557ea689">limit</a> $\lim_{I}$ is $I(\emptyset)$
</p>
