<span id="ID-ee35e9cb-f41f-46de-ae7e-6929dff58d2a"></span><h1 class="title">regular sequence in a local ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(R, \mathfrak{m})$ be <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local ring</a>.
Then a regular sequence is a sequence $f_n \in \mathfrak{m}$ such that $f_n$ is not a <a href="20221226125328-nullteiler.html#ID-dc985755-3df5-4b03-929e-659ee65ad000">zero divisor</a> in $R/(f_1,...,f_{n-1})$ and $f_n \not\in (f_1,...,f_{n-1})$.
</p>
