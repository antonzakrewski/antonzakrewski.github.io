<span id="ID-380e9328-1ac3-4bfa-943e-b37e51c5634d"></span><h1 class="title">Additionstheoreme - Sinus</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
\sin(x+y) =&amp; \sin(x) \cdot \cos(y) + \cos(x) \cdot \sin(y) \\
\sin(x-y) =&amp; \sin(x) \cdot \cos(y) - \cos(x) \cdot \sin(y)
\end{align*}</div>
