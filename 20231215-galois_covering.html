<span id="ID-8d042bfa-46b8-4a8f-b2f6-9e24b4d434c1"></span><h1 class="title">galois covering</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $p: E \rightarrow B$ a <a href="20230729-covering_map.html#ID-b817dc02-5dea-4e8d-8ccd-adf7ef14e6bc">covering map</a>.
Then $p$ is said to be a galois covering, if for $b \in B$ the <a href="20231228-deck_action_on_a_fibre.html#ID-9d09d2ef-648d-423e-9403-78bbe4b84bc8">deck action on the fibre</a> is <a href="20230802-transitive_group_action.html#ID-60b1288f-e80e-4738-8775-5c1360fdf2ec">transitive</a>
</p>
