<span id="ID-c4b4d8b5-f6b0-484d-b0b0-7a7b32900bc7"></span><h1 class="title">metrische Sphäre</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(M,d)$ ein <a href="20221002145259-metrischer_raum.html#ID-6b95a0b5-83e0-43cc-830f-05b416769fe1">metrischer Raum</a>, $m \in M$ und $r &gt; 0$
Dann ist die metrische Sphäre definiert als:
</p>

<div class="math-block">\begin{align*}
S_{r}(m)  \coloneqq \{x \in M \vert d(x,m) \leq r\}
\end{align*}</div>
