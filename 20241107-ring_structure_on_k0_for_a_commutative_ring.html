<span id="ID-7a650215-54cc-48e9-a8b3-15949051dce7"></span><h1 class="title">ring structure on K0 for a commutative Ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, then the <a href="20241011-k0_of_a_ring.html#ID-d82bf086-c3d3-444b-abaf-919a7b964832">K0 group</a>  $K_0(R)$ admits a ring structure given by
</p>

<div class="math-block">\begin{align*}
[P] \cdot [Q] \coloneqq&amp; [P \otimes_R Q]
\end{align*}</div>
