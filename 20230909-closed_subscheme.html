<span id="ID-b9b24080-ff28-4be5-a5e1-b8c9cf0a2f3a"></span><h1 class="title">closed subscheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{O}_X, O_i)$ be a <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a>
A closed subscheme of $X$ is an equivalence class of <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a> where $f: Y \rightarrow X, f': Y' \rightarrow X$ are said to be equivalent, if there exists an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
