<span id="ID-bed90b50-4914-44b0-ac48-f08e54ea5fd8"></span><h1 class="title">topologically enriched Euc</h1>

<h2 id="definition">Definition</h2>
<p>
The topologically enriched category $\mathrm{Euc}$ is defined as <a href="20250905-topologically_enriched_category.html#ID-e59ccba6-7114-443d-9679-d9be664dd469">topologically enriched category</a> containing $\mathbb{R}^d$ and the <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspaces</a> of the <a href="20231103-compact_open_bifunctor.html#ID-063f0848-2e82-4e68-bc88-fe9c6cca022a">compact open</a> mapping spaces containing <a href="20230127080110-homeomorphismus.html#ID-9f615f4b-b7b4-4dd6-a222-b9ec170e4390">homeomorphisms</a> .
