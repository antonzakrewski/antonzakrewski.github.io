<span id="ID-43e401cf-cae9-40a1-9592-a0b5ace913a9"></span><h1 class="title">system of parameters of a ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20230727-dimension_ring.html#ID-408db5e1-620d-44b5-9b16-e4483521ff4a">dimensional</a> <a href="20230531093017-lokaler_ring.html#ID-55f224fa-39d9-4b7b-a771-9466ec684881">local</a>  <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $(a_1,...,a_r)$ be elements such that the
</p>

<div class="math-block">\begin{align*}
\sqrt{(a_1,...,a_r)} = \mathfrak{m}
\end{align*}</div>

<p>
Then $(a_1,...,a_r)$ is said to be a system of parameters
</p>

</div>
