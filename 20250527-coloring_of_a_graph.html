<span id="ID-666d729e-5330-4935-bd34-6e39d1bced72"></span><h1 class="title">k-coloring of a graph</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G = (V,E)$ be a <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">graph</a>, $k \in \mathbb{N}$.
A \(k\)-coloring is a map
</p>

<div class="math-block">\begin{align*}
\iota: V \rightarrow [k]
\end{align*}</div>
<p>
such that for all $uv \in E$
</p>

<div class="math-block">\begin{align*}
\iota(u) \neq \iota(v)
\end{align*}</div>
