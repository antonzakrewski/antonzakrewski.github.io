<span id="ID-5c24133d-ebe8-445c-bb1a-d2ec406c84f8"></span><h1 class="title">bimodule</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(R,S\) be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">rings</a>.
Then $(M,+)$ is said to be an \(R-S\)-bimodule, if $M$ is a left \(R\)-<a href="20221228203055-modul.html#ID-ac8be9d7-cfe7-4c79-b3b1-7e35780c8f57">module</a> and a right \(S\)-module such that
</p>

<div class="math-block">\begin{align*}
(r \cdot_R m) \cdot_S s = r \cdot_R (m \cdot_S s) 
\end{align*}</div>
<p>
for all $m \in M, r \in R, s \in S$
</p>
