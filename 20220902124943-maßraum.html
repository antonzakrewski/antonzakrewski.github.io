<span id="ID-5bbf8866-cd44-4090-9e26-37f6752275d5"></span><h1 class="title">measure space</h1>

<h2 id="definition">Definition</h2>
<p>
Ein Tripel $(\Omega, \mathcal{A}, \mu)$ heißt Maßraum, wenn gilt:
</p>
<ul>
<li>$\Omega$ ist eine nichtleere <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und heißt auch <a href="20220903142722-grundmenge.html#ID-2b5bcaae-5d96-4b8b-b31d-b77527fe22d3">Grundmenge</a> </li>

<li>$\mathcal{A$ eine <a href="20220903142815-sigma_algebra.html#ID-54306c73-fba1-4737-a42e-adc9ce14a354">Sigma-Algebra</a> über der <a href="20220903142722-grundmenge.html#ID-2b5bcaae-5d96-4b8b-b31d-b77527fe22d3">Grundmenge</a> $\Omega$ ist.</li>

<li>$\mu$ ein <a href="20220902125238-maß.html#ID-456f3153-5baa-4fe5-b3dc-749133c2c8d7">Maß</a> ist, das auf $\mathcal{A}$ definiert ist  </li>
</ul>
