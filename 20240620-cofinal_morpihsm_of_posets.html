<span id="ID-d49e17e3-a9d7-45d6-864f-8d6206227556"></span><h1 class="title">cofinal morphism of posets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $I,J$ be <a href="20230206161304-nach_oben_gerichtete_menge.html#ID-fb3ada67-6b7f-4e83-afa5-fc042405d94c">upward directed</a> <a href="20220817224852-halbordnung.html#ID-b8039fe5-626d-4ba3-93c7-71167141f163">partially ordered</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> and $f: I \rightarrow J$ a <a href="20230112105042-monotone_abbildung.html#ID-fd948c7c-4e32-4778-9b82-865df89f680a">monotone map</a>.
Then $f$ is said to be cofinal morphism, if for all $i \in I$ there exists some $j \in J$ such that $i \leq f(j)$
</p>
