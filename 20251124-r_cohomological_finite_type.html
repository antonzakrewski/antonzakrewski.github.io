<span id="ID-9618843f-fd77-4249-a33a-f8584d6ecdce"></span><h1 class="title">anima of R-cohomological finite type</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20240404-infinity_groupoid.html#ID-b516d6fd-fec1-4d8a-8efa-b2ad1f1bb283">anima</a>, $R$ a <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a>
then $X$ is said to be of \(R\)-cohomological finite type if $R^*(X)$ is a <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated module</a> over $\pi_0(R)$
</p>
