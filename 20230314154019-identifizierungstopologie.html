<span id="ID-0448c25b-5d42-4f16-b199-09c0035e2d8c"></span><h1 class="title">Identifizierungstopologie</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $(X, \mathcal{T})$ und $(X', \mathcal{T}')$ <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologische Räume</a> und $f: X \rightarrow X'$ als einer <a href="20230314154030-identifizierende_abbildung.html#ID-b746ac2a-31dd-4176-9cd4-b1c0123b0af1">identifizierenden Abbildung</a>.
Dann heißt $X'$ Identifizierungstopologie, falls $f$ <a href="20211230211341-surjektivitat.html#ID-f5a216d1-718b-43fa-89a8-01783cf1a290">surjektiv</a> ist.
</p>
