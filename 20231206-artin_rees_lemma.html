<span id="ID-c7b260b8-efd3-4910-9062-6fb14ce715c6"></span><h1 class="title">Artin-Rees Lemma</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $I$ be an <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a> in a <a href="20230725-noetherian_ring.html#ID-3bc5f76d-9774-4046-b432-697db6e9f77b">noetherian ring</a> and $M$ a <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated module</a> and $N$ a <a href="20230222204739-untermodul.html#ID-72f8c93c-c8cd-4dd0-b1c4-81e2efb54d75">submodule</a>
Then there exists an $k \geq 1$ such that for $n \geq k$
</p>

<div class="math-block">\begin{align*}
I^n M \cap N = I^{n-k}(M \cap N)
\end{align*}</div>
