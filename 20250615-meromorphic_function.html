<span id="ID-71f05274-296c-4d94-a848-1700fb7c36a2"></span><h1 class="title">meromorphic function</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: \Omega  \{z_n \vert n \in \mathbb{N}\} \rightarrow \mathbb{C}$ be <a href="20230306232528-holomorphe_funktion.html#ID-47dd90d3-19b3-4336-bf37-554413d69c02">holomorphic function</a>
Suppose $\{z_n\}$ does not have an <a href="20230111162157-haufungspunkt_einer_teilmenge.html#ID-71265239-598e-4a29-aa31-b48311a292fe">Accumulation point</a>, then  $f$ is said to be meromorphic in $\Omega$
</p>
