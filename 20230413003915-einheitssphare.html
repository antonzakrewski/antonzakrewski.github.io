<span id="ID-5ad34a63-284c-4eec-919d-9a5a67d6b1ee"></span><h1 class="title">n-sphere</h1>

<h2 id="definition">Definition</h2>
<p>
Given the <a href="20221003093835-euklidischer_raum.html#ID-66f09aad-4268-439b-8f87-f160abb19672">euclidean space</a> $\mathbb{R}^n$, the n-sphere $S^n$ is defined as:
</p>

<div class="math-block">\begin{align*}
S^n  \coloneqq \{x \in \mathbb{R}^{n+1} : \|x \| = 1\} \subseteq \mathbb{R}^{n+1}
\end{align*}</div>
