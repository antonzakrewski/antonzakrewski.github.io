<h2 id="definition">Definition</h2>
<p>
Seien $X_1,X_2$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">mengen</a> und $A \subesteq X_1 \times X_2$ eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a>
Dann ist für $x_1 \in X_1$ der \(x_2\)-Scnhnitt definiert als
</p>

<div class="math-block">\begin{align*}
A_{x_i} \coloneqq \{x_2 \in X_2 : (x_1,x_2) \in A\}
\end{align*}</div>
