<span id="ID-a275a20e-9384-4354-99f8-39ee827e2d7d"></span><h1 class="title">simple object</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity category</a>.
Then an object $C \in \mathcal{C}$ is said to be simple, if for every <a href="20250331-infinity_monomorphism.html#ID-8e516328-9c65-4ed3-b459-4751009c7c2a">infinity monomorphism</a> $\iota: A \rightarrow C$ and <a href="20250417-infinity_epimorphism.html#ID-561a98bd-c7aa-4bf5-bf2f-43521eb17c78">infinity epimorphism</a> $\pi: C \twoheadrightarrow B$ is <a href="20250602-infinity_nullhomotopic.html#ID-8c98d09a-aec4-4a98-bdbd-1113246040bd">nullhomotopic</a>.
</p>
