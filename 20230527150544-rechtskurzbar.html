<span id="ID-ac8ddcb7-1f17-4129-9827-bd3a2382191e"></span><h1 class="title">rechtskürzbar</h1>

<h2 id="definition">Definition</h2>
<p>
Seien $X,Y,Z$ <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a>, $g_1,g_2: Y \rightarrow Z$ und $f: X \rightarrow Y$ <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildungen</a>.
Dann ist $f$ rechtskürzbar, falls gilt:
</p>

<div class="math-block">\begin{align*}
g_1 \circ f = g_2 \circ f \Leftrightarrow g_1 = g_2
\end{align*}</div>
