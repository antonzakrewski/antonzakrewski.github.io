<span id="ID-ac81f75a-a242-4bf3-857a-0bed56782c50"></span><h1 class="title">endomorphism of A-Algebras</h1>

<h2 id="definition">Definition</h2>
<p>
Let $B$ be an <a href="20230722-a_algebra.html#ID-c3ba0b73-5545-48cc-9e90-81fda7909b5f">A-Algebra</a> for a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> $A$.
Then a <a href="20230726-morphism_of_a_algebras.html#ID-0b458fde-ab1b-4066-b6c3-f7cac22900d8">morphism of Algebras</a> $\varphi: B \rightarrow B$ is said to be an endomorphism, if both the <a href="20220923144547-definitionsmenge.html#ID-c15421d5-5e90-47e9-a0ef-ada73bf7f696">domain</a> and <a href="20220923144600-zielmenge.html#ID-d85b1698-8fce-41bb-a46d-947b20a638f6">codomain</a> coincide.
</p>
