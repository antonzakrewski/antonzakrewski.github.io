<span id="ID-2c9e3290-857f-418c-a6bd-fd7d6f65b8a1"></span><h1 class="title">fully faithful loop and pullback as pushout</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241022-finitely_bicomplete_infinity_category.html#ID-adaeedd8-b708-4be2-8551-771c459a6da7">finitely bicomplete infinity category</a>  <a href="20241017-pointed_infinity_category.html#ID-488f7c01-a376-4367-b36f-5d023ba572bf">pointed infinity category</a> such that the <a href="20241022-loop_functor_of_a_stable_infinity_category.html#ID-33f8cc50-742f-4636-a5ea-2cd078602f80">loop functor</a> is <a href="20240701-fully_faithful_functor_between_infinity_categories.html#ID-bb0d3e0e-92a5-4687-999c-a99d4043ea38">fully faithful</a>
Then each <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a> is also a <a href="20241017-infinity_pushout.html#ID-91244ae5-b853-45df-bbe0-af6ae9a8da47">pushout</a>
</p>

<h2 id="proof">Proof</h2>
<p>
dual to <a href="20250203-fully_faithful_suspension_and_pushout_pullback.html#ID-4edade0e-80e4-4170-981f-90932fcdc3a6">fully faithful suspension and pushout pullback</a>
</p>
