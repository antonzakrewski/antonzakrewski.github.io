<span id="ID-429fa356-93af-44df-8e14-5ef9efb1b381"></span><h1 class="title">difference: solvable group and nilpotent group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
</p>

<p>

</p>
<ol>
<li>$G$ is a <a href="20230808-solvable_group.html#ID-f168e64c-10ea-4dde-b86a-75dfc1e0e190">solvable group</a> where each $N_i \trianglelefteq N_{i+1}$ is not only a normal subgroup of $N_{i+1}$ but also of $G$</li>

</ol>
