<span id="ID-d3b2201d-34d2-4ddd-8245-ef3a236daee8"></span><h1 class="title">projection in a star algebra</h1>

<h2 id="definition">Definition</h2>
<p>
An element $p \in A$ in a <a href="20261015-category_of_star_algebras.html#ID-58317537-d12e-40b3-9598-4bf7e5a9c23b">star algebra</a> is said to be a projection, if it is a <a href="20261105-self_adjoint_element.html#ID-2dbd7512-bffe-41b1-a49e-325675ef3211">self-adjoint element</a> and $a^2 = a$.
