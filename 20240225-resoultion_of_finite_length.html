<span id="ID-c8883af0-7144-424f-8023-519368e4ae75"></span><h1 class="title">resolution of finite length</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}$ be an <a href="20230827-additive_category.html#ID-e50cd553-69ee-4360-bd27-43b73e7a9945">additive</a> <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a>, $M \in \mathrm{Ob}(\mathcal{A})$ an <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a>
Then a resolution of finite length is a <a href="20230903-left_resolution.html#ID-e89108bc-65a7-4d25-98a1-e02783af9995">resolution</a> $E_n$, where for <a href="20221013222501-fast_alle.html#ID-a3da14cb-05c1-4f9e-a68a-a693980f5ede">almost all</a> $n \in \mathbb{N}$ we get
</p>

<div class="math-block">\begin{align*}
E_n = 0
\end{align*}</div>
