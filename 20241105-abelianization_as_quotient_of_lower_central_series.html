<span id="ID-30850fa6-73c5-4634-b863-e95ba8e13aef"></span><h1 class="title">abelianization as quotient of lower central series</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>, then the <a href="20240109-abelianization_functor.html#ID-7b47ea27-7f41-41ed-ad5f-7eebea33ea64">abelianization</a> is given by
</p>

<div class="math-block">\begin{align*}
G^{\mathrm{ab}} = G/\Gamma^2(G)
\end{align*}</div>

<p>
see:

</ul>
