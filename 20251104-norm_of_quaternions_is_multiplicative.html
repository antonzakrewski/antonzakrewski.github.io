<span id="ID-2b0b0f18-9a45-4cd1-a72a-f99038369da5"></span><h1 class="title">norm of quaternions is multiplicative</h1>

<h2 id="proposition">Proposition</h2>
<p>
The <a href="20251104-norm_of_quaternions.html#ID-5500280a-e99a-4748-96ab-ededf852a799">norm of quaternions</a> is multiplicative, i.e.
</p>

<div class="math-block">\begin{align*}
N(x \cdot y) = N(x) \cdot N(y)
\end{align*}</div>
