<span id="ID-01107fe5-bbe1-4767-b5c8-eeebe73d9674"></span><h1 class="title">simple affine line has cofinite topology</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{A}_n^1$ the simple (?) affine line.
Then $\mathbb{A}_n^1$ has the <a href="20230207074108-finite_closed_topology.html#ID-faed368d-25e5-4118-b24c-807a634c9771">cofinite topology</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
corollary of:
</p>
<ul>
<li><a href="20230621-grad_eines_polynoms_und_maximale_anzahl_an_nullstellen.html#ID-cb0ef2c3-2474-4227-8e8c-bf3370322792">Grad eines Polynoms und maximale Anzahl an Nullstellen</a></li>
</ul>
<p>
since a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a> has <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">degree</a>
</p>
