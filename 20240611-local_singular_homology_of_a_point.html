<span id="ID-8afcdce9-ac24-4763-8e9f-6115cab9f0de"></span><h1 class="title">local singular homology of a point</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $x \in X$ and $M$ an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>
Then the local singular homology at $x$ with coefficients in $M$ is defined as
</p>

<div class="math-block">\begin{align*}
H^*(X, X \setminus \{x\}; M)
\end{align*}</div>
