<span id="ID-d2a7b7f0-4f5b-4695-b2db-a5025a020713"></span><h1 class="title">hermitian manifold</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a <a href="20230905-komplex_differenzierbare_mannigfaltigkeit.html#ID-73078df1-9429-41be-af61-85d3e07b5b4e">complex manifold</a>.
Then $M$ is said to be hermitian, if the <a href="20250512-complex_tangential_bundle.html#ID-7604a925-a5e7-4d4c-bf26-3e25ec9783b2">complex tangential bundle</a> $TM \rightarrow M$ is equipped with a <a href="20260122-hermitian_metric.html#ID-e82789ec-1725-4efa-b29a-0668402ed511">hermitian metric</a>.
</p>
