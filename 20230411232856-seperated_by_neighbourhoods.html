<span id="ID-841c9424-f6bf-4d07-bd06-05f23eace730"></span><h1 class="title">separated by neighbourhoods</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>.
Two points $x,y \in X$ are said to be separated by neighbourhoods, if there exist <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">neighbourhoods</a> $N_x \in \mathcal{N}(x), N_y \in \mathcal{N}_y$ such that $N_x \cap N_y = \emptyset$
</p>
