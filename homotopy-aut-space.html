<span id="ID-528ffd9d-4af4-42cd-b295-390e14044bd0"></span><h1 class="title">homotopy Aut space</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> in a <a href="20241016-category_of_convenient_spaces.html#ID-d5d11e5e-770e-4b79-9a6b-8cb18706a52f">convenient category of spaces</a>.
Then the homotopy Aut is defined as <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{hAut}(X) \subseteq \mathrm{Map}(X,X)
\end{align*}</div>
<p>
of the <a href="20240506-inner_hom_of_a_monoidal_category.html#ID-51259d89-25c3-4295-a9da-d1b1e7232780">mapping space</a> containing <a href="20240423-simplicial_homotopy_equivalence.html#ID-8c9e05e4-4626-4bad-91da-7d99541981f4">homotopy equivalences</a>
</p>

see:
