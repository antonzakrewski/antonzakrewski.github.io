<span id="ID-f76a7887-945a-4b2a-84bb-71a1d62afa78"></span><h1 class="title">Endlichkeit eines Netzes und Endlichkeit eines Teilnetzes</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $X$ eine <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> und $(I, \triangleleft)$ eine <a href="20230206161154-gerichtete_menge.html#ID-cd512190-83e1-4c9f-85f5-d2fc367cf4ff">Gerichtete Menge</a> sowie $(x)_I$ ein <a href="20230225212337-netz.html#ID-5cb7eafb-da4d-4b59-8bc4-215af31f6e6e">Netz</a> und $(x)_{J}$ ein <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endliches</a> <a href="20230225213331-teilnetz.html#ID-eeef5017-73f8-4481-953b-7ffb8121124f">Teilnetz</a>.
Dann ist $I$ <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endlich</a>
