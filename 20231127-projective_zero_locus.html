<span id="ID-8364d327-f96f-420b-aa58-8a17cce5d676"></span><h1 class="title">projective zero locus</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a>, $J \subseteq K[X_0,X_1,...,X_n]$ be a <a href="20230904-homogeneous_ideal.html#ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3">homogeneous ideal</a>.
Then the projective zero locus is defined as
</p>

<div class="math-block">\begin{align*}
Z(J) = \{P \in \mathbb{P}^n \vert f(P) = 0 \forall f \in J\}
\end{align*}</div>
