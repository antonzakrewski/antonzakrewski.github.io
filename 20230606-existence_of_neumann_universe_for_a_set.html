<span id="ID-d174bad1-c26e-484a-b49f-c0d1a7f88bde"></span><h1 class="title">Existence of neumann universe for a set</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $S$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a>, then there exists an <a href="20230516130028-ordinalzahl.html#ID-f638eb2b-0e4a-40c1-aac6-d3518403288b">ordinal</a> $\alpha$ such that $S \in V_\alpha$ (see: <a href="20230603121605-von_neumann_universe.html#ID-e65b9632-b1fb-4678-a5b7-db064e62d5e2">von neumann universe</a>)
</p>
