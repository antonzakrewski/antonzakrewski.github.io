<h2 id="proposition">Proposition</h2>
<p>
Sei $R$ ein <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $r,s \in R$.
Dann gilt
</p>

<div class="math-block">\begin{align*}
[e_{i,j}(r), e_{k,l}(s)] = 
    \begin{cases}
    1 &amp; \mbox{if } j \neq k, i \neq l \\
    e_{i,l}(rs)  &amp; \mbox{if } j = k, i \neq l \\  
    e_{k,j}(-sr) j \neq k, i = l 
    \end{cases}
\end{align*}</div>
