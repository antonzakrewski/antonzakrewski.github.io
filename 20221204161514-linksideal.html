<span id="ID-57b19243-1c18-4d75-9523-4e3413879578"></span><h1 class="title">left ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $\mathfrak{a}$ an additive <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a>.
Then $\mathfrak{a}$ is said to be a left ideal, if for $\alpha \in A, a \in \mathfrak{a}$
</p>

<div class="math-block">\begin{align*}
\alpha \cdot a \in \mathfrak{a}
\end{align*}</div>
