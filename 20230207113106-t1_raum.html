<h2 id="definition">Definition</h2>
<p>
Sei $X$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $p,p' \in X$ verschiedene Punkte.
$X$ heißt Frechet-Topologie falls jeweils eine <a href="20221002201955-umgebung_topologie.html#ID-9c77942e-5bf5-407a-b958-6f1c7651c1ec">Umgebung</a> $U, U'$ von $p,p'$ existiert mit $p \not\in U', p' \not\in U$
