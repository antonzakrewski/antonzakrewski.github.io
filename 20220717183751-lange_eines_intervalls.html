<span id="ID-f827c035-3f1b-47ed-9ef1-00d508fe5130"></span><h1 class="title">Länge eines Intervalls</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $I$ ein (beliebiges) <a href="20220401195853-intervall.html#ID-ea9ab8cb-ef38-4c06-bab0-d392820614f3">Intervall</a> mit <a href="20221126210401-randpunkt_intervall.html#ID-5959f978-a24f-4ece-83da-3a8056887daf">Randpunkten</a> $a$ und $b$
Dann gilt
</p>

<div class="math-block">\begin{align*}
\vert I\vert  \coloneqq \mathrm{diam}(I)  \coloneqq b - a
\end{align*}</div>
