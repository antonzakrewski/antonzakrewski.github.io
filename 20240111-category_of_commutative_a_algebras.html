<span id="ID-136b9f0f-b058-4509-ac0a-214a81d3ed35"></span><h1 class="title">Category of Commutative A-Algebras</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>
Then the category of commutative \(A\)-Algebras contains
</p>
<ol>
<li><a href="20231019-commutative_a_algebra.html#ID-95d0425a-7d4b-4446-8db2-2cd183655ce1">commutative A-Algebras</a> as <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> </li>

<li><a href="20230726-morphism_of_a_algebras.html#ID-0b458fde-ab1b-4066-b6c3-f7cac22900d8">morphism of A-Algebras</a> as <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> </li>
</ol>
<p>
i.e. <a href="20230402145452-coslice_category.html#ID-bdbe4411-02d7-4534-8788-2843a7007af4">coslice category</a> $\mathrm{CRing} \downarrow A$
</p>
