<span id="ID-734d1b01-757f-4222-a4e4-249489582077"></span><h1 class="title">reduced free R-module spectrum functor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a>, then the free \(R\)-<a href="20250621-module_over_a_ring_spectrum.html#ID-ff15d87e-6808-4cb5-ab80-8484014dbc6d">module spectrum</a> <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a> is defined as <a href="20240404-functor_between_infinity_categories.html#ID-7428dc84-9acd-49bc-8e93-b1541326a6b9">functor</a>
</p>

<div class="math-block">\begin{align*}
\mathrm{An}_* \rightarrow \mathrm{LMod}_{R}(\mathrm{Sp})
\end{align*}</div>
<p>
corresponding to $R$ under <a href="20260528-universal_property_of_pointed_anima.html#ID-dbed33a4-7798-46ca-8ba8-3b68e368bd80">universal property of pointed anima</a>
</p>
