<span id="ID-2259b1ae-6d2b-483a-af0a-a40e8426b996"></span><h1 class="title">quasi-compact morphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a> and $f: X \rightarrow Y$ be a morphism of algebraic functors.
Then $f$ is called quasi-compact, if for every morphisms $Z \rightarrow X$ with $Z$ <a href="20260716-quasi_compact_algebraic_functor.html#ID-91a6a538-b27d-44da-b253-16c2853f58a4">quasi-compact</a>, the <a href="20241017-infinity_pullback.html#ID-7aaac468-a0bb-4e73-bfd3-d4c591c10e4f">pullback</a> $Y \times_{X} Z$ is also quasi-compact.
</p>
