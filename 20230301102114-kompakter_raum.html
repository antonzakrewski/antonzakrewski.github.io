<span id="ID-42e72d20-188a-4a96-b46c-f62f622ff9c7"></span><h1 class="title">compact space</h1>

<h2 id="definition">Definition</h2>
<p>
A <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> $(X, \mathcal{T})$ is said to be compact, if ever <a href="20221125072633-offene_uberdeckung.html#ID-f64293ce-3838-4f49-b45d-07666123c2c9">open covering</a> has a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20221224121300-teiluberdeckung.html#ID-592bb00c-d4d2-4853-a393-ef6977c82437">subcover</a>.
</p>
