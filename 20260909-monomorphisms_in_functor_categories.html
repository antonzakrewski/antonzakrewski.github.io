<span id="ID-18e37422-49f3-4c65-9561-2fba04b22193"></span><h1 class="title">monomorphisms in functor categories</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> with <a href="20231018-finite_limit.html#ID-265414ac-0939-4106-ad91-4f3da00bd5bb">finite limits</a> and $\mathcal{D}$ any category
Then <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphisms</a> in $\mathrm{Fun}(\mathcal{D}, \mathcal{C})$ are precisely the pointwise monomorphisms.
</p>
