<span id="ID-717da644-e690-4904-a4b1-b225b1b525fd"></span><h1 class="title">Neutrales Element der Skalarmultiplikation</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">Vektorraum</a> über dem <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> $K$ und $1$  das <a href="20210702074906-neutrales_element_mathe.html#ID-2a95aac8-42e6-4724-9f37-15f6143a35ca">neutrale Element</a> der <a href="20210618082003-multiplikation.html#ID-040e85c2-7bda-4c97-956d-2c65ab4533e3">Multiplikation</a>.
Dann gilt für $v \in V$
</p>

<div class="math-block">\begin{align*}
1 \cdot v =&amp; v
\end{align*}</div>
