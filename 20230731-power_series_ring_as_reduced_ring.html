<span id="ID-918a9931-2e8e-48c1-ab3f-b8938f2b468d"></span><h1 class="title">power series ring as reduced ring</h1>

<p>

Then $A [ [X ] ]$ is a <a href="20230725-reduced_ring.html#ID-1480b16c-0de6-4614-9ae9-a70abea088a9">reduced ring</a>
