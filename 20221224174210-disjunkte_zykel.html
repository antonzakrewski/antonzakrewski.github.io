<span id="ID-893b920e-282b-4100-8fce-a51e438897fb"></span><h1 class="title">Disjunkte Zykel</h1>

<h2 id="definition">Definition</h2>
<p>
Seien zwei <a href="20221224174219-zykel.html#ID-2bc9ba37-5874-46bd-99c8-808058ddd68c">Zykel</a> $\tau  \coloneqq (a_1,a_2,...,a_k), \psi  \coloneqq (b_1,b_2,...,b_l)$ von der <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">Symmetrische Gruppe</a> $S_n$ gegeben.
</p>

<p>
$\tau$ und $\psi$ sind disjunkt, falls gilt:
</p>

<div class="math-block">\begin{align*}
\{a_1,...,a_k\} \cap \{b_1,..,b_l\} = \emptyset
\end{align*}</div>



</div>
