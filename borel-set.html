<span id="ID-3c327de6-6122-4cbe-b484-b0f20b46ae7d"></span><h1 class="title">borel set</h1>

<h2 id="definition">Definition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a>, $\sigma(\mathcal{T})$ the <a href="20241014-borel_sigma_algebra.html#ID-03e90bd5-7dfe-4619-a680-25ce9383fda0">borel-sigma algebra</a>.
Then a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> $A$ is borel set, if $A \in \sigma(\mathcal{T})$
</p>
