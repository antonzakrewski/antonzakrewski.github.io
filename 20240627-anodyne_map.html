<span id="ID-7a768c2a-63a0-43da-a820-3e480be801e3"></span><h1 class="title">anodyne map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $f: X \rightarrow Y$ be a <a href="20240129-morphism_of_simplicial_objects.html#ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89">morphism of simplicial sets</a>.
Then $f$ is said to be anodyne, if it has the <a href="20240404-left_lifting_property.html#ID-79b76b6b-ee9c-4690-ab83-c4323b803152">left lifting property</a> against <a href="20240429-kan_fibration.html#ID-1869d74a-d2cf-4e24-bd3a-10bb92fa3a49">kan fibrations</a>
</p>
