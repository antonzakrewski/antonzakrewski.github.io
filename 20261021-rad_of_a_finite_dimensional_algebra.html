<span id="ID-bb903971-94f4-43e4-ba9a-dec03c7db2aa"></span><h1 class="title">Rad of a finite dimensional algebra</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">finite</a> <a href="20220102135318-dimension.html#ID-3e484fb0-c9a8-485a-999b-4f0052bd13e4">dimensional</a> algebra over $k$.
Then let $\mathrm{Rad}(A) \subseteq A$ be the <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> of all elements in $A$ which act by zero on all <a href="20261013-irreducible_representation_of_an_algebra.html#ID-d63374c8-6c64-4ee3-bc2b-bd75c8272d12">simple A representation</a>
</p>
