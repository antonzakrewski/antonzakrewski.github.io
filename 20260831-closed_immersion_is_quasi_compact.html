<span id="ID-266f3961-da38-4d44-8525-39fbc02eef62"></span><h1 class="title">closed immersion is quasi-compact</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\iota: X \rightarrow Y$ be a <a href="20260714-closed_immersion_of_algebraic_functors.html#ID-4b057a1d-bcee-4370-ac04-155495eb236a">closed immersion</a>
Then it is a <a href="20260716-quasi_compact_morphism.html#ID-2259b1ae-6d2b-483a-af0a-a40e8426b996">quasi-compact morphism</a>
</p>

<h2 id="proof">Proof</h2>
<p>
follows from:
</p>
<ul>
<li><a href="20260717-pullback_of_closed_immersions.html#ID-0a4d94f9-2668-4aa6-911a-49ab02ba43f3">closed immersions are closed under pullbacks</a> </li>

<li><a href="20260807-closed_subfunctor_of_a_quasi_compact_functor_is_quasi_compact.html#ID-70d30367-d744-46c1-a185-9434755f5083">closed subfunctor of a quasi-compact functor is quasi-compact</a>   </li>
</ul>
