<span id="ID-8ac80967-bb44-4a0d-b2ed-3f8c5324cdfc"></span><h1 class="title">Vektorraum der Polynome und direkte Summe</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $K$ ein <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> und $K[X]$ der <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> der <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">Polynome</a>
Dann gilt
</p>

<div class="math-block">\begin{align*}
K[X] \cong \coprod_{n \in \mathbb{N}} K
\end{align*}</div>

<h2 id="beweis">Beweis</h2>
<p>
Folgt durch den <a href="20230227153105-vektorraumisomorphismus.html#ID-27b6dd7a-30ae-4eb8-b5c4-e1a268344d2e">Isomorphismus</a> $e_n \mapsto X^n$
</p>
