<span id="ID-df9bc86d-70ba-43d3-84ae-ae8068eddfe5"></span><h1 class="title">Waagrechte Asymptote bei 0 einer gebrochen rationalen Funktion</h1>

<h2 id="satz">Satz</h2>
<p>
Sei $f(x)$ eine <a href="20220102212658-definition_gebrochen_rationale_funkttionen.html#ID-1b393d0a-c72b-48ef-93c5-d28b8924d63b">gebrochen rationale Funktion</a>, so dass der der <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">Grad</a> des <a href="20220820190234-nennerpolynom.html#ID-0fa87e2d-0c0a-44aa-a0e7-258e1204c6a4">Nennerpolynoms</a> größer ist als der <a href="20220401194742-grad_polynom.html#ID-38057130-59af-422a-a717-372042339f5c">Grad</a> des <a href="20220820190239-zahlerpolynom.html#ID-1dd515c8-e4af-4c29-aee8-5a15fc45f274">Zählerpolynom</a>.
Dann besitzt der <a href="20220904165445-graph.html#ID-2de260cf-41c4-4dec-9ae9-450c507fda60">Graph</a> eine <a href="20210217182458-asymptote.html#ID-b4aa3557-6e90-4c8f-9ab9-6f96a1908e87">Asymptote</a> bei $y = 0$
</p>
