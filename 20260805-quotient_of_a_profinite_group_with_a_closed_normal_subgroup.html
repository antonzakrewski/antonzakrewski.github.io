<span id="ID-b41792ed-9a51-4308-8139-4b835393fdb2"></span><h1 class="title">quotient of a profinite group with a closed normal subgroup is a profinite group</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $N$ be a <a href="20221125122314-abgeschlossene_menge_topologie.html#ID-16e941fe-25c3-4e8b-9417-03ca5616c1df">closed</a> normal <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroup</a> of a  <a href="20250808-profinite_group.html#ID-871045b0-09aa-4aac-9208-5a8563158837">profinite group</a> $G$.
Then $G/N$ is also profinite.
</p>
