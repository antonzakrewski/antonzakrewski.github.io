<span id="ID-1a5c170c-2681-4dd5-b855-a87a2bf52008"></span><h1 class="title">bounded below graded A-module</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a $\mathbb{Z}$ <a href="20230904-graded_module.html#ID-5508d8a0-9b2a-476f-95ca-a6502e8eb0f9">graded module</a> over a <a href="20260514-connected_graded_a_algebra.html#ID-79609d15-81cc-487a-a5ae-a8b62204f1fe">connected graded R-Algebra</a> $A$.
Then $M$ is said to be bounded below, if there exists an $n_0$ such that $M_{n} = 0$ for $n &lt; n_0$
</p>
