<span id="ID-64de899a-df4f-4367-8375-211e1c1c6d42"></span><h1 class="title">complete intersection</h1>

<h2 id="definition">Definition</h2>
<p>
Let $K$ be a <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">field</a> and $\mathbb{A}_{K}^n$ the <a href="20230725-affine_space_over_a_field.html#ID-10df971c-c815-41df-b913-6d2255d56a66">affine space</a>.
An <a href="20230313162316-affine_varietat.html#ID-d401938b-d6e1-4d50-a84a-73eb4e945380">affine variety</a> $Y \subseteq \mathbb{A}_K^n$ is said to be a complete intersection, if the <a href="20230725-vanishing_ideal.html#ID-fadecab8-e770-4049-9226-525ea11f5cbc">vanishing ideal</a> $I(Y)$ is generated by $n - \mathrm{dim}(Y)$ elements.
</p>
