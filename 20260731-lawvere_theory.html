<span id="ID-e87314a9-4dea-4c5c-b1ad-5cbd4c2010c3"></span><h1 class="title">lawvere theory</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{T}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> with <a href="20250307-finite_infinity_products.html#ID-deea3950-a8f7-486d-88c3-19a27fd48f05">finite products</a>.
Then $\mathcal{T}$ is said to be a lawvere theory, if there exists a generic object $x \in \mathcal{T}$, that is each object $c \in \mathcal{T}$ is <a href="20241206-equivalent_objects_in_an_infinity_category.html#ID-cbb1ac2c-2755-4d4a-9a75-56978060b40f">equivalent</a> to $x^n$ for some $n \in \mathbb{N}$.
</p>
