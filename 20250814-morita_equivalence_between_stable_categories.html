<span id="ID-ce546fb9-6cd2-4952-8c54-3eb7ecd5d8e2"></span><h1 class="title">morita equivalence between stable categories</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{A}, \mathcal{B}$ be a <a href="20220819181004-kleine_kategorie.html#ID-3c3f1c0d-53ad-476e-810a-756acd885263">small</a> <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable</a> <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">infinity categories</a>
Then $\mathcal{A}$ and $\mathcal{B}$ are said to be morita equivalent, if their <a href="20241023-idempotent_completion_of_a_stable_infinity_category.html#ID-0c5d8a9e-83f3-4ce9-b299-85d8bc6caae7">idempotent completions</a> are <a href="20250813-abstractly_equivalent.html#ID-fce0d120-279b-4e94-ae55-4d6dca94d8a7">abstractly equivalent</a>
</p>
