<span id="ID-83655151-ea45-449a-b367-efa3318bdb54"></span><h1 class="title">bounded p-torsion abelian group</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be an <a href="20211008174655-abelsche_gruppe.html#ID-7281c9cf-564f-4c4c-8c3f-fc1424ac85f8">abelian</a> <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
Then $M$ is said to be a bounded \(p\)-torsion, if there exists a $k$ such that $M$ is a $\mathbb{Z}/p^k$ module.
</p>
