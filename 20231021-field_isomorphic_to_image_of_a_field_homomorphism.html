<span id="ID-78f0b9f7-c06c-4a81-9da2-5c630377fcbc"></span><h1 class="title">Field isomorphic to image of a field homomorphism</h1>

<h2 id="proposition">Proposition</h2>
<p>

Then $F \cong \varphi[F]$
