<span id="ID-24112b0c-e0ff-4f7f-a976-dcb89abcc08b"></span><h1 class="title">Koordinatenform: Punkt auf einer Ebene (Q12)</h1>

<h2 id="satz">Satz</h2>
<p>
Ein Punkt $\vec{P} = \begin{pmatrix} p_1 \\ p_2 \\ p_3 \end{pmatrix}$ liegt genau dann auf einer <a href="20220102143805-ebene.html#ID-9910f26c-7642-4457-a277-fff78834421c">Ebene</a> $E: a_1 x_1 + a_2 x_2 + a_3 x_3 + c =&amp; 0 $ in <a href="20220215083537-koordinatenform_darstellung_einer_ebene.html#ID-9992873e-8030-4f47-880b-50aadcf63cdc">Koordinatenform</a>, wenn gilt:
</p>

<div class="math-block">\begin{align*}
a_1 p_1 + a_2 p_2 + a_3 p_3 + c =&amp; 0
\end{align*}</div>
