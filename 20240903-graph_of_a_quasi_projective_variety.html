<span id="ID-bb0a8a76-e462-49e1-a89a-f55464def06e"></span><h1 class="title">graph of a regular map between quasi-projective variety</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X,Y$ be <a href="20230907-quasi_projective_variety.html#ID-7b70c39a-5b6f-4604-ad2c-e24b4d98ee60">quasi-projective variety</a>, $f: X \rightarrow Y$ a <a href="20240903-regular_map_on_quasi_projective_varieties.html#ID-6c16f5fa-bbb6-427e-878b-24be655ac3ad">regular map</a>
Then the graph is defined as
</p>

<div class="math-block">\begin{align*}
\Gamma_f \coloneqq \{(P, f(P) \vert P \in X\} \subseteq X \times Y
\end{align*}</div>
