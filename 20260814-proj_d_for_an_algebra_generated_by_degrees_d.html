<span id="ID-10424eb6-6bce-422b-9fbf-98e82f76e6c3"></span><h1 class="title">Proj_d for an algebra generated by degrees d</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $A$ be a <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">N-graded ring</a> and $d \in \mathbb{N}$ such that $A$ is generated as $A_0$ algebra by <a href="20230904-homogeneous_element_of_a_graded_ring.html#ID-fd539c7c-8b05-474a-bb3a-4c98614a5953">homogeneous elements</a> whose degrees divide $d$.
Then the map $\mathrm{Proj}_d(A) \rightarrow \mathrm{Proj}(A)$ is an <a href="20220817230532-isomorphismus_kategorientheorie.html#ID-8f539991-82c2-4cb3-a303-965a60282db5">isomorphism</a>
</p>
