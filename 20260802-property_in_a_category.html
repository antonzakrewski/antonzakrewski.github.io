<span id="ID-bd04268c-9bb1-4e3e-a384-1bb0bcd4b7da"></span><h1 class="title">property in a category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>, then a property $P$ of $\mathcal{C}$ is a <a href="20240701-fully_faithful_functor_between_infinity_categories.html#ID-bb0d3e0e-92a5-4687-999c-a99d4043ea38">fully faithful</a> functor $\mathcal{C}_0 \hookrightarrow \mathcal{C}$, where we say that an object $x \in \mathcal{C}$ has the property $P$ <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> it lies in the <a href="20240916-essential_image_of_a_functor.html#ID-21fdb2f0-df36-45a3-9da7-55fd74a0ead4">essential image.</a>
</p>
