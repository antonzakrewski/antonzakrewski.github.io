<span id="ID-78554746-4c37-4a9a-80ed-049a61803c64"></span><h1 class="title">comonoid</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>.
An <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">object</a> $M$ is said to be a comonoid, if $M$ in the <a href="20220830192239-duale_kategorie.html#ID-711d7a6e-e765-4a59-90a2-baeee955dea1">opposite category</a> is a <a href="20231110-monoid_object.html#ID-7038973c-0f82-4e3b-91c9-668311e01475">monoid object</a>
</p>
