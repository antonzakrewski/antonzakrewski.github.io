<span id="ID-e901d99b-72b4-49ae-af53-8fe3375ca5ee"></span><h1 class="title">Kern eines Monoidhomomorphismus als Untermonoid</h1>

<h2 id="satz">Satz</h2>
<p>
Seien $M,M'$ <a href="20210702075710-monoid.html#ID-ebccfd45-6c4b-4a93-818a-8f6848600874">Monoide</a> und $\varphi: M \rightarrow M'$ ein <a href="20230722-monoidhomomorphismus.html#ID-d97d8a1c-6fdb-446c-9006-22f08dae62f6">Monoidhomomorphismus</a>, wobei mit $e \in M$ ein <a href="20210702074906-neutrales_element_mathe.html#ID-2a95aac8-42e6-4724-9f37-15f6143a35ca">neutrales Element</a> existiert.
Dann ist der <a href="20230722-kern_eines_monoids.html#ID-489246b5-869c-456e-8974-a711ab190200">Kern</a> $\mathrm{ker}(\varphi) \subseteq M'$ ein <a href="20230524094139-untermonoid.html#ID-1fd4d539-ed15-4239-8302-43c57d9cb669">Untermonoid</a>.
</p>
