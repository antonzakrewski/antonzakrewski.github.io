<span id="ID-4b723c79-698b-40cf-ad6e-1b20de1300a9"></span><h1 class="title">euklidischer Ring</h1>

<h2 id="definition">Definition</h2>
<p>
Ein <a href="20221226125648-integritatsbereich.html#ID-d39ae041-9db9-423e-8655-20e929ceaf48">Integritätsbereich</a> $R$ ist ein euklidischer Ring, falls eine <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">Abbildung</a> $\phi: R \setminus \{0\} \rightarrow \mathbb{N}_0$ existiert so dass gilt:
Seien $x,y \in R$ mit $y \neq 0$.
Dann existieren $q,r \in R$ mit $x = qy + r$ mit: $r = 0 \lor \phi(r) &lt; \phi(y)$
</p>
