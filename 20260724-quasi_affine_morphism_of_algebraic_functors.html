<span id="ID-3dc15c66-2527-432c-9dc6-ffb8980bd803"></span><h1 class="title">quasi-affine morphism of algebraic functors</h1>

<h2 id="definition">Definition</h2>
<p>

Then $f$ is said to be quasi-affine (over $X$), if there exists $V \in $\mathrm{Aff}<span class="underline">{X}$ (cf. 1) and a 2 $I \in \mathrm{Rad}</span>{V}$
