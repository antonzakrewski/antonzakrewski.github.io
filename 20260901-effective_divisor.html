<span id="ID-8c74b5f9-27ed-40a5-83ea-5e9197e660bb"></span><h1 class="title">effective divisor</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20260612-scheme.html#ID-3297bf08-2100-4b5f-a1a1-af6ce3afde87">scheme</a>
Then an effective divisor is an <a href="20260901-effective_virtual_divisor.html#ID-744338eb-260b-4f49-85c3-827c8a87ebc3">effective virtual divisor</a> such that the map $s: L \rightarrow \mathcal{O}_{X}$ is a <a href="20220819135911-monomorphismus.html#ID-60b63797-32fa-4d4e-a577-7616faa010ba">monomorphism</a>
</p>
