<span id="ID-05b0c7bf-2407-4963-9c14-63deb190d8a9"></span><h1 class="title">Openness of a union of open sets</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be a <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">set</a> and $\mathcal{T}$ a <a href="20220930230520-topologie_auf_einer_menge.html#ID-1ced2edb-806d-4fb8-ada3-ca97b7ea1d10">topology</a> on $X$.
Then for any amount of <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">sets</a> $(A_i)_{i \in I}$, the <a href="20230317161154-allgemeine_vereinigung.html#ID-69c0d505-311b-4ea6-a337-8450d6529d02">union</a>
</p>

<div class="math-block">\begin{align*}
\bigcup_{i \in I} A_i 
\end{align*}</div>
<p>
is <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a>
</p>
