<span id="ID-a706e955-f502-4c0d-a14c-007c99104986"></span><h1 class="title">Multiplikation mit zwei negativen Zahlen</h1>

<h2 id="satz">Satz</h2>

<div class="math-block">\begin{align*}
(-x) \cdot (-y) =&amp; xy
\end{align*}</div>

<h2 id="beweis">Beweis</h2>

<div class="math-block">\begin{align*}
(-x) \cdot (-y) =&amp; (-1)\cdot x \cdot (-1) \cdot y \\
=&amp; (-(-1)) xy \\
=&amp; 1 \cdot xy \\
=&amp; xy
\end{align*}</div>
