<span id="ID-8f50ea30-b09a-4f1e-8d1b-2357d2b33540"></span><h1 class="title">I-adic completion of a ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $I$ a two-sided <a href="20221130163324-ideal_algebra.html#ID-f2c82320-35f7-47b4-8f53-0daa904668b2">ideal</a>.
Then the \(I\)-adic completion of $R$ is the <a href="20241025-infinity_sequential_limit.html#ID-f81b06d7-41a0-49a5-b7d2-2555cc9009f7">sequential limit</a>
</p>

<div class="math-block">\begin{align*}
\lim_{n \in \mathbb{N}} R/I^n
\end{align*}</div>
<p>
for the natural projection maps $R/I^{n+1} \rightarrow R/I^{n}$
</p>
