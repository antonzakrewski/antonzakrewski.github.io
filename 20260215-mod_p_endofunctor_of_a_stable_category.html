<span id="ID-5f88d226-6f9a-41ed-ae41-e6e2189199fe"></span><h1 class="title">mod n endofunctor of a stable category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{D}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a>
Then the mod n functor is given by
</p>

<div class="math-block">\begin{align*}
(-)_{//n}: \mathcal{D} \rightarrow&amp; \mathcal{D} \\
E \mapsto&amp; \mathrm{cofib}(E \xrightarrow{\cdot n} E)
\end{align*}</div>
