<span id="ID-d145af0e-3d97-4bdd-a156-5bf706b2976e"></span><h1 class="title">homotopy equivalence to a subspace does not imply a deformation retract</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $(X, \mathcal{T})$ be a <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological space</a> and $A \subseteq X$ a <a href="20231107-homotopy_equivalent_spaces.html#ID-fd6255f6-c435-4901-9aee-e640e09f73a3">homotopy equivalent</a> <a href="20230211132940-unterraumtopologie.html#ID-e38ab938-b4e6-4094-98a1-4a8dec808b54">subspace</a>.
then $A$ is in general not a <a href="20231110-deformation_retract.html#ID-e7f8f4a1-9a2c-4dcc-bd01-738119d56c0f">deformation retract</a>
</p>
