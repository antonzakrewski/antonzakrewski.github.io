<span id="ID-53eaae38-3a00-4e34-b97c-219c73695065"></span><h1 class="title">fully faithful functor reflects limits</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}, \mathcal{D}$ be <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">categories</a> and $\mathcal{F}: \mathcal{C} \rightarrow \mathcal{D}$ be a <a href="20230301211947-volltreuer_funktor.html#ID-85a359f5-50f6-4f57-ae10-c34278befc6c">fully faithful</a> <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functor</a>.
Then $\mathcal{F}$ <a href="20240110-functor_reflecting_limits.html#ID-f1f22ea7-3220-412e-b18b-fbec6f098110">reflects limits</a>.
</p>

<h2 id="proof">Proof</h2>
<p>
is <a href="20230225184720-dualitatsprinzip_kategorientheorie.html#ID-67ee9d5f-8348-4170-b8a2-c008b43afdf1">dual</a> to <a href="20240110-fully_faithful_functor_reflects_colimits.html#ID-0877cd27-9a9b-4676-92eb-5d9da80013d0">fully faithful functor reflects colimits</a>
</p>
