<span id="ID-e20880a1-49a6-45a3-8a23-a02d910a6a61"></span><h1 class="title">subnormal series</h1>

<h2 id="definition">Definition</h2>
<p>
Let $G$ be a <a href="20220723085230-gruppe_mathe.html#ID-b6023bc8-458a-44e4-982a-6623378f4b4f">group</a>.
A subnormal series is a <a href="20211222222916-folge_mathe.html#ID-dcb01772-a373-427f-99a6-5bd48bf9e042">sequence</a> $G_i$ of <a href="20220911122242-untergruppe.html#ID-ded4020a-b34f-4433-9d64-2afa33a552d8">subgroups</a> for $i \in \{1,...,n\}$:
</p>

<div class="math-block">\begin{align*}
1 = G_0 \triangleleft G_1 \triangleleft ... \triangleleft G_n = G
\end{align*}</div>
<p>
such that each $G_i$ is a <a href="20221210192900-normalteiler.html#ID-f971f946-d0ca-444a-a450-efbef237a278">normal subgroup</a> of $G_{i+1}$
</p>
