<span id="ID-eb1ada66-cba3-4202-9ad9-dda3033b88b7"></span><h1 class="title">right anodyne map</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A,B$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $g: A \rightarrow B$ a <a href="20220821182915-naturliche_transformation_kategorientheorie.html#ID-4e6e50c0-c0df-44ff-a140-bebfa492ef7e">natural transformation</a>
Then $g$ is said to be a right anodyne map, if it satisfies the <a href="20240404-left_lifting_property.html#ID-79b76b6b-ee9c-4690-ab83-c4323b803152">left lifting property</a> with respect to <a href="20240327-right_fibration.html#ID-cab43683-f467-4a4d-8c8e-9635ca3f01f1">right fibration</a> $f: X \rightarrow Y$
</p>
