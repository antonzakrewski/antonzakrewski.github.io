<span id="ID-b0c4ccc1-c6ec-4e4c-b213-1c5ec015b0a6"></span><h1 class="title">category of sheaves on a grothendieck topology</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a> and $\tau$ a <a href="20261022-grothendieck_topology.html#ID-3a1cec41-216c-4051-a698-4f39c6ae0857">grothendieck topology.</a>
Then the category of sheaves on $\mathcal{C}$ is defined as <a href="20240920-full_sub_infinity_category.html#ID-9e204c6a-f799-4623-ae56-89de8ef5a212">full subcategory</a> of $\mathcal{P}(\mathcal{C})$ containing <a href="20261022-sheaf_on_a_grothendieck_topology.html#ID-48e53950-f2e9-4b5b-9b2b-1c7756283b4a">sheaves</a>.
</p>
