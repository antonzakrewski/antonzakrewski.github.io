<span id="ID-9d1f4366-7535-41ca-bb72-967675fb06ab"></span><h1 class="title">subbasis</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $(X, \mathcal{T})$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a> und $\mathcal{S} \subseteq \mathcal{T}$ eine <a href="20211226213416-teilmenge.html#ID-6a977d06-68e6-4711-b15a-ce63378d53a8">Teilmenge</a>.
</p>

<p>
Dann ist $\mathcal{S}$ eine Subbasis, wenn die <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Menge</a> aller <a href="20211227215929-endliche_menge.html#ID-53523a13-c374-4332-a2d9-c49f03558e4d">endlicher</a> <a href="20230317161158-allgemeiner_schnitt.html#ID-d7547939-8d3f-48f8-b2fd-cfb5734ae78f">Durchschnitte</a> von $O_i \in \mathcal{S}$ eine <a href="20221002152517-basis_einer_topologie.html#ID-1a5a6999-876a-4b54-b786-acafe4968fd6">Basis der Topologie</a> bilden.
</p>
