<span id="ID-83ebb42d-53e8-4cdf-841e-753fe0ed1652"></span><h1 class="title">saturated ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be an <a href="20230904-graded_ring.html#ID-4b5d1725-b787-457e-ab10-5ff5daf130e6">N-graded ring</a> and $H \subseteq A$ a <a href="20230904-homogeneous_ideal.html#ID-bf7064ae-9b25-4910-b7a4-01d852c3c7d3">homogeneous ideal</a>.
Then $H$ is said to be saturated, if $H^{\mathrm{sat}} = H$.
</p>
