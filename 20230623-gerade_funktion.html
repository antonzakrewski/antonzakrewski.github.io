<h2 id="definition">Definition</h2>
<p>
Sei $D \subseteq \mathbb{R}$ und $f: D \rightarrow \mathbb{R}$ eine <a href="20220102212818-funktion.html#ID-795be04e-ea83-444e-8bb2-638ed125c97e">Funktion</a>.

</p>

<div class="math-block">\begin{align*}
f(x) = f(-x)
\end{align*}</div>
