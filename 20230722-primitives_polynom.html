<span id="ID-6e3269c2-5f47-463a-b6b4-23649b9775ec"></span><h1 class="title">primitive polynomial</h1>

<h2 id="definition">Definition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a> and $f = \sum_{i=0}^{n} \alpha_i X^i \in R[X]$ a <a href="20220102212857-definition_polynom.html#ID-a2f108fc-4631-45ea-bf8c-70182b7714f9">polynomial</a>.
Then $f \in R[X]$ is a primitive polynomial, if
</p>

<div class="math-block">\begin{align*}
(\alpha_n,...,\alpha_0) = R
\end{align*}</div>

see: <a href="20230722-erzeugendensystem_eines_ideals.html#ID-8fefc2d7-34d4-4591-91cc-67ebfdffb814">generated Ideal</a>
