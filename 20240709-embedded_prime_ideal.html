<span id="ID-9b5a4efd-cd72-4d66-8ca8-0cdf136b3d50"></span><h1 class="title">embedded prime ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathfrak{p} \in \mathrm{Ap}(A)$ be an <a href="20240529-associated_prime_ideal.html#ID-157a179a-c350-46b5-9c34-1891842ce076">associated ideal</a> to $\mathfrak{a} \subsetneq A$ for a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a> $A$.
Then $\mathfrak{p}$ is said to be an embedded prime ideal to $\mathfrak{a}$, if it is not an <a href="20240709-isolated_prime_ideal.html#ID-a0633d29-45a9-4088-9fc8-30e0c486a21e">isolated prime ideal</a> to $\mathfrak{a}$
</p>
