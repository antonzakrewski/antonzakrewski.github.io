<span id="ID-41e8c9cc-b1a5-46db-bcff-4d394c16f52a"></span><h1 class="title">morphism in a simplicial category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240708-simplicially_enriched_category.html#ID-69f91677-71a4-4b86-bf39-0bc75e403489">simplicial category</a>
Then a morphism in $\mathcal{C}$ is a morphism in the <a href="20240711-underlying_category_of_an_enriched_category.html#ID-44f2ece4-6254-404c-a3d6-daad6dbcb3c9">underlying category</a>, i.e. the $0$ simplices of $\underline{\mathrm{Hom}}(x,Y)$
