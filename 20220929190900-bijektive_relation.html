<span id="ID-db76861a-0c66-4757-9aa5-ab29ce020915"></span><h1 class="title">bijektive Relation</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R \subseteq X \times Y$ eine <a href="20211227225631-relation_mathe.html#ID-20e17f2d-e102-4093-8c48-e5b41db0ffbf">Relation</a> zwischen den <a href="20211008171333-menge.html#ID-30e3fc7a-7374-41d5-80da-a1dae2add239">Mengen</a> $X,Y$
$R$ ist genau dann bijektiv, wenn sie <a href="20220929184521-linkstotale_relation.html#ID-f199552a-6534-4730-ace4-3525bef8564c">linkstotale</a>, <a href="20220929184739-rechtstotale_relation.html#ID-53c4caf8-a645-4306-94cd-d01b717ed26d">rechtstotale</a>, <a href="20220929184817-linkseindeutige_relation.html#ID-ded50681-5d94-4844-9dcb-6864b7d6b9e1">linkseindeutige</a> und <a href="20220929184114-rechtseindeutige_relation.html#ID-c7365363-d56a-4677-b74b-d9d7546bb9b2">rechtseindeutige</a> ist, d.h.
</p>

<div class="math-block">\begin{align*}
\forall b \in B \exists a! \in A : (a,b) \in R
\end{align*}</div>
