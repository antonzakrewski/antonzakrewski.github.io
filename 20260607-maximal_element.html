<span id="ID-f3d8d501-4ab2-4fb9-adc8-9c7338d88519"></span><h1 class="title">maximal element</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M$ be a set and $&lt;$ a <a href="20211227225631-relation_mathe.html#ID-20e17f2d-e102-4093-8c48-e5b41db0ffbf">Relation</a> on $M$ and $W$ a subset.
Then an maximal element of $W$ is given by an element $m \in W$ such that $m &lt; w$  implies $m = w$
</p>


<h2 id="remark">Remark</h2>
<ul>
<li>think of maximal ideals, which are not upper bounds of the set of all ideals</li>
</ul>
