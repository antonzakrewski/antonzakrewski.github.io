<span id="ID-1dbd7880-380a-4cd9-b104-b516056f4e1c"></span><h1 class="title">epimorphism in the slice category</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20240404-simplicial_set_as_infinity_category.html#ID-4635a6ee-1ad5-44cb-8e36-4a934f5ae4bf">category</a>, $x$ an object in $\mathcal{C}$ and $\mathcal{C}_{/x}$ the <a href="20240924-infinity_slice_category.html#ID-62e46e6b-dcf7-4ba7-8e8a-92bc1476d165">slice category</a>.
Then a map in $\mathcal{C}_{/x}$ is an <a href="20220819135905-epimorphismus.html#ID-ad206194-a416-4910-a5c4-d72528ae5ba0">epimorphism</a> <a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">if and only if</a> it is an epimorphism in $\mathcal{C}$.
</p>
