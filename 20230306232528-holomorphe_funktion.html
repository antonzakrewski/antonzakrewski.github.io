<span id="ID-47dd90d3-19b3-4336-bf37-554413d69c02"></span><h1 class="title">holomorphe Funktion</h1>




<h2 id="definition">Definition</h2>
<p>
Let $\Sigma \subseteq \mathbb{C}$ be <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> and $f: \Sigma \rightarrow \mathbb{C}$ a <a href="20211230205349-abbildung_mengenlehre.html#ID-5b676c12-559b-4196-9d8d-eac358db0884">map</a>
Then $f$ is said to be holomorphic at $z_0 \in \Sigma$ if
</p>

<div class="math-block">\begin{align*}
f'(z_0) \coloneqq \mathrm{lim}_{h \rightarrow 0} \frac{f(z_0 + h) - f(z_0)}{h}
\end{align*}</div>

exists
