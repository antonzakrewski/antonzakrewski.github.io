<span id="ID-1c4a03f5-0ed4-416f-b7d4-021b146efe89"></span><h1 class="title">morphism of simplicial objects</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $A,B \in \mathrm{Simp}(\mathcal{C})$ be <a href="20230923-simplicial_object.html#ID-1501453f-3753-43db-ab32-9f7cf332945d">simplicial objects</a>.
Then a morphism $f: A \rightarrow B$ is a <a href="20220821182915-naturliche_transformation_kategorientheorie.html#ID-4e6e50c0-c0df-44ff-a140-bebfa492ef7e">natural transformation</a> between those <a href="20220821181056-funktor_kategorie.html#ID-31c2e5e6-98c4-4ed8-be83-5d7dafaa12d2">functors</a>
</p>
