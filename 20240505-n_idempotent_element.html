<span id="ID-5cff6556-1865-4af2-a03b-bbb9db8bbfe7"></span><h1 class="title">n-idempotent element</h1>

<h2 id="definition">Definition</h2>
<p>
Let \(A\) be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>, $\alpha \in A$ an element.
Then $\alpha$ is said to be \(n\)-idempotent, if
</p>

<div class="math-block">\begin{align*}
\alpha^n = \alpha
\end{align*}</div>
