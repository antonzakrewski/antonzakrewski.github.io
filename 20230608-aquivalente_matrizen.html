<span id="ID-f05c96d0-f2e4-46e4-a543-4407cc8135c8"></span><h1 class="title">äquivalente Matrizen</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $R$ ein <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>  und $A,B \in R^{n\times m}$ <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">Matrizen</a>
Dann sind $A,B$ ähnlich, falls invertierbare <a href="20220303181007-matrix.html#ID-3234cd94-0d93-470b-a319-75288f97326e">Matrix</a> $S \in \mathrm{GL}_{n}(R), R \in \mathrm{GL}_{m}(R)$ existieren mit
</p>

<div class="math-block">\begin{align*}
B = S \cdot A \cdot R
\end{align*}</div>
