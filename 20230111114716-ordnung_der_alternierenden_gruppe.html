<h2 id="satz">Satz</h2>
<p>
Sei $S_n$ die <a href="20221211194814-symmetrische_gruppe.html#ID-00bbd65b-c459-408d-a83c-306dee28d2f6">Symmetrische Gruppe</a> und $A_n$ die <a href="20221225141902-alternieredne_gruppe.html#ID-d4aeb80b-33a1-4ae6-a923-8437f50d7cf3">Alternierende Gruppe</a>.
Dann ist die <a href="20221225213606-ordnung_gruppe.html#ID-fb68b5de-9a0c-4c45-8ee9-eb232370ed2e">Gruppenordnung</a> von $A_n$:
</p>

\end{align*}</div>
