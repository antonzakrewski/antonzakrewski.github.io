<span id="ID-d6e011ce-d5ac-451f-9f13-685c289c03ec"></span><h1 class="title">function field of an integral scheme</h1>

<h2 id="definition">Definition</h2>
<p>
Let $X$ be an <a href="20230909-integral_scheme.html#ID-2b43eb0f-73f9-45de-9b15-3b2a4817a52b">integral scheme</a>.
Then the function field of $X$ is the <a href="20230603-residue_field.html#ID-5162f7b3-6c29-45b3-8d83-c5ed60d684a4">Residue field</a> of the <a href="20230807-generic_point.html#ID-5d852e38-1a27-4bef-9529-f01abd342f94">generic point</a> $\eta \in \vert X \vert$.
</p>
