<span id="ID-59a5b028-6707-4aff-b8fa-f470e1cd1234"></span><h1 class="title">von einem Vektor erzeugter linearer Unterraum</h1>

<h2 id="theorem">Theorem</h2>
<p>
Sei $V$ ein <a href="20220305210813-vektorraum.html#ID-ba2cd4b5-75e3-43c3-8ccb-d6ede91fab65">K-Vektorraum</a> über dem <a href="20211218210351-korper_mathe.html#ID-a602197a-6116-40b3-ae33-b421251bbb1e">Körper</a> $K$ und dem <a href="20210217215228-vektor.html#ID-be50263b-d29c-41c5-9909-2f5e106dc49c">Vektor</a> $v \in V$
Dann ist
</p>

<div class="math-block">\begin{align*}
K \cdot v \{\alpha \cdot v \vert \alpha \in K \} \subset V
\end{align*}</div>
<p>
ein <a href="20221009092955-unterraum.html#ID-854e21c6-b2ac-4d8c-b859-7797b3ddb35e">Unterraum</a> von $V$
</p>
