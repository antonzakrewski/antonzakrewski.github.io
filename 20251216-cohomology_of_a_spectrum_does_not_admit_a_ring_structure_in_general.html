<span id="ID-f6cb221a-ba57-44f5-9a25-8f17f56f6cd4"></span><h1 class="title">cohomology of a spectrum does not admit a ring structure in general</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20250604-ring_spectrum.html#ID-591ff318-1cac-44c2-90ea-6c84148de8eb">ring spectrum</a> and $X$ a <a href="20230914-spectrum_of_a_ring.html#ID-80de2982-9ef9-4a53-8c68-1e9612ff2447">spectrum</a>
Then $\mathrm{map}_{\mathrm{Sp}}(X,R)$ in general does not admit a ring structure.
</p>

<p>
We would need $X$ to be a coalgebra
</p>
