<span id="ID-bce9eeb9-3622-428d-a3ee-3d634ed5a8ee"></span><h1 class="title">algebraic line bundle over a commutative ring</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $M$ a <a href="20230531104455-endlich_erzeugter_modul.html#ID-b8bbecb1-a067-40a2-a8c8-3c4119252b18">finitely generated</a> <a href="20230727-projective_module.html#ID-d7827fce-3372-4b89-bd57-fafc2c16e937">projective module</a>
Then $M$ is said to be an algebraic line bundle, if it has <a href="20241114-rank_map_of_a_finitely_projective_map.html#ID-2fbe3e4d-5a29-43bd-b3f9-c2ec743d677f">rank map of a finitely generated projective module</a>
</p>
