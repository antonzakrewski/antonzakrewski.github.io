<span id="ID-f7cd2792-3619-4978-8e08-8d51cadd0729"></span><h1 class="title">restriction of an open map to an open subset as open map</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topological spaces</a> and $f: X \rightarrow Y$ an <a href="20230227190111-offene_abbildung_topologie.html#ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52">open map</a>.
Then for $O \subseteq X$ <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a>, the <a href="20221026162005-einschrankung_abbildung.html#ID-c9f04287-e549-4811-8538-f4a3c521866f">restriction</a>
</p>

<div class="math-block">\begin{align*}
f_{\vert O}: O \rightarrow Y
\end{align*}</div>
<p>
is also an <a href="20230227190111-offene_abbildung_topologie.html#ID-b42a4b40-0d77-444c-8385-4bfbb0e44c52">open map</a>
</p>
