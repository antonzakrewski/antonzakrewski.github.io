<span id="ID-d0b69356-e463-4833-ac14-42bdfa4f4265"></span><h1 class="title">injective map into the function field of an integral scheme</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X$ be an <a href="20230909-integral_scheme.html#ID-2b43eb0f-73f9-45de-9b15-3b2a4817a52b">integral scheme</a> with generic point $\eta$.
Then for every <a href="20220902125304-nichtleere_menge.html#ID-119fa0d9-a2b3-4b46-bb61-a6e590282321">nonempty</a> <a href="20230909-open_subscheme.html#ID-d5d26a4c-5f81-4c3f-9588-11fa4e53330f">open subscheme</a> $U \subseteq X$, the map $\mathcal{O}(U) \rightarrow \kappa(\eta)$ is <a href="20211230211328-injektivitat.html#ID-717f77ad-8b6e-47b2-a15d-f47a0b5a1237">injective</a>.
</p>
