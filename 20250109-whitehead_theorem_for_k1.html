<span id="ID-88c07e4e-dc37-4972-9052-aeca2d3deaa0"></span><h1 class="title">whitehead theorem for k1 of a ring</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $R$ be a <a href="20220920130524-ring_algebra.html#ID-ac7d56fc-0f56-4037-9010-38c358f79490">ring</a>.
Then $K_1(R) = \mathrm{Gl}(R)/\mathrm{E}(R)$
</p>

<p>
see:
</p>
<ol>
<li><a href="20241017-k1_of_a_ring.html#ID-85079b35-3708-4579-8d9f-1651ff26a697">K1 of a ring</a> </li>

<li>$\mathrm{Gl}(R)$ is the <a href="20241017-infinite_general_linear_group.html#ID-d5401330-5b10-4494-9b18-776992b4bd8a">infinite general linear group</a> </li>

<li>$\mathrm{E}(r)$ is the <a href="infinite-elementary-linear-group.html#ID-f8f55825-967f-40d4-895f-5f084e8326a8">infinite elementary linear group</a> </li>
</ol>
