<span id="ID-6eda1b58-3553-459b-82c8-d3f2eb71baf5"></span><h1 class="title">localizing closure of a stable category</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20241017-stable_infinity_category.html#ID-baac6abf-7cfd-4eb9-9764-dfc1933edba4">stable category</a> and $\mathcal{D} \subseteq \mathcal{C}$ a (<a href="20241023-stable_subcategory.html#ID-bfd1a6f2-74c1-4474-a8d1-786c0b4ac46a">stable</a>) <a href="20240711-sub_infinity_category.html#ID-79df3d53-7239-474c-bfa4-a3fdbcf588d6">subcategory</a>.
Then the localizing closure $\mathrm{Loc}(\mathcal{D})$ is defined as smallest, <a href="20260311-localizing_subcategory_of_a_stable_category.html#ID-56c4e838-4529-498d-9d32-9f205e69ddf1">localizing subcategory</a>  containing $\mathcal{D}$
</p>
