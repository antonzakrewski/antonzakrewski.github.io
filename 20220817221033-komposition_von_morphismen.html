<span id="ID-72b71b59-7fac-4516-9115-9d589b47e0c3"></span><h1 class="title">composition of morphisms</h1>

<h2 id="definition">Definition</h2>
<p>
Let $\mathcal{C}$ be a <a href="20220816130308-kategorie_mathe.html#ID-3d36aefb-cedf-48b8-8031-adac2a4f2d3d">category</a> and $f: A \rightarrow B$, $g: B \rightarrow C$ <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphisms</a> for <a href="20220818170642-objekt_kategorie.html#ID-69e99ef2-fd8e-4268-a03a-b4a4f2c3cd74">objects</a> $A,B,C \in \mathrm{Ob}(\mathcal{C})$.
</p>

<p>
Then there exists a <a href="20220817164827-morphismus.html#ID-7e72e390-edd9-4dec-a7cc-f04d2c37dcbc">morphism</a> $g \circ f: A \rightarrow C$, called the composition of $g$ with $f$.
</p>
