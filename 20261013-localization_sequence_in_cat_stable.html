<span id="ID-0c7baac2-01dc-4c55-aff0-cc0c7e1d648b"></span><h1 class="title">localization sequence in Cat stable</h1>

<h2 id="definition">Definition</h2>
<p>
A localization sequence in <a href="20250204-category_cat_stable.html#ID-b528357e-93c4-47ad-bfe5-4b5493d84b8d">cat stable</a>  is a <a href="20241022-fiber_of_an_infinity_morphism.html#ID-315c0bce-7cf8-468b-9149-1e254debcf95">fiber</a> sequence $\mathcal{A} \hookrightarrow \mathcal{B} \rightarrow \mathcal{C}$ such that $\mathcal{C}^{\sharp}$ is <a href="20241206-equivalent_objects_in_an_infinity_category.html#ID-cbb1ac2c-2755-4d4a-9a75-56978060b40f">equivalent</a> to $\mathcal{B}/\mathcal{A}^{\sharp}$
</p>
