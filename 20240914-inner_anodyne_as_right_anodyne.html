<span id="ID-bd44e76b-b4ca-44fd-a701-1b7200ecc61f"></span><h1 class="title">inner anodyne as right anodyne</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20240128-simplicial_set.html#ID-43a75466-c729-429a-a459-56f226b81262">simplicial sets</a> and $f: X \rightarrow Y$ an <a href="20240327-anodyne_map.html#ID-c73a8608-7cfc-48d8-81dd-e63f43f453bd">inner anodyne map</a>
Then $f$ is also <a href="20240327-right_anodyne_map.html#ID-eb1ada66-cba3-4202-9ad9-dda3033b88b7">right anodyne</a>
</p>
