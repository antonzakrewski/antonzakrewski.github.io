<span id="ID-31c88ba2-9577-4b73-b19a-364e0e7b01c9"></span><h1 class="title">primary ideal</h1>

<h2 id="definition">Definition</h2>
<p>
Let $A$ be a <a href="20221210204906-kommutativer_ring.html#ID-b92b4078-28f6-4371-87ba-aa9b950ff823">commutative ring</a>, $\mathfrak{p}$ a <a href="20230427200359-echtes_ideal.html#ID-fa54a328-b081-4a6c-9106-4348783138df">strict ideal</a>.
Then $\mathfrak{p}$ is said to be primary, if for each $x^n \cdot y \in A$ it follows either
</p>
<ol>
<li>$x^n \in A$</li>
</ol>
<p>
or
</p>
<ol>
<li>$y \in A$</li>
</ol>
