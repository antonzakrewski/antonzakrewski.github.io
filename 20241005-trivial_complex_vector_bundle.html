<span id="ID-b76fa462-95ce-432e-8749-1f4c6ab00b3d"></span><h1 class="title">trivial complex vector bundle</h1>

<h2 id="definition">Definition</h2>
<p>
Sei $X$ ein <a href="20220930231339-topologischer_raum.html#ID-86282c25-e748-45cd-bb85-553fdd7415f4">topologischer Raum</a>, dann ist das triviale komplexe Vektorbündel vom Rang $k$ definiert als
</p>

<div class="math-block">\begin{align*}
E \cong X \times \mathbb{C}^k
\end{align*}</div>
<p>
mit der Trivialisierung
</p>

<div class="math-block">\begin{align*}
\mathcal{S} = \{(X, \mathrm{id}_{X})\}
\end{align*}</div>
