<span id="ID-e19de2e1-a3a7-40dd-b5bd-82f3d331fbf9"></span><h1 class="title">ring of global sections of algebraic functors</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $X,Y$ be <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a> over $S$
Then $\mathcal{O}_{S}(X \times Y) \simeq \mathcal{O}(X) \otimes_{\mathcal{O}(S)} \mathcal{O}(Y)$.
</p>
