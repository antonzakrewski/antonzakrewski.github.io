<span id="ID-39e1a59b-3c30-4ec0-9e7a-89038f25b1e9"></span><h1 class="title">composition of morphisms of locally finite presentation</h1>

<h2 id="proposition">Proposition</h2>
<p>
Let $Z \xrightarrow{g} Y \xrightarrow{f} X$ be <a href="20260714-map_of_locally_finite_presentation.html#ID-f0ae4d12-6455-4ae1-9813-9dc1db89a0d4">morphisms of locally finite presentation</a> of <a href="20260611-algebraic_functor.html#ID-316f0157-24c4-446a-b8a5-d7eb82359ddd">algebraic functors</a>, which are <a href="20260714-map_of_locally_finite_presentation.html#ID-f0ae4d12-6455-4ae1-9813-9dc1db89a0d4">morphisms of locally finite presentation</a>.
Then so is $f \circ g$.
</p>
