<div class="math-block">\begin{align*}
\mathrm{d}f =&amp; \text{grad} f(\vec{x_0}) \cdot (\vec{x} - \vec{x_0}) \\
=&amp; \sum_{i=1}^n \frac{\partial f}{\partial x_i} \mathrm{d}x_i
\end{align*}</div>
