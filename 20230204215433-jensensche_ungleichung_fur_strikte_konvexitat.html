<span id="ID-6c1b258e-3e66-4812-a0b0-615ea53c276d"></span><h1 class="title">Jensensche Ungleichung für strikte Konvexität</h1>

<h2 id="satz">Satz</h2>
<p>
Für eine <a href="20230204212217-strikt_konvexe_funktion.html#ID-753ec2af-263a-4ed3-9294-c37d32812fe8">strikt konvexe Funktion</a> gilt für die <a href="20230204212252-jensensche_ungleichung.html#ID-a261abb3-ed9f-4938-8f2e-34cfaa850a1e">Jensensche Ungleichung</a> mit $0 &lt; \lambda_i &lt; 1$
</p>

<div class="math-block">\begin{align*}
f \left(\sum_{i=1}^{n} \lambda_i x_i\right) = \sum_{i=1}^{n} \lambda_i f(x_i)
\end{align*}</div>
<p>
<a href="20221208111336-g_d_w.html#ID-a1245369-4879-458c-aec3-e2905bfa6306">g.d.w.</a> $x_1 = ... x_n$
</p>
