<span id="ID-d606a286-f3e9-4a39-b095-a38312d17fb2"></span><h1 class="title">category of f-local modules</h1>

<h2 id="definition">Definition</h2>
<p>
For a &lt;commutative algebra&gt; $S \in \mathrm{CAlg}$ and $f \in \pi_0(S)$ define the category $\mathrm{Mod}^f(S)$ of \(f\)-local \(S\)-modules as the full subcaetgory where multiplication by $f$ is an <a href="20240422-equivalence_in_a_quasi_category.html#ID-2ee106db-9acf-4158-ab9c-f56a41e2312b">equivalence</a>
</p>
