<span id="ID-ae2aa595-06ef-402d-b637-ed539bd08ef9"></span><h1 class="title">local diffeomorphism</h1>

<h2 id="definition">Definition</h2>
<p>
Let $M,N$ be <a href="20230302132423-glatte_mannigfaltigkeit.html#ID-0606629a-5a69-4933-ad86-4d3a60637621">smooth manifolds</a> and $f: M \rightarrow N$ a <a href="20231019-smoot_map_between_manifolds.html#ID-e1c05631-4029-4813-8af5-21144af74ddc">smooth map</a>
Then $f$ is said to be a local diffeomorphism if for each point $m \in M$ there exists an <a href="20221002145641-offene_menge_in_einem_topologischen_raum.html#ID-7828c2e9-b794-4807-acdf-4663517c6c16">open</a> $U$ usch that
</p>

<div class="math-block">\begin{align*}
f_{\vert U}: U \rightarrow f[U]
\end{align*}</div>
<p>
is a <a href="20250625-smooth_diffeomorphism.html#ID-e1ef57fa-a0d5-4479-9710-16789a9317f0">smooth diffeomorphism</a>
</p>
